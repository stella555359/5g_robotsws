global:
  nodeSelector: { "config.nokia.com/application": "vDU" }
  upInstanceNodeSelector: { "config.nokia.com/application": "vDU" }
  image:
    registry: "ccr-wl-vrf-vdu-01.wroclaw.nsn-rdnet.net:443/vdu"
  devicePoolList:
    fastPathCommonPool: openshift.io/sriov_vfio_1
    slowPathCommonPool: openshift.io/sriov_netdevice_1
    fastPathRANNICPool: nokia.com/sriov_rinline_up
    slowPathRANNICPool: nokia.com/sriov_rinline_cp

  externalNetwork:
    f1:
      vlanInfo:
        vid: "760"

    f1c:
      vlanInfo:
        vid: "759"
    fhm:
      vlanInfo:
        vid: "295"
    l2biprt:
      vlanInfo:
        vid: "4051"
    l2biphi:
      vlanInfo:
        vid: "4051"
    oam:
      vlanInfo:
        vid: "761"
    ahm-0:
      fhuc:
      - vlName: "fhucplane01"
        defaultUnderlyingIface: "ecpri4"
        vid: "301"
        pcp: "7"
    tracing:
      vlanInfo:
        vid: "799"

  storageClassName: lvms-vg1
