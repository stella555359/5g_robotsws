schemaVersion: 5.3.3


### The entries in this file are parameters and values.
### The values mentioned for the parameters should be unique, meaning if the same
### parameter is mentioned again with separate value/s then the latest value is
### considered for that parameter.

FHGW:
    ### This parameter defines Fronthaul gateway identifier and is used to uniquely
    ### identify the Fronthaul gateway in the network. The parameter is defined
    ### while installation of the Fronthaul gateway and can never be changed unless
    ### the Fronthaul gateway is again newly installed.
    ### Valid Input Range: 1..68719476735
    ### example - fhgwId: 1234
    fhgwId: 888801

    ### This parameter defines Fronthaul gateway name and is used for uniquely identifying the
    ### Fronthaul Gateway in the network with user friendly name. ### It is not used for any Telecom purposes.
    ### The name had to be 1..80 characters
    ### FHGW name can consist of lower and case letters [A-Z,a-z], digits [0-9] and hyphen (-)
    ### comment: spaces and tabs to be ignored
    ### example - fhgwName: "FHGW-NY"
    fhgwName: "FHGW-8888-1"

    ### This parameter defines the hostname of the FHGW management node
    ### The hostname is NOT USED for connecting with the NE from external network and is not required to be registered
    ### with the external DNS server.
    ### NOTE: DO NOT CHNAGE THIS CONFIGURATION PARAMETER AS THE HOSTNAME IS USED FOR ALL INTERNAL USAGE
    hostname: "controller"

    ### The parameter defines the internet proxy configuration
    ### The parameter is to be used only by Nokia R&D, Nokia Lab
    ### The value can be URL that hosts the proxy details
    ### Example format: http://10.158.100.6:8080
    networkProxy: http://87.254.212.120:8080

    ### This parameter defines the port-config profile of the FHGW as an CPRI<->eCPRI IWF with FDD C-RAN/D-RAN
    ### The supported values are
    ### a) PROFILE-A (default)
    ###      - In this port-config profile, the FHGW supports proxying the CPRI RU as ECPRI LLS RU towards vDU.
    ###      - Should be chosen while commissioning of FDD C-RAN/D-RAN or IWF deployment.
    ###      - If a SFP28 port is used for OAM connectivity, then that port will be configured in Ethernet mode.
    port-config: "PROFILE-A"


### Time related configuration
TIME:
    ### Time zone name  (e.g. Europe/Helsinki or Asia/Shanghai)
    ### List of supported timezones are available in the customer documentation
    fhgwTimezone: Europe/Warsaw

### Enable or Disable capturing of the console logs
TROUBLESHOOT-CONFIG:
### New attribute to capture console logs in the local storage(default : true)
    actCaptureConsoleLogsInLocalStorage: "true"

