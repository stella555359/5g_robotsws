#This .yaml file is used for TC: 'INTER_RAT__DSS_dynamic_spectrum_sharing_activation_feature_bts_reset__RP002167',
#'INTER_RAT__DSS_dynamic_spectrum_sharing_activation_feature_rat_reset__RP002167',
#'INTER_RAT__DSS_dynamic_spectrum_sharing_deactivation_feature_rat_reset__RP002167',
#'INTER_RAT__DSS_dynamic_spectrum_sharing_deactivation_feature_bts_reset__RP002167',
#'INTER_RAT__SSS_static_spectrum_sharing_activation_feature_bts_reset__RP002167',
#'INTER_RAT__SSS_static_spectrum_sharing_activation_feature_rat_reset__RP002167',
#'INTER_RAT__SSS_static_spectrum_sharing_deactivation_feature_rat_reset__RP002167',
#'INTER_RAT__SSS_static_spectrum_sharing_deactivation_feature_bts_reset__RP002167'.
#DSS_MAPPING is mandatory variable for those TCes except for
#'INTER_RAT__DSS_dynamic_spectrum_sharing_deactivation_feature_rat_reset__RP002167'
#and 'INTER_RAT__SSS_static_spectrum_sharing_deactivation_feature_rat_reset__RP002167'.
#It is used to define WCDMA+LTE mapping for DSS (or SSS). This mapping is used
#for verification if DSS (or SSS) is disabled/enabled in all cells, e.g. by checking distance between
#centre frequency of LTE and WCDMA cells paired in this file.
#Mapping is defined in a dictionary which holds LCELW objects with IDs (keys) and LCELL objects with IDs (values).
#Variable 'NEW_EARFCN' is mandatory for activation TCes. Variable 'ORIGNIAL_EARFCN' is mandatory
#for deactivation TCes. They are used for performing recommissioning of parameters 'earfcnDL'
#and 'earfcnUL' in those tests.
#DSS_MAPPING:
#  LCELW-id1: LCELL-id2
#  LCELW-id3: LCELL-id4
#  LCELW-id5: LCELL-id6
#  ...
#NEW_EARFCN:
#  LCELL-id2:
#    earfcnDL: value1
#    earfcnUL: value2
#  LCELL-id4:
#    earfcnDL: value3
#    earfcnUL: value4
#  LCELL-id6:
#    earfcnDL: value5
#    earfcnUL: value6
#  ...
#ORIGINAL_EARFCN:
#  LCELL-id2:
#    earfcnDL: value7
#    earfcnUL: value8
#  LCELL-id4:
#    earfcnDL: value9
#    earfcnUL: value10
#  LCELL-id6:
#    earfcnDL: value11
#    earfcnUL: value12
#  ...
#
#Example:
#DSS_MAPPING:
#  LCELW-1: LCELL-2
#  LCELW-2: LCELL-2
#  LCELW-3: LCELL-3
#  ...
#NEW_EARFCN:
#  LCELL-1:
#    earfcnDL: 100
#    earfcnUL: 18100
#  LCELL-2:
#    earfcnDL: 300
#    earfcnUL: 18300
#  ...
#ORIGINAL_EARFCN:
#  LCELL-1:
#    earfcnDL: 125
#    earfcnUL: 18125
#  LCELL-2:
#    earfcnDL: 275
#    earfcnUL: 18275
#  ...
DSS_MAPPING:
  LCELW-1: LCELL-1
  LCELW-2: LCELL-2
  LCELW-3: LCELL-3
NEW_EARFCN:
  LCELL-1:
    earfcnDL: 450
    earfcnUL: 18450
    chBw: 15 MHz
  LCELL-2:
    earfcnDL: 450
    earfcnUL: 18450
    chBw: 15 MHz
  LCELL-3:
    earfcnDL: 450
    earfcnUL: 18450
    chBw: 15 MHz
ORIGINAL_EARFCN:
  LCELL-1:
    earfcnDL: 425
    earfcnUL: 18425
    chBw: 10 MHz
  LCELL-2:
    earfcnDL: 425
    earfcnUL: 18425
    chBw: 10 MHz
  LCELL-3:
    earfcnDL: 425
    earfcnUL: 18425
    chBw: 10 MHz
