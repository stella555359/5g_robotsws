UE_POOLS:
    AndroidUePool:                                  # Ue Pool class defined by library
        inline_config:
            ANDROID_UE_1:                           # TL UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - NOKIA_G42_5G
                CLASS: AndroidUe                    # UE type is Android so AndroidUe class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'AQ5003H048PC1100626'     # UE serial number (can be obtained via 'adb devices' command on the UE PC) old serial c1d3d4ce
                    configuration:                  # By Default ue key ('ANDROID_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.5.60.92'    # UE PC IP address
                        pyro_port: '9090'           # TCP Port number on UE PC on which Pyro server will be started
                        login: 'wcdmata'            # SSH login to UE PC
                        password: 'Aikon_123456*8'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server/'                # UE PC directory where all server files will be copied
                        server_python: 'C:/Python39/python.exe'
                        data_transfer:
                            server_close_delay: '10'            # OPTIONAL Delay in closing iperf server in case of delay between client ans server hosts
                            app_servers:
                                APP_1:                                      # 1st iperf server alias
                                    host: '10.5.26.73'                     # Application Server IP
                                    user: 'ftp1_user1'                         # Application Server SSH login
                                    password: 'Aikon_123456'                     # Application Server SSH password
                                    iperf_interface_ip: '10.5.26.73'
                            iperf_options:
                                packet: '1200B'
