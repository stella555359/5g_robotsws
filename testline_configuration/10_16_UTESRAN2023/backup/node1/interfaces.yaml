#Logical Config infodmation;
#This must be set only if you are using a logical config and LOGICAL_CONFIG_XXXX parameter from env_config.yaml was set;
my_fac1: &FAC_Binder                         #defines PDU/FAC label
    IP      :   10.42.199.12
    TYPE    :   FAC                              #supported PDU types: APC, SWH, EPC, FAC
    PORT    :   COM3

INTERFACES :                                     #Logical config identification name
        RET_CSG3076327 :                         #Radio module, as defined in device/interfaces.yaml; [possible values: 'ON', 'OFF']
            << :           *FAC_Binder           #refers to the anchor &PDU_1
            OUTLET :        1                    #outletNo from range: 1-8 (APC, SWH), 1-12 (EPC), 1-30 (FAC)
            CONTACTOR :     NORMALLY_OPEN        #supported values: NORMALLY_OPEN; NORMALLY_CLOSED
            STATE:          'ON'

