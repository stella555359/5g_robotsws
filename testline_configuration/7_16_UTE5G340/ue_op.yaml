UE_POOLS:
    AndroidUePool:                                  # Ue Pool class defined by library
        inline_config:
            ANDROID_UE_1:                           # TL UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - UE_1
                CLASS: AndroidUe                    # UE type is Android so AndroidUe class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'c1d3d4ce'     # UE serial number (can be obtained via 'adb devices' command on the UE PC) old serial a9091d0d
                    configuration:                  # By Default ue key ('ANDROID_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.44.72.143'    # UE PC IP address
                        pyro_port: '9090'           # TCP Port number on UE PC on which Pyro server will be started
                        login: 'plwrtrssec'            # SSH login to UE PC
                        password: 'tr55ec123'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server/'                # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'
                        data_transfer:
                            server_close_delay: '120'            # OPTIONAL Delay in closing iperf server in case of delay between client ans server hosts
                            app_servers:
                                APP_1:                                      # 1st iperf server alias
                                    host: '10.42.61.65'                     # Application Server IP
                                    user: '5g'                         # Application Server SSH login
                                    password: '2019H@slo'                     # Application Server SSH password
                                    iperf_interface_ip: '10.42.197.170'
                            iperf_options:
                                packet: '1024B'
            ANDROID_UE_2: # TL UE name
                CAPABILITIES: # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - UE_2
                CLASS: AndroidUe                    # UE type is Android so AndroidUe class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'a9091d0d'     # UE serial number (can be obtained via 'adb devices' command on the UE PC) old serial c1d3d4ce
                    configuration: # By Default ue key ('ANDROID_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.44.72.143'    # UE PC IP address
                        pyro_port: '9090'           # TCP Port number on UE PC on which Pyro server will be started
                        login: 'plwrtrssec'            # SSH login to UE PC
                        password: 'tr55ec123'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server/'                # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'
                        data_transfer:
                            server_close_delay: '120'            # OPTIONAL Delay in closing iperf server in case of delay between client ans server hosts
                            app_servers:
                                APP_1: # 1st iperf server alias
                                    host: '10.42.61.65'                     # Application Server IP
                                    user: '5g'                         # Application Server SSH login
                                    password: '2019H@slo'                     # Application Server SSH password
                                    iperf_interface_ip: '10.42.197.170'
                            iperf_options:
                                packet: '1024B'

