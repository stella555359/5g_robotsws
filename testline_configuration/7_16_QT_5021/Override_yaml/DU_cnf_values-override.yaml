global:
  # 1. Set Fronthaul network connectivity mode to direct-connect
  fhmSiso: "direct-connect"

  # 2. Enable Graceful Cell Shutdown feature
  gracefulCellShutdownEnabled: true

  # 3. Configuration for SR-IOV device pools
  devicePoolList:
    fastPathBipPool: "openshift.io/sriov_vfio_1"
    fastPathF1uPool: "openshift.io/sriov_vfio_1"
    slowPathCommonPool: "openshift.io/sriov_netdevice_1"

  # 4. External network configuration for each network interface
  externalNetwork:
    oam:
      vlanInfo:
        vid: "672"
      ipInfo:
      - rangeStart: "10.44.79.198"
        rangeEnd: "10.44.79.198"
        subnet: "10.44.79.192/28"
        role:
        - "oam"
        - "certman-server"
        - "tracecontroller"
      policyRouteInfo:
      - gateway: "10.44.79.193"
        orderNumber: "5"
        table: "2"
    f1c:
      vlanInfo:
        vid: "667"
      ipInfo:
      - rangeStart: "10.44.147.53"
        rangeEnd: "10.44.147.53"
        subnet: "10.44.147.32/27"
        role:
        - "F1-C"
    f1:
      vlanInfo:
        vid: "667"
      ipInfo:
      - rangeStart: "10.44.147.54"
        rangeEnd: "10.44.147.54"
        subnet: "10.44.147.32/27"
        role:
        - "Tracing"
        - "F1-U"
    l2biprt:
      vlanInfo:
        vid: "292"
    l2biphi:
      vlanInfo:
        vid: "292"

    # 5. Configuration for fhuc/fhm/fhs vlan interfaces on RANNIC for direct-connect mode
    # NOTE: Use ahm-a, ahm-b, etc. sections for this configuration
    ahm-a:
      # NOTE: This must be filled with the serial number of the RANNIC card!
      sn: "L1232810544"
      fhuc:
      - vlName: "fhucplane01"
        defaultUnderlyingIface: "ecpri4"
        vid: "221"
        pcp: "7"
      fhm:
      - vlName: "fhmplane01"
        defaultUnderlyingIface: "ecpri4"
        vid: "295"

  # 6. Configuration for storage, persistent volume and site description
  storageClassName: "lvms-vg1"
  pvcName: "mvpdzr"
  siteDescription: "MRBTS-53063"

  # 7. Configuration for image registry and timezone
  image:
    registry: "image-registry.openshift-image-registry.svc:5000/cran1"
  timezone: "Europe/Warsaw"
