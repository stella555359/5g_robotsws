heat_template_version: 2016-10-14
description: 'v77: Template to instantiate standalone management node instance'
parameters:
  index:
    description: Instance index to use to fetch spesific parameters from params list
    type: number
  availability_zone_list:
    description: availability zone list
    type: comma_delimited_list
    default: []
  az_default:
    description: default availability zone
    type: string

resources:
  az:
    type: OS::Heat::Value
    properties:
      value:
        if:
        - equals:
          - {get_param: [availability_zone_list, {get_param: index}]}
          - ''
        - {get_param: az_default}
        - {get_param: [availability_zone_list, {get_param: index}]}

outputs:
  az:
    value: {get_attr: [az, value]}