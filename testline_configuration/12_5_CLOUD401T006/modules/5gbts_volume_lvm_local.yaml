heat_template_version: 2016-10-14
description: '2.43.0: Template for assembling metadata map of LVM local volume usage'
parameters:
  index:
    type: number
    description: index to fetch own parameters
  lvm_volumes:
    type: json
    description: parameters for LVM volumes
outputs:
  provider_map:
    description: the storage provider metadata map
    value:
      map_merge:
        repeat:
          for_each:
            <%name%>:
            - get_param:
              - lvm_volumes
              - {get_param: index}
              - name
          template:
            storage.local.<%name%>:
              size:
                get_param:
                - lvm_volumes
                - {get_param: index}
                - size
              fstype: ext4
              mount-to:
                get_param:
                - lvm_volumes
                - {get_param: index}
                - mount
              volume:
                get_param:
                - lvm_volumes
                - {get_param: index}
                - volume
