heat_template_version: 2016-10-14
description: 'v77: Template to instantiate a storage cluster with three storage node instances'
parameters:
  common_metadata:
    type: json
    description: common metadata parameters
  common_userdata:
    type: json
    description: common cloud-init userdata parameters
  config_drive:
    type: boolean
    description: use config drive instead of metadata server
  gfs_volumes:
    type: json
    description: Volumes to be attached and shared via GlusterFS
    default:
      count: 0
      volumes: []
  instance_params:
    type: json
    description: instance specific parameters
  local_volumes:
    type: json
    description: Local volumes to be attached
    default:
      count: 0
      volumes: []
  name:
    type: string
    description: Name to be used as the host name for the instance
  networks:
    type: json
    description: network parameters
  roles:
    type: comma_delimited_list
    description: Deployment roles associated
    default:
    - common
    - storage
  timezone:
    type: string
    constraints:
      - custom_constraint: timezone

resources:
  server_group:
    type: OS::Nova::ServerGroup
    properties:
      name:
        str_replace:
          template: $name-server-group
          params:
            $name: {get_param: name}
      policies:
        - soft-anti-affinity
      #best_effort: {get_param: best_effort}
  ports_0:
    type: RCP::Network::Pool
    properties:
      count:
        get_param: [networks, count]
      networks:
        get_param: [networks, net_list_0]
  ports_1:
    type: RCP::Network::Pool
    properties:
      count:
        get_param: [networks, count]
      networks:
        get_param: [networks, net_list_0]
  ports_2:
    type: RCP::Network::Pool
    properties:
      count:
        get_param: [networks, count]
      networks:
        get_param: [networks, net_list_0]
  local_vol_0:
    type: RCP::VolumeGroup::Local
    properties:
      volumes:
        get_param: [local_volumes]
  local_vol_attach_0:
    type: OS::Heat::ResourceGroup
    properties:
      count:
        get_param: [local_volumes, count]
      resource_def:
        type: RCP::Volume::Attachment
        properties:
          index: '%index%'
          server: {get_resource: server_0}
          volumes:
            get_attr: [local_vol_0, volume_id]
  local_vol_1:
    type: RCP::VolumeGroup::Local
    properties:
      volumes:
        get_param: [local_volumes]
  local_vol_attach_1:
    type: OS::Heat::ResourceGroup
    properties:
      count:
        get_param: [local_volumes, count]
      resource_def:
        type: RCP::Volume::Attachment
        properties:
          index: '%index%'
          server: {get_resource: server_1}
          volumes:
            get_attr: [local_vol_1, volume_id]
  local_vol_2:
    type: RCP::VolumeGroup::Local
    properties:
      volumes:
        count: 2
        vol_list:
        - {size: 1, name: storageconf, mount: /var/lib/glusterd}
        - {size: 1, name: etcd, mount: /mnt/etcd}
  local_vol_attach_2:
    type: OS::Heat::ResourceGroup
    properties:
      count: 2
      resource_def:
        type: RCP::Volume::Attachment
        properties:
          index: '%index%'
          server: {get_resource: server_2}
          volumes:
            get_attr: [local_vol_2, volume_id]
  shared_vol_0:
    type: RCP::VolumeGroup::GFS
    properties:
      volumes:
        get_param: [gfs_volumes]
      gfs_hosts:
        repeat:
          for_each:
            <index>: ['0', '1']
          template:
            str_replace:
              template: <name>-<index>.local
              params:
                <name>: {get_param: name}
  shared_vol_attach_0:
    type: OS::Heat::ResourceGroup
    properties:
      count:
        get_param: [gfs_volumes, count]
      resource_def:
        type: RCP::Volume::Attachment
        properties:
          index: '%index%'
          server: {get_resource: server_0}
          volumes:
            get_attr: [shared_vol_0, volume_id]
  shared_vol_1:
    type: RCP::VolumeGroup::GFS
    properties:
      volumes:
        get_param: [gfs_volumes]
      gfs_hosts:
        repeat:
          for_each:
            <index>: ['0', '1']
          template:
            str_replace:
              template: <name>-<index>.local
              params:
                <name>: {get_param: name}
  shared_vol_attach_1:
    type: OS::Heat::ResourceGroup
    properties:
      count:
        get_param: [gfs_volumes, count]
      resource_def:
        type: RCP::Volume::Attachment
        properties:
          index: '%index%'
          server: {get_resource: server_1}
          volumes:
            get_attr: [shared_vol_1, volume_id]
  cloud_config_0:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        hostname:
          str_replace:
            template: <name>-0
            params:
              <name>: {get_param: name}
        timezone: {get_param: timezone}
  cloud_init_0:
    type: OS::Heat::MultipartMime
    properties:
      parts:
      - config: {get_param: [common_userdata, add_user]}
        subtype: cloud-config
      - config: {get_param: [common_userdata, run_cmd]}
        subtype: cloud-config
      - config: {get_resource: cloud_config_0}
        subtype: cloud-config
  cloud_config_1:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        hostname:
          str_replace:
            template: <name>-1
            params:
              <name>: {get_param: name}
        timezone: {get_param: timezone}
  cloud_init_1:
    type: OS::Heat::MultipartMime
    properties:
      parts:
      - config: {get_param: [common_userdata, add_user]}
        subtype: cloud-config
      - config: {get_param: [common_userdata, run_cmd]}
        subtype: cloud-config
      - config: {get_resource: cloud_config_1}
        subtype: cloud-config
  cloud_config_2:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        hostname:
          str_replace:
            template: <name>-2
            params:
              <name>: {get_param: name}
        timezone: {get_param: timezone}
  cloud_init_2:
    type: OS::Heat::MultipartMime
    properties:
      parts:
      - config: {get_param: [common_userdata, add_user]}
        subtype: cloud-config
      - config: {get_param: [common_userdata, run_cmd]}
        subtype: cloud-config
      - config: {get_resource: cloud_config_2}
        subtype: cloud-config
  server_0:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: <name>-0
          params:
            <name>: {get_param: name}
      image:
        get_param: [instance_params, server_0, imageId]
      flavor:
        get_param: [instance_params, server_0, flavorId]
      availability_zone:
        get_param: [instance_params, server_0, azId]
      scheduler_hints:
        group:
          get_resource: server_group
      networks:
        get_attr: [ports_0, ports]
      user_data_format: RAW
      user_data: {get_resource: cloud_init_0}
      metadata:
        map_merge:
        - {get_param: common_metadata}
        - roles: {get_param: roles}
          storage.master: 1
          storage.quorum:
            str_replace:
              template: <name>-2.local
              params:
                <name>: {get_param: name}
        - get_attr: [ports_0, ip-info]
        - get_attr: [local_vol_0, provider_map]
        - get_attr: [shared_vol_0, provider_map]
        - get_attr: [shared_vol_0, user_map]
        - get_attr: [shared_vol_0, peer_map]
      config_drive: {get_param: config_drive}
  server_1:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: <name>-1
          params:
            <name>: {get_param: name}
      image:
        get_param: [instance_params, server_1, imageId]
      flavor:
        get_param: [instance_params, server_1, flavorId]
      availability_zone:
        get_param: [instance_params, server_1, azId]
      scheduler_hints:
        group:
          get_resource: server_group
      networks:
        get_attr: [ports_1, ports]
      user_data_format: RAW
      user_data: {get_resource: cloud_init_1}
      metadata:
        map_merge:
        - {get_param: common_metadata}
        - roles: {get_param: roles}
          storage.master: 0
          storage.quorum:
            str_replace:
              template: <name>-2.local
              params:
                <name>: {get_param: name}
        - get_attr: [ports_1, ip-info]
        - get_attr: [local_vol_1, provider_map]
        - get_attr: [shared_vol_1, provider_map]
        - get_attr: [shared_vol_1, user_map]
        - get_attr: [shared_vol_1, peer_map]
      config_drive: {get_param: config_drive}
  server_2:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: <name>-2
          params:
            <name>: {get_param: name}
      image:
        get_param: [instance_params, server_2, imageId]
      flavor:
        get_param: [instance_params, server_2, flavorId]
      availability_zone:
        get_param: [instance_params, server_2, azId]
      scheduler_hints:
        group:
          get_resource: server_group
      networks:
        get_attr: [ports_2, ports]
      user_data_format: RAW
      user_data: {get_resource: cloud_init_2}
      metadata:
        map_merge:
        - {get_param: common_metadata}
        - roles: {get_param: roles}
          storage.quorum:
            str_replace:
              template: <name>-2.local
              params:
                <name>: {get_param: name}
        - get_attr: [ports_2, ip-info]
        - get_attr: [local_vol_2, provider_map]
        - get_attr: [shared_vol_0, user_map]
      config_drive: {get_param: config_drive}
outputs:
  volume_map:
    description: the storage user metadata map for shared disks
    value:
      get_attr: [shared_vol_0, user_map]
  nodes:
    description: list of storage node names
    value:
      repeat:
        for_each:
          <index>: ['0', '1', '2']
        template:
          str_replace:
            template: <name>-<index>
            params:
              <name>: {get_param: name}
