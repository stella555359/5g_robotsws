heat_template_version: 2016-10-14
description: 'network configuration transformation'

parameters:
  networks:
    type: json
    description: external network resource json

outputs:
  dpdk_type:
    value:
      cpif:
        if:
        - equals:
          - {get_param: [networks, f1c, uuid]}
          - {get_param: [networks, x2c, uuid]}
        - cpif_5g20a
        - cpif_x2_5g20a
      upue:
        if:
        - and:
          - equals:
            - {get_param: [networks, f1u, uuid]}
            - {get_param: [networks, s1u, uuid]}
          - equals:
            - {get_param: [networks, f1u, uuid]}
            - {get_param: [networks, x2u, uuid]}
        - upue_shared_f1s1x2_5g19b
        - if:
          - equals:
            - {get_param: [networks, f1u, uuid]}
            - {get_param: [networks, s1u, uuid]}
          - upue_shared_f1s1_5g19b
          - if:
            - or:
              - equals:
                - {get_param: [networks, f1u, uuid]}
                - {get_param: [networks, x2u, uuid]}
              - equals:
                - {get_param: [networks, s1u, uuid]}
                - {get_param: [networks, x2u, uuid]}
            - upue_5g19b
            - upue_x2_5g19b
  networks:
    value:
      oam:
        uuid: {get_param: [networks, oam, uuid]}
        fixed_ips: {get_param: [networks, oam, fixed_ips]}
        fixed_ips_0: {get_param: [networks, oam, fixed_ips_0]}
        fixed_ips_1: {get_param: [networks, oam, fixed_ips_1]}
        ip-roles: [oam]
      f1c:
        uuid: {get_param: [networks, f1c, uuid]}
        fixed_ips: {get_param: [networks, f1c, fixed_ips]}
        fixed_ips_0: {get_param: [networks, f1c, fixed_ips_0]}
        fixed_ips_1: {get_param: [networks, f1c, fixed_ips_1]}
        fixed_v6_ips: {get_param: [networks, f1c, fixed_v6_ips]}
        fixed_v6_ips_0: {get_param: [networks, f1c, fixed_v6_ips_0]}
        fixed_v6_ips_1: {get_param: [networks, f1c, fixed_v6_ips_1]}
        ip-roles:
          if:
          - equals:
            - {get_param: [networks, f1c, uuid]}
            - {get_param: [networks, x2c, uuid]}
          - [F1-C, X2-C]
          - [F1-C]
      x2c:
        uuid: {get_param: [networks, x2c, uuid]}
        fixed_ips: {get_param: [networks, x2c, fixed_ips]}
        fixed_ips_0: {get_param: [networks, x2c, fixed_ips_0]}
        fixed_ips_1: {get_param: [networks, x2c, fixed_ips_1]}
        fixed_v6_ips: {get_param: [networks, x2c, fixed_v6_ips]}
        fixed_v6_ips_0: {get_param: [networks, x2c, fixed_v6_ips_0]}
        fixed_v6_ips_1: {get_param: [networks, x2c, fixed_v6_ips_1]}
        ip-roles: [X2-C]
      f1u:
        uuid: {get_param: [networks, f1u, uuid]}
        fixed_ips: {get_param: [networks, f1u, fixed_ips]}
        fixed_v6_ips: {get_param: [networks, f1u, fixed_v6_ips]}
        ip-roles:
          if:
          - and:
            - equals:
              - {get_param: [networks, f1u, uuid]}
              - {get_param: [networks, s1u, uuid]}
            - equals:
              - {get_param: [networks, f1u, uuid]}
              - {get_param: [networks, x2u, uuid]}
          - [F1-U, S1-U, X2-U]
          - if:
            - equals:
              - {get_param: [networks, f1u, uuid]}
              - {get_param: [networks, s1u, uuid]}
            - [F1-U, S1-U]
            - if:
              - equals:
                - {get_param: [networks, f1u, uuid]}
                - {get_param: [networks, x2u, uuid]}
              - [F1-U, X2-U]
              - [F1-U]
      s1u:
        uuid: {get_param: [networks, s1u, uuid]}
        fixed_ips: {get_param: [networks, s1u, fixed_ips]}
        fixed_v6_ips: {get_param: [networks, s1u, fixed_v6_ips]}
        ip-roles:
          if:
          - equals:
            - {get_param: [networks, s1u, uuid]}
            - {get_param: [networks, x2u, uuid]}
          - [S1-U, X2-U]
          - [S1-U]
      x2u:
        uuid: {get_param: [networks, x2u, uuid]}
        fixed_ips: {get_param: [networks, x2u, fixed_ips]}
        fixed_v6_ips: {get_param: [networks, x2u, fixed_v6_ips]}
        ip-roles: [X2-U]
      tracing:
        uuid: {get_param: [networks, tracing, uuid]}
        fixed_ips: []
        ip-roles: [Tracing]
