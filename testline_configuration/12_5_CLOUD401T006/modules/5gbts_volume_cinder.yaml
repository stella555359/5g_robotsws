heat_template_version: 2016-10-14
description: '2.43.0: Template for creating a cinder volume'
parameters:
  vol_name:
    type: string
    description: parameters for cinder volumes name
    default:
      name: ''
  vol_size:
    type: number
    description: parameters for cinder volumes size in GB
    constraints:
    - range:
        min: 1
        max: 100
resources:
  volume:
    type: OS::Cinder::Volume
    properties:
      name: {get_param: vol_name}
      size: {get_param: vol_size}
outputs:
  cinder_volume_id:
    description: the resource uuid value of the cinder volume
    value: {get_resource: volume}
  cinder_volume_name:
    description: cinder volume name
    value: {get_param: vol_name}
  cinder_volume_map:
    description: cinder volume metadata map
    value:
      map_merge:
        repeat:
          for_each:
            <%name%>:
            - {get_param: vol_name}
          template:
            storage.volume.<%name%>:
              uuid: {get_resource: volume}
