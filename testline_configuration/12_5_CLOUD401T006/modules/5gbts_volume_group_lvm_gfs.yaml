heat_template_version: 2016-10-14
description: '1.0.0: Template to assemble metadata map for a group of LVM shared GlusterFS volumes'
parameters:
  lvm_gfs_hosts:
    type: comma_delimited_list
    description: LVM GFS server hostname or IP address
  lvm_volumes:
    type: json
    description: parameters for LVM volumes
    default:
      count: 0
      vol_list: []
resources:
  lvm_volume_group:
    type: OS::Heat::ResourceGroup
    properties:
      count:
        get_param: [lvm_volumes, count]
      resource_def:
        type: RCP::Volume::LVMGFS
        properties:
          index: '%index%'
          lvm_gfs_hosts: {get_param: lvm_gfs_hosts}
          lvm_volumes:
            get_param: [lvm_volumes, vol_list]
outputs:
  lvm_volume_count:
    description: number of lvm volumes in group
    value:
      get_param: [lvm_volumes, count]
  peer_map:
    description: the storage peer metadata map
    value:
      map_merge:
        get_attr: [lvm_volume_group, peer_map]
  provider_map:
    description: the storage provider metadata map
    value:
      map_merge:
        get_attr: [lvm_volume_group, provider_map]
  user_map:
    description: the storage user metadata map
    value:
      map_merge:
        get_attr: [lvm_volume_group, user_map]
