                addrpair: [ip_address: {get_attr: [service_ip_addrpair, net_config, internal_srv, cidr]}]
                role: internal
                vif: {get_param: vif_model}
                fixed_ips: []
                fixed_v6_ips: []
              external_list: {get_attr: [upue_net_config, net_config]}
              others:
              - name: tracing
                uuid: {get_param: [external_networks, tracing, uuid]}
                role: external
                ip-roles: [Tracing]
                type: physical
                vif: {get_param: vif_model}
                fixed_ips: []
                fixed_v6_ips: []
      sn:
        count: 1
        net_list_0:
        - name: internal
          uuid: {get_resource: internal_net}
          role: internal
          vif: {get_param: vif_model}
          fixed_ips: []
          fixed_v6_ips: []
      uvm:
        count: 1
        net_list_0:
        - name: internal
          uuid: {get_resource: internal_net}
          addrpair: [ip_address: {get_attr: [service_ip_addrpair, net_config, internal, cidr]}]
          role: internal
          vif: {get_param: vif_model}
          fixed_ips: []
          fixed_v6_ips: []
      db:
        count: 1
        net_list_0:
        - name: internal
          uuid: {get_resource: internal_net}
          addrpair: [ip_address: {get_attr: [service_ip_addrpair, net_config, internal, cidr]}]
          role: internal
          vif: {get_param: vif_model}
          fixed_ips: []
          fixed_v6_ips: []
  service_ip_map:
    description: internal-service-ip-pool metadata parameter
    value:
      internal-service-ip-pool:
        internal:
          cidr:
            get_param: [internal_subnets, internal, 0]
          exclude_range_start:
            get_param: [internal_subnets, internal, 1]
          exclude_range_end:
            get_param: [internal_subnets, internal, 2]
        internal_srv:
          cidr:
            get_param: [internal_subnets, internal_srv, 0]
          exclude_range_start:
            get_param: [internal_subnets, internal_srv, 1]
          exclude_range_end:
            get_param: [internal_subnets, internal_srv, 2]
  service_ip_map_e1:
    description: internal-service-ip-pool metadata parameter include e1
    value:
      internal-service-ip-pool:
        internal:
          cidr:
            get_param: [internal_subnets, internal, 0]
          exclude_range_start:
            get_param: [internal_subnets, internal, 1]
          exclude_range_end:
            get_param: [internal_subnets, internal, 2]
        internal_srv:
          cidr:
            get_param: [internal_subnets, internal_srv, 0]
          exclude_range_start:
