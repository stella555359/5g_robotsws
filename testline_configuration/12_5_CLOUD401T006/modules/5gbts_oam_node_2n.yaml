heat_template_version: 2016-10-14
description: 'v77: Template to instantiate a pair of redundant management node instances'
parameters:
  common_metadata:
    type: json
    description: common metadata parameters
  common_userdata:
    type: json
    description: common cloud-init userdata parameters
  config_drive:
    type: boolean
    description: use config drive instead of metadata server
  dns_forwarders:
    type: comma_delimited_list
    description: list of servers to forward queries to
    default: []
    constraints:
    - length:
        min: 0
        max: 3
  dpdk_type:
    type: string
    description: type information for dpdk boot configuration
    default: oam_5g20a
  instance_params:
    type: json
    description: instance specific parameters
  key_name:
    type: string
    description: key pair to assign to default user
    default: rcpkey
    constraints:
    - custom_constraint: nova.keypair
  cinder_volumes:
    type: json
    description: parameters for cinder volumes
  lvm_local_volumes:
    type: json
    description: Local volumes to be attached
    default:
      count: 0
      volumes: []
  lvm_gfs_hosts:
    type: comma_delimited_list
    description: LVM GFS server hostname or IP address
    default: []
  lvm_gfs_volumes:
    type: json
    description: Volumes to ba attached an shared via glusterFS
    default:
      count: 0
      vol_list: []
  name:
    type: string
    description: Name to be used as the host name for the instance
  networks:
    type: json
    description: network parameters
  ntp_prefer:
    type: string
    description: preferred NTP server to use
    default: ''
  ntp_servers:
    type: comma_delimited_list
    description: list of servers to sync time from
    constraints:
    - length:
        min: 1
        max: 3
  oam_port_index:
    type: string
    description: resource index for OAM port in netwpork pool
    default: resource.0
  roles:
    type: comma_delimited_list
    description: Deployment roles associated
    default:
    - management
    - external-connectivity
    - 5gbts_oam_2n
  service_ip_meta:
    type: json
    description: internal-service-ip-pool metadata parameters
    default: {}
  dual_stack:
    type: string
    description: configure single network or dual network
    default: disabled
    constraints:
      - allowed_values: [disabled, enabled]
  timezone:
    type: string
    constraints:
      - custom_constraint: timezone

resources:
  ports_0:
    type: RCP::Network::Pool
    properties:
      count:
        get_param: [networks, count]
      networks:
        get_param: [networks, net_list_0]
      dual_stack: {get_param: dual_stack}
  ports_1:
    type: RCP::Network::Pool
    properties:
      count:
        get_param: [networks, count]
      networks:
        get_param: [networks, net_list_1]
      dual_stack: {get_param: dual_stack}
  ports_logical:
    type: RCP::Network::Pool
    properties:
      count:
        get_param: [networks, count_logical]
      networks:
        get_param: [networks, net_list_logical]
      dual_stack: {get_param: dual_stack}
      oam_port: {get_param: oam_port_index}
      port_type: "logical"
  lvm_gfs_vol_0:
    type: RCP::VolumeGroup::LVMGFS
    properties:
      lvm_gfs_hosts:
        get_param: [lvm_gfs_hosts]
      lvm_volumes:
        get_param: [lvm_gfs_volumes]
  lvm_local_vol_0:
    type: RCP::VolumeGroup::LVMLocal
    properties:
      lvm_volumes:
        get_param: [lvm_local_volumes]
  shared_vol_0:
    type: RCP::Volume::Cinder
    properties:
      vol_name:
        get_param: [cinder_volumes, vol_list, 0, name]
      vol_size:
        get_param: [cinder_volumes, vol_list, 0, size]
  shared_vol_attach_0:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id:
        get_attr: [shared_vol_0, cinder_volume_id]
      instance_uuid: {get_resource: server_0}
  lvm_gfs_vol_1:
    type: RCP::VolumeGroup::LVMGFS
    properties:
      lvm_gfs_hosts:
        get_param: [lvm_gfs_hosts]
      lvm_volumes:
        get_param: [lvm_gfs_volumes]
  lvm_local_vol_1:
    type: RCP::VolumeGroup::LVMLocal
    properties:
      lvm_volumes:
        get_param: [lvm_local_volumes]
  shared_vol_1:
    type: RCP::Volume::Cinder
    properties:
      vol_name:
        get_param: [cinder_volumes, vol_list, 0, name]
      vol_size:
        get_param: [cinder_volumes, vol_list, 0, size]
  shared_vol_attach_1:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id:
        get_attr: [shared_vol_1, cinder_volume_id]
      instance_uuid: {get_resource: server_1}
  cloud_config_0:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        hostname:
          str_replace:
            template: <name>-000
            params:
              <name>: {get_param: name}
        timezone: {get_param: timezone}
        fetch_public_key:
        - {path: /run/authorized_keys, permissions: '0600'}
  cloud_init_0:
    type: OS::Heat::MultipartMime
    properties:
      parts:
      - config: {get_param: [common_userdata, add_user]}
        subtype: cloud-config
      - config: {get_param: [common_userdata, run_cmd]}
        subtype: cloud-config
      - config: {get_resource: cloud_config_0}
        subtype: cloud-config
  cloud_config_1:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        hostname:
          str_replace:
            template: <name>-001
            params:
              <name>: {get_param: name}
        timezone: {get_param: timezone}
        fetch_public_key:
        - {path: /run/authorized_keys, permissions: '0600'}
  cloud_init_1:
    type: OS::Heat::MultipartMime
    properties:
      parts:
      - config: {get_param: [common_userdata, add_user]}
        subtype: cloud-config
      - config: {get_param: [common_userdata, run_cmd]}
        subtype: cloud-config
      - config: {get_resource: cloud_config_1}
        subtype: cloud-config
  server_0:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: <name>-000
          params:
            <name>: {get_param: name}
      image:
        get_param: [instance_params, server_0, imageId]
      flavor:
        get_param: [instance_params, server_0, flavorId]
      availability_zone:
        get_param: [instance_params, server_0, azId]
      scheduler_hints:
        group: {get_param: [instance_params, server_0, server_group_id]}
      key_name: {get_param: key_name}
      networks:
        get_attr: [ports_0, ports]
      user_data_format: RAW
      user_data: {get_resource: cloud_init_0}
      metadata:
        map_merge:
        - {get_param: common_metadata}
        - password:
            Nemuadmin: $5$rounds=10000$0rN1p3TN$0bzxA4T3uHMqbG0gX45amM18DMgG8ZTBSr/HOQdrLR6
            wsuser: $5$rounds=10000$6Kj3xARF$6D8XNkLOFxc8yswG4hhvCXyCdHau5WY6yxH/ZxRrle8
            serviceuser: $5$rounds=10000$OpZaSSI2$z0XJGwQ10Qs5kaeDqaooM0P2Z/9dYspyBzwIWWbVei4
        - dpdk-conf-type: {get_param: dpdk_type}
          ntp-servers: {get_param: ntp_servers}
          ntp-server-prefer: {get_param: ntp_prefer}
          dns-forwarders: {get_param: dns_forwarders}
          roles: {get_param: roles}
          storage.install: true
          storage.master: 1
        - get_attr: [ports_0, ip-info]
        - get_attr: [ports_0, ext-ip-config]
        - get_attr: [ports_0, ext-ip-config-v6]
        - get_attr: [ports_logical, ext-ip-config]
        - get_attr: [ports_logical, ext-ip-config-v6]
        - oam-ip:
            interface: oam
            type: logical
            roles: [ssh, oam]
            ip-addrs: {get_attr: [ports_logical, oam_ips]}
        - oam-default-gws: {get_attr: [ports_logical, oam_gws]}
        - {get_param: service_ip_meta}
        - get_attr: [shared_vol_0, cinder_volume_map]
        - get_attr: [lvm_local_vol_0, provider_map]
        - get_attr: [lvm_gfs_vol_0, provider_map]
        - get_attr: [lvm_gfs_vol_0, peer_map]
        - get_attr: [lvm_gfs_vol_0, user_map]
        - ha-mode: 2n
        - ccs-ha-mode: 2n
        - md_network: internal_srv
      config_drive: {get_param: config_drive}
  server_1:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: <name>-001
          params:
            <name>: {get_param: name}
      image:
        get_param: [instance_params, server_1, imageId]
      flavor:
        get_param: [instance_params, server_1, flavorId]
      availability_zone:
        get_param: [instance_params, server_1, azId]
      scheduler_hints:
        group: {get_param: [instance_params, server_1, server_group_id]}
      key_name: {get_param: key_name}
      networks:
        get_attr: [ports_1, ports]
      user_data_format: RAW
      user_data: {get_resource: cloud_init_1}
      metadata:
        map_merge:
        - {get_param: common_metadata}
        - password:
            Nemuadmin: $5$rounds=10000$0rN1p3TN$0bzxA4T3uHMqbG0gX45amM18DMgG8ZTBSr/HOQdrLR6
            wsuser: $5$rounds=10000$6Kj3xARF$6D8XNkLOFxc8yswG4hhvCXyCdHau5WY6yxH/ZxRrle8
            serviceuser: $5$rounds=10000$OpZaSSI2$z0XJGwQ10Qs5kaeDqaooM0P2Z/9dYspyBzwIWWbVei4
        - dpdk-conf-type: {get_param: dpdk_type}
          ntp-servers: {get_param: ntp_servers}
          ntp-server-prefer: {get_param: ntp_prefer}
          dns-forwarders: {get_param: dns_forwarders}
          roles: {get_param: roles}
          storage.install: true
          storage.master: 0
        - get_attr: [ports_1, ip-info]
        - get_attr: [ports_1, ext-ip-config]
        - get_attr: [ports_1, ext-ip-config-v6]
        - get_attr: [ports_logical, ext-ip-config]
        - get_attr: [ports_logical, ext-ip-config-v6]
        - oam-ip:
            interface: oam
            type: logical
            roles: [ssh, oam]
            ip-addrs: {get_attr: [ports_logical, oam_ips]}
        - oam-default-gws: {get_attr: [ports_logical, oam_gws]}
        - {get_param: service_ip_meta}
        - get_attr: [shared_vol_1, cinder_volume_map]
        - get_attr: [lvm_local_vol_1, provider_map]
        - get_attr: [lvm_gfs_vol_1, provider_map]
        - get_attr: [lvm_gfs_vol_1, peer_map]
        - get_attr: [lvm_gfs_vol_1, user_map]
        - ha-mode: 2n
        - ccs-ha-mode: 2n
        - md_network: internal_srv
      config_drive: {get_param: config_drive}
outputs:
  management_ip:
    description: Primary management IP address allocated to access the system
    value:
      str_split:
      - /
      - get_attr: [ports_logical, oam_ips, 0]
      - 0
  management_ips:
    description: All management IP addresses allocated to access the system
    value:
      get_attr: [ports_logical, oam_fixed_ips]
  internal_ip:
    description: Internal IP address allocated to the instance
    value:
      get_attr: [ports_0, internal_ip]
  volume_map:
    description: the storage user metadata map for shared disks
    value:
      get_attr: [lvm_gfs_vol_0, user_map]
