heat_template_version: 2016-10-14
description: 'v77: Template for creating a cinder volume to be shared with GlusterFS'
parameters:
  gfs_hosts:
    type: comma_delimited_list
    description: GlusterFS server hostnames or IP addresses, primary and secondary
  index:
    type: number
    description: index to fetch own parameters
  volumes:
    type: json
    description: parameters for volumes
resources:
  cinder_volume:
    type: OS::Cinder::Volume
    properties:
      name:
        get_param:
        - volumes
        - {get_param: index}
        - name
      size:
        get_param:
        - volumes
        - {get_param: index}
        - size
outputs:
  volume_id:
    description: the resource uuid value of the volume
    value: {get_resource: cinder_volume}
  peer_map:
    description: the storage peer metadata map
    value:
      map_merge:
        repeat:
          for_each:
            <%name%>:
            - get_param:
              - volumes
              - {get_param: index}
              - name
          template:
            storage.peers.<%name%>: {get_param: gfs_hosts}
  provider_map:
    description: the storage provider metadata map
    value:
      map_merge:
        repeat:
          for_each:
            <%name%>:
            - get_param:
              - volumes
              - {get_param: index}
              - name
          template:
            storage.provider.glusterfs.<%name%>:
              fstype: ext4
              disk: {get_resource: cinder_volume}
              mount-to:
                str_replace:
                  template: /mnt/bricks/<%name%>
                  params:
                    <%name%>:
                      get_param:
                      - volumes
                      - {get_param: index}
                      - name
  user_map:
    description: the storage user metadata map
    value:
      map_merge:
        repeat:
          for_each:
            <%name%>:
            - get_param:
              - volumes
              - {get_param: index}
              - name
          template:
            storage.user.<%name%>:
              fstype: glusterfs
              options:
                str_replace:
                  template: rw,backupvolfile-server=<%host%>
                  params:
                    <%host%>:
                      get_param: [gfs_hosts, 1]
              mount-to:
                get_param:
                - volumes
                - {get_param: index}
                - mount
              mount-from:
                str_replace:
                  template: <%host%>:/<%name%>
                  params:
                    <%host%>:
                      get_param: [gfs_hosts, 0]
                    <%name%>:
                      get_param:
                      - volumes
                      - {get_param: index}
                      - name
