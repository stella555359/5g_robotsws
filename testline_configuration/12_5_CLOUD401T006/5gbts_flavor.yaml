heat_template_version: 2016-10-14

description: 5GBTS_19B heat template for flavors with server redundancy

parameters:
  vnf_prefix:
    type: string
    default: 5gbts19b
    description: the name prefix for flavors

resources:
  5gbts_oam:
    type: OS::Nova::Flavor
    properties:
      name:
        str_replace:
          template: ${prefix}_oam
          params:
            ${prefix}: {get_param: vnf_prefix}
      vcpus: 3
      ram: 32768
      disk: 40
      extra_specs:
        hw:cpu_model: Haswell
        hw:cpu_policy: dedicated
        hw:cpu_thread_policy: require
        hw:mem_page_size: large
        hw:watchdog_action: reset
      is_public: true
      ephemeral: 0
      rxtx_factor: 1.0
      swap: 0

  5gbts_cpif:
    type: OS::Nova::Flavor
    properties:
      name:
        str_replace:
          template: ${prefix}_cpif
