# testLine commands to execute and files to collect


- name: "GN_OAM"
  cmds:
    - "sudo journalctl -ab > /tmp/journal_oam-0.log"
  files:
    - "/tmp/journal_oam-0.log"
    - "/opt/nokia/SS_MzOam/cloud-siteoam/siteoam/logs/startup_SITEOAM.log"
    - "/opt/nokia/SS_MzOam/cloud-racoam/logs/startup_RACOAM.log"
    - "/opt/nokia/SS_MzOam/cloud-racoam/logs/startup_RCP_IF.log"
    - "/opt/nokia/SS_CPLANE/etc/cp_cl.enb_conf.ini"
    - "/opt/nokia/SS_CPLANE/etc/cp_if.enb_conf.ini"
    - "/opt/nokia/SS_CPLANE/etc/cp_nb.enb_conf.ini"
    - "/opt/nokia/SS_CPLANE/etc/cp_sb.enb_conf.ini"
    - "/opt/nokia/SS_CPLANE/etc/cp_ue.enb_conf.ini"
  clean:
    - "/tmp/journal_oam-0.log"

  child:
    - name: "cpue-0.local"
      cmds:
        - "sudo journalctl -ab > /tmp/journal_cpue-0.log"
      files:
        - "/tmp/journal_cpue-0.log"
      clean:
        - "/tmp/journal_cpue-0.log"

    - name: "upue-0.local"
      cmds:
        - "sudo journalctl -ab > /tmp/journal_upue-0.log"
      files:
        - "/tmp/journal_upue-0.log"
      clean:
        - "/tmp/journal_upue-0.log"

    - name: "cpcl-0.local"
      cmds:
        - "sudo journalctl -ab > /tmp/journal_cpcl-0.log"
      files:
        - "/tmp/journal_cpcl-0.log"
      clean:
        - "/tmp/journal_cpcl-0.log"

    - name: "cpif-0.local"
      cmds:
        - "sudo journalctl -ab > /tmp/journal_cpif-0.log"
      files:
        - "/tmp/journal_cpif-0.log"
      clean:
        - "/tmp/journal_cpif-0.log"

- name: "GN_ASIx"
  cmds:
    - "sudo journalctl -ab > /tmp/journal_ASIK.log"
    - "export PYTHONPATH=/opt/hwmt/python; python /opt/hwmt/python/hwapi/AdetS.py -s"
  files:
    - "/tmp/journal_ASIK.log"
    - "/tmp/startup_DEFAULT.log"
    - "/tmp/startup_DEFAULT.log.xz"
    - "/tmp/startup_NODEOAM.log"
    - "/tmp/startup_OAMAGENT.log"
    - "/ffs/run/swconfig.txt"
    - "/ffs/run/config/fct/swconfig_local.txt"
    - "/ffs/run/cprt_config.xml"
    - "/dev/ddal/fpga/board_id_00/fpga_version"
  clean:
    - "/tmp/journal_ASIK.log"

  child:
    - name: "L2PS"
      cmds:
        - "journalctl -u ccs-rt > /tmp/journal_L2PS.log"
      files:
        - "/tmp/journal_L2PS.log"
      clean:
        - "/tmp/journal_L2PS.log"

    - name: "ABIL"
      cmds:
        - "journalctl -ab > /tmp/journal_ABIL.log"
      files:
        - "/tmp/journal_ABIL.log"
      clean:
        - "/tmp/journal_ABIL.log"

    - name: "fpga"
      cmds:
      files:
        - "/dev/ddal/fpga/board_id_00/fpga_version"
