AppServer1: &APP_SERVER_1                              # application server definition
   address: '10.56.5.202'
   user: 'spark'
   password: 'spark'

AppServer2: &APP_SERVER_2                              # application server definition
   address: '10.56.5.203'
   user: 'spark'
   password: 'spark'

UE_POOLS:
    TafUeAtPool:                         # Ue Pool class defined by library (AtCmdUePool is no longer supported !!!)
        inline_config:
            UE1:                        # UE name
                CAPABILITIES:            # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - AT_CMD_UE1
                CLASS: AtCmdUe
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtCmdUe constructor when Ue instance is created.
                    com_port: '151'        # MANDATORY, number of com port supporting AT commands
                    serial_number: '31610c3a'
                    configuration:
                        ue_pc_address: '10.56.5.202'                      # UE PC domain address or IP
                        ue_pc_port: 8080                                      # OPTIONAL, default is 80
                        data_transfer:                                        # data transfer protocols
                            iperf:
                                app_server: *APP_SERVER_1
                                interval: 1
                                interface_name: 'Cellular 8'                  # OPTIONAL, need to be define if data transfer is run from the UE PC where is more than one device which uses AT commands
                                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                            ping:
                                app_server: *APP_SERVER_1
                                interval: 1
                            ftp:
                                app_server: *APP_SERVER_1
                        #   ========= At specific: =========
                        ue_pc_login: 'spark'                               # MANDATORY
                        ue_pc_password: 'spark'                                # MANDATORY
                        ue_pc_expected_prompt: '10.56.5.202'              # OPTIONAL, but if you want to run data transfer from UE PC interface is mandatory
            UE2:                        # UE name
                CAPABILITIES:            # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - AT
                CLASS: AtCmdUe
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtCmdUe constructor when Ue instance is created.
                    com_port: '9'        # MANDATORY, number of com port supporting AT commands
                    serial_number: '4b24b9f8'
                    configuration:
                        ue_pc_address: '10.56.5.203'                      # UE PC domain address or IP
                        ue_pc_port: 8080                                      # OPTIONAL, default is 80
                        data_transfer:                                        # data transfer protocols
                            iperf:
                                app_server: *APP_SERVER_2
                                interval: 1
                                interface_name: 'Cellular 8'                  # OPTIONAL, need to be define if data transfer is run from the UE PC where is more than one device which uses AT commands
                                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                            ping:
                                app_server: *APP_SERVER_2
                                interval: 1
                            ftp:
                                app_server: *APP_SERVER_2
                        #   ========= At specific: =========
                        ue_pc_login: 'spark'                               # MANDATORY
                        ue_pc_password: 'spark'                                # MANDATORY
                        ue_pc_expected_prompt: '10.56.5.203'              # OPTIONAL, but if you want to run data transfer from UE PC interface is mandatory