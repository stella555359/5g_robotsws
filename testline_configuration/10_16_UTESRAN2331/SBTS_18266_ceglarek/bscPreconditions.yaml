# This YAML file is used by TC 'DEV__BSC_Preparation.robot'.
# BSC_PRECONDITIONS_DICTIONARY is mandatory variable for this TC.
# It is used for checking and setting parameters on BSC. Variable
# 'BSC_PRECONDITIONS_DICTIONARY' is a dictionary with IDs of each sector
# as keys and dictionary as value. This dictionary contains parameter
# names (keys) and expected values (values) with exception of GTRX which
# requires a dictionary for each TRX, so value for this parameter is dictionary
# with TRX ID as keys and expected values as values.
# Parameters that need to be added for each sector: DSSLSF, DSSUSF, DSSMIN, DSSMAX,
# DSSCF, GENA, HOP, MAL, GTRX. All those parameters need to have expected value
# for all sectors and GTRX needs to be defined for each of the TRXes.
#BSC_PRECONDITIONS_DICTIONARY:
#    sector_id_1:
#        DSSLSF: 'value_1'           #Possible values: integear; requires ''
#        DSSUSF: 'value_2'           #Possible values: integear; requires ''
#        DSSMIN: 'value_3'           #Possible values: integear; requires ''
#        DSSMAX: 'value_4'           #Possible values: integear; requires ''
#        DSSCF: 'value_5'            #Possible values: integear; requires ''
#        GENA: value_6               #Possible values: Y or N
#        HOP: value_7                #Possible values: Y or N
#        MAL: value_8                #Possible values: integear value or '-'
#        GTRX:
#          1: value_9                #Possible values: Y or N
#          2: value_10               #Possible values: Y or N
#          3: value_11               #Possible values: Y or N
#    sector_id_2:
#        DSSLSF: 'value_12'
#        ...
#    ...
#Example:
#BSC_PRECONDITIONS_DICTIONARY:
#    247:
#        DSSLSF: '3'
#        DSSUSF: '3'
#        DSSMIN: '61'
#        DSSMAX: '79'
#        DSSCF: '70'
#        GENA: Y
#        HOP: N
#        MAL: '-'
#        GTRX:
#          1: Y
#          2: Y
#          3: Y 
#    248:
#        DSSLSF: '2'
#        DSSUSF: '1'
#        DSSMIN: '65'
#        DSSMAX: '84'
#        DSSCF: '75'
#        GENA: N
#        HOP: RF
#        MAL: 3457
#        GTRX:
#          4: Y
#          5: N
#          6: Y

BSC_PRECONDITIONS_DICTIONARY:
    247:
        DSSLSF: '3'
        DSSUSF: '3'
        DSSMIN: '61'
        DSSMAX: '79'
        DSSCF: '70'
        GENA: Y
        HOP: N
        MAL: '-'
        GTRX:
          1: Y
          2: Y
          3: Y
    248:
        DSSLSF: '3'
        DSSUSF: '3'
        DSSMIN: '61'
        DSSMAX: '79'
        DSSCF: '70'
        GENA: Y
        HOP: N
        MAL: '-'
        GTRX:
          4: Y
          5: Y
          6: Y
    249:
        DSSLSF: '3'
        DSSUSF: '3'
        DSSMIN: '61'
        DSSMAX: '79'
        DSSCF: '70'
        GENA: Y
        HOP: N
        MAL: '-'
        GTRX:
          7: Y
          8: Y
          9: Y
