#This .yaml file is used for TC: '3G_RRM__DSS_Enabling_in_SBTS_AllCellsOnAir__RP002014'
#DSS_MAPPING is mandatory variable for tis TC. It is used to define GSM+WCDMA mapping for DSS.
#This mapping is used for creating correct mapping during delta recommissioning in test.
#Mapping is defined in a dictionary which holds LCELW objects with IDs (keys) and LCELC objects with IDs (values).
#DSS_MAPPING:
#  LCELW-id1: LCELC-id2
#  LCELW-id3: LCELC-id4
#  LCELW-id5: LCELC-id6
#  ...
#
#Example:
#DSS_MAPPING:
#  LCELW-1: LCELC-2
#  LCELW-2: LCELC-2
#  LCELW-3: LCELC-3
#  ...
DSS_MAPPING:
  LCELW-1: LCELC-1
  LCELW-3: LCELC-3
