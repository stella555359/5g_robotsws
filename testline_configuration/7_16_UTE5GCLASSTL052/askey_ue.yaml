                        com_port: '15'                              # COM ID obtained from device
                        ue_pc_ip: '10.42.22.7'                      # UE PC IP address
                        login: 'wro5gcloud'                          # SSH login to UE PC
                        password: 'Secret2.022!'                         # SSH password to UE PC
                        prompt: 'wro5gcloud@10.42.22.7'          # Expected prompt in UE PC
                        allowed_newline_after_prompt: False
