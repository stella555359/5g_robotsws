APP_SERVER: &APP_1
    address: '10.42.197.170'
    user: '5g'
    password: '2019H@slo'
    bind_interface_ip: '10.42.197.170'

UE_POOLS:
    TafUeAndroidPool:
        inline_config:
            SAMSUNG_S24_1:                                                                        # UE name - change if you want
                CAPABILITIES:                                                                     # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_ANDROID_UE
                    - UE_1
                    - SAMSUNG_1
                CLASS: AndroidUe                                                                  # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                                                           # Parameters that will be passed to AndroidUe constructor when Ue instance is created
                    serial_number: 'RFCX80FWD3V'                                                  # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                                                                # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        ue_pc_address: '10.42.224.64'                                              # UE PC IP address
                        ue_pc_port: '8080'                                                        # HTTP Port number on UE PC on which ue proxy server will be started
                        login: 'wro5grrm'                                                         # SSH login to UE PC
                        password: '5gpass!1'                                                      # SSH password to UE PC
                        data_transfer:                                                            # Application Server (for Iperf) details
                            iperf:
                                app_server: *APP_1
                                binary_path: '/data/data/com.nokia.android.application/'
                                interface_name: 'internet'
                        qualcomm_prototype: 'yes'                                                 # set to 'yes' if this is a Qualcomm prototype
                        network_mode_switch_method: 'keyevents'                                   # available values: adb, xposed. In case of adb - no rooting and xposed installation required
                        airplane_mode_switcher_text: 'Off|On'
