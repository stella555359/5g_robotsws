                                    iperf_interface_ip: '10.11.70.221'
                                                            # Application Server interface used for data transfer
                                                            # (-B iperf parameter)
                                APP_2:
                                    host: '10.14.42.232'    # Application Server IP
                                    user: 'ran5g'           # Application Server SSH login
                                    password: 'nokia2018'   # Application Server SSH password
                                    iperf_interface_ip: '10.11.70.100'
                                                            # Application Server interface used for data transfer
                                                            # (-B iperf parameter)
                            ping:
                                ping_host_ip: '10.11.70.100'# Remote host for ping (Start Data Transfer icmp protocol)
