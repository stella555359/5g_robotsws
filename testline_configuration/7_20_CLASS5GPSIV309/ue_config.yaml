UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_1:
                CAPABILITIES:                               # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_ANDROID_UE
                STARTING_CELL: 0x569508                     # cell ID of 5G cell given by UE Manager
                CLASS: AndroidUe                            # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                     # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'f7a15cf2'               # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                          # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        chipset_NR5G_mode: 'SDX50'          # UE log collection way (SDX50 or SDX55)
                        # serial_com: '4'                   # COM_ID Obtained from qualcomm modem
                        # diag_com: '17'
                        # serial_baudrate: '11520'
                        # os_version: 'windows'
                        ue_pc_ip: '10.0.96.205'             # UE PC IP address
                        pyro_port: '9090'                   # TCP Port number on UE PC on which Pyro server will be started
                        # login: 'cv5g1_6'                  # SSH login to UE PC
                        login: 'cyg_server'
                        # password: 'Er!cZ0rn'              # SSH password to UE PCa
                        password: 'Nokia@2018'
                        server_dir: 'C:/pyro_server'        # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'
                                                            # UE PC python location
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/QCAT.exe'
                                                            #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
