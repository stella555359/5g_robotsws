UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_FOR_TA:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_ANDROID_UE
                STARTING_CELL: 0x6D01                     # Cell ID to which UE should attach

                CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'HZQN1876AAK60100468'             # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                        # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.42.22.199'          # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
#                        service_call_attach: '123'        # service call which will be used for attaching UE
#                        service_call_detach: '124'        # service call which will be used for detaching UE
                        login: 'wro5grrm'                 # SSH login to UE PC
                        password: '5gpass!1'              # SSH password to UE PC
                        server_dir: "/cygdrive/c/pyro_server"     # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/QCAT.exe'    #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        diag_cfg_path: "C:/pyro_server/DIAG.cfg"         # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                        voice_call_dialing_timeout: '30'  # Timeout for dialing (calling) state
                        qualcomm_prototype: 'no'         # set to 'yes' if this is a Qualcomm prototype
                        network_mode_switch_method: 'adb' # available values: adb, xposed. In case of adb - no rooting and xposed installation required
                        data_transfer:                    # Application Server (for Iperf) details
                            ssh:
                                host: '10.42.61.65'      # Application Server IP
                                user: '5g'             # Application Server SSH login
                                password: '2019H@slo'      # Application Server SSH password
                            iperf_interface_ip: "10.42.197.170"         # Application Server interface used for data transfer (-B iperf parameter)
#                            ping:
#                                ping_host_ip: '10.42.129.2' # Remote host for ping (Start Data Transfer icmp protocol)
#                                ping_count: '10'            # ping -c (count) option
#                                allowed_packet_loss: '5'    # Allowed packet loss in %
