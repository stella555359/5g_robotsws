apiVersion: cnf.k8s.nokia.com/v1alpha1
kind: RANCNF
metadata:
  name: aic-vdu
  namespace: cran3lcm
spec:
  cnfConfig:
    cnfSWBuild: vDUCNF00_0.300.34392-amd64
    imageRegistry: ccr-wg-vrf-vdu-01.wroclaw.nsn-rdnet.net:443/vdu
    timeZone: Europe/Warsaw
  ranCnfConfig:
    apiVersion: cnf.k8s.nokia.com/v1alpha1
    kind: RanCnfConfig
    metadata:
      name: rancnfconfig
    spec:
      cniType: sriov
      siteDescription: MRBTS-1234
      cnflayout:
        cnfLayout: DRAN
        halfUpInstanceCount: 0
        l2nrtCount: 1
        upInstanceCount: 1
        deploymenttype:
          l2nrtDeploymentType: NR_L2NRT_10vCPU
          l2rtDeploymentType: NR_L2RT_20vCPU
      storage:
        storageClassName: lvms-vg1
        accessModes: ReadWriteOnce
        pvcName: vdupvc
      network:
        fastPathBipPool: "openshift.io/sriov_vfio_1"
        fastPathF1uPool: "openshift.io/sriov_vfio_1"
        slowPathCommonPool: "openshift.io/sriov_netdevice_1"
        oamif:
          - oamIfId: 1
            owner: oamext
            vlanif:
              vid: 558
              mtu: 9000
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.42.139.169/25
                rangeEnd: 10.42.139.169/25
            iprt:
              - ipRtId: 1
                gateway: 10.42.139.129
        f1cif:
          - f1cIfId: 1
            owner: cprt
            vlanif:
              vid: 566
              mtu: 9000
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.255.24.41/25
                rangeEnd: 10.255.24.41/25
        f1uif:
          - f1uIfId: 1
            owner: l2nrt
            vlanif:
              vid: 565
              mtu: 9000
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.255.23.183/25
                rangeEnd: 10.255.23.183/25
        bipif:
          - bipIfId: 1
            owner: l2rt
            vlanif:
              vid: 565
          - bipIfId: 2
            owner: l2nrt
            vlanif:
              vid: 565
        fronthaul:
          mode: switch-network
          swn:
            dhcp:
              - dhcpId: 1
                pool:
                - poolId: 1
                  rangeStart: 192.168.254.34/26
                  rangeEnd: 192.168.254.40/26
                  ruProtocol: NOKIA
                - poolId: 2
                  rangeStart: 192.168.254.41/26
                  rangeEnd: 192.168.254.47/26
                  ruProtocol: NOKIA
                - poolId: 3
                  rangeStart: 192.168.254.48/26
                  rangeEnd: 192.168.254.54/26
                  ruProtocol: O-RAN
                - poolId: 4
                  rangeStart: 192.168.254.55/26
                  rangeEnd: 192.168.254.60/26
                  ruProtocol: O-RAN
                
            fhmif:
              - fhmIfId: 1
                ipinfo:
                  - ipInfoId: 1
                    rangeStart: 192.168.254.33/26
                    rangeEnd: 192.168.254.33/26
                vlanif:
                  vid: 295
            fhif:
              - fhIfId: 1
                fhucif:
                  - ethif:
                      defaultUnderlyingIface: ecpri4
                    fhucIfId: 1
                    vlanif:
                      vid: 301
                  - ethif:
                      defaultUnderlyingIface: ecpri0
                    fhucIfId: 2
                    vlanif:
                      vid: 301
                owner: ahm-a
                sn: L1243401169
