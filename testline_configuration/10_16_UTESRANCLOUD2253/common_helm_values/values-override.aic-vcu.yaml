# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.
# - values-override.yaml will overwrite the values.yaml file.
# - Operator need to set the following values base on the real scenario.

global:
  #########################################################
  # global configuration shared by parent and sub charts
  #########################################################

  image:
    # - Description: registry of image
    # - Example:
    #    "bcmt-registry:5000/dep" for NCS;
    #    "registry.kube-system.svc.nokia.net:5555/dep" for NCIR;
    #    "image-registry.openshift-image-registry.svc:5000/{{ .Release.Namespace }}" for OCP.
    #    registry: "<<account id>>.dkr.ecr.<<region>>.amazonaws.com" for AWS e.g. "882392854397.dkr.ecr.eu-north-1.amazonaws.com
    registry: "srnclab1019lcm.srnblr.nsn-rdnet.net:8443/ccr"

  # - Description: time zone in format "Region/City", e.g. "Asia/Shanghai". Default as 'GMT'.
  timezone: "Europe/Warsaw"

  # - Description: this flag will be used to enable or disable external network interface.
  # - Support value: "true" or "false"
  # - Default value: "true"
  externalNetworkInterfaceEnabled: "true"

  # - Description: To indicate the SW replacement operation to be performed.
  # - Support value: B/G upgrade,B/G rollback,Rip & Replace.
  # - Default value: Rip & Replace
  swReplacementType: "Rip & Replace"

  # - Description: To indicate SW operation to component
  # - Support value: "true" or "false".
  # - Default value: "false"
  blueGreenRollback: "false"

  # - Description: Blue/Green upgrade will automatically mount the secret named upgrade-secret
  # - Hardcode with naming "upgrade-secret", set the value to env UPGRADE_SECRET_NAME
  # - If changing the name in Secret/upgrade_secret.yaml, then MUST change the value of this parameter also.
  upgradeUserAccountSecretName: "upgrade-secret"


  # - Description: Assigning pods to specific nodes
  # - Support Value: key-value pair.
  # - Note: the value is key-value pairs come from the node label
  #   # - example:
  #   1) nodeSelector: {}
  #   2) nodeSelector: { "labelA": "A" } or
  #      nodeSelector: { labelA: A }
  #   3) nodeSelector: { "labelA": "A", "labelB": "B" }
  #   4) nodeSelector: { "labelWithEmptyValue": "" } or
  #      nodeSelector: { labelWithEmptyValue:  } or
  #      nodeSelector: { labelWithEmptyValue }
  # If sub chart is configured with nodeSelector(e.g. certman-auto-cmp.nodeSelector) and the value of sub chart with
  #   nodeSelector is not empty, sub chart shall prevail.
   # In case of dual-server vCU+vDU , nodeSelector shall use the worker as the node hostname for vCU and MSW as the node hostname for vDU.
  #   #- example:
  #   1)nodeSelector: { "kubernetes.io/hostname": "worker0"}
  #   2)nodeSelector: { kubernetes.io/hostname: worker0}
  nodeSelector: {}

  # - Description: securityContext configuration for vCU runAsUser/runAsGroup/fsGroup.
  securityContext:
    # - Description: Define the runAsUser and runAsGroup for pod, runAsUser/runAsGroup with non zero the container
    #                start with non-root user, if the runAsUser/runAsGroup is zero will start with root user.
    runAsUser: 9999
    runAsGroup: 9999
    # - Description: Define the fsGroup of mounted volumes for pod, containers started with non-root
    #                need to make sure their runAsGroup can access expected volume.
    fsGroup: 9999
  # - Description: the number of CPUE Pods. If cnfLayout is basic, [1, 16] is officially supported; if cnfLayout is redundant, [2, 16] is officially supported.
  # - Note: If cnfLayout is redundant and cpueCount is 1, it will be modified to 2 automatically.
  cpueCount: 1
  # - Description: Indicate the deployment flavor of UPUE Pod. This setting will impact the number of l2hicu container and requested resources of new added trsfp container.
  # - Support value: small, medium and large.
  # - Default value: small
  upueFlavor: "small"
  # - Description: the number of UPUE Pods. If cnfLayout is basic, [1, 44] is officially supported; if cnfLayout is redundant, [2, 44] is officially supported.
  # - Note: If cnfLayout is redundant and upueCount is 1, it will be modified to 2 automatically.
  upueCount: 1

  # - Description: the number of CPE2 Pods.
  # - Support value: 0 or 1
  # - Default value: 0
  cpe2Count: 0

  # - Description: Define the minimum number of these N+ Pods to support the capacity requirement of the operator. Currently during startup, vCU checks if the threshold (MIN_CAPACITY_CPUE/MIN_CAPACITY_UPUE)is met. In case the threshold is not met, the capacity reduction alarm is posted. This functionality is also applied during run-time.
  #   For minCapacityCpue, if cnfLayout is basic, [1, 8] is officially supported; if cnfLayout is redundant, [2, 8] is officially supported.
  #   For minCapacityUpue, if cnfLayout is basic, [1, 44] is officially supported; if cnfLayout is redundant, [2, 44] is officially supported.
  # - Note: If cnfLayout is redundant and minCapacityCpue or minCapacityUpue is 1, it will be modified to 2 automatically.
  # - Feature ID: CB007467-F,CB007890
  # - Default value: 1
  minCapacityCpue: 1
  minCapacityUpue: 1

  # - Description: The layout of the CU.
  # - Support Value: mini, basic and redundant.
  # - Note:
  #     The redundant means CU supports high availability.
  #     The basic means CU deployment with basic mode.
  #     The mini means CU deployment in SNO(Single Node OpenShift) with less resource consumption.
  # - Default value is "basic".
  cnfLayout: "mini"

  # The number of 2N CPIF redundancy instances.
  # If cnfLayout is not redundant, this parameter is must equal to 1.
  # If cnfLayout is redundant, [1, 4] is officially supported.
  # - Note: when the number of 2N CPIF redundancy instances is 1, it's purely same as legacy cpif'.
  cpifInstanceCount: 1

  # The number of 2N CPCL redundancy instances.
  # If cnfLayout is not redundant, this parameter is must equal to 1.
  # If cnfLayout is redundant, [1, 4] is officially supported.
  # - Note: when the number of 2N CPCL redundancy instances is 1, it's purely same as legacy cpcl.
  cpclInstanceCount: 1

  # - Description: The number of ORAN O1 Pod for 5G CNF deployment
  # - Note: During CNF deployment preparation phase, the operator modifies it to 1 to require to deploy the O-RAN O1 pod by O-RAN scene
  # - support value: 0, 1
  # - default value: 0
  # - feature: CB006088-A
  orano1Count: 0

  # - Description: the name of RuntimeClass which is used for high performace.
  # - For Feature CB012156 highPerformanceRuntimeClass should be empty.
  # - Default value: "nokia-performance"
  highPerformanceRuntimeClass: "nokia-performance"

  # - Description: Description of a site used as auto connection site ID.
  # - Note: As it will be used for identifying the vCU, ensure uniqueness for every vCU
  # -       equal to the value of MRBTS/AutoConnSiteID parameter from the CM plan imported to the NMS
  # -       1 to 50 ASCII characters
  siteDescription: "MRBTS-1234"

  # - Description: NMS URL for NE3S registration
  # - Required for AutoIdentification (PnP)
  # - Leave empty to prevent triggering AutoIdentification after CNF deployment
  # - If needed, it's possible to configure more than one NMS URL.  For example, if required for geo-redundancy support.
  # - Example:
  #    - "https://cluster123lbwas.nms.nokia.net/NE3S/1.0"
  #    - ""
  urlNms:
  - ""
  - ""

  # - Description: external IP to access ne3sadapt, used by NMS to connect back (register)  with ne3sadapt
  # - Note: current agentIP should be the same as vCU oam IP by default, due to ne3sadapt run in oam container
  agentIP: ""

  # - Description:
  #   the sriov interface device pool list include fast path and slow path, support link redundancy
  #   if fastPathDevicePoolBackup and slowPathDevicePoolBackup are empty, will not use link redundancy
  #   all the device pool values should same as the values in the aic-vcu-prerequisite/values-override.yaml
  # - Support values:
  #   get values by command "kubectl describe node|grep "Allocatable:" -A 10|grep sriov"
  #   fastPathDevicePool and fastPathDevicePoolBackup which need dpdk bond
  #   fastPathDevicePool and fastPathDevicePoolBackup examples as followed:
  #    - for Intel NIC which support host dpdk bond, should include "vfio" e.g  openshift.io/sriov_vfio_ens9f0
  #    - for Mellanox NIC which not support host dpdk bond, e.g openshift.io/sriov_netdevice_ens34f0
  #    - for Feature CB014440 fastPathDevicepool value should include "sriov_ena_dpdk" e.g intel.com/sriov_ena_dpdk
  #   slowPathDevicePool and slowPathDevicePoolBackup which don't need dpdk bond, examples as followed:
  #     - openshift.io/sriov_netdevice_ens34f0
  #     - for Feature CB014440 SlowPathDevicepool value should incldue "sriov_ena_net" e.g intel.com/sriov_ena_net
  devicePoolList:
    # The SR-IOV Device Pool used by external-u network(fast path)
    fastPathDevicePool: "openshift.io/sriov_vfio_0"
    # The SR-IOV Backup Device Pool used by external-u-s network(fast path),should be different with fastPathDevicePool.
    # For feature CB014440 fastPathDevicePool and fastPathDevicePoolBackup can be same.
    fastPathDevicePoolBackup: ""
    # The SR-IOV Device Pool used by external-c and internale1 networks(slow path)
    slowPathDevicePool: "openshift.io/sriov_netdevice_0"
    # The SR-IOV Device Pool used by external-c-s and internale1-s networks(slow path),should be different with slowPathDevicePool.
    # For feature CB014440 slowPathDevicePool and slowPathDevicePoolBackup can be same.
    slowPathDevicePoolBackup: ""

  # - Description: external network configuration for each network interface
  #   List of parameters for each network interface
  # -------------------------------------------------------------------------------------------------------------
  # | key                    | description                                                                      |
  # -------------------------------------------------------------------------------------------------------------
  # | vlName                 | VLAN interface name for which modification is not recommended
  # |                        | For AWS CaaS vlName is recommended not to configure since Vlan is not supported.
  # -------------------------------------------------------------------------------------------------------------
  # | defaultUnderlyingIface | default underlying Ethernet interface for which modification is not recommended  |
  # |                        | As per Feature CB014440 modification is required for MidHaul Interface          |
  # -------------------------------------------------------------------------------------------------------------
  # | secUnderlyingIface     | secondary underlying Ethernet interface for which modification is not recommended|
  # |                        | As per Feature CB014440 modification is required for MidHaul Interface          |
  # -------------------------------------------------------------------------------------------------------------
  # | vid                    | VLAN ID                                                                          |
  # |                        | MUST be configured if you want to create this interface otherwise leave it empty |
  # |                        | For AWS Caas vid(Guest and host) should be empty as per Feature CB012156 for     |
  # |                        | vCU Region                                                                       |
  # -------------------------------------------------------------------------------------------------------------
  # | rangeStart             | start IP address in the IP range which can be IPv4 or IPv6                       |
  # |                        | IPv4 FORMAT (e.g. "10.0.0.0"), IPv6 FORMAT (e.g. "2001:db8::0")                  |
  # |                        | MUST be configured if you want to create this interface otherwise leave it empty |
  # -------------------------------------------------------------------------------------------------------------
  # | rangeEnd               | end IP address in the IP range which can be IPv4 or IPv6                         |
  # |                        | MUST be configured if you want to create this interface otherwise leave it empty |
  # |                        | IPv4 FORMAT (e.g. "10.0.0.0"), IPv6 FORMAT (e.g. "2001:db8::0")                  |
  # |                        | - for interfaces s1u/x2u/ngu/f1u/xnu                                             |
  # |                        |   if "upueCount" = 1, the "rangeEnd" should be same as "rangeStart"              |
  # |                        |   if "upueCount" > 1, the ip address count of range between "rangeStart"         |
  # |                        |   and "rangeEnd" should equal "upueCount"                                        |
  # |                        | - for interfaces f1c/x2c/xnc/ngc/oam                                             |
  # |                        |   the "rangeEnd" should be same as "rangeStart"                                  |
  # -------------------------------------------------------------------------------------------------------------
  # | subnet                 | the subnet of the network which can be ipv4 or ipv6                              |
  # |                        | MUST be configured if you want to create this interface otherwise leave it empty  |
  # |                        | IPv4 FORMAT (e.g. "10.0.0.0/24"),IPv6 FORMAT(e.g. "2001:db8::0/112")             |
  # -------------------------------------------------------------------------------------------------------------
  # | role                   | IP role for the IP address                                                       |
  # -------------------------------------------------------------------------------------------------------------
  externalNetwork:
    oam:
      vlanInfo:
        vlName: "oamvlan"
        defaultUnderlyingIface: "oam"
        secUnderlyingIface: "oams"
        vid: "764"
        mtu: 1500
      ipInfo:
      - rangeStart: "10.44.249.68"
        rangeEnd: "10.44.249.68"
        subnet: "10.44.249.0/25"
        role:
        - "oam"
        - "certman-server"
        - "tracecontroller"
      # only Blue/Green upgrade function needed.
      physicalIpGroup:
        # defined which group will be using to set up oam physical IP.
        usePhysicalIpGroup: ""
        # Same subnet with oam network.
        subnet: ""
        # HTTPD can obtain the physical IP from the ipmgmt service through the role and listen to ip
        role:
        - "httpd"
        # we don't hardcode use A to N, B to N+1: If groupA or groupB for vCU N, after b/g upgrade, the other group shall be utilize for vCU N+1.
        # 4 physical IPs(IPv4 and IPv6 are supported)should be reserved from oam subnet.
        # for example:
        # groupA:
        #   rangeStart: "10.0.0.3"
        #   rangeEnd: "10.0.0.4"
        # groupB:
        #   rangeStart: "10.0.0.5"
        #   rangeEnd: "10.0.0.6"
        groupA:
          rangeStart: ""
          rangeEnd: ""
        groupB:
          rangeStart: ""
          rangeEnd: ""
      policyRouteInfo:
      - gateway: "10.44.249.1"
        # - Description: the orderNumber of oam route
        # Note: should different from orderNumber in the SCF file to avoid conflict
        orderNumber: "5"
        # - Description: the table id of oam route
        # recommend not to modify
        table: "2"
        # - As per Feature CB014440 seperate IP used for FrontHaul and BackHaul Please update the IP accrodingly for f1c interface and modify defaultUnderlyingIface as mhc.
    f1c:
      vlanInfo:
        vlName: "f1c"
        defaultUnderlyingIface: "extc"
        secUnderlyingIface: "extcs"
        vid: 763
        mtu: 1500
      ipInfo:
      - rangeStart: "10.255.11.81"
        rangeEnd: "10.255.11.81"
        subnet: "10.255.11.0/24"
        role:
        - "F1-C"
        # - As per Feature CB014440 all 3GPP backhual interfaces share same (single) IP address e.g.x2c is shared with x2c,xnc,ngc.
    x2c:
      vlanInfo:
        vlName: "x2c"
        defaultUnderlyingIface: "extc"
        secUnderlyingIface: "extcs"
        vid: ""
        mtu: 1500
      ipInfo:
