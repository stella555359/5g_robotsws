#Iperf part to be filled for TL103

UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_1:
                CAPABILITIES:                          # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_ANDROID_UE
                STARTING_CELL: 0xAC1D                 # cell ID of 5G cell given by UE Manager
                CLASS: AndroidUe                       # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    # serial_number: 'bad7a8fc'          # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    serial_number: 'R3CN30ZG6JN'
                    configuration:                     # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.52.200.88'        # UE PC IP address
                        pyro_port: '9090'              # TCP Port number on UE PC on which Pyro server will be started
                        # login: 'cv5g1_6'               # SSH login to UE PC
                        login: 'cyg_server'
                        # password: 'Er!cZ0rn'           # SSH password to UE PCa
                        password: 'Nokia123!'
                        server_dir: 'C:/pyro_server'   # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'
                                                       # UE PC python location
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/QCAT.exe'
                                                       #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        data_transfer:                 # Application Server (for Iperf) details
                            iperf_path: '/data/local/tmp/'
#                            ssh:
                            app_servers:
                                APP_TLNPV_103: #app server1 TLNPV 103
                                  host: '10.4.130.77'   # Application Server IP
                                  user: 'scpadm'          # Application Server SSH login
                                  password: 'scpadm'  # Application Server SSH password
                                  iperf_interface_ip: '10.4.134.148'

                            ping:
                                ping_host_ip: '10.4.134.148' # Remote host for ping (Start Data Transfer icmp protocol)
                                ping_count: '10'            # ping -c (count) option
                                allowed_packet_loss: '5'
                            iperf_interval: '1'
                            iperf_options:
                                buffer: '20M'
                                qci:
                                    0: 8000
                                    1: 8003           # use qci=1 keyword argument at Start Data Transfer
                                    2: 8002           # use qci=2 keyword argument at Start Data Transfer
                                packet: '1350B'         # -l iperf option
                                parallel_streams: '2'

