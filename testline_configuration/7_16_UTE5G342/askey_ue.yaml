UE_POOLS:
    TafUeAtPool:                         # Ue Pool class defined by library (AtCmdUePool is no longer supported !!!)
        inline_config:
            AT_BASED_UE_1:                        # UE name
                CAPABILITIES:            # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - OPERATOR3
                CLASS: AtCmdUe
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtCmdUe constructor when Ue instance is created.
                    com_port: '59'        # MANDATORY, number of com port supporting AT commands
                    serial_number: '129539da'                               # OPTIONAL, UE serial number used by data transfer (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        ue_pc_address: '10.42.22.85'                      # UE PC domain address or IP
                        ue_pc_port: 80                                        # OPTIONAL, default is 80
                        ue_pc_login: 'plwrtrssec'                               # MANDATORY
                        ue_pc_password: 'tr55ec123'                                # MANDATORY
            AT_BASED_UE_2: # UE name
                CAPABILITIES: # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - OPERATOR5
                CLASS: AtCmdUe
                CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AtCmdUe constructor when Ue instance is created.
                    com_port: '88'        # MANDATORY, number of com port supporting AT commands
                    serial_number: 'f3b53d67'                               # OPTIONAL, UE serial number used by data transfer (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        ue_pc_address: '10.42.22.85'                      # UE PC domain address or IP
                        ue_pc_port: 80                                        # OPTIONAL, default is 80
                        ue_pc_login: 'plwrtrssec'                               # MANDATORY
                        ue_pc_password: 'tr55ec123'                                # MANDATORY
