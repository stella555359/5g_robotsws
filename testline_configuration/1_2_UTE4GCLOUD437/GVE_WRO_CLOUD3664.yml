UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_FOR_TA:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_ANDROID_UE
#                STARTING_CELL: 0x1A9CA01                     # Cell ID to which UE should attach

                CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'ce081718717488a70d'           # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        ue_pc_ip: '10.53.164.237'          # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'inbabtslabuser'                     # SSH login to UE PC
                        password: 'BT5l@bus3rl0g1n'               # SSH password to UE PC
                        # shieldbox_com: '21'             # Popek shieldbox COM number (uncomment only if you use Popek shieldboxes)
                        # usb_port_no: '1'                # USB line on Popek Shieldbox (uncomment only if you use Popek shieldboxes)
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        data_transfer:                    # Iperf endpoint details
                            ssh:
                                host: '10.63.25.107'       # Iperf endpoint IP
                                user: 'ftpuser'              # Iperf endpoint SSH login
                                password: 'ftpuser'      # Iperf endpoint SSH password
ATTENUATORS:
    JFW_168:                                      # attenuator name - change if you want
        TYPE: Jfw                                 # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.jfw.JfwAttenuator
        CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to Attenuator constructor when Attenuator instance is created.
            ip: '10.53.203.66'                    # IP address of attenuator device
            port: 3001                            # TCP Port number of attenuator device
            min_attenuation: 0                    # 0dB
            max_attenuation: 90                   # 95dB

