# - Description: sub chart trsconfig private configuration
trsconfig:
  # - Description: the uid and gid to start trsconfig container
  securityContext:
    uid: *uid
    gid: *gid
  # - Description: node seletor to deploy trsconfig for C-RAN deployment.
  # - Note: the value is key-value nodes' label
