# - Override values for deployment in cloud-development environment
# - Operator need to set the values base on the real scenario.
# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.

#########################################################
# top level configuration private to sub charts
#########################################################

# - Description: sub chart aic-intnet private configuration
aic-intnet:
  # NCIR specific parameters
  # Preconditon: tenant's configuration is ready before deploy internal network
  # internal network
  internal:
    #Description: the master interface of ipvlan, mandatory.
    #Value range: string, no default value.
    #Note: This value need to match with the tenant's configuration. eg."ens1f1"
    hostDevice: "ens1f1"

    #Description: IPv4 allocation pool, mandatory.
    #Value range: string, no default value.
    #Note: eg."192.168.1.0/24"
    cidr: "192.168.1.0/24"

    #Description: IPv4 allocation pool start, optional, must be used together with cidr and allocationPoolEnd.
    #Value range: string, no default value.
    #Note: eg."192.168.1.2"
    allocationPoolStart: "192.168.1.2"

    #Description: IPv4 allocation pool end, optional, must be used together with cidr and allocationPoolStart.
    #Value range: string, no default value.
    #Note: eg."192.168.1.254"
    allocationPoolEnd: "192.168.1.254"

  # NCS and TPI3 specific parameters
  # - Description: Host VLAN network or Guest VLAN network. Support value: HOST and GUEST
  # - Default value: GUEST
  bipVLANMode: "GUEST"
  f1VLANMode: "GUEST"
  f1cVLANMode: "GUEST"
  fhmVLANMode: "GUEST"
  fhucVLANMode: "GUEST"
  oamVLANMode: "GUEST"
  tracingVLANMode: "GUEST"

  # NCS and TPI3 specific parameters
  # - Description: device Pool List
  # - Note: need to be filled accoring to the real environment!!!
  devicePoolList:
    # The SR-IOV Device Pool used by f1/bip networks (fast path)
    fastPathCommonPool: "openshift.io/sriov_vfio_ens1f1"
    # The SR-IOV Device Pool used by oam/tracing/f1c/fhm networks (slow path)
    slowPathCommonPool: "openshift.io/sriov_netdevice_ens1f1"
    # The SR-IOV Device Pool used by fhuc networks (fast path)
    fastPathFhPool: "openshift.io/sriov_vfio_ens1f1"
    # The SR-IOV Device Pool used by fhm networks (slow path)
    slowPathFhPool: "openshift.io/sriov_netdevice_ens1f1"

  # NCS and TPI3 HOST VLAN specific parameters
  # Define the VLAN ID for Host VLAN mode
  VLANID:
    l1bip: "1912"
    l2bip: "1913"
    oam: "1916"
    f1: "1915"
    f1c: "1915"
    fhm: "295"
    fhuc: "301"
    tracing: "1914"

# - Description: sub chart aic-pvc private configuration
aic-pvc:
  # - Description: the name of persistent volume
  # -       consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character
  pvcName: "vdulance"
  # - Description: the accessModes of persistent volume.
  #   NCIR_CaaS Non SNC: ReadOnlyMany
  #   NCIR_CaaS SNC: ReadWriteOnce
  #   NCS multi node: ReadWriteMany
  #   NCS single node: ReadWriteOnce
  #   OCP multi node: ReadWriteMany
  #   OCP single node: ReadWriteOnce
  accessModes: &accessModes "ReadWriteOnce"

  # - Description: the storageclass name of persistent volume. Will use default storageclass in case not filled.
  # - Values:
  # -   NCIR_CaaS Non SNC: ceph-storage-class
  # -   NCIR_CaaS SNC: local-volume
  # -   NCS multi node: csi-cephfs
  # -   NCS single node: dynamic-local-storage
  # -   OCP multi node: ocs-storagecluster-cephfs
  # -   OCP single node: localfs-lvm-sc
  storageClassName: &sc "localfs-lvm-sc"

  certificate-management-pvc:
    certmantlsconfigpvc:
      storageClassName: *sc

  logservice-pvc:
    syslog:
      storageClassName: *sc
    auditlog:
      storageClassName: *sc

  pm-pvc:
    hfrw:
      storageClassName: *sc
    lfrw:
      storageClassName: *sc

  rcpfm-pvc:
    storageClassName: *sc

  rcpum-pvc:
    storageClassName: *sc

  secret-storage-framework-pvc:
    vaultmanagerpvc:
      storageClassName: *sc
    vaultserverpvc:
      storageClassName: *sc

