        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane5"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        type: "physical"
        role:
        - "F1-U_OP_5"
    #  - Description: Network slice for F1-U,here just list one example for one slice
    #    Add one network slice for F1-U according to following instruction.
    #      1. copy the whole section from "f1_slice1" to "- 'F1-U_slice1'" including all the spaces
    #      2. paste the whole section after line "- 'F1-U_slice1'"
    #      3. modify the section key name "f1_slice1", align with the new vlName and role
    #      4. configure vid( vlan id), rangeStart,rangeEnd,subnet
    #  - Feature ID: CB008473
    #  - Note:
    #    vlName should be unique and can be defined by user, please not exceed 15 characters
    #    role should be unique and format like "F1-U_X"
    #    X is the dynamic part which can be customized by operator. The maximum length for X is 24 and the allowed characters can include [A-Za-z0-9]
    f1_slice1:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1u_slice1"
        defaultUnderlyingIface: "f1"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        type: "physical"
        role:
        - "F1-U_slice1"
    # - End example for network slice

    #  - Description: this is only one twamp vlan interface example
    #    Add one vlan interface for the Measurement network as followed steps
    #      1. copy the whole section from "twamp_f1" to "- 'twamp_f1'" including all the spaces
    #      2. paste the whole section after line "- 'twamp_f1'"
    #      3. modify the section key name "twamp_f1", align with the new vlName and role
    #      4. configure vid( vlan id), pcp ,rangeStart,rangeEnd,subnet,family
    #  - Feature ID: CB008468
    #  - Note:
    #    defaultUnderlyingIface and secUnderlyingIface are not recommended to modify
    #    vlName should be unique under twamp section and can be defined by user, please not exceed 15 characters
    #    role should be unique and same in the SCF file
    #    subnet should be same as the Measurement network
    #    if f1 and f1c use the same subnet, only need create one vlan interface here
    twamp_f1:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "twamp_f1"
        defaultUnderlyingIface: "twamp"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        type: "physical"
        role:
        - "twamp_f1"
    # - End example for twamp vlan interface

    l2biprt:
      vlanInfo:
