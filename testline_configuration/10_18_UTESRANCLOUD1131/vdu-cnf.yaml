  # - Description: network attribute definition for each network.
  #   This section is provide to set the MTU for each network
  networkInfo:
    fhm:
      mtu: 1500
    tracing:
      mtu: 1500
    oam:
      mtu: 1500
    f1c:
      mtu: 1500
    bip:
      mtu: 9000
    fhuc:
      mtu: 1500
    f1:
      mtu: 1500

  # - Description: fhm network connectivity mode.
  # - suport value: direct-connect or switch-network.
  #   direct-connect means deploy fhm VLAN on RANNIC, switch-network means deploy fhm VLAN on OAMFH.
  # - Default value: switch-network
  fhmSiso: "switch-network"

  # - Description: the storageclass name of persistent volume. Will use default storageclass in case not filled.
  # -              the storageClass will be used by up and healing controller.
  # - Values:
  # -   OCP multi node: ocs-storagecluster-cephfs
  # -   OCP single node: localfs-lvm-sc
  storageClassName: "lvms-vg1"

  # - Description: convention of name
  name_convention:

    pod_prefix:
    - "ute"
    - "_NAMESPACE_"

    container_prefix:
    - "ctr"
    - "_NAMESPACE_"

    deployment_prefix:
    - "ute"
    - "_NAMESPACE_"

    statefulset_prefix:
    - "ute"
    - "_NAMESPACE_"

  image:
    # - Description: registry of image
    # - Example:
    #    "bcmt-registry:5000/dep" for NCS;
    #    "registry.kube-system.svc.nokia.net:5555/dep" for NCIR;
    #    "image-registry.openshift-image-registry.svc:5000/{{ .Release.Namespace }}" for OCP.
    registry: "image-registry.openshift-image-registry.svc:5000/{{ .Release.Namespace }}"
    pullPolicy: "Always"
    # - Description: The Kubernetes secret name that stores credential authentication of target image registry,
    # - only kubernetes.io/dockercfg and kubernetes.io/dockerconfigjson types secret supported.
    # - Default value: ""
    imagePullSecret: "default-dockercfg-8gpbx"
    autoGetSecret: true

  # - Description: time zone in format "Region/City", e.g. "Asia/Shanghai". Default as 'UTC'.
  timezone: "Europe/Bucharest"

  #########################################################
  # global configuration for VDU parent chart
  #########################################################

  # - Description: the name of persistent volume
  # - Note: Ensure uniqueness for every VDU and keep same when do upgrade/update
  # -       consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character
  pvcName: "vdupvc"

  # Custom extensions for labels which will be injected into ConfigMap,
  # Service, Pod resources.
  # Example:
  #  labels: {nf-type: 5g-nf-producer}
  custom_extensions:
    labels: {}

  # - Description: Description of a site used as auto connection site ID.
  # - Note: As it will be used for identifying the vDU, ensure uniqueness for every vDU
  # -       equal to the value of MRBTS/AutoConnSiteID parameter from the CM plan imported to the NMS
  # -       1 to 50 ASCII characters
  siteDescription: "MRBTS-43691"

  # - Description: URL (containing IP address) of the NMS
  #-  support geo-redundancy configuration for NMS, you can specify two URL here
  #-  example:
  #    - "http://10.20.30.40/NE3S/1.0/NE3SRegistrationNotificationsService"
  #    - "http://10.20.30.41/NE3S/1.0/NE3SRegistrationNotificationsService"
  urlNMS:
  - ""
  - ""

  # - Description: external IP to access ne3sagent, used by NMS to connect back (register)  with ne3sagent
  # - Note: current agentIP should be the same as vDU oam IP by default, due to ne3sagent run in oam container
  agentIP: "10.5.14.26"

  # - Description: true means SeLinux enforcing + WA, not support audit log; false means seLinux permissive + no WA, support audit log.
  # - Default value: true
  seLinux: "true"
  # - Description: The collection of stack trace needs to be enabled as alternative for debugging program crashes only when core dump files are not achievable.
  # - Supported values: type string "true" or "false"
  # - Default value: "false"
  stackTraceEnabled: "false"

  # - Description: the name of RuntimeClass which is used for high performance
  # - Default value: "nokia-performance"
  highPerformanceRunTimeClass: "nokia-performance"

