      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane2"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        type: "physical"
        role:
