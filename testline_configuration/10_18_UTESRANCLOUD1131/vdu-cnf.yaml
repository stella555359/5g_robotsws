# =========================== configuration L2NRT POD ==========================================
aic-vdu-l2nrt:
  nodeSelector: {}
  # - Description: flag to open SiblingCore
  # - Support Values: "true"/"false"/true/false
  # - default value: "true"
  activeSiblingCore: "true"
  # - Description: deploymentType for different cores mapping
  # - Support Values: NR_L2NRT_3CL2HI,OE20_MEDIUM_CAP,NR_UPPOD_2CL2PS_2CL2LO_2CL2HI,NR_UPPOD_4CL2PS_2CL2LO_2CL2HI
  # - default value: NR_L2NRT_10vCPU
  # - core mapping as followed
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  # | platform |         deployment type         | cores/activeSiblingCore=true     |  cores/activeSiblingCore=false   |
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  # |   OCP    | OE20_MEDIUM_CAP                 | 6(L2HI) + 4(trsw) + 2(CCSRT)=12  | 3(L2HI) + 2(trsw) + 1(CCSRT)=6   |
  # |   OCP    |  NR_UPPOD_2CL2PS_2CL2LO_2CL2HI  |  4(L2HI) + 4(trsw) + 2(CCSRT)=10 |  2(L2HI) + 2(trsw) + 1(CCSRT)=5  |
  # |   OCP    |  NR_UPPOD_4CL2PS_2CL2LO_2CL2HI  |  4(L2HI) + 4(trsw) + 2(CCSRT)=10 |  2(L2HI) + 2(trsw) + 1(CCSRT)=5  |
  # |   OCP    |  NR_L2NRT_3CL2HI                |  6(L2HI) + 4(trsw) + 2(CCSRT)=12 |  3(L2HI) + 2(trsw) + 1(CCSRT)=6  |
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  deploymentType: "NR_L2NRT_10vCPU"

  # ====== configuration about l2hi container =====
  l2hi:
    securityContext:
      # Description: the flag that indicate if l2hi run with privileged permission. Support Values: true, false.
      # Default: "false"
      # Note: WA for run on RH-OCP version lower than 4.9, l2hi can only run under privilgedMode as true
      privilegedMode: "false"
    dptrace:
      # - Description: Enable or disable l2hi container dptrace function. 0 means disable, 1 means enable.
      enable: "0"
      # - Description: Enable or disable l2hi container payload dump. 0 means disable payload dump, 1 means enable payload dump.
      dump_payload: "0"
      # - Description: Config l2hi container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1.
      # - Note: Maximum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
      filter: "none:none"

# ========================= configuration L2RT POD ====================================
aic-vdu-l2rt:
  nodeSelector: {}
  # - Description: flag to open SiblingCore
  # - Support Values: "true"/"false"/true/false
  # - default value: "true"
  activeSiblingCore: "true"
  # - Description: deploymentType for different cores mapping
  # - Support Values: NR_L2RT_8CL2PS_4CL2LO,NR_L2RT_2CL2PS_2CL2LO,NR_L2RT_4CL2PS_2CL2LO,OE20_MEDIUM_CAP,NR_UPPOD_2CL2PS_2CL2LO_2CL2HI,NR_UPPOD_4CL2PS_2CL2LO_2CL2HI
  # - default value: NR_L2RT_12vCPU
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  # | platform |         deployment type         |  cores/activeSiblingCore=true    |  cores/activeSiblingCore=false   |
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  # |   OCP    |  OE20_MEDIUM_CAP                | 6(L2PS) + 4(L2Lo) + 2(CCSRT)=12  | 3(L2PS) + 2(L2Lo) + 1(CCSRT)=6   |
  # |   OCP    |  NR_UPPOD_2CL2PS_2CL2LO_2CL2HI  |  4(L2PS) + 4(L2Lo) + 2(CCSRT)=10 |  2(L2PS) + 2(L2Lo) + 1(CCSRT)=5  |
  # |   OCP    |  NR_UPPOD_4CL2PS_2CL2LO_2CL2HI  |  8(L2PS) + 4(L2Lo) + 2(CCSRT)=14 |  4(L2PS) + 2(L2Lo) + 1(CCSRT)=7  |
  # |   OCP    |  NR_L2RT_2CL2PS_2CL2LO          |  4(L2PS) + 4(L2Lo) + 2(CCSRT)=10 |  2(L2PS) + 2(L2Lo) + 1(CCSRT)=5  |
  # |   OCP    |  NR_L2RT_4CL2PS_2CL2LO          |  8(L2PS) + 4(L2Lo) + 2(CCSRT)=14 |  4(L2PS) + 2(L2Lo) + 1(CCSRT)=7  |
  # |   OCP    |  NR_L2RT_8CL2PS_4CL2LO          |  16(L2PS) + 8(L2Lo) + 2(CCSRT)=26|  8(L2PS) + 4(L2Lo) + 1(CCSRT)=13 |
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  deploymentType: "NR_L2RT_12vCPU"

  # ====== configuration about l2rt container =====
  l2rt:
    dptrace:
      # - Description: Enable or disable l2rt container dptrace function. 0 means disable, 1 means enable.
      enable: "0"
      # - Description: Enable or disable l2rt container payload dump. 0 means disable payload dump, 1 means enable payload dump.
      dump_payload: "0"
      # - Description: Config l2rt container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1.
      # - Note: Maximum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
      filter: "none:none"
