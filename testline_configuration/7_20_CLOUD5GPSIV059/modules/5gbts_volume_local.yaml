heat_template_version: 2016-10-14
description: 'v77: Template for creating a cinder volume instance belonging to a volume group'
parameters:
  index:
    type: number
    description: index to fetch own parameters
  volumes:
    type: json
    description: parameters for volumes
resources:
  cinder_volume:
    type: OS::Cinder::Volume
    properties:
      name:
        get_param:
        - volumes
        - {get_param: index}
        - name
      size:
        get_param:
        - volumes
        - {get_param: index}
        - size
outputs:
  volume_id:
    description: the resource uuid value of the volume
    value: {get_resource: cinder_volume}
  provider_map:
    description: the storage provider metadata map
    value:
      map_merge:
        repeat:
          for_each:
            <%name%>:
            - get_param:
              - volumes
              - {get_param: index}
              - name
          template:
            storage.local.<%name%>:
              fstype: ext4
              mount-to:
                get_param:
                - volumes
                - {get_param: index}
                - mount
              disk: {get_resource: cinder_volume}
