UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_1:                                    # UE name - change if you want
                CAPABILITIES: # Capabilities that UE has. (as a list)
                    - UE_1
                STARTING_CELL: 272130                   # Cell ID to which UE should attach
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:
                    imei:   355682116148475              #Nokia8.3:353137111073014   MI11868285054409014
#                    device_id: 22c0ba3905057ece          #nokia:HZQN1876BAKA2800461 MI:a80a211a
                    serial_number: 'R9BN501N6VJ'
                    configuration:
                        uc_server_Ip: '10.53.164.252'       #ultracaller server IP
                        token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6Imx0ZWZ3ayIsImFkbWluIjpmYWxzZX0.lg6NJaD6wOBgcKQ3WdNgUGbJEnUOqIUQz-ZJv9IN4RM'  # ultracaller server token
                        ue_pc_ip: '10.41.209.215'        # UE PC IP address
                        login: 'inbabtslabuser'                  # SSH login to UE PC
                        password: 'BT5l@bus3rl0g1n'              # SSH password to UE PC
                        cid: '272129'
                        clear_logs: 'yes'
                        processes_to_kill:                # phrases based on which processes names will be found and killed before test (case insensitive)
                            - 'putty'
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                            - 'python'
                            - 'AtmnServer'
                        data_transfer:                    # Iperf endpoint details
                            ssh:
                                host: '10.63.25.107'
                                user: 'ftpuser'             # Iperf endpoint SSH login
                                password: 'ftpuser'      # Iperf endpoint SSH password
                            iperf_tcp:                            #Iperf parameters for DL (ex:iperf -u -c 10.43.80.157 -p 53001 -b 1000M -l 1400 -t 300 -i 1 -fm)
                                -p:53003
                                -b:1500
                                -l:1200
                                -t:180
                                -i:1
                            FTP:
                                address:10.63.25.107
                                filename:/home/ftpuser/SFE3/1GB_DL
                                login:ftpuser
                                password:ftpuser
                                updown:download 
  
