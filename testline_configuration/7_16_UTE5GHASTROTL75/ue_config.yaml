UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_1:                                                                             # UE name - change if you want
                CAPABILITIES:                                                                     # Capabilities that UE has. (as a list)
                    - Mediatek
                    - UE_1
                CLASS: AndroidUe           # UE type is Qualcomm so QualcommNoLicense class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:
                    serial_number: 'm80'     # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    configuration:                   # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.42.224.213'      # UE PC IP address
                        pyro_port: '9090'            # TCP Port number on UE PC on which Pyro server will be started
                        login: 'wro5grrm'            # SSH login to UE PC
                        password: '5gpass!1'         # SSH password to UE PC
                        server_dir: '/cygdrive/c/pyro_server'    # UE PC directory where all server files will be copied
                        server_python: 'C:/Users/wro5grrm/AppData/Local/Programs/Python/Python37/python.exe' # UE PC python location
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
                        clear_logs: 'yes'
                        processes_to_kill:           # processes to kill on UE PC - anything that may interrupt a test case
                            - 'uemanager'
                            - 'putty'
                        data_transfer:
                            tput_collection_src: 'control_app'
                            ip_version: '4'
                            iperf_interval: '1'
                            app_servers:
                                APP_1:      # iperf server name
                                    host: '10.45.168.53' # Application Server IP
                                    user: '5g'     # Application Server SSH login
                                    password: '2019H@slo' # Application Server SSH password
                                    iperf_interface_ip: '10.45.168.53'
    MediaTekUePool:
        inline_config:
            MEDIATEK:                                                                             # UE name - change if you want
                CAPABILITIES:                                                                     # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_MEDIATEK_UE
                    - CA_UE
                    - UE_1
                CLASS: MediaTekUe           # UE type is Qualcomm so QualcommNoLicense class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:

                    configuration:                   # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
                        serial_number: 'm80'     # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                        ue_pc_ip: '10.42.224.213'      # UE PC IP address
                        pyro_port: '8080'            # TCP Port number on UE PC on which Pyro server will be started
                        login: 'wro5grrm'            # SSH login to UE PC
                        password: '5gpass!1'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server'    # UE PC directory where all server files will be copied
#                       server_python: 'C:/Users/wro5grrm/AppData/Local/Programs/Python/Python37/python.exe'
                        network_mode_switch_method: 'adb'       # method for change network mode keyword
                        clear_logs: 'yes'
                        edb_file_path: 'auto'
                        log_filter: '2.Gen98_Default_Standard'
                        # qualcomm_prototype: 'yes'
                        processes_to_kill:           # processes to kill on UE PC - anything that may interrupt a test case
                            - 'uemanager'
                            - 'putty'
                        data_transfer:
                            pdn_name: 'default'
                            tput_collection_src: 'control_app'
                            ip_version: '4'
                            iperf_interval: '1'
                            app_server:
                                addr: '10.45.168.53' # Application Server IP
                                username: '5g'     # Application Server SSH login
                                password: '2019H@slo' # Application Server SSH password
                                iperf_path: 'iperf'
                                iperf_ports:
                                    - '54008'
                                    - '54009'
                                    - '54006'
                                    - '54007'
                                    - '54010'
                                    - '55254'
                                    - '54008'
                                iperf_interface_ip: '10.45.168.53'
                            iperf_options:
                                packet: '1024B'
                                buffer: '2M'
                            ue_host:
                                addr: '10.42.224.213'
                                username: 'wro5grrm'
                                password: '5gpass!1'
                                iperf_path: '/data/data/com.nokia.android.application/iperf'
                                iperf_ports:
                                    - '54008'
                                    - '54009'
                                    - '54006'
                                    - '54007'
                                    - '54010'
                                    - '55254'
                                    - '54008'

PDN:
    default:
        apn: internet
        MediaTekUePool:
            pdp_type: IP
