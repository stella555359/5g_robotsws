      <<: *cpnb_res_def_properties

  cpnb_nodes_basic:
    type: 5GBTS::Node::Common::Basic
    condition: deploy_basic_condition
    depends_on: upue_nodes_basic
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: { get_param: [cbam, extensions, vnf_name]}
            $cid: { get_param: [cbam, extensions, cluster_id]}
            $vm: cpnb-000
      roles: [application, 5gbts_cpnb]
      instance_index: '0'
      instance_params: { '0': {get_param: [cbam, resources, cpnb_nodes_basic]}}
      server_group_id: {get_resource: basic_server_group}
      availability_zones:
        azId: {get_attr: [common_available_zones, az_lists, cpnb_000]}
      networks:
        get_attr: [network_setup_basic, networks, as]
      timezone: {get_param: [cbam, extensions, timezone]}
      storage_meta:
        get_attr: [oam_nodes_basic, volume_map]
      common_metadata:
        map_merge:
        - get_attr: [common_params, metadata]
        - <<: *number_of_nodes_basic
      <<: *cpnb_res_def_properties

  cpcl_nodes_template:
    type: OS::Heat::None
    condition: false
    properties:
      res_def_properties: &cpcl_res_def_properties
        <<: *common_params

  cpcl_nodes_redundant:
    type: 5GBTS::Node::Common::Redundant
    condition: deploy_redundant_condition
    depends_on: upue_nodes_redundant
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
            $vm: cpcl
      roles: [application, 5gbts_cpcl_2n]
      instance_params:
        server_0:
          map_merge:
          - get_param: [cbam, resources, cpcl_nodes_redundant, server_0]
          - availability_zones: {get_attr: [common_available_zones, az_lists, cpcl_000]}
        server_1:
          map_merge:
          - get_param: [cbam, resources, cpcl_nodes_redundant, server_1]
          - availability_zones: {get_attr: [common_available_zones, az_lists, cpcl_001]}
      networks:
        get_attr: [network_setup_redundant, networks, as]
      timezone: {get_param: [cbam, extensions, timezone]}
      service_ip_meta:
        get_attr: [network_setup_redundant, service_ip_map]
      storage_meta:
        get_attr: [oam_nodes_redundant, volume_map]
      <<: *cpcl_res_def_properties

  cpcl_nodes_basic:
    type: 5GBTS::Node::Common::Basic
    condition: deploy_basic_condition
    depends_on: upue_nodes_basic
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
            $vm: cpcl-000
      roles: [application, 5gbts_cpcl]
      instance_index: '0'
      instance_params: {'0': {get_param: [ cbam, resources, cpcl_nodes_basic]}}
      server_group_id: {get_resource: basic_server_group}
      availability_zones:
        azId: {get_attr: [common_available_zones, az_lists, cpcl_000]}
      networks:
        get_attr: [network_setup_basic, networks, as]
      timezone: {get_param: [cbam, extensions, timezone]}
      storage_meta:
        get_attr: [oam_nodes_basic, volume_map]
      <<: *cpcl_res_def_properties

  cpue_nodes_template:
    type: OS::Heat::None
    condition: false
    properties:
      count: &cpue_count
        get_attr: [cpue_count, value]
      res_def_properties: &cpue_res_def_properties
        name:
          str_replace:
            template: $vnf-$cid-$vm
            params:
              $vnf: { get_param: [cbam, extensions, vnf_name]}
              $cid: { get_param: [cbam, extensions, cluster_id]}
              $vm: cpue
        instance_index: '%index%'
        server_group_id: {get_resource: cpue_server_group}
        availability_zones:
          azIds: {get_attr: [common_available_zones, az_lists, cpues]}
        roles: [application, 5gbts_cpue]
        <<: *common_params

  cpue_nodes_redundant:
    type: OS::Heat::ResourceGroup
    condition: deploy_redundant_condition
    depends_on: upue_nodes_redundant
    properties:
      count: *cpue_count
      removal_policies:
      - resource_list:
          get_attr: [cpue_blacklist, value]
      resource_def:
        type: 5GBTS::Node::Common::Npuls
        properties:
          networks:
            get_attr: [network_setup_redundant, networks, as]
          timezone: {get_param: [cbam, extensions, timezone]}
          storage_meta:
            get_attr: [oam_nodes_redundant, volume_map]
          instance_params:
            get_param: [cbam, resources, cpue_nodes_redundant]
          <<: *cpue_res_def_properties

  cpue_nodes_basic:
    type: OS::Heat::ResourceGroup
    condition: deploy_basic_condition
    depends_on: upue_nodes_basic
    properties:
      count: *cpue_count
      removal_policies:
      - resource_list:
          get_attr: [cpue_blacklist, value]
      resource_def:
        type: 5GBTS::Node::Common::Npuls
        properties:
          networks:
            get_attr: [network_setup_basic, networks, as]
          timezone: {get_param: [cbam, extensions, timezone]}
          storage_meta:
            get_attr: [oam_nodes_basic, volume_map]
          instance_params:
            get_param: [cbam, resources, cpue_nodes_basic]
          <<: *cpue_res_def_properties

  db_nodes_template:
    type: OS::Heat::None
    condition: false
    properties:
      res_def_properties: &db_res_def_properties
        <<: *common_params

  db_nodes_redundant:
    type: 5GBTS::Node::DB::Redundant
    condition: deploy_redundant_condition
    depends_on: oam_nodes_redundant
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: { get_param: [cbam, extensions, vnf_name]}
            $cid: { get_param: [cbam, extensions, cluster_id]}
            $vm: db
      roles: [application, 5gbts_db]
      instance_params:
        server_0:
          map_merge:
          - get_param: [cbam, resources, db_nodes_redundant, server_0]
          - server_group_id: {get_resource: db_server_group}
          - availability_zones: {get_attr: [common_available_zones, az_lists, db_000]}
        server_1:
          map_merge:
          - get_param: [cbam, resources, db_nodes_redundant, server_1]
          - server_group_id: {get_resource: db_server_group}
          - availability_zones: {get_attr: [common_available_zones, az_lists, db_001]}
        server_2:
          map_merge:
          - get_param: [cbam, resources, db_nodes_redundant, server_2]
          - server_group_id: {get_resource: db_server_group}
          - availability_zones: {get_attr: [common_available_zones, az_lists, db_002]}
      networks:
        get_attr: [network_setup_redundant, networks, db]
      timezone: {get_param: [cbam, extensions, timezone]}
      cinder_volumes:
        count: 1
        vol_list:
        - {size: 15, name: vol1}
      lvm_local_volumes:
        count: 1
        vol_list:
        - {size: 12000M, name: db_redis_session, mount: /mnt/db_redis_session, volume: vol1}
      storage_meta:
        get_attr: [oam_nodes_redundant, volume_map]
      <<: *db_res_def_properties

  db_nodes_basic:
    type: 5GBTS::Node::DB::Basic
    condition: deploy_basic_condition
    depends_on: oam_nodes_basic
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: { get_param: [cbam, extensions, vnf_name]}
            $cid: { get_param: [cbam, extensions, cluster_id]}
            $vm: db-000
      server_group_id: {get_resource: basic_server_group}
      availability_zones:
        azId: {get_attr: [common_available_zones, az_lists, db_000]}
      instance_params:
        get_param: [cbam, resources, db_nodes_basic]
      networks:
        get_attr: [network_setup_basic, networks, db]
      timezone: {get_param: [cbam, extensions, timezone]}
      cinder_volumes:
        count: 1
        vol_list:
        - {size: 4, name: vol1}
      lvm_local_volumes:
        count: 2
        vol_list:
        - {size: 1000M, name: db_pg_session, mount: /mnt/db_pg_sesssion, volume: vol1}
        - {size: 2000M, name: db_redis_session, mount: /mnt/db_redis_session, volume: vol1}
      storage_meta:
        get_attr: [oam_nodes_basic, volume_map]
      <<: *db_res_def_properties

  upgrade_nodes_template:
    type: OS::Heat::None
    condition: false
    properties:
      count: &upgrade_count
        get_attr: [upgrade_count, value]
      res_def_properties: &upgrade_res_def_properties
        name:
          str_replace:
            template: $vnf-$cid-$vm
            params:
              $vnf: {get_param: [cbam, extensions, vnf_name]}
              $cid: {get_param: [cbam, extensions, cluster_id]}
              $vm: uvm-00%index%
        availability_zones:
          azId: {get_attr: [common_available_zones, az_lists, uvm]}
        roles: [upgrade]
        upgrade-node: true
        <<: *common_params

  upgrade_nodes_redundant:
    type: OS::Heat::ResourceGroup
    condition: deploy_redundant_condition
    depends_on: oam_nodes_redundant
    properties:
      count: *upgrade_count
      resource_def:
        type: 5GBTS::Node::Common::Basic::UVM
        properties:
          networks:
            get_attr: [network_setup_redundant, networks, uvm]
          timezone: {get_param: [cbam, extensions, timezone]}
          storage_meta:
            get_attr: [oam_nodes_redundant, volume_map]
          instance_index: '%index%'
          instance_params: { get_param: [ cbam, resources, upgrade_nodes_redundant]}
          server_group_id: {get_resource: basic_server_group}
          <<: *upgrade_res_def_properties

  upgrade_nodes_basic:
    type: OS::Heat::ResourceGroup
    condition: deploy_basic_condition
    depends_on: upue_nodes_basic
    properties:
      count: *upgrade_count
      resource_def:
        type: 5GBTS::Node::Common::Basic::UVM
        properties:
          networks:
            get_attr: [network_setup_basic, networks, uvm]
          timezone: {get_param: [cbam, extensions, timezone]}
          storage_meta:
            get_attr: [oam_nodes_basic, volume_map]
          instance_index: '%index%'
          instance_params:
            get_param: [cbam, resources, upgrade_nodes_basic]
          server_group_id: {get_resource: basic_server_group}
          <<: *upgrade_res_def_properties

outputs:
  management_ip:
    description: Primary management IP address allocated to access the system
    value:
      if:
        - deploy_basic_condition
        - get_attr: [oam_nodes_basic, management_ip]
        - get_attr: [oam_nodes_redundant, management_ip]

  management_ips:
    description: All management IP address allocated to access the system
    value:
      if:
        - deploy_basic_condition
        - get_attr: [oam_nodes_basic, management_ips]
        - get_attr: [oam_nodes_redundant, management_ips]
