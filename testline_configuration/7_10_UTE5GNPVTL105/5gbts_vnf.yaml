# Copyright (c) Nokia 2020
heat_template_version: 2016-10-14
description: '5GBTS vCU deployment heat template'
parameters:
  cbam:
    type: json
  config_drive:
    type: json
    description: use config drive instead of metadata server
    default:
      basic: false
      redundant: false
  ha_cluster:
    type: json
    description: HA nodes acting as etcd member instances and quorate voter
    default:
      basic: [oam-000]
      redundant: [oam-000, oam-001, cpif-000]
  vif_model:
    type: string
    description: interface driver to use for each interface type
    default: virtio
    constraints:
    - allowed_values:
      - virtio
      - avp
  boot_command:
    type: comma_delimited_list
    description: command runs on every boot
    default:
      - cloud-init-per always echo echo boot command

conditions:
  deploy_basic_condition: {equals : [{get_param: [cbam, extensions, vnf_layout]}, "basic"]}
  deploy_redundant_condition: {equals : [{get_param: [cbam, extensions, vnf_layout]}, "redundant"]}

resources:
  cpue_count:
    type: OS::Heat::Value
    properties:
      type: number
      value:
        if:
        - deploy_basic_condition
        - {get_param: [cbam, resources, cpue_nodes_basic, count]}
        - {get_param: [cbam, resources, cpue_nodes_redundant, count]}

  upue_count:
    type: OS::Heat::Value
    properties:
      type: number
      value:
        if:
        - deploy_basic_condition
        - {get_param: [cbam, resources, upue_nodes_basic, count]}
        - {get_param: [cbam, resources, upue_nodes_redundant, count]}

  upgrade_count:
    type: OS::Heat::Value
    properties:
      type: number
      value:
        if:
        - deploy_basic_condition
        - {get_param: [cbam, resources, upgrade_nodes_basic, count]}
        - {get_param: [cbam, resources, upgrade_nodes_redundant, count]}

  upue_blacklist:
    type: OS::Heat::Value
    properties:
      type: comma_delimited_list
      value:
        if:
        - deploy_basic_condition
        - {get_param: [cbam, resources, upue_nodes_basic, blacklist]}
        - {get_param: [cbam, resources, upue_nodes_redundant, blacklist]}

  cpue_blacklist:
    type: OS::Heat::Value
    properties:
      type: comma_delimited_list
      value:
        if:
        - deploy_basic_condition
        - {get_param: [cbam, resources, cpue_nodes_basic, blacklist]}
        - {get_param: [cbam, resources, cpue_nodes_redundant, blacklist]}

  common_available_zones:
    type: 5GBTS::Common::AvailableZones
    properties:
      availability_zones: {get_param: [cbam, extensions, availability_zones]}
      number_of_cpue_nodes: {get_attr: [cpue_count, value]}
      number_of_upue_nodes: {get_attr: [upue_count, value]}

  keypair:
    type: OS::Nova::KeyPair
    properties:
      name:
        str_replace:
          template: $vnf-$cid-generated
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
      public_key: {get_param: [cbam, publicSshKey]}

  ext_networks:
    type: 5GBTS::Networks::Transformation
    properties:
      networks: {get_param: [cbam, extensions, external_networks]}
      vnf_layout: {get_param: [cbam, extensions, vnf_layout]}

  network_setup_template:
    type: OS::Heat::None
    condition: false
    properties:
      common_properties: &network_properties
        internal_networks: {get_param: [cbam, extensions, internal_networks] }
        internal_segment_ids: {get_param: [cbam, extensions, internal_segment_ids]}
        internal_e1_networks: {get_param: [cbam, extensions, internal_e1_networks]}
        external_networks: {get_attr: [ext_networks, networks]}
        vif_model: {get_param: vif_model}
        name_prefix:
          str_replace:
            template: $vnf-$cid
            params:
              $vnf: {get_param: [cbam, extensions, vnf_name]}
              $cid: {get_param: [cbam, extensions, cluster_id]}
        provider_name: {get_param: [cbam, extensions, internal_provider_networks]}
        e1_provider_name: {get_param: [cbam, extensions, internal_e1_provider_networks]}

  network_setup_redundant:
    type: 5GBTS::Networks::Redundant
    condition: deploy_redundant_condition
    properties:
      <<: *network_properties

  network_setup_basic:
    type: 5GBTS::Networks::Basic
    condition: deploy_basic_condition
    properties:
      <<: *network_properties

  common_params:
    type: 5GBTS::Common::Parameters
    properties:
      vnf_name: {get_param: [cbam, extensions, vnf_name]}
      cluster_id: {get_param: [cbam, extensions, cluster_id]}
      ha_cluster: {get_param: [ha_cluster, {get_param: [cbam, extensions, vnf_layout]}]}
      cleartextpassword: {get_param: [cbam, extensions, cleartextpassword]}
      password: {get_param: [cbam, extensions, password]}
      user_info:
        map_merge:
        - {get_param: [cbam, extensions, user_info]}
        - chpasswd:
            expire: false
            list:
            - str_replace:
                template: root:<hash$>
                params:
                  <hash$>:
                    get_param: [cbam, extensions, password, root]
            - str_replace:
                template: _nokfsoperator:<$hash$>
                params:
                  <$hash$>:
                    get_param: [cbam, extensions, password, _nokfsoperator]
      extra_cloud_config_data: {get_param: [cbam, extensions, extra_cloud_config_data]}
      run_command:
        - if ! getent passwd toor4nsn > /dev/null && ! getent group toor4nsn > /dev/null && ! getent shadow toor4nsn > /dev/null;
          then
              useradd -o -u 0 -p '$5$rounds=10000$t2Q/6qch$mBwPdFPJzStWa/zFaMuAcmVCBGVTRrXkqb6iQ.i2ff4' -s /bin/bash toor4nsn;
          fi
      boot_command: {get_param: boot_command}
      config_external_ip: {get_param: [cbam, extensions, config_external_ip]}
      network-interface-enable: {get_param: [cbam, extensions, network-interface-enable]}

  common_params_template:
    type: OS::Heat::None
    condition: false
    properties:
      common_params: &common_params
        config_drive: {get_param: [config_drive, {get_param: [cbam, extensions, vnf_layout]}]}
        common_userdata:
          get_attr: [common_params, userdata]
        common_metadata:
          get_attr: [common_params, metadata]
      number_of_nodes_redundant: &number_of_nodes_redundant
        deployment:
          number_of_cpcl: 2
          number_of_cpue: {get_attr: [cpue_count, value]}
          number_of_upue: {get_attr: [upue_count, value]}
          min_number_of_cpcl: 2
          min_number_of_cpue: 1
          min_number_of_upue: 1
          max_number_of_cpcl: 2
          max_number_of_cpue: 12
          max_number_of_upue: 36
      number_of_nodes_basic: &number_of_nodes_basic
        deployment:
          number_of_cpcl: 1
          number_of_cpue: {get_attr: [cpue_count, value]}
          number_of_upue: {get_attr: [upue_count, value]}
          min_number_of_cpcl: 1
          min_number_of_cpue: 1
          min_number_of_upue: 1
          max_number_of_cpcl: 1
          max_number_of_cpue: 12
          max_number_of_upue: 36

  oam_cpif_server_group:
    type: OS::Nova::ServerGroup
    properties:
      name:
        str_replace:
          template: $vnf-$cid-oam-cpif-server-group
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
      policies:
        - anti-affinity

  db_server_group:
    type: OS::Nova::ServerGroup
    properties:
      name:
        str_replace:
          template: $vnf-$cid-db-server-group
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
      policies:
        - anti-affinity

  basic_server_group:
    type: OS::Nova::ServerGroup
    properties:
      name:
        str_replace:
          template: $vnf-$cid-basic-server-group
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
      policies:
        - soft-anti-affinity

  cpue_server_group:
    type: OS::Nova::ServerGroup
    properties:
      name:
        str_replace:
          template: $vnf-$cid-cpue-server-group
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
      policies:
        - soft-anti-affinity

  upue_server_group:
    type: OS::Nova::ServerGroup
    properties:
      name:
        str_replace:
          template: $vnf-$cid-upue-server-group
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
      policies:
        - soft-anti-affinity

  oam_nodes_template:
    type: OS::Heat::None
    condition: false
    properties:
      common_properties: &oam_properties
        key_name: {get_resource: keypair}
        ntp_servers: {get_param: [cbam, extensions, ntp_servers]}
        dns_forwarders: {get_param: [cbam, extensions, dns_forwarders]}
        config_drive: {get_param: [config_drive, {get_param: [cbam, extensions, vnf_layout]}]}
        common_userdata:
          get_attr: [common_params, userdata]

  oam_nodes_redundant:
    type: 5GBTS::Node::OAM::Redundant
    condition: deploy_redundant_condition
    depends_on: network_setup_redundant
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: { get_param: [cbam, extensions, vnf_name]}
            $cid: { get_param: [cbam, extensions, cluster_id]}
            $vm: oam
      instance_params:
        server_0:
          map_merge:
          - get_param: [cbam, resources, oam_nodes_redundant, server_0]
          - server_group_id: {get_resource: oam_cpif_server_group}
          - availability_zones: {get_attr: [common_available_zones, az_lists, oam_000]}
        server_1:
          map_merge:
          - get_param: [cbam, resources, oam_nodes_redundant, server_1]
          - server_group_id: {get_resource: oam_cpif_server_group}
          - availability_zones: {get_attr: [common_available_zones, az_lists, oam_001]}
      networks:
        get_attr: [network_setup_redundant, networks, oam]
      timezone: {get_param: [cbam, extensions, timezone]}
      dual_stack: {get_param: [cbam, extensions, dual_stack]}
      cinder_volumes:
        count: 1
        vol_list:
        - {size: 30, name: vol1}
      lvm_local_volumes:
        count: 2
        vol_list:
        - {size: 10000M, name: dbcm, mount: /mnt/dbcm, volume: vol1}
        - {size: 1000M, name: storageconf, mount: /var/lib/glusterd, volume: vol1}
      lvm_gfs_hosts:
        get_attr: [common_params, metadata, etcd-instances]
      lvm_gfs_volumes:
        count: 5
        vol_list:
        - {size: 1000M, name: mstate, mount: /mnt/mstate, volume: vol1}
        - {size: 5000M, name: export, mount: /mnt/export, volume: vol1}
        - {size: 1000M, name: log, mount: /mnt/log, volume: vol1}
        - {size: 2000M, name: services, mount: /mnt/services, volume: vol1}
        - {size: 5000M, name: ccs, mount: /mnt/ccs, volume: vol1}
      service_ip_meta:
        get_attr: [network_setup_redundant, service_ip_map]
      common_metadata:
        map_merge:
        - get_attr: [common_params, metadata]
        - <<: *number_of_nodes_redundant
      <<: *oam_properties

  oam_nodes_basic:
    type: 5GBTS::Node::OAM::Basic
    condition: deploy_basic_condition
    depends_on: network_setup_basic
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: { get_param: [cbam, extensions, vnf_name]}
            $cid: { get_param: [cbam, extensions, cluster_id]}
            $vm: oam-000
      instance_params:
        get_param: [cbam, resources, oam_nodes_basic]
      server_group_id: {get_resource: basic_server_group}
      availability_zones:
        azId: {get_attr: [common_available_zones, az_lists, oam_000]}
      networks:
        get_attr: [network_setup_basic, networks, oam]
      timezone: {get_param: [cbam, extensions, timezone]}
      dual_stack: {get_param: [cbam, extensions, dual_stack]}
      cinder_volumes:
        count: 1
        vol_list:
        - {size: 14, name: vol1}
      lvm_local_volumes:
        count: 1
        vol_list:
        - {size: 2500M, name: dbcm, mount: /mnt/dbcm, volume: vol1}
      lvm_nfs_volumes:
        count: 4
        vol_list:
        - {size: 500M, name: mstate, mount: /mnt/mstate, volume: vol1}
        - {size: 5000M, name: export, mount: /mnt/export, volume: vol1}
        - {size: 1000M, name: log, mount: /mnt/log, volume: vol1}
        - {size: 2000M, name: services, mount: /mnt/services, volume: vol1}
      common_metadata:
        map_merge:
        - get_attr: [common_params, metadata]
        - <<: *number_of_nodes_basic
      <<: *oam_properties

  cpif_nodes_template:
    type: OS::Heat::None
    condition: false
    properties:
        res_def_properties: &cpif_res_def_properties
          dpdk_type:
            get_attr: [ext_networks, dpdk_type, cpif]
          <<: *common_params

  cpif_nodes_redundant:
    type: 5GBTS::Node::CPIF::Redundant
    condition: deploy_redundant_condition
    depends_on: oam_nodes_redundant
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
            $vm: cpif
      roles: [application, 5gbts_cpif_2n]
      instance_params:
        server_0:
          map_merge:
          - get_param: [cbam, resources, cpif_nodes_redundant, server_0]
          - server_group_id: {get_resource: oam_cpif_server_group}
          - availability_zones: {get_attr: [common_available_zones, az_lists, cpif_000]}
        server_1:
          map_merge:
          - get_param: [cbam, resources, cpif_nodes_redundant, server_1]
          - server_group_id: {get_resource: oam_cpif_server_group}
          - availability_zones: {get_attr: [common_available_zones, az_lists, cpif_001]}
      networks:
        get_attr: [network_setup_redundant, networks, cpif]
      timezone: {get_param: [cbam, extensions, timezone]}
      dual_stack: {get_param: [cbam, extensions, dual_stack]}
      cinder_volumes:
        server_0:
          count: 1
          vol_list:
          - {size: 18, name: vol1}
        server_1:
          count: 0
          vol_list: []
      lvm_local_volumes:
        server_0:
          count: 1
          vol_list:
          - {size: 1000M, name: storageconf, mount: /var/lib/glusterd, volume: vol1}
        server_1:
          count: 0
          vol_list: []
      lvm_gfs_hosts:
        get_attr: [common_params, metadata, etcd-instances]
      lvm_gfs_volumes:
        server_0:
          count: 5
          vol_list:
          - {size: 1000M, name: mstate, mount: /mnt/mstate, volume: vol1}
          - {size: 5000M, name: export, mount: /mnt/export, volume: vol1}
          - {size: 1000M, name: log, mount: /mnt/log, volume: vol1}
          - {size: 2000M, name: services, mount: /mnt/services, volume: vol1}
          - {size: 5000M, name: ccs, mount: /mnt/ccs, volume: vol1}
        server_1:
          count: 0
          vol_list: []
      service_ip_meta:
        get_attr: [network_setup_redundant, service_ip_map_e1]
      storage_meta:
        get_attr: [oam_nodes_redundant, volume_map]
      <<: *cpif_res_def_properties

  cpif_nodes_basic:
    type: 5GBTS::Node::Common::Basic
    condition: deploy_basic_condition
    depends_on: oam_nodes_basic
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
            $vm: cpif-000
      roles: [application, 5gbts_cpif]
      instance_index: '0'
      instance_params: { '0': {get_param: [cbam, resources, cpif_nodes_basic]}}
      server_group_id: {get_resource: basic_server_group}
      availability_zones:
        azId: {get_attr: [common_available_zones, az_lists, cpif_000]}
      networks:
        get_attr: [network_setup_basic, networks, cpif]
      timezone: {get_param: [cbam, extensions, timezone]}
      dual_stack: {get_param: [cbam, extensions, dual_stack]}
      storage_meta:
        get_attr: [oam_nodes_basic, volume_map]
      <<: *cpif_res_def_properties

  cpnrt_nodes_template:
    type: OS::Heat::None
    condition: false
    properties:
        res_def_properties: &cpnrt_res_def_properties
          dpdk_type: none
          <<: *common_params

  cpnrt_nodes_redundant:
    type: 5GBTS::Node::Common::Redundant
    condition: deploy_redundant_condition
    depends_on: oam_nodes_redundant
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
            $vm: cpnrt
      roles: [application, 5gbts_cpnrt_2n]
      instance_params:
        server_0:
          map_merge:
          - get_param: [cbam, resources, cpnrt_nodes_redundant, server_0]
          - availability_zones: {get_attr: [common_available_zones, az_lists, cpnrt_000]}
        server_1:
          map_merge:
          - get_param: [cbam, resources, cpnrt_nodes_redundant, server_1]
          - availability_zones: {get_attr: [common_available_zones, az_lists, cpnrt_001]}
      networks:
        get_attr: [network_setup_redundant, networks, cpnrt]
      timezone: {get_param: [cbam, extensions, timezone]}
      service_ip_meta:
        get_attr: [network_setup_redundant, service_ip_map_e1]
      storage_meta:
        get_attr: [oam_nodes_redundant, volume_map]
      <<: *cpnrt_res_def_properties

  cpnrt_nodes_basic:
    type: 5GBTS::Node::Common::Basic
    condition: deploy_basic_condition
    depends_on: oam_nodes_basic
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: {get_param: [cbam, extensions, vnf_name]}
            $cid: {get_param: [cbam, extensions, cluster_id]}
            $vm: cpnrt-000
      roles: [application, 5gbts_cpnrt]
      instance_index: '0'
      instance_params: { '0' :{get_param: [cbam, resources, cpnrt_nodes_basic]}}
      server_group_id: {get_resource: basic_server_group}
      availability_zones:
        azId: {get_attr: [common_available_zones, az_lists, cpnrt_000]}
      networks:
        get_attr: [network_setup_basic, networks, cpnrt]
      timezone: {get_param: [cbam, extensions, timezone]}
      storage_meta:
        get_attr: [oam_nodes_basic, volume_map]
      <<: *cpnrt_res_def_properties

  upue_nodes_template:
    type: OS::Heat::None
    condition: false
    properties:
      count: &upue_count
        get_attr: [upue_count, value]
      res_def_properties: &upue_res_def_properties
        name:
          str_replace:
            template: $vnf-$cid-$vm
            params:
              $vnf: {get_param: [cbam, extensions, vnf_name]}
              $cid: {get_param: [cbam, extensions, cluster_id]}
              $vm: upue
        server_group_id: {get_resource: upue_server_group}
        availability_zones:
          azIds: {get_attr: [common_available_zones, az_lists, upues]}
        roles: [application, 5gbts_upue]
        dpdk_type:
          get_attr: [ext_networks, dpdk_type, upue]
        <<: *common_params

  upue_nodes_redundant:
    type: OS::Heat::ResourceGroup
    condition: deploy_redundant_condition
    depends_on: cpif_nodes_redundant
    properties:
      count: *upue_count
      removal_policies:
      - resource_list:
          get_attr: [upue_blacklist, value]
      resource_def:
        type: 5GBTS::Node::Common::Npuls
        properties:
          networks:
            get_attr: [network_setup_redundant, networks, upue]
          timezone: {get_param: [cbam, extensions, timezone]}
          dual_stack: {get_param: [cbam, extensions, dual_stack]}
          instance_index: '%index%'
          instance_params:
            get_param: [ cbam, resources, upue_nodes_redundant ]
          storage_meta:
            get_attr: [oam_nodes_redundant, volume_map]
          <<: *upue_res_def_properties

  upue_nodes_basic:
    type: OS::Heat::ResourceGroup
    condition: deploy_basic_condition
    depends_on: cpif_nodes_basic
    properties:
      count: *upue_count
      removal_policies:
      - resource_list:
          get_attr: [upue_blacklist, value]
      resource_def:
        type: 5GBTS::Node::Common::Npuls
        properties:
          networks:
            get_attr: [network_setup_basic, networks, upue]
          timezone: {get_param: [cbam, extensions, timezone]}
          dual_stack: {get_param: [cbam, extensions, dual_stack]}
          instance_index: '%index%'
          instance_params:
            get_param: [cbam, resources, upue_nodes_basic]
          storage_meta:
            get_attr: [oam_nodes_basic, volume_map]
          <<: *upue_res_def_properties

  cpnb_nodes_template:
    type: OS::Heat::None
    condition: false
    properties:
      res_def_properties: &cpnb_res_def_properties
        config_drive: {get_param: [config_drive, {get_param: [cbam, extensions, vnf_layout]}]}
        common_userdata:
          get_attr: [common_params, userdata]

  cpnb_nodes_redundant:
    type: 5GBTS::Node::Common::Redundant
    condition: deploy_redundant_condition
    depends_on: upue_nodes_redundant
    properties:
      name:
        str_replace:
          template: $vnf-$cid-$vm
          params:
            $vnf: { get_param: [cbam, extensions, vnf_name]}
            $cid: { get_param: [cbam, extensions, cluster_id]}
            $vm: cpnb
      roles: [application, 5gbts_cpnb_2n]
      instance_params:
        server_0:
          map_merge:
          - get_param: [cbam, resources, cpnb_nodes_redundant, server_0]
          - availability_zones: {get_attr: [common_available_zones, az_lists, cpnb_000]}
        server_1:
          map_merge:
          - get_param: [cbam, resources, cpnb_nodes_redundant, server_1]
          - availability_zones: {get_attr: [common_available_zones, az_lists, cpnb_001]}
      networks:
        get_attr: [network_setup_redundant, networks, as]
      timezone: {get_param: [cbam, extensions, timezone]}
      service_ip_meta:
        get_attr: [network_setup_redundant, service_ip_map]
      storage_meta:
        get_attr: [oam_nodes_redundant, volume_map]
      common_metadata:
        map_merge:
        - get_attr: [common_params, metadata]
