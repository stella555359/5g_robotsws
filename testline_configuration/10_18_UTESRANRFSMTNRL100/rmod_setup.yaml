K9202300357:
 
  preserve_flags: True                      # Creating empty file preserving logs is disabled when False
  send_commands_after_login_master:         # List of commands to be sent after console is logged in to RMOD master
    - sudo lmi-eth on                       # The result is one command: 'sudo lmi-eth on'


- Any other options and commands can be added - if needed:

example:

  switch_slave_node_id: 1
  node_switch_seconds: 240
  send_commands_after_connect:              # List of commands to be sent after console is connected to RMOD
    - 'du -h'                               # Quotas are not needed for a command without colons, but may be used
  send_commands_after_login_master:         # List of commands to be sent after console is logged in to RMOD master
    - sudo lmi-eth on                       # The result is one command: 'sudo lmi-eth on'
  send_commands_after_login_slave:          # List of commands to be sent after console is logged in to RMOD slave
    - 'telnet 1.1.1.1:3000'                 # Use quotas 'telnet 1.1.1.1:3000' when a colon needed inside the command
    - pwd
    - touch new_file                        # The result is three commands: 'telnet 1.1.1.1:3000', 'pwd', 'touch new_file'


