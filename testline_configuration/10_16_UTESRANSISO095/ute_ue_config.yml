UE_POOLS:
    AndroidUePool:
        inline_config:
            S8_G950F:                                     # UE name
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - Legacy
                STARTING_CELL: 0x6D01                     # I don't use (care) this line in Android Tests. You can type in this line anythink you want.
                CLASS: AndroidUe                          # UE type.
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to constructor when Ue instance is created.
                    serial_number: 'ce09171994cae0f00d'
                    configuration:                        # By Default ue key ('UE_1' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.42.172.116'
                        pyro_port: '9090'
                        python_libs: 'C:/Python38/Lib'
                        login: 'plwrranpz4'
                        password: 'Ut3pa5s#1be1'
                        server_dir: 'C:/pyro_server'
                        server_python: 'C:/Python38/python.exe'
                        data_transfer:
                            ssh:
                                host: '10.42.60.77'
                                user: 'syslab'
                                password: 'system'
                            iperf_options:
                                packet:  '1200B'
                            iperf_interface_ip: '10.42.129.2'
            NB_BG96:                                     # UE name - change if you want
                CAPABILITIES:                            # Capabilities that UE has. (as a list)
                    - CatM
                CLASS: QualcommNoLicenseUe               # UE type is Qualcomm
                CONSTRUCTOR_PARAMETERS:                  # Parameters that will be passed to QualcommNoLicenseUe constructor when Ue instance is created.
                    configuration:
                        serial_com: '11'                  # COM ID obtained from qualcomm modem
                        diag_com: '4'                     # Diagnostic COM ID
                        serial_baudrate: '115200'
                        iperf_loc: 'C:/iperf/iperf'       # Iperf.exe location on UE PC
                        ue_pc_ip: '10.42.172.116'         # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        network_mode_switch_method: 'ADB'
                        login:    'plwrranpz4'            # SSH login to UE PC
                        password: 'Ut3pa5s#1be1'             # SSH password to UE PC
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Python38/python.exe'     # UE PC python location
                        interface_name: 'Cellular 2'
                        reset_interface: 'yes'            # disable and enable mbn interface (interface_name) during Require Ue
                        enable_disable_cfun: 'yes'        # send AT+CFUN=1 before attach and AT+CFUN=0 before detach
                        data_transfer:                    # Iperf endpoint details
                            traffic_type: 'catm'
                            iperf_interval: '10'
                            ssh:
                                host: '10.42.60.77'      # Iperf endpoint IP
                                user: 'syslab'              # Iperf endpoint SSH login
                                password: 'system'      # Iperf endpoint SSH password
                            iperf_options:
                                packet: '640B'  # option -l
                            iperf_interface_ip: '10.42.129.2'
