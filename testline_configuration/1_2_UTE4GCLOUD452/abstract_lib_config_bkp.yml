          rf_paths_at_attenuator:
            - 2
            - 3
    ENB_1_CELL_2:
        rf_paths_of_cell:
        - used_attenuator: JFW_A04
          rf_paths_at_attenuator:
            - 6
            - 7
    ENB_2_CELL_1:
