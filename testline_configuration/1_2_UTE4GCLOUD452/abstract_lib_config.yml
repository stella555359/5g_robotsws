UE_POOLS:
    QualcommUePool:
        inline_config:
            UE_PC_13_UE_ENB_1_CELL_1:
                <<: *UEPC13
                CAPABILITIES:
                    - REAL_UE
                    - REAL_QUALCOMM_UE
                    - ENB_1_CELL_1
                    - PHYSICAL_UE_1
                    - 2CC_CA_UE
                    - SPID_10
                    - PLMN_A
                    - REL_12_MESSAGES
                    - PUBS_QCI
                STARTING_CELL: 0x1C401      #Cell ID 115713
            UE_PC_13_UE_ENB_1_CELL_2:
                <<: *UEPC13
                CAPABILITIES:
                    - REAL_UE
                    - REAL_QUALCOMM_UE
                    - ENB_1_CELL_2
                    - PHYSICAL_UE_1
