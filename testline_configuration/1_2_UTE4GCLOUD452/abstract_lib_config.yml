                    - REAL_UE
                    - REAL_QUALCOMM_UE
                    - ENB_2_CELL_1
                    - PHYSICAL_UE_1
                    - 2CC_CA_UE
                    - SPID_10
                    - PLMN_B
                    - REL_12_MESSAGES
                STARTING_CELL: 0x5A301      #Cell id in hex

            UE_PC_14_UE_ENB_1_CELL_1:
                <<: *UEPC14
                CAPABILITIES:
                    - REAL_UE
                    - REAL_QUALCOMM_UE
                    - ENB_1_CELL_1
