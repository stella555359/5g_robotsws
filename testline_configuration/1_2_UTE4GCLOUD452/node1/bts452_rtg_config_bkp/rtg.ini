[executor]
disable_all_logging         = no
;disable_all_logging         = yes
log_level                   = DEBUG
;log_level                   = ERROR
log_global_file_name        = log_global.txt
log_dir                     = /home/rtg/logs
ue_config_url               = file:///usr/rtg/etc/ue.db
ue_capabilities_url         = file:///usr/rtg/etc/uecap.ini
user_console_port           = 1234
duplex_mode                 = FDD
enb_type                    = FLEXI-OBSAI
;bandwidth                   = 10
bandwidth                   = 20
;default_apn                 = 1
scenario_dir                = /home/rtg/test/scenarios
tgr_stub = true
obsai_new_delay = 1

[hls]
scenario_dir                = /home/rtg/scenarios/HLS
generated_scenario_dir      = /home/rtg/test/scenarios/generated
logs_directory              = /home/rtg/logs/hls

[ip_configuration]
workstation_ip_addr         = 10.60.0.1
netmask                     = 255.255.255.0
lte_network_gw              = 19.19.19.19

[ctrl_1]
sectors                     = 1,,,
ip_addr                     = 10.60.0.10
user                        = rtg
password                    = rtg
hardware_platform           = FZP
fzm_rf                      = on
;axc_offset_dl               = -20480 ; for 10MHz
axc_offset_dl               = -10240
axc_offset_ul               = 0
;ribs = 1
[sector_1]
dl_earfcn                   = 1570
fzm_rf                      = on
fzm_rf_tx_1_attenuation     = 0
fzm_rf_tx_2_attenuation     = 0
;physical_cell_identity = 481
[tgr_1]
fake                        = on
ip_addr                     = 10.60.0.3
ss_ip_addr_pool             = 186.127.0.0/16
ss_interface                = eth1
side                        = SS
user                        = root
password                    = root
;rtg/rtg
raw_udp_rcv                 = 50000

[tgr_2]
fake                        = on
ip_addr                     = 10.60.0.2
ue_interface                = eth0
side                        = MS
user                        = rtg
password                    = root
;;rtg/rtg
raw_udp_rcv                 = 50000

;[apn_1]
;name                        = ipsl-ue-pc-6
;name                        = obeliks
;name                        = kokosz-non-routable
;tgrs_gw_addresses           = 255.255.255.0

