UE_POOLS:
    AndroidUePool:                                   # Ue Pool class defined by library
        inline_config:
            UE_1: # UE name - change if you want
                CAPABILITIES: # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_MEDIATEK_UE_NSA
                    - REAL_ANDROID_UE_NSA
                CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: '0123456789ABCDEF'              # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration: # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.44.72.6'          # UE PC IP address
                        pyro_port: '9091'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'wro5grrm'                 # SSH login to UE PC
                        password: '5gpass!1'              # SSH password to UE PC
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe' # UE PC python location
                        network_mode_switch_method: 'ADB'
                        qualcomm_prototype: 'yes'
                        reset_interface: 'yes'             # disable and enable mbn interface (interface_name) during Require Ue
                        clear_server_files: 'yes'
                        clear_logs: 'yes'
                        processes_to_kill: # processes to kill on UE PC - anything that may interrupt a test case
                            - 'notepad++'
                            - 'putty'
                            - 'adb'
                            - 'iperf'
                        data_transfer: # Application Server (for Iperf) details
                            app_servers:
                                APP_1: # iperf server name
                                    host: '10.42.61.65'   # Application Server IP
                                    user: '5g'            # Application Server SSH login
                                    password: '2019H@slo' # Application Server SSH password
                                    iperf_interface_ip: '10.42.197.170' # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)
                            iperf_options:
                                packet: '1400'
                                buffer: '2M'
            UE_2:
                CAPABILITIES:                        # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE_SA
                CLASS: AndroidUe           # UE type is Qualcomm so QualcommNoLicense class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:
                    serial_number: 'HZQN1876AAKA2001381'     # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    configuration:                   # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.44.72.6'      # UE PC IP address
                        pyro_port: '9090'            # TCP Port number on UE PC on which Pyro server will be started
                        login: 'wro5grrm'            # SSH login to UE PC
                        password: '5gpass!1'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server'    # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe' # UE PC python location
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
                        clear_logs: 'yes'
                        qualcomm_prototype: 'yes'
                        processes_to_kill:           # processes to kill on UE PC - anything that may interrupt a test case
                            - 'uemanager'
                            - 'putty'
                        data_transfer: # Application Server (for Iperf) details
                            app_servers:
                                APP_1: # iperf server name
                                    host: '10.42.61.65'   # Application Server IP
                                    user: '5g'            # Application Server SSH login
                                    password: '2019H@slo' # Application Server SSH password
                                    iperf_interface_ip: '10.42.197.170' # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)
                            iperf_options:
                                packet: '1400'
                                buffer: '2M'
