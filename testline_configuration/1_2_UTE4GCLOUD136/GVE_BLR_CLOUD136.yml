ATTENUATORS:
    TopYoung:
        TYPE: TopYoung                               # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.hytem.HytemAttenuator
        CONSTRUCTOR_PARAMETERS:
            ip: '10.41.209.234'
            port: 3001
            min_attenuation: 0
            max_attenuation: 90

