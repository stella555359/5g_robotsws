                    configuration:
                        serial_com: '51'                                # COM ID associated to the Quectel Modem (to be found out using Device Manager Tool)
                        diag_com: '46'                                  # Diagnostic COM ID / USB DM COM associated to the Quectel Modem (to be found out using Device Manager Tool)
