UE_POOLS:
    AndroidUePool:
        inline_config:
            QUECTELBG961:                      # UE name
                CAPABILITIES:                 # Capabilities that UE has. (as a list)
                    - CatM_UE1
                    - CatM_QCI9
                    - CatM
                STARTING_CELL: 0x33793       # Cell ID to which UE should attach
                CLASS: QualcommNoLicenseUe    # UE type : UE based on a Qualcomm chip and controlled via AT commands
