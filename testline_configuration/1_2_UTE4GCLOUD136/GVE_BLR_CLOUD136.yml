                                password: 'ftpuser'      # Iperf endpoint SSH password
#                            iperf_options:
#                                qci:
#                                    2: 12002
#                                    3: 13003
#                                    4: 14004
                            iperf_interface_ip: '10.58.241.100'         # Application Server interface used for data transfer (-B iperf parameter)
                            iperf_options:
                                packet: '1024'
                            ping:
                                ping_host_ip: '10.58.241.100' # Remote host for ping (Start Data Transfer icmp protocol)
                                ping_count: '70'            # ping -c (count) option
                                allowed_packet_loss: '100'    # Allowed packet loss in %



