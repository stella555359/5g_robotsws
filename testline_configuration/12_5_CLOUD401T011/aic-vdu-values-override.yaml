    #   pcp: "2"
    # - Description: IP allocation pool for fhm interface
    # - Note: ipv4 pool information is mandantory for fhm, not support ipv6
    ippool:
      ipv4:
        start: "192.168.254.33"
        end: "192.168.254.60"
        subnet: "192.168.254.0/26"
  xpbipxp:
    # - Description: bip network name used for interface xpbipxp
    name: "xpbip"
    # - Description: Guest VLAN information for xpbip interface used by xipif
    # vlanInfo:
    #   vlanId: "714"

