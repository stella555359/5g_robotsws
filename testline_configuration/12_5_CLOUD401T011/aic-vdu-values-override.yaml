# ====== Vista Creek and dptrace function configuration running in lihi conatiner=====
l1hi:
  resources:
    limits:
      # - Description: fecVFNum is that number of virtual function.
      # - Note: it is forbidden to change, default: 1
      #         The Vista Creek accelerator function has been supported as default.
      #         If there is no Vista Creek accelerator function, this value should be set to'0',
      #         else this value should be set to 1
      fecVFNum: "0"
      # - Description:Enable or disable fast cplane feature
      # - Note: RCP2029 enable or not. Available value is 'true' or 'false'.
      #         false means disable RCP2029 feature as default.
      #         true means enable RCP2029 feature.
      #         This functions should be enabled together on FHGW and vDU side, if FHGW hasn't included this function, this value
      #         should be set to false on VDU side, or this value should be set to true.
      fast_cplane_enabled: false
  dptrace:
    # - Description: Enable or disable l1 container dptrace function. 0 means disable, 1 means enable.
    enable: "0"
    # - Description: Enable or disable l1 container payload dump. 0 means disable payload dump, 1 means enable payload dump.
    dump_payload: "0"
    # - Description: Config l1 container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1.
    # - Note: Maxmum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
    filter: "none:none"

# ====== dptrace function configuration running in l2hi conatiner =====
l2hi:
  dptrace:
    # - Description: Enable or disable l2hi container dptrace function. 0 means disable, 1 means enable.
    enable: "0"
    # - Description: Enable or disable l2hi container payload dump. 0 means disable payload dump, 1 means enable payload dump.
    dump_payload: "0"
    # - Description: Config l2hi container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1.
    # - Note: Maxmum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
    filter: "none:none"

# ====== dptrace function configuration running in l2hi conatiner =====
l2rt:
  dptrace:
    # - Description: Enable or disable l2rt container dptrace function. 0 means disable, 1 means enable.
    enable: "0"
    # - Description: Enable or disable l2rt container payload dump. 0 means disable payload dump, 1 means enable payload dump.
    dump_payload: "0"
    # - Description: Config l2rt container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1. 
    # - Note: Maxmum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
    filter: "none:none"

# ======ne3sagent configuration running in oam conatiner=====
oam:
  ne3sagent:
    configuration:
      # Configuration for Ne3sAgent daemon to startup. Please adjust according to environment and needs.
      # Interface name in container. Ne3sAgent will listen its IP address.
      # Name of the interface used for ne3s external connection.
      # Note: if guest vlan applied for oam interface, ip_interface should be the same as oam vlanName
      ip_interface: "oam3"
      # TLS enable or not. Available value is 'true' or 'false'.
      # Ne3sAgent only support non-TLS mode in container currently.
      is_tls_enabled: false
# ========configuration about dhcp container ========
dhcp:
  service:
    # v4Iface define names of your network interfaces to listen on.
    v4Iface: fhm4
    # v4Pools define the actual part of your subnet that is governed
    v4Pools: 192.168.254.34 - 192.168.254.60
    # v4Subnet define the whole subnet.
    v4Subnet: 192.168.254.0/26

    # DHCP vendor specific information of master agent ip and port number
    option43_vendor_specific_information_master_agent_ip: "192.168.254.33"
    option43_vendor_specific_information_port_number: "13001"

# ========configuration about APIGW ========
apigw:
  securityContext:
    runAsUser: 763

# ========configuration about HTTPD ========
httpd:
  securityContext:
    runAsUserHttpd: 9999

# - Description: select node to deploy oam pod. it will be automatic allocation by system if the value is blank
# - Note: please use the value of kubernetes.io/hostname.it's usually a ip address,
#         the value can be fetched by command: kubectl get nodes --show-labels
oamnodeAffinityIP: "192.168.4.26"
# - Description: select node to deploy up pod,it will be automatic allocation by system if the value is blank
# - Note: please use the value of kubernetes.io/hostname.it's usually a ip address,
#         the value can be fetched by command: kubectl get nodes --show-labels
upnodeAffinityIP: "192.168.4.26"