# Please follow with common structure:
# UE_POOLS:
#   AndroidUePool:                # This is for TA UE phones
#     ...
#     ...
#   MCGUePool:                    # This is for MCG UE phones
#     ...
#     ...
# ------------------------------------------------------------------
# For ta_ue (UEManager) usage change only:
# - serial number (can be found on UE PC when type in cmd-line 'adb devices')
# - RAT   --- possible values WCDMA, LTE, GSM
# - ue_pc_ip
# - login (ssh login for your UE PC)
# - password (for ssh)
# - host      |
# - user      | information about data transfer end point (FTP server)
# - password  |
#
# Example:
#
# TA_UE_ROOT:
#     UE_POOLS:
#         AndroidUePool:
#             inline_config:
#                 UE_1:
#                     CAPABILITIES:
#                         - REAL_UE
#                         - REAL_ANDROID_UE
#                         - RAT
#                     STARTING_CELL: 0x6D01
#                     CLASS: AndroidUe
#                     CONSTRUCTOR_PARAMETERS:
#                         serial_number: '12345abc'
#                         configuration:
#                             ue_pc_ip: 'X.X.X.X'
#                             pyro_port: '8080'
#                             login: 'user'
#                             password: 'pass'
#                             server_dir: 'C:/pyro_server'
#                             server_python: 'C:/Python27/python.exe'
#                             data_transfer:
#                                 ssh:
#                                     host: '10.44.44.167'
#                                     user: 'syslab'
#                                     password: 'system'

# For MCG change only:
# - UE_* - UE number in structure
# - UARFCN
# - SCR_CODE
# - IMSI
# - PS_tech
# Example MCG UE map:
#
# TA_UE_ROOT:
#     UE_POOLS:
#        MCGUePool:
#            inline_config:
#                UE_1:
#                    CAPABILITIES:
#                        - CAPABILITIES=REAL_UE
#                        - REAL_MCG_UE
#                    STARTING_CELL:
#                        - UARFCN=10763
#                        - SCR_CODE=1
#                    CLASS: MCGUe
#                    CONSTRUCTOR_PARAMETERS:
#                          IMSI: '244084600000476'
#                          PS_tech: 'R99'
#                UE_2:
#                    CAPABILITIES:
#                        - CAPABILITIES=REAL_UE
#                        - REAL_MCG_UE
#                    STARTING_CELL:
#                        - UARFCN=10813
#                        - SCR_CODE=8
#                    CLASS: MCGUe
#                    CONSTRUCTOR_PARAMETERS:
#                          IMSI: '244084600000478'
#                          PS_tech: 'HSPA'
