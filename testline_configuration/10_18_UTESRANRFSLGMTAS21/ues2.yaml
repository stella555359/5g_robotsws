#  ip: x.x.x.x
#  password: xxx
#  username: yyy
# ftp_lte:     - LTE traffic server information
#  ip: x.x.x.x
#  password: xxx
#  username: yyy
# gsm_ues: []   - empty UE serial number or
# gsm_ues:
