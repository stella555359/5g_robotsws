UE_POOLS:
    AndroidUePool:
        inline_config:
            UE1:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - Legacy_1
                STARTING_CELL: 0x4A3                     # Cell ID to which UE should attach
                CLASS: AndroidUe
                #CLASS: QualcommNoLicenseUe                # UE type is Qualcomm
                CONSTRUCTOR_PARAMETERS: 
                    serial_number: '38dfb053'
                    configuration:
                        serial_com: '5'                   # COM ID obtained from qualcomm modem
                        diag_com: '3'                    # Diagnostic COM ID
                        iperf_loc: 'c:/tools/Iperf/iperf.exe'       # Iperf.exe location on UE PC
                        interface_name: 'Cellular 19'    # UE PC Qualcomm network interface name
#                        interface_name: 'Cellular'
                        ue_pc_ip: '10.43.13.214'        # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'inbabtslabuser'                  # SSH login to UE PC
                        password: 'BT5l@bus3rl0g1n'              # SSH password to UE PC
                        server_dir: 'c:/pyro_server'      # UE PC directory where all server files will be copied from cygwin POV
                        server_python: 'C:/Python27/python.exe'     # UE PC python location from Windows POV
                        enable_disable_cfun: 'no'
                        cid: '1'
#                        restart_wwansvc: 'no'
                        clear_logs: 'yes'
                        processes_to_kill:                # phrases based on which processes names will be found and killed before test (case insensitive)
                            - 'putty'
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                            - 'python'
                            - 'AtmnServer'
                        data_transfer:                    # Iperf endpoint details
                            ssh:
                                host: '10.111.70.27'
                                user: 'ftpuser'             # Iperf endpoint SSH login
                                password: 'ftpuser'      # Iperf endpoint SSH password
                            iperf_interface_ip: '10.111.70.27'
                            iperf_options:
                                qci:
                                  1: 5901
                                  2: 5902
                                  3: 5903
                                  4: 5904
                                  5: 5905
                                  6: 5906
                                  7: 5907
                                  8: 5908
                                  9: 5909
                                  10: 5910
                                  11: 5911
                                  12: 5912
                                
