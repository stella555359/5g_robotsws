UE_POOLS:
    AndroidUePool:
        inline_config:
            Askey:                                # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - nrcel_legacy
                CLASS: QualcommNoLicenseUe                # UE type is Qualcomm
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to QualcommNoLicenseUe constructor when Ue instance is created.
                    configuration:
                        serial_com: '9'                  # COM ID obtained from qualcomm modem
                        diag_com: '20'                    # Diagnostic COM ID
                        #serial_baudrate: '9600'
                        ue_pc_ip: '10.42.125.32'           # UE PC IP address
                        login:    'plwr4gsiso'           # SSH login to UE PC
                        password: 'Ut3pa5s#1be1'              # SSH password to UE PC
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        network_mode_switch_method: 'ADB'
                        interface_name: 'Cellular'
                        reset_interface: 'yes'      # disable and enable mbn interface (interface_name) during Require Ue
                        enable_disable_cfun: 'yes'  # send AT+CFUN=1 before attach and AT+CFUN=0 before detach
                        processes_to_kill:          # processes to kill on UE PC - anything that may interrupt a test case
                            - 'putty'
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                        data_transfer:                     # Iperf endpoint details
                            iperf_path: 'C:/iperf/iperf'       # Iperf.exe location on UE PC
                            iperf_interval: '1'
                            ssh:
                                host: '10.42.129.2'        # Iperf endpoint IP
                                user: 'feve'        # Iperf endpoint SSH login
                                password: 'fevepass'      # Iperf endpoint SSH password
                            iperf_options:
                                packet: '1024B'  # option -l
#                        data_transfer:                     # Iperf endpoint details
#                            iperf_path: 'C:/iperf/iperf'       # Iperf.exe location on UE PC
#                            iperf_interval: '5'
