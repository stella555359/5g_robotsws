PA_NR:                                                 #ID of Programmable Attenuator, used as reference in env_config_1.yaml
    ATT1:                                              #ID for attenuator nb 1
        ip: 10.255.5.123                               #IP of Programmable Attenuator
        type: RadioRack                                #Type of the PA [possible values: Hytem, JFW, RadioRack, TopYoung]
        port: 50000                                    #Attenuator’s port for management, e.q. for RadioRack value should be 50000
        atten_ports: 1 2 3 4 5 6 7 8                   #List of attenuation lines ports separated by space
        ants:
            1M240507386:                                   #RMOD 3 Serial Number
                ANT1: 1 2 3 4
            1M235231309:                                   #RMOD 1 Serial Number
                ANT1: 5 6 7 8
    ATT2:                                              #ID for attenuator nb 1
        ip: 10.255.5.252                               #IP of Programmable Attenuator
        type: RadioRack                                #Type of the PA [possible values: Hytem, JFW, RadioRack, TopYoung]
        port: 50000                                    #Attenuator’s port for management, e.q. for RadioRack value should be 50000
        atten_ports: 1 2 3 4 5 6 7 8                 #List of attenuation lines ports separated by space
        ants:
            1M235231319:                                   #RMOD 2 Serial Number
                ANT1: 5 6 7 8
              
