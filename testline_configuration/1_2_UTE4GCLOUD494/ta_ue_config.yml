UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_NB_IOT_N51:                                          # UE name - change if you want
                CAPABILITIES:                                       # Capabilities that UE has. (as a list)
                    - NBIOT1
#                STARTING_CELL: 0x33101                             # Cell ID to which UE should attach
                CLASS: QualcommNoLicenseUe                          # UE type is Qualcomm
                CONSTRUCTOR_PARAMETERS:                             # Parameters that will be passed to QualcommNoLicenseUe constructor when Ue instance is created.
                    configuration:
                        serial_com: '6'                             # COM ID obtained from qualcomm modem
                        diag_com: '7'                               # Diagnostic COM ID
                        ue_pc_ip: '10.53.203.85'                     # UE PC IP address
                        pyro_port: '9090'                           # TCP Port number on UE PC on which Pyro server will be started
                        login:    'inbabtslabuser'                       # SSH login to UE PC
                        password: 'BT5l@bus3rl0g1n'                      # SSH password to UE PC
                        server_dir: 'c:/pyro_server'                # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
#                        interface_name:   'Cellular'
                        processes_to_kill:                          # List of phrases based on which the processes are found and killed
                            - 'putty'
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                            - 'cmd'
                            - 'notepad'
                            - 'notepad++'
#                            - 'bash'
                        clear_logs: 'yes'                 # clears server_dir/logs folder before connecting to server
                        clear_server_files: 'yes'         # clears server_dir/ta_ue_plugin_android folder on UE PC, forcing new files upload
                        turn_off_on_firewall: 'no'       # turn off firewall before connecting to server and on before shutdown. Windows only (UAC disabled)
                        enable_disable_cfun: 'yes'
                        reset_interface: 'yes'
                        data_transfer:                              # Iperf endpoint details
                            ssh:
                                host: '10.111.67.29'                 # Iperf endpoint IP
                                user: 'ftpuser'                 # Iperf endpoint SSH login
                                password: 'ftpuser'               # Iperf endpoint SSH password
                            iperf_loc: 'C:/iperf/'                  # Iperf.exe location on UE PC
                            traffic_type: 'nbiot'                   # sets rules for parsing server output depending on traffic type
                            iperf_interval: '1'                     # Iperf interval in seconds. Default: 1s ; 0 -> 1s
                            iperf_path: 'C:/iperf/'                 # Iperf.exe location on UE PC
                            iperf_interface_ip: '10.111.67.29'
                            iperf_options:
                                packet: '1024B'                     # option -l
#                                dualtest: ''                       # option -d{noformat}
            UE_NB_IOT_N52:                                          # UE name - change if you want
                CAPABILITIES:                                       # Capabilities that UE has. (as a list)
                    - NBIOT2
#                STARTING_CELL: 0x33101                             # Cell ID to which UE should attach
                CLASS: QualcommNoLicenseUe                          # UE type is Qualcomm
                CONSTRUCTOR_PARAMETERS:                             # Parameters that will be passed to QualcommNoLicenseUe constructor when Ue instance is created.
                    configuration:
                        serial_com: '27'                             # COM ID obtained from qualcomm modem
                        diag_com: '29'                               # Diagnostic COM ID
                        ue_pc_ip: '10.53.203.85'                     # UE PC IP address
                        pyro_port: '9090'                           # TCP Port number on UE PC on which Pyro server will be started
                        login:    'inbabtslabuser'                       # SSH login to UE PC
                        password: 'BT5l@bus3rl0g1n'                      # SSH password to UE PC
                        server_dir: 'c:/pyro_server'                # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
#                        interface_name:   'Cellular 4'
                        processes_to_kill:                          # List of phrases based on which the processes are found and killed
                            - 'putty'
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                            - 'cmd'
                            - 'notepad'
                            - 'notepad++'
#                            - 'bash'
                        clear_logs: 'yes'                 # clears server_dir/logs folder before connecting to server
                        clear_server_files: 'yes'         # clears server_dir/ta_ue_plugin_android folder on UE PC, forcing new files upload
                        turn_off_on_firewall: 'no'       # turn off firewall before connecting to server and on before shutdown. Windows only (UAC disabled)
                        enable_disable_cfun: 'yes'
                        reset_interface: 'yes'
                        data_transfer:                              # Iperf endpoint details
                            ssh:
                                host: '10.111.67.29'                 # Iperf endpoint IP
                                user: 'ftpuser'                 # Iperf endpoint SSH login
                                passmstsce: 'nbiot'                   # sets rules for parsing server output depending on traffic type
                            iperf_interval: '1'                     # Iperf interval in seconds. Default: 1s ; 0 -> 1s
                            iperf_path: 'C:/iperf/'                 # Iperf.exe location on UE PC
                            iperf_interface_ip: '10.111.67.29'
                            iperf_options:
                                packet: '1024B'                     # option -l
