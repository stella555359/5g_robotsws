UE_POOLS:
        AndroidUePool:
            inline_config:
                UE_1:                                    # UE name - change if you want
                    CAPABILITIES:                             # Capabilities that UE has. (as a list)
                        - REAL_UE
                        - REAL_ANDROID_UE_1
                        - ANDROID_12
                        - NR1
                    CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                    CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                        serial_number: '14cd501b'     # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                        configuration:
                            ue_pc_ip: '10.5.53.180'           # UE PC IP address
                            pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                            login: 'rfsharing'                   # SSH login to UE PC
                            password: 'Nokia2022!@1'             # SSH password to UE PC
                            server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                            server_python: 'C:/Python38/python.exe'     # UE PC python location
                            turn_artifactory_update_off: 'yes'     # comentariu
                            data_transfer:
                              # iperf_path: 'C:/iperf/'  # iperf.exe location on UE PC - please use Unix like separators
                                iperf_interval: '5'                 # Iperf interval in seconds (default: 1)
                                app_servers:
                                    APP1:
                                       host: '10.5.56.28'          # Iperf endpoint IP
                                       user: 'ftp_5g'              # Iperf endpoint SSH login
                                       password: 'Aikon_4321'      # Iperf endpoint SSH password
                                       iperf_interface_ip: '10.5.61.131' # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)
                                iperf_options:
                                    packet: '1024B'
                                    buffer: '1500M'

                UE_2:                                    # UE name - change if you want
                    CAPABILITIES:                             # Capabilities that UE has. (as a list)
                        - REAL_UE
                        - REAL_ANDROID_UE
                        - ANDROID_11
                        - NR2
                    CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                    CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                        serial_number: '343748ae'   # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                        configuration:
                            ue_pc_ip: '10.5.53.181'           # UE PC IP address
                            pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                            login: 'rfsharing'                   # SSH login to UE PC
                            password: 'Nokia2022!@1'             # SSH password to UE PC
                            server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                            server_python: 'C:/Python38/python.exe'     # UE PC python location
                            turn_artifactory_update_off: 'yes'     # comentariu
                            data_transfer:
                              # iperf_path: 'C:/iperf/'  # iperf.exe location on UE PC - please use Unix like separators
                                iperf_interval: '5'                 # Iperf interval in seconds (default: 1)
                                app_servers:
                                    APP1:
                                       host: '10.5.56.28'          # Iperf endpoint IP
                                       user: 'ftp_5g'              # Iperf endpoint SSH login
                                       password: 'Aikon_4321'      # Iperf endpoint SSH password
                                       iperf_interface_ip: '10.5.61.131' # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)
                                iperf_options:
                                    packet: '1024B'
                                    buffer: '1500M'
