apiVersion: com.nokia.k8s.cnf/v1alpha1
kind: RANCNF
metadata:
  name: vdu8688
  namespace: cran2lcm
spec:
  cnfConfig:
    cnfSWBuild: vDUCNF00_0.300.30352-amd64
    imageRegistry: ccr-wl-vrf-vdu-01.wroclaw.nsn-rdnet.net:443/vdu
    timeZone: Europe/Warsaw
  ranCnfConfig:
    apiVersion: v1
    kind: RanCnfConfig
    metadata:
      name: rancnfconfig
    spec:
      cniType: sriov
      siteDescription: MRBTS-8688
      cnflayout:
        cnfLayout: DRAN
        halfUpInstanceCount: 0
        l2nrtCount: 1
        upInstanceCount: 1
        deploymenttype:
          l2nrtDeploymentType: "NR_L2NRT_10vCPU"
          l2rtDeploymentType: "NR_L2RT_20vCPU"
      stackTraceEnabled: false
      storage:
        storageClassName: lvms-vg1
        accessModes: "ReadWriteOnce"
        pvcName: vdupvc
      network:
        fastPathBipPool: openshift.io/sriov_vfio_2
        fastPathF1uPool: openshift.io/sriov_vfio_2
        slowPathCommonPool: openshift.io/sriov_netdevice_2
        oamif:
          - owner: oamext
            oamIfId: 1
            vlanif:
              vid: 558
              mtu: 1500
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.42.139.132/25
                role:
                  - "oam"
                  - "certman-server"
                  - "tracecontroller"
                rangeEnd: 10.42.139.132/25
            iprt:
              - ipRtId: 1
                gateway: 10.42.139.129
        f1cif:
          - owner: cprt
            f1cIfId: 1
            vlanif:
              vid: 566
              mtu: 1500
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.255.24.4/25
                role:
                  - "F1-C"
                rangeEnd: 10.255.24.4/25
        f1uif:
          - owner: l2nrt
            f1uIfId: 1
            vlanif:
              vid: 565
              mtu: 1500
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.255.23.132/25
                rangeEnd: 10.255.23.132/25
                role:
                  - "Tracing"
                  - "F1-U"
        bipif:
          - bipIfId: 1
            owner: l2rt
            vlanif:
              vid: 102
          - bipIfId: 2
            owner: l2nrt
            vlanif:
              vid: 102
        fronthaul:
          mode: direct-connect
          dc:
            cPRIAddressPool:
            - 192.170.0.0/24
            fhmInternalNetworkIpPool: 192.168.251.0/27
            fhmMasterAgentIP:
            - 70.70.70.1/32
            eCPRIAddressPool:
            - 192.169.0.0/16
            dhcp:
              - dhcpId: 1
                optdata:
                    optdataId: 1
                    alwaysSend: true
                    code: 61
                pool:
                  - poolId: 1
                    rangeStart: 192.168.254.34/26
                    rangeEnd: 192.168.254.60/26
                    ruProtocol: Nokia
            fhmif:
              - fhmIfId: 1
                vlanif:
                  vid: 295
                  mtu: 1500
                ipinfo:
                  - ipInfoId: 1
                    rangeStart: 192.168.254.33/26
                    role:
                      - "fhm"
                    rangeEnd: 192.168.254.33/26
            fhif:
              - fhIfId: 1
                owner: ahm-a
                fhmif:
                - ethif:
                    defaultUnderlyingIface: ecpri5
                  fhmIfId: 1
                  vlanif:
                    vid: 295
                    vlName: fhmplane02
                - ethif:
                    defaultUnderlyingIface: ecpri4
                  fhmIfId: 2
                  vlanif:
                    vid: 295
                    vlName: fhmplane01
                fhsif:
                  - fhsIfId: 1
                    ethif:
                      defaultUnderlyingIface: ecpri4
                    vlanif:
                      vid: 295
                fhucif:
                - ethif:
                    defaultUnderlyingIface: ecpri5
                  fhucIfId: 1
                  vlanif:
                    vid: 301
                    vlName: fhucplane02
                - ethif:
                    defaultUnderlyingIface: ecpri4
                  fhucIfId: 2
                  vlanif:
                    vid: 301
                    vlName: fhucplane01
                sn: L1242202618
