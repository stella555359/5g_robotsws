apiVersion: com.nokia.k8s.cnf/v1alpha1
kind: RANCNF
metadata:
  name: vcu8688
  namespace: cran8688lcm
spec:
  cnfConfig:
    cnfSWBuild: vCUCNF00_0.250.29770-amd64
    timeZone: Europe/Warsaw
    imageRegistry: ccr-wl-vrf-vcu-01.wroclaw.nsn-rdnet.net:443/vcu
  ranCnfConfig:
    apiVersion: v1
    kind: RanCnfConfig
    metadata:
      name: rancnfconfig
    spec:
      cniType: sriov
      siteDescription: MRBTS-8688
      cnflayout:
        cpclInstanceCount: 1
        cpifInstanceCount: 1
        cpueCount: 1
        minCapacityCpue: 1
        minCapacityUpue: 1
        upueCount: 1
        upueFlavor: "small"
        cnfLayout: mini
      stackTraceEnabled: false
      storage:
        storageClassName: lvms-vg1
        accessModes: ReadWriteOnce
      network:
        fastPathDevicePool: openshift.io/sriov_vfio_1
        slowPathDevicePool: openshift.io/sriov_netdevice_1
        oamif:
          - oamIfId: 1
            owner: oamext
            vlanif:
              vid: 559
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.42.140.4/25
                role:
                  - "oam"
                  - "certman-server"
                  - "tracecontroller"
                rangeEnd: 10.42.140.4/25
            iprt:
              - ipRtId: 1
                gateway: 10.42.140.1
        f1cif:
          - f1cIfId: 1
            owner: cpif
            vlanif:
              vid: 568
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.255.25.4/25
                role:
                  - "F1-C"
                rangeEnd: 10.255.25.4/25
        x2cif:
          - x2cIfId: 1
            owner: cpif
            vlanif:
              vid: 564
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.255.23.4/25
                role:
                  - "X2-C"
                rangeEnd: 10.255.23.4/25        
        ngcif:
          - ngcIfId: 1
            owner: cpif
            vlanif:
              vid: 561
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.44.81.4/25
                role:
                  - "NG-C"
                rangeEnd: 10.44.81.4/25
        xncif:
          - xncIfId: 1
            owner: cpif
            vlanif:
              vid: 548
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.255.29.4/25
                role:
                  - "Xn-C"
                rangeEnd: 10.255.29.4/25
        f1uif:
          - f1uIfId: 1
            owner: upue
            vlanif:
              vid: 567
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.255.24.132/25
                role:
                  - "F1-U"
                  - "Tracing"
                rangeEnd: 10.255.24.132/25
        x2uif:
          - x2uIfId: 1
            owner: upue
            vlanif:
              vid: 563
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.255.22.132/25
                role:
                  - "X2-U"
                rangeEnd: 10.255.22.132/25
        s1uif:
          - s1uIfId: 1
            owner: upue
            vlanif:
              vid: 562
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.255.22.4/25
                role:
                  - "S1-U"
                rangeEnd: 10.255.22.4/25    
        nguif:
          - nguIfId: 1
            owner: upue
            vlanif:
              vid: 560
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.42.220.4/25
                role:
                  - "NG-U"
                rangeEnd: 10.42.220.4/25
        xnuif:
          - xnuIfId: 1
            owner: upue
            vlanif:
              vid: 549
            ipinfo:
              - ipInfoId: 1
                rangeStart: 10.255.29.132/25
                role:
                  - "Xn-U"
                rangeEnd: 10.255.29.132/25
        e1if:
          - e1IfId: 1
            owner: cpif
            vlanif:
              vid: 3895
            ipinfo:
              - ipInfoId: 1
                rangeStart: 192.168.2.12/24
          - e1IfId: 2
            owner: cpnrt
            vlanif:
              vid: 3895
            ipinfo:
              - ipInfoId: 1
                rangeStart: 192.168.2.13/24
        fastPathDevicePoolBackup: openshift.io/sriov_vfio_2
        slowPathDevicePoolBackup: openshift.io/sriov_netdevice_2
