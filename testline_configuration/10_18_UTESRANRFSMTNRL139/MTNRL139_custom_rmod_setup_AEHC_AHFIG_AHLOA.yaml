K9220312556:
  preserve_flags: True                      # Creating empty file preserving logs is disabled when False
  send_commands_after_connect:
    - 'while true; do echo "=================="; setDate=`date`; echo $setDate; echo "==================" ; ps | grep -i syscon ; echo "=================="; ps | grep -i ccs ; echo "df -h" ; df -h ; echo "dmesg:" ;dmesg | tail -n 50 ; echo "ps:" ;ps ;echo "messages:" ;cat /var/log/messages | tail -n 50 ; echo "runtime:"; cat /var/log/runtime.log | tail -n 50; sleep 5; done'
  send_commands_after_login_master:         # List of commands to be sent after console is logged in to RMOD master
    - 'while true; do echo "=================="; setDate=`date`; echo $setDate; echo "==================" ; ps | grep -i syscon ; echo "=================="; ps | grep -i ccs ; echo "df -h" ; df -h ; echo "dmesg:" ;dmesg | tail -n 50 ; echo "ps:" ;ps ;echo "messages:" ;cat /var/log/messages | tail -n 50 ; echo "runtime:"; cat /var/log/runtime.log | tail -n 50; sleep 5; done'                       # The result is one command: 'sudo lmi-eth on'
  
