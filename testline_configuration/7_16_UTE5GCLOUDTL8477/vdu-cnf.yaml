aic-vdu-l2nrt:
  deploymentType: NR_L2NRT_10vCPU
aic-vdu-l2rt:
  deploymentType: NR_L2RT_20vCPU
global:
  image:
    registry: ccr-wg-vrf-vdu-01.wroclaw.nsn-rdnet.net:443/vdu
  devicePoolList:
    fastPathBipPool: openshift.io/sriov_vfio_1
    fastPathF1uPool: openshift.io/sriov_vfio_1
    fastPathF1uPoolBackup: ""
    slowPathCommonPool: openshift.io/sriov_netdevice_1
    slowPathCommonPoolBackup: ""
  externalNetwork:
    ahm-a:
      sn: "L1241207373"
      fhm:
      - defaultUnderlyingIface: ecpri4
        vid: "295"
        vlName: fhmplane01
      fhs:
      - defaultUnderlyingIface: ecpri4
        ipInfo:
        - rangeEnd: ""
          rangeStart: ""
          role:
          - fhsm
          - fhss
          subnet: ""
        vlanInfo:
        - vid: ""
          vlName: fhsplane01
      fhuc:
      - defaultUnderlyingIface: ecpri4
        pcp: "7"
        vid: "301"
        vlName: fhucplane01
    f1:
      ipInfo:
      - rangeEnd: 10.255.9.103
        rangeStart: 10.255.9.103
        role:
        - Tracing
        - F1-U
        subnet: 10.255.9.0/24
        type: physical
      vlanInfo:
        defaultUnderlyingIface: f1
        mtu: 1500
        secUnderlyingIface: f1s
        vlName: f1uplane
        vid: "760"    
    f1c:
      ipInfo:
      - rangeEnd: 10.255.8.103
        rangeStart: 10.255.8.103
        role:
        - F1-C
        subnet: 10.255.8.0/24
        type: physical
      vlanInfo:
        vid: "759"
        defaultUnderlyingIface: f1c
        mtu: 1500
        secUnderlyingIface: f1cs
        vlName: f1cplane
      l2biphi:
        vlanInfo:
        vid: "3895"
      l2biprt:
        vlanInfo:
        vid: "3895"
    fhm:
      ipInfo:
      - rangeEnd: 192.168.254.33
        rangeStart: 192.168.254.33
        role:
        - fhm
        subnet: 192.168.254.0/26
        type: physical
      vlanInfo:
        defaultUnderlyingIface: fhm
        mtu: 1500
        pcp: "2"
        vid: "295"
        vlName: fhmplane 
    oam:
      ipInfo:
      - rangeEnd: 10.42.38.197
        rangeStart: 10.42.38.197
        role:
        - oam
        - certman-server
        - tracecontroller
        subnet: 10.42.38.192/26
        type: physical
      policyRouteInfo:
      - gateway: 10.42.38.193
        orderNumber: "5"
        table: "2"
      vlanInfo:
        defaultUnderlyingIface: oam
        mtu: 1500
        secUnderlyingIface: oams
        vid: "761"
        vlName: mcplane
    l2biphi:
      vlanInfo:
        vid: "3895"
    l2biprt:
      vlanInfo:
        vid: "3895"
  fhmIpForDC:
    role:
    - fhm
  storageClassName: lvms-vg1
  fhmSiso: switch-network
  name_convention:
    container_prefix:
    - ctr
    - _NAMESPACE_
    deployment_prefix:
    - ute
    - _NAMESPACE_
    pod_prefix:
    - ute
    - _NAMESPACE_
    statefulset_prefix:
    - ute
    - _NAMESPACE_
  pvcName: vdu-pvc
