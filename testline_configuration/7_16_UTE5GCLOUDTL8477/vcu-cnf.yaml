global:
  image:
    registry: ccr-wg-vrf-vcu-01.wroclaw.nsn-rdnet.net:443/vcu
  accessModes: ReadWriteOnce    
  devicePoolList:
    fastPathDevicePool: openshift.io/sriov_vfio_1
    slowPathDevicePool: openshift.io/sriov_netdevice_1
  externalNetwork:
    e2:
      ipInfo:
      - rangeEnd: "172.168.1.2"
        rangeStart: "172.168.1.2"
        role:
        - E2
        subnet: "172.168.1.0/24"
      vlanInfo:
        vlName: e2
        defaultUnderlyingIface: extc
        secUnderlyingIface: extcs
    f1c:
      ipInfo:
      - rangeEnd: 10.255.11.10
        rangeStart: 10.255.11.10
        role:
        - F1-C
        subnet: 10.255.11.0/24
      vlanInfo:
        vid: "763"
        defaultUnderlyingIface: extc
        secUnderlyingIface: extcs
        vlName: f1c
    f1u:
      ipInfo:
      - rangeEnd: 10.255.10.10
        rangeStart: 10.255.10.10
        role:
        - F1-U
        - Tracing
        subnet: 10.255.10.0/24
      vlanInfo:
        vid: "762"
        defaultUnderlyingIface: extc
        secUnderlyingIface: extcs        
        vlName: f1u
    ngc:
      ipInfo:
      - rangeEnd: 10.42.39.197
        rangeStart: 10.42.39.197
        role:
        - NG-C
        subnet: 10.42.39.192/24
      vlanInfo:
        vlName: ngc
        defaultUnderlyingIface: extc
        secUnderlyingIface: extcs        
        vid: "767"
    ngu:
      ipInfo:
      - rangeEnd: 10.42.39.133
        rangeStart: 10.42.39.133
        role:
        - NG-U
        subnet: 10.42.39.128/24
      vlanInfo:
        vlName: ngu
        defaultUnderlyingIface: extc
        secUnderlyingIface: extcs        
        vid: "766"
    oam:
      ipInfo:
      - rangeEnd: 10.42.93.133
        rangeStart: 10.42.93.133
        role:
        - oam
        - certman-server
        - tracecontroller
        subnet: 10.42.93.138/26
      policyRouteInfo:
      - gateway: 10.42.93.129
        orderNumber: "5"
        table: "2"
      vlanInfo:
        vid: "764"
        defaultUnderlyingIface: oam
        secUnderlyingIface: oams
        vlName: oamvlan
      physicalIpGroup:
        role:
        - httpd
    s1u:
      ipInfo:
      - rangeEnd: 10.255.15.141
        rangeStart: 10.255.15.141
        role:
        - S1-U
        subnet: 10.255.15.128/25
      vlanInfo:
        vlName: s1u
        defaultUnderlyingIface: extc
        secUnderlyingIface: extcs        
        vid: "775"
    x2c:
      ipInfo:
      - rangeEnd: 10.255.13.10
        rangeStart: 10.255.13.10
        role:
        - X2-C
        subnet: 10.255.13.10/24
      vlanInfo:
        vid: "772"
        defaultUnderlyingIface: extc
        secUnderlyingIface: extcs       
        vlName: x2c
    x2u:
      ipInfo:
      - rangeEnd: 10.255.12.138
        rangeStart: 10.255.12.138
        role:
        - X2-U
        subnet: 10.255.12.138/26
      vlanInfo:
        vid: "771"
        defaultUnderlyingIface: extc
        secUnderlyingIface: extcs
        vlName: x2u
    xnc:
      ipInfo:
      - rangeEnd: 10.255.14.132
        rangeStart: 10.255.14.132
        role:
        - Xn-C
        subnet: 10.255.14.132/25
      vlanInfo:
        vlName: xnc
        defaultUnderlyingIface: extc
        secUnderlyingIface: extcs
        vid: "773"
    xnu:
      ipInfo:
      - rangeEnd: 10.255.15.5
        rangeStart: 10.255.15.5
        role:
        - Xn-U
        subnet: 10.255.15.0/25
      vlanInfo:
        vlName: xnu
        defaultUnderlyingIface: extc
        secUnderlyingIface: extcs
        vid: "774"      
  internale1Network:
    internale1:
      useGroup: "groupA"
      ipInfo:
      - ipAddress:
          groupA:
            cpif:
              rangeEnd: 192.168.2.14
              rangeStart: 192.168.2.14
            cpnrt:
              rangeEnd: 192.168.2.15
              rangeStart: 192.168.2.15
          groupB:
            cpif:
              rangeStart: ""
              rangeEnd: ""
            cpnrt:
              rangeStart: ""
              rangeEnd: ""
        role:
        - E1-C
        subnet: 192.168.2.0/24
      lripInternalE1Info:
        gatewayList:
        - 192.168.2.1
      vlanInfo:
        vid: "3895"
        defaultUnderlyingIface: e1
        secUnderlyingIface: e1s
        vlName: internale1

  storageClassName: lvms-vg1
  name_convention:
    container_prefix:
    - ctr
    - _NAMESPACE_
    deployment_prefix:
    - ute
    - _NAMESPACE_
    pod_prefix:
    - ute
    - _NAMESPACE_
    statefulset_prefix:
    - ute
    - _NAMESPACE_



