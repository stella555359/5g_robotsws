UE_POOLS:
    AndroidUePool:                                  # Ue Pool class defined by library
        inline_config:
            ANDROID_UE:                           # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - Qualcomm
                    - REAL_ANDROID_UE
                CLASS: AndroidUe                    # UE type is Android so AndroidUe class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'f37af4c4'     # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                  # By Default ue key ('ANDROID_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.97.65.67'    # UE PC IP address
                        pyro_port: '9090'           # TCP Port number on UE PC on which Pyro server will be started
                        login: 'guoqianqian'            # SSH login to UE PC
                        password: 'Nokia@123'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server'                # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        qualcomm_prototype: 'no'                    # set to 'yes' if this is a Qualcomm prototype
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/qcat.exe'    #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        qcat_analyzer: 'QCAT Sample;LTE;Time Grids;Phy/RLC/PDCP Grids;LTE DL Throughput vs. Time'
                        diag_cfg_path: 'C:/pyro_server/DIAG.cfg'    # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                        network_mode_switch_method: 'ADB'           # available values: adb, xposed, keyevents, secretcode. In case of adb - no rooting and xposed installation required
                                                                    # Use keyevents to use keyevents for change_network_mode, get_ue_info, log_ue_info, validate_ue_info of PREFERRED_NET_MODE
                                                                    # Use secretcode to use secretcode panel to change_network_mode
                                                                    # keyevents mode is actually supported only on UEs with Android 12
                                                                    # secretcode mode is used only on Samsungs with Android 12
                        mobile_network_text: 'Mobile networks'      # Use it to find Mobile networks text under mobile networks gui
                        setting_network_mode_text: 'Preferred network type'    # Use it to find text to set or read preferred network type
                        secret_code: '*#*#4636#*#*'                 # Use it together with network_mode_switch_method set to 'secretcode'
                        phone_number: '+17050100018'              # phone number of UE in case its not possible to retrieve it via API
                        imei: '868701059945919'                           # IMEI to be saved on UE in case its not possible to retrieve it via API
                        imsi: '262033100010278'                           # IMSI to be saved on UE in case its not possible to retrieve it via API
                        service_call_attach: '16'                  # service call which will be used for attaching UE
                        service_call_detach: '16'                  # service call which will be used for detaching UE
                        clear_server_files: 'yes'                   # to clear server files always when the plugin starts
                        clear_logs: 'yes'                           # to clear server logs always when the plugin starts
                        voice_call_technology: 'nr'                 # expected technology mode for voice call
                        voice_call_technology_timeout: '30'         # timeout for checking the expected technology for voice call
                        voice_call_dialing_timeout: '30'            # Timeout for dialing (calling) state
                        is_rooted: 'no'                             # set to 'yes' only if UE is rooted (login to UE shell and check that su command works)
                        processes_to_kill:                          # processes to kill on UE PC - anything that may interrupt a test case
                            - 'NAA'
                            - 'putty'
                        data_transfer:
                            tput_collection_src: 'control_app'  # 'control_app' or 'iperf' (default); Verification of throughput based on app's data; tput_collection_src can be used as keyword argument for Verify Average Throughput, Verify Average Throughput With Deviation, Get Average Throughput (it will override the config setting)
                            iperf_path: '/data/local/tmp'       # OPTIONAL iperf binary location (it is optional when you want to use your own iperf version or unable to install UeManager apk)
                            iperf_version: 3                    # OPTIONAL to chose version of the iperf to be used for data transfer in the tests with this UE, default 2, possible values: 2 and 3
                            iperf_mode: 'adb'                   # OPTIONAL for Askey Ues (SDX55/60 which can work with at commands and adb
                            serial_number: 'f37af4c4'              # OPTIONAL to be set when 'iperf_mode' is used, this is the sn of ue visible under 'adb devices'
                            iperf_interval: '5'                 # OPTIONAL Iperf interval in seconds (default: 1)
                            server_close_delay: '120'           # OPTIONAL Delay in closing iperf server in case of delay between client ans server hosts
                            iperf_bind_ue_ip: True              # OPTIONAL parameter to trigger or not binding to ue ip in uplink data transfer, True used by default, False to not use binding
                            traffic_type: 'nbiot'               # OPTIONAL parameter to specify the type of traffic, some behaviour differs for 'nbiot' traffic type
                            app_servers:
                                APP_1:                                      # 1st iperf server alias
                                    host: '10.106.243.149'                     # Application Server IP
                                    user: 'ute'                         # Application Server SSH login
                                    password: 'PZ1RRM3!5t6y7u'                     # Application Server SSH password
                                    # iperf_interface_ip: '10.42.129.5'     # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)
                            iperf_options:
                                port: '54015'
                                parallel_streams: '2'
                                packet: '1024B'
                                buffer: '1M'
                                ttl: '64'
                                max_segment_size: '124'
                                linux_congestion: 'cubic'
                                data_file: '/path/input/file.txt'
                                output_file: '/path/output/file.txt'
                                enhanced_reports: False
                                qci:
                                    1: 60000
                                    2: 60001
                            ping:
                                ping_host_ip: '10.97.65.243' # Remote host for ping (Start Data Transfer icmp protocol)
                                ping_count: '10'            # ping -c (count) option
                                allowed_packet_loss: '5'    # Allowed packet loss in %
