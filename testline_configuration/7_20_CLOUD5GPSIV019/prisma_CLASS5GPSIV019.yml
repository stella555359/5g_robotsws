lsu_uu:
    type: ue.prisma.lsu
    executor: tl.ues[1].lsu_uu_ssh_connection_details
    script_paths:
        create_5g_cell: cd /home/user/lsu_scripts; ./start_nr5g
        get_4g_cell_id: trcinfo -p0-2 | grep -i cellid
        get_5g_cell_id: trcinfo -p0-2 | grep -i "MASTER LOCKED"
        get_ra_status: trcinfo -p0-5 | grep -i contention
        stop_lsu: lsustop


tstm_uu:
    type: ue.prisma.tstm
    executor: tl.ues[1].tstm_uu_ssh_connection_details
    script_paths:
        start_tstm: cd /home/user/tstm_scripts; ./start_nr5g_Uu_ms_gui
        #start_tstm: cd /home/user/tstm_scripts/ ; nohup ./start_nr5g_Uu_ms_GUI >./nohup_uu.out 2>&1 &
        #get_tstm_log: cd /home/user/tstm_scripts/;tail -n 1000 -f ./nohup_uu.out
        clean_tstm_log: cd /home/user/scripts/;cat /dev/null > ./nohup_uu.out
        stop_tstm: ps -ef | grep tm | grep -v 'grep' | awk '{print $2}' | xargs kill -9


airmosaic:
    type: ue.prisma.airmosaic
    executor: tl.ues[1].airmosaic_ssh_connection_details
    harness: tl.ues[1].airmosaic_harness_connection_details
    cli_path: /cygdrive/c/Program\ Files/AirMosaic\ LTE\ Uu/airmosaic_lteuu/bin/airmosaic_lteuu64.exe
    cygwin_path:
    preferences_file_path:
    duration:
    suddenshutdown:
    bugreport_folder: /tmp/log
    script_paths:
        start_mosaic: ^cd "/cygdrive/c/Program\ Files/AirMosaic\ LTE\ Uu/airmosaic_lteuu/bin/"; ./airmosaic_lteuu64.exe --nogui --nosplash -J-Dcli.mode=true --enable-harness
    scenario_paths:
        attach: NSA_full_stack_1UE.sce
        detach: detach.sce
    parameters:
        enable_amm: true
        clock_timer: 900
        counters:
        log_counters_to_file:
        global_vars:


prisma:
   type: ue.prisma
   components:
     - lsu_uu
     - tstm_uu
     - airmosaic
