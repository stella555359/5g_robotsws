# Please follow with common structure:
# UE_POOLS:
#   AndroidUePool:                # This is for TA UE phones
#     ...
#     ...
#   MCGUePool:                    # This is for MCG UE phones
#     ...
#     ...
# ------------------------------------------------------------------
# For ta_ue (UEManager) usage change only:
# - serial number (can be found on UE PC when type in cmd-line 'adb devices')
# - RAT   --- possible values WCDMA, LTE, GSM
# - ue_pc_ip
# - login (ssh login for your UE PC)
# - password (for ssh)
# - host      |
# - user      | information about data transfer end point (FTP server)
# - password  |
#
# Example:
#
# TA_UE_ROOT:
#     UE_POOLS:
#         AndroidUePool:
#             inline_config:
#                 UE_1:
#                     CAPABILITIES:
#                         - REAL_UE
#                         - REAL_ANDROID_UE
#                         - RAT
#                     STARTING_CELL: 0x6D01
#                     CLASS: AndroidUe
#                     CONSTRUCTOR_PARAMETERS:
#                         serial_number: '12345abc'
#                         configuration:
#                             ue_pc_ip: 'X.X.X.X'
#                             pyro_port: '8080'
#                             login: 'user'
#                             password: 'pass'
#                             server_dir: 'C:/pyro_server'
#                             server_python: 'C:/Python27/python.exe'
#                             data_transfer:
#                                 ssh:
#                                     host: '10.44.44.167'
#                                     user: 'syslab'
#                                     password: 'system'

# For MCG change only:
# - UE_* - UE number in structure
# - UARFCN
# - SCR_CODE
# - IMSI
# - PS_tech
# Example MCG UE map:
#
# TA_UE_ROOT:
#     UE_POOLS:
#        MCGUePool:
#            inline_config:
#                UE_1:
#                    CAPABILITIES:
#                        - CAPABILITIES=REAL_UE
#                        - REAL_MCG_UE
#                    STARTING_CELL:
#                        - UARFCN=10763
#                        - SCR_CODE=1
#                    CLASS: MCGUe
#                    CONSTRUCTOR_PARAMETERS:
#                          IMSI: '244084600000476'
#                          PS_tech: 'R99'
#                UE_2:
#                    CAPABILITIES:
#                        - CAPABILITIES=REAL_UE
#                        - REAL_MCG_UE
#                    STARTING_CELL:
#                        - UARFCN=10813
#                        - SCR_CODE=8
#                    CLASS: MCGUe
#                    CONSTRUCTOR_PARAMETERS:
#                          IMSI: '244084600000478'
#                          PS_tech: 'HSPA'
UE_POOLS:
        AndroidUePool:
            inline_config:
                UE_FOR_TA:                                    # UE name - change if you want
                    CAPABILITIES:                             # Capabilities that UE has. (as a list)
                        - REAL_UE
                        - REAL_ANDROID_UE
#                   STARTING_CELL: 0x5E607                    # Cell ID to which UE should attach
                    CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                    CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                        serial_number: '412baf39'             # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                        configuration:
                            clear_server_files: 'yes'
                            ue_pc_ip: '10.5.55.220'           # UE PC IP address
                            pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                            login: 'rfsharing'                # SSH login to UE PC
                            password: 'Nokia2022!@1'            # SSH password to UE PC
                            # shieldbox_com: '21'             # Popek shieldbox COM number (uncomment only if you use Popek shieldboxes)
                            # usb_port_no: '1'                # USB line on Popek Shieldbox (uncomment only if you use Popek shieldboxes)
                            server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                            server_python: 'C:/Python27/python.exe'     # UE PC python location
                            qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/qcat.exe'    #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                            diag_cfg_path: 'C:\Users\rfsharing\Desktop\DIAG_5G.cfg'         # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                            data_transfer:                    # Iperf endpoint details
                                app_servers:
                                    APP1:
                                        host: '10.5.56.28'          # Iperf endpoint IP
                                        user: 'ftp_5g'              # Iperf endpoint SSH login
                                        password: 'Aikon_4321'      # Iperf endpoint SSH password
                                        iperf_interface_ip: '10.5.61.134' # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)
                UE_FOR_TA_NOKIA:                                    # UE name - change if you want
                    CAPABILITIES:                             # Capabilities that UE has. (as a list)
                        - REAL_UE
                        - NOKIA_UE
#                   STARTING_CELL: 0x5E607                    # Cell ID to which UE should attach
                    CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                    CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                        serial_number: 'HZQN1876AAK82902510'  # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                        configuration:
                            clear_server_files: 'yes'
                            ue_pc_ip: '10.5.55.220'           # UE PC IP address
                            pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                            login: 'rfsharing'                # SSH login to UE PC
                            password: 'Nokia2022!@1'            # SSH password to UE PC
                            # shieldbox_com: '21'             # Popek shieldbox COM number (uncomment only if you use Popek shieldboxes)
                            # usb_port_no: '1'                # USB line on Popek Shieldbox (uncomment only if you use Popek shieldboxes)
                            server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                            server_python: 'C:/Python27/python.exe'     # UE PC python location
                            qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/qcat.exe'    #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                            diag_cfg_path: 'C:\Users\rfsharing\Desktop\DIAG_5G.cfg'         # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                            data_transfer:                    # Iperf endpoint details
                                app_servers:
                                    APP1:
                                        host: '10.5.56.28'          # Iperf endpoint IP
                                        user: 'ftp_5g'              # Iperf endpoint SSH login
                                        password: 'Aikon_4321'      # Iperf endpoint SSH password
                                        iperf_interface_ip: '10.5.61.134' # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)
                AT_BASED_UE_2:                          # UE name
                    CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                        - ASKEY_UE
                        - REAL_ANDROID_UE
                    CLASS: AtCmdsUe                     # AT based type UE class
                    CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                        configuration:                  # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
                            clear_server_files: 'yes'
                            serial_com: '17'             # COM ID obtained from qualcomm modem
                            diag_com: '16'               # Diagnostic COM ID
                            ue_pc_ip: '10.5.55.220'    # UE PC IP address
                            pyro_port: '9090'           # TCP Port number on UE PC on which Pyro server will be started
                            login: 'rfsharing'            # SSH login to UE PC
                            password: 'Nokia2016!'         # SSH password to UE PC
                            server_dir: 'C:/pyro_server'    # UE PC directory where all server files will be copied
                            server_python: 'C:/Python27/python.exe' # UE PC python location
                            # network_mode_switch_method: 'ADB'       # method for change network mode keyword
                            # interface_name: 'Cellular'  # mbn interface for data transfer
                            reset_interface: 'no'      # disable and enable mbn interface (interface_name) during Require Ue
                            enable_disable_cfun: 'yes'  # send AT+CFUN=1 before attach and AT+CFUN=0 before detach
                            restart_wwansvc: 'no'      # restart wwan servive (wwansvc) to help in some mbn connection cases
                            processes_to_kill:          # processes to kill on UE PC - anything that may interrupt a test case
                                - 'notepad++'
                                - 'putty'
                                - 'QXDM'
                                - 'adb'
                                - 'iperf'
                                - 'QPSTConfig'
                                - 'QMITestPro'
                            data_transfer:
                                #iperf_mode: 'adb'
                                iperf_path: 'C:/iperf/' # iperf.exe location on UE PC - please use Unix like separators
                                iperf_interval: '5'                 # Iperf interval in seconds (default: 1)
                                app_servers:
                                    APP1:
                                        host: '10.5.56.28'          # Iperf endpoint IP
                                        user: 'ftp_5g'              # Iperf endpoint SSH login
                                        password: 'Aikon_4321'      # Iperf endpoint SSH password
                                        iperf_interface_ip: '10.5.61.134' # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)

