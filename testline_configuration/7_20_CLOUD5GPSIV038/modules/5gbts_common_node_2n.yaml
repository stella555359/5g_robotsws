heat_template_version: 2016-10-14
description: 'v77: Template to instantiate application type of VM'
parameters:
  common_metadata:
    type: json
    description: common metadata parameters
  common_userdata:
    type: json
    description: common cloud-init userdata parameters
  config_drive:
    type: boolean
    description: use config drive instead of metadata server
  dpdk_type:
    type: string
    description: type information for dpdk boot configuration
    default: none
  instance_params:
    type: json
    description: instance specific parameters
  local_volumes:
    type: json
    description: Local volumes to be attached
    default:
      count: 0
      volumes: []
  name:
    type: string
    description: Name to be used as the host name for the instance
  networks:
    type: json
    description: network parameters
  roles:
    type: comma_delimited_list
    description: Deployment roles associated
    default:
    - application
  storage_meta:
    type: json
    description: Storage user parameters for shared volumes
  upgrade-node:
    type: boolean
    description: indicate whether it is upgrade node
    default: false
  best_effort:
    type: boolean
    description: The best effort value of sever group
    default: true
  service_ip_meta:
    type: json
    description: internal-service-ip-pool metadata parameters
    default: {}

resources:
  server_group:
    type: OS::Nova::ServerGroup
    properties:
      name:
        str_replace:
          template: $name-server-group
          params:
            $name: {get_param: name}
      policies:
        - anti-affinity
      best_effort: {get_param: best_effort}
  ports_0:
    type: RCP::Network::Pool
    properties:
      count:
        get_param: [networks, count]
      networks:
        get_param: [networks, net_list_0]
  ports_1:
    type: RCP::Network::Pool
    properties:
      count:
        get_param: [networks, count]
      networks:
        get_param: [networks, net_list_1]
  ports_logical:
    type: RCP::Network::Pool
    properties:
      count:
        get_param: [networks, count_logical]
      networks:
        get_param: [networks, net_list_logical]
  local_vol_0:
    type: RCP::VolumeGroup::Local
    properties:
      volumes:
        get_param: [local_volumes]
  local_vol_attach_0:
    type: OS::Heat::ResourceGroup
    properties:
      count:
        get_param: [local_volumes, count]
      resource_def:
        type: RCP::Volume::Attachment
        properties:
          index: '%index%'
          server: {get_resource: server_0}
          volumes:
            get_attr: [local_vol_0, volume_id]
  local_vol_1:
    type: RCP::VolumeGroup::Local
    properties:
      volumes:
        get_param: [local_volumes]
  local_vol_attach_1:
    type: OS::Heat::ResourceGroup
    properties:
      count:
        get_param: [local_volumes, count]
      resource_def:
        type: RCP::Volume::Attachment
        properties:
          index: '%index%'
          server: {get_resource: server_1}
          volumes:
            get_attr: [local_vol_1, volume_id]

  cloud_config_0:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        hostname:
          str_replace:
            template: <name>-0
            params:
              <name>: {get_param: name}
  cloud_init_0:
    type: OS::Heat::MultipartMime
    properties:
      parts:
      - config: {get_param: [common_userdata, add_user]}
        subtype: cloud-config
      - config: {get_param: [common_userdata, run_cmd]}
        subtype: cloud-config
      - config: {get_resource: cloud_config_0}
        subtype: cloud-config
  cloud_config_1:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        hostname:
          str_replace:
            template: <name>-1
            params:
              <name>: {get_param: name}
  cloud_init_1:
    type: OS::Heat::MultipartMime
    properties:
      parts:
      - config: {get_param: [common_userdata, add_user]}
        subtype: cloud-config
      - config: {get_param: [common_userdata, run_cmd]}
        subtype: cloud-config
      - config: {get_resource: cloud_config_1}
        subtype: cloud-config

  server_0:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: <name>-0
          params:
            <name>: {get_param: name}
      image:
        get_param:
        - instance_params
        - server_0
        - imageId
      flavor:
        get_param:
        - instance_params
        - server_0
        - flavorId
      availability_zone:
        get_param:
        - instance_params
        - server_0
        - azId
      scheduler_hints:
        group:
          get_resource: server_group
      networks:
        get_attr: [ports_0, ports]
      user_data_format: RAW
      user_data: {get_resource: cloud_init_0}
      metadata:
        map_merge:
        - {get_param: common_metadata}
        - roles: {get_param: roles}
          dpdk-conf-type: {get_param: dpdk_type}
        - get_attr: [ports_0, ip-info]
        - ext-ip-config-physical: {get_attr: [ports_0, ext-ip-config]}
        - ext-ip-config-logical: {get_attr: [ports_logical, ext-ip-config]}
        - {get_param: storage_meta}
        - {get_param: service_ip_meta}
        - get_attr: [local_vol_0, provider_map]
        - upgrade-node: {get_param: upgrade-node}
        - ha-mode: 2n
      config_drive: {get_param: config_drive}

  server_1:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: <name>-1
          params:
            <name>: {get_param: name}
      image:
        get_param:
        - instance_params
        - server_1
        - imageId
      flavor:
        get_param:
        - instance_params
        - server_1
        - flavorId
      availability_zone:
        get_param:
        - instance_params
        - server_1
        - azId
      scheduler_hints:
        group:
          get_resource: server_group
      networks:
        get_attr: [ports_1, ports]
      user_data_format: RAW
      user_data: {get_resource: cloud_init_1}
      metadata:
        map_merge:
        - {get_param: common_metadata}
        - roles: {get_param: roles}
          dpdk-conf-type: {get_param: dpdk_type}
        - get_attr: [ports_1, ip-info]
        - ext-ip-config-physical: {get_attr: [ports_1, ext-ip-config]}
        - ext-ip-config-logical: {get_attr: [ports_logical, ext-ip-config]}
        - {get_param: storage_meta}
        - {get_param: service_ip_meta}
        - get_attr: [local_vol_1, provider_map]
        - upgrade-node: {get_param: upgrade-node}
        - ha-mode: 2n
      config_drive: {get_param: config_drive}

outputs:
  internal_ip:
    description: Internal IP address allocated to the instance
    value:
      get_attr: [ports_0, internal_ip]
