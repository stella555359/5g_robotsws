heat_template_version: 2016-10-14
description: 'v77: Template to instantiate non-redundant management node instance'
parameters:
  common_metadata:
    type: json
    description: common metadata parameters
  common_userdata:
    type: json
    description: common cloud-init userdata parameters
  config_drive:
    type: boolean
    description: use config drive instead of metadata server
  dns_forwarders:
    type: comma_delimited_list
    description: list of servers to forward queries to
    default: []
    constraints:
    - length:
        min: 0
        max: 3
  dpdk_type:
    type: string
    description: type information for dpdk boot configuration
    default: oam
  instance_params:
    type: json
    description: instance specific parameters
  key_name:
    type: string
    description: key pair to assign to default user
    default: rcpkey
    constraints:
    - custom_constraint: nova.keypair
  local_volumes:
    type: json
    description: Local volumes to be attached
    default:
      count: 0
      volumes: []
  name:
    type: string
    description: Name to be used as the host name for the instance
  networks:
    type: json
    description: network parameters
  nfs_volumes:
    type: json
    description: Volumes to ba attached an shared via NFS
    default:
      count: 0
      vol_list: []
  ntp_prefer:
    type: string
    description: preferred NTP server to use
    default: ''
  ntp_servers:
    type: comma_delimited_list
    description: list of servers to sync time from
    constraints:
    - length:
        min: 1
        max: 3
  oam_port_index:
    type: string
    description: resource index for OAM port in netwpork pool
    default: resource.2
  roles:
    type: comma_delimited_list
    description: Deployment roles associated
    default:
    - management
    - external-connectivity
    - storage
    - 5gbts_oam
  service_ip_meta:
    type: json
    description: internal-service-ip-pool metadata parameters
    default: {}
resources:
  ports:
    type: RCP::Network::Pool
    properties:
      count:
        get_param: [networks, count]
      networks:
        get_param: [networks, net_list_0]
      oam_port: {get_param: oam_port_index}
  nfs_vol:
    type: RCP::VolumeGroup::NFS
    properties:
      nfs_host:
        str_replace:
          template: <name>.local
          params:
            <name>: {get_param: name}
      volumes:
        get_param: [nfs_volumes]
  nfs_vol_attach:
    type: OS::Heat::ResourceGroup
    properties:
      count:
        get_param: [nfs_volumes, count]
      resource_def:
        type: RCP::Volume::Attachment
        properties:
          index: '%index%'
          server: {get_resource: server}
          volumes:
            get_attr: [nfs_vol, volume_id]
  local_vol:
    type: RCP::VolumeGroup::Local
    properties:
      volumes:
        get_param: [local_volumes]
  local_vol_attach:
    type: OS::Heat::ResourceGroup
    properties:
      count:
        get_param: [local_volumes, count]
      resource_def:
        type: RCP::Volume::Attachment
        properties:
          index: '%index%'
          server: {get_resource: server}
          volumes:
            get_attr: [local_vol, volume_id]
  cloud_config:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        hostname: {get_param: name}
        fetch_public_key:
        - {path: /run/authorized_keys, permissions: '0600'}
  cloud_init:
    type: OS::Heat::MultipartMime
    properties:
      parts:
      - config: {get_param: [common_userdata, add_user]}
        subtype: cloud-config
      - config: {get_param: [common_userdata, run_cmd]}
        subtype: cloud-config
      - config: {get_resource: cloud_config}
        subtype: cloud-config
  server:
    type: OS::Nova::Server
    properties:
      name: {get_param: name}
      image:
        get_param: [instance_params, server, imageId]
      flavor:
        get_param: [instance_params, server, flavorId]
      availability_zone:
        get_param: [instance_params, server, azId]
      scheduler_hints:
        group: {get_param: [instance_params, server, server_group_id]}
      key_name: {get_param: key_name}
      networks:
        get_attr: [ports, ports]
      user_data_format: RAW
      user_data: {get_resource: cloud_init}
      metadata:
        map_merge:
        - {get_param: common_metadata}
        - dpdk-conf-type: {get_param: dpdk_type}
          ntp-servers: {get_param: ntp_servers}
          ntp-server-prefer: {get_param: ntp_prefer}
          dns-forwarders: {get_param: dns_forwarders}
          roles: {get_param: roles}
          storage.install: true
        - get_attr: [ports, ip-info]
        - ext-ip-config-physical: {get_attr: [ports, ext-ip-config]}
        - {get_param: service_ip_meta}
        - oam-ip.interface: oam
          oam-ip.type: physical
          oam-ip.roles: [ssh, oam]
          oam-ip.ip-addrs:
            get_attr: [ports, oam_ips]
          oam-default-gws:
            get_attr: [ports, oam_gws]
        - get_attr: [local_vol, provider_map]
        - get_attr: [nfs_vol, provider_map]
      config_drive: {get_param: config_drive}
outputs:
  management_ip:
    description: Primary management IP address allocated to access the system
    value:
      str_split:
      - /
      - get_attr: [ports, oam_ips, 0]
      - 0
  management_ips:
    description: All management IP addresses allocated to access the system
    value:
      get_attr: [ports, oam_fixed_ips]
  internal_ip:
    description: Internal IP address allocated to the instance
    value:
      get_attr: [ports, internal_ip]
  volume_map:
    description: the storage user metadata map for shared disks
    value:
      get_attr: [nfs_vol, user_map]
