heat_template_version: 2016-10-14
description: 'v77: Template for attaching a volume to a server instance'
parameters:
  index:
    type: number
    description: index to fetch own parameters
  server:
    type: string
    description: The Nova server instance to attach the volume to
  volumes:
    type: comma_delimited_list
    description: parameters for volumes
resources:
  volume_attachment:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id:
        get_param:
        - volumes
        - {get_param: index}
      instance_uuid: {get_param: server}
