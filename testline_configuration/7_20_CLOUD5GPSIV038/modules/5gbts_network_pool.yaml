heat_template_version: 2016-10-14
description: 'v77: Template for creating network interfaces attached to RCP node'
parameters:
  count:
    type: number
    description: Number of interfaces
  internal_port:
    type: string
    description: index of port attached to internal network
    default: resource.0
  networks:
    type: json
    description: network parameters
  oam_port:
    type: string
    description: index of port attached to oam network
    default: ''
  fixed_ips_index:
    type: number
    description: index to fetch own parameters
    default: 0
resources:
  ports:
    type: OS::Heat::ResourceGroup
    properties:
      count: {get_param: count}
      resource_def:
        type: RCP::Network::Interface
        properties:
          fixed_ips_index: {get_param: fixed_ips_index}
          index: '%index%'
          networks: {get_param: networks}
outputs:
  ports:
    description: list of ports in format expected by networks property of OS::Nova::Server
    value:
      get_attr: [ports, port]
  ip-info:
    description: ip-info metadata parameters
    value:
      map_merge:
        get_attr: [ports, ip-info]
  ext-ip-config:
    description: external ip configurations
    value:
      get_attr: [ports, ext-ip-config]
  internal_ip:
    description: Internal IP address allocated to the instance
    value:
      str_split:
      - /
      - get_attr:
        - ports
        - {get_param: internal_port}
        - ip_addrs
        - 0
      - 0
  oam_ips:
    description: IP addresses allocated to oam network interface
    value:
      get_attr:
      - ports
      - {get_param: oam_port}
      - ip_addrs
  oam_gws:
    description: Default GW addresses allocated for oam interface
    value:
      get_attr:
      - ports
      - {get_param: oam_port}
      - gw_addrs
  oam_fixed_ips:
    description: Full IP address configuration for OAM interface
    value:
      get_attr:
      - ports
      - {get_param: oam_port}
      - fixed_ips