global:
  image:
    registry: "ccr-wl-vrf-vcu-01.wroclaw.nsn-rdnet.net:443/vcu"
  accessModes: ReadWriteMany
  devicePoolList:
    fastPathDevicePool: openshift.io/sriov_vfio_0
    fastPathDevicePoolBackup:
    slowPathDevicePool: openshift.io/sriov_netdevice_0
    slowPathDevicePoolBackup: 
  cnfLayout: "mini"
  externalNetwork:
    oam:
      vlanInfo:
        vlName: "oamvlan"
        defaultUnderlyingIface: "oam"
        secUnderlyingIface: "oams"
        vid: "374"
        mtu: 1500
      ipInfo:
      - rangeStart: "10.44.183.243"
        rangeEnd: "10.44.183.243"
        subnet: "10.44.183.128/25"
        role:
        - "oam"
        - "certman-server"
        - "tracecontroller"
      # only Blue/Green upgrade function needed.
      physicalIpGroup:
        # defined which group will be using to set up oam physical IP.
        usePhysicalIpGroup: ""
        # Same subnet with oam network.
        subnet: ""
        # HTTPD can obtain the physical IP from the ipmgmt service through the role and listen to ip
        role:
        - "httpd"
        # we don't hardcode use A to N, B to N+1: If groupA or groupB for vCU N, after b/g upgrade, the other group shall be utilize for vCU N+1.
        # 4 physical IPs(IPv4 and IPv6 are supported)should be reserved from oam subnet.
        # for example:
        # groupA:
        #   rangeStart: "10.0.0.3"
        #   rangeEnd: "10.0.0.4"
        # groupB:
        #   rangeStart: "10.0.0.5"
        #   rangeEnd: "10.0.0.6"
        groupA:
          rangeStart: ""
          rangeEnd: ""
        groupB:
          rangeStart: ""
          rangeEnd: ""
      policyRouteInfo:
      - gateway: "10.44.183.129"
        # - Description: the orderNumber of oam route
        # Note: should different from orderNumber in the SCF file to avoid conflict
        orderNumber: "5"
        # - Description: the table id of oam route
        # recommend not to modify
        table: "2"
        # - As per Feature CB014440 seperate IP used for FrontHaul and BackHaul Please update the IP accrodingly for f1c interface and modify defaultUnderlyingIface as mhc.
    f1c:
      vlanInfo:
        vlName: "f1c"
        defaultUnderlyingIface: "extc"
        secUnderlyingIface: "extcs"
        vid: 373
        mtu: 1500
      ipInfo:
      - rangeStart: "10.255.3.115"
        rangeEnd: "10.255.3.115"
        subnet: "10.255.3.0/24"
        role:
        - "F1-C"
        # - As per Feature CB014440 all 3GPP backhual interfaces share same (single) IP address e.g.x2c is shared with x2c,xnc,ngc.
    x2c:
      vlanInfo:
        vlName: "x2c"
        defaultUnderlyingIface: "extc"
        secUnderlyingIface: "extcs"
        vid: ""
        mtu: 1500
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        role:
        - "X2-C"
    ngc:
      vlanInfo:
        vlName: "ngc"
        defaultUnderlyingIface: "extc"
        secUnderlyingIface: "extcs"
        vid: 343
        mtu: 1500
      ipInfo:
      - rangeStart: "10.44.193.243"
        rangeEnd: "10.44.193.243"
        subnet: "10.44.193.128/25"
        role:
        - "NG-C"
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        role:
        - "NG-C"
    xnc:
      vlanInfo:
        vlName: "xnc"
        defaultUnderlyingIface: "extc"
        secUnderlyingIface: "extcs"
        vid: 366
        mtu: 1500
      ipInfo:
      - rangeStart: "10.255.17.115"
        rangeEnd: "10.255.17.115"
        subnet: "10.255.17.0/24"
        role:
        - "Xn-C"
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        role:
        - "Xn-C"
    e2:
      vlanInfo:
        vlName: "e2"
        defaultUnderlyingIface: "extc"
        secUnderlyingIface: "extcs"
        vid: ""
        mtu: 1500
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        role:
        - "E2"
        # - As per Feature CB014440 seperate IP is used for FrontHaul and BackHaul please update IP accrodingly for f1u interface and modify defaultUnderlyingIface as mhu.
    f1u:
      vlanInfo:
        vlName: "f1u"
        defaultUnderlyingIface: "extu"
        secUnderlyingIface: "extus"
        vid: 370
        mtu: 1500
      ipInfo:
      - rangeStart: "10.255.2.115"
        rangeEnd: "10.255.2.115"
        subnet: "10.255.2.0/24"
        role:
        - "F1-U"
        # Include "Tracing" here only if f1u is responsible for tracing.
        - "Tracing"

    # Configuration for the traceu interface
    # Use this ONLY if "Tracing" is NOT part of f1u roles
    # Typically, "Tracing" is handled by f1u, but traceu can be used if separation is needed
    # 'traceu' is NOT required for CB014440.

    #    traceu:
    #      vlanInfo:
    #        vlName: "traceu"
    #        defaultUnderlyingIface: "extu"
    #        secUnderlyingIface: "extus"
    #        vid: ""
    #        mtu: 1500
    #      ipInfo:
    #      - rangeStart: ""
    #        rangeEnd: ""
    #        subnet: ""
    #        role:
    #        - "Tracing"

        # - As per Feature CB014440 all 3GPP interfaces share same(single) IP address e.g.x2u IP is shared with ngu,x2u,xnu,s1u.
    x2u:
      vlanInfo:
        vlName: "x2u"
        defaultUnderlyingIface: "extu"
        secUnderlyingIface: "extus"
        vid: ""
        mtu: 1500
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        role:
        - "X2-U"
      # - Configured for CB013452-CR-G (as Datasplit IP)
    x2uDS:
      vlanInfo:
        vlName: "x2uDS"
        defaultUnderlyingIface: "extu"
        secUnderlyingIface: "extus"
        vid: ""
        mtu: 1500
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        role:
        - "X2-U_datasplit"
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        role:
        - "X2-U_datasplit"
    s1u:
      vlanInfo:
        vlName: "s1u"
        defaultUnderlyingIface: "extu"
        secUnderlyingIface: "extus"
        vid: ""
        mtu: 1500
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        role:
        - "S1-U"
    ngu:
      vlanInfo:
        vlName: "ngu"
        defaultUnderlyingIface: "extu"
        secUnderlyingIface: "extus"
        vid: 342
        mtu: 1500
      ipInfo:
      - rangeStart: "10.255.16.115"
        rangeEnd: "10.255.16.115"
        subnet: "10.255.16.0/24"
        role:
        - "NG-U"
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        role:
        - "NG-U"
    xnu:
      vlanInfo:
        vlName: "xnu"
        defaultUnderlyingIface: "extu"
        secUnderlyingIface: "extus"
        vid: 3898
        mtu: 1500
      ipInfo:
      - rangeStart: "10.255.18.115"
        rangeEnd: "10.255.18.115"
        subnet: "10.255.18.0/24"
        role:
        - "Xn-U"
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        role:
        - "Xn-U"
  internalE1Network:
    internalE1:
      vlanInfo:
        vlName: "internale1"
        defaultUnderlyingIface: "e1"
        secUnderlyingIface: "e1s"
        vid: 3895
        mtu: 1500
      # - Description: define which group IP will be used when install the cnf
      # - Support value: "groupA","groupB"
      #                  "useGroup" set as "groupA" will only use the ipAddress under section "groupA"
      #                  "useGroup" set as "groupB" will only use the ipAddress under section "groupB"
      #                  if do Blue/Green upgrade, both of the ip addresses for "groupA" and "groupB" need to be configured
      # - Default value: "groupA"
      # - Note: "groupA" and "groupB" IP address should not be conflict, but need in the same subnet,
      #          reserved ip address count for cpif should be equal to "global.cpifInstance"
      # - Example: "global.cpifInstance" is 4, and useGroup is "groupA", the ip addresses 192.168.200.5-192.168.200.8 would be
      #             used for cpif instance, then "groupB" ipAddress should not be conflict with these IPs 192.168.200.4-192.168.200.8
      useGroup: "groupA"
      ipInfo:
      - subnet: "192.168.3.0/24"
        role:
        - "E1-C"
        ipAddress:
          groupA:
            cpif:
              rangeStart: "192.168.3.20"
              rangeEnd: "192.168.3.20"
            cpnrt:
              rangeStart: "192.168.3.21"
              rangeEnd: "192.168.3.21"
          # - recommend vlaues for groupB according current groupA default values
          # groupB need to configured in case of Blue/Green upgrade
          # groupB:
          #   cpif:
          #      rangeStart: "192.168.200.11"
          #      rangeEnd: "192.168.200.11"
          #   cpnrt:
          #      rangeStart: "192.168.200.10"
          #      rangeEnd: "192.168.200.10"
          groupB:
            cpif:
              rangeStart: ""
              rangeEnd: ""
            cpnrt:
              rangeStart: ""
              rangeEnd: ""
      # - Description: this parameter is only for internale1 LRIP configuration
      # - Feature ID: CNI-74580
      # - Note: this gateway also should be configured on the switch
      lripInternalE1Info:
        gatewayList:
        - "192.168.3.1"
  storageClassName: ocs-storagecluster-cephfs
  name_convention:
    container_prefix:
    - ctr
    - _NAMESPACE_
    deployment_prefix:
    - ute
    - _NAMESPACE_
    pod_prefix:
    - ute
    - _NAMESPACE_
    statefulset_prefix:
    - ute
    - _NAMESPACE_

