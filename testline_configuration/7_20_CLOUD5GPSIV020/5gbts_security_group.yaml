heat_template_version: 2016-04-08
description: template to create security group

parameters:
  prefix:
    type: string
    default: example-5gbts
    description: prefix for security group

resources:
  oam_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name:
        str_replace:
          template: $prefix-oam-security-group
          params:
            $prefix: {get_param: prefix}
      description: Ping and SSH and HTTPS
      rules:
      - protocol: icmp
      - protocol: tcp
        port_range_min: 22
        port_range_max: 22
      - protocol: tcp
        port_range_min: 443
        port_range_max: 443
      - protocol: tcp
        port_range_min: 8443
        port_range_max: 8443
      - protocol: icmp
        ethertype: IPv6
      - protocol: tcp
        port_range_min: 22
        port_range_max: 22
        ethertype: IPv6
      - protocol: tcp
        port_range_min: 443
        port_range_max: 443
        ethertype: IPv6
      - protocol: tcp
        port_range_min: 8443
        port_range_max: 8443
        ethertype: IPv6
