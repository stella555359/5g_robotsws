heat_template_version: 2016-10-14

description: Template for creating external networks

parameters:
  network_opts:
    type: json

resources:
  int_nets:
    type: OS::Heat::ResourceGroup
    properties:
      count: {get_param: [network_opts, number_of_networks]}
      resource_def:
        type: modules/5gbts_int_network_template.yaml
        properties:
          vnf_name: {get_param: [network_opts, vnf_name]}
          index: "%index%"
          internal_networks: {get_param: [network_opts, networks]}

outputs:
  net_uuids:
    description: network uuids for all created networks
    value:
      {list_join: ["", get_attr: [int_nets, net_uuid]]}
