UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_FOR_TA:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_ANDROID_UE
                STARTING_CELL: 0x27F601                     # Cell ID to which UE should attach

                CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: '98f0ce9d'           # UE serial number (can be obtained via 'adb devices' command on the UE PC)
#                    serial_number: '5203f51afa65841d'           # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        ue_pc_ip: '10.5.48.136'          # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'rfs_rrm'                     # SSH login to UE PC
                        password: 'Nokia02!'               # SSH password to UE PC
                        # shieldbox_com: '21'             # Popek shieldbox COM number (uncomment only if you use Popek shieldboxes)
                        # usb_port_no: '1'                # USB line on Popek Shieldbox (uncomment only if you use Popek shieldboxes)
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/qcat.exe'    #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        diag_cfg_path: 'C:/pyro_server/DIAG.cfg'         # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        data_transfer:                    # Iperf endpoint details
                            ssh:
                                host: '10.5.26.69'       # Iperf endpoint IP
                                user: 'root'              # Iperf endpoint SSH login
                                password: 'alcatel'      # Iperf endpoint SSH password
