        - F1-C
        subnet: 172.16.1.0/24
      vlanInfo:
        defaultUnderlyingIface: extc
        secUnderlyingIface: extcs
        vlName: f1c
        vid: "3480"
    f1u:
      ipInfo:
      - rangeEnd: 172.16.2.105
        rangeStart: 172.16.2.105
