UE_POOLS:
    AndroidUePool:                                   # Ue Pool class defined by library
        inline_config:
            UE_1:                           # UE name
                CAPABILITIES:                        # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - TEST
                    - REAL_ANDROID_UE
                CLASS: QualcommNoLicenseUe           # UE type is Qualcomm so QualcommNoLicense class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:              # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    configuration:                   # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
                        serial_com: '18'              # COM ID obtained from qualcomm modem
                        diag_com: '17'                # Diagnostic COM ID
                        ue_pc_ip: '10.44.234.152'      # UE PC IP address
                        pyro_port: '9090'            # TCP Port number on UE PC on which Pyro server will be started
                        login: 'wro5gsiso'            # SSH login to UE PC
                        password: 'oZPS0POrRieRtu'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server'    # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe' # UE PC python location
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
#                        interface_name: 'Cellular 2'   # mbn interface for data transfer
                        reset_interface: 'no'        # disable and enable mbn interface (interface_name) during Require Ue
                        enable_disable_cfun: 'yes'   # send AT+CFUN=1 before attach and AT+CFUN=0 before detach

                        processes_to_kill:           # processes to kill on UE PC - anything that may interrupt a test case
#                            - 'notepad++'
#                            - 'putty'
#                            - 'adb'
#                            - 'iperf'
#                            - 'QPSTConfig'
#                            - 'QMITestPro'
                        data_transfer:
                            iperf_path: 'C:/cygwin64/bin/' # iperf.exe location on UE PC - please use Unix like separators
                            iperf_interface_ip: '10.42.197.170'   # Application Server interface used to bind IP (-B iperf parameter)
                            #iperf_interval: '5'                 # Iperf interval in seconds (default: 1)
                            #iperf_details: '_iperf'
                            app_servers:
                                APP_1:      # iperf server name
                                    host: '10.42.61.65' # Application Server IP
                                    user: '5g'     # Application Server SSH login
                                    password: '2019H@slo' # Application Server SSH password
                                    iperf_interface_ip: '10.42.197.170'
            UE_2: # UE name
                CAPABILITIES: # Capabilities that UE has (used to find select UE with Require Ue keyword)
                  - REAL_UE
                  - REAL_ANDROID_UE
                CLASS: QualcommNoLicenseUe           # UE type is Qualcomm so QualcommNoLicense class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    configuration: # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
                        serial_com: '20'              # COM ID obtained from qualcomm modem
                        diag_com: '19'                # Diagnostic COM ID
                        ue_pc_ip: '10.44.234.152'      # UE PC IP address
                        pyro_port: '9090'            # TCP Port number on UE PC on which Pyro server will be started
                        login: 'wro5gsiso'            # SSH login to UE PC
                        password: 'oZPS0POrRieRtu'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server'    # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe' # UE PC python location
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
#                        interface_name: 'Cellular 2'   # mbn interface for data transfer
                        reset_interface: 'no'        # disable and enable mbn interface (interface_name) during Require Ue
                        enable_disable_cfun: 'yes'   # send AT+CFUN=1 before attach and AT+CFUN=0 before detach

                        processes_to_kill:           # processes to kill on UE PC - anything that may interrupt a test case
#                                - 'notepad++'
#                                - 'putty'
#                                - 'adb'
#                                - 'iperf'
#                                - 'QPSTConfig'
#                                - 'QMITestPro'
                        data_transfer:
                            iperf_path: 'C:/cygwin64/bin/' # iperf.exe location on UE PC - please use Unix like separators
                            iperf_interface_ip: '10.42.197.170'   # Application Server interface used to bind IP (-B iperf parameter)
                            #iperf_interval: '5'                 # Iperf interval in seconds (default: 1)
                            #iperf_details: '_iperf'
                            app_servers:
                                APP_1: # iperf server name
                                    host: '10.42.61.65' # Application Server IP
                                    user: '5g'     # Application Server SSH login
                                    password: '2019H@slo' # Application Server SSH password
                                    iperf_interface_ip: '10.42.197.170'
