AppServer1: &APP_SERVER_1                              # application server definition
   address: '10.56.5.199'
   user: 'T03-tester'
   password: 'Nokia123!'

UE_POOLS:
    AndroidUePool:
        inline_config:
            ADB:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - ADB
                    - MTK
                CLASS: QualcommNoLicenseUe                # UE type is QualcommNoLicenseUe
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to QualcommNoLicenseUe constructor when Ue instance is created.
                    serial_number: '0123456789ABCDEF'
                    configuration:
                        serial_com: '6'                  # COM ID obtained from qualcomm modem, port for send AT command
                        diag_com: '8'                    # Diagnostic COM ID, lte port
                        ue_pc_ip: '10.56.5.198'           # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'csv5-tester'                # SSH login to UE PC
                        password: 'Nokia123!'              # SSH password to UE PC
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Users/csv5-tester/AppData/Local/Programs/Python/Python39/python.exe'     # UE PC python location
                        clear_logs: 'yes'                 # clears server_dir/logs folder before connecting to server
                        clear_server_files: 'yes'         # clears server_dir/ta_ue_plugin_android folder on UE PC, forcing new files upload
                        turn_off_on_firewall: 'yes'       # turn off firewall before connecting to server and on before shutdown. Windows only.
                        enable_disable_cfun: 'yes'        # enables CFUN (AT+CFUN=1) before attach, disables (AT+CFUN=0) after detach
                        reset_interface: 'no'            # Disable and Enable the interface=interface_name before test
                        processes_to_kill:                # phrases based on which processes names will be found and killed before test (case insensitive)
                            - 'putty'
                            # - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QMITestPro'
                            - 'ttermpro'
                            - 'ATCom'
                            - 'sscom'
                        data_transfer:                    # Application Server (for Iperf) details
                            iperf_path: 'adb shell /data/iperf'
                            iperf_options:
                                qci: {7: 50002}           # qci is for setting iperf port
                            ssh:
                                host: '10.56.5.198'       # Application Server IP
                                user: 'csv5-tester'             # Application Server SSH login
                                password: 'Nokia123!'      # Application Server SSH password         # available: nbiot. Changes output parsing.
            UE1:                        # UE name
                CAPABILITIES:            # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - AT
                CLASS: AtCmdUe
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtCmdUe constructor when Ue instance is created.
                    com_port: '11'        # MANDATORY, number of com port supporting AT commands
                    serial_number: 'b2b20fe9'
                    configuration:
                        ue_pc_address: '10.56.5.198'                      # UE PC domain address or IP
                        ue_pc_port: 8080                                      # OPTIONAL, default is 80
                        data_transfer:                                        # data transfer protocols
                            iperf:
                                app_server: *APP_SERVER_1
                                interval: 1
                                interface_name: 'Cellular 8'                  # OPTIONAL, need to be define if data transfer is run from the UE PC where is more than one device which uses AT commands
                                dt_from_uepc: True                            # OPTIONAL, default is False, if True dt is run from interface on ue pc
                            ping:
                                app_server: *APP_SERVER_1
                                interval: 1
                            ftp:
                                app_server: *APP_SERVER_1
                        #   ========= At specific: =========
                        ue_pc_login: 'csv5-tester'                               # MANDATORY
                        ue_pc_password: 'Nokia123!'                                # MANDATORY
                        ue_pc_expected_prompt: '10.56.5.198'              # OPTIONAL, but if you want to run data transfer from UE PC interface is mandatory
