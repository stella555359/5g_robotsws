UE_POOLS:
    AndroidUePool:
        inline_config:
            QC_8998:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - QUALCOMM_UE
                    - REAL_ANDROID_UE
#                    - MULTICLUSTER_UE
                    - VOLTE_UE
                STARTING_CELL: 0x32A01                    # Cell ID to which UE should attach

                CLASS: AndroidUe
                #CLASS: QualcommNoLicenseUe                # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'a06ef13d'        # UE serial number (can be obtained via 'adb devices' command on the UE PC)
#                    serial_number: '795b5970'           # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        serial_com: '11'                  # COM ID obtained from qualcomm modem
                        diag_com: '11'                    # Diagnostic COM ID
                        #iperf_loc: 'C:\iperf\iperf'       # Iperf.exe location on UE PC
                        interface_name: 'Mobile Broadband Connection 11'    # UE PC Qualcomm network interface name
                        ue_pc_ip: '10.53.164.243'          # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        python_libs: 'C:/PythonLibs'
                        login: 'inbabtslabuser'                     # SSH login to UE PC
                        password: 'BT5l@bus3rl0g1n'               # SSH password to UE PC
                        # voice_call_technology: 'LTE'
                        # voice_call_technology_timeout: '65'
                        # shieldbox_com: '21'             # Popek shieldbox COM number (uncomment only if you use Popek shieldboxes)
                        # usb_port_no: '1'                # USB line on Popek Shieldbox (uncomment only if you use Popek shieldboxes)
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/qcat.exe'    #PATH TO QCAT EXE APPLICATION
                        diag_cfg_path: 'C:/pyro_server/DIAG.cfg'      # PATH to DIAG.cfg file on UE PC (required to decode qmdl file)
                        data_transfer:                    # Iperf endpoint details
                            ssh:
                                host: '10.63.25.107'       # Iperf endpoint IP
                                user: 'ftpuser'              # Iperf endpoint SSH login
                                password: 'ftpuser'      # Iperf endpoint SSH password
                            iperf_options:
                                qci:
                                  2: 12002
                                  3: 13003
                                  4: 14004
                            iperf_interface_ip: '10.63.25.107'         # Application Server interface used for data transfer (-B iperf parameter)
                            ping:
                                ping_host_ip: '10.63.25.107' # Remote host for ping (Start Data Transfer icmp protocol)
                                ping_count: '70'            # ping -c (count) option
                                allowed_packet_loss: '100'    # Allowed packet loss in %

            Xperia:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_ANDROID_UE
                    - NON_VOLTE_UE
                STARTING_CELL: 0x32A01                    # Cell ID to which UE should attach

                CLASS: AndroidUe
                #CLASS: QualcommNoLicenseUe                # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'a06ef13d'           # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        serial_com: '7'                  # COM ID obtained from qualcomm modem
                        diag_com: '6'                    # Diagnostic COM ID
                        #iperf_loc: 'C:\iperf\iperf'       # Iperf.exe location on UE PC
                        interface_name: 'Mobile Broadband Connection 11'    # UE PC Qualcomm network interface name
                        ue_pc_ip: '10.53.164.243'          # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        python_libs: 'C:/PythonLibs'
                        login: 'inbabtslabuser'                     # SSH login to UE PC
                        password: 'BT5l@bus3rl0g1n'               # SSH password to UE PC
                        # voice_call_technology: 'LTE'
                        # voice_call_technology_timeout: '65'
                        # shieldbox_com: '21'             # Popek shieldbox COM number (uncomment only if you use Popek shieldboxes)
                        # usb_port_no: '1'                # USB line on Popek Shieldbox (uncomment only if you use Popek shieldboxes)
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/qcat.exe'    #PATH TO QCAT EXE APPLICATION
                        diag_cfg_path: 'C:/pyro_server/DIAG.cfg'      # PATH to DIAG.cfg file on UE PC (required to decode qmdl file)
                        data_transfer:                    # Iperf endpoint details
                            ssh:
                                host: '10.111.67.29'       # Iperf endpoint IP
                                user: 'ftpuser'              # Iperf endpoint SSH login
                                password: 'ftpuser'      # Iperf endpoint SSH password
                            iperf_options:
                                qci:
                                  2: 12002
                                  3: 13003
                                  4: 14004
                            iperf_interface_ip: '10.111.67.29'         # Application Server interface used for data transfer (-B iperf parameter)
                            ping:
                                ping_host_ip: '10.63.25.107' # Remote host for ping (Start Data Transfer icmp protocol)
                                ping_count: '70'            # ping -c (count) option
                                allowed_packet_loss: '100'    # Allowed packet loss in %
