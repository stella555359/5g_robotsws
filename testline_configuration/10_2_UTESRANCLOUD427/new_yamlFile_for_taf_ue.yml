APP_SERVER: &APP1
    address: '10.58.241.84'
    user: 'ftpuser'
    password: 'ftpuser'
    lte_network_ip: '10.58.241.84'                      # ip of interface used for LTE data transfer
    expected_prompt: ':~\$'


UE_PC_PORT_DISCT: &UE_PC_PORT_DICT
    heartbeat: 6005
    server_command_input: 6007
    server_qxdm_messages: 6008
    server_command_output: 6009
    message_stream_port: 6010


UE_POOLS:
    TafUeAndroidPool:
        inline_config:
            ANDROID_UE_1:
                CAPABILITIES:
                    - REAL_UE
                    - REAL_ANDROID_UE
                    - REAL_QUALCOMM_UE
                    - NON_VOLTE_UE
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:  # Parameters that will be passed to AtUe constructor when Ue instance is created.
                serial_number: 'ae52e817'    # OPTIONAL, UE serial number used by data transfer (can be obtained via 'adb devices' command on the UE PC)
                configuration:
                    ue_pc_address: '10.53.164.247'      # UE PC domain address or IP
                    ue_pc_login: 'inbabtslabuser'
                    ue_pc_password: 'BT5l@bus3rl0g1n'
                    qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/qcat.exe'    #PATH TO QCAT EXE APPLICATION
                    diag_cfg_path: 'C:/pyro_server/DIAG.cfg'      # PATH to DIAG.cfg file on UE PC (required to decode qmdl file)
                    data_transfer: # data transfer protocols
                        iperf:
                            app_server: *APP1
                            interval: 1
#                            binary_path: 'some/path'                        # OPTIONAL
                            interface_name: 'cellular8'           # OPTIONAL
                            server_close_delay: 50                          # OPTIONAL
                            bind_ue_ip: '1.1.1.1'                           # OPTIONAL
                            version: 3
                        ping:
                            app_server: *APP1
                            interval: 1
                        ftp:
                            app_server: *APP1
                    ue_pc_host: '10.53.164.247'
                    port_dict: *UE_PC_PORT_DICT
                    login: 'inbabtslabuser'
                    password: 'BT5l@bus3rl0g1n'
                    qxdm_version: 5
                    attach_type: 'LTE'
                    licence_type: '5G'
                    voice_call_technology_timeout: '65'
                    com_port: 5
                    ue_type: 'ANDROID'
                    iperf_adb_dir: 'su 0 /data/data/com.magicandroidapps.iperf/bin/iperf'


ATTENUATORS:
    TopYoung:
        TYPE: TopYoung                               # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.hytem.HytemAttenuator
