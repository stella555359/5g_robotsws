PA_NR:                                                #ID of Programmable Attenuator, used as reference in env_config_1.yaml
    ATT1:                                              #ID for attenuator nb 1
        ip: 10.255.2.164                              #IP of Programmable Attenuator
        type: RadioRack                               #Tlype of the PA [possible values: Hytem, JFW, RadioRack, TopYoung]
        port: 50000                                   #Attenuator’s port for management, e.q. for RadioRack value should be 50000
        atten_ports: 2 4 6 8 10 12                    #List of attenuation lines ports separated by space
        ants:
            EA201650199:                              #RMOD AHEH Serial Number
                ANT1: 2
                ANT2: 4
                ANT3: 6
                ANT4: 8
            EA203753920:                              #RMOD FHPD Serial Number
                ANT1: 10
                ANT2: 12
PA_LTE:                                                #ID of Programmable Attenuator, used as reference in env_config_1.yaml
    ATT1:                                              #ID for attenuator nb 1
        ip: 10.255.2.164                              #IP of Programmable Attenuator
        type: RadioRack                               #Tlype of the PA [possible values: Hytem, JFW, RadioRack, TopYoung]
        port: 50000                                   #Attenuator’s port for management, e.q. for RadioRack value should be 50000
        atten_ports: 2 4 6 8                     #List of attenuation lines ports separated by space
        ants:
            EA201650199:                              #RMOD AHEH Serial Number
                ANT1: 2
                ANT2: 4
                ANT3: 6
                ANT4: 8
