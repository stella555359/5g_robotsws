UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_PC_36_UE_CELL_1:                      # UE name
                CAPABILITIES:                 # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - CELL_1
                    - PHONE_1
                STARTING_CELL: 0x115201       # Cell ID to which UE should attach
                CLASS: QualcommNoLicenseUe    # UE type : UE based on a Qualcomm chip and controlled via AT commands
                CONSTRUCTOR_PARAMETERS:       # Parameters that will be passed to QectelNoLicenceUe constructor when UE instance is created.
                    configuration:
                        serial_com: '9'                                # COM ID associated to the Quectel Modem (to be found out using Device Manager Tool)
                        diag_com: '8'                                  # Diagnostic COM ID / USB DM COM associated to the Quectel Modem (to be found out using Device Manager Tool)
                        iperf_loc: 'c:/Tools/iPerf/iperf.exe'           # Iperf.exe location on UE PC
#                        interface_name: 'Cellular' # UE PC Qectel network interface name  (to be found out using the "netsh mbn show interface" command)
                        ue_pc_ip: '10.53.164.245'                       # UE PC IP address
                        pyro_port: '9090'                               # TCP Port number on UE PC on which PyroServer will be started
                        login: 'inbabtslabuser'                     # SSH login to UE PC
                        password: 'BT5l@bus3rl0g1n'                            # SSH password to UE PC
                        server_dir: 'c:/pyro_server'           # UE PC directory where all server files will be copied from cygwin POV
                        server_python: 'c:/Python38/python.exe'         # UE PC Python location from Windows POV
                        data_transfer:                    # Iperf endpoint details
                            ssh:
                                #host: '10.63.25.107'       # Iperf endpoint IP
                                host: '10.43.80.187'       # Iperf endpoint IP
                                user: 'ftpuser'              # Iperf endpoint SSH login
                                password: 'ftpuser'      # Iperf endpoint SSH password
                            iperf_options:
                                qci:
                                    2: 12002
                                    3: 13003
                                    4: 14004
                            iperf_interface_ip: '10.43.80.187'         # Application Server interface used for data transfer (-B iperf parameter)
                            ping:
                                ping_host_ip: '10.43.80.187' # Remote host for ping (Start Data Transfer icmp protocol)
                                ping_count: '70'            # ping -c (count) option
                                allowed_packet_loss: '100'    # Allowed packet loss in %

IPSL_POOLS:
    CygwinIpslPool:
        inline_config:
            IPSL_UE_PC_36:                                               # IPSL name
                CAPABILITIES:                                              # Capabilities that IPSL has. (as a list)
                    - PLMN_A                                                # 24408
                CLASS: CygwinSshIpsl                                 # IPSL type.
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to constructor when Ipsl instance is created.
                    configuration:
                        host: '10.53.164.245'
                        user: 'inbabtslabuser'
                        password: 'BT5l@bus3rl0g1n'
                        install_path: '/cygdrive/c/IpslTools/'
                        source_path: 'c:/IpslTools/automation'
                        protocols_path: '/DIA08IGX'
                        ssh_timeout: 10                                  # optional
                        ssh_port: 22                                        # optional
                        telnet_port: 3900                                # optional


ATTENUATORS:
    TopYoung:
        TYPE: TopYoung                               # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.hytem.HytemAttenuator
        CONSTRUCTOR_PARAMETERS:
            ip: '10.41.209.234'
            port: 3001
            min_attenuation: 0
            max_attenuation: 90

CELLS_ATTENUATION:
    ENB_1_CELL_1:
        rf_paths_of_cell:
        -   used_attenuator: TopYoung
            rf_paths_at_attenuator:
            - 4

