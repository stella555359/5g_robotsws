#User Equipment information
#This must be set only if you are using an UE, and the ftp_xyz, xyz_ues, and uepc parameters were set in env_config.yaml

## define global parameters:

#WCDMA FTP Server settings
ftp_wcdma:
  ip: b1.b2.b3.b4        #WCDMA traffic FTP server IP;
  password: xxx          #WCDMA traffic FTP server password;
  username: xxx          #WCDMA traffic FTP server username;

#GSM FTP Server settings
ftp_gsm:
  ip: b1.b2.b3.b4        #GSM traffic FTP server IP;
  password: xxx          #GSM traffic FTP server password;
  username: xxx          #GSM traffic FTP server username;

#LTE FTP Server settings
ftp_lte:
  ip: 10.55.195.190        #LTE traffic FTP server IP;
  password: iperf1          #LTE traffic FTP server password;
  username: Nokia@123          #LTE traffic FTP server username;

#GSM UE settings
gsm_ues:
  - xxx                  #GSM UE serial number (use "adb devices" command to find the serial number);

#LTE UE settings
lte_ues:
  - 5200c9df53263511              #LTE UE serial number (use "adb devices" command to find the serial number);

#WCDMA UE settings
wcdma_ues:
  - xxx                  #WCDMA UE serial number (use "adb devices" command to find the serial number);

#UEPC settings
uepc:
  ip: 10.5.60.167        #UEPC IP address;
  password: Nokia2016!   #UEPC password; [recommended value: Nokia2016!]
  pyro_port: 9091        #Pyro Port; [recommended value: 9091]
  username: rfsharing    #UEPC username; [recommended value: rfsharing]


