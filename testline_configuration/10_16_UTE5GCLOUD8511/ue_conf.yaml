AppServer1: &APP_1 # 1st application server definition
  address: "10.45.168.53"
  user: "5g"
  password: "2019H@slo"
UE_POOLS:
  TafUeAndroidPool: # Ue Pool class defined by library (AndroidUePool is no longer supported !!!)
    inline_config:
      ANDROID_UE_1: # UE name
        CAPABILITIES: # Capabilities that UE has (used to find select UE with Require Ue keyword)
          - REAL_UE
          - REAL_ANDROID_UE
        CLASS: AndroidUe
        CONSTRUCTOR_PARAMETERS: # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
          serial_number: "R5CT62G7KTB" # UE serial number (can be obtained via 'adb devices' command on the UE PC)
          configuration:
            ue_pc_address: "10.42.224.59" # UE PC address
            data_transfer: # data transfer protocols
              iperf:
                app_server: *APP_1
                interval: 1
                version: 2 # OPTIONAL
            qualcomm_prototype: True # OPTIONAL
            network_mode_switch_method:
              "keyevents"
              #   Use keyevents to use keyevents for change_network_mode, get_ue_info, log_ue_info, validate_ue_info of PREFERRED_NET_MODE
              #   Use secretcode to use secretcode panel to change_network_mode
              #   keyevents mode is actually supported only on UEs with Android 12
              #   secretcode mode is used only on Samsungs with Android 12
            path_to_network_mode_type: "Mobile networks/Preferred network type" # OPTIONAL Text which represents path through widgets to preferred network mode type
            secret_code: "*#*#4636#*#*" # OPTIONAL Use it together with network_mode_switch_method set to 'secretcode'
            is_rooted: "yes" # OPTIONAL Set to 'yes' only if UE is rooted (login to UE shell and check that su command works)
            voice_call_technology: "nr" # OPTIONAL Expected technology mode for voice call
            voice_call_technology_timeout: 60.0 # OPTIONAL Timeout for checking the expected technology for voice call
            voice_call_dialing_timeout: -1.0 # OPTIONAL Timeout for dialing (calling) state
