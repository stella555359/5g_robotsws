UE_POOLS:
    AndroidUePool:                                  # Ue Pool class defined by library
        inline_config:
            AT_BASED_UE_1:                          # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE_ASKEY_NSA
                CLASS: QualcommNoLicenseUe                      # AT based type UE class
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    configuration:                  # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
                        serial_com: '7'             # COM ID obtained from qualcomm modem
                        diag_com: '8'               # Diagnostic COM ID
                        ue_pc_ip: '10.42.199.116'    # UE PC IP address
                        pyro_port: '9090'           # TCP Port number on UE PC on which Pyro server will be started
                        login: 'labadmin'            # SSH login to UE PC
                        password: 'ZAQ!2wsxCDE#'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server'    # UE PC directory where all server files will be copied
                        server_python: 'C:/Python/python.exe' # UE PC python location
#                        interface_name: 'Cellular 2'  # mbn interface for data transfer
#                        reset_interface: 'yes'      # disable and enable mbn interface (interface_name) during Require Ue
#                        restart_wwansvc: 'yes'
                        enable_disable_cfun: 'yes'  # send AT+CFUN=1 before attach and AT+CFUN=0 before detach
                        data_transfer:
                            iperf_path: 'C:/iperf/iperf.exe' # iperf.exe location on UE PC - please use Unix like separators
                            server_close_delay: '10'            # OPTIONAL Delay in closing iperf server in case of delay between client ans server hosts
                            iperf_interval: '5'
                            app_servers:
                                APP_1:                                      # 1st iperf server alias
                                    host: '10.42.60.77'                     # Application Server IP
                                    user: 'syslab'                         # Application Server SSH login
                                    password: 'system'                     # Application Server SSH password
                                    iperf_interface_ip: '10.42.129.2'
                            iperf_options:
                                packet: '1200B'
