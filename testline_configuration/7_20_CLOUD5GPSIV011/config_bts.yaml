                $cid: {get_param: cluster_id}
                $vm: oam-0
          storage_meta:
            get_attr: [oam_node, volume_map]
          password: {get_param: password}
          availability-zone: {get_param: availability-zone}
          extra_cloud_config_data: {get_param: extra_cloud_config_data}

  upue_nodes:
    type: OS::Heat::ResourceGroup
    depends_on: oam_node
    properties:
      count: {get_param: number_of_upue_nodes}
      resource_def:
        type: 5GBTS::Node::Common
        properties:
          name:
            str_replace:
              template: $vnf-$cid-$vm$index
              params:
                $vnf: {get_param: vnf_name}
                $cid: {get_param: cluster_id}
                $vm: {get_param: [vnfc_name_prefix, {get_param: vnfc_layout}, upue]}
