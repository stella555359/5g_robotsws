    depends_on: oam_node
    properties:
      count: {get_param: number_of_uvm_nodes}
      resource_def:
        type: 5GBTS::Node::Common
        properties:
          name:
            str_replace:
              template: $vnf-$cid-$vm
              params:
                $vnf: {get_param: vnf_name}
                $cid: {get_param: cluster_id}
                $vm: uvm-0
          roles: [upgrade]
          instance_params:
            server:
              image: {get_param: image}
              flavor: {get_param: [flavors, uvm]}
          instance_index: '%index%'
          vif_model: {get_param: vif_model}
          internal_networks:
            count: 1
            net_list:
              - name: internal
                uuid: {get_attr: [network_setup, networks, internal]}
          database_ip:
            get_attr: [oam_node, internal_ip]
          cluster_id:
