  cpue_nodes:
    type: OS::Heat::ResourceGroup
    depends_on: [oam_node, upue_nodes]
    properties:
      count: {get_param: number_of_cpue_nodes}
      resource_def:
        type: 5GBTS::Node::Common
        properties:
          name:
            str_replace:
              template: $vnf-$cid-$vm$index
              params:
                $vnf: {get_param: vnf_name}
                $cid: {get_param: cluster_id}
                $vm: {get_param: [vnfc_name_prefix, {get_param: vnfc_layout}, cpue]}
