              flavor: {get_param: [flavors, cpue]}
          instance_index: '%index%'
          vif_model: {get_param: vif_model}
          internal_networks:
            count: 2
            net_list:
              - name: internal
                uuid: {get_attr: [network_setup, networks, internal]}
              - name: internal_srv
                uuid: {get_attr: [network_setup, networks, internal_srv]}
          database_ip:
            get_attr: [oam_node, internal_ip]
          cluster_id:
            str_replace:
              template: $vnf-$cid
              params:
                $vnf: {get_param: vnf_name}
                $cid: {get_param: cluster_id}
          timezone: {get_param: timezone}
          dpdk_type: none
          server_group_id: {get_resource: server_group}
          ha_cluster:
            str_replace:
              template: $vnf-$cid-$vm
