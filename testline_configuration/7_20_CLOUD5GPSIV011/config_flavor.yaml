heat_template_version: 2016-04-08

description: 5GBTS_18A heat template for flavors

parameters:
  vnf_prefix:
    type: string
    default: 5gbts
    description: the name prefix for flavors

resources:
  5gbts_oam:
    type: OS::Nova::Flavor
    properties:
      name:
        str_replace:
          template: ${prefix}_oam
          params:
            ${prefix}: {get_param: vnf_prefix}
      vcpus: 2
      ram: 16384
      disk: 40
      extra_specs:
        hw:cpu_model: Haswell
        hw:cpu_policy: dedicated
        hw:cpu_thread_policy: isolate
      is_public: true
      ephemeral: 0
      rxtx_factor: 1.0
      swap: 0

  5gbts_cpif:
    type: OS::Nova::Flavor
    properties:
      name:
        str_replace:
          template: ${prefix}_cpif
          params:
            ${prefix}: {get_param: vnf_prefix}
