      ram: 18432
      disk: 40
      extra_specs:
        hw:cpu_model: Haswell
        hw:cpu_policy: dedicated
        hw:cpu_thread_policy: isolate
      is_public: true
      ephemeral: 0
      rxtx_factor: 1.0
      swap: 0

