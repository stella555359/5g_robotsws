# Please follow with common structure:
# UE_POOLS:
#   AndroidUePool:                # This is for TA UE phones
#     ...
#     ...
#   MCGUePool:                    # This is for MCG UE phones
#     ...
#     ...
# ------------------------------------------------------------------
# For ta_ue (UEManager) usage change only:
# - serial number (can be found on UE PC when type in cmd-line 'adb devices')
# - RAT   --- possible values WCDMA, LTE, GSM
# - ue_pc_ip
# - login (ssh login for your UE PC)
# - password (for ssh)
# - host      |
# - user      | information about data transfer end point (FTP server)
# - password  |
#
# Example:
#
# TA_UE_ROOT:
#     UE_POOLS:
#         AndroidUePool:
#             inline_config:
#                 UE_1:
#                     CAPABILITIES:
#                         - REAL_UE
#                         - REAL_ANDROID_UE
#                         - RAT
#                     STARTING_CELL: 0x6D01
#                     CLASS: AndroidUe
#                     CONSTRUCTOR_PARAMETERS:
#                         serial_number: '12345abc'
#                         configuration:
#                             ue_pc_ip: 'X.X.X.X'
#                             pyro_port: '8080'
#                             login: 'user'
#                             password: 'pass'
#                             server_dir: 'C:/pyro_server'
#                             server_python: 'C:/Python27/python.exe'
#                             data_transfer:
#                                 ssh:
#                                     host: '10.44.44.167'
#                                     user: 'syslab'
#                                     password: 'system'

# For MCG change only:
# - UE_* - UE number in structure
# - UARFCN
# - SCR_CODE
# - IMSI
# - PS_tech
# Example MCG UE map:
#
# TA_UE_ROOT:
#     UE_POOLS:
#        MCGUePool:
#            inline_config:
#                UE_1:
#                    CAPABILITIES:
#                        - CAPABILITIES=REAL_UE
#                        - REAL_MCG_UE
#                    STARTING_CELL:
#                        - UARFCN=10763
#                        - SCR_CODE=1
#                    CLASS: MCGUe
#                    CONSTRUCTOR_PARAMETERS:
#                          IMSI: '244084600000476'
#                          PS_tech: 'R99'
#                UE_2:
#                    CAPABILITIES:
#                        - CAPABILITIES=REAL_UE
#                        - REAL_MCG_UE
#                    STARTING_CELL:
#                        - UARFCN=10813
#                        - SCR_CODE=8
#                    CLASS: MCGUe
#                    CONSTRUCTOR_PARAMETERS:
#                          IMSI: '244084600000478'
#                          PS_tech: 'HSPA'
UE_POOLS:
        AndroidUePool:
            inline_config:
                UE_1:
                    CAPABILITIES:
                        - REAL_UE
                        - REAL_ANDROID_UE
                        - NR
                    CLASS: AndroidUe
                    CONSTRUCTOR_PARAMETERS:
                        serial_number: '4b7b1191'
                        configuration:
                            ue_pc_ip: '10.5.55.70'    # ip pc ue
                            pyro_port: '8080'
                            login: 'rfs_5g'
                            password: 'Nokia02!'
                            server_dir: 'C:/pyro_server2'
                            server_python: 'C:/Python27/python.exe'
                            clear_server_files: 'no'
                            data_transfer:                    # Iperf endpoint details
                                app_servers:
                                    APP1:
                                        host: '10.5.56.28'          # Iperf endpoint IP
                                        user: 'ftp_5g'              # Iperf endpoint SSH login
                                        password: 'Aikon_4321'      # Iperf endpoint SSH password
                                        iperf_interface_ip: '10.5.61.134' # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)
