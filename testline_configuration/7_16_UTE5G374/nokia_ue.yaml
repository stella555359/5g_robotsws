UE_POOLS:
    AndroidUePool:                                  # Ue Pool class defined by library
        inline_config:
            ANDROID_UE_1:                           # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE
                CLASS: AndroidUe                    # UE type is Android so AndroidUe class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'HZQN1876BAK90800333'     # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                  # By Default ue key ('ANDROID_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.42.22.72'    # UE PC IP address
                        pyro_port: '9090'           # TCP Port number on UE PC on which Pyro server will be started
                        login: 'labadmin'            # SSH login to UE PC
                        password: 'ZAQ!2wsx'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server'    # UE PC directory where all server files will be copied
                        server_python: 'C:/Python36/python.exe' # UE PC python location
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
                        processes_to_kill:          # processes to kill on UE PC - anything that may interrupt a test case
                            - 'uemanager'
                            - 'putty'
            ANDROID_UE_2:                           # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - ASKEY_UE
                CLASS: QualcommNoLicenseUe          # UE type is Android so AndroidUe class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'e9bf9d10'       # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                  # By Default ue key ('ANDROID_UE_1' for this ue) is passed to constructor as a name
                        serial_com: '23'            # COM ID obtained from qualcomm modem
                        diag_com: '22'              # Diagnostic COM ID
                        ue_pc_ip: '10.42.22.72'     # UE PC IP address
                        pyro_port: '9090'           # TCP Port number on UE PC on which Pyro server will be started
                        login: 'labadmin'            # SSH login to UE PC
                        password: 'ZAQ!2wsx'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server'    # UE PC directory where all server files will be copied
                        server_python: 'C:/Python36/python.exe' # UE PC python location
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
                        processes_to_kill:          # processes to kill on UE PC - anything that may interrupt a test case
                            - 'uemanager'
                            - 'notepad++'
                            - 'putty'
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                        data_transfer:
                            iperf_path: 'C:/iperf/iperf.exe' # iperf.exe location on UE PC - please use Unix like separators
                            app_servers:
                                APP_1:      # iperf server name
                                    host: '10.42.61.65' # Application Server IP
                                    user: '5g'     # Application Server SSH login
                                    password: '2019H@slo' # Application Server SSH password
#                                    iperf_interface_ip: '10.42.197.170'
                            iperf_options:
                                packet: '1300B'
                            ping:
                                ping_host_ip: '10.42.61.65'
                                ping_count: '10'
                                allowed_packet_loss: '5'
