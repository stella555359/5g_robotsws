UDP_LOG_Settings:                     # This tag must be present in any configuration file, just like it is here.
  BL2217N402A:                              # RMOD SN indicates RMOD on which the setting is done
    ip:  192.168.100.200                                     # indicates the ip of the interface of Windows PC where the UDP logs are collected from. No value, 'none' or 'null' means logs for this RMOD are captured from all PC interfaces 
    port: 51001                             # indicates the port of Windows PC where the UDP logs are collected from.