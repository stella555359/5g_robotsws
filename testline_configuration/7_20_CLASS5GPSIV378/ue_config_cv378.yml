UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_1:                                      # UE name - change if you want
                CAPABILITIES:                          # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_ANDROID_UE
                STARTING_CELL: 0x56BD01                # Cell ID : eNB_I = 0x5670 concat  localCell_Id = 0x08
                CLASS: AndroidUe                       # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'ec1a2fce'          # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                     # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.14.55.132'        # UE PC IP address
                        pyro_port: '9090'              # TCP Port number on UE PC on which Pyro server will be started
                        login: 'cv5g2_6'               # SSH login to UE PC
                        password: 'N0e2Le26'          # SSH password to UE PC
                        server_dir: 'C:/pyro_server'   # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'
                                                       # UE PC python location
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/QCAT.exe'
                                                       #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        diag_cfg_path: 'C:/UEManager/ue_manager_files/pyro_server/DIAG.cfg'
                                                       # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                        data_transfer:                      # Application Server (for Iperf) details
                            iperf_path: '/data/data/com.nokia.syve.uemanager.mobile/'
                            
                            iperf_option:
                                qci:
                                    1: 330000
                                    2: 340000
                                packet: '1330B'
                            ssh:
                                host: '10.14.42.176'         # Application Server IP
                                user: 'ran5g'           # Application Server SSH login
                                password: 'nokia2018'       # Application Server SSH password
                            iperf_interface_ip: '10.11.70.125'
                                                            # Application Server interface used for data transfer
                                                            # (-B iperf parameter)
                            ping:
                                ping_host_ip: '10.11.70.125' # Remote host for ping (Start Data Transfer icmp protocol)
                                ping_count: '10'            # ping -c (count) option
                                allowed_packet_loss: '5'    # Allowed packet loss in 

