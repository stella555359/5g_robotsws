UE_POOLS:
    AndroidUePool:                                              # Ue Pool class defined by library
        inline_config:
            UE_1:                                               # UE name
                CAPABILITIES:                                   # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE
                CLASS: AndroidUe                                # AT based type UE class
                CONSTRUCTOR_PARAMETERS:                         # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: '0123456789ABCDEF'           # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                              # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.42.22.77'                  # UE PC IP address
                        pyro_port: '9090'                       # TCP Port number on UE PC on which Pyro server will be started
                        login: 'wro5grrm'                       # SSH login to UE PC
                        password: '5gpass!1'                    # SSH password to UE PC
                        server_dir: 'C:/pyro_server'            # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe' # UE PC python location
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/qcat.exe'    #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        diag_cfg_path: 'C:/pyro_server/DIAG.cfg'         # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                        qcat_analyzer: 'QCAT Sample;Common Displays;Log Packet Summary'
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
                        reset_interface: 'yes'             # disable and enable mbn interface (interface_name) during Require Ue
                        clear_server_files: 'yes'
                        clear_logs: 'yes'
                        processes_to_kill:                # processes to kill on UE PC - anything that may interrupt a test case
                            - 'notepad++'
                            - 'putty'
                            - 'adb'
                            - 'iperf'
                        PDN:
                            default:
                                entryName: '5gsawro'            # This field is required, it defines name under which its stored on UE
                                apn: '5gsawro'                  # This field is required, its the apn address
                                authType: NONE                  # Sets authentication type of the APN, can be one of: NONE, PAP, CHAP, PAP or CHAP
                                carrierEnabled: True            # Sets current status of apn, can be one of: True, False
                                operatorNumeric: '54001'        # Sets the numeric operator ID for the APN. Numeric operator ID is defined as MCC+MNC
                                apnType:                        # This field is required, it always has to be list, even if it just one entry. It tells Android what type of APN it is. Here are listed all possible         types: CBS, DEFAULT,DUN, EMERGENCY, FOTA, HIPRI, IA, IMS, MCX, MMS, SUPL, XCAP
                                    - DEFAULT
                                    - MMS
                                    - IMS
                                    - HIPRI
                                    - SUPL
                                    - FOTA
                                    - CBS
                                    - XCAP
                            5gwro1:
                                entryName: '5gwro1'              # This field is required, it defines name under which its stored on UE
                                apn: '5gwro1'                    # This field is required, its the apn address
                                authType: NONE                   # Sets authentication type of the APN, can be one of: NONE, PAP, CHAP, PAP or CHAP
                                carrierEnabled: True             # Sets current status of apn, can be one of: True, False
                                operatorNumeric: '54001'         # Sets the numeric operator ID for the APN. Numeric operator ID is defined as MCC+MNC
                                apnType:                         # This field is required, it always has to be list, even if it just one entry. It tells Android what type of APN it is. Here are listed all possible         types: CBS, DEFAULT,DUN, EMERGENCY, FOTA, HIPRI, IA, IMS, MCX, MMS, SUPL, XCAP
                                    - DEFAULT
                                    - MMS
                                    - IMS
                                    - HIPRI
                                    - SUPL
                                    - FOTA
                                    - CBS
                                    - XCAP
                        data_transfer:
                            app_servers:
                                APP_1:                                               # iperf server name
                                    host: '10.42.61.65'                              # Application Server IP
                                    user: '5g'                                       # Application Server SSH login
                                    password: '2019H@slo'                            # Application Server SSH password
                                    iperf_interface_ip: '10.42.197.170'              # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)
                                    iperf_interface_name: 'rmnet_data1'
                            iperf_options:
                                tput_collection_src: 'control_app'
                                packet: '1400'
#                                parallel_streams: '4'

ATTENUATORS:
    TopYoung:                                      # attenuator name - change if you want
        TYPE: TopYoung                                 # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.jfw.JfwAttenuator
        CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to Attenuator constructor when Attenuator instance is created.
            ip: '10.42.54.195'                    # IP address of attenuator device
            port: 3001                            # TCP Port number of attenuator device
            min_attenuation: 0                    # 0dB
            max_attenuation: 90                   # 90dB
CELLS_ATTENUATION:
    GNB_1_CELL_1:
        rf_paths_of_cell:
        -   used_attenuator: TopYoung
            rf_paths_at_attenuator:
            - 5
            - 6
    GNB_1_CELL_2:
        rf_paths_of_cell:
        -   used_attenuator: TopYoung
            rf_paths_at_attenuator:
            - 1
            - 2
    GNB_2_CELL_1:
        rf_paths_of_cell:
        -   used_attenuator: TopYoung
            rf_paths_at_attenuator:
            - 3
            - 4
