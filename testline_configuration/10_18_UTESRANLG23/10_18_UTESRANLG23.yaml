UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_FOR_TA:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - QUALCOMM_UE
                    - NBIOT1
                STARTING_CELL: 0x21C01                    # Cell ID to which UE should attach

                CLASS: AtCmdsUe                         # UE type is Qualcomm
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to QualcommNoLicenseUe constructor when Ue instance is created.
                    configuration:
                        serial_com: '5'                   # COM ID obtained from qualcomm modem
                        diag_com: '4'                     # Diagnostic COM ID
                        interface_name: 'Quectel Wireless Ethernet Adapter'    # UE PC Qualcomm network interface name
                        ue_pc_ip: '10.5.48.137'           # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'rfs_rrm'                  # SSH login to UE PC
                        password: 'Nokia02!'              # SSH password to UE PC
                        server_dir: '/cygdrive/c/pyro_server'     # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        clear_logs: 'yes'                 # clears server_dir/logs folder before connecting to server
                        clear_server_files: 'yes'         # clears server_dir/ta_ue_plugin_android folder on UE PC, forcing new files upload
                        turn_off_on_firewall: 'yes'       # turn off firewall before connecting to server and on before shutdown. Windows only.
                        enable_disable_cfun: 'yes'        # enables CFUN (AT+CFUN=1) before attach, disables (AT+CFUN=0) after detach
                        reset_interface: 'yes'            # Disable and Enable the interface=interface_name before test
                        processes_to_kill:                # phrases based on which processes names will be found and killed before test (case insensitive)
                            - 'putty'
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                        data_transfer:                    # Iperf endpoint details
                            ssh:
                                host: '10.43.129.2'       # Iperf endpoint IP
                                user: 'fakelogin'         # Iperf endpoint SSH login
                                password: 'fakepass'      # Iperf endpoint SSH password
                            iperf_path: 'C:\iperf\'       # Iperf.exe location on UE PC
                            iperf_interface_ip: '10.9.146.30'
                            iperf_interval: '5'           # Iperf interval in seconds. Default: 1 ; 0 - no intervals
                            traffic_type: 'nbiot'         # available: nbiot. Changes output parsing.
                            iperf_options:
                                packet: '150B'
                            ping:
                                ping_host_ip: '10.42.129.2' # Remote host for ping (Start Data Transfer icmp protocol)
                                ping_count: '10'            # ping -c (count) option
                                allowed_packet_loss: '5'    # Allowed packet loss in %
                                buffer_size: '56'           # -s ping parameter (linux), -l (windows)
                                timeout: '1000'             # -W ping parameter (linux), -w (windows)
