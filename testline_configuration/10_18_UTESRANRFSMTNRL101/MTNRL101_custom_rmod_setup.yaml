BL2032G1GML:
  fh_interface: CPRI
  preserve_flags: True                      # Creating empty file preserving logs is disabled when False
  switch_nodes: False
#  switch_slave_node_id: 7
#  node_switch_seconds: 120
#  switch_nodes: True
#  freeze_slave_node_switch: True
  send_commands_after_connect:         # List of commands to be sent after console is logged in to RMOD master
    - 'rad -mpw 0x10042 0xc0a864c8'
    - 'rad -mpw 0x10041 0x2'
    - 'rad -mpw 0x10043 51001'
    - 'rad -mpw 0x10045 15728640'
    - 'lmi-eth on'
  send_commands_after_login_master:
    - 'rad -mpw 0x10042 0xc0a864c8'
    - 'rad -mpw 0x10041 0x2'
    - 'rad -mpw 0x10043 51001'
    - 'rad -mpw 0x10045 15728640'
    - 'lmi-eth on'
