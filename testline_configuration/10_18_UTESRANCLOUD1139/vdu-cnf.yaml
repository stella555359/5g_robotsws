# ======== configuration CPRT POD =========
aic-vdu-cprt:
  # ======== configuration CPRT POD support C-RAN deploy =========
  # - Description: node seletor to deploy cprt pod for C-RAN deployment.
  # - Note: cprt is required to deploy on the master node. So the value is key-value come from the master nodes' label
  # - example: ncs.nokia.com/group: AllinOne
  nodeSelector: {}
  # - Description: LRIP roundcheck configure, one instance for one eth pair
  #                for default setting cprt pod have two eth pairs include f1c/f1cs
  #                this is optional setting, if have set vlanId values, the LRIP rouncheck function will be enabled
  #                the vlanId depends on the lab network plan.
  # - Feature ID: 5GC001999
  lripRoundCheckInfo:
  - instanceId: "1"
    vlanId: ""


# =========================== configuration L2NRT POD ==========================================
aic-vdu-l2nrt:
  nodeSelector: {}
  # - Description: deploymentType for different cores mapping
  # - Support Values: NR_L2NRT_10vCPU
  #                   NR_L2NRT_10vCPU_mini (Only For mini cnfLayout）
  # - default value: NR_L2NRT_10vCPU
  # - core mapping as followed
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  # | platform |         deployment type         | cores/hostHyperThreading=true     |  cores/hostHyperThreading=false   |
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  # |   OCP    |  NR_L2NRT_10vCPU                |  5(L2HI) + 4(trsw) + 1(CCSRT)=10 |  NOT SUPPORTED                   |
  # |   OCP    |  NR_L2NRT_10vCPU_mini           |  5(L2HI) + 4(trsw) + 1(CCSRT)=10 |  NOT SUPPORTED                   |
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  deploymentType: "NR_L2NRT_10vCPU"
  # - Description: LRIP roundcheck configure, one instance for one eth pair
  #                for default setting l2rnt pod have two eth pairs include f1/f1s
  #                this is optional setting, if have set vlanId values, the LRIP rouncheck function will be enabled
  #                the vlanId depends on the lab network plan.
  # - Feature ID: 5GC001999
  lripRoundCheckInfo:
  - instanceId: "1"
    vlanId: ""

  # ====== configuration about l2hi container =====
  l2hi:
    dptrace:
      # - Description: Enable or disable l2hi container dptrace function. 0 means disable, 1 means enable.
      enable: "0"
      # - Description: Enable or disable l2hi container payload dump. 0 means disable payload dump, 1 means enable payload dump.
      dump_payload: "0"
      # - Description: Config l2hi container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1.
      # - Note: Maximum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
      filter: "none:none"

# ========================= configuration L2RT POD ====================================
aic-vdu-l2rt:

    # - Description: deploymentType for different cores mapping
  # - Support Values:NR_L2RT_20vCPU
  # - default value: NR_L2RT_20vCPU
  # +----------+----------------------------+--------------------------------------------+----------------------------------+------------------------+
  # | platform |    deployment type         | FDD/TDD | cores/hostHyperThreading=true     |  cores/hostHyperThreading=false   |     Thor or Loki       |
  # +----------+----------------------------+--------------------------------------------+----------------------------------+------------------------+
  # |   OCP    |  NR_L2RT_20vCPU            | FDD/TDD | 12(L2PS) + 6(L2Lo) + 2(CCSRT)=20 |  Not Supported                   |     Thor(RINLINE2)     |
  # +----------+---------------------------------+----------------------------------+--------------------------------------+------------------------+
  deploymentType: "NR_L2RT_20vCPU"

  # ====== configuration about l2rt container =====
  l2rt:
    dptrace:
      # - Description: Enable or disable l2rt container dptrace function. 0 means disable, 1 means enable.
      enable: "0"
      # - Description: Enable or disable l2rt container payload dump. 0 means disable payload dump, 1 means enable payload dump.
      dump_payload: "0"
      # - Description: Config l2rt container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1.
      # - Note: Maximum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
      filter: "none:none"

# ========================= configuration L2RT half POD ====================================
aic-vdu-l2rt-half:

  # - Description: deploymentType for different cores mapping
  # - Support Values: NR_L2RT_12vCPU
  # - default value: NR_L2RT_12vCPU
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  # | platform |         deployment type         |  cores/hostHyperThreading=true    |  cores/hostHyperThreading=false   |
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  # |   OCP    |         NR_L2RT_12vCPU          |  6(L2PS)  + 4(L2Lo) + 2(CCSRT)=12|  Not Supported                   |
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  deploymentType: "NR_L2RT_12vCPU"

  # ====== configuration about l2rt container =====
  l2rt:
    dptrace:
      # - Description: Enable or disable l2rt container dptrace function. 0 means disable, 1 means enable.
      enable: "0"
      # - Description: Enable or disable l2rt container payload dump. 0 means disable payload dump, 1 means enable payload dump.
      dump_payload: "0"
      # - Description: Config l2rt container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1.
      # - Note: Maximum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
      filter: "none:none"
