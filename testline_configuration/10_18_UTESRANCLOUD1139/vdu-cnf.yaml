    ######################### Start of configuration for fhuc/fhm vlan interfaces on RANNIC when fhmSiso set as "direct-connect" #####################################
    ### since CB012410 ##
    # - Description：configuration for fhuc/fhm vlan interfaces for each RANNIC, max support 3 RANNIC
    # -              keys ahm-x(x=a, b, c) means configurations for RANNIC on node which ahm-x is running
    # -              key sn means the serial number of RANNIC used by the network
    # -              key fhuc means configuration for fhuc vlan interface
    # -              key fhm means configuraion for fhm vlan interface
    # -              the followed list section called as vlan interface section include vlName/defaultUnderlyingIface/vid/pcp, pcp only needed in fhuc vlan interface section
    #                - vlName: ""
    #                  defaultUnderlyingIface: ""
    #                  vid: ""
    #                  pcp: ""
    # - How to configure:
    # -   1. if you only need one vlan interface for fhuc or fhm, you can just modify the "defaultUnderlyingIface" and "vid", "vlName" can just use the default
    # -   2. if you need more than one vlan interface for one RANNIC, you can add one vlan interface as followed example
    #        Example:
    #          1. copy the vlan interface section under ahm-x(x=a, b, c).fhuc and align it according to yaml format
    #          2. fill the vlName and defaultUnderlyingIface and vid, the three parameters are mandatory
    #          3. after added the new vlan interfaces, the content of ahm-x(x=a, b, c).fhuc would be like followed
    #          ahm-a:
    #            sn: "asdfghjkl"
    #            fhuc:
    #            - vlName: "fhucplane01"
    #              defaultUnderlyingIface: "ecpri4"
    #              vid: "301"
    #              pcp: "7"
    #            - vlName: "fhucplane02"
    #              defaultUnderlyingIface: "ecpri5"
    #              vid: "301"
    #              pcp: "7"
    #          4. after added fhm vlan interface under ahm-x(x=a, b, c).fhm, the content of ahm-x(x=a, b, c).fhm should be like followed
    #          ahm-a:
    #              sn: "asdfghjkl"
    #            fhm:
    #            - vlName: "fhmplane01"
    #              defaultUnderlyingIface: "ecpri4"
    #              vid: "301"
    #            - vlName: "fhmplane02"
    #              defaultUnderlyingIface: "ecpri5"
    #              vid: "301"
    # - Note: all the vlName of fhuc, fhm and fhs in all the RANNIC(ahm) must be different.
    #         vlName format is: fhucplane<ahm_index><Mark>, Mark support [0~9][A-Z][a-z], follow Linux interface naming rule of max length 15.
    #         for Single vlan, please keep the pcp value as default "7" for fhuc, and pcp value which is not open to user is "2" for fhm.
    #         To distinguish fhuc and fhm, the vlName MUST use prefix "fhuc" for fhuc and prefix "fhm" for fhm.
    ahm-a:
      sn: "L1241303108"
      fhuc:
      - vlName: "fhucplane0c"
        defaultUnderlyingIface: "ecpri3"
        vid: "301"
        pcp: "7"
      - vlName: "fhucplane04"
        defaultUnderlyingIface: "ecpri7"
        vid: "301"
        pcp: "7"
      - vlName: "fhucplane0b"
        defaultUnderlyingIface: "ecpri2"
        vid: "301"
        pcp: "7"
      - vlName: "fhucplane03"
        defaultUnderlyingIface: "ecpri6"
        vid: "301"
        pcp: "7"
      - vlName: "fhucplane0a"
        defaultUnderlyingIface: "ecpri1"
        vid: "301"
        pcp: "7"
      - vlName: "fhucplane02"
        defaultUnderlyingIface: "ecpri5"
        vid: "301"
        pcp: "7"
      - vlName: "fhucplane09"
        defaultUnderlyingIface: "ecpri0"
        vid: "301"
        pcp: "7"
      - vlName: "fhucplane01"
        defaultUnderlyingIface: "ecpri4"
        vid: "301"
        pcp: "7"
      fhm:
      - vlName: "fhmplane0c"
        defaultUnderlyingIface: "ecpri3"
        vid: "295"
      - vlName: "fhmplane04"
        defaultUnderlyingIface: "ecpri7"
        vid: "295"
      - vlName: "fhmplane0b"
        defaultUnderlyingIface: "ecpri2"
        vid: "295"
      - vlName: "fhmplane03"
        defaultUnderlyingIface: "ecpri6"
        vid: "295"
      - vlName: "fhmplane0a"
        defaultUnderlyingIface: "ecpri1"
        vid: "295"
      - vlName: "fhmplane02"
        defaultUnderlyingIface: "ecpri5"
        vid: "295"
      - vlName: "fhmplane09"
        defaultUnderlyingIface: "ecpri0"
        vid: "295"
      - vlName: "fhmplane01"
        defaultUnderlyingIface: "ecpri4"
        vid: "295"
      fhs:
      - defaultUnderlyingIface: "ecpri4"
        vlanInfo:
        - vlName: "fhsplane01"
          vid: ""
        ipInfo:
        - rangeStart: ""
          rangeEnd: ""
          subnet: ""
          role:
          - fhsm
          - fhss
    ahm-b:
      sn: ""
      fhuc:
      - vlName: "fhucplane11"
        defaultUnderlyingIface: "ecpri4"
        vid: ""
        pcp: "7"
      fhm:
      - vlName: "fhmplane11"
        defaultUnderlyingIface: "ecpri4"
        vid: ""
      fhs:
      - defaultUnderlyingIface: "ecpri4"
        vlanInfo:
        - vlName: "fhsplane11"
          vid: ""
        ipInfo:
        - rangeStart: ""
          rangeEnd: ""
          subnet: ""
          role:
          - fhsm
          - fhss
    ahm-c:
      sn: ""
      fhuc:
      - vlName: "fhucplane21"
        defaultUnderlyingIface: "ecpri4"
        vid: ""
        pcp: "7"
      fhm:
      - vlName: "fhmplane21"
        defaultUnderlyingIface: "ecpri4"
        vid: ""
      fhs:
      - defaultUnderlyingIface: "ecpri4"
        vlanInfo:
        - vlName: "fhsplane21"
          vid: ""
        ipInfo:
        - rangeStart: ""
          rangeEnd: ""
          subnet: ""
          role:
          - fhsm
          - fhss

    ######################### Start of configuration for fhuc/fhm vlan interfaces on RANNIC #####################################
    # - Description：configuration for fhuc/fhm vlan interfaces for each RANNIC, max support 12 RANNIC
    # -              keys ahm-x(x=0..11) means configurations for RANNIC on node which ahm-x is running
    # -              key fhuc means configuration for fhuc vlan interface
    # -              key fhm means configuraion for fhm vlan interface which only need to configure when global.fhmSiso is set as "direct-connect"
    # -              the followed list section called as vlan interface section include vlName/defaultUnderlyingIface/vid/pcp, pcp only needed in fhuc vlan interface section
    #                - vlName: ""
    #                  defaultUnderlyingIface: ""
    #                  vid: ""
    #                  pcp: ""
    # - How to configure:
    # -   1. if you only need one vlan interface for fhuc or fhm, you can just modify the "defaultUnderlyingIface" and "vid", "vlName" can just use the default
    # -   2. if you need more than one vlan interface for one RANNIC, you can add one vlan interface as followed example
    #        Example:
    #          1. copy the vlan interface section under ahm-x(x=0..11).fhuc and align it according to yaml format
    #          2. fill the vlName and defaultUnderlyingIface and vid, the three parameters are mandatory
    #          3. after added the new vlan interfaces, the content of ahm-x(x=0..11).fhuc would be like followed
    #          ahm-0:
    #            fhuc:
    #            - vlName: "fhucplane01"
    #              defaultUnderlyingIface: "ecpri4"
    #              vid: "301"
    #              pcp: "7"
    #            - vlName: "fhucplane02"
    #              defaultUnderlyingIface: "ecpri5"
    #              vid: "301"
    #              pcp: "7"
    #          4. after added fhm vlan interface under ahm-x(x=0..11).fhm, the content of ahm-x(x=0..11).fhm should be like followed
    #          ahm-0:
    #            fhm:
    #            - vlName: "fhmplane01"
    #              defaultUnderlyingIface: "ecpri4"
    #              vid: "301"
    #            - vlName: "fhmplane02"
    #              defaultUnderlyingIface: "ecpri5"
    #              vid: "301"
    # - Note: all the vlName of fhuc, fhm and fhs in all the RANNIC(ahm) must be different.
    #         vlName format is: fhucplane<ahm_index><Mark>, Mark support [0~9][A-Z][a-z], follow Linux interface naming rule of max length 15.
    #         for Single vlan, please keep the pcp value as default "7" for fhuc, and pcp value which is not open to user is "2" for fhm.
    #         To distinguish fhuc and fhm, the vlName MUST use prefix "fhuc" for fhuc and prefix "fhm" for fhm.
    ahm-0:
      fhuc:
      - vlName: "fhucplane01"
        defaultUnderlyingIface: "ecpri4"
        vid: "301"
