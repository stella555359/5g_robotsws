# - Override values for deployment in cloud-development environment
# - Operator need to set the values base on the real scenario.
# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.

global:
  #########################################################
  # global configuration shared by parent and sub charts
  #########################################################

  # - Description: Denote CNF layout in deployment
  # - Support Value:
  #     "DRAN"
  #     "CRAN"
  #     "mini"
  # - Default Value: "DRAN"
  cnfLayout: "DRAN"

  # - Description: securityContext configuration for vDU runAsUser/runAsGroup/fsGroup.
  securityContext:
    runAsUser: 9999
    runAsGroup: 9999
    fsGroup: 9999

  # - Description: Enable graceful cell shutdown for vDU as part of CB013015
  # - Supported values: type boolean true or false
  # - Default value: false
  gracefulCellShutdownEnabled: false


  # - Description: Assigning pods to specific nodes (except L2RT and AHM pod)
  # - Support Value: key-value pair.
  # - Note: the value is key-value pairs come from the node label
  #   # - example:
  #   1) nodeSelector: {}
  #   2) nodeSelector: { "labelA": "A" } or
  #      nodeSelector: { labelA: A }
  #   3) nodeSelector: { "labelA": "A", "labelB": "B" }
  #   4) nodeSelector: { "labelWithEmptyValue": "" } or
  #      nodeSelector: { labelWithEmptyValue:  } or
  #      nodeSelector: { labelWithEmptyValue }
  # If sub chart is configured with nodeSelector(e.g. certman-auto-cmp.nodeSelector) and the value of sub chart with
  #   nodeSelector is not empty, sub chart shall prevail.
  # In case of dual-server vCU+vDU , nodeSelector shall use the MSW as the node hostname for vDU and worker as the node hostname for vCU.
  #   #- example:
  #   1)nodeSelector: { "kubernetes.io/hostname": "master0"}
  #   2)nodeSelector: { kubernetes.io/hostname: master0}
  nodeSelector: {}

  # - Description: upInstanceNodeSelector to control the L2RT and AHM pod prefer to deployment and RAN-NIC SW controller perfer to RAN-NIC selection
  # - Note: the value is key-value come from the nodes' label, and only one label supported
  # - example:
  #   1) upInstanceNodeSelector: {}
  #   2) upInstanceNodeSelector: { "config.nokia.com/accelerator": "rannic" } or
  #      upInstanceNodeSelector: { config.nokia.com/accelerator: rannic }
  #   3) upInstanceNodeSelector: { "config.nokia.com/application": "" } or
  #      upInstanceNodeSelector: { config.nokia.com/application:  } or
  #      upInstanceNodeSelector: { config.nokia.com/application }
  upInstanceNodeSelector: {}

  # - Description: Policy for NodeSelector, preferred or required
  # - Support value: type string "preferred" or "required"
  # - Default value: "preferred"
  upInstanceNodeSelectorPolicy: "preferred"

  # Description: Control the number of AHM/L2RT pod and RANNIC Card number in CR.
  # - Note: The ahm and RANNIC Card count is equal with <global.upInstanceCount + global.halfUpInstanceCount>
  #         The L2RT pod is equal with <upInstanceCount>
  # Support value: 1 ~ 12 (Both support 1 and 12).
  # Default value is 1.
  # Feature: CB009567-A
  upInstanceCount: 1

  # Description: Control the number of AHM/L2RT-half pod and RANNIC Card number in CR.
  # - Note: The ahm and RANNIC Card count is equal with <global.upInstanceCount + global.halfUpInstanceCount>
  #         The L2RT-half pod is equal with <halfUpInstanceCount>
  # Support value: 0 ~ 2.
  # Default value is 0.
  # Feature: CB011051-K
  halfUpInstanceCount: 0

  # - Description: the number of l2nrt POD to deploy.
  # - support value: 1-3, depends on F1-U throughput
  # - default value: 1
  # - feature: CB009567-A
  l2nrtCount: 1

  # - Description: The number of ORAN O1 Pod for 5G CNF deployment
  # - Note: During CNF deployment preparation phase, the operator modifies it to 1 to require to deploy the O-RAN O1 pod by O-RAN scene
  # - support value: 0, 1
  # - default value: 0
  # - feature: CB006088-A
  orano1Count: 0

  # - Description: device Pool List
  # - Note: need to be filled according to the real environment!!!
  #         all the device pool values should same as the values in the aic-vcu-prerequisite/values-override.yaml
  devicePoolList:
    # The SR-IOV Device Pool used by bip networks (fast path)
    fastPathBipPool: "openshift.io/sriov_vfio_0"
    # The SR-IOV Device Pool used by f1 networks (fast path)
    fastPathF1uPool: "openshift.io/sriov_vfio_0"
    # The SR-IOV Device Pool used by f1s networks (fast path), which is backup of fastPathF1uPool
    # default value is empty, if set this parameter, will enable link redundancy function
    # Note: must different with fastPathF1uPool
    fastPathF1uPoolBackup: ""
    # The SR-IOV Device Pool used by oam/f1c/fhm/twamp networks (slow path)
    slowPathCommonPool: "openshift.io/sriov_netdevice_0"
    # The SR-IOV Device Pool used by oams/f1cs/twamps networks (slow path),which is backup of slowPathCommonPool
    # default value is empty, if set this parameter, will enable link redundancy function
    # Note: must different with slowPathCommonPool
    slowPathCommonPoolBackup: ""
  # - Description: external network configuration for each network interface
  # List of parameters for each network interface
  # ----------------------------------------------------------------------------------------------------------
  # key                   | description
  # ----------------------------------------------------------------------------------------------------------
  # vlanInfo              | vlanInfo.vid for guest vlan interface VLAN ID
  #                       |   set when guest vlan applied for interface
  #                       |   if not set, host vlan applied
  # ----------------------------------------------------------------------------------------------------------
  # ipInfo                | IP address pool start/end/subnet/role
  #                       |   set when ip info applied for interface
  #                       |     - rangeStart & rangEnd & subnet are mandatory if iface configured ipInfo
  #                       |     - subnet set format as CIDR (e.g. ""10.0.0.0"/24" or "2001:db8::0/128")
  #                       |     - the ip role is not recommand to change
  #                       | NOTE: all ip addresses support family IPv4/IPv6, (e.g. "10.0.0.0" or "2001:db8::0")
  # ----------------------------------------------------------------------------------------------------------
  # policyRouteInfo       | policy route info for oam
  # ----------------------------------------------------------------------------------------------------------
  externalNetwork:
    oam:
      vlanInfo:
        vlName: "mcplane"
        defaultUnderlyingIface: "oam"
        secUnderlyingIface: "oams"
        vid: 224
        mtu: 1500
      ipInfo:
      - rangeStart: "10.5.15.114"
        rangeEnd: "10.5.15.114"
        subnet: "10.5.15.112/29"
        type: "physical"
        role:
        - "oam"
        - "certman-server"
        - "tracecontroller"
      policyRouteInfo:
      - gateway: "10.5.15.113"
        # - Description: the orderNumber of oam route
        # Note: should different from orderNumber in the SCF file to avoid conflict
        orderNumber: "5"
        # - Description: the table id of oam route
        # recommend not to modify
        table: "2"
    f1c:
      vlanInfo:
        vlName: "f1cplane"
        defaultUnderlyingIface: "f1c"
        secUnderlyingIface: "f1cs"
        vid: 223
        mtu: 1500
      ipInfo:
      - rangeStart: "10.5.15.106"
        rangeEnd: "10.5.15.106"
        subnet: "10.5.15.104/29"
        type: "physical"
        role:
        - "F1-C"
    fhm:
      vlanInfo:
        vlName: "fhmplane"
        defaultUnderlyingIface: "fhm"
        vid: 295
        pcp: ""
        mtu: 1500
      ipInfo:
      - rangeStart: "192.168.254.33"
        rangeEnd: "192.168.254.33"
        subnet: "192.168.254.0/26"
        type: "physical"
        role:
        - "fhm"
    f1:
      vlanInfo:
        vlName: "f1uplane"
        defaultUnderlyingIface: "f1"
        secUnderlyingIface: "f1s"
        vid: 223
        mtu: 1500
      ipInfo:
      - rangeStart: "10.5.15.107"
        rangeEnd: "10.5.15.107"
        subnet: "10.5.15.104/29"
        type: "physical"
        role:
        - "Tracing"
        - "F1-U"
    # f1 RAN sharing for additional operator1, only available if RAN sharing function enabled
    f1OP1:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane1"
