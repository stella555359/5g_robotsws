# ========configuration oamfh POD =========
aic-oamfh:
  # ======== configuration OAM POD support C-RAN deploy =========
  # - Description: node selector to deploy oam pod for C-RAN deployment.
  # - Note: oam is required to deploy on the master node. So the value is key-value come from the master nodes' label
  # - example: ncs.nokia.com/group: AllinOne
  nodeSelector: {}

  # ========configuration about dhcp container ========
  dhcp:
    service:
      dhcpv4:
        subnets:
        # Define the whole subnet.
        - subnet: "192.168.254.0/26"
          # Define the actual part of your subnet that is governed.
          pools:
          # Start address & end address of ip pool.
          - startAddress: "192.168.254.34"
            endAddress: "192.168.254.60"
          # - Description: DHCP vendor specific information of master agent ip and port number.
          # - Note: when fhmIso is activated together with "switch network" or "direct connection",
          #         the following configurations are not required and moved to SCF
          optionData:
          # DHCP vendor specific information of master agent ip and port number.
          - code: 61
            alwaysSend: "true"
            data:
              #<Product code>/<Serial number> in option 61 client identifier
              #clientIdentifier is configuerd as a list of product code/serial number of RUs.
              #It is an optional parameter. DHCP option 61 will not be checked by DHCP server,
              #if clientIdentifier is empty. For example:
              #     clientIdentifier:
              #     - "753/001"
              #     - "753/002"
              #     - "753/003"
              #     - "755/001"
              #     - "755/002"
              clientIdentifier:
        # - Description: the subnets used when fhmSiso set as "direct-connect"
        # - Note: please according to your real network plan and requirement to configure it
        # -       for example:
        # -          if you use ECPRI RU, ECPRI subnet is mandatory, don't need to configure CPRI subnet, vice versa.
        # -          if both ECPRI and CPRI RU are used, ECPRI and CPRI subnet are mandatory.
        # -          The upper rules are used for 24R2. Please refer to the definition of relevant features for future configurations
        subnetsForDC:
        # - Description: The ip address pool for eCPRI, where the netmask must be 16
        # -              for example: "192.169.0.0/16"
        - subnet: "192.169.0.0/16"
          type: "eCPRI"
        # - Description: The ip address pool for CPRI, where the netmask must be 24
        # -              for example: "192.170.0.0/24"
        - subnet: "192.170.0.0/24"
          type: "CPRI"
        # - Description: The ip address and port for the sztp request.sztpIpAddressesAndPorts parameter will only be configured when fhmSiso is set as "direct-connect"
        #   Parameter IP and Port  Under sztpIpAddressesAndPorts should not be configured and keep it blank when fhmSiso is set as "switch-network"
        # - Support value: ip is the ip of netconf client (also known as o-ru controller or master agent)
        #                  port is the port information to call home using NETCONF/SSH (port: 4334).If no call home port is provided, the O-RU shall attempt to call home using NETCONF/SSH.
        # - Default value: default ip value is empty, if empty we will fill the master agent (O-RU controller) IP address of the O-DU automatically, currently master agent IP is the value of .global.fhmIpForDC.ipAddress except netmask
        # - Note: port should be empty, for now not support to set.
        # - Feature: CB008048-B
        sztpIpAddressesAndPorts:
        - ip: ""
          port: ""

