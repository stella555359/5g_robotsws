APP_SERVER: &APP_1
    address: '10.45.168.53'
    user: 'syslab'
    password: 'system'
    bind_interface_ip: '10.45.168.53'

pdn_1: &pdn_1
    apn: 'internet'             # This field is required, its the apn address (could be "apn" also)
    apnType:                        # This field is required, it always has to be list, even if it just one entry. It tells Android what type of APN it is. Here are listed all possible
        - DEFAULT
    protocol: 'IPV4'              # Sets the protocol to use to connect to this APN, one of: IP, IPV6, IPV4V6, PPP
    roamingProtocol: 'IPV4'       # Sets the protocol to use to connect to this APN when the device is roaming, one of: IP, IPV6, IPV4V6, PPP

UE_POOLS:
    TafUeAndroidPool:
        inline_config:
            SAMSUNGS22:                                                                             # UE name - change if you want
                CAPABILITIES:                                                                     # Capabilities that UE has. (as a list)
                    - UE_1
                CLASS: AndroidUe           # UE type is Qualcomm so QualcommNoLicense class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:
                    serial_number: 'R5CT80V354J'     # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    configuration:                   # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_address: '10.42.22.134'      # UE PC IP address
                        ue_pc_port: '8080'            # HTTP Port number on UE PC on which ue proxy server will be started
                        login: 'wro5grrm'            # SSH login to UE PC
                        password: '5gpass!1'         # SSH password to UE PC
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
                        data_transfer:                                                            # Application Server (for Iperf) details
                            iperf:
                                app_server: *APP_1
                                binary_path: '/data/data/com.nokia.android.application/'
                                interface_name: 'internet'
                        pdns:
                          default: *pdn_1
