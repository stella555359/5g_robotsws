PA_NR:                                            #ID of Programmable Attenuator
    ATT1:                                         #ID for attenuator
    ip: 10.255.5.91                              #IP of Programmable Attenuator
    type: RadioRack                               #Type of the PA [possible values: Hytem, JFW, RadioRack, TopYoung]
    port: 50000                                   #Attenuator’s port for management, e.q. for RadioRack value should be 50000
    atten_ports: 1 2 3 4 5 6 7 8       #List of attenuation lines ports separated by space
    ants:
        F7163223888:                              #RMOD 1 Serial Number      
            ANT1: 1 2 3 4                      
        L1144205969:                              #RMOD 2 Serial Number
            ANT1: 5 6 7 8
                                   

ATT2:                                              #ID for attenuator nb 2
        ip: 10.255.5.92                               #IP of Programmable Attenuator
        type: RadioRack                                #Type of the PA [possible values: Hytem, JFW, RadioRack, TopYoung]
        port: 50000                                    #Attenuator’s port for management, e.q. for RadioRack value should be 50000
        atten_ports: 1 2 3 4 5 6 7 8                      #List of attenuation lines ports separated by space
        ants:
          F7163223888:                              #RMOD 1 Serial Number      
            ANT1: 1 2 3 4 
          L6150736153:                                   #RMOD 3 Serial Number
                ANT1: 5 6 7 8
