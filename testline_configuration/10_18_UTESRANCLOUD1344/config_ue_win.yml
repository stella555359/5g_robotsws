UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_1:
                CAPABILITIES:
                    - GSM_only                           # this UE will be tested on WCDMA/GSM
                CLASS: AndroidUe                  
                STARTING_CELL: 913C                         # cell id in hex; the UE is attached to this cell; cell id can be found in NAA
                CONSTRUCTOR_PARAMETERS:
                    serial_number: 'R58H0J9DE1LV0190600615'               # UE serial number from adb
                    configuration:
                        clear_server_files: 'yes'           # to clear server files always when the plugin starts
                        clear_logs: 'yes'                   # to clear server logs always when the plugin starts
                        service_call_attach: '16'           # service_call_attach and service_call_detach must be set on 16 for Nokia with Android 12
                        service_call_detach: '16'           # for Samsung these two parameters should be missing from this configuration
                        ue_pc_ip: 10.5.53.26                  
                        pyro_port: '8080'
                        login: 'wcdmata'
                        password: 'Aikon_123456*8'
                        id: '1' 
                        server_python: 'C:/Python27/python.exe'
                        server_dir: 'C:/pyro_server'        
                        data_transfer:
                            app_servers:
                                APP1:
                                    host: '10.9.146.30'                  # Iperf endpoint IP
                                    user: 'ftpuser'                      # Iperf endpoint SSH login
                                    password: '99ftpuser'                # Iperf endpoint SSH password
                                    #iperf_interface_ip: '10.9.146.30'   # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)
                                                                         

