heat_template_version: 2016-10-14

description: 5GBTS 19A, template for creating external networks

parameters:
  network_opts:
    type: json
  dual_stack:
    type: string
    description: configure single network or dual network
    default: disabled
    constraints:
      - allowed_values: [disabled, enabled]

resources:
  ext_nets:
    type: OS::Heat::ResourceGroup
    properties:
      count:
        yaql:
          expression: $.data.len()
          data: {get_param: [network_opts, networks]}
      resource_def:
        type: modules/5gbts_ext_network_template.yaml
        properties:
          vnf_name: {get_param: [network_opts, vnf_name]}
          dns_forwarders: [{get_param: [network_opts, dns_forwarders]}]
          index: "%index%"
          external_networks: {get_param: [network_opts, networks]}
          dual_stack: {get_param: [dual_stack]}

outputs:
  net_uuids:
    description: network uuids for all created networks
    value:
      {list_join: ["", get_attr: [ext_nets, net_uuid]]}
