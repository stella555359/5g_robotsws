heat_template_version: 2016-04-08
description: Template for 5gbts application node

parameters:
  name:
    description: Name to be used as the host name for the VM
    type: string
  internal_networks:
    description: Internal networks
    type: json
    default:
      count: 0
      net_list: []
  external_networks:
    description: External networks
    type: json
    default:
      count: 0
      net_list: []
  database_ip:
    description: IP address to reach centralized database service
    type: string
  timezone:
    type: string
    constraints:
      - custom_constraint: timezone
  dpdk_type:
    type: string
    default: none
  cluster_id:
    type: string
    description: Cluster identity
    constraints:
      - allowed_pattern: "[a-zA-Z0-9_-]+"
  storage_meta:
    description: Storage user parameters for shared volumes
    type: json
  local_volumes:
    type: json
    description: Local volumes to be attached
    default:
      count: 0
      volumes: []
  ha_cluster:
    description: HA nodes acting as etcd member instances and quorate voter
    type: string
  instance_params:
    type: json
  roles:
    description: Deployment roles associated
    type: comma_delimited_list
    default: [application]
  password:
    description: password to use for RCP account
    type: json
  vif_model:
    type: string
    description: virtual interface model
    default: avp
  availability-zone:
    description: availability zone region
    type: string
  extra_cloud_config_data:
    type: json
    description: custom cloud init configuration
    default: {}
  upgrade-node:
    type: boolean
    description: indicate whether it is upgrade node
    default: false
  number_of_nodes:
    type: json
    description: node count information
    default: {}
  config_external_ip:
    description: configure external ip and roles if set true
    type: string
  cloudplatform_mapping:
    type: json
    default:
      enabled: NCIR
      disabled: ~

resources:
### Networks
  ports:
    type: 5GBTS::Networks::Common
    properties:
      internal_networks: {get_param: internal_networks}
      external_networks: {get_param: external_networks}
      vif_model: {get_param: vif_model}
      name_prefix: {get_param: name}

# Local disks
  local_vol:
    type: RCP::VolumeGroup::Local
    properties:
      volumes: {get_param: [local_volumes]}
  local_vol_attach:
    type: OS::Heat::ResourceGroup
    properties:
      count: {get_param: [local_volumes, count]}
      resource_def:
        type: RCP::Volume::Attachment
        properties:
          index: "%index%"
          server: {get_resource: server}
          volumes: {get_attr: [local_vol, volume_id]}

  cloud_config:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        timezone: {get_param: timezone}

  extra_cloud_config:
    type: OS::Heat::CloudConfig
    properties:
      cloud_config:
        {get_param: extra_cloud_config_data}

  cloud_init:
    type: OS::Heat::MultipartMime
    properties:
      parts:
        - config: {get_resource: cloud_config}
          subtype: cloud-config
        - config: {get_resource: extra_cloud_config}
          subtype: cloud-config
  server:
    type: OS::Nova::Server
    properties:
      name: {get_param: name}
      image: {get_param: [instance_params, server, image]}
      flavor: {get_param: [instance_params, server, flavor]}
      availability_zone: {get_param: availability-zone}
      networks: {get_attr: [ports, ports]}
      user_data_format: RAW
      user_data: {get_resource: cloud_init}
      metadata:
        map_merge:
          -
            database: {get_param: database_ip}
            roles: {get_param: roles}
            dpdk-conf-type: {get_param: dpdk_type}
            cluster-id: {get_param: cluster_id}
            etcd-instances: [get_param: ha_cluster]
            quorate-monitor-voter-nodes: [get_param: ha_cluster]
            password: {get_param: password}
            enable_internal_dhcp: false
          -
            get_attr: [ports, ip-info]
          -
            get_attr: [local_vol, provider_map]
          -
            get_param: storage_meta
          -
            upgrade-node: {get_param: upgrade-node}
          -
            get_param: number_of_nodes
          -
            ext-ip-config-physical: {get_attr: [ports, ext-ip-config]}
            cloudplatform:
              get_param:
              - cloudplatform_mapping
              - get_param: config_external_ip
      config_drive: true

outputs:
  internal_ip:
    description: Internal IP address allocated to access the node
    value: {get_attr: [ports, internal_ip]}
