heat_template_version: 2016-04-08
description: Instantiate network configuration needed by 5GBTS network configuration

parameters:
  oam_network:
    description: Public network from which to allocate external OAM IP address
    type: string
  internal_networks:
    type: json
    description: internal network cidr and allocation pool
    default:
      internal: [192.168.1.0/24, 192.168.1.2, 192.168.1.165]
      internal_srv: [169.254.0.0/24, 169.254.0.2, 169.254.0.165]
  external_networks:
    description: External network uuids
    type: json
    default: {}
  provider_name:
    description: provider net name for management and internal networks
    type: string
  name_prefix:
    description: Prefix to use in resource names to help differentiate them from similar resources of other stacks
    type: string
    default: vBTS

### Internal Networks Information

  internal_ip_version:
    type: number
    description: IP version of internal network
    default: 4
    constraints:
      - allowed_values: [4, 6]
  internal_enable_dhcp:
    type: string
    description: Enable internal network dhcp
    default: True
  internal_srv_ip_version:
    type: number
    description: IP version of internal service network
    default: 4
    constraints:
      - allowed_values: [4, 6]

resources:
  internal_net:
    type: OS::Neutron::Net
    properties:
      name:
        str_replace:
          template: $prefix-internal-net-v$version
          params:
            $prefix: {get_param: name_prefix}
            $version: {get_param: internal_ip_version}
      value_specs:
        provider:network_type: vlan
        provider:physical_network: {get_param: provider_name}

  internal_subnet:
    type: OS::Neutron::Subnet
    properties:
      name:
        str_replace:
          template: $prefix-internal-subnet-v$version
          params:
            $prefix: {get_param: name_prefix}
            $version: {get_param: internal_ip_version}
      network: {get_resource: internal_net}
      cidr: {get_param: [internal_networks, internal, 0]}
      ip_version: {get_param: internal_ip_version}
      enable_dhcp: {get_param: internal_enable_dhcp}
      allocation_pools:
        -
          start: {get_param: [internal_networks, internal, 1]}
          end: {get_param: [internal_networks, internal, 2]}

  internal_srv_net:
    type: OS::Neutron::Net
    properties:
      name:
        str_replace:
          template: $prefix-internal_srv-net-v$version
          params:
            $prefix: {get_param: name_prefix}
            $version: {get_param: internal_srv_ip_version}
      value_specs:
        provider:network_type: vlan
        provider:physical_network: {get_param: provider_name}

  internal_srv_subnet:
    type: OS::Neutron::Subnet
    properties:
      name:
        str_replace:
          template: $prefix-internal_srv-subnet-v$version
          params:
            $prefix: {get_param: name_prefix}
            $version: {get_param: internal_srv_ip_version}
      network: {get_resource: internal_srv_net}
      cidr: {get_param: [internal_networks, internal_srv, 0]}
      ip_version: {get_param: internal_srv_ip_version}
      enable_dhcp: False
      allocation_pools:
        -
          start: {get_param: [internal_networks, internal_srv, 1]}
          end: {get_param: [internal_networks, internal_srv, 2]}

outputs:
  networks:
    description: map of networks names to uuids
    value:
      map_merge:
        -
          internal: {get_resource: internal_net}
          internal_srv: {get_resource: internal_srv_net}
          oam: {get_param: oam_network}
        -
          get_param: external_networks
  service_ip_map:
    description: internal-service-ip-pool metadata parameter
    value:
      internal-service-ip-pool:
        internal:
          cidr: {get_param: [internal_networks, internal, 0]}
          exclude_range_start: {get_param: [internal_networks, internal, 1]}
          exclude_range_end: {get_param: [internal_networks, internal, 2]}
        internal_srv:
          cidr: {get_param: [internal_networks, internal_srv, 0]}
          exclude_range_start: {get_param: [internal_networks, internal_srv, 1]}
          exclude_range_end: {get_param: [internal_networks, internal_srv, 2]}
