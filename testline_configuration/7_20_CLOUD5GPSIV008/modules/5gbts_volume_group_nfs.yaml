heat_template_version: 2016-04-08
description: "Template to crate a group of shared NFS volumes"

parameters:
  nfs_host:
    type: string
    description: NFS server hostname or IP address
  volumes:
    type: json
    description: Volumes to be attached
    default:
      count: 0
      vol_list: []

resources:
  volume_group:
    type: OS::Heat::ResourceGroup
    properties:
      count: {get_param: [volumes, count]}
      resource_def:
        type: RCP::Volume::NFS
        properties:
          index: "%index%"
          nfs_host: {get_param: nfs_host}
          volumes: {get_param: [volumes, vol_list]}
          name_prefix: {get_param: [volumes, name_prefix]}
outputs:
  volume_id:
    description: UUID values of the volumes
    value: {get_attr: [volume_group, volume_id]}
  provider_map:
    description: Storage provider metadata map for shared NFS disks
    value:
      map_merge: {get_attr: [volume_group, provider_map]}
  user_map:
    description: Storage user metadata map for shared NFS disks
    value:
      map_merge: {get_attr: [volume_group, user_map]}
