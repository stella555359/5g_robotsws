heat_template_version: 2016-04-08
description: "Template for attaching a volume to a server instance"

parameters:
  index:
    description: Index to fetch the correct volume UUID
    type: number
  volumes:
    description: List of volume UUIDs to attach
    type: comma_delimited_list
  server:
    description: The Nova server instance to attach the volume to
    type: string

resources:
  volume_attachment:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: {get_param: [volumes, {get_param: index}]}
      instance_uuid: {get_param: server}
