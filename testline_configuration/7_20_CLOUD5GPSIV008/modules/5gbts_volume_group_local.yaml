heat_template_version: 2016-04-08
description: Template to crate a group of local volumes

parameters:
  volumes:
    type: json
    description: Volumes to be attached
    default:
      count: 0
      vol_list: []

resources:
  volume_group:
    type: OS::Heat::ResourceGroup
    properties:
      count: {get_param: [volumes, count]}
      resource_def:
        type: RCP::Volume::Local
        properties:
          index: "%index%"
          volumes: {get_param: [volumes, vol_list]}
          name_prefix: {get_param: [volumes, name_prefix]}
outputs:
  volume_id:
    description: UUID values of the volumes
    value: {get_attr: [volume_group, volume_id]}
  provider_map:
    description: Storage provider metadata map
    value:
      map_merge: {get_attr: [volume_group, provider_map]}
  mount:
    description: cloud-config directive to mount the disk from cloud-init
    value: {get_attr: [volume_group, mount]}
  fs_setup:
    description: cloud-config directive to initialize file system from cloud-init
    value: {get_attr: [volume_group, fs_setup]}
