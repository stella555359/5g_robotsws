aic-vdu-l2nrt:
  deploymentType: NR_L2NRT_10vCPU
aic-vdu-l2rt:
  deploymentType: NR_L2RT_20vCPU
global:
  image:
    registry: ccr-krk-py-vrf-01.ocp.ska-lab.nsn-rdnet.net:443/vdu
  devicePoolList:
    fastPathBipPool: openshift.io/sriov_vfio_2
    fastPathF1uPool: openshift.io/sriov_vfio_2
    slowPathCommonPool: openshift.io/sriov_netdevice_2
  externalNetwork:
    ahm-a:
      sn: "L1240606047"
      fhm:
      - defaultUnderlyingIface: ecpri4
        vid: "1206"
        vlName: fhmplane01
      fhuc:
      - defaultUnderlyingIface: ecpri4
        pcp: "7"
        vid: "1206"
        vlName: fhucplane01
    f1:
      ipInfo:
      - rangeEnd: 10.255.8.2
        rangeStart: 10.255.8.2
        role:
        - Tracing
        - F1-U
        subnet: 10.255.8.0/24
        type: physical
      vlanInfo:
        vlName: f1uplane
        vid: "1206"
    f1c:
      ipInfo:
      - rangeEnd: 10.255.6.2
        rangeStart: 10.255.6.2
        role:
        - F1-C
        subnet: 10.255.6.0/24
        type: physical
      vlanInfo:
        vid: "1206"
    l2biphi:
      vlanInfo:
        vid: "3806"
    l2biprt:
      vlanInfo:
        vid: "3806"
    oam:
      ipInfo:
      - rangeEnd: 10.83.243.141
        rangeStart: 10.83.243.141
        role:
        - oam
        - certman-server
        - tracecontroller
        subnet: 10.83.243.128/26
        type: physical
      policyRouteInfo:
      - gateway: 10.83.243.190
        orderNumber: "5"
        table: "2"
      vlanInfo:
        vid: "608"
  fhmIpForDC:
    role:
    - fhm
  storageClassName: lvms-vg1
  fhmSiso: direct-connect
  name_convention:
    container_prefix:
    - ctr
    deployment_prefix:
    - ute
    pod_prefix:
    - ute
    statefulset_prefix:
    - ute
  pvcName: vdu-pvc
