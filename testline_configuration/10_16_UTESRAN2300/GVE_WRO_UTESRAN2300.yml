ATTENUATORS:
    JFW_LTE:                                      # attenuator name - change if you want
        TYPE: JFW                                 # attenuator type ,to use; or you may give it directly: ta_attenuator.attenuators_impl.jfw.JfwAttenuator
        CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to Attenuator constructor when Attenuator instance is created.
            ip: '10.42.61.39'                    # IP address of attenuator device
            port: 3001                            # TCP Port number of attenuator device
            min_attenuation: 0                    # 0dB
            max_attenuation: 95                  # 95dB
    JFW_5G:                                      # attenuator name - change if you want
        TYPE: TopYoung                                 # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.jfw.JfwAttenuator
        CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to Attenuator constructor when Attenuator instance is created.
            ip: '10.42.61.40'                    # IP address of attenuator device
            port: 3001                            # TCP Port number of attenuator device
            min_attenuation: 0                    # 0dB
            max_attenuation: 90                 # 95dB
    JFW_3G_2G:                                      # attenuator name - change if you want
        TYPE: JFW                                 # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.jfw.JfwAttenuator
        CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to Attenuator constructor when Attenuator instance is created.
             ip: '10.42.61.190'                    # IP address of attenuator device
             port: 3001                            # TCP Port number of attenuator device
             min_attenuation: 0                    # 0dB
             max_attenuation: 95                  # 95dB

