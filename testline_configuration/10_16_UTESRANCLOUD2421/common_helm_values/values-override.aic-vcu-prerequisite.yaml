# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.
# - values-override.yaml will overwrite the values.yaml file.
# - Operator need to set the following values base on the real scenario.

global:
# - Description: The parameters storageClassName and accessModes should be configured by the operator.
# - Note:
#     OCP multi-node, the storageClassName value should be "ocs-storagecluster-cephfs", and the accessModes value should be "ReadWriteMany"
#     OCP single node, the storageClassName value should be "lvms-vg1", and the accessModes value should be "ReadWriteOnce"
#     AWS single node, the storageClassName value should be "gp2" or "ebs-sc", and the accessModes value should be "ReadWriteOnce" as per Feature CB012156
#     AWS multi-node, the storageClassName value should be "longhorn", and the accessModes value should be "ReadWriteMany" as per Feature CB014440
#     Other 3rd-party kubernetes platform, set the storageClassName and the accessModes according to the real scenario.
#
#   Simple rules:
#     single node, the accessModes value should be "ReadWriteOnce", and specific the storageClassName
#     multi-node, the accessModes value should be "ReadWriteMany", and specific the storageClassName which should support "ReadWriteMany"
#
#     Do not base on cnfLayout's value "basic" or "redundant" to select accessModes, due to some shared PVCs being used by more than two PODs.
#
#   The storageClassName in aic-vcu/values-override.yaml should be same value as this one.
  storageClassName: "ocs-storagecluster-cephfs"
  accessModes: "ReadWriteMany"

  # Description: To satisfy various configuration requirement in different platform, two flag introduced.
  # Support value: "sriov","host-device","userspace".
  # Default value: "sriov"
  cniType: "sriov"

  image:
    # - Description: registry of image
    # - Default Value: "image-registry.openshift-image-registry.svc:5000/{{ .Release.Namespace }}" for OCP.
    # - Note: For OCP internal image registry, it contains the namespace, {{ .Release.Namespace }} would be translated into actual namespace.
    # - registry: "<<account id>>.dkr.ecr.<<region>>.amazonaws.com" for AWS e.g. "882392854397.dkr.ecr.eu-north-1.amazonaws.com
    registry: "srnclab1019lcm.srnblr.nsn-rdnet.net:8443/ccr"

  # - Description: Assigning pods to specific nodes. node labels must be pre-defined in advance.
  # - Support Value: key-value pair. eg {nokia: winner}
  nodeSelector: {}

aic-vcu-network:

  # - Description: the network interface device pool list, support link redundancy
  # - Note: if fastPathDevicePoolBackup and slowPathDevicePoolBackup are empty, will not use link redundancy
  # - the fastPathDevicePool and fastPathDevicePoolBackup must not be same.For CB014440 it's not applicable fastPathDevicePool and fastPathDevicePoolBackup can be same
  # - the slowPathDevicePool and slowPathDevicePoolBackup must not be same.For CB014440 it's not applicable slowPathDevicePool and slowPathDevicePoolBackup can be same
  # - Support values:
  #   get values by command "kubectl describe node|grep "Allocatable:" -A 10|grep sriov"
  #   fastPathDevicePool and fastPathDevicePoolBackup which need dpdk bond
  #   fastPathDevicePool and fastPathDevicePoolBackup examples as followed:
  # - for Intel NIC which support host dpdk bond, should include "vfio" e.g  openshift.io/sriov_vfio_ens9f0
  # - for Mellanox NIC which not support host dpdk bond, e.g openshift.io/sriov_netdevice_ens34f0
  # - for Feature CB014440 fastPathDevicepool value should include "dpdk" e.g intel.com/sriov_ena_dpdk
  #   slowPathDevicePool and slowPathDevicePoolBackup which don't need dpdk bond, examples as followed:
  # - openshift.io/sriov_netdevice_ens34f0
  # - for Feature CB014440 slowPathDevicepool value should include "net" e.g intel.com/sriov_ena_net
  devicePoolList:
    # The SR-IOV Device Pool used by external-u network(fast path)
    fastPathDevicePool: "openshift.io/sriov_vfio_1"
    # The SR-IOV Backup Device Pool used by external-u-s network(fast path),should be different with fastPathDevicePool.
    # For CB014440 it's not applicable fastPathDevicePool and fastPathDevicePoolBackup can be same
    fastPathDevicePoolBackup: "openshift.io/sriov_vfio_0"
    # The SR-IOV Device Pool used by external-c and internale1 networks(slow path)
    slowPathDevicePool: "openshift.io/sriov_netdevice_1"
    # The SR-IOV Device Pool used by external-c-s and internale1-s networks(slow path),should be different with slowPathDevicePool.
    # For CB014440 it's not applicable slowPathDevicePool and slowPathDevicePoolBackup can be same
    slowPathDevicePoolBackup: "openshift.io/sriov_netdevice_0"
