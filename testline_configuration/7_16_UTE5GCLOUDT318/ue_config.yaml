TEST_CONFIG:
    Report:
        MakeReport: false
        Hostname: 'PZ2_WRO8_MRBTS_50837'
        TestlineType: 'PZ2_WRO8_PERFCAP_ASIL_ABIO_AHLOB_AHFII'
    Backup:
        SCF_5g: true
        SCF_lte: false
    Testcases:
        ThroughputCurves:
            DEFAULT:
                Cell: 'GNB_1_CELL_372'
                Mode: 'SA'
                UeLogApp: 'ELT'
                NoTafUe: true
                NoAttenuator: true
                Attenuation:           # in dB
                    init: 12
                    step: 2
                    final: 70
                Throughput:
                    direction: 'UL'          # UL, DL or ULDL
                    protocol: 'tcp'
                    duration: 20
                    max_segment_size: 1200
                    packet_size: 1400
                    adjustment_time: 20
                Sweeps: 1
                Logs:
                    BIP:
                        Collect: false
                        Analyze: [ul_mcs, max_ul_mcs, min_ul_mcs, ul_rank, max_ul_rank, min_ul_rank,
                                  dl_mcs, max_dl_mcs, min_dl_mcs, dl_rank, max_dl_rank, min_dl_rank,
                                  ul_prb, pucch_sinr, pusch_sinr, rssi]
                    UE_LOG:
                        Collect: true
                        Analyze: [pathloss, rsrp, rsrq, rssi, sinr, ul_mcs, ul_prb, mtpl, ul_rank, ul_bler, ul_ibler, cqi,
                                 avg_ul_tput, max_ul_tput, avg_ul_ip_tput, max_ul_ip_tput,
                                 rx1_rsrp, rx2_rsrp, rx3_rsrp, rx4_rsrp, rx1_rssi, rx2_rssi, rx3_rssi, rx4_rssi,
                                 rx1_sinr, rx2_sinr, rx3_sinr, rx4_sinr]
                    SNAPSHOT:
                        Collect: true
                    BTSLOG:
                        Collect: true
                    TCPDUMP:
                        Collect: true
                SCF_5g:
                SCF_lte:
                LogPrefix: 'tput_curve_{datetime}'
