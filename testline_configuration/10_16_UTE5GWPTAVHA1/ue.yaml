AppServer1: &APP_1                              # 1st application server definition
   address: '10.42.56.70'
   user: 'syslab'
   password: 'Sysl@bp4ss1!'
   bind_interface_ip: '10.42.56.70'              # OPTIONAL ip of interface used for LTE data transfer
 
pdn_1: &pdn_1
    entryName: 'internet'           # This field is required, it defines name under which its stored on UE
    apnName: 'internet'             # This field is required, its the apn address (could be "apn" also)
    carrierEnabled: True            # Sets current status of apn, can be one of: True, False
    operatorNumeric: '310260'        # Sets the numeric operator ID for the APN. Numeric operator ID is defined as MCC+MNC
    apnType:                        # This field is required, it always has to be list, even if it just one entry. It tells Android what type of APN it is. Here are listed all possible
        - DEFAULT

UE_POOLS:
    TafUeAndroidPool:                                   # Ue Pool class defined by library
        inline_config:
            UE_1:
                CAPABILITIES:                        # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE_1
                CLASS: AndroidUe           # UE type is Qualcomm so QualcommNoLicense class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:
                    serial_number: 'HZQN1876AAKA2000131'
                    #serial_number: 'HZQN1876AAK60100436'     # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    configuration:                   # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
                        ue_pc_address: '10.44.234.220'      # UE PC IP address
                        ue_pc_port: '80' 
                        data_transfer:
                            iperf:
                                app_server: *APP_1
                                interval: 1
                                interface_name: 'internet'

                    qualcomm_prototype: True
            UE_2:
