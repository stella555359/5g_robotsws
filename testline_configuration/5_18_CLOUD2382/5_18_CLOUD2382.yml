UE_POOLS:
    AndroidUePool:
        inline_config:
            AT_BASED_UE_1:                          # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_QUALCOMM_UE
                CLASS: AtCmdsUe                     # AT based type UE class
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    configuration:                  # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
                        serial_com: '12'             # COM ID obtained from qualcomm modem
                        diag_com: '13'               # Diagnostic COM ID
                        ue_pc_ip: '10.5.48.140'    # UE PC IP address
                        pyro_port: '9090'           # TCP Port number on UE PC on which Pyro server will be started
                        login: 'rfs_rrm'            # SSH login to UE PC
                        password: 'Nokia02!'         # SSH password to UE PC
                        server_dir: 'C:/pyro_server'    # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe' # UE PC python location
                        #network_mode_switch_method: 'ADB'       # method for change network mode keyword
                        interface_name: 'Cellular 2'  # mbn interface for data transfer
                        reset_interface: 'yes'      # disable and enable mbn interface (interface_name) during Require Ue  
                        enable_disable_cfun: 'yes'  # send AT+CFUN=1 before attach and AT+CFUN=0 before detach
                        processes_to_kill:          # processes to kill on UE PC - anything that may interrupt a test case
                            - 'notepad++'
                            - 'putty'
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                        data_transfer:
                            iperf_path: 'C:/iperf/' # iperf.exe location on UE PC - please use Unix like separators
                            iperf_interval: '5'                 # Iperf interval in seconds (default: 1)
                            app_servers:
                                APP_1:      # iperf server name
                                    host: '10.9.146.30' # Application Server IP
                                    user: 'wroclaw'     # Application Server SSH login
                                    password: 'wroclaw' # Application Server SSH password
                                    # iperf_interface_ip: '10.42.129.5' # OPTIONAL Application Server interface used to bind IP (-B iperf parameter)
                            iperf_options:
                                packet: '1200B'
                                buffer: '1M'
                            traffic_type: 'nbiot'   # available: nbiot; This changes a parsing rules for iperf reports (multiple connections during low throughput)
            UE_FOR_TA:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_ANDROID_UE
                STARTING_CELL: 0x288E01                     # Cell ID to which UE should attach

                CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: '4a62b2d2'           # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        ue_pc_ip: '10.5.48.140'          # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'rfs_rrm'                     # SSH login to UE PC
                        password: 'Nokia02!'               # SSH password to UE PC
                        # shieldbox_com: '21'             # Popek shieldbox COM number (uncomment only if you use Popek shieldboxes)
                        # usb_port_no: '1'                # USB line on Popek Shieldbox (uncomment only if you use Popek shieldboxes)
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/qcat.exe'    #PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        diag_cfg_path: 'C:/pyro_server/DIAG.cfg'         # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        data_transfer:                    # Iperf endpoint details
                            ssh:
                                host: '10.5.26.69'       # Iperf endpoint IP
                                user: 'root'              # Iperf endpoint SSH login
                                password: 'alcatel'      # Iperf endpoint SSH password
