UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_FOR_TA:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - QUALCOMM_UE
#                STARTING_CELL: 0x33101                    # Cell ID to which UE should attach
                CLASS: AtCmdsUe                # UE type is Qualcomm
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to QualcommNoLicenseUe constructor when Ue instance is created.
                    serial_number: 'dafb23ff'
                    configuration:
                        serial_com: '12'                  # COM ID obtained from qualcomm modem
                        diag_com: '11'                    # Diagnostic COM ID
#                        interface_name: 'Mobile Broadband Connection 11'    # UE PC Qualcomm network interface name
                        ue_pc_ip: '10.42.22.50'           # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'wro5gcloud'                # SSH login to UE PC
                        password: 'Secret2.022!'              # SSH password to UE PC
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        clear_logs: 'yes'                 # clears server_dir/logs folder before connecting to server
                        network_mode_switch_method: 'adb' # available values: adb, xposed. In case of adb - no rooting and xposed installation required
                        clear_server_files: 'yes'         # clears server_dir/ta_ue_plugin_android folder on UE PC, forcing new files upload
                        turn_off_on_firewall: 'yes'       # turn off firewall before connecting to server and on before shutdown. Windows only.
                        enable_disable_cfun: 'yes'        # enables CFUN (AT+CFUN=1) before attach, disables (AT+CFUN=0) after detach
                        reset_interface: 'yes'            # Disable and Enable the interface=interface_name before test
                        processes_to_kill:                # phrases based on which processes names will be found and killed before test (case insensitive)
                            - 'putty'
#                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                        data_transfer:                    # Application Server (for Iperf) details
                            iperf_path: 'C:/ue_pc_server/tools/iperf/' # iperf.exe location on UE PC - please use Unix like separators
                            iperf_interface_ip: '10.44.43.51'   # Application Server interface used to bind IP (-B iperf parameter)
                            iperf_interval: '1'                 # Iperf interval in seconds (default: 1)
#                            iperf_details: '_iperf'
                            iperf_options:
                                packet: '1400'
                                buffer: '2M'
                            app_servers:
                                APP_1:
                                    host: '10.42.61.65'       # Application Server IP
                                    user: '5g'             # Application Server SSH login
                                    password: '2019H@slo'      # Application Server SSH password
                                    iperf_interface_ip: '10.44.43.51'         # Application Server interface used for data transfer (-B iperf parameter)


