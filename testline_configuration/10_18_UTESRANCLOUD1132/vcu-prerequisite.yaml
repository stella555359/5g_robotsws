# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.
# - values-override.yaml will overwrite the values.yaml file.
# - Operator need to set the following values base on the real scenario.

global:
# - Description: The parameters storageClassName and accessModes should be configured by the operator.
# - Note:
#     OCP multi-node, the storageClassName value should be "ocs-storagecluster-cephfs", and the accessModes value should be "ReadWriteMany"
#     OCP single node, the storageClassName value should be "lvms-vg1", and the accessModes value should be "ReadWriteOnce"
#     Other 3rd-party kubernetes platform, set the storageClassName and the accessModes according to the real scenario.
#
#   Simple rules:
#     single node, the accessModes value should be "ReadWriteOnce", and specific the storageClassName
#     multi-node, the accessModes value should be "ReadWriteMany", and specific the storageClassName which should support "ReadWriteMany"
#
#     Do not base on cnfLayout's value "basic" or "redundant" to select accessModes, due to some shared PVCs being used by more than two PODs.
#
#   The storageClassName in aic-vcu/values-override.yaml should be same value as this one.
  storageClassName: "ocs-storagecluster-cephfs"
  accessModes: "ReadWriteMany"

  image:
    # - Description: registry of image
    # - Default Value: "image-registry.openshift-image-registry.svc:5000/{{ .Release.Namespace }}" for OCP.
    # - Note: For OCP internal image registry, it contains the namespace, {{ .Release.Namespace }} would be translated into actual namespace.
    registry: "image-registry.openshift-image-registry.svc:5000/{{ .Release.Namespace }}"

  # - Description: Assigning pods to specific nodes. node labels must be pre-defined in advance.
  # - Support Value: key-value pair. eg {nokia: winner}
  nodeSelector: {}

aic-vcu-network:
  # - Description: the network interface device pool list, support link redundancy
  # - Note: if fastPathDevicePoolBackup and slowPathDevicePoolBackup are empty, will not use link redundancy
  # - the fastPathDevicePool and slowPathDevicePoolBackup must not be same
  # - the slowPathDevicePool and slowPathDevicePoolBackup must not be same
  devicePoolList:
    # The SR-IOV Device Pool used by external-u network(fast path)
    fastPathDevicePool: "openshift.io/sriov_netdevice_ens1f0"
    # The SR-IOV Backup Device Pool used by external-u-s network(fast path),should be different with fastPathDevicePool
    fastPathDevicePoolBackup: ""
    # The SR-IOV Device Pool used by external-c and internale1 networks(slow path)
    slowPathDevicePool: "openshift.io/sriov_netdevice_ens1f0"
    # The SR-IOV Device Pool used by external-c-s and internale1-s networks(slow path),should be different with slowPathDevicePool
    slowPathDevicePoolBackup: ""
