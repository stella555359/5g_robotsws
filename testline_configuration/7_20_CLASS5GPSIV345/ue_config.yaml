UE_POOLS:
    QualcommUePool:
        inline_config:
            # UE name - change if you want
            UE_1:
                # Capabilities that UE has. (as a list)
                CAPABILITIES:
                    # - REAL_UE
                    - REAL_QUALCOMM_UE
                # Cell ID to which UE should attach
                STARTING_CELL: 0xC001

                # UE type is Qualcomm so QualcommUe class will be used
                CLASS: QualcommUe
                # Parameters that will be passed to AndroidUe constructor when
                # Ue instance is created.
                CONSTRUCTOR_PARAMETERS:
                    # UE serial number (can be obtained via 'adb devices'
                    # command on the UE PC)
                    serial_number: '28bb6955'
                    # By Default ue key ('UE_FOR_TA' for this ue) is passed
                    # to constructor as a name
                    configuration:
                        ssh_type: 'cygwin'            # Type of ssh server windows or cygwin
                        UE_Type: 'CPE'
                        AT_port: 'COM7'
                        IMEI: '359403100042525'
                        IMSI: '540014200000055'
                        com_port: '6'                 # Diagnostic COM ID
                        ue_pc_ip: '10.14.63.208'       # UE PC IP address
                        ue_pc_prompt: '.*cv5g2_7> '   # UE PC ssh prompt
                        ue_pc_host: '10.14.63.208'     # UE PC IP address
                        # login: 'cv5g2_7'            # SSH login to UE PC
                        login: 'cv5g2_7'              # SSH login to UE PC
                        password: 'M@r!Ne27'          # SSH password to UE PC
                        # TCP Port number on UE PC on which Pyro server will
                        # be started
                        pyro_port: '9090'
                        # UE PC directory where all server files will be copied
                        server_dir: 'C:/UE_manager/ue_manager_files/pyro_server'
                        server_python: 'C:/Python27/python.exe'
                        server_python3: 'C:/Python38/python.exe'
                        # PATH TO QCAT EXE APPLICATION (required to decode
                        # qmdl file)
                        qcat_exe_path: >
                          C:/Program Files (x86)/Qualcomm/QCAT
                          6.x/Bin/QCAT.exe
                        # PATH to DIAG.cfg file on UE PC (required to filter
                        # qualcomm messages)
                        diag_cfg_path: >
                          C:/UE_manager/ue_manager_files/pyro_server/DIAG.cfg
                        # Timeout for dialing (calling) state
                        voice_call_dialing_timeout: '30'
                        # set to 'yes' if this is a Qualcomm prototype
                        qualcomm_prototype: 'yes'
                        # available values: adb, xposed. In case of adb -
                        # no rooting and xposed installation required
                        network_mode_switch_method: 'adb'
                        # ue type [LINUX, ANROID] - determines way of data
                        # transfer handling (Android - iperf on ue, Linux iperf
                        # on UE_PC (use of QMICM, UE as a modem)
                        ue_type: 'LINUX'
                        # 'C:\ue_pc_server\tools\iperf\iperf.exe' or
                        # '/data/data/com.magicandroidapps.iperf/bin/iperf' or
                        # path to iperf app on UE
                        iperf_adb_dir: >
                          /data/data/com.magicandroidapps.iperf/bin/iperf
                        licence_type: '5G'
                        # phrases based on which processes names will be found
                        # and killed before test (case insensitive)
                        processes_to_kill:
                            - 'putty'
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'

                        port_dict:
                            # [OPTIONAL] Port for heartbeat messages
                            heartbeat: 6005
                            # [OPTIONAL] Port for command input
                            server_command_input: 6007
                            # [OPTIONAL] Port for QXDM messages output
                            server_qxdm_messages: 6008
                            # [OPTIONAL] Port for server command output
                            server_command_output: 6009
                            # [OPTIONAL] Port for RRC messages stream (source
                            # for ta_messsaging), requires ue_pc_server started
                            # with message stream
                            message_stream_port: 6010

                        # Application Server (for Iperf) details
                        data_transfer:
                            # Static IP allocated to UE
                            ue_static_ip: '172.10.1.57'
                            # ue_static_ip: '172.10.6.130'
                            lte_network_ip: '10.14.42.183'
                            ssh:
                                # Application Server IP
                                host: '10.14.42.183'
                                # Application Server SSH login
                                user: 'ran5g'
                                # Application Server SSH password
                                password: 'nokia2018'
                            # Application Server interface used for data
                            # transfer (-B iperf parameter)
                            iperf_interface_ip: '10.11.70.72'
                            ping:
                                # Remote host for ping (Start Data Transfer
                                # icmp protocol)
                                ping_host_ip: '10.11.70.72'
                                # ping -c (count) option
                                ping_count: '10'
                                # Allowed packet loss in %
                                allowed_packet_loss: '5'