UE_POOLS:
    TafUeAndroidPool:                           # Ue Pool class defined by library
        inline_config:
            UE_FOR_TA:                       # UE name
                CAPABILITIES:                   # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:                                                     # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'a096d261'                                             # NOTE: UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        ue_pc_address: '10.42.22.27'                                   # UE PC address
                        qualcomm_prototype: True                                # OPTIONAL
                        is_rooted: 'yes'                                         # OPTIONAL Set to 'yes' only if UE is rooted (login to UE shell and check that su command works)
                        qcat_exe_path: 'C:\Program Files\Qualcomm\QCAT7\Bin\QCAT.exe'       #PATH TO QCAT EXE APPLICATION
                        diag_cfg_path: 'C:/pyro_server/DIAG.cfg'      # PATH to DIAG.cfg file on UE PC (required to decode qmdl file)
                        data_transfer:                                                      # data transfer protocols
                            iperf:
                                app_server: *APP_1
