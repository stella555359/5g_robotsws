# - Override values for deployment in cloud-development environment
# - Operator need to set the values base on the real scenario.
# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.

global:
  #########################################################
  # global configuration shared by parent and sub charts
  #########################################################

  # - Description: sys env variable for distinguish vRAN2.0 from vRAN4.0
  # - Value type: string
  # - Support values: "2.0", "LOOKASIDE", "RLOOKASIDE", "4.0", "INLINE", "RINLINE"
  # - Default value: "4.0"
  # - Notice: "2.0", "LOOKASIDE", "RLOOKASIDE" are same. "4.0", "INLINE", "RINLINE" are same.
  cloudRanVersion: "4.0"

  # - Description: flag to control if activate vDU deployment with optimized memory for L2-RT and L2-Hi containers in 23R1.
  # - NOTE: This flag shall be disabled by default and shall need to be enabled during deployment of the vDU on hardware with 128GB RAM per OE server
  # -       This flag will be removed after the 23R2 all containers optimization
  # -       If you have no special requirements for vRAN4.0 deploying in 128G RAM HW, it is not recommended to modify this configuration
  # - Value type: boolean
  # - Support value: false and true
  # - Default value: false
  activeMemOptimization: false

  # - Description: flag to control if activate vDU deployment with optimized memory for these containers in list in 23R2.
  #           up pod: l2rt, l2hi
  #         cprt pod: cprt
  #       oamext pod: oamagent, tracecontroller, ipsecmgmt
  #       oamctp pod: oamctp
  #        oamfh pod: oamfh
  #        oamcm pod: oamcm
  #       oamasm pod: oamasm, oamembe
  #        oampm pod: oampm
  #        oamfm pod: oamfm
  #    oamconfig pod: oamconfig
  #   oamkpianalyzer: oamkpianalyzer
  # - NOTE: This flag shall be disabled by default and shall need to be enabled during deployment of the vDU on hardware with 128GB RAM per OE server
  # -       This flag will be removed after the 23R2 all containers optimization
  # -       If you have no special requirements for vRAN4.0 deploying in 128G RAM HW, it is not recommended to modify this configuration
  # - Value type: boolean
  # - Support value: false and true
  # - Default value: false
  activeMemOptimization2: false

  # - Description: Denote CNF layout in deployment
  # - Support Value:
  #     "DRAN"
  #     "CRAN"
  #     "mini"
  # - Default Value: "DRAN"
  cnfLayout: "DRAN"

  # - Description: securityContext configuration for vDU runAsUser/runAsGroup/fsGroup.
  securityContext:
    runAsUser: 9999
    runAsGroup: 9999
    fsGroup: 9999

  # - Description: the directory for hostpath volume to storage the core dump info
  # - Note: the default value of coreDumpPath is set to "", means core dump will not be saved
  # -       this config is for internal trouble shooting if set to host path
  # -       example: coreDumpPath: "/tmp/cdump"
  coreDumpPath: ""

  # - Description: Assigning pods to specific nodes (except L2RT and AHM pod)
  # - Support Value: key-value pair.
  # - Note: the value is key-value pairs come from the node label
  #   # - example:
  #   1) nodeSelector: {}
  #   2) nodeSelector: { "labelA": "A" } or
  #      nodeSelector: { labelA: A }
  #   3) nodeSelector: { "labelA": "A", "labelB": "B" }
  #   4) nodeSelector: { "labelWithEmptyValue": "" } or
  #      nodeSelector: { labelWithEmptyValue:  } or
  #      nodeSelector: { labelWithEmptyValue }
  # If sub chart is configured with nodeSelector(e.g. certman-auto-cmp.nodeSelector) and the value of sub chart with
  #   nodeSelector is not empty, sub chart shall prevail.
  nodeSelector: {}

  # - Description: upInstanceNodeSelector to control the L2RT and AHM pod prefer to deployment and RAN-NIC SW controller perfer to RAN-NIC selection
  # - Note: the value is key-value come from the nodes' label.
  # - example:
  #   1) upInstanceNodeSelector: {}
  #   2) upInstanceNodeSelector: { "config.nokia.com/accelerator": "rannic" } or
  #      upInstanceNodeSelector: { config.nokia.com/accelerator: rannic }
  #   3) upInstanceNodeSelector: { "config.nokia.com/application": "vDU", "config.nokia.com/accelerator": "rannic" }
  #   4) upInstanceNodeSelector: { "config.nokia.com/application": "" } or
  #      upInstanceNodeSelector: { config.nokia.com/application:  } or
  #      upInstanceNodeSelector: { config.nokia.com/application }
  upInstanceNodeSelector: {}

  # Description: Control the number of AHM/L2RT pod and RANNIC Card number in CR.
  # Support value: 1 ~ 12 (Both support 1 and 12).
  # Default value is 1.
  # Feature: CB009567-A
  upInstanceCount: 1

  # - Description: the number of l2nrt POD to deploy.
  # - support value: 1-3, depends on F1-U throughput
  # - default value: 1
  # - feature: CB009567-A
  l2nrtCount: 1

  # - Description: Enable sibling core for L2PS application
  # - Support Values: true OR false
  # - default value: false
  # - NOTE: When l2rtL2PSHyperThreading is true, aic-vdu-l2rt.deploymentType will be set as NR_L2RT_1CL2PS_HT_2CL2LO
  # -       If l2rtL2PSHyperThreading set as true, aic-vdu-l2rt.activeSiblingCore MUST be set as "true"
  l2rtL2PSHyperThreading: false

  # - Description: device Pool List
  # - Note: need to be filled according to the real environment!!!
  devicePoolList:
    # The SR-IOV Device Pool used by f1/bip networks (fast path)
    fastPathCommonPool: "openshift.io/sriov_vfio_ens43f0"
    # The SR-IOV Device Pool used by f1s networks (fast path), which is backup of fastPathCommonPool
    # default value is empty, if set this parameter, will enable link redundancy function
    # Note: must different with fastPathCommonPool
    fastPathCommonPoolBackup: ""
    # The SR-IOV Device Pool used by oam/tracing/f1c/fhm/twamp networks (slow path)
    slowPathCommonPool: "openshift.io/sriov_netdevice_ens43f0"
    # The SR-IOV Device Pool used by oams/f1cs/twamps networks (slow path),which is backup of slowPathCommonPool
    # default value is empty, if set this parameter, will enable link redundancy function
    # Note: must different with slowPathCommonPool
    slowPathCommonPoolBackup: ""
  # - Description: external network configuration for each network interface
  # List of parameters for each network interface
  # ----------------------------------------------------------------------------------------------------------
  # key                   | description
  # ----------------------------------------------------------------------------------------------------------
  # vlanInfo              | vlanInfo.vid for guest vlan interface VLAN ID
  #                       |   set when guest vlan applied for interface
  #                       |   if not set, host vlan applied
  # ----------------------------------------------------------------------------------------------------------
  # ipInfo                | IP address pool start/end/subnet/role
  #                       |   set when ip info applied for interface
  #                       |     - rangeStart & rangEnd & subnet are mandatory if iface configured ipInfo
  #                       |     - subnet set format as CIDR (e.g. ""10.0.0.0"/24" or "2001:db8::0/128")
  #                       |     - the ip role is not recommand to change
  #                       | NOTE: all ip addresses support family IPv4/IPv6, (e.g. "10.0.0.0" or "2001:db8::0")
  # ----------------------------------------------------------------------------------------------------------
  # policyRouteInfo       | policy route info for oam & tracing
  # ----------------------------------------------------------------------------------------------------------
  externalNetwork:
    oam:
      vlanInfo:
        vlName: "mcplane"
        defaultUnderlyingIface: "oam"
        secUnderlyingIface: "oams"
        vid: 716
      ipInfo:
      - rangeStart: "10.108.195.130"
        rangeEnd: "10.108.195.130"
        subnet: "10.108.195.128/29"
        type: "physical"
        role:
        - "oam"
        - "certman-server"
        - "tracecontroller"
      policyRouteInfo:
      - gateway: "10.108.195.129"
        # - Description: the orderNumber of oam route
        # Note: should different from orderNumber in the SCF file to avoid conflict
        orderNumber: "5"
        # - Description: the table id of oam route
        # recommend not to modify
        table: "2"
    tracing:
      vlanInfo:
        vlName: "tcplane"
        defaultUnderlyingIface: "tracing"
        vid: 714
      ipInfo:
      - rangeStart: "10.108.195.114"
        rangeEnd: "10.108.195.115"
        subnet: "10.108.195.112/29"
        type: "physical"
        role:
        - "Tracing"

    f1c:
      vlanInfo:
        vlName: "f1cplane"
        defaultUnderlyingIface: "f1c"
        secUnderlyingIface: "f1cs"
        vid: 715
      ipInfo:
      - rangeStart: "10.108.195.122"
        rangeEnd: "10.108.195.122"
        subnet: "10.108.195.120/28"
        type: "physical"
        role:
        - "F1-C"
    fhm:
      vlanInfo:
        vlName: "fhmplane"
        defaultUnderlyingIface: "fhm"
        vid: 295
        pcp: ""
      ipInfo:
      - rangeStart: "192.168.254.33"
        rangeEnd: "192.168.254.33"
        subnet: "192.168.254.0/26"
        type: "physical"
        role:
        - "fhm"
    f1:
      vlanInfo:
        vlName: "f1uplane"
        defaultUnderlyingIface: "f1"
        secUnderlyingIface: "f1s"
        vid: 715
      ipInfo:
      - rangeStart: "10.108.195.123"
        rangeEnd: "10.108.195.123"
        subnet: "10.108.195.120/28"
        type: "physical"
        role:
        - "Tracing"
        - "F1-U"
    # f1 RAN sharing for additional operator1, only available if RAN sharing function enabled
    f1OP1:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane1"
        defaultUnderlyingIface: "f1"
        secUnderlyingIface: "f1s"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        type: "physical"
        role:
        - "F1-U_OP_1"
    # f1 RAN sharing for additional operator2, only available if RAN sharing function enabled
