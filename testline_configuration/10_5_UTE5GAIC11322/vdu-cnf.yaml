  # - Description: network attribute definition for each network.
  #   This section is provide to set the MTU for each network
  networkInfo:
    fhm:
      mtu: 1500
    tracing:
      mtu: 1500
    oam:
      mtu: 1500
    f1c:
      mtu: 1500
    bip:
      mtu: 9000
    fhuc:
      mtu: 1500
    f1:
      mtu: 1500

  # - Description: fhm network connectivity mode.
  # - suport value: direct-connect or switch-network.
  #   direct-connect means deploy fhm VLAN on RANNIC, switch-network means deploy fhm VLAN on OAMFH.
  # - Default value: switch-network
  fhmSiso: "switch-network"

  # - Description:
  #   FHM plane internal network IP pool, only used when fhmSiso set as "direct-connect"
  #   Will be configured to OAMFH Pod and RANNIC.
  #   IP number should >= number of FHM RANNIC + 3
  # - Example:
  #   3 RANNICs, require >=6 IP addresses
  # - Note:
  #   normally no need to change
  #   must not conflict with the subnets of eth0 on OCP and aic-oamfh.dhcp.service.dhcpv4.subnetsForDC and global.fhmIpForDC.ipAddress
  fhmInternalNetworkIpPool: "192.168.251.0/27"

  # - Description:
  #   fhm master agent IP only used when fhmSiso set as "direct-connect"
  # - Note:
  #   CIDR format and the netmask of ipAddress must be 32, normally no need to change,
  #   must not conflict with the subnet of eth0 on OCP and global.fhmInternalNetworkIpPool and aic-oamfh.dhcp.service.dhcpv4.subnetsForDC
  fhmIpForDC:
    ipAddress: "70.70.70.1/32"
    role:
    - "fhm"

  # - Description: the storageclass name of persistent volume. Will use default storageclass in case not filled.
  # -              the storageClass will be used by up and healing controller.
  # - Values:
  # -   OCP multi node: ocs-storagecluster-cephfs
  # -   OCP single node: localfs-lvm-sc
  storageClassName: "lvms-vg1"

