# =========================== configuration L2NRT POD ==========================================
aic-vdu-l2nrt:
  nodeSelector: {}
  # - Description: flag to identify BIOS Hyper-Threading
  # - Support Values: "true"/"false"/true/false
  # - default value: "true"
  # - Note: when BIOS Hyper-Threading enable, activeSiblingCore can set "true" or "false".
  # -       when BIOS Hyper-Threading disable, activeSiblingCore must set "false".
  activeSiblingCore: "true"
  # - Description: deploymentType for different cores mapping
  # - Support Values: NR_L2NRT_3CL2HI
  # - default value: NR_L2NRT_3CL2HI
  # - core mapping as followed
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  # | platform |         deployment type         | cores/activeSiblingCore=true     |  cores/activeSiblingCore=false   |
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  # |   OCP    |  NR_L2NRT_3CL2HI                |  6(L2HI) + 4(trsw) + 2(CCSRT)=12 |  3(L2HI) + 2(trsw) + 1(CCSRT)=6  |
  # +----------+---------------------------------+----------------------------------+----------------------------------+
  deploymentType: "NR_L2NRT_3CL2HI"
  # - Description: LRIP roundcheck configure, one instance for one eth pair
  #                for default setting l2rnt pod have two eth pairs include f1/f1s
  #                this is optional setting, if have set vlanId values, the LRIP rouncheck function will be enabled
  #                the vlanId depends on the lab network plan.
  # - Feature ID: 5GC001999
  lripRoundCheckInfo:
  - instanceId: "1"
    vlanId: ""

  # ====== configuration about l2hi container =====
  l2hi:
    securityContext:
      # Description: the flag that indicate if l2hi run with privileged permission. Support Values: true, false.
      # Default: "false"
      # Note: WA for run on RH-OCP version lower than 4.9, l2hi can only run under privilgedMode as true
      privilegedMode: "false"
    dptrace:
      # - Description: Enable or disable l2hi container dptrace function. 0 means disable, 1 means enable.
      enable: "0"
      # - Description: Enable or disable l2hi container payload dump. 0 means disable payload dump, 1 means enable payload dump.
      dump_payload: "0"
      # - Description: Config l2hi container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1.
      # - Note: Maximum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
      filter: "none:none"

# ========================= configuration L2RT POD ====================================
aic-vdu-l2rt:
  # - Description: flag to identify BIOS Hyper-Threading
  # - Support Values: "true"/"false"/true/false
  # - default value: "true"
  # - Note: when BIOS Hyper-Threading enable, activeSiblingCore can set "true" or "false".
  # -       when BIOS Hyper-Threading disable, activeSiblingCore must set "false".
  activeSiblingCore: "true"
  # - Description: deploymentType for different cores mapping
  # - Support Values: NR_L2RT_2CL2PS_2CL2LO,NR_L2RT_4CL2PS_2CL2LO,NR_L2RT_6CL2PS_4CL2LO,NR_L2RT_8CL2PS_4CL2LO,NR_L2RT_1CL2PS_HT_2CL2LO
  # - default value: NR_L2RT_2CL2PS_2CL2LO
  # - NOTE:
  #     NR_L2RT_1CL2PS_HT_2CL2LO is for CB0010350-C PoC, NR_L2RT_1CL2PS_HT_2CL2LO should be used only when global.l2rtL2PSHyperThreading is true.
  #     If global.l2rtL2PSHyperThreading is true but deployment type is other than NR_L2RT_1CL2PS_HT_2CL2LO, then deployment type will be set as
  #     NR_L2RT_1CL2PS_HT_2CL2LO automatically
  # +----------+----------------------------+--------------------------------------------+----------------------------------+
  # | platform |    deployment type         | FDD/TDD | cores/activeSiblingCore=true     |  cores/activeSiblingCore=false   |
  # +----------+----------------------------+--------------------------------------------+----------------------------------+
  # |   OCP    |  NR_L2RT_2CL2PS_2CL2LO     |  TDD    | 4(L2PS) + 4(L2Lo) + 2(CCSRT)=10  |  2(L2PS) + 2(L2Lo) + 1(CCSRT)=5  |
  # |   OCP    |  NR_L2RT_4CL2PS_2CL2LO     |  FDD    | 8(L2PS) + 4(L2Lo) + 2(CCSRT)=14  |  4(L2PS) + 2(L2Lo) + 1(CCSRT)=7  |
  # |   OCP    |  NR_L2RT_6CL2PS_4CL2LO     |  TDD    | 12(L2PS) + 8(L2Lo) + 2(CCSRT)=22 |  6(L2PS) + 4(L2Lo) + 1(CCSRT)=11 |
  # |   OCP    |  NR_L2RT_8CL2PS_4CL2LO     |  TDD    | 16(L2PS) + 8(L2Lo) + 2(CCSRT)=26 |  8(L2PS) + 4(L2Lo) + 1(CCSRT)=13 |
  # |   OCP    |  NR_L2RT_1CL2PS_HT_2CL2LO  | FDD/TDD |  2(L2PS) + 4(L2Lo) + 2(CCSRT)=8  |  Not Supported                   |
  # +----------+----------------------------+--------------------------------------------+----------------------------------+
  deploymentType: "NR_L2RT_8CL2PS_4CL2LO"

  # ====== configuration about l2rt container =====
  l2rt:
    dptrace:
      # - Description: Enable or disable l2rt container dptrace function. 0 means disable, 1 means enable.
      enable: "0"
      # - Description: Enable or disable l2rt container payload dump. 0 means disable payload dump, 1 means enable payload dump.
      dump_payload: "0"
      # - Description: Config l2rt container dptrace filter. Format: messageID:queueID. Example: none:1(means messageID not set ,queueID set with 1), which means will trace em packets with local queueID=1.
      # - Note: Maximum dptrace filter condition num is 4. Example: "none:1,1:10,10:none,2:5", which means 4 type of em packets will be traced: 1. local queueID=1; 2. messageID=1 and local queueID=10; 3. messageID=10; 4. messageID=2 and local queueID=5.
      filter: "none:none"
