#Logical Config infodmation;
#This must be set only if you are using a logical config and LOGICAL_CONFIG_XXXX parameter from env_config.yaml was set;
my_pdu1: &PDU_logical_config                          #defines PDU/FAC label
    IP      :   10.255.2.86
    TYPE    :   EPC                     #supported PDU types: APC, SWH, EPC, FAC

LOGICAL_CONFIG_OPTIONS:                               #Must be the same value that was set in env_config_1.yaml
    LGMTAS14_2FXFC_1FZNJ :                                #Logical config identification name
        RMOD_F7171205134 :                        #Radio module, as defined in device/interfaces.yaml; [possible values: 'ON', 'OFF'] FXFC
            << :           *PDU_logical_config             #refers to the anchor &PDU_1
            OUTLET :        1                 #outletNo from range: 1-8 (APC, SWH), 1-12 (EPC), 1-30 (FAC)
            CONTACTOR :     NORMALLY_CLOSED   #supported values: NORMALLY_OPEN; NORMALLY_CLOSED
            STATE:         'ON'
       
        RMOD_L9132600741 :                       #Radio module, as defined in device/interfaces.yaml; [possible values: 'ON', 'OFF'] FXFC
