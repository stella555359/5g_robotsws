                    UE_LOG:
                        Collect: true
                        Analyze: [pathloss, rsrp, rsrq, rssi, sinr, mtpl,
                                 dl_mcs, dl_prb, mtpl, dl_rank, dl_bler, dl_ibler, cqi,
                                 avg_dl_tput, avg_dl_ip_tput, rx1_rsrp, rx2_rsrp, rx3_rsrp,
                                 rx4_rsrp, rx1_rssi, rx2_rssi, rx3_rssi, rx4_rssi,
