# Please follow with common structure:
# UE_POOLS:
#   AndroidUePool:                # This is for TA UE phones
#     ...
#     ...
#   MCGUePool:                    # This is for MCG UE phones
#     ...
#     ...
# ------------------------------------------------------------------
# For ta_ue (UEManager) usage change only:
# - serial number (can be found on UE PC when type in cmd-line 'adb devices')
# - RAT
# - ue_pc_ip
# - login (ssh login for your UE PC)
# - password (for ssh)
# - host      |
# - user      | information about data transfer end point (FTP server)
# - password  |
#
# Example:
#
# TA_UE_ROOT:
#     UE_POOLS:
#         AndroidUePool:
#             inline_config:
#                 UE_1:
#                     CAPABILITIES:
#                         - REAL_UE
#                         - REAL_ANDROID_UE
#                     STARTING_CELL: 0x6D01
#                     RAT: LTE

#                     CLASS: AndroidUe
#                     CONSTRUCTOR_PARAMETERS:
#                         serial_number: '12345abc'
#                         configuration:
#                             ue_pc_ip: 'X.X.X.X'
#                             pyro_port: '8080'
#                             login: 'user'
#                             password: 'pass'
#                             server_dir: 'C:/pyro_server'
#                             server_python: 'C:/Python27/python.exe'
#                             data_transfer:
#                                 ssh:
#                                     host: '10.44.44.167'
#                                     user: 'syslab'
#                                     password: 'system'

# For MCG change only:
# - UE_* - UE number in structure
# - UARFCN
# - SCR_CODE
# - IMSI
# - PS_tech
# Example MCG UE map:
#
# TA_UE_ROOT:
#     UE_POOLS:
#        MCGUePool:
#            inline_config:
#                UE_1:
#                    CAPABILITIES:
#                        - CAPABILITIES=REAL_UE
#                        - REAL_MCG_UE
#                    STARTING_CELL:
#                        - UARFCN=10763
#                        - SCR_CODE=1
#                    CLASS: MCGUe
#                    CONSTRUCTOR_PARAMETERS:
#                          IMSI: '244084600000476'
#                          PS_tech: 'R99'
#                UE_2:
#                    CAPABILITIES:
#                        - CAPABILITIES=REAL_UE
#                        - REAL_MCG_UE
#                    STARTING_CELL:
#                        - UARFCN=10813
#                        - SCR_CODE=8
#                    CLASS: MCGUe
#                    CONSTRUCTOR_PARAMETERS:
#                          IMSI: '244084600000478'

UE_POOLS:
        AndroidUePool:
            inline_config:
                UE_FOR_TA:                                    # UE name - change if you want
                    CAPABILITIES:                             # Capabilities that UE has. (as a list)
                        - REAL_UE_1
                        - LTE_UE
                    CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                    CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                        serial_number: '800edf00'     # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                        configuration:
                            ue_pc_ip: '10.5.60.79'           # UE PC IP address
                            pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                            login: 'wcdmata'                   # SSH login to UE PC
                            password: 'Nokia02!'              # SSH password to UE PC
                            # shieldbox_com: '21'             # Popek shieldbox COM number (uncomment only if you use Popek shieldboxes)
                            # usb_port_no: '1'                # USB line on Popek Shieldbox (uncomment only if you use Popek shieldboxes)
                            server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                            server_python: 'C:/Python27/python.exe'     # UE PC python location
                            turn_artifactory_update_off: 'yes'     # comentariu
                            data_transfer:                    # Iperf endpoint details
                                ssh:
                                    host: '10.5.26.67'          # Iperf endpoint IP
                                    user: 'root'
                                    password: 'alcatel'

                UE_FOR_TA2:                                    # UE name - change if you want
