aic-vcu-network:
  # - Description: the network interface device pool list, support link redundancy
  # - Note: if fastPathDevicePoolBackup and slowPathDevicePoolBackup are empty, will not use link redundancy
  # - the fastPathDevicePool and slowPathDevicePoolBackup must not be same
  # - the slowPathDevicePool and slowPathDevicePoolBackup must not be same
  devicePoolList:
    # The SR-IOV Device Pool used by s1u,x2u,f1u,xnu,ngu networks (fast path)
    fastPathDevicePool: "openshift.io/sriov_vfio_1"
    # The SR-IOV Device Pool used by oam,tracing,f1c,x2c,xnc,ngc,internale1 networks (slow path)
    slowPathDevicePool: "openshift.io/sriov_netdevice_1"

