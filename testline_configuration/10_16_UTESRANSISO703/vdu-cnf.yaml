global:
  image:
    registry: "ccr-wg-vrf-vdu-01.wroclaw.nsn-rdnet.net:443/vdu"
  upInstanceCount: 3
  l2nrt_count: 3
  devicePoolList:
    fastPathCommonPool: openshift.io/sriov_vfio_1
    fastPathRANNICPool: nokia.com/sriov_rinline_up
    slowPathCommonPool: openshift.io/sriov_netdevice_1
    slowPathRANNICPool: nokia.com/sriov_rinline_cp
  externalNetwork:
    ahm-a:
      sn: "L1243107661"
      fhuc:
      - vlName: "fhucplane01"
        defaultUnderlyingIface: "ecpri4"
        vid: "301"
        pcp: "7"
      fhm:
      - vlName: "fhmplane01"
        defaultUnderlyingIface: "ecpri4"
        vid: ""
      fhs:
      - defaultUnderlyingIface: "ecpri4"
        vlanInfo:
        - vlName: "fhsplane01"
          vid: ""
        ipInfo:
        - rangeStart: ""
          rangeEnd: ""
          subnet: ""
          role:
          - fhsm
          - fhss
    ahm-b:
      sn: "L1243107665"
      fhuc:
      - vlName: "fhucplane11"
        defaultUnderlyingIface: "ecpri4"
        vid: "301"
        pcp: "7"
      fhm:
      - vlName: "fhmplane11"
        defaultUnderlyingIface: "ecpri4"
        vid: ""
      fhs:
      - defaultUnderlyingIface: "ecpri4"
        vlanInfo:
        - vlName: "fhsplane11"
          vid: ""
        ipInfo:
        - rangeStart: ""
          rangeEnd: ""
          subnet: ""
          role:
          - fhsm
          - fhss
    ahm-c:
      sn: "L1243107718"
      fhuc:
      - vlName: "fhucplane21"
        defaultUnderlyingIface: "ecpri4"
        vid: "301"
        pcp: "7"
      fhm:
      - vlName: "fhmplane21"
        defaultUnderlyingIface: "ecpri4"
        vid: ""
      fhs:
      - defaultUnderlyingIface: "ecpri4"
        vlanInfo:
        - vlName: "fhsplane21"
          vid: ""
        ipInfo:
        - rangeStart: ""
          rangeEnd: ""
          subnet: ""
          role:
          - fhsm
          - fhss
    oam:
      vlanInfo:
        vlName: "mcplane"
        defaultUnderlyingIface: "oam"
        secUnderlyingIface: "oams"
        vid: 372
        mtu: 1500
      ipInfo:
      - rangeStart: "10.42.126.118"
        rangeEnd: "10.42.126.118"
        subnet: "10.42.126.64/26"
        type: "physical"
        role:
        - "oam"
        - "certman-server"
        - "tracecontroller"
      policyRouteInfo:
      - gateway: "10.42.126.65"
        # - Description: the orderNumber of oam route
        # Note: should different from orderNumber in the SCF file to avoid conflict
        orderNumber: "5"
        # - Description: the table id of oam route
        # recommend not to modify
        table: "2"
    f1c:
      vlanInfo:
        vlName: "f1cplane"
        defaultUnderlyingIface: "f1c"
        secUnderlyingIface: "f1cs"
        vid: 341
        mtu: 1500
      ipInfo:
      - rangeStart: "10.44.168.214"
        rangeEnd: "10.44.168.214"
        subnet: "10.44.168.0/24"
        type: "physical"
        role:
        - "F1-C"
    fhm:
      vlanInfo:
        vlName: "fhmplane"
        defaultUnderlyingIface: "fhm"
        vid: 295
        pcp: ""
        mtu: 1500
      ipInfo:
      - rangeStart: "192.168.254.33"
        rangeEnd: "192.168.254.33"
        subnet: "192.168.254.0/26"
        type: "physical"
        role:
        - "fhm"
      - rangeStart: "2a00:8a00:8000:5801:2:2d:0:14"
        rangeEnd: "2a00:8a00:8000:5801:2:2d:0:14"
        subnet: "2a00:8a00:8000:5801:2:2d:0:14/120"
        type: "physical"
        role:
        - "fhm"

  # Configuration for the f1 interface
    f1:
      vlanInfo:
        vlName: "f1uplane"
        defaultUnderlyingIface: "f1"
        secUnderlyingIface: "f1s"
        vid: 340
        mtu: 1500
      ipInfo:
      - rangeStart: "10.255.0.143"
        rangeEnd: "10.255.0.145"
        subnet: "10.255.0.0/24"
        type: "physical"
        role:
        # Include "Tracing" here only if f1 is responsible for tracing
        - "Tracing"      
        - "F1-U"

      # policyRouteInfo is an optional configuration.
      # 'policyRouteInfo' is NOT needed for CB014440.
      policyRouteInfo:
      - gateway: ""
        # Order number for tracing route (must differ from SCF file to avoid conflicts)
        orderNumber: "6"
        # Table ID for tracing route (recommended not to modify)
        table: "2"
    l2biphi:
      vlanInfo:
        vid: "3850"
    l2biprt:
      vlanInfo:
        vid: "3850"
  fhmSiso: switch-network
  name_convention:
    container_prefix:
    - ctr
    - _NAMESPACE_
    deployment_prefix:
    - ute
    - _NAMESPACE_
    pod_prefix:
    - ute
    - _NAMESPACE_
    statefulset_prefix:
    - ute
    - _NAMESPACE_
  pvcName: vdu-pvc
  storageClassName: lvms-vg1
aic-vdu-l2rt:
  deploymentType: NR_L2RT_20vCPU
aic-vdu-l2nrt:
  deploymentType: NR_L2NRT_10vCPU
    
  storageClassName: lvms-vg1
