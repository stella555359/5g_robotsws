            CatM:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - QUALCOMM_UE
                    - CATM
                    - catm
                    - CATM1
                    - CatM

                CLASS: QualcommNoLicenseUe                # UE type is Qualcomm
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to QualcommNoLicenseUe constructor when Ue instance is created.
                    configuration:
                        serial_com: '8'                  # COM ID obtained from qualcomm modem
                        diag_com: '10'                    # Diagnostic COM ID
                        iperf_loc: 'c:/Tools/iperf/iperf.exe'       # Iperf.exe location on UE PC
                        ue_pc_ip: '10.45.150.187'        # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'inbabtslabuser'                  # SSH login to UE PC
                        password: 'BT5l@bus3rl0g1n'              # SSH password to UE PC
                        #server_dir: '/cygdrive/c/pyro_server'
                        server_dir: 'c:/pyro_server'
                        server_python: 'c:/Python27/python.exe'     # UE PC python location from Windows POV
                        enable_disable_cfun: 'no'        # enables CFUN (AT+CFUN=1) before attach, disables (AT+CFUN=0) after detach
                        reset_interface: 'no'
                        restart_wwansvc: 'no'
                        clear_server_files: 'yes'
                        clear_logs: 'yes'
                        processes_to_kill:                # phrases based on which processes names will be found and killed before test (case insensitive)
                            - 'putty'
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                        data_transfer:                    # Iperf endpoint details
                            ssh:
                                host: '10.58.241.108'       # Iperf endpoint IP
                                user: 'ftpuser'             # Iperf endpoint SSH login
                                password: 'ftpuser'      # Iperf endpoint SSH password
                            iperf_interface_ip: '10.58.241.108'
                            iperf_options:
                                packet: '1024'

