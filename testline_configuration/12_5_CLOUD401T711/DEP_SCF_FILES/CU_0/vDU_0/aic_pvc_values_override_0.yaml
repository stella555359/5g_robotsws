# - Description: the name of persistent volume
# -       consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character
pvcName: taenv
# - Description: the accessModes of persistent volume.
#   NCIR_CaaS Non SNC: ReadOnlyMany
#   NCIR_CaaS SNC: ReadWriteOnce
#   NCS multi node: ReadWriteMany
#   NCS single node: ReadWriteOnce
accessModes: ReadWriteOnce
# - Description: the storageclass name of persistent volume. Will use default storageclass in case not filled.
# - Values:
# -   NCIR_CaaS Non SNC: ceph-storage-class
# -   NCIR_CaaS SNC: local-volume
# -   NCS multi node: csi-cephfs
# -   NCS single node: dynamic-local-storage
storageClassName: dynamic-local-storage
# - Description: select node to deploy the PVC. it will be automatic allocation by system if the value is blank
# - Note: please use the value of kubernetes.io/hostname.it's usually a ip address,
#         the value can be fetched by command: kubectl get nodes --show-labels
oamnodeAffinityIP:
upnodeAffinityIP:
