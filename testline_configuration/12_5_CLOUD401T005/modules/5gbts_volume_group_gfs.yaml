heat_template_version: 2016-10-14
description: 'v77: Template to crate a group of shared GlusterFS volumes'
parameters:
  gfs_hosts:
    type: comma_delimited_list
    description: GlusterFS server hostnames or IP addresses, primary and secondary
  volumes:
    type: json
    description: parameters for volumes
    default:
      count: 0
      vol_list: []
resources:
  volume_group:
    type: OS::Heat::ResourceGroup
    properties:
      count:
        get_param: [volumes, count]
      resource_def:
        type: RCP::Volume::GFS
        properties:
          index: '%index%'
          gfs_hosts: {get_param: gfs_hosts}
          volumes:
            get_param: [volumes, vol_list]
outputs:
  volume_id:
    description: the resource uuid value of the volume
    value:
      get_attr: [volume_group, volume_id]
  provider_map:
    description: the storage provider metadata map
    value:
      map_merge:
        get_attr: [volume_group, provider_map]
  user_map:
    description: the storage user metadata map
    value:
      map_merge:
        get_attr: [volume_group, user_map]
  peer_map:
    description: the storage peer metadata map
    value:
      map_merge:
        get_attr: [volume_group, peer_map]
