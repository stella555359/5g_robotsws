heat_template_version: 2016-10-14
description: 'v77: Template to instantiate standalone management node instance'
parameters:
  availability_zones:
    description: availability zone region
    type: json
    default:
      default:
      oam_000:
      oam_001:
      cpcl_000:
      cpcl_001:
      cpnb_000:
      cpnb_001:
      cpif_000:
      cpif_001:
      cpnrt_000:
      cpnrt_001:
      db_000:
      db_001:
      db_002:
      uvm:
      cpues:
        default:
        availability_zone_list:
      upues:
        default:
        availability_zone_list:
  number_of_upue_nodes:
    description: number of ues nodes to instantiate
    type: number
    constraints:
      - range: {min: 1, max: 36}
  number_of_cpue_nodes:
    description: number of cpues nodes to instantiate
    type: number
    constraints:
      - range: {min: 1, max: 12}

resources:
  az_default:
    type: OS::Heat::None
    properties:
      az_default: &az_default
        if:
        - equals:
          - get_param: [availability_zones, default, 0]
          - ''
        - ''
        - get_param: [availability_zones, default]

  az_upues:
    type: OS::Heat::ResourceGroup
    properties:
      count: {get_param: number_of_upue_nodes}
      resource_def:
        type: 5GBTS::Common::SingleAvailableZone
        properties:
          index: "%index%"
          availability_zone_list: {get_param: [availability_zones, upues, availability_zone_list]}
          az_default:
            if:
            - equals:
              - get_param: [availability_zones, upues, default, 0]
              - ''
            - *az_default
            - get_param: [availability_zones, upues, default]

  az_cpues:
    type: OS::Heat::ResourceGroup
    properties:
      count: {get_param: number_of_cpue_nodes}
      resource_def:
        type: 5GBTS::Common::SingleAvailableZone
        properties:
          index: "%index%"
          availability_zone_list: {get_param: [availability_zones, cpues, availability_zone_list]}
          az_default:
            if:
            - equals:
              - get_param: [availability_zones, cpues, default, 0]
              - ''
            - *az_default
            - get_param: [availability_zones, cpues, default]

