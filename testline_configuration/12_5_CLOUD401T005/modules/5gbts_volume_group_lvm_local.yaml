heat_template_version: 2016-10-14
description: '2.43.0: Template to assemble metadata map for a group of LVM local volumes'
parameters:
  lvm_volumes:
    type: json
    description: parameters for LVM volumes
    default:
      count: 0
      vol_list: []
resources:
  lvm_volume_group:
    type: OS::Heat::ResourceGroup
    properties:
      count:
        get_param: [lvm_volumes, count]
      resource_def:
        type: RCP::Volume::LVMLocal
        properties:
          index: '%index%'
          lvm_volumes:
            get_param: [lvm_volumes, vol_list]
outputs:
  lvm_volume_count:
    description: number of lvm volumes in group
    value:
      get_param: [lvm_volumes, count]
  provider_map:
    description: the storage provider metadata map
    value:
      map_merge:
        get_attr: [lvm_volume_group, provider_map]
