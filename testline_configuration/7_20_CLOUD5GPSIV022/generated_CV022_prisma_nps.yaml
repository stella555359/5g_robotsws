
lsu_uu:
    type: ue.prisma.lsu
    executor: tl.ues[0].lsu_uu_ssh_connection_details
    script_paths:
        create_5g_cell: cd /home/user/lsu_scripts/; ./start_nr5g
        get_5g_cell_id: trcinfo -p0-2 | grep "COARSE->LOCKED"
        get_4g_cell_id: trcinfo -p0-11 | grep -i cellid
        get_ra_status: trcinfo -p0-5 | grep -i contention
        start_lsu: lsustop;lsuclean;lsustart
        clean_lsu: lsuclean
        stop_lsu: lsustop

tstm_uu:
    type: ue.prisma.tstm
    executor: tl.ues[0].tstm_uu_ssh_connection_details
    script_paths:
        start_tstm: ^cd /home/user/tstm_scripts/ ; ./start_nr5g_Uu_ms_GUI >./nohup_tstmuu.out 2>&1 &
        get_tstm_log: cd /home/user/tstm_scripts/;tail -n 1000 -f ./nohup_tstmuu.out
        clean_tstm_log: cd /home/user/tstm_scripts/;cat /dev/null > ./nohup_uu.out
        stop_tstm: pidin | grep lte_tm_server | grep -v 'grep' | awk '{print $1}' | xargs kill -9

airmosaic:
    type: ue.prisma.airmosaic
    executor: tl.ues[0].airmosaic_ssh_connection_details
    harness: tl.ues[0].airmosaic_harness_connection_details
    cygwin_path:
    cli_path: /home/localuser/Prisma_CV22/airmosaic_14_3/airmosaic_lteuu/bin/airmosaic_lteuu
    preferences_file_path:
    duration:
    suddenshutdown:
    bugreport_folder: /tmp/log
    script_paths:
        start_mosaic: ^cd /home/localuser/Prisma_CV22/airmosaic_14_3/airmosaic_lteuu/bin/; ./airmosaic_lteuu --nogui --nosplash -J-Dcli.mode=true --enable-harness
    scenario_paths:
        attach: NSA_Attach_AMM.sce
        detach: None
        start_traffic: NSA_Attach_AMM.sce
        stop_traffic: None
    parameters:
        enable_amm: true
        clock_timer: 900
        counters:
        log_counters_to_file:
        global_vars:

prisma:
   type: ue.prisma
   components:
     - lsu_uu
     - tstm_uu
     - airmosaic
