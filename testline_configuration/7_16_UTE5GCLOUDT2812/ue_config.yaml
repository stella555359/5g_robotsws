TEST_CONFIG:
    MultiRAT: true
    Report:
        MakeReport: false
        Hostname: 'PZ2_WRO8_MRBTS_55121'
        TestlineType: 'PZ2_WRO8_PERFCAP_2xASIM_3xAVHA'
    Backup:
        SCF_5g: true
        SCF_lte: false

    Testcases:
        ThroughputCurves:
            DEFAULT:
                Cell: 'GNB_1_Triple_NRCELL_12_22_42_FDD_PCI_467_511_511'
                Mode: 'SA'
                UeLogApp: 'ELT' # ELT
                Attenuation:           # in dB
                    init: 50
                    step: 2
                    final: 50
#                    final: 72
                Throughput:
                    direction: 'UL'          # UL, DL or ULDL
                    protocol: 'tcp'
                    duration: 10
                    max_segment_size: 1200
                    packet_size: 1350
                    adjustment_time: 10
                Sweeps: 1
                NoTafUe: true
                NoAttenuator: false
                Logs:
                    BIP:
                      Collect: false
                      Analyze: []
                    UE_LOG:
                      Collect: true
                      Analyze: [
                        rsrp,
                        #beam_rsrp,
                        #avg_dl_rlc_tput,
                        #min_dl_rlc_tput,
                        #max_dl_rlc_tput,
                        #var_dl_rlc_tput,
                        avg_ul_rlc_tput,
                        min_ul_rlc_tput,
                        max_ul_rlc_tput,
                        var_ul_rlc_tput,
                        #min_rsrp,
                        #max_rsrp,
                        #var_rsrp,
                        #min_beam_rsrp,
                        #max_beam_rsrp,
                        #var_beam_rsrp,
                        #avg_rx1_rsrp,
                        #min_rx1_rsrp,
                        #max_rx1_rsrp,
                        #var_rx1_rsrp,
                        #avg_rx2_rsrp,
                        #min_rx2_rsrp,
                        #max_rx2_rsrp,
                        #var_rx2_rsrp,
