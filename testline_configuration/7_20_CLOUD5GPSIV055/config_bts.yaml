  UECP-0_internal_service_port:
    type: OS::Neutron::Port
    properties:
      network_id: { get_resource: internal_service_net }
      fixed_ips:
        - ip_address: { get_param: uecp_internal_service_net_ip }
  
  # Need to define new UECPNodeType        
  UECP-0:
    type: OS::Nova::Server
    depends_on: [ UEUP-0 ]
    properties:
      name: UECP-0
      image: { get_param: image_name }
      flavor: { get_param: flavor_uecp }
