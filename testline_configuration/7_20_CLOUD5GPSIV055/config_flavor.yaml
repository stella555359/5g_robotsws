#-- template to create 5GRAC VNF 
#-- Version: 1.0.0.0
#-- Tenant network and VNFC configuration based on 5G cloud architecture below:
#     https://sharenet-ims.int.net.nokia.com/Overview/D542816454 

#-- Single instance for each VNFC type, no redundancy.

heat_template_version: 2015-04-30
description: 5GRAC for creating 5grac_oam, 5grac_cncp, 5grac_uecp, 5grac_ueup, m1.small flavor.

parameters:

resources:
  # Flavors
  5grac.oam:
    type: OS::Nova::Flavor
    properties:
      name: 5grac.oampsiv055
      disk: 40
      ephemeral: 0
      extra_specs:
        #hw:numa_node.0: 0
        hw:cpu_model: Haswell 
        hw:cpu_policy: dedicated
        aggregate_instance_extra_specs:storage: "local_image"
      is_public: true
      ram: 8192
      rxtx_factor: 1.0
      swap: 0
      vcpus: 2
      
  5grac.cncp:
    type: OS::Nova::Flavor
    properties:
      name: 5grac.cncppsiv055
      disk: 40
      ephemeral: 0
      extra_specs:
        #hw:numa_node.0: 0
        hw:cpu_model: Haswell 
        hw:cpu_policy: dedicated
        aggregate_instance_extra_specs:storage: "local_image"
      is_public: true
      ram: 16384
      rxtx_factor: 1.0
      swap: 0
      vcpus: 2
      
  5grac.uecp:
    type: OS::Nova::Flavor
    properties:
      name: 5grac.uecppsiv055
      disk: 40
      ephemeral: 0
      extra_specs:
        #hw:numa_node.0: 0
        hw:cpu_model: Haswell 
        hw:cpu_policy: dedicated
        aggregate_instance_extra_specs:storage: "local_image"
      is_public: true
      ram: 16384
      rxtx_factor: 1.0
      swap: 0
      vcpus: 2
      
  5grac.ueup:
    type: OS::Nova::Flavor
    properties:
      name: 5grac.ueuppsiv055
      disk: 40
      ephemeral: 0
      extra_specs:
        #hw:numa_node.0: 1
        hw:cpu_model: Haswell 
        hw:cpu_policy: dedicated
        aggregate_instance_extra_specs:storage: "local_image"
      is_public: true
      ram: 16384
      rxtx_factor: 1.0
      swap: 0
      vcpus: 8

