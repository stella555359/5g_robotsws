outputs:
  management_ip:
    description: Primary management IP address allocated to access the system
    value:
      if:
        - deploy_basic_condition
        - get_attr: [oam_nodes_basic, management_ip]
        - if:
          - deploy_redundant_condition
          - get_attr: [oam_nodes_redundant, management_ip]
          - get_attr: [oam_nodes_basic_in_redundant, management_ip]

  management_ips:
    description: All management IP address allocated to access the system
    value:
      if:
