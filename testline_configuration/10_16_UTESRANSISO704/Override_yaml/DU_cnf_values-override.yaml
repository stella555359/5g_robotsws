global:
  # - Description: device Pool List
  # - Note: need to be filled accoring to the real environment!!!
  devicePoolList:
    slowPathCommonPool: openshift.io/sriov_netdevice_1
    fastPathBipPool: openshift.io/sriov_vfio_1
    fastPathF1uPool: openshift.io/sriov_vfio_1
  # - Description: external network configuration for each network interface
  # List of parameters for each network interface
  # ----------------------------------------------------------------------------------------------------------
  # key                   | description
  # ----------------------------------------------------------------------------------------------------------
  # vlanInfo              | vlanInfo.vid for guest vlan interface VLAN ID
  #                       |   set when guest vlan applied for interface
  #                       |   if not set, host vlan applied
  # ----------------------------------------------------------------------------------------------------------
  # ipInfo                | IP address pool start/end/subnet/role
  #                       |   set when ip info applied for interface
  #                       |     - rangeStart & rangEnd & subnet are mandatory if iface configured ipInfo
  #                       |     - subnet set format as CIDR (e.g. ""10.0.0.0"/24" or "2001:db8::0/128")
  #                       |     - the ip role is not recommand to change
  #                       | NOTE: all ip addresses support family IPv4/IPv6, (e.g. "10.0.0.0" or "2001:db8::0")
  # ----------------------------------------------------------------------------------------------------------
  # policyRouteInfo       | policy route info for oam & tracing
  # ----------------------------------------------------------------------------------------------------------
  externalNetwork:
    oam:
      vlanInfo:
        vid: "372"
      ipInfo:
      - rangeEnd: 10.44.169.52
        rangeStart: 10.44.169.52
        role:
        - oam
        - certman-server
        - tracecontroller
        subnet: 10.44.169.32/27
        type: physical
      policyRouteInfo:
      - gateway: 10.44.169.33
        # - Description: the orderNumber of oam route
        # Note: should different from orderNumber in the SCF file to avoid conflict
        orderNumber: "5"
        # - Description: the table id of oam route
        # recommend not to modify
        table: "2"
    tracing:
      ipInfo:
        - rangeEnd: 10.71.171.210
          rangeStart: 10.71.171.210
          role:
            - Tracing
          subnet: 10.71.171.208/29
          type: physical
      vlanInfo:
        vid: "3899"
    f1c:
      vlanInfo:
        vid: "341"
      ipInfo:
      - rangeEnd: 10.255.1.61
        rangeStart: 10.255.1.61
        role:
        - F1-C
        subnet: 10.255.1.0/24
        type: physical
    fhm:
      vlanInfo:
        vid: 295
        pcp: "2"
      ipInfo:
      - rangeEnd: 192.168.197.33
        rangeStart: 192.168.197.33
        role:
        - fhm
        subnet: 192.168.197.0/26
        type: physical
    fhuc1:
      vlanInfo:
        pcp: "7"
    fhuc2:
      vlanInfo:
        pcp: "7"
    f1:
      vlanInfo:
        vlName: "f1uplane"
        vid: "340"
      ipInfo:
        - rangeEnd: 10.255.0.61
          rangeStart: 10.255.0.61
          role:
            - Tracing
            - F1-U
          subnet: 10.255.0.0/24
          type: physical
    ahm-a:
      sn: "L1242200277"
      fhuc:
      - defaultUnderlyingIface: ecpri0
        pcp: "7"
        vid: "301"
        vlName: fhucplane01
    l2biprt:
      vlanInfo:
        vid: "3807"
    l2biphi:
      vlanInfo:
        vid: "3807"
  # - Description: the storageclass name of persistent volume. Will use default storageclass in case not filled.
  # -              the storageClass will be used by up and healing controller.
  # - Values:
  # -   OCP multi node: ocs-storagecluster-cephfs
  # -   OCP single node: lvms-vg1
  storageClassName: "lvms-vg1"

  # - Description: registry of image
  # - OCP: image-registry.openshift-image-registry.svc:5000/<namespace> align with images.properties.OCP in onBoardingApp
  image:
    autoGetSecret: true
#    registry: "image-registry.openshift-image-registry.svc:5000/cran1"
    # - Description: The Kubernetes secret name that stores credential authentication of target image registry,
    # - only kubernetes.io/dockercfg and kubernetes.io/dockerconfigjson types secret supported.
    # - Default value: ""

  # - Description: time zone in format "Region/City", e.g. "Asia/Shanghai". Default as 'UTC'.
#  timezone: "Europe/Warsaw"

 #########################################################
  # global configuration for VDU parent chart
  #########################################################

  # - Description: the name of persistent volume
  # - Note: Ensure uniqueness for every VDU and keep same when do upgrade/update
  # -       consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character
  pvcName: "vdu-pvc"
  # - Description: Description of a site used as auto connection site ID.
  # - Note: As it will be used for identifying the vDU, ensure uniqueness for every vDU
  # -       equal to the value of MRBTS/AutoConnSiteID parameter from the CM plan imported to the NMS
  # -       1 to 50 ASCII characters
  fhmSiso: "direct-connect"
aic-vdu-l2rt:
  deploymentType: "NR_L2RT_20vCPU"

