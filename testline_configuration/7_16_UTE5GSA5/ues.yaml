UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_1:
                CAPABILITIES:
                    - REAL_UE
                    - REAL_ANDROID_UE
                    - OPERATORO
                    - R5CT30R07FW
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:
                    serial_number: 'R5CT30R07FW'           # IMEI: 351285071177127 | Samsung Salaxy S22
                    configuration:
                        ue_pc_ip: '10.42.22.170'
                        pyro_port: '9090'
                        login: 'wro5grrm'
                        password: '5gpass!1'
                        server_dir: 'C:/pyro_server'
                        server_python: 'C:/Python27/python.exe'
                        network_mode_switch_method: 'ADB'
                        qualcomm_prototype: 'yes'
                        service_call_attach: '16'
                        service_call_detach: '16'
                        clear_logs: 'yes'
                        processes_to_kill:
                            - 'uemanager'
                            - 'iperf'
                            - 'notepad++'
                            - 'putty'
                            - 'adb'
                        data_transfer:
                            ip_version: '4'
                            iperf_interval: '1'
                            throughput_measurement_source: 'NAA'
                            app_servers:
