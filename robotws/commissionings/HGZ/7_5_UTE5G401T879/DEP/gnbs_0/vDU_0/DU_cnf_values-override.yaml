        pcp: ""
    fhuc7:
      vlanInfo:
        vid: 
        pcp: ""
    fhuc8:
      vlanInfo:
        vid: 
        pcp: ""
    fhuc9:
      vlanInfo:
        vid: 
        pcp: ""
    fhuc10:
      vlanInfo:
        vid: 
        pcp: ""
    fhuc11:
      vlanInfo:
        vid: 
        pcp: ""
    fhuc12:
      vlanInfo:
        vid: 
        pcp: ""
    fhuc13:
      vlanInfo:
        vid: 
        pcp: ""
    fhuc14:
      vlanInfo:
        vid: 
        pcp: ""
    fhuc15:
      vlanInfo:
        vid: 
        pcp: ""
    fhuc16:
