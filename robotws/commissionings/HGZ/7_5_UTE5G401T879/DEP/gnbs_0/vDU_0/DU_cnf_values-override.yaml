# - Override values for deployment in cloud-development environment
# - Operator need to set the values base on the real scenario.
# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.

global:
  #########################################################
  # global configuration shared by parent and sub charts
  #########################################################

  # - Description: sys env variable for distinguish vRAN2.0 from vRAN4.0
  # - Value type: string
  # - Support values: "2.0", "LOOKASIDE", "RLOOKASIDE", "4.0", "INLINE", "RINLINE"
  # - Default value: "4.0"
  # - Notice: "2.0", "LOOKASIDE", "RLOOKASIDE" are same. "4.0", "INLINE", "RINLINE" are same.
  cloudRanVersion: "2.0"

  # - Description: From 22R4-CB008355-K - Denote CNF layout in deployment
  # - Support Value:
  #     "DRAN"
  #     "CRAN"
  # - Default Value: "DRAN"
  # - Dependencies:
  #     If global.cnfLayout is "DRAN", then
  #           global.service.sdl.deploymode should be set as standalone
  #           rcpsdl.cluster.enabled should be set as false
  #     If global.cnfLayout is "CRAN", then
  #           global.service.sdl.deploymode should be set as sentinel
  #           rcpsdl.cluster.enabled should be set as true
  cnfLayout: "DRAN"

  # - Description: securityContext configuration for vDU runAsUser/runAsGroup/fsGroup.
  securityContext:
    runAsUser: 9999
    runAsGroup: 9999
    fsGroup: 9999

  # - Description: the directory for hostpath volume to storage the coredump info
  # - Note: the default value of coredumppath is set to "", means coredump will not be saved
  # -       this config is for internal trouble shooting if set to host path
  # -       example: coredumppath: "/tmp/cdump"
  coredumppath: ""

  # - Description: Assigning pods to specific nodes. node lables must be pre-defined in advance.
  # - Support Value: key-value pair. eg {nokia: winner}
  # If sub chart is configured with nodeSelector(e.g. certman-auto-cmp.nodeSelector) and the value of sub chart with
  #   nodeSelector is not empty, sub chart shall prevail.
  nodeSelector: {}

  # - Description: the number of ahm pod to deploy, should be same with RNNIC count.
  #                currently support max number is 2
  # - Support value: 1, 2
  # - Default value: 1
  # - Feature: CB009858-F
  ahmCount: 1

  # ======== configuration UP POD support C-RAN deploy =========
  # - Description: the number of up POD to deploy.
  # - Note: for D-RAN only on single node server, the value is number 1 for up pod by default
  #         for C-RAN support deploy on multi-node server, the minimum value is 2, max support 10
  upCount: 1

  # - Description: ptp monitor flag
  # - support values: "true","false",true,false, "true"/true means enable this function, "false"/false means disabled this function
  # - default value: false
  # - Note: if you want to enabled this function, must install ptp operator and OCP version >= 4.11
  ptpMonitorEnabled: false

  # - Description: device Pool List
  # - Note: need to be filled accoring to the real environment!!!
  devicePoolList:
    # The SR-IOV Device Pool used by f1/bip networks (fast path)
    fastPathCommonPool: "openshift.io/sriov_vfio_ens35f1"
    # The SR-IOV Device Pool used by oam/tracing/f1c networks (slow path)
    slowPathCommonPool: "openshift.io/sriov_netdevice_ens35f1"
    # The SR-IOV Device Pool used by fhuc networks (fast path)
    fastPathFhPool: "openshift.io/sriov_vfio_ens37"
    # The SR-IOV Device Pool used by fhm networks (slow path)
    slowPathFhPool: "openshift.io/sriov_netdevice_ens37"
    # The SR-IOV Device Pool used by l1up networks (fast path)
    fastPathRANNICPool: "nokia.com/sriov_rinline_up"
    # The SR-IOV Device Pool used by l1cp networks (slow path)
    slowPathRANNICPool: "nokia.com/sriov_rinline_cp"

  # - Description: external network configuration for each network interface
  # List of parameters for each network interface
  # ----------------------------------------------------------------------------------------------------------
  # key                   | description
  # ----------------------------------------------------------------------------------------------------------
  # vlanInfo              | vlanInfo.vid for guest vlan interface VLAN ID
  #                       |   set when guest vlan applied for interface
  #                       |   if not set, host vlan applied
  # ----------------------------------------------------------------------------------------------------------
  # ipInfo                | IP address pool start/end/subnet/role
  #                       |   set when ip info applied for interface
  #                       |     - rangeStart & rangEnd & subnet are mandatory if iface configured ipInfo
  #                       |     - subnet set format as CIDR (e.g. ""10.0.0.0"/24" or "2001:db8::0/128")
  #                       |     - the ip role is not recommand to change
  #                       | NOTE: all ip addresses support family IPv4/IPv6, (e.g. "10.0.0.0" or "2001:db8::0")
  # ----------------------------------------------------------------------------------------------------------
  # policyRouteInfo       | policy route info for oam & tracing
  # ----------------------------------------------------------------------------------------------------------
  externalNetwork:
    oam:
      vlanInfo:
        vid: 239
      ipInfo:
      - rangeStart: "10.64.163.138"
        rangeEnd: "10.64.163.138"
        subnet: "10.64.163.136/29"
        type: "physical"
        role:
        - "oam"
        - "certman-server"
        - "tracecontroller"
      policyRouteInfo:
      - gateway: "10.64.163.137"
        # - Description: the orderNumber of oam route
        # Note: should different from orderNumber in the SCF file to avoid conflict
        orderNumber: "5"
        # - Description: the table id of oam route
        # recommend not to modify
        table: "2"
    tracing:
      vlanInfo:
        vid: 235
      ipInfo:
      - rangeStart: "10.64.163.122"
        rangeEnd: "10.64.163.122"
        subnet: "10.64.163.120/29"
        type: "physical"
        role:
        - "Tracing"

    f1c:
      vlanInfo:
        vid: 236
      ipInfo:
      - rangeStart: "10.64.163.131"
        rangeEnd: "10.64.163.131"
        subnet: "10.64.163.128/29"
        type: "physical"
        role:
        - "F1-C"
    fhm:
      vlanInfo:
        vid: 234
        pcp: ""
      ipInfo:
      - rangeStart: "192.168.254.33"
        rangeEnd: "192.168.254.33"
        subnet: "192.168.254.0/26"
        type: "physical"
        role:
        - "fhm"
    f1:
      vlanInfo:
        vlName: "f1uplane"
        vid: 236
      ipInfo:
      - rangeStart: "10.64.163.130"
        rangeEnd: "10.64.163.130"
        subnet: "10.64.163.128/29"
        type: "physical"
        role:
        - "Tracing"
        - "F1-U"
    # f1 RAN sharing for additional operator1, only available if RAN sharing function enabled
    f1_op1:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane1"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        type: "physical"
        role:
        - "F1-U_OP_1"
    # f1 RAN sharing for additional operator2, only available if RAN sharing function enabled
    f1_op2:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane2"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        type: "physical"
        role:
        - "F1-U_OP_2"
    # f1 RAN sharing for additional operator3, only available if RAN sharing function enabled
    f1_op3:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane3"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        type: "physical"
        role:
        - "F1-U_OP_3"
    # f1 RAN sharing for additional operator4, only available if RAN sharing function enabled
    f1_op4:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane4"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        type: "physical"
        role:
        - "F1-U_OP_4"
    # f1 RAN sharing for additional operator5, only available if RAN sharing function enabled
    f1_op5:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1uplane5"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        type: "physical"
        role:
        - "F1-U_OP_5"
    #  - Description: Network slice for F1-U,here just list one example for one slice
    #    Add one network slice for F1-U according to following instruction.
    #      1. copy the whole section from "f1_slice1" to "- 'F1-U_slice1'" including all the spaces
    #      2. paste the whole section after line "- 'F1-U_slice1'"
    #      3. modify the section key name "f1_slice1", align with the new vlName and role
    #      4. configure vid( vlan id), rangeStart,rangeEnd,subnet
    #  - Feature ID: CB008473
    #  - Note:
    #    vlName should be unique and can be defined by user, please not exceed 15 characters
    #    role should be unique and format like "F1-U_X"
    #    X is the dynamic part which can be customized by operator. The maximum length for X is 24 and the allowed characters can include [A-Za-z0-9]
    f1_slice1:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "f1u_slice1"
        defaultUnderlyingIface: "f1"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        type: "physical"
        role:
        - "F1-U_slice1"
    # - End example for network slice

    #  - Description: this is only one twamp vlan interface example
    #    Add one vlan interface for the Measurement network as followed steps
    #      1. copy the whole section from "twamp_f1" to "- 'twamp_f1'" including all the spaces
    #      2. paste the whole section after line "- 'twamp_f1'"
    #      3. modify the section key name "twamp_f1", align with the new vlName and role
    #      4. configure vid( vlan id), pcp ,rangeStart,rangeEnd,subnet,family
    #  - Feature ID: CB008468
    #  - Note:
    #    defaultUnderlyingIface and secUnderlyingIface are not recommended to modify
    #    vlName should be unique under twamp section and can be defined by user, please not exceed 15 characters
    #    role should be unique and same in the SCF file
    #    subnet should be same as the Measurement network
    #    if f1 and f1c use the same subnet, only need create one vlan interface here
    twamp_f1:
      vlanInfo:
        # vlName should be set the same as the VLAN interface name in SCF
        vlName: "twamp_f1"
        defaultUnderlyingIface: "twamp"
        vid: ""
      ipInfo:
      - rangeStart: ""
        rangeEnd: ""
        subnet: ""
        type: "physical"
        role:
        - "twamp_f1"
    # - End example for twamp vlan interface

    # - currently, fhuc max support 18 interface.
    # - for Vran4.0 CB009858 feature fhuc1-fhuc3 belong to ahm-0 pod and fhuc4-fhuc6 belong to ahm-1 pod
    fhuc1:
      vlanInfo:
        vid: 238
        pcp: ""
    fhuc2:
      vlanInfo:
        vid: 
        pcp: ""
    fhuc3:
      vlanInfo:
        vid: 
        pcp: ""
    fhuc4:
