kubeapisymptomdataprovider:
  # - Description: node selector to deploy kubeapisymptomdataprovider for C-RAN deployment.
  # - Note: the value is key-value nodes' label
  # - example: ncs.nokia.com/group: AllinOne
  nodeSelector: {}

# ========configuration oamfh POD =========
aic-oamfh:
  # ======== configuration OAM POD support C-RAN deploy =========
  # - Description: node selector to deploy oam pod for C-RAN deployment.
  # - Note: oam is required to deploy on the master node. So the value is key-value come from the master nodes' label
  # - example: ncs.nokia.com/group: AllinOne
  nodeSelector: {}

  # ========configuration about dhcp container ========
  dhcp:
    service:
      # Indicate internal or external dhcp server to be used, the default value is internal
      dhcpServerLocation: "internal"
      # v4PoolsStart and v4PoolsEnd define the actual part of your subnet that is governed
      v4PoolsStart: "192.168.254.34"
      v4PoolsEnd: "192.168.254.60"
      # v4Subnet define the whole subnet.
      v4Subnet: "192.168.254.0/26"

      # DHCP vendor specific information of master agent ip and port number
      option43_vendor_specific_information_master_agent_ip: "192.168.254.33"
      option43_vendor_specific_information_port_number: "13001"

      # <Product code>/<Serial number> in option 61 client identifier
      # clientIdentifier is configuerd as a list of product code/serial number of RUs.
      # It is an optional parameter. DHCP option 61 will not be checked by DHCP server,
      # if clientIdentifier is empty. For example:
      #     clientIdentifier:
      #     - "753/001"
      #     - "753/002"
      #     - "753/003"
      #     - "755/001"
      #     - "755/002"
      clientIdentifier:

