# This configuration file is used to define vDU parameters before vDU deploying.

[CONFIG_FILE]
#Version of this config file.
version=7.32.0
use_cnf_lcm_operator=false

[REMOTE_MODE_INFO]
#The remote_mode is used to enable Kuafu execution from remote server/jumper server that out of target cluster, default is false.
remote_mode=false
#The kubeconfig file for target cluster, absolute path of this file is required.
#It can be left empty if KUBECONFIG variable exported by user. E.g. export KUBECONFIG=<kubeconfig_file_absolute_path>/<kubeconfig_file_name>
#kubeconfig=<kubeconfig_file_absolute_path>/<kubeconfig_file_name>
kubeconfig=

[VDU_NAMESPACE]
#Namespace of vDU. Default is cranxx, which is a dummy namespace and it must be updated before do any other operations.
namespace=cran37170

[VDU_BUILD_INFO]
#Build ID of vDU, system release build.
#1) vDU system release build for trunk.e.g.
#build_version=0.300.12238
#2) vDU system release build for 24R1.e.g.
#build_version=21.300.1
#3) vDU system release build for 24R2.e.g.
#build_version=22.300.1
#4) vDU system release build for 24R3.e.g.
#build_version=23.300.1
#5) vDU system release build for 25R1.e.g.
#build_version=24.300.1
#6) vDU system release build for 25R2.e.g.
#build_version=25.300.1
#7) vDU system release build for 25R3.e.g.
#build_version=26.300.1
#8) vDU system release build for 26R1.e.g.
#build_version=27.300.1
# Build versions with the format x.y.z will be obsoleted in 26R2.
# New build versions will follow package name, ie.: vDUCNF00_x.y.z-amd64, vDUCNF00_x.y.z-arm64, vDUCNF25R3_x.y.z-amd64, vDUCNF25R3_x.y.z-arm64, etc
build_version=0.300.32799

[VDU_EXTERNAL_IMAGE_REGISTRY_INFO]
#The external image registry configuration to enable vDU image onboarding to external image registry.
#The registry_url is used to set the external image registry. The OCP local image registry is used by default if no external image registry is specified.
#The format of image registry for AWS is <aws_account_id>.dkr.ecr.<region>.amazonaws.com, with changeable AWS account ID and region parameters.
registry_url=harbor-vrf34.ocp.hz.nsn-rdnet.net:443/vrf34
#The registry_credentials is used to set the credentials for external image registry, the supported format of credentials is <username>:<password>.
#registry_credentials is mandatory if registry_url is set, except on AWS.
registry_credentials=admin:Harbor12345
#The tls_verify is used to specify whether HTTPS and certificate verification are required when contacting registry.
#It is applicable only when registry_url is set. Default is true.
tls_verify=true

[VDU_SCF_INFO]
#vDU SCF file which should be pre-stored in Kuafu scf/vdu directory.
scf_file_name=xxx_scf_file.xml

[VDU_CONFIG_INFO]
#Helm chart release name of vDU. Default is vdutest.
chart_name=vdu37170
#Defines if the vDU image pull policy to use, uses Always by default.
#e.g. pull_policy=IfNotPresent
pull_policy=Always
#The layout of the vDU, mini, CRAN or DRAN is supported, default is DRAN.
cnf_layout=DRAN
#time zone in format "Region/City", e.g. "Asia/Shanghai". Default is empty and the default value predefined in vDU helm chart is used.
timezone=
#up_instance_count is used to configure number of AHM/L2RT pod and RANNIC card number, Default is 1.
up_instance_count=1
#half_up_instance_count is used to configure number of AHM/L2RT-half pods and RANNIC card number, Default is 0.
half_up_instance_count=0
#l2rt_active_sibling_core is used to define whether sibling cores are allocated for l2rt pod, true or false is supported. Default is true.
l2rt_active_sibling_core=true
#l2rt_deployment_type is used to indicate different CPU number requirements. Default is empty and the default value predefined in vDU helm chart is used.
l2rt_deployment_type=NR_L2RT_20vCPU
#l2nrt_count is used to configure l2nrt pod number, Default is 1.
l2nrt_count=1
#l2nrt_active_sibling_core is used to define whether sibling cores are allocated for l2nrt pod, true or false is supported. Default is true.
l2nrt_active_sibling_core=true
#l2nrt_deployment_type is used to indicate different CPU number requirements. Default is empty and the default value predefined in vDU helm chart is used.
l2nrt_deployment_type=NR_L2NRT_10vCPU
#Description of a site used as auto connection site ID
#Use default value defined in values-override.yaml of vDU helm chart if it is empty
site_description=
# Enable stack trace collection or not.
# Set enable_stack_trace=true to enable the collection of stack trace for crash debugging. Default is false.
enable_stack_trace=false
# Configure node_selector to schedule all vDU pods except L2RT/AHM pods on specified node(s) with selector label(s). Default is empty.
# Multiple labels should be separated by semicolons
# e.g. node_selector=kubernetes.io/arch=amd64;kubernetes.io/os=linux
node_selector=
# Configure up_instance_node_selector to schedule L2RT and AHM pods on specified node(s) with selector label(s). Default is empty.
# This parameter is valid for C-RAN vDU testing that to schedule L2RT/AHM pods on specified node(s). Only one label supported.
# e.g. up_instance_node_selector=config.nokia.com/accelerator=rannic
up_instance_node_selector=
# Configure l2nrt_node_selector to schedule L2NRT pod on specified node(s) with selector label(s). Default is empty.
# Multiple labels should be separated by semicolons
l2nrt_node_selector=
# Configure fhm network connectivity mode, 'direct-connect', 'switch-network' and 'legacy' are supported.
# If fhmsiso is empty, kuafu will not generate the fhmsiso configuration, user need to specify which mode to use.
# If fhmsiso is empty and the rannic_sn is empty, the rannic serial number defined in the helm chart will be used.
# If fhmsiso is 'switch-network' and the rannic_sn is empty, the rannic serial number defined in the helm chart will be removed.
# if rannic_sn is not empty, then the rannic serial number will set to helm chart always.
# 'legacy' is used for RINLINE1.
# 'direct-connect' is used for RINLINE2 that connects with RU directly.
# 'switch-network' is used for RINLINE2 that connects with RU via switch.
fhmsiso=switch-network
# rannic_enabled_lane_count is used to indicate the number of lanes enabled on the RANNIC, which is only valid when fhmsiso=direct-connect. Default is 1. Maximum 7 lanes per QSFP port are supported.
rannic_enabled_lane_count=1
# rannic_used_qsfp_port is used to indicate which QSFP port of RAN NIC is used. Multiple QSFP ports with comma as delimiter. Default is port 1.
# rannic_used_qsfp_port=1 means QSFP port 1 will be used.
# rannic_used_qsfp_port=2 means QSFP port 2 will be used.
# rannic_used_qsfp_port=1,2 means both QSFP port 1 and 2 will be used.
rannic_used_qsfp_port=1
#rannic_sn means the serial number of RANNIC cards which will be used. Maximum number supported is 3, multiple SNs should be separated by comma.
#If RANNIC SN configured, up_instance_node_selector should be empty
#rannic_sn=L1240400763,L1240400786,L1240400790
#rannic_sn=L1240400763
rannic_sn=

[VDU_VLAN_ID_INFO]
#Guest VLAN ID of vDU interfaces. Maximum 12 RAN NICs are supported by C-RAN vDU based on CB009567 feature
#Note: Only one VLAN ID configuration is supported for one fhuc interface now. VLAN ID for multiple fhuc interfaces with comma as delimiter.
#fhuc_vlan_id=301                        //VLAN ID for fhuc interface of AHM pod 0
#fhuc_vlan_id=301,302,303,304,305,306    //VLAN IDs for fhuc interfaces of AHM pods 0-5
fhuc_vlan_id=837 839 840
fhm_vlan_id=838
l2bip_vlan_id=833
f1_vlan_id=835
f1c_vlan_id=835
oam_vlan_id=836
tracing_vlan_id=834

[VDU_OAM_IP_INFO]
#IP addresses (IPv4 or IPv6) for oam interface of vDU OAM Pod.
oam_ip_version=IPv4
oam_ip_start=10.64.169.154
oam_ip_end=10.64.169.154
oam_ip_subnet=10.64.169.152/29
oam_ip_gateway=10.64.169.153
#The twamp vlan interface will be added for oam interface if oam_twamp_enable configured as true. Default is false.
oam_twamp_enable=false
oam_twamp_ip=10.64.169.154

[VDU_TRACING_IP_INFO]
#IP addresses (IPv4 or IPv6) for tracing interface.
tracing_ip_version=IPv4
tracing_ip_start=10.64.169.122
tracing_ip_end=10.64.169.122
tracing_ip_subnet=10.64.169.120/29
tracing_ip_gateway=10.64.169.121

[VDU_F1C_IP_INFO]
#IP addresses (IPv4 or IPv6 ) for f1c interface of vDU CPRT Pod.
f1c_ip_version=IPv4
f1c_ip_start=10.64.169.146
f1c_ip_end=10.64.169.146
f1c_ip_subnet=10.64.169.144/29
f1c_ip_gateway=10.64.169.145
#The twamp vlan interface will be added for f1c interface if f1c_twamp_enable configured as true. Default is false.
f1c_twamp_enable=false
f1c_twamp_ip=10.64.169.146

[VDU_F1_IP_INFO]
#IP addresses (IPv4 or IPv6 ) for f1 interface of vDU UP Pod.
f1_ip_version=IPv4
f1_ip_start=10.64.169.147
f1_ip_end=10.64.169.147
f1_ip_subnet=10.64.169.144/29
f1_ip_gateway=10.64.169.145
#The twamp vlan interface will be added for f1 interface if f1_twamp_enable configured as true. Default is false.
f1_twamp_enable=false
f1_twamp_ip=10.64.169.147

[VDU_FHM_IP_INFO]
#IP addresses (IPv4 or IPv6 ) for fhm interface of vDU oamfh Pod.
fhm_ip_version=IPv4
fhm_ip_start=192.168.254.33
fhm_ip_end=192.168.254.33
fhm_ip_subnet=192.168.254.0/26

[VDU_DHCP_IP_INFO]
#IP address pool of DHCP for RU.
#Note: dhcp_ip_subnet must be same as fhm_ip_subnet, and IP range shouldn't be overlapped between FHM and DHCP IP configurations.
#Note: In legacy VDU packages (< 0.300.30192), only one pool is supported. To configure multiple pools, separate each value with space.
#  E.g.:
#    dhcp_ip_start=192.168.254.34 192.168.254.41 192.168.254.48 192.168.254.55
#    dhcp_ip_end=192.168.254.40 192.168.254.47 192.168.254.54 192.168.254.60
#    dhcp_ip_subnet=192.168.254.0/26
#    dhcp_ip_ru_protocol=Nokia Nokia Oran Oran
#  There should only exist one subnet
dhcp_ip_start=192.168.254.34
dhcp_ip_end=192.168.254.40
dhcp_ip_subnet=192.168.254.0/26
#Note: dhcp_ip_ru_protocol only supported from version 0.300.30192 for vDU packages. "Nokia" and "Oran" are the supported values.
dhcp_ip_ru_protocol=Nokia

[VDU_RAN_SHARING_IP_INFO]
# This section is used to configure IP info of the f1 uplane interface for RAN sharing. The number of additional operators supported depends on the CNF package.
# Some CNF packages support a maximum of 5 additional operators, while others support up to 9 additional operators.
# The variable name convention is "op<index>_<interface>_<vlan_id|ip_version|ip_start|ip_end|ip_subnet>"
# The <index> represents the additional operator number, [1, 5] or [1, 9] is officially supported depending on the CNF package.
# Following is one example of f1 uplane IPv4 configuration for two additional operators.
#op1_f1_vlan_id=219
#op1_f1_ip_version=ipv4
#op1_f1_ip_start=10.20.146.106
#op1_f1_ip_end=10.20.146.106
#op1_f1_ip_subnet=10.20.146.104/29
#op2_f1_vlan_id=218
#op2_f1_ip_version=ipv4
#op2_f1_ip_start=10.20.146.82
#op2_f1_ip_end=10.20.146.82
#op2_f1_ip_subnet=10.20.146.80/29

[FHGW_INFO]
#IPv4 addresses of FHGW, only needed for AHBCC and AHCA type RU.
fhgw_ip=10.71.160.181
#The fhgw_username and fhgw_password are used to indicate the username and password for logging FHGW by SSH.
#The default username and password are root.
fhgw_user=root
fhgw_password=root

[RU_INFO]
#RU type, only AHBCC, AHCA, AEHC, AEQ[Y|P|E|*] and AZQ[I|J|*] RU supported.
#multi types of RU are supported with space as delimiter.
#ru_type=AEQY AEQP AZQJ
ru_type=AEQY
#IPv4 addresses (IPv4) of RUs, only needed for AHBCC and AHCA type RU.
#multi addresses of RUs are supported with space as delimiter.
#E.g. ru_ip=169.254.1.2 169.254.2.2 The first RU address mapped to ruproxy-1-0
#and second RU address mapped to ruproxy-2-0 and so on.
ru_ip=169.254.1.2


# Following sections are used to define host binding and guest VLAN based vDU
# network parameters before vDU networks creation.

[OCP]
#Guest VLAN based bip/oam/f1/fhm/fhuc tenant level networks, which are namespace isolated.
#The SR-IOV resource name should be provided and double checked before vDU network creation according to infra environment.
# There are two fastpath device pool configurations for f1 and bip networks, one is common fastpath device pool and another is separated fastpath device pools.
# Common fastpath device pool, which is used for both f1 and bip networks and only applicable for 24R1, 24R2 and trunk vDU builds that support common fastpath device pool.
fastPathCommonPool=openshift.io/sriov_vfio_0
# Separated fastpath device pools for f1 and bip networks, which are introduced by CB011051-D for 24R3 release to split internal BIP traffic and F1-U traffic to support maximum C&P.
# The internal BIP traffic is mapped to the 1st lane of SFP port to shared with infrastructure traffic, but the F1-U traffic is still mapped to 2nd lane of SFP port.
# The default device pools are still same for bip and f1 networks. Please update them according to your testing environment configurations and testing scenarios.
fastPathBipPool=openshift.io/sriov_vfio_1
fastPathF1uPool=openshift.io/sriov_vfio_0
# The SR-IOV Device Pool used by oam/tracing/f1c/fhm/twamp networks (slow path)
slowPathCommonPool=openshift.io/sriov_netdevice_0

[WRCP]
#Guest VLAN based bip/oam/f1/fhm/fhuc tenant level networks, which are namespace isolated.
#The SR-IOV resource name should be provided and double checked before vDU network creation according to infra environment.
# There are two fastpath device pool configurations for f1 and bip networks, one is common fastpath device pool and another is separated fastpath device pools.
# Common fastpath device pool, which is used for both f1 and bip networks and only applicable for 24R1, 24R2 and trunk vDU builds that support common fastpath device pool.
#fastPathCommonPool=intel.com/pci_sriov_net_vfio_pci
# Separated fastpath device pools for f1 and bip networks, which are introduced by CB011051-D for 24R3 release to split internal BIP traffic and F1-U traffic to support maximum C&P.
# The internal BIP traffic is mapped to the 1st lane of SFP port to shared with infrastructure traffic, but the F1-U traffic is still mapped to 2nd lane of SFP port.
# The default device pools are still same for bip and f1 networks. Please update them according to your testing environment configurations and testing scenarios.
#fastPathBipPool=intel.com/pci_sriov_net_vfio_pci
#fastPathF1uPool=intel.com/pci_sriov_net_vfio_pci
# The SR-IOV Device Pool used by oam/tracing/f1c/fhm/twamp networks (slow path)
#slowPathCommonPool=intel.com/pci_sriov_net_netdevice

[AWS]
#PCI bus ID, update PCI bus Id according to the the configuration on node. DPDK to be assigned to f1 interface.
oam=0000:28:00.0
f1c=0000:29:00.0
fhm=0000:27:00.0
f1=0000:26:00.0
