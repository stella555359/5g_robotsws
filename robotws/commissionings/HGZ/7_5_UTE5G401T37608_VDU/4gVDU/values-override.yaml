# - Override values for deployment in cloud-development environment
# - Operator need to set the values base on the real scenario.
# - This is a YAML-formatted file.
# - Declare variables to be passed into your templates.

global:
  #########################################################
  # global configuration shared by parent and sub charts
  #########################################################

  # - Description: Denote CNF layout in deployment
  # - Support Value:
  #     "basic" - Basic layout, 4gvdu deploy on SNO
  # - Default Value: "basic"
  cnfLayout: "basic"
  # - Description: securityContext configuration for vDU runAsUser/runAsGroup/fsGroup.
  securityContext:
    runAsUser: 9999
    runAsGroup: 9999
    fsGroup: 9999
    # - Description: Assigning pods to specific nodes
    # - Support Value: key-value pair.
    # - Note: the value is key-value pairs come from the node label
    #   # - example:
    #   1) nodeSelector: {}
    #   2) nodeSelector: { "labelA": "A" } or
    #      nodeSelector: { labelA: A }
    #   3) nodeSelector: { "labelA": "A", "labelB": "B" }
    #   4) nodeSelector: { "labelWithEmptyValue": "" } or
    #      nodeSelector: { labelWithEmptyValue:  } or
    #      nodeSelector: { labelWithEmptyValue }
    # If sub chart is configured with nodeSelector(e.g. certman-auto-cmp.nodeSelector) and the value of sub chart with
    #   nodeSelector is not empty, sub chart shall prevail.
    # - In an SNO+1 cluster with vDU+4gVDU+vCU:
  #   - vCU and 4gVDU are deployed on the worker node.
  #   - 5gVDU is deployed on the master node.
  #   # - Example:
  #   1) nodeSelector: { "kubernetes.io/hostname": "worker" } for vCU and 4gVDU
  #   2) nodeSelector: { "kubernetes.io/hostname": "master" } for 5gVDU

  nodeSelector: {}
  # - Description: upInstanceNodeSelector to control the LTEUSERSERVICE and AHM pod prefer to deployment and RAN-NIC SW controller perfer to RAN-NIC selection
  # - Note: the value is key-value come from the nodes' label.
  # - example:
  #   1) upInstanceNodeSelector: {}
  #   2) upInstanceNodeSelector: { "config.nokia.com/accelerator": "rannic" } or
  #      upInstanceNodeSelector: { config.nokia.com/accelerator: rannic }
  #   3) upInstanceNodeSelector: { "config.nokia.com/application": "vDU", "config.nokia.com/accelerator": "rannic" }
  #   4) upInstanceNodeSelector: { "config.nokia.com/application": "" } or
  #      upInstanceNodeSelector: { config.nokia.com/application:  } or
  #      upInstanceNodeSelector: { config.nokia.com/application }
  upInstanceNodeSelector: {}
  # - Description: Policy for NodeSelector, preferred or required
  # - Support value: type string "preferred" or "required"
  # - Default value: "preferred"
  upInstanceNodeSelectorPolicy: "preferred"
  # Description: Control the number of AHM/LTEUSERSERVICE pod and RANNIC Card number in CR.
  # Support value: 1
  # Default value is 1.
  # Feature: CB012447
  upInstanceCount: 1
  # - Description: device Pool List
  # - Note: need to be filled according to the real environment!!!
  #         all the device pool values should same as the values in the aic-4gvdu-prerequisite/values-override.yaml
  devicePoolList:
    # The SR-IOV Device Pool used by bip networks (fast path)
    fastPathBipPool: "openshift.io/sriov_vfio_1"
    # The SR-IOV Device Pool used by s1u networks (fast path)
    fastPathS1uPool: "openshift.io/sriov_vfio_1"
    # The SR-IOV Device Pool used by oam/fhm/s1c networks (slow path)
    slowPathCommonPool: "openshift.io/sriov_netdevice_1"
  # - Description: external network configuration for each network interface
  # List of parameters for each network interface
  # ----------------------------------------------------------------------------------------------------------
  # key                   | description
  # ----------------------------------------------------------------------------------------------------------
  # vlanInfo              | vlanInfo.vid for guest vlan interface VLAN ID
  #                       |   set when guest vlan applied for interface
  #                       |   if not set, host vlan applied
  # ----------------------------------------------------------------------------------------------------------
  # ipInfo                | IP address pool start/end/subnet/role
  #                       |   set when ip info applied for interface
  #                       |     - rangeStart & rangEnd & subnet are mandatory if iface configured ipInfo
  #                       |     - subnet set format as CIDR (e.g. ""10.0.0.0"/24" or "2001:db8::0/128")
  #                       |     - the ip role is not recommand to change
  #                       | NOTE: all ip addresses support family IPv4/IPv6, (e.g. "10.0.0.0" or "2001:db8::0")
  # ----------------------------------------------------------------------------------------------------------
  # policyRouteInfo       | policy route info for oam
  # ----------------------------------------------------------------------------------------------------------
  externalNetwork:
    oam:
      vlanInfo:
        vlName: "mcplane"
        defaultUnderlyingIface: "oam"
        vid: "919"
        mtu: 1500
      ipInfo:
        - rangeStart: "10.57.202.218"
          rangeEnd: "10.57.202.218"
          subnet: "10.57.202.216/29"
          type: "physical"
          role:
            - "oam"
            - "certman-server"
            - "tracecontroller"
      policyRouteInfo:
        - gateway: "10.57.202.217"
          # - Description: the orderNumber of oam route
          # Note: should different from orderNumber in the SCF file to avoid conflict
          orderNumber: "5"
          # - Description: the table id of oam route
          # recommend not to modify
          table: "2"
    s1c:
      vlanInfo:
        vlName: "s1cplane"
        defaultUnderlyingIface: "s1c"
        vid: "916"
        mtu: 1500
      ipInfo:
        - rangeStart: "10.57.170.250"
          rangeEnd: "10.57.170.250"
          subnet: "10.57.170.248/29"
          type: "physical"
          role:
            - "S1-C"
    fhm:
      vlanInfo:
        vlName: "fhmplane"
        defaultUnderlyingIface: "fhm"
        vid: "295"
        pcp: ""
        mtu: 1500
      ipInfo:
        - rangeStart: "192.168.254.33"
          rangeEnd: "192.168.254.33"
          subnet: "192.168.254.0/26"
          type: "physical"
          role:
            - "fhm"
    s1u:
      vlanInfo:
        vlName: "s1uplane"
        defaultUnderlyingIface: "s1u"
        vid: "916"
        mtu: 1500
      ipInfo:
        - rangeStart: "10.57.170.251"
          rangeEnd: "10.57.170.251"
          subnet: "10.57.170.248/29"
          type: "physical"
          role:
            - "S1-U"
    l2bip:
      vlanInfo:
        vid: "922"
        mtu: 9000
    macpsbip:
      vlanInfo:
        vid: "922"
        mtu: 9000
    l1up:
      vlanInfo:
        mtu: 9000
    ######################### Start of configuration for fhuc/fhm vlan interfaces on RANNIC when fhmSiso set as "direct-connect" #####################################
    ### since CB012410 ##
    # - Description: Configuration for fhuc/fhm vlan interfaces for each RANNIC, max support 1 RANNIC
    # -              key sn means the serial number of RANNIC used by the network
    # -              key fhuc means configuration for fhuc vlan interface
    # -              key fhm means configuraion for fhm vlan interface
    # -              the followed list section called as vlan interface section include vlName/defaultUnderlyingIface/vid/pcp, pcp only needed in fhuc vlan interface section
    #                - vlName: ""
    #                  defaultUnderlyingIface: ""
    #                  vid: ""
    #                  pcp: ""
    # - How to configure:
    # -   1. if you only need one vlan interface for fhuc or fhm, you can just modify the "defaultUnderlyingIface" and "vid", "vlName" can just use the default
    # -   2. if you need more than one vlan interface for one RANNIC, you can add one vlan interface as followed example
    #        Example:
    #          1. copy the vlan interface section under ahm-a.fhuc and align it according to yaml format
    #          2. fill the vlName and defaultUnderlyingIface and vid, the three parameters are mandatory
    #          3. after added the new vlan interfaces, the content of ahm-a.fhuc would be like followed
    #          ahm-a:
    #            sn: "asdfghjkl"
    #            fhuc:
    #            - vlName: "fhucplane01"
    #              defaultUnderlyingIface: "ecpri4"
    #              vid: "301"
    #              pcp: "7"
    #            - vlName: "fhucplane02"
    #              defaultUnderlyingIface: "ecpri5"
    #              vid: "301"
    #              pcp: "7"
    #          4. after added fhm vlan interface under ahm-a.fhm, the content of ahm-a.fhm should be like followed
    #          ahm-a:
    #              sn: "asdfghjkl"
    #            fhm:
    #            - vlName: "fhmplane01"
    #              defaultUnderlyingIface: "ecpri4"
    #              vid: "301"
    #            - vlName: "fhmplane02"
    #              defaultUnderlyingIface: "ecpri5"
    #              vid: "301"
    #         vlName format is: fhucplane<ahm_index><Mark>, Mark support [0~9][A-Z][a-z], follow Linux interface naming rule of max length 15.
    #         for Single vlan, please keep the pcp value as default "7" for fhuc, and pcp value which is not open to user is "2" for fhm.
    #         To distinguish fhuc and fhm, the vlName MUST use prefix "fhuc" for fhuc and prefix "fhm" for fhm.
    ahm-a:
      sn: "L1240808940"
      fhuc:
        - vlName: fhucplane01
          defaultUnderlyingIface: ecpri4
          vid: "918"
          pcp: "7"
        - vlName: fhucplane09
          defaultUnderlyingIface: ecpri0
          vid: "918"
          pcp: "7"
        - vlName: fhucplane02
          defaultUnderlyingIface: ecpri5
          vid: "918"
          pcp: "7"
        - vlName: fhucplane0a
          defaultUnderlyingIface: ecpri1
          vid: "918"
          pcp: "7"
        - vlName: fhucplane03
          defaultUnderlyingIface: ecpri6
          vid: "918"
          pcp: "7"
        - vlName: fhucplane0b
          defaultUnderlyingIface: ecpri2
          vid: "918"
          pcp: "7"
        - vlName: fhucplane04
          defaultUnderlyingIface: ecpri7
          vid: "918"
          pcp: "7"
        - vlName: fhucplane0c
          defaultUnderlyingIface: ecpri3
          vid: "918"
          pcp: "7"
      fhm:
        - vlName: fhmplane01
          defaultUnderlyingIface: ecpri4
          vid: "914"
          pcp: "7"
        - vlName: fhmplane09
          defaultUnderlyingIface: ecpri0
          vid: "914"
          pcp: "7"
        - vlName: fhmplane02
          defaultUnderlyingIface: ecpri5
          vid: "914"
          pcp: "7"
        - vlName: fhmplane0a
          defaultUnderlyingIface: ecpri1
          vid: "914"
          pcp: "7"
        - vlName: fhmplane03
          defaultUnderlyingIface: ecpri6
          vid: "914"
          pcp: "7"
        - vlName: fhmplane0b
          defaultUnderlyingIface: ecpri2
          vid: "914"
          pcp: "7"
        - vlName: fhmplane04
          defaultUnderlyingIface: ecpri7
          vid: "914"
          pcp: "7"
        - vlName: fhmplane0c
          defaultUnderlyingIface: ecpri3
          vid: "914"
          pcp: "7"
      fhs:
        - defaultUnderlyingIface: "ecpri4"
          vlanInfo:
            - vlName: "fhsplane01"
              vid: ""
          ipInfo:
            - rangeStart: ""
              rangeEnd: ""
              subnet: ""
              role:
                - fhsm
                - fhss
                ########################### End of configuration for fhuc/fhm vlan interfaces on RANNIC #####################################
  # - Description: network attribute definition for each network.
  #   This section is provide to set the MTU for each network
  networkInfo:
    fhm:
      mtu: 9000
    oam:
      mtu: 9000
    s1c:
      mtu: 9000
    s1u:
      mtu: 9000
    bip:
      mtu: 9000
    twamp:
      mtu: 9000
    l1up:
      mtu: 9000
  # - Description: the fh-m plane internal network ip address pool, which only used when fhmSiso set as "direct-connect" for RU connect to Rannic directly,
  # -              this ip address poll will be configured from OAMFH Pod and RANNIC.
  # -              for 4gvdu, the fhmSiso only support "direct-connect".
  #   NOTE: Please according to your real network plan and requirement to configure it
  # -       ip number should in this address pool >= number of FHM RANNIC + 3
  #             Example: 3 RANNICs, require >=6 IP addresses
  # -       Must not conflict with the subnets of eth0 on OCP
  # -       Must not conflict with the aic-oamfh.dhcp.service.dhcpv4.subnetsForDC and global.fhmIpForDC.ipAddress
  # - For example: "192.168.251.0/27"
  fhmInternalNetworkIpPool: "192.168.251.0/27"
  # - Description: the ip address of the fhm master agent which only used when fhmSiso set as "direct-connect"
  # -              for 4gvdu, the fhmSiso only support "direct-connect".
  # - Note: please according to your real network plan and requirement to configure it
  # -       the CIDR format and the netmask of ip address must be 32, for example: "70.70.70.1/32"
  # -       the ip address must not conflict with the subnet of eth0 on OCP
  # -       the ip address must not conflict with global.fhmInternalNetworkIpPool and aic-oamfh.dhcp.service.dhcpv4.subnetsForDC
  # - For example: "70.70.70.1/32"
  fhmIpForDC:
    ipAddress: "70.70.70.1/32"
    role:
      - "fhm"
  # - Description: the storageclass name of persistent volume. it's mandatory
  # - Values:
  #     OCP multi node: ocs-storagecluster-cephfs
  #     OCP single node: lvms-vg1
  #     Other 3rd-party kubernetes platform, set the storageClassName according to the real scenario.
  # - Note:
  #     The storageClassName in values-override.cloudran-4gvdu-prerequisite.yaml should be same value as this one.
  storageClassName: "lvms-vg1"
  # - Description: convention of name
  name_convention:
    pod_prefix:
      - "po"
      - "_NAMESPACE_"
    container_prefix:
      - "ctr"
      - "_NAMESPACE_"
    deployment_prefix:
      - "po"
      - "_NAMESPACE_"
    statefulset_prefix:
      - "po"
      - "_NAMESPACE_"
  image:
    # - Description: registry of image
    # - Example:
    #    "bcmt-registry:5000/dep" for NCS;
    #    "registry.kube-system.svc.nokia.net:5555/dep" for NCIR;
    #    "image-registry.openshift-image-registry.svc:5000/{{ .Release.Namespace }}" for OCP.
    registry: "harbor-vrf34.ocp.hz.nsn-rdnet.net:443/vrf34"
  # - Description: time zone in format "Region/City", e.g. "Asia/Shanghai". Default as 'GMT'.
  timezone: "GMT"
  #########################################################
  # global configuration for VDU parent chart
  #########################################################

  # Custom extensions for labels which will be injected into ConfigMap,
  # Service, Pod resources.
  # Example:
  #  labels: {nf-type: 4g-nf-producer}
  custom_extensions:
    labels: {}
  # - Description: Description of a site used as auto connection site ID.
  # - Note: As it will be used for identifying the vDU, ensure uniqueness for every vDU
  # -       equal to the value of MRBTS/AutoConnSiteID parameter from the CM plan imported to the NMS
  # -       1 to 50 ASCII characters
  siteDescription: "MRBTS-1234"
  # - Description: NMS URL for NE3S registration
  # - Required for AutoIdentification (PnP)
  # - Leave empty to prevent triggering AutoIdentification after CNF deployment
  # - If needed, it's possible to configure more than one NMS URL. For example, if required for geo-redundancy support.
  # - Example:
  #    - "https://cluster123lbwas.nms.nokia.net/NE3S/1.0"
  #    - ""
  urlNms:
    - ""
    - ""
  # - Description: external IP to access ne3sadapt, used by NMS to connect back (register)  with ne3sadapt
  # - Note: current agentIP should be the same as vDU oam IP by default, due to ne3sadapt run in oam container
  agentIP: ""
  # - Description: true means SeLinux enforcing + WA, not support audit log; false means seLinux permissive + no WA, support audit log.
  seLinux: "true"
  # - Description: The collection of stack trace needs to be enabled as alternative for debugging program crashes only when core dump files are not achievable.
  # - Supported values: type string "true" or "false"
  # - Default value: "false"
  stackTraceEnabled: "false"
  # - Description: the name of RuntimeClass which is used for high performance
  # - Default value: "nokia-performance"
  highPerformanceRuntimeClass: "nokia-performance"
  accessModes: ReadWriteOnce
#########################################################
# top level configuration private to RCP sub charts
#########################################################

# - Description: sub chart certman-auto-cmp private configuration
certman-auto-cmp:
  configuration:
    # - Description: The CMP configuration
    cmp:
      # - Description: The secret name which defines the CMP server's pre-shared key, reference number
      cmp_secret_name: ""
      # - Description: CMP server IP. Note: Mandatory for PnP
      ip:
      # - Description: CMP server port. Note: Mandatory for PnP
      port:
      # - Description: CMP server URL path. Note: Mandatory for PnP
      path:
      # - Description: CA subject name to be used in CMP initialization. Note: Mandatory for PnP
      ca_subject_name:
      # - Description: EE certificate profile's certificate subject name. Note: Mandatory for PnP
      ee_subject_name:
      # - Description: EE certificate profile's FQDN value to be set as subject alternative name
      ee_subject_fqdn: []
      # - Description: EE certificate profile's IP address to be set as subject alternative name
      ee_subject_ip_addr: []
    # - Description: additional TA (trust anchor) certificates secret name, if you created additional TA (trust anchor) certificates,
    #                you need to add the secrets name of the certificates here
    additionalTACertSecretName: []
