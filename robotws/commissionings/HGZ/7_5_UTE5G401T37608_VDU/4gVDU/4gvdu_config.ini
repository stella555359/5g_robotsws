
# This configuration file is used to define 4G-vDU parameters before 4G-vDU deploying.

[CONFIG_FILE]
#Version of this config file.
version=0.6.0

[REMOTE_MODE_INFO]
#The remote_mode is used to enable Kuafu execution from remote server/jumper server that out of target cluster, default is false.
remote_mode=false
#The kubeconfig file for target cluster, absolute path of this file is required.
#It can be left empty if KUBECONFIG variable exported by user. E.g. export KUBECONFIG=<kubeconfig_file_absolute_path>/<kubeconfig_file_name>
#kubeconfig=<kubeconfig_file_absolute_path>/<kubeconfig_file_name>
kubeconfig=

[4GVDU_NAMESPACE]
#Namespace of vDU. Default is cranxx, which is a dummy namespace and it must be updated before do any other operations.
namespace=cran37608

[4GVDU_BUILD_INFO]
#Build ID of 4G-vDU, system release build.
#1) 4G-vDU system release build for trunk.e.g.
#build_version=0.300.1
#5) 4G-vDU system release build for 25R1.e.g.
#build_version=24.300.1
#6) 4G-vDU system release build for 25R2.e.g.
#build_version=25.300.1
#6) 4G-vDU system release build for 25R3.e.g.
build_version=0.300.32656
#build_version=0.300.31735

[4GVDU_EXTERNAL_IMAGE_REGISTRY_INFO]
#The external image registry configuration to enable 4G-vDU image onboarding to external image registry.
#The registry_url is used to set the external image registry. The OCP local image registry is used by default if no external image registry is specified.
#The format of image registry for AWS is <aws_account_id>.dkr.ecr.<region>.amazonaws.com, with changeable AWS account ID and region parameters.
registry_url=harbor-vrf34.ocp.hz.nsn-rdnet.net:443/vrf34
#The registry_credentials is used to set the credentials for external image registry, which is mandatory if registry_url is set. The supported format of credentials is <username>:<password>
registry_credentials=admin:Harbor12345
#The tls_verify is used to specify whether HTTPS and certificate verification are required when contacting registry.
#It is applicable only when registry_url is set. Default is true.
tls_verify=true

[4GVDU_CONFIG_INFO]
#Helm chart release name of vDU. Default is 4gvdutest.
chart_name=4gvdu37608
#Defines if the 4G-VDU image pull policy to use, uses Always by default.
#e.g. pull_policy=IfNotPresent
pull_policy=Always
#The layout of the 4G-vDU, support value is basic.
cnf_layout=basic
#time zone in format "Region/City", e.g. "Asia/Shanghai". Default is empty and the default value predefined in vDU helm chart is used.
timezone=
#Description of a site used as auto connection site ID
#Use default value defined in values-override.yaml of vDU helm chart if it is empty
site_description=
# Enable stack trace collection or not.
# Set enable_stack_trace=true to enable the collection of stack trace for crash debugging. Default is false.
enable_stack_trace=false
# Configure node_selector to schedule all vDU pods except AHM/LTEUSERSERVICE pods on specified node(s) with selector label(s). Default is empty.
# Multiple labels should be separated by semicolons
# e.g. node_selector=kubernetes.io/arch=amd64;kubernetes.io/os=linux
node_selector=
# Configure up_instance_node_selector to schedule AHM/LTEUSERSERVICE pods on specified node(s) with selector label(s). Default is empty.
# Only one label supported.
# e.g. up_instance_node_selector=config.nokia.com/accelerator=rannic
up_instance_node_selector=
# Control the number of AHM/LTEUSERSERVICE pod and RANNIC Card number in CR.
# Support value: 1 ~ 12 (Both support 1 and 12). Default is 1.
up_instance_count=1
# For cloudran-4gvdu-lteuserservice, deploymentType for different cores mapping
# Default is empty and the pre-defined value in 4G-vDU helm chart will be used.
lteuserservice_deployment_type=LTE_US_16vCPU
# rannic_enabled_lane_count is used to indicate the number of lanes enabled on the RANNIC. Default is 1. Maximum 7 lanes per QSFP port are supported.
rannic_enabled_lane_count=4
# rannic_used_qsfp_port is used to indicate which QSFP port of RAN NIC is used. Multiple QSFP ports with comma as delimiter. Default is port 1.
# rannic_used_qsfp_port=1 means QSFP port 1 will be used.
# rannic_used_qsfp_port=2 means QSFP port 2 will be used.
# rannic_used_qsfp_port=1,2 means both QSFP port 1 and 2 will be used.
rannic_used_qsfp_port=1,2
#rannic_sn means the serial number of RANNIC cards which will be used. Maximum number supported is 1.
#If RANNIC SN configured, up_instance_node_selector should be empty
#rannic_sn=L1240400763
rannic_sn=L1240808940

[4GVDU_VLAN_ID_INFO]
#Guest VLAN ID of 4G-vDU interfaces.
oam_vlan_id=919
s1c_vlan_id=916
s1u_vlan_id=916
#bip_vlan_id is for both l2bip and macpsbip, they must use same VLAN.
bip_vlan_id=922
fhm_vlan_id=914
fhuc_vlan_id=918

[4GVDU_OAM_IP_INFO]
oam_ip_start=10.57.202.218
oam_ip_end=10.57.202.218
oam_ip_subnet=10.57.202.216/29
oam_ip_gateway=10.57.202.217

[4GVDU_S1C_IP_INFO]
s1c_ip_start=10.57.170.250
s1c_ip_end=10.57.170.250
s1c_ip_subnet=10.57.170.248/29

[4GVDU_FHM_IP_INFO]
fhm_ip_start=192.168.254.33
fhm_ip_end=192.168.254.33
fhm_ip_subnet=192.168.254.0/26

[4GVDU_S1U_IP_INFO]
s1u_ip_start=10.57.170.251
s1u_ip_end=10.57.170.251
s1u_ip_subnet=10.57.170.248/29

[4GVDU_DHCP_IP_INFO]
#IP address pool of DHCP for RU.
#Note: dhcp_ip_subnet must be same as fhm_ip_subnet, and IP range shouldn't be overlapped between FHM and DHCP IP configurations.
dhcp_ip_start=192.168.254.34
dhcp_ip_end=192.168.254.60
dhcp_ip_subnet=192.168.254.0/26

[RU_INFO]
#RU type, only AHEGG, AHEGH, AHEGHA, AHFIHA, AHFII, AHLOA, AHLOB, ARGA, ARPA, AWMFIA RU supported.
#multi types of RU are supported with space as delimiter.
#ru_type=AHEGG AHEGH AHEGHA
ru_type=AHLOA
ru_user=
ru_password=

# Following sections are used to define host binding and guest VLAN based 4G-vDU
# network parameters before 4G-vDU networks creation.

[OCP]
#Guest VLAN based bip/oam/fhm/s1u/s1c tenant level networks, which are namespace isolated.
#The SR-IOV resource name should be provided and double checked before 4G-vDU network creation according to infra environment.
# The SR-IOV Device Pool used by bip networks (fast path)
fastPathBipPool=openshift.io/sriov_vfio_1
# The SR-IOV Device Pool used by s1u networks (fast path)
fastPathS1uPool=openshift.io/sriov_vfio_1
# The SR-IOV Device Pool used by oam/fhm/s1c networks (slow path)
slowPathCommonPool=openshift.io/sriov_netdevice_1
