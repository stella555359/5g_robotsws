[VCU_RAN_SHARING_IP_INFO]
# This section is used to configure IP info of interface for RAN sharing. The number of additional operators supported depends on the CNF package.
# Some CNF packages support a maximum of 5 additional operators, while others support up to 9 additional operators.
# x2c,ngc,xnc,f1u,x2u,s1u,ngu,xnu interfaces support RAN sharing.
# The variable name convention is "op<index>_<interface>_<vlan_id|ip_version|ip_start|ip_end|ip_subnet>"
# The <index> represents additional operator number, [1, 5] or [1, 9] is officially supported depending on the CNF package.
# Following is one example of s1u IPv4 configuraion for two additional operators.
#op1_s1u_vlan_id=104
#op1_s1u_ip_version=ipv4
#op1_s1u_ip_start=10.70.41.34
#op1_s1u_ip_end=10.70.41.34
#op1_s1u_ip_subnet=10.70.41.32/28
#op2_s1u_vlan_id=106
#op2_s1u_ip_version=ipv4
#op2_s1u_ip_start=10.71.171.209
#op2_s1u_ip_end=10.71.171.209
#op2_s1u_ip_subnet=10.71.171.208/29

# Following sections are used to define host binding and guest VLAN based vCU
# network parameters before vCU networks creation.

[VCU_DEVICE_POOL_INFO]
#Guest VLAN based tenant level networks, which are namespace isolated.
#The SR-IOV resource name should be provided and double checked before vCU network creation according to infra environment.
#For MLX NIC, the fastpath device pool is same with slowpath device pool.
#For Intel NIC, the fastpath device pool is different from slowpath device pool.
#Following are reference example configurations, please double confirm the device pool names of your test lines and
#configure the right device pool for related vCU networks
#fastPathDevicePoolBackup and slowPathDevicePoolBackup are valid when link_redundancy=true
#The SR-IOV Device Pool used by s1u,x2u,f1u,xnu,ngu networks (fast path)
fastPathDevicePool=openshift.io/sriov_vfio_0
#The SR-IOV Device Pool used by oam,tracing,f1c,x2c,xnc,ngc,internale1 networks (slow path)
slowPathDevicePool=openshift.io/sriov_netdevice_0
#The SR-IOV Backup Device Pool used by s1u-s,x2u-s,f1u-s,xnu-s,ngu-s networks (fast path),should be different with fastPathDevicePool
fastPathDevicePoolBackup=openshift.io/sriov_vfio_0
#The SR-IOV Device Pool used by oam-s,f1c-s,x2c-s,xnc-s,ngc-s networks (slow path),should be different with slowPathDevicePool
slowPathDevicePoolBackup=openshift.io/sriov_netdevice_0

[AWS]
#PCI bus ID, update PCI bus Id according to the the configuration on node. DPDK to be assigned to f1 interface.
externalupue=0000:00:08.0
externaloam=0000:00:06.0
externalcpif=0000:00:07.0
internalcpif=0000:00:0a.0
internalcpnrt=0000:00:09.0
