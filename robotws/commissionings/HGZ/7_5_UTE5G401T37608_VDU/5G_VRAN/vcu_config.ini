#E.g. "f1c_ip_role=F1-C NG-C Xn-C" means 3 roles configured for f1c interface to support flexible network configuration.
#All 3GPP interfaces share same(single) IP address and VLAN in CPIF PODs on AWS.
#Only f1c need to be configured for control plane networks, the roles will be updated automatically according to different mode: SA, NSA or ALL(NSA+SA).
