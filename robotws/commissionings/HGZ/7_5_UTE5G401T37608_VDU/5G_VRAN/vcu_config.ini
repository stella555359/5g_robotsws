# This configuration file is used to define vCU parameters before vCU deploying.

[CONFIG_FILE]
version=6.24.0

[REMOTE_MODE_INFO]
#The remote_mode is used to enable Kuafu execution from remote server/jumper server that out of target cluster, default is false.
remote_mode=false
#The kubeconfig file for target cluster, absolute path of this file is required.
#It can be left empty if KUBECONFIG variable exported by user. E.g. export KUBECONFIG=<kubeconfig_file_absolute_path>/<kubeconfig_file_name>
#kubeconfig=<kubeconfig_file_absolute_path>/<kubeconfig_file_name>
kubeconfig=

[VCU_NAMESPACE]
#Namespace of vCU. Default is cranxx, which is a dummy namespace and it must be updated before do any other operations.
#e.g. namespace=cran1
namespace=cran37608

[VCU_BUILD_INFO]
#Build ID of vCU, system release build.
#1) vCU system release build for trunk.e.g.
#build_version=0.250.3485
#2) vCU system release build for 24R1.e.g.
#build_version=21.250.1
#3) vCU system release build for 24R2.e.g.
#build_version=22.250.1
#4) vCU system release build for 24R3.e.g.
#build_version=23.250.1
#5) vCU system release build for 25R1.e.g.
#build_version=24.250.1
#6) vCU system release build for 25R2.e.g.
#build_version=25.250.1
#7) vCU system release build for 25R3.e.g.
#build_version=26.250.1
build_version=0.250.32192

[VCU_EXTERNAL_IMAGE_REGISTRY_INFO]
#The external image registry configuration to enable vCU image onboarding to external image registry.
#The registry_url is used to set the external image registry. The OCP local image registry is used by default if no external image registry is specified.
#The format of image registry for AWS is <aws_account_id>.dkr.ecr.<region>.amazonaws.com, with changeable AWS account ID and region parameters.
registry_url=harbor-vrf34.ocp.hz.nsn-rdnet.net:443/vrf34
#The registry_credentials is used to set the credentials for external image registry, the supported format of credentials is <username>:<password>.
#registry_credentials is mandatory if registry_url is set, except on AWS.
registry_credentials=admin:Harbor12345
#The tls_verify is used to specify whether HTTPS and certificate verification are required when contacting registry.
#It is applicable only when registry_url is set. Default is true.
tls_verify=true

[VCU_SCF_INFO]
#vCU SCF file which should be pre-stored in Kuafu scf/vcu directory.
scf_file_name=xxx_scf_file.xml

[VCU_CONFIG_INFO]
#Helm chart release name of vCU.
#e.g. chart_name=vcutest
chart_name=vcu37608
#The layout of the vCU, mini, basic or redundant is supported.
#The redundant means vCU supports high availability. Default is basic.
cnf_layout=basic
#time zone in format "Region/City", e.g. "Asia/Shanghai". Default is empty and the default value predefined in vCU helm chart is used.
timezone=UTC
#The number of CPUE Pods.
#If cnfLayout is basic, [1, 16] is officially supported; if cnfLayout is redundant, [2, 16] is officially supported
#Note: If cnfLayout is redundant and cpuecount is 1, it will be modified to 2 automatically.
cpue_count=1
#The minimum number of N+ CPUE Pods to support the capacity requirement of the operator.
#The capacity reduction alarm will be reported when existing CPUE pods number less than required minimum capacity number.
#If cnfLayout is basic, [1, 16] is officially supported; if cnfLayout is redundant, [2, 16] is officially supported.
#Note: min_capacity_cpue should not larger than cpue_count and it will be modified to 2 automatically if it is 1 and cnfLayout is redundant.
min_capacity_cpue=1
#The number of UPUE Pods.
#If cnfLayout is basic, [1, 44] is officially supported; if cnfLayout is redundant, [2, 44] is officially supported.
#Note: If cnfLayout is redundant and upuecount is 1, it will be modified to 2 automatically.
upue_count=1
#The minimum number of N+ UPUE Pods to support the capacity requirement of the operator.
#The capacity reduction alarm will be reported when existing UPUE pods number less than required minimum capacity number.
#If cnfLayout is basic, [1, 4] is officially supported; if cnfLayout is redundant, [2, 44] is officially supported.
#Note: min_capacity_upue should not larger than upue_count and it will be modified to 2 automatically if it is 1 and cnfLayout is redundant.
min_capacity_upue=1
#The number of CPE2 Pod. 0 or 1 is supported.
#Default is 0.
cpe2_count=0
#The number of 2N pair CPCL pods. [1, 4] is supported for redundant vCU and 1 is supported for basic vCU.
#Note: only one CPCL pod created of basic vCU.
cpcl_count=1
#The number of 2N pair CPIF pods, [1, 4] is supported for redundant vCU and 1 is supported for basic vCU.
#Note: only one CPIF pod created of basic vCU.
cpif_count=1
#The deployment mode of the vCU, there are three modes supported on the top of OCP: SA, NSA and SA + NSA mixed mode.
#Set mode=NSA means to use NSA mode, mode=SA means to use SA mode, mode=ALL means to use SA + NSA mixed mode.
#The default mode for vCU is NSA.
mode=SA
#Use link redundancy or not.
#Set link_redundancy=true, will use link redundancy. By default, link_redundancy=false and will not use link redundancy.
link_redundancy=false
#Source name of vCU for data monitor, show the Unique Identification of vCU, configured by 5G DEP
#Use default value defined in values-override.yaml of vCU helm chart if it is empty
site_description=
# CPU and memory resources requirements for different testing scenarios, including CIT, ST, ET, PET, etc.
# Set pet_resource_use=true for PET testing, which requires more CPU and less memory resources. Detail resources requirements can be found in vCU CB007890 feature.
# Set pet_resource_use=false for other testing scenarios if no enough CPU resources available of test line, which requires less CPU resources.
# Default is true.
pet_resource_use=true
# Enable stack trace collection or not.
# Set enable_stack_trace=true to enable the collection of stack trace for crash debugging. Default is false.
enable_stack_trace=false
# Configure node_selector to schedule all vCU pods on one specified node with selector label(s). Default is empty
# Multiple labels should be separated by semicolons
# e.g. node_selector=beta.kubernetes.io/arch=amd64;beta.kubernetes.io/os=linux
node_selector=

[VCU_VLAN_ID_INFO]
#Guest VLAN ID of vCU interfaces.
#Both guest and host VLAN are not supported, IP address should be created directly at ethernet interface on AWS.
#No need to configure vid for all interfaces and they will not take effect even configured on AWS.
tracing_vlan_id=2683
oam_vlan_id=2681
f1c_vlan_id=2689
f1u_vlan_id=2689
internale1_vlan_id=1213
#x2u, s1u and x2c interfaces only used for NSA mode
x2c_vlan_id=2690
x2u_vlan_id=2690
s1u_vlan_id=2682
#xnc, xnu, ngu and ngc interfaces only used for SA mode
xnc_vlan_id=2692
xnu_vlan_id=2692
ngu_vlan_id=2691
ngc_vlan_id=2691
#e2 interface only used when cpe2_count=1
e2_vlan_id=2684

[VCU_OAM_IP_INFO]
