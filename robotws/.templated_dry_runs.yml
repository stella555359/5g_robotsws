variables:
    dryrun_command: robot --dryrun --exitonerror --runemptysuite --listener sanity-checks.checksyspath.SyspathGuard --console dotted -l NONE -r NONE -o NONE -V dummy_config.py

.template-runner-settings: &runner-settings
    image: mnp5g-docker-virtual.artifactory-espoo1.int.net.nokia.com/ci_base_image:$CI_BASE_IMAGE_VERSION
    tags:
        - 5G_docker_runner
    retry:
        when:
            - runner_system_failure
            - stuck_or_timeout_failure
            - job_execution_timeout
            - unknown_failure
            - api_failure
        max: 2

.template-dry-run-settings-default: &dry-run-settings-default
    <<: *runner-settings
    variables:
        GIT_DEPTH: 1
        python: python3.11
        pip: $python -m pip
        LOCKFILE: dependencies.py311-rf50.lock
    stage: dry-runs

.template-dry-run-settings-mr-default: &dry-run-settings-mr-only-default
    <<: *dry-run-settings-default
    only:
      refs:
        - merge_requests
      variables:
        - $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    before_script:
        - echo $CI_PROJECT_DIR && cd $CI_PROJECT_DIR
        - $python -m venv venv; . venv/bin/activate
        - $pip --disable-pip-version-check --version
        - $pip --disable-pip-version-check install -r $LOCKFILE --no-deps
        - $pip --disable-pip-version-check list --format columns

"Wroclaw/TRUNK_ENG":
    <<: *dry-run-settings-mr-only-default
    only:
      refs:
        - merge_requests
      variables:
        - $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
      changes:
        - "requirements.cfg"
        - "testsuite/Wroclaw/TRUNK_ENG/**/*.{robot,resource,py,cfg}"
        - "testsuite/Wroclaw/resources/**/*.{robot,resource,py,cfg}"
    script:
        - python sanity-checks/clear_scopes.py "testsuite/" "Wroclaw/TRUNK_ENG"
        - echo "Running dryrun using the following command (run from repository root):"; echo "   PYTHONPATH=. $dryrun_command estsuite/Wroclaw/TRUNK_ENG"
        - $dryrun_command testsuite/Wroclaw/TRUNK_ENG

