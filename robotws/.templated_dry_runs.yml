"Timisoara/RFS/RFS_SOAM/test_line_specific":
    <<: *dry-run-settings-mr-only-default
    only:
      refs:
        - merge_requests
      variables:
        - $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
      changes:
        - "testsuite/Timisoara/RFS/RFS_SOAM/test_line_specific/**/*.{robot,resource}"
    script:
        - |
          echo Commit SHA $CI_COMMIT_SHA
          git fetch --depth 1 origin $CI_MERGE_REQUEST_DIFF_BASE_SHA
          DryrunFiles=$(git diff-tree --name-only -r $CI_MERGE_REQUEST_DIFF_BASE_SHA $CI_COMMIT_SHA | grep '.robot$\|.resource$')
          DryrunFileList=()
          for file in $DryrunFiles; do if [[ -f "$file" && "$file" == *"test_line_specific"* ]]; then DryrunFileList+=($file); fi; done
          if [[ ${#DryrunFileList[@]} -gt 0 ]];
          then
              echo Dryrun will be executed on files
              printf '%s\n' "${DryrunFileList[@]}"
              echo "Running dryrun using the following command (run from repository root):"; echo "   PYTHONPATH=. $dryrun_command --name DryRunSuite $FLAGS ${DryrunFileList[@]}"
              $dryrun_command --name DryRunSuite $FLAGS "${DryrunFileList[@]}"
          else
              echo No suitable files for dryrun - execution will be skipped
          fi

