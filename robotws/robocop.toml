[tool.robocop]

[tool.robocop.lint]
reports = [
    "print_issues",
    "rules_by_id",
    "rules_by_error_type",
]
select = [
    "empty-library-alias", 				# former 0314
    "duplicated-library-alias",			# former 0315
    "not-allowed-char-in-filename",		# former 0320
    "duplicated-test-case",				# former 0801
    "duplicated-keyword",				# former 0802
    "duplicated-variable",				# former 0803
    "duplicated-setting",				# former 0813
    "missing-doc-suite", 				# former 0203
    "empty-section", 					# former 0509
    "duplicated-library", 				# former 0805
    "unused-argument", 					# former 0919
    "trailing-whitespace", 				# former 1001
    "possible-variable-overwriting", 	# former 0316
]

configure = [
    "print_issues.output_format=grouped",
    "duplicated-library-alias.severity=E",
    "not-allowed-char-in-filename.severity=E",					
    "not-allowed-char-in-filename.pattern=[\\.\\,]",
    "duplicated-setting.severity=E",
]
