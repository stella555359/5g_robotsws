set DAEMON_IP="10.0.1.1"
set DAEMON_PORT={edaemon_port}

set ENB1_S1_ADDR="{enb_s1_ip}"
set ENB1_X2_ADDR="{enb_x2_ip}"

set MME1_S1_ADDR="{mme_ip}"

set SGW_S1U_ADDR="{sgw_s1u_ip}"
set SGW_S11_ADDR="{sgw_s11_ip}"

set PGW_ADDR="4.7.254.207"

set GNB_X2_ADDR="{gnb_x2_ip}"



set_enb id=1 plmn={mcc_4g}:{mnc_4g} s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3
enb_param id=1 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac={tac_4g} earfcn=2000:20000 mapped_earfcn=4200:22200

set_gnb id=2 type=external plmn=311:489 s1u=$GNB_X2_ADDR  x2=$GNB_X2_ADDR:36422 x2_peers=none
{gnb_cell}
#set_cell id=2 gnb=2 eci=0x000021f pci=16:2 tac=4 nrci=0x3FFF tdd_cell=on

mme_pool_area id=1 mmegi=1 plmn={mcc_4g}:{mnc_4g} eq_plmn=311:489 tac_list=777,111,222,444,333
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1

set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:2153
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13

debug_log level=0

set_log log_to_file=true max_file_num=1

cfg_end

#set_log log_to_file=on
#sim_start version_check=off
