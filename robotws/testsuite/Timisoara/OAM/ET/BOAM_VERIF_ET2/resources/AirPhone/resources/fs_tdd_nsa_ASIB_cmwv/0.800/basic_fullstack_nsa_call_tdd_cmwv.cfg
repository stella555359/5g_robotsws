#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------

set DAEMON_IP="10.0.2.1" # IP Address where edaemon will run
set DAEMON_PORT=22222        # Daemon port used when running edaemon. ex, sudo ./edaemon --port 22222

set ENB1_S1_ADDR="10.0.1.136"
set ENB2_S1_ADDR="10.0.1.112"   #gNB UPUE Backhaul

set ENB1_X2_ADDR="10.0.1.1"
set ENB2_X2_ADDR="10.0.1.111"   #CPIF Backhaul , S1C, X2C in gNB

set MME1_S1_ADDR="10.0.1.131"

set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"

set ENB_X2U_ADDR="10.0.1.135"
set PGW_ADDR="4.7.254.207"

set AP_UECP_ADDR="10.0.2.80"
set AP_UECP_PORT="8888"

set AP_UEUP_ADDR="10.0.2.80"
set AP_UEUP_PORT="9999"

set PROXY_SERVER_IP="10.0.2.80"

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=250:255 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$DAEMON_IP:12219 earfcn=2000:20000 mapped_earfcn=4200:22200 mandatory_for_activation=off
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------

set_gnb id=2 type=external plmn=555:10 s1u=$ENB2_S1_ADDR  x2=$ENB2_X2_ADDR:36422 x2_peers=none
set_cell id=1 gnb=2 nr_arfcn=628334:628334  eci=0x000021f pci=16:2 tac=4580 proxy=$AP_UEUP_ADDR:$AP_UEUP_PORT|$AP_UECP_ADDR:$AP_UECP_PORT nrci=0x3FFF tdd_cell=on mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------

mme_pool_area id=1 mmegi=1 plmn=777:14 eq_plmn=250:255 tac_list=777,111,222,444,333,4580
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:2153
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec file=AirPhoneConfig_fullstack_tdd_nsa_cmwv.xml id=1 ip=$DAEMON_IP:$DAEMON_PORT pdn=1 devtype=tun addr=72.22.0.1/26 peer=10.0.2.1:2152 gtpu=off retries=unlimited 

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------

set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 sec_key=0102030405060708090A0B0C0D0EFF00 eia=null+snow3g+aes eea=null imsi=250:555:21645400
ue_param id=1 ue_nr_capabilities=01000000010800000004D780000000000001150000000000000150  dual_conn=eutra_nr ue_eutra_nr_capabilities=010C040100904D00000402404D000200020100801002

set_bearer id=2 ue=1 qci=9 pdn=1 ip=4.7.254.208 default=on trf_type=internal
uec_param id=1 reordering_window_size=50 reordering_timer=200

#---------------------------------------------------------------------------------------------------
#OTHER CONFIGURATION
#---------------------------------------------------------------------------------------------------

debug_log level=0
#debug_log level=6

set_log log_to_file=true max_file_num=1

trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
trace uec=1 protocol=x2 on
trace protocol=x2 enb=1 on
trace protocol=x2u enb=1 on

#PR515270,to avoid egate console crash issue because of WTS CPU capability
link_ctrl_param use_hb=off

#PR518896,to avoid DL traffic not stable issue because of WTS CPU capability. As Dev find there are missing PDCP DL paquets and unordered PDCP DL packets.
sim_debug_log level=1 mme=1
sim_debug_log level=1 uec=1
sim_debug_log level=1 pgw=1
sim_debug_log level=1 sgw=1

cfg_end

start version_check=off

