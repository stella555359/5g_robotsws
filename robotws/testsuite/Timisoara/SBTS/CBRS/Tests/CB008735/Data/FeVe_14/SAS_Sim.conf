# SAS Simulator configuration file

[conf]
#WInnF Technical Specification Protocol Version
ts_version = v2.0
enable_compatible_mode = true

#list of features supported by SAS
force_sas_feature_capability_list_group = registration,1,WF_ENH_GROUP_HANDLING,WF_GRANT_UPDATE;featureCapabilityExchange,1,WF_GRANT_UPDATE

force_method_feature_exchange_trigger_group = spectrumInquiry,2

force_method_frequency_guidance_group = spectrumInquiry,1,3570_3575,3575_3580,3580_3585,3585_3590,3590_3595,3595_3600,3600_3605,3605_3610;spectrumInquiry,2

#port number that is binded with SAS service
port_number = 4433

#enable ipv6 support
enable_ipv6 = no

#TLS connection with CBSD
tls_connection = yes

#TLS mutual authentication
#no means server will not validate peer's certificate
tls_mutual_auth = no

#key file of SAS server used for TLS connection
key_file_name = nokia04.key

#certificate file of SAS server used for TLS connection
cert_file_name = nokia04.cert

#CA file used to validate certificates passed from client
CA_file_name = ca.cert

#log file used to collect logs
#removing this item to print logs through console
log_file_name = /home/ute/SASSim/default/SAS_Sim.log

proxy_log_name = /home/ute/SASSim/default/HttpsProxy.log
#log level, should be one of following (in increasing order of severity):
#[debug, info, warning, error, critical]
log_level = debug

#heartbeat duration in second
heart_beat = 60

#grant duration until expiry in second
grant_exp = 300

#transmit duration until expiry in second
transmit_exp = 150


#disapproving the grant request and response with the frequency or
#peak power different from the values sent in the request
disapprove_grant = no

#suspending the grant via heartbeat response with error code of SUSPENDED_GRANT
suspend_grant = no

#terminating the grant via heartbeat response with error code of TERMINATED_GRANT
terminate_grant = no

#including the new operational parameters in
#heartbeat response if the grant is suspended
suspended_reassign = no

#including the new operational parameters in
#heartbeat response if the grant is terminated
terminated_reassign = no

#extend grantExpireTime in Heartbeat response if
#grantRenew is set to True in a heartbeatRequest
renew_grant = yes

#extend transmitExpireTime in Heartbeat response
renew_transmit = yes

#recommended value of maxEirp in grant response if
#disapprove_grant is set to yes or in heartbeat response if
#suspended_reassign/terminated_reassign is set to yes
recommend_max_eirp = 26

#recommended value of lowFrequency in grant response if
#disapprove_grant is set to yes or in heartbeat response if
#suspended_reassign/terminated_reassign is set to yes
recommend_low_freq = 3690000000

#recommended value of highFrequency in grant response if
#disapprove_grant is set to yes or in heartbeat response if
#suspended_reassign or terminated_reassign is set to yes
recommend_high_freq = 3700000000

#response encoding
chunked = False
chunksize = 40

#sas sim act as domain proxy
dp_model = no

#TLS connection mode :
#tls_mode TlsAll to support TLS1.2 and TLS1.3
#tls_mode Tls1v2Only to support TLS1.2
tls_mode = TlsAll