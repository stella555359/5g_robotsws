[Columns]
ColumnName:Source id, ValueType:Source //This must be the first column, this is filled automatically
ColumnName:Source name, ValueType:MultiText //This is filled automatically
ColumnName:Start time, ValueType:Time //This is filled automatically
ColumnName:Stop time, ValueType:Time //This is filled automatically
ColumnName:Duration, ValueType:Duration //This is filled automatically
ColumnName:Trace count, ValueType:IntegerValue //This is filled automatically
ColumnName:Message count, ValueType:IntegerValue //This is filled automatically
ColumnName:ZMQ/SCTP name, ValueType:Text

VariableName:OutPath, ValueType:Text, Global

[C-Syntax]
WhenLoadingStarted
{
  if(GlobalVariable(OutPath).IsNullOrEmpty())
  {
    MessageBox.Show("Please give an OutPath as -Variable OutPath \"C:\\\\Temp\\\\FoundMessages.txt\"");
    EmilExit(1);
  }
}

[C-Syntax]
Message:*
{
  var found = Message(Name).StartsWith("0x") != false;
  //String msg;
  if(found == false)
  {
    lock(MessagesNum)
    {
	  //msg =  Message(Number).ToString()+ ' ' + Message(Name);
      if(!MessagesNum.Contains(Message(Number).ToString()+ ' ' + Message(Name)))
        MessagesNum.Add(Message(Number).ToString()+ ' ' + Message(Name)+ ' ' + Message(Data).ToHexStringNicely());
		//MessagesNum.Add(Message(Data).ToString());
    }
  }
}


[C-Syntax]
WhenLoadingFinished
{
  try
  {
    lock(MessagesNum)
    {
      using (var f = File.CreateText(GlobalVariable(OutPath)))
      {
        foreach(var message in MessagesNum)
          f.WriteLine(message);
      }
    }
  }
  catch(Exception e)
  {
    MessageBox.Show(@"Could not save to OutPath, error:\n" + e.ToStringWithLineNumbers());
  }
}

[Globals]

//static HashSet<int> MessagesNum = new HashSet<int>();
static HashSet<String> MessagesNum = new HashSet<String>();
 
