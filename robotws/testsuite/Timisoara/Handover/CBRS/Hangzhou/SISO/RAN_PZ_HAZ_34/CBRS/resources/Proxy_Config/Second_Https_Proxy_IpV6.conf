# HttpsProxy configuration file
[conf]
# port number that is binded with SAS service
port_number = 4441

# enable ipv6 support
enable_ipv6 = true 

# log file used to collect logs
# removing this item to print logs through console
log_file_name = SecondaryHttpsProxy.log 

# log level, should be one of following (in increasing order of severity):
# [debug, info, warning, error, critical]
log_level = debug 
