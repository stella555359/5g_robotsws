apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: loki-driver-load-master
spec:
  config:
    ignition:
      version: 3.2.0
    systemd:
      units:
      - contents: |
          [Unit]
          Description=loki driver loader
          # Before kubelet.service (no effect on systems without kubernetes) 
          Before=kubelet.service

          [Service]
          Type=oneshot
          TimeoutStartSec=25m
          RemainAfterExit=true
          # Use bash to workaround https://github.com/coreos/rpm-ostree/issues/1936
          ExecStart=/usr/bin/bash -c "mkdir -p /var/home/core/bin && podman run -i --privileged -v /var/home/core/bin:/tooldir:Z ocp-team-local.artifactory-espoo2.int.net.nokia.com:443/nic-drivers/loki/loki-21.22.22-n0:$(uname -r) load.sh"
          StandardOutput=journal+console

          [Install]
          WantedBy=default.target
        enabled: true
        name: loki-driver-load.service
