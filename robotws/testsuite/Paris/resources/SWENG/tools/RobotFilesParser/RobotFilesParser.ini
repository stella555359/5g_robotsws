[INPUT_PARAMETERS]
list_path           = ../robotws/testsuite/Paris/RRM/ET
key_pattern         = CA_5G_SW_FR-Villarceaux
result_filename     = NPS_RobotFiles

[PATTERN]
# Pattern to search in .robot files. Use \s for space char
pattern_trunkload   = \sSBTS00
pattern_sbts_N0     = \sSBTS23R1
pattern_sbts_N1     = \sSBTS22R4
pattern_sbts_N2     = \sSBTS22R3
pattern_masterload  = \smaster_classicalbts_all
pattern_cloudload   = \smaster_vDU
pattern_testname    = ^\[1
pattern_topology1   = \sCLOUD_5G_
pattern_topology2   = \sCLOUD_5GC_
pattern_test_cit    = CIT
pattern_test_crt    = CRT
pattern_test_cdrt   = CDRT
pattern_testscope1  = \s5G_RAN
pattern_testscope2  = \s5G_RAN_.DD
pattern_testscope3  = \sRAN_5G\s
pattern_testscope4  = \sRAN_5G_.DD
pattern_python27    = PY27
pattern_python3x    = PY3.

[EXCEL_HEADER]
# Define the name of each column of excel file
robot_pathname      = Robot pathname
robot_testname      = QC TestCase Name
utetl_topology      = Topology
cit_test            = CIT
crt_test            = CRT
cdrt_test           = CDRT
new_global_scope    = New Global Scope
old_global_scope    = Old Global Scope
mandatory_pattern   = Mandatory Pattern
l_trunk_name        = Local Trunk Load
l_br_N0_name        = Local Branch N
l_br_N1_name        = Local Branch N-1
l_br_N2_name        = Local Branch N-2
trunk_name          = Trunk Load
br_N0_name          = Branch N
br_N1_name          = Branch N-1
br_N2_name          = Branch N-2
g_trunk_name        = Trunk Load Synthesis
g_br_N0_name        = Branch N Synthesis
g_br_N1_name        = Branch N-1 Synthesis
g_br_N2_name        = Branch N-2 Synthesis
cloud_name          = Cloud Load
master_classical    = Master Load
robot_filename      = Robot filename
link_to_reporting   = Direct Link to Reporting Portal
link_to_qc_site     = Direct Link to QC Site
python_version      = Python

[EXCEL_FOOTER]
# Define the name of each Excel sheet
sheet_1             = "Robot"
sheet_2             = "RP Links"
sheet_3             = "RP Links - Trunk"
sheet_4             = "RP Links - PRV_ Files"
