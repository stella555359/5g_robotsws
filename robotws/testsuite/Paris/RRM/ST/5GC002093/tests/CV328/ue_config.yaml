UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_1:
                # Capabilities that UE has. (as a list)
                CAPABILITIES:
                    - REAL_UE
                    - REAL_ANDROID_UE
                    - Capa_UE_1
                CLASS: AtCmdsUe
                CONSTRUCTOR_PARAMETERS:
                    # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    serial_number: '5662c822'
                    # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                    configuration:
                        serial_com: '8'
                        diag_com: '9'
                        ue_pc_ip: '10.0.116.133'
                        # UE PC IP address
                        ue_type: 'LINUX'
                        pyro_port: '9090'
                        # TCP Port number on UE PC on which Pyro server will be started
                        login: 'cv5g2_5'
                        password: 'M!k@el5G'
                        # SSH password to UE PC
                        server_dir: 'C:/pyro_server'
                        # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'
                        # UE PC python location
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/QCAT.exe'
                        #  PATH TO QCAT EXE APPLICATION (required to decode qmdl file)
                        diag_cfg_path: >
                         C:/pyro_server/DIAG.cfg
                        # PATH to DIAG.cfg file on UE PC (required to filter qualcomm messages)
                        network_mode_switch_method: 'ADB'
