- ID: ${nrcell_id}
  MOC: NRCELL
  actBeamforming: 'true'
  numberOfRxBeamforming: '4Rx'
  beamSet:
  - basicBeamSet: beamSet_2
    beamSetInUse: beamSet_1
    leftEdgeAngle: '60'
    nrBtsBeamRefinementP2: 'false'
    rightEdgeAngle: '60'
  csirsBeamMgmt:
  - csirsBmMgmtDensity: density3
    csirsBmMgmtReIndex: '0'
    csirsBmMgmtSubband: aboveSSPBCHBlock
- ID: ${nrcellgroup_id}
  MOC: NRCELLGRP
  numberOfTransmittedSsBlocks: 2 beams
- ID: '1'
  MOC: NRBTS
  actFdmEnhancedScheduling: 'true'

