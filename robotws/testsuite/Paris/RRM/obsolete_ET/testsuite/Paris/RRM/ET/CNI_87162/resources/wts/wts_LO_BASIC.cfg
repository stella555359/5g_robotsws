#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP
set GNB_ID="2"
set GNB_NG_ADDR="10.0.1.2"    #ZH: real gnB XN interface
set GNB_XN_ADDR="10.0.1.2"
set GNB_HEX="0x1:22"
set PROXY_SERVER_IP="10.0.2.80"    #ZH: configured on eth0
set AMF_N2_IP="10.0.1.1"          #AMF IP addr
set AMF_N2_PORT="38412"
set AMF_NAME="AMF-KRK-SC12-29-E1"

set GNB2_ID="3"                    #simulated
set GNB2_NG_ADDR="10.0.3.153"        #NG
set GNB2_XN_ADDR="10.0.3.151"        #XN
set GNB2_HEX="0x02:22" #2 - gNB_id related to the id of adjacent neighbour in New Radio Cell in SCF
set TAC_LIST="7151"
set PLMN="311:489"
set PROXY_SERVER2_IP="192.168.6.252"

set TAC_LIST="7151"
set PLMN="311:489"

set UEC_ADDR="72.22.0.1"
set UPF_ADDR="10.12.2.1"
set EDAEMON_PORT="22222"
set TAC_LIST="7151"
set PLMN="311:489"

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------

#AMF simulator
set_amf_region id=1 tac_list=7627107,100,200,788,0 plmn=$PLMN
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_N2_IP:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc

#UPF simulator
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_N2_IP

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#-----------------------------------------------------------------------------------------   ----------
set_gnb id=$GNB_ID type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=$GNB_HEX daemon=$SERVER_IP:$EDAEMON_PORT  xn=$GNB_XN_ADDR x2_peers=none amf=1
set_cell id=1 gnb=2 nr_arfcn=640000:640000 gscn=7915 eci=0x000021f pci=16:2 tac=0 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x01 tdd_cell=on mandatory_for_activation=off
set_cell id=2 gnb=2 nr_arfcn=650000:650000 gscn=8019 eci=0x000021f pci=17:0 tac=0 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x02 tdd_cell=on mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------

#---------------------------------------------------------------------------------------------------
# GNB Simulated CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=$GNB2_ID type=simulated plmn=311:489 ng=$GNB2_NG_ADDR gnb_id=$GNB2_HEX daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none xn=$GNB2_XN_ADDR nssai=0x1:0xd143a5 #PLMN= MCC:MNC
gnb_param id=$GNB2_ID xn_listening_socket=1 sib1_period=160ms send_xn_setup=false
set_cell id=1 gnb=$GNB2_ID pci=16:1 tac=0 nrci=0x1 tdd_cell=on proxy=$PROXY_SERVER2_IP:9999|$PROXY_SERVER2_IP:8888 nr_arfcn=636666:636666

#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 file=APconfig_2cell_2ABIL.xml

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
set UE_Capa_
set UE_Capa_
set UE_Capa_Common_non_CGI_
#---------------------------------------------------------------------------------------------------

#UES on real gNB NUMBERS
#gNB 2 CELL 1
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1

ue_param id=1 ue_nr_capabilities=$UE_Capa_CA


#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_qosflow id=1 5qi=5 default=on
set_nwslice id=1 snssai=0x1:0xd143a5 qos_flows=1 ue=1 default=on amf=1    #s-NSSAI

set_pdu_gateway id=1  ue_nat_ip=72.23.0.1  dl_nat_gw=10.0.2.1  ul_nat_gw=10.0.2.1


debug_log level=4
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end

set_log log_to_file=on
sim_start version_check=off
