[conf]

port_number = 4433
enable_ipv6 = no
tls_mode = TlsAll
tls_connection = yes
tls_mutual_auth = no
key_file_name = nokia04.key
cert_file_name = nokia04.cert
CA_file_name = ca.cert


log_file_name = SAS_Sim.log
proxy_log_name = HttpsProxy.log
log_level = debug

chunked = False
chunksize = 40

dp_model = no

heart_beat = 100
grant_exp = 36000
transmit_exp = 115

disapprove_grant = no
suspend_grant = no
terminate_grant = no
suspended_reassign = no
terminated_reassign = no
renew_grant = yes
renew_transmit = yes
recommend_max_eirp = 26
recommend_low_freq = 3690000000
recommend_high_freq = 3700000000

# note !!!!!
# every config setting must be written in one line

# config for SAS server setup
# ====================================================================================================
# port number which SAS server bind to
#       port_number = 443
# ----------------------------------------------------------------------------------------------------
# enable ipv6 support
#       enable_ipv6 = no
# ----------------------------------------------------------------------------------------------------
# TLS connection with CBSD
#       tls_connection = yes
# ----------------------------------------------------------------------------------------------------
# TLS connection mode :
# TlsAll to support TLS1.2 and TLS1.3
# Tls1v2Only to support TLS1.2
#       tls_mode = TlsAll
# ----------------------------------------------------------------------------------------------------
# TLS mutual authentication :
# `no` means SAS server will not validate peer's certificate
#       tls_mutual_auth = no
# ----------------------------------------------------------------------------------------------------
# key file of SAS server used for TLS connection
#       key_file_name = nokia04.key
# ----------------------------------------------------------------------------------------------------
# certificate file of SAS server used for TLS connection
#       cert_file_name = nokia04.cert
# ----------------------------------------------------------------------------------------------------
# CA file used to validate certificates passed from client
#       CA_file_name = ca.cert
# ----------------------------------------------------------------------------------------------------
# log file used to collect logs :
# removing these items to print logs through console
#       log_file_name = SAS_Sim.log
#       proxy_log_name = HttpsProxy.log
# ----------------------------------------------------------------------------------------------------
# log level, should be one of following :
# e.g. debug is lowest serverity, which can print all severities of log):
# [debug, info, warning, error, critical]
#       log_level = debug
# ====================================================================================================


# config for domain proxy
# ====================================================================================================
# SAS server act as domain proxy
#       dp_model = no
# ----------------------------------------------------------------------------------------------------
# parameters: 1st-method, 2nd-sequence, 3rd-DP errorcode, 4th-backoffInterval(9190)/SAS errorcode(9193)
#       force_response_group = registration,1,9190,600;nokia_100_RY142915126-spectrumInquiry,1,9193,500;
#                              nokia_100_RY142915126-3550000000_3560000000-heartbeat,2,9192
# ====================================================================================================


# general config
# ====================================================================================================
# set pal channels accoriding to ts version. e.g. 5M spacing for ts1.2, 10M spacing for ts2.0
pal_reserved_channel = 3550,3560
# ----------------------------------------------------------------------------------------------------
# whether remove cbsd from registered cbsd list immediately without deregistration if response code == 105
#       force_response_dereg_immediately = yes
# ----------------------------------------------------------------------------------------------------
# set cbsdFrequencyGuidance for method
# not recommended, prefer to force_method_frequency_guidance_group
# parameters: sas method, [cbsdFrequenceGuidance]
#       cbsd_frequency_guidance = registration,3550_3560,3560_3570;spectrumInquiry,3560_3570,3570_3580;
#                                 grant,3620_3630;heartbeat,3590_3600,3610_3620
# ----------------------------------------------------------------------------------------------------
# set spectrum_table
# parameters: spectrum, lowFreq, highFreq, isPal, cbsdid, maxEirp
#       spectrum_table = 3550-5:3550000000,3555000000,False,'',37;3555-5:3555000000,3560000000,False,'',38
#
# you can set spectrum_table per cbsd using cbsd_spectrum_table:
# e.g.1
#   [nokia_200_DH123456782.NR]
#        cbsd_spectrum_table = 3550-5:3550000000,3555000000,False,'',37;3555-5:3555000000,3560000000,False,'',38
# ----------------------------------------------------------------------------------------------------
# set sas_feature_capability_list
# not recommended, prefer to force_sas_feature_capability_list_group
# parameters: [feature_list]
#       sas_feature_capability_list = ['sas_feature_capability_list']
# ----------------------------------------------------------------------------------------------------
# set sequence to clear sas_feature_capability_list
# not recommended, prefer to force_sas_feature_capability_list_group
# parameters: counter N, clear True/False
# for the Nth registration response, set sas_feature_capability_list as [] if `clear` is True,
# or else set it as None
# for the (N+1)th and afterwards registration response, sas will remove cbsd from registered cbsd list,
# so subsequent request will recieve 103 until next registration
#       sas_feature_capability_clear = 1,True
# ====================================================================================================


# SAS server response control
# ====================================================================================================
# Will NOT respond the specified request to make CBSD stay in a certain state
# following sas request are valid:
# [registration, deregistration, spectrumInquiry, grant, heartbeat, relinquishment]
# request sequence begin from 1, specify which request sequence response will be blocked
#       blocked_request = grant,heartbeat
#       blocked_request_grantids = 3550000000_3560000000,3570000000_3580000000
#       blocked_request_sequence = 1,1
#
# # you can configure blocked_request per cbsd:
# ----------------------------------------------------------------------------------------------------
# supported methods:
# [registration, deregistration, spectrumInquiry, grant, heartbeat, relinquishment]
# ----------------------------------------------------------------------------------------------------
# supported options: blocked_request_grantids, blocked_request_sequence
#e.g.1
#   [nokia_200_DH123456782.NR]
#       blocked_request = grant,heartbeat
#       blocked_request_grantids = 3550000000_3560000000,3570000000_3580000000
#       blocked_request_sequence = 1,1
#
# ----------------------------------------------------------------------------------------------------
# below options should be set together for SAS server delay response
# set CBSD request sequence which
#       sas_sleeptime_sequence = 1,2
# after the sleep time duration, SAS send the response to CBSD
#       sas_sleep_time = 2
# ----------------------------------------------------------------------------------------------------
# below options should be set together for dropping CBSD requests
# whether dropping requests
#       drop_request_enable = 1
# set drop sequence
#       drop_request_sequence = 1,2,3
# after the drop_request_delay, SAS server close the socket
#       drop_request_delay = 1
# ====================================================================================================


# force_sas_method
# ====================================================================================================
# force_sas_method and supplemental config
# force_sas_method cannot be used alone, need extra config to work
# ----------------------------------------------------------------------------------------------------
# set the method to be forced
# supported methods:
# [registration, deregistration, spectrumInquiry, grant, heartbeat, relinquishment]
#       force_sas_method = grant
# ----------------------------------------------------------------------------------------------------
# set filter for grant, heartbeat, relinquishment, if not set, all grants will be matched
#       force_sas_method_grantids = 3550000000_3560000000,3570000000_3580000000
# ----------------------------------------------------------------------------------------------------
# set http status code
# note: CBSD will only handle 404
#       force_http_response_code = 404
# ----------------------------------------------------------------------------------------------------
# set sequences for force_http_response_code
# parameters: [sequences]
#       force_http_response_sequences = 1,2,3
# ----------------------------------------------------------------------------------------------------
# set response error code
# suppored as below:
# [0, 100, 101, 102, 103, 104, 105, 106, 200, 201, 202, 300, 400, 401, 402, 500, 501, 502, 999]
#       force_response_code = 402
# ----------------------------------------------------------------------------------------------------
# set sequences for response error code
#       force_sas_method_sequence = 1,2,3
# ----------------------------------------------------------------------------------------------------
# set responseData for response
# e.g.1.
#       force_sas_method = spectrumInquiry
#       force_sas_method_sequence = 1,2,3
#       force_response_data = [{"cbsdId": "nokia_100_RY142915126", "grantId": "3550000000_3560000000"}]
# e.g.2.
#       force_sas_method = registration
#       force_sas_method_sequence = 1
#       force_response_code = 106
#       force_response_data = 30
# ----------------------------------------------------------------------------------------------------
# remove specified key from response
#       force_exclude_param = cbsdId
# ----------------------------------------------------------------------------------------------------
# update any parameter with any value in response message before sas sending out
# note: should make sure the response already contains the parameter when using force_update_param
#       force_update_param = measReportConfig
#       force_update_param_data = ["EUTRA_CARRIER_RSSI_NON_TX"]
# ----------------------------------------------------------------------------------------------------
# set maxEirp for spectrumInquiryResponse, only works when force_sas_method_sequence matched
#       force_max_eirp = 23
# ----------------------------------------------------------------------------------------------------
# set cbrsaVersion for response
#       cbrsaVersion = v3.0
# ----------------------------------------------------------------------------------------------------
# set cbrsaVersion when the sequence matched. Once the sequence matched, the cbrsaVersion will be set
# to v2.0 automatically in subsequent response
# not recommended, prefer to force_method_cbrsa_version_group
# parameters: seq, value
#       cbrsaVersion_change_sequence = 2,v3.0
# ----------------------------------------------------------------------------------------------------
# set eutra_tdd_config for subframe ratio
#       eutra_tdd_config = 2,5
# ----------------------------------------------------------------------------------------------------
# set eutraTddConfig when sequence matched
# not recommended, prefer to force_method_eutra_tdd_config_group
# parameters: seq, ulDLConfig, ssfConfig
#       eutraTddConfig_change_sequence = 2,2,5
# ====================================================================================================
# you can configure force_sas_method per cbsd:
# ----------------------------------------------------------------------------------------------------
# supported methods:
# [registration, deregistration, spectrumInquiry, grant, heartbeat, relinquishment]
# ----------------------------------------------------------------------------------------------------
# supported options: force_sas_method_sequence, force_response_code, force_response_data, force_sas_method_grantids,
#                    force_exclude_param, force_update_param, force_update_param_data
#e.g.1
#   [nokia_200_DH123456782.NR]
#       force_sas_method = grant
#       force_sas_method_sequence = 1,2,3
#       force_response_data = [{"cbsdId": "nokia_200_DH123456782.NR", "grantId": "3550000000_3560000000"}]
#       force_sas_method_grantids = 3550000000_3560000000
#
#
# force_sas_method_group
# ====================================================================================================
# only works for [spectrumInquiry, grant, heartbeat, relinquish, featureCapabilityExchange]
# parameters: grantid, method, sequence, responsecode,
#              featureDataExchangeConfigFlg(optional), reponse_force_data(optional)
#       force_sas_method_group=3550000000_3560000000,grant,1,400;3550000000_3560000000,heartbeat,1,500
# ====================================================================================================
# you can configure force_sas_method_group per cbsd using cbsd_force_sas_method_group
# ----------------------------------------------------------------------------------------------------
# supported methods:
# [grant, heartbeat, relinquishment]
# ----------------------------------------------------------------------------------------------------
# parameters: grantid, method, sequence, responsecode,
#
#e.g.1
#   [nokia_200_DH123456782.NR]
#      cbsd_force_sas_method_group=3550000000_3560000000,grant,1,400;3550000000_3560000000,heartbeat,1,500
#
# force_heartbeat_transmit_expire_duration_group


force_max_eirp_group = 3570000000_3580000000,1,23;3570000000_3580000000,2,23;3570000000_3580000000,3,23

[1125_Nokia_EB2331R0726.NR]
    cbsd_spectrum_table = 3550-10:3550000000,3560000000,True,'',37;3560-10:3560000000,3570000000,True,'',37;3570-10:3570000000,3580000000,True,'',37;3580-10:3580000000,3590000000,True,'',37
[1125_Nokia_EB2331R0728.NR]
    cbsd_spectrum_table = 3550-10:3550000000,3560000000,True,'',37;3560-10:3560000000,3570000000,True,'',37;3570-10:3570000000,3580000000,True,'',37;3580-10:3580000000,3590000000,True,'',37
[1125_Nokia_EB2331R0730.NR]
    cbsd_spectrum_table = 3550-10:3550000000,3560000000,True,'',37;3560-10:3560000000,3570000000,True,'',37;3570-10:3570000000,3580000000,True,'',37;3580-10:3580000000,3590000000,True,'',37
    cbsd_force_sas_method_group=3550000000_3570000000,heartbeat,3,501;3550000000_3570000000,heartbeat,4,501;3550000000_3570000000,heartbeat,5,501;3550000000_3570000000,heartbeat,6,501;3550000000_3570000000,heartbeat,7,501;3550000000_3570000000,heartbeat,8,501;3550000000_3570000000,heartbeat,9,501;3550000000_3570000000,heartbeat,10,501;3550000000_3570000000,heartbeat,11,501;3550000000_3570000000,heartbeat,12,501;3550000000_3570000000,heartbeat,13,501;3550000000_3570000000,heartbeat,14,501;3550000000_3570000000,heartbeat,15,501;3550000000_3570000000,heartbeat,16,501;3550000000_3570000000,heartbeat,17,501;3550000000_3570000000,heartbeat,18,501
    
# ====================================================================================================
# set transmit expire duration by grantId
# parameter: grantid,sequence,duration
#       force_heartbeat_transmit_expire_duration_group=3550000000_3560000000,1,120;3550000000_3560000000,1,10
# ====================================================================================================
#
#
# config for registration
# ====================================================================================================
# force registration response code and responseData and responseMessage by sequence
# parameters: seq, errorcode, responseData(optional), responseMessage
#       force_registration_method_group = 1,100,responseData,responseMessage;2,100
#
# you can configure force_registration_method_group per cbsd using cbsd_force_registration_method_group:
#
# e.g.1
#   [nokia_200_DH123456782.NR]
#       cbsd_force_registration_method_group = 1,100,responseData,responseMessage
# ====================================================================================================
#
#
# config for deregistration
# ====================================================================================================
#
# force deregistration response code and responseData by sequence
# parameters: sequence, errorcode, responseData
#       force_deregistration_method_group = 1,100,responseData
#
# you can configure force_deregistration_method_group per cbsd using cbsd_force_deregistration_method_group:
#
# e.g.1
#   [nokia_200_DH123456782.NR]
#       cbsd_force_deregistration_method_group = 1,100,responseData
# ====================================================================================================
#
# config for spectrumInquiry
# ====================================================================================================
# update spectrum_table when spectrumInquiryRequest matched
# parameters: spectrum:lowFreq, highFreq, isPal, cbsdid (optional) ,maxEirp(optional)
#       force_spectrumInquery_response = 3550-10:3550000000,3560000000,False,'',23;3560-10:3560000000,
#                                        3570000000,False,'',30
#
# you can use force_spectrumInquery_response per cbsd using cbsd_force_spectrumInquery_response:
#
# e.g.1
#   [nokia_200_DH123456782.NR]
#       cbsd_force_spectrumInquery_response = 3550-10:3550000000,3560000000,False,'',23
# ----------------------------------------------------------------------------------------------------
# set sequence which match the select spectrumInquiryRequest
#       spectrumInquery_times = 2
#
# you can set spectrumInquery_times per cbsd using cbsd_spectrumInquery_times:
#
# e.g.1
#   [nokia_200_DH123456782.NR]
#       cbsd_spectrumInquery_times = 2
# ----------------------------------------------------------------------------------------------------
# set maxEirp for spectrumInquiryResponse
# parameters: grantid, sequence, maxEirp
#       force_max_eirp_group = 3550000000_3560000000,2,26;3560000000_3570000000,2,27;3590000000_3600000000,2,28
# ----------------------------------------------------------------------------------------------------
# force spectrumInquiry response code by sequence
# note: responseData will over write the force_spectrumInquery_response
# parameters: sequence, errorcode, responseData(optional)
#       force_spectrumInquiry_method_group = 1,0;2,103,20
# ----------------------------------------------------------------------------------------------------
# # you can configure force_spectrumInquiry_method_group per cbsd using cbsd_force_spectrumInquiry_method_group:
#
# e.g.1
#   [nokia_200_DH123456782.NR]
#       cbsd_force_spectrumInquiry_method_group = 1,0;2,103,20
# ====================================================================================================
#
# config for grant
# ====================================================================================================
# set heartbeatInterval in second for grantResponse
#       heart_beat = 60
#
# you can use heart_beat per cbsd using cbsd_heart_beat:
#
# e.g.1
#   [nokia_200_DH123456782.NR]
#       cbsd_heart_beat = 60
# ----------------------------------------------------------------------------------------------------
# grant duration until expiry in second
#       grant_exp = 36000
#
# you can use grant_exp per cbsd using cbsd_grant_exp:
#
# e.g.1
#   [nokia_200_DH123456782.NR]
#       cbsd_grant_exp = 60
# ----------------------------------------------------------------------------------------------------
# recommend operationParam in sequence for grant with error code 400 by setting disapprove_grant = yes
# parameters items in the following list will be consumed one by one for every grant response
# recommend_operationParam_grant can NOT be used alone, use should still config disapprove_grant = yes
# parameters: [maxEirp,lowFreq,highFreq]
#       recommend_operationParam_grant = 26,3550000000,3560000000;27,3660000000,3670000000; , , ;
#                                        28,3670000000,3680000000
#       disapprove_grant = yes
# ----------------------------------------------------------------------------------------------------
# recommend operationParam for all grants with error code 400 by setting disapprove_grant = yes
# take effective only when recommend_operationParam_grant is not configured
# in grant response (400) if disapprove_grant is set to yes
# below options can NOT be used alone, user should still config disapprove_grant = yes
#       recommend_max_eirp = 26
#       recommend_low_freq = 3690000000
#       recommend_high_freq = 3700000000
#       disapprove_grant = yes
# ====================================================================================================


# config for heartbeat
# ====================================================================================================
# set operationParam for heartbeat with error code 500 or 501
# combined configuration:
# (response code == 500 and terminated_reassign == true) or
# (response code == 501 and suspended_reassign == true)
#       recommend_operationParam_heartbeat = 26,3650000000,3660000000; 28,3630000000,3640000000; , , ;
#                                            25,3640000000,3650000000
# ----------------------------------------------------------------------------------------------------
# transmit duration until expiry in second
#       transmit_exp = 3600
#
# you can use transmit_exp per cbsd using cbsd_transmit_exp:
#
# e.g.1
#   [nokia_200_DH123456782.NR]
#       cbsd_transmit_exp = 60
# ----------------------------------------------------------------------------------------------------
# terminating the grant via heartbeat response with error code of TERMINATED_GRANT(500)
# it is another way to set error code for heartbeat response to 500, and takes high priority over
# force_sas_method and force_sas_method_group
#       terminate_grant = yes
# ----------------------------------------------------------------------------------------------------
# suspending the grant via heartbeat response with error code of SUSPENDED_GRANT(501)
# it is another way to set error code for heartbeat response to 501, and takes high priority over
# force_sas_method and force_sas_method_group
#       suspend_grant = yes
# ----------------------------------------------------------------------------------------------------
# extend grantExpireTime to now() + grant_exp in Heartbeat response if grantRenew is configured to True
# and heartbeatRequest with grantRenew = True.
# two kinds of config combinations:
# e.g.1. when error code is 501 in force_sas_method_group
#       force_sas_method_group=3550000000_3560000000,heartbeat,1,501
#       renew_grant = yes
#       grant_exp = 36000
# e.g.2. when error code is 0 in all cases
#       renew_grant = yes
#       grant_exp = 36000
# ----------------------------------------------------------------------------------------------------
# extend transmitExpireTime in Heartbeat response when the grant is already in authorized state
# the transmitExpireTime is caculated according to 'heart_beat' and 'grant_exp' and 'transmit_exp' config
#       renew_transmit = yes
#       heart_beat = 30
#       grant_exp = 36000
#       transmit_exp = 100
# ====================================================================================================


# ts2.0 config
#
# ====================================================================================================
# set sas simulator version
#       ts_version = v2.0
# ====================================================================================================


# ====================================================================================================
# set whether SAS can work with the CBSD with lower TS version or not, only meaningful when SAS TS version is higher than CBSD's
# if SAS TS version is lower than CBSD's, SAS will response 100

# if SAS TS version is higher than CBSD's and enable_compatible_mode = true, SAS will response 0 in case no error occurred
# if SAS TS version is higher than CBSD's and enable_compatible_mode = false, SAS will response 100

# e.g. when ts_version == v2.0 and CBSD TS version == v1.2,
#       enable_compatible_mode = true
# ====================================================================================================


# ====================================================================================================
# set operationParam for heartbeat when error code is 0
# parameters: grant_id,sequence,maxEirp,lowFreq,highFreq
#       recommend_operationParam_heartbeat0 = 3550000000_3570000000,1,33,3550000000,3570000000
# ====================================================================================================


# ====================================================================================================
# set channelType for heartbeat when error code is 0
# parameters: grant_id,sequence,isPal
#       force_heartbeat_channeltype_group = 3550000000_3570000000,1,true;3550000000_3570000000,2,false
# ====================================================================================================


# ====================================================================================================
# set grouping config for response when error code is 0
# parameters: method,sequence,group_type,group_id,support_by_sas
#       force_method_grouping_config_group_type_group_id_supported_by_sas =
#                              registration,1,COEXISTENCE_GROUP,CBRS_ALLIANCE,True;
#                              spectrumInquiry,1,COEXISTENCE_GROUP,CBRS_ALLIANCE,False;
#                              3550000000_3570000000-grant,1,COEXISTENCE_GROUP,CBRS_ALLIANCE,True;
#                              3550000000_3570000000-heartbeat,1,COEXISTENCE_GROUP,CBRS_ALLIANCE,False
# ====================================================================================================


# ====================================================================================================
# set sas feature capability list
# parameters: method,sequence,sas_feature_capability_list
# note:
# seq without subsequent commas means no sas_feature_capability_list in response, e.g. registration,1
# seq with subsequent commas means empty list for sas_feature_capability_list in response, e.g. registration,2,
#       force_sas_feature_capability_list_group =
#                  registration,1;registration,2,;registration,3,WF_ENH_GROUP_HANDLING,WF_GRANT_UPDATE
# ====================================================================================================


# ====================================================================================================
# set frequency guidance
# parameters: method,sequences,[freq list]
#       force_method_frequency_guidance_group = 
#                       registration,1,3550_3555,3660_3605;
#                       spectrumInquiry,1,3660_3605;
#                       3550000000_3560000000-heartbeat,1,3570_3590,3600_3610
# ====================================================================================================


# ====================================================================================================
# set feature exchange trigger for response
# parameters: method,[trigger seq list]
#       force_method_feature_exchange_trigger_group =
#                           spectrumInquiry,1,2,3;3550000000_3560000000-grant,1,3;
#                           3550000000_3560000000-heartbeat,2,3;3550000000_3560000000-relinquishment,4
# ====================================================================================================


# ====================================================================================================
# set cbrsa version for response
# parameters: method,sequence,cbrsaversion
#       force_method_cbrsa_version_group = registration,1,v3.0;spectrumInquiry,1,v2.0;3550000000_3560000000-grant,1,v3.0
# ====================================================================================================


# ====================================================================================================
# set eutra_tdd_config for response
# parameters: method,sequence,ULDL_CONFIG,SSF_CONFIG
#       force_method_eutra_tdd_config_group= registration,1,2,7;spectrumInquiry,1,3,1;3550000000_3560000000-grant,1,2,7
# ====================================================================================================


# ====================================================================================================
# grant update config
# for scenario: registration -> inquiry -> grant -> heartbeat -> heartbeat(with operation param which
# changes maxEirp) -> grant(triggered by grant update)
# force update grant(the last grant) response error code 400
#       force_sas_method_group = 3550000000_3560000000,grant,2,400
# ====================================================================================================
