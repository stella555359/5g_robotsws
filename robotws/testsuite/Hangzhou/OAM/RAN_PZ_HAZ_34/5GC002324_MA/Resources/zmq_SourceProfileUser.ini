static HashSet<String> MessagesNum = new HashSet<String>();

public static String GetNameFromAnalyzer(String pdu, String text)
{
    using (StringReader reader = new StringReader(text))
    {
      string line;
      while ((line = reader.ReadLine()) != null)
      {
        var split = line.Split('.');
        if(split.Length == 4 && split[0] == pdu && split[3].Trim().EndsWith(":"))
        {
            return split[3].Trim().Substring(0, split[3].Trim().Length - 1);
        }
      }
      return "Unknown message"; 
    }  
}

//Gets any value, as text, from a ASN.1 string, e.g: "rrc-StateIndicator cell-FACH," -> returns cell-FACH if textToFind is rrc-StateIndicator
public static String GetAsn1Text(String text, String textToFind)
{
    int sourceIndex = text.IndexOf(textToFind, 0, text.Length);
    if(sourceIndex == -1) return null;
    sourceIndex += textToFind.Length;
    //Now sourceIndex points to the text
    
    String number = "";
    while(true)
    {
      if(sourceIndex >= text.Length) break;
      char ch = text[sourceIndex];
      if(ch == ' ') 
	  { 
	  } //Skip space
      else if((ch >= '0' && ch <= '9') || (ch >= '@' && ch <= 'z') || ch == '-' )
      	number += ch;
      else //Not a number or space, ready!
      {
        break;
      }
      sourceIndex++;
    }
    
    //Now we have the text in "number" and sourceIndex and destIndex points to the next character after the number
    if(number.Length > 0)
    {
	  return number;
    }
    return null;
}

public class F1apMessageClass
{
	public DateTime time;
	public uint msgCount;
	public F1apMessageType messageType;
	public F1apProcedureCode procedureCode;   
	public uint gnb_cu_ue_f1ap_id; 
	public uint gnb_du_ue_f1ap_id;
	public int c_rnti;
	public sbyte srbId = -1;
	public long nRCellIdentity ;
	public byte[] rrcContainer;
	byte criticality;
	public ushort totalLength;
	public uint nbrOfProtocolIEs;
	bool cuF1ApIdAvailable = false;
	bool duF1ApIdAvailable = false;
	public NetworkClass plmn = null;
		
	public void Decode(byte[] data, ref int p, bool fullDecode = false)
	{
		messageType = (F1apMessageType)data[p++];
		procedureCode = (F1apProcedureCode)data[p++];			
		criticality = (byte)(data[p] >> 6);		
    p++;
    
    totalLength = GetAsn1Length(data, ref p, true); // (ushort)(((data[p++] & 0x0f) << 8) | data[p++]);
    p += 2;
		nbrOfProtocolIEs = GetAsn1Length(data, ref p); //General.ToUintBE(data, p, 3);		
		
    if(nbrOfProtocolIEs > 1000) 
    {
      DebugBreakPoint;
      return;
    }
    
		//p += 3;	
				
		if(fullDecode == false) 
			return;
		
		uint nbrOfIEs = nbrOfProtocolIEs;
		
		while(nbrOfIEs-->0)
		{		
			var msgHeader = new MessageHeaderClass(data, ref p);
			
			if(msgHeader.ie == F1IEs.id_GNB_CU_UE_F1AP_ID)
			{
				this.gnb_cu_ue_f1ap_id = General.ToUint(data, p, msgHeader.Length, Endian.Big);
				cuF1ApIdAvailable = true;
			}
			else if(msgHeader.ie == F1IEs.id_GNB_DU_UE_F1AP_ID)
			{
				this.gnb_du_ue_f1ap_id = General.ToUint(data, p +1, msgHeader.Length -1, Endian.Big);
				duF1ApIdAvailable = true;
			}
			else if(msgHeader.ie == F1IEs.id_C_RNTI)
			{				
				this.c_rnti = General.ToInt(data, p, msgHeader.Length);				
			}
			else if(msgHeader.ie == F1IEs.id_SRBID)
			{
				this.srbId = (sbyte) data[p];
			}
			else if(msgHeader.ie == F1IEs.id_NRCGI)
			{				
				//4 bytes for plmn
				plmn = new NetworkClass(data, p + 1);	
										
				for(int i = 4; i < msgHeader.Length; i++)
				{
				  this.nRCellIdentity = this.nRCellIdentity << 8;
				  this.nRCellIdentity += data[p + i];				  
				}
								
				this.nRCellIdentity  =  this.nRCellIdentity  >> 4;
				
				//this.nRCellIdentity = General.ToLong(data, p + 4, msgHeader.Length -4); // >> 18;					
				// nRCellIdentity '01001100 00011001 00011100 00000001 1000'B (20427423768)				
			}
			else if(msgHeader.ie == F1IEs.id_RRCContainer)
			{				  
				int len = msgHeader.Length -2;
			  
				this.rrcContainer = new byte[len];				
				
				for(int i = 0; i < len; i++)
				{
				  this.rrcContainer[i] = data[p + 2 + i];
				}
			}
								
			p += msgHeader.Length;			
		}		 
	}
	
	public class MessageHeaderClass
	{
		public F1IEs ie;
		public byte criticality;
		public ushort Length;

		public MessageHeaderClass()
		{	
		}

		public MessageHeaderClass(byte[] data, ref int p)
		{
			Length = 0;

			if (p + 4 < data.Length)
			{
				ie = (F1IEs)General.ToUshort(data, p, Endian.Big);
				p += 2;
				criticality = (byte)(data[p] >> 6);
				if ((data[p + 1] & 0xf0) == 0x80) p++;
				Length = (ushort)(((data[p++] & 0x0f) << 8) + data[p++]);
			}
		}
	}
	
	public bool ReadCuF1ApId(byte[] data, ref int p)
	{
	  if(p >= data.Length) return false;
	  
	  uint nbrOfIEs = nbrOfProtocolIEs;
	  
		while(nbrOfIEs-->0)
		{
			var msgHeader = new MessageHeaderClass(data, ref p);
			
			if(msgHeader.ie == F1IEs.id_GNB_CU_UE_F1AP_ID)
			{
				gnb_cu_ue_f1ap_id = General.ToUint(data, p +1, msgHeader.Length -1, Endian.Big);
				cuF1ApIdAvailable = true;
			}									
			
			p += msgHeader.Length;
			
			if(cuF1ApIdAvailable)
				break;
		}
		
		return cuF1ApIdAvailable;
	}	
	
	public bool ReadF1ApIds(byte[] data, ref int p)
	{
	  if(p >= data.Length) return false;
	  
	  uint nbrOfIEs = nbrOfProtocolIEs;
	  
		while(nbrOfIEs-->0)
		{
			var msgHeader = new MessageHeaderClass(data, ref p);
			
			if(msgHeader.ie == F1IEs.id_GNB_CU_UE_F1AP_ID)
			{
				gnb_cu_ue_f1ap_id = General.ToUint(data, p +1, msgHeader.Length -1, Endian.Big);
				cuF1ApIdAvailable = true;
			}		
			
			if(msgHeader.ie == F1IEs.id_GNB_DU_UE_F1AP_ID)
			{
				gnb_du_ue_f1ap_id = General.ToUint(data, p +1, msgHeader.Length -1, Endian.Big);
				duF1ApIdAvailable = true;
			}									
			
			p += msgHeader.Length;
			
			if((nbrOfProtocolIEs - nbrOfIEs) > 2) 
			  break;
			
			if(duF1ApIdAvailable)
				break;
		}
		
		return cuF1ApIdAvailable;
	}	
	
	public bool IsCuF1ApIdAvailable()
	{
		return this.cuF1ApIdAvailable;
	}
	
	public bool IsDuF1ApIdAvailable()
	{
		return this.duF1ApIdAvailable;
	}
	
	public F1apMessageClass()
	{
	}
}

