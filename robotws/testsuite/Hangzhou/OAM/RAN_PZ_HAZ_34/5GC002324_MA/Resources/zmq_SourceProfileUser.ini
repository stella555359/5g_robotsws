[C-Syntax]
WhenLoadingStarted
{
  if(GlobalVariable(OutPath).IsNullOrEmpty())
  {
    MessageBox.Show("Please give an OutPath as -Variable OutPath \"C:\\\\Temp\\\\FoundMessages.txt\"");
    EmilExit(1);
  }
}

[C-Syntax]
Message:SctpMessage
{
  var found = Message(Name).StartsWith("0x") != false;
  var message = Message() as MessageFor5G;
  if(message == null) return;
  String component = message.Component;  //Component as C# String
  var mapping = message.Mapping; //Mapping as C# String
  var data = message.Data;


  if(mapping == "x2apPort")
  {
    if(data.Length > 16 && data[16] == 0x01)
    {
      Column(ZMQ/SCTP name).Text = "X2AP: Initial setup"; 
    }
    else 
    {
        var asn1 = DecodeAsn(16, data.Length - 16, "X2AP-PDU", AsnCoder.X2AP, data);
        if((asn1.StartsWith("WARNING") && asn1.Contains("Analyzer decoding:")) == false)
        {
          var name = GetAsn1Text(asn1, "value");
          Column(ZMQ/SCTP name).Text = "X2AP: " + name;
        }
        else
        {
          var name = GetNameFromAnalyzer("X2AP-PDU", asn1);
          Column(ZMQ/SCTP name).Text = "X2AP: " + name + " (Decoding failed)";
        }
    }
  }
  else if(mapping == "xnapPort")
  {
    if(data.Length > 16 && data[16] == 0x01)
    {
      Column(ZMQ/SCTP name).Text = "XnAP: Initial setup"; 
    }
    else 
    {
        var asn1 = DecodeAsn(16, data.Length - 16, "XNAP-PDU", AsnCoder.XnAP, data);
        if((asn1.StartsWith("WARNING") && asn1.Contains("Analyzer decoding:")) == false)
        {
          var name = GetAsn1Text(asn1, "value");
          Column(ZMQ/SCTP name).Text = "XnAP: " + name;
        }
        else
        {
          var name = GetNameFromAnalyzer("XNAP-PDU", asn1);
          Column(ZMQ/SCTP name).Text = "XnAP: " + name + " (Decoding failed)";
        }
    }
  }
  else if(mapping == "f1apPort")
  {
    if(data.Length > 16 && data[16] == 0x01)
    {
      Column(ZMQ/SCTP name).Text = "F1AP: Initial setup"; 
    }
    else 
    {      
      int p = message.DataHeaderSize;
      var f1apMessage = new F1apMessageClass();
		  f1apMessage.Decode(data, ref p);
      if((int) f1apMessage.procedureCode == 26 && data.Length == 35) //F1apProcedureCode.id_UEReconfigurationCompleteIndication)
      {
        Column(ZMQ/SCTP name).Text = "F1AP: " + FixMessageName(f1apMessage.procedureCode.ToString());
      }
      else
      {
        String asn1 = DecodeAsn(16, data.Length - 16, "F1AP-PDU", AsnCoder.F1AP, data);
        if((asn1.StartsWith("WARNING") && asn1.Contains("Analyzer decoding:")) == false)
        {
          var name = GetAsn1Text(asn1, "value");
          Column(ZMQ/SCTP name).Text = "F1AP: " + name;
        }
        else 
        {
          var name = GetNameFromAnalyzer("F1AP-PDU", asn1);
          Column(ZMQ/SCTP name).Text = "F1AP: " + name + " (Decoding failed)";
        }
      }
    }
  }
  else if(mapping == "ngapPort")
  {
    if(data.Length > 16 && data[16] == 0x01)
    {
      Column(ZMQ/SCTP name).Text = "NGAP: Initial setup"; 
    }
    else 
    {
        var asn1 = DecodeAsn(16, data.Length - 16, "NGAP-PDU", AsnCoder.NGAP, data);
        if((asn1.StartsWith("WARNING") && asn1.Contains("Analyzer decoding:")) == false)
        {
          var name = GetAsn1Text(asn1, "value");
          Column(ZMQ/SCTP name).Text = "NGAP: " + name;
        }
        else 
        {
          var name = GetNameFromAnalyzer("NGAP-PDU", asn1);
          Column(ZMQ/SCTP name).Text = "NGAP: " + name + " (Decoding failed)";
        }
    }
  }
  else if(mapping == "e1apPort")
  {
    if(data.Length > 16 && data[16] == 0x01)
    {
      Column(ZMQ/SCTP name).Text = "E1AP: Initial setup"; 
    }
    else 
    {
        var asn1 = DecodeAsn(16, data.Length - 16, "E1AP-PDU", AsnCoder.E1AP, data);
        if((asn1.StartsWith("WARNING") && asn1.Contains("Analyzer decoding:")) == false)
        {
          var name = GetAsn1Text(asn1, "value");
          Column(ZMQ/SCTP name).Text = "E1AP: " + name;
        }
        else 
        {
          var name = GetNameFromAnalyzer("E1AP-PDU", asn1);
          Column(ZMQ/SCTP name).Text = "E1AP: " + name + " (Decoding failed)";
        }
    }
  }
  
  //String msg;
  if(found == false)
  {
    lock(MessagesNum)
    {
	  //msg =  Message(Number).ToString()+ ' ' + Message(Name);

      if(!MessagesNum.Contains(Message(Number).ToString()+ ' ' + Message(Name)))
        MessagesNum.Add(Message(Number).ToString()+ ' ' + Message(Name)+ ' ' + mapping + ' ' + component + ' ' + Column(ZMQ/SCTP name).Text + ' ' + Message(Data).ToHexStringNicely());
		//MessagesNum.Add(Message(Data).ToString());
    }
  }
}


[C-Syntax]
WhenLoadingFinished
{
  try
  {
    lock(MessagesNum)
    {
      using (var f = File.CreateText(GlobalVariable(OutPath)))
      {
        foreach(var message in MessagesNum)
          f.WriteLine(message);
      }
    }
  }
  catch(Exception e)
  {
    MessageBox.Show(@"Could not save to OutPath, error:\n" + e.ToStringWithLineNumbers());
  }
}

