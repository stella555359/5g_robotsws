public class NetworkClass
{
	//public String mnc; 
	//public String mcc; //This cannot be int, as then we do not know the difference between 05 and 005	

	public int mccInt;
    public int mncInt; //This cannot be int, as then we do not know the difference between 05 and 005	 
    public int mncLength;

    public int Plmn
    {
        get
        {
            return PlmnDatabase.CodesToPlmn(mccInt, mncInt);
        }
    }


	public NetworkClass()
	{
		
	}	
	
	public NetworkClass(byte[] data, int offset)
	{
        mccInt = (data[offset] & 0xF) * 100 + (data[offset] >> 0x4) * 10 + (data[offset + 1] & 0xF); 
        //mcc = (data[offset] & 0xF).ToString() + (data[offset] >> 0x4).ToString() + (data[offset + 1] & 0xF).ToString();
        if((data[offset + 1] >> 0x4) == 0 || (data[offset + 1] >> 0x4) == 0xF)
        {
            //2 digit
            mncLength = 2;
            mncInt = (data[offset + 2] & 0xF) * 10 + (data[offset + 2] >> 0x4);
            //mnc = (data[offset + 2] & 0xF).ToString() + (data[offset + 2] >> 0x4).ToString();
        } else {
            //3 digit
            mncLength = 3;
            mncInt = (data[offset + 1] >> 0x4) * 100 + (data[offset + 2] & 0xF) * 10 + (data[offset + 2] >> 0x4);
            //mnc = (data[offset + 1] >> 0x4).ToString() + (data[offset + 2] & 0xF).ToString() + (data[offset + 2] >> 0x4).ToString();
        }
	}

	public override String ToString()
	{
      return PlmnDatabase.ToPlmnString(Plmn, true);
		/*String str = "";
		str += " Mobile Contry Code: " + mccInt + "\n";
		str += " Mobile Network Code: " + mncInt + "\n";         
		return str;            */
	}
}

public static ushort GetAsn1Length(byte[] data, ref int index, bool canBe16k = false)
{
  var byte1 = data[index++];
  if((byte1 & 0xA0) == 0xA0) 
  {
    DebugBreakPoint;
    
    if(canBe16k)
    {      
      return (ushort) (((byte1 & 0x3F) << 8) | data[index++]);
    }
    else  
    	throw new NotImplementedException("ASN.1 lengths above 16k not supported");        
  }
  if((byte1 & 0x80) == 0x80)
  {
    //128 -> 16k
    return (ushort)(((byte1 & 0x3F) << 8) | data[index++]);
  }
  else 
  {
    //<128
    return byte1;
  }
}

private String FixMessageName(String messageName)
{
  return messageName.Replace("id_", "");
}
 
