# Configuration file for system-statistics service

# Controls which statistics are reported

[journal stat]
type=journal
timeout_us=2000000
em_meas_window_ms=1980
measurements=cpu_load,em_load
level=info

[overload_detection_nrt]
type=ovl_det_nrt
overload_threshold=95
normal_threshold=85
meas_window_ms=2000
detection_period=2
detection_method=maximum

[overload_detection_rt]
type=ovl_det_rt
overload_threshold=90
normal_threshold=80
meas_window_ms=1980
detection_period=10
detection_method=average
