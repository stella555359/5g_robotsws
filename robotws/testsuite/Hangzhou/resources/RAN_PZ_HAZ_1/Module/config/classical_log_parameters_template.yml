## Description: this file is for Classical BTS log module.
## It makes it easier for users to use the log module by reducing the number of user input parameters.

log_params:
  tti_5G:
    gnb_custom_profile: [ "L2Ps_Component" ]

  tti_4G:
    enb_custom_profile: [ "condor4gTti" ]

  tti_4G_5G:
    enb_custom_profile: [ "condor4gTti" ]
    gnb_custom_profile: [ "L2Ps_Component" ]

  emil:
    gnb:
      gnb_custom_profile: [ "cp_5g" ]
    enb:
      enb_custom_profile: [ "cp_4g" ]

  tti:
    gnb_custom_profile: [ "L2Ps_Component" ]

  bip:
    gnb_custom_profile: [ "bip_interface_mirroring" ] 
