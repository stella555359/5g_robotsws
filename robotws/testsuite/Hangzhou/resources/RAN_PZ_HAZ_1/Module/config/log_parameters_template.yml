## Description: this file is for CloudRAN log module.
## It makes it easier for users to use the log module by reducing the number of user input parameters.

log_params:
  bip:
    pod_name: "l2rt"
    container_name: "l2rt"
    port_name: "l1up"

  wireshark_cp:
    vdu:
      pod_name: "cprt"
      container_name: "nwmgmt"
      protocol: "sctp"
      interface: "any"
    vcu:
      pod_name: "cpif"
      container_name: "nwmgmt"
      protocol: "sctp"
      interface: "any"

  wireshark_oam:
    vdu:
      pod_name: "oamext"
      container_name: "nwmgmt"
      protocol: ""
      interface: "any"
    vcu:
      pod_name: "oamext"
      container_name: "nwmgmt"
      protocol: ""
      interface: "any"

  tti:
    vdu_custom_profile: [ "L2Ps_Component" ]

  event_based_L1_IQ:
    vdu_custom_profile: [ "eventBasedTracerVdu" ]

  L1_IQ:
    vdu_custom_profile: [ "l1IqVdu" ]

  tss: # troubleshooting scripts log
    vdu_custom_profile: [ "tssVdu" ]

  container_log:
    log_type_input: "startup"

  emil:
    vdu:
      vdu_custom_profile: [ "controlPlane5gVdu" ]
    vcu:
      vcu_custom_profile: [ "controlPlane5gVcu" ]

  cell_trace:
    vdu:
      vdu_custom_profile: [ "tracerVdu" ]
    vcu:
      vcu_custom_profile: [ "tracerVcu" ]