version: "2.1"
services:
  condor-worker-1:
    container_name: condor-worker-1
    image: dcap-lite-docker-local.artifactory-espoo2.int.net.nokia.com/condor:latest 
    entrypoint: /usr/bin/mono /opt/nokia/emil/run_emil --noscreen --name "dcap_user_172.21.0.21"
      --dcap "172.21.0.11+none" --5g --externalflowtracer --sackpath /opt/nokia/emil/Sacks/5G21A_11.800.1562
      --l2trace --kpimon --timeout 0 --profilepath /opt/nokia/emil/profiles/5G
    healthcheck:
      interval: 3m
      test: 'curl -H "Authorization: ''Bearer BIG_PASSWORD_HERE''" --fail --max-time
        5 http://172.21.0.11:10009/dataCollections/heartbeat/heartbeat-heartbeat-heartbeat
        || kill 1'
    networks:
      condornet:
        ipv4_address: 172.21.0.11
        ipv6_address: fd00:dcab:117e::c51:78a:ce
    restart: unless-stopped
    volumes:
    - /sharedvolume/condor:/home/emil/.local/share/Emil:rw
    - sack-volume:/stage/sackservice:ro

networks:
  condornet:
    name: condornet
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-condornet
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
        - subnet: fd00:dcab:117e::/64
          gateway: fd00:dcab:117e::1

volumes:
  sack-volume:
    external: true
    name: sack-volume
