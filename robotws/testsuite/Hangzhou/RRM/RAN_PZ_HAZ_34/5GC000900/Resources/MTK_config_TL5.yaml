UE_POOLS:
    MediaTekUePool:
        inline_config:
            UE_1:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_MEDIATEK_UE
                CLASS: MediaTekUe                          # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    configuration:                        # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.57.152.208'           # UE PC IP address
                        pyro_port: '8080'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'CNHZ5GRAN1231+tester'                     # SSH login to UE PC
                        password: 'tester123'              # SSH password to UE PC
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        edb_file_path: 'D:/MTK/sw/MT6297_EVB(NLWCTG_SAP)_bin.tar/MDDB_MT6297_S00_VMOLY_APOLLO_SQC_W19_33_P8.EDB'  # edb file for ELT tool
                        deployment_mode: 'sa'                   # sa or nsa mode
                        imei: '1234512345123478'                # log_filter: '2.Gen97_Default_Standard'
                        log_filter: 'C:/catcher_filter.bin'     # Target Filter file for ELT tool
                        data_transfer:                    # Application Server (for Iperf) details
                            apn:
                                url: 'wap1.nokia.com'           # dnn url
                                url: 'wap2.nokia.com'           # dnn url
                                user: ''                        # dnn username
                                password: ''                    # dnn password
                            app_server:
                                addr: '10.110.149.24'    # Application Server IP
                                username: 'srn'         # Application Server SSH login
                                password: 'Nokia@123'   # Application Server SSH password
                                iperf_port: '51001'           # Application Server traffic port
                                iperf_path: 'iperf'     # Application Server iperf location
                                iperf_interface_ip: '10.110.149.24'   # Application Server interface used to bind IP (-B iperf parameter)
                            ue_host:
                                addr: '10.57.152.208'   # UE PC IP
                                username: 'CNHZ5GRAN1231+tester'     # UE PC SSH login
                                password: 'tester123'   # UE PC SSH password
                                iperf_port: '51002'           # UE PC traffic port
                                iperf_path: 'D:/MTK/iperf-2.0.9-win64/iperf'     # iperf location on UE PC - please use Unix like separators
                            iperf_interval: '1'                 # Iperf interval in seconds (default: 1)
                            iperf_options:
                                packet: '1024B'
                                buffer: '1M'
                            throughput_checkpointer:
                                host: '192.168.253.20'          # ABIL board IP
                                user: 'toor4nsn'                # ABIL board SSH login
                                password: 'oZPS0POrRieRtu'     # ABIL board SSH password
                                proxy:
                                    host: '10.57.226.194'         # ASIK board IP
                                    user: 'toor4nsn'              # ASIK board SSH login
                                    password: 'oZPS0POrRieRtu'    # ASIK board SSH password
