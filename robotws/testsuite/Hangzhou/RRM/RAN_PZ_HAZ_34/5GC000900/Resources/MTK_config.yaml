UE_POOLS:
    MediaTekUePool:
        inline_config:
            UE_1:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_MEDIATEK_UE
                CLASS: MediaTekUe                          # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'YT910PU0VR'           # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                        # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.57.152.205'           # UE PC IP address
                        pyro_port: '8080'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'CNHZ5GRAN1213+tester'                     # SSH login to UE PC
                        password: 'tester123'              # SSH password to UE PC
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        serial_com: '8'
                        edb_file_path: 'D:/MTK-UE/MTK-UE/sw/le/MT6297_EVB(NLWCTG_SAP)_bin.tar/MDDB_MT6297_S00_VMOLY_APOLLO_SQC_W19_33_P8.EDB'
                        deployment_mode: 'sa'             # sa or nsa
                        interface_name: 'Cellular'       # mbn interface for data transfer
                        imei: '123451234512345'
                        log_filter: 'C:/catcher_filter.bin'
                        data_transfer:                    # Application Server (for Iperf) details
                            iperf_path: 'C:/iperf/' # iperf.exe location on UE PC - please use Unix like separators
                            iperf_interface_ip: '10.57.170.50'   # Application Server interface used to bind IP (-B iperf parameter)
                            iperf_interval: '5'                 # Iperf interval in seconds (default: 1)
                            app_server:
                                    host: '10.57.170.50' # Application Server IP
                                    port: '54321'
                                    user: 'ute'     # Application Server SSH login
                                    password: 'ute' # Application Server SSH password
                            iperf_options:
                                packet: '1024B'
                                buffer: '1M'
                            throughput_checkpointer:
                                host: '192.168.253.20'
                                user: 'toor4nsn'
                                password: 'oZPS0POrRieRtu'
                                proxy:
                                  host: '10.42.144.152'
                                  user: 'toor4nsn'
                                  password: 'oZPS0POrRieRtu'
