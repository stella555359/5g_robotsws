[Globals]
static void WaitToStopMonitoring()
{
    Thread.CurrentThread.IsBackground = true
    InfoBox.Show("Info", "SCRIPT WaitToStopMonitoring start")
    Thread.Sleep(1000 * 10)
    // Wait for 600 sec(10 min)
    eNB.DisconnectAll()
    // Then, stop all tcp streams, WhenLoadingFinished will automatically be called after all connection are closed.
    Thread.Sleep(1000 * 10)
    // Wait for 10 sec to let Emil finish any ongoing task
    // EmilExit(0)
    // Closes Emil with error code 0
    InfoBox.Show("Info", "SCRIPT WaitToStopMonitoring end")
}

[C - Syntax]
WhenOpening
