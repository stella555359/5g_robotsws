    if (Column(Trace id).Amount > 0)
    {
        decMsgFile.Write("TraceId: " + Column(Trace id).Value + " - Time: " + Message(TargetTime).ToString("yyyy/MM/dd HH:mm:ss.ffffff UTC+0000") + "\n")
        if(Column(CRNTI).Amount > 0)
        {
            decMsgFile.Write("CRNTI: " + Column(CRNTI).Value + "\n")
        }
        if(Column(UE ID).Amount > 0)
        {
            decMsgFile.Write("FsUeId: " + Column(UE ID).Value + "\n")
        }
        decMsgFile.Write(DecodeAscii())
        decMsgFile.Write("\n\n")
    }
