[C - Syntax]
WhenLoadingStarted
{
    decMsgFile = File.CreateText( @ "D:\traces\Emil\Fields2UserAllMessages" + DateTime.Now.ToString("_yyyy_MM_dd_HH_mm_ss") + ".txt")
    decMsgFile.Write("START OF DECODING\n")
}

[C - Syntax]
WhenLoadingFinished
{
    InfoBox.Show("Info", "SCRIPT WhenLoadingFinished start")
  // SaveGridAsCsvFile( @ "C:\Temp\Test\file1.csv")
    decMsgFile.Write("\nEND OF DECODING")
    decMsgFile.Close()
    InfoBox.Show("Info", "SCRIPT WhenLoadingFinished end")
}

