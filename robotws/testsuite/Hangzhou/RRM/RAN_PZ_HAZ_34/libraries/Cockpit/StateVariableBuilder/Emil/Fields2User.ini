[C - Syntax]
Message: *
{
    // StreamWriter sw = File.CreateText(@ "C:\temp\Fields2UserAllMessage.txt")
    // output = DecodeAsn(IndexOf(payload.rrcMsgData.values), (int)payload.rrcMsgData.length / *payload.rrcMsgData.padding * /, "UL-xCCCH-Message", AsnCoder.RRC5G, input, true)
