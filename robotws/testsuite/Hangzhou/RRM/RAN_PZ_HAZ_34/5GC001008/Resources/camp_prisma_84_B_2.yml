lsu_uu:
    type: ue.prisma.lsu
    executor: tl.ues[0].lsu_uu_ssh_connection_details
    script_paths:
        start_lsu: lsustop;lsuclean;lsustart -R
        clean_lsu: lsuclean
        stop_lsu: lsustop
        #create_5g_cell: /home/user/bin/sdrcfg_5gnrcell_sep_sa
        create_5g_cell: /home/user/bin/sdrcfg_5gnrcell_sep_sa_coam_liuqian

#        create_4g_cell: /home/user/bin/
#        get_4g_cell_id: trcinfo -p 0-11 | grep -i cellid |tail -1 |awk '{print $12}'|cut -d'=' -f2
        get_5g_cell_id: trcinfo -p 0-2 | grep -i cell_id |tail -1 |awk '{print $11}'|cut -d'=' -f2
        get_ra_status: trcinfo -p 0-5|grep -i success|awk '{print $10}'


lsu_tstmuu:
    type: ue.prisma.tstm
    executor: tl.ues[0].tstm_uu_ssh_connection_details
    script_paths:
        start_tstm: cd /home/user/bin/; nohup ./startUu> nohup_uu.out 2>&1 &
        get_tstm_log: cd /home/user/bin/; tail -n 1000 -f ./nohup_uu.out
        clean_tstm_log: cd /home/user/bin/; cat /dev/null > ./nohup_uu.out
        stop_tstm: echo `pidin|grep tm|grep -v 'grep'|awk '{print $1}'`|xargs -I {} kill -9 {}
#        stop_tstm: lsusuid slay `pidin|grep tm|grep -v 'grep'|awk '{print $1}'`

airmosaic:
    type: ue.prisma.airmosaic
    executor: tl.ues[0].airmosaic_ssh_connection_details
    harness: tl.ues[0].airmosaic_harness_connection_details
    cli_path: "/cygdrive/c/Program Files (x86)/AirMosaic LTE Uu/airmosaic_lteuu/bin/airmosaic_lteuu64.exe"
    cygwin_path: C:/cygwin64
    preferences_file_path:
    duration:
    suddenshutdown:
    bugreport_folder: /tmp/log
    script_folder: 'C:\Prisma\sa_5.7'
    script_paths:
        start_mosaic: ^cd "/cygdrive/c/Program Files (x86)/AirMosaic LTE Uu/airmosaic_lteuu/bin"; ./airmosaic_lteuu64.exe --nogui --nosplash -J-Dcli.mode=true --enable-harness
        close_mosaic: ps -ef | grep airmosaic|awk '{print $2}'|xargs kill -s 9
    scenario_paths:
        attach: sa_attach1008-B_for_case2.sce
        detach:
        start_traffic:
        stop_traffic:
    parameters:
        enable_amm: true
        clock_timer: 900
        counters:
        log_counters_to_file:
        global_vars:

prisma:
   type: ue.prisma
   components:
     - lsu_uu
     - lsu_tstmuu
     - airmosaic
