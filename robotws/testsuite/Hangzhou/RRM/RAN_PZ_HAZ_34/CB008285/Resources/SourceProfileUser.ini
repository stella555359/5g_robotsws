[Columns]
VariableName:OutPath, ValueType:Text, Global

[Globals]
StreamWriter sw;

[C-Syntax]
WhenLoadingStarted
{
  sw = new StreamWriter(GlobalVariable(OutPath));
}

[C-Syntax]
WhenLoadingFinished
{
  sw.Close();
  sw.Dispose();
}

[C-Syntax]
Message:*
{
  lock(sw)
  {
    var ascii = DecodeAscii();
    sw.WriteLine(ascii);
    sw.WriteLine();

  }
}
