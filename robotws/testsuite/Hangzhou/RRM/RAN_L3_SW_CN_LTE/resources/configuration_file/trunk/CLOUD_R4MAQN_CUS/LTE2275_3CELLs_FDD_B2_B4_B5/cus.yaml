EPC:
  WS:
    -
      ip_addr: 192.168.200.126/24
      edaemon_port: 10000
      WTS_path: /opt/iphy/latest
      lte_network_gw: 10.0.2.1
  PGW:
    -
      id: 1
      type: simulated
      apn: pgw1.net
    -
      id: 2
      type: simulated
      apn: emergency.nsn.com
      emergency: on
  SGW:
    -
      type: simulated
      s1u: "10.0.1.1:2152"
      s11: "10.0.1.1:2153"
  MME_POOL_AREA:
    - {id: 1, plmn: '244:08','666:14','555:12', mmegi: 1, tac_list: '123'}
  MME:
    -
      id: 1
      type: simulated
      pool: ['1:3']
      s1: 10.0.1.1
      supported_rat: "lte"

BASE_STATIONS:
  - id:           1
    type:         external
    plmn:         '244:08'
    s1:           10.0.1.2
    cus_config:
      - { id: 1, lmp_ip: 192.168.200.1, trsw_ip: 10.0.2.2, sync_source: 'BackplanePPS',
        mirroring_l2_on_startup: 2, mirroring_sch_on_startup: 2 }
    RRH:
      - { id: 1, name: AHFIB, link_type: CPRI, opt_links: [ { physical_id: 1.1, virtual_id: 1, link_speed: 9.8 } ], #1st card
        antennas:
          { 0: { cell: 1, dir: TXRX },  1: { cell: 1, dir: TXRX } } }
      - { id: 2, name: AHFIB, link_type: CPRI, opt_links: [ { physical_id: 1.2, virtual_id: 1, link_speed: 9.8 } ], #1st card
        antennas:
          { 0: { cell: 2, dir: TXRX },  1: { cell: 2, dir: TXRX } } }
      - { id: 3, name: AHBCB, link_type: CPRI, opt_links: [ { physical_id: 1.3, virtual_id: 1, link_speed: 9.8 } ], #1st card
        antennas:
          { 0: { cell: 3, dir: TXRX },  1: { cell: 3, dir: TXRX } } }

    cells:
      - { id: 1-3, technology: lte, tac: 123, duplex_mode: FDD } #1st card

