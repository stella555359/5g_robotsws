    plmn:         '244:09'
    s1:           10.0.1.2
    cus_config:
      - { id: 1, lmp_ip: 192.168.200.1, trsw_ip: 10.0.2.2, cells: [11,12,13]}
    RRH:
      - { id: 1, name: AREA, link_type: CPRI, opt_links: [ { physical_id: 3.1, virtual_id: 1, link_speed: 9.8 } ],
         antennas:
            { 0: { cell: 11, dir: TXRX },  1: { cell: 11, dir: TXRX },  2: { cell: 12, dir: TXRX },  3: { cell: 12, dir: TXRX } } }

      - { id: 2, name: AHHB, link_type: CPRI, opt_links: [ { physical_id: 3.2, virtual_id: 1, link_speed: 9.8 } ],
          antennas:
            { 0: { cell: 13, dir: TXRX },  1: { cell: 13, dir: TXRX } } }

    cells:
      - { id: 11, technology: lte, tac: 124, pci: '3:2' }
      - { id: 12, technology: lte, tac: 124, pci: '4:0' }
      - { id: 13, technology: lte, tac: 124, pci: '4:1' }
