EPC:
  WS:
    -
      ip_addr: 192.168.200.126/24
      edaemon_port: 10000
      WTS_path: /opt/iphy/latest
      lte_network_gw: 10.0.2.1
  PGW:
    -
      id: 1
      type: simulated
      apn: pgw1.net
  SGW:
    -
      type: simulated
      s1u: "10.0.1.1:2152"
      s11: "10.0.1.1:2153"
  MME_POOL_AREA:
    - {id: 1, plmn: '244:09', mmegi: 1, tac_list: '124'}
  MME:
    -
      id: 1
      type: simulated
      pool: ['1:3']
      s1: 10.0.1.1
      supported_rat: "lte"

BASE_STATIONS:
  - id:           1
    type:         external
    plmn:         '244:09'
    s1:           10.0.1.2
    cus_config:
      - { id: 1, lmp_ip: 192.168.200.1, trsw_ip: 10.0.2.2, sync_source: 'BackplanePPS',
        mirroring_l2_on_startup: 2, mirroring_sch_on_startup: 2 }
    RRH:
      - { id: 1, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 3.1, virtual_id: 1, link_speed: 9.8 } ], #3-rd card
        antennas:
          { 0: { cell: 11, dir: TXRX },  1: { cell: 11, dir: TXRX } } }
      - { id: 2, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 3.2, virtual_id: 1, link_speed: 9.8 } ], #3-rd card
        antennas:
          { 0: { cell: 12, dir: TXRX },  1: { cell: 12, dir: TXRX } } }
      - { id: 3, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 3.3, virtual_id: 1, link_speed: 9.8 } ], #3-rd card
        antennas:
          { 0: { cell: 13, dir: TXRX },  1: { cell: 13, dir: TXRX } } }

    cells:
      - { id: 11-13, technology: lte, tac: 124, duplex_mode: FDD } #3-rd card

  - id: 4
    type: simulated
    plmn: '244:09'
    s1: 10.0.1.21
    s1u: 10.0.1.21
    x2: 10.0.1.21
    x2_peers: none
    cells:
        - { id: 1, technology: lte, tac: 124, pci: '0:1', earfcn: '800:18800', bw: 10}
        - { id: 2, technology: lte, tac: 124, pci: '0:2', earfcn: '900:18900', bw: 10}
    bts_param :
        mlbSupportedRelease : r9
        mlb_feature_flag    : on

UEs:
  bearer_sets:
    bearer_set_1:
      - { id: 1, default: on, qci: 8 }
      - { id: 2, qci: 1, gbr_ul: 31, gbr_dl: 31, mbr_ul: 31, mbr_dl: 31 }
      - { id: 9, pdn: 1, default: off, qci: 9 }
  UE_sets:
    - { ids: 1, bearer: bearer_set_1, rohc: '16', mcc: '244', mnc: '09', eia: 'null', eea: 'null'}
