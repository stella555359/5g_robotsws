EPC:
  WS:
    -
      ip_addr: 192.168.200.126/24
      edaemon_port: 10000
      WTS_path: /opt/iphy/latest
      lte_network_gw: 10.0.2.1
  PGW:
    -
      id: 1
      type: simulated
      apn: pgw1.net
  SGW:
    -
      type: simulated
  MME_POOL_AREA:
    - {id: 1, plmn: '244:09', mmegi: 1, tac_list: '124'}
  MME:
    -
      type: simulated
      pool: ['1:3']
      s1: 10.0.1.1
      supported_rat: "lte"

BASE_STATIONS:
  - id:           1
    type:         external
    plmn:         '244:09'
    s1:           10.0.1.2
    cus_config:
      - { id: 1, lmp_ip: 192.168.200.1, trsw_ip: 10.0.2.2, cells: [11,12,13]}
    RRH:
      - { id: 1, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 1.1, virtual_id: 1, link_speed: 9.8 } ],
         antennas:
            { 0: { cell: 11, dir: TXRX },  1: { cell: 11, dir: TXRX } } }

      - { id: 2, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 2.1, virtual_id: 1, link_speed: 9.8 } ],
          antennas:
            { 0: { cell: 12, dir: TXRX },  1: { cell: 12, dir: TXRX } } }

      - { id: 3, name: AHIB, link_type: CPRI, opt_links: [ { physical_id: 3.1, virtual_id: 1, link_speed: 9.8 } ],
          antennas:
            { 0: { cell: 13, dir: TXRX },  1: { cell: 13, dir: TXRX } } }

    cells:
      - { id: 11, technology: lte, tac: 124, pci: '3:2' }
      - { id: 12, technology: lte, tac: 124, pci: '4:0' }
      - { id: 13, technology: lte, tac: 124, pci: '4:1' }

UEs:
  bearer_sets:
    bearer_set_1:
      - { id: 1, qci: 1, gbr_ul: 31, gbr_dl: 31, mbr_ul: 31, mbr_dl: 31 }
      - { id: 2, qci: 2, gbr_ul: 31, gbr_dl: 31, mbr_ul: 31, mbr_dl: 31 }
      - { id: 3, qci: 3, gbr_ul: 31, gbr_dl: 31, mbr_ul: 31, mbr_dl: 31 }
      - { id: 4, qci: 4, gbr_ul: 31, gbr_dl: 31, mbr_ul: 31, mbr_dl: 31 }
      - { id: 6, qci: 6 }
      - { id: 7, qci: 7 }
      - { id: 8, qci: 8 }
      - { id: 9, qci: 9, default: on }
      - { id: 10, qci: 70 }
      - { id: 11, qci: 69 }
  UE_sets:
    - { ids: 1, bearer: bearer_set_1, mcc: '244', mnc: '09', eia: 'null', eea: 'null', release: 13, category: 12, capability: 'release=13 category=12 fgi=2,3,5-11,13-25,27,28,30,31 category_dl=19 category_ul=15 supported_bands=2,64 extended_supported_bands=64:66 ca_supported_bands=2:a:a|2:a:a+2::a|2:a:a+64::a' }
LOGS:
