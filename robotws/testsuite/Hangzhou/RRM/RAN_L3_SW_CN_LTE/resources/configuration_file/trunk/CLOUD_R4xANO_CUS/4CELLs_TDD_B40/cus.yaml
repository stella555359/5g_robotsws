EPC:
  WS:
    - ip_addr: 192.168.200.126/24
      edaemon_port: 10000
      WTS_path: /opt/iphy/latest
      lte_network_gw: 10.0.2.1
  PGW:
    - id: 1
      type: simulated
      apn: nokia_1.net
    - id: 2
      type: simulated
      apn: nokia_2.net
  SGW:
    - type: simulated
  MME_POOL_AREA:
    - {id: 1, plmn: '262:03', mmegi: 1, tac_list: 33}
  MME:
    - type: simulated
      pool: ['1:1']
      s1: 10.0.1.1
BASE_STATIONS:
  - id: 1
    type: external
    plmn: '262:03'
    s1: 10.0.1.2
    cus_config:
      - {id: 1, lmp_ip: 192.168.200.1, trsw_ip: 10.0.2.2, sync_source: BackplanePPS}
    RRH:
      - {id: 1, name: AZNA, link_type: CPRI, opt_links: [{physical_id: 1.1, virtual_id: 1, link_speed: 9.8}],
          antennas: {0: {cell: 1, dir: TXRX}, 1: {cell: 1, dir: TXRX}, 2: {cell: 1, dir: TXRX}, 3: {cell: 1, dir: TXRX}}}
      - {id: 2, name: AZNA, link_type: CPRI, opt_links: [{physical_id: 1.2, virtual_id: 1, link_speed: 9.8}],
          antennas: {0: {cell: 2, dir: TXRX}, 1: {cell: 2, dir: TXRX}, 2: {cell: 2, dir: TXRX}, 3: {cell: 2, dir: TXRX}}}
      - {id: 3, name: AZNA, link_type: CPRI, opt_links: [{physical_id: 1.3, virtual_id: 1, link_speed: 9.8}],
          antennas: {0: {cell: 3, dir: TXRX}, 1: {cell: 3, dir: TXRX}, 2: {cell: 3, dir: TXRX}, 3: {cell: 3, dir: TXRX}}}
      - {id: 4, name: AZNA, link_type: CPRI, opt_links: [{physical_id: 1.4, virtual_id: 1, link_speed: 9.8}],
          antennas: {0: {cell: 4, dir: TXRX}, 1: {cell: 4, dir: TXRX}, 2: {cell: 4, dir: TXRX}, 3: {cell: 4, dir: TXRX}}}
    cells:
      - {id: 1, technology: lte, tac: 33, pci: '0:1', duplex_mode: TDD}
      - {id: 2, technology: lte, tac: 33, pci: '0:2', duplex_mode: TDD}
      - {id: 3, technology: lte, tac: 33, pci: '1:0', duplex_mode: TDD}
      - {id: 4, technology: lte, tac: 33, pci: '1:1', duplex_mode: TDD}

UEs:
  bearer_sets:
    bearer_set_1:
      - {qci: 8, default: on, pdn: 1, trf_type: external}
      - {qci: 1, gbr_ul: 31, gbr_dl: 31, mbr_ul: 31, mbr_dl: 31, pdn: 1}
      - {qci: 2, gbr_ul: 144, gbr_dl: 144, mbr_ul: 144, mbr_dl: 144, pdn: 1}
      - {qci: 3, gbr_ul: 64, gbr_dl: 128, mbr_ul: 64, mbr_dl: 128, pdn: 1}
      - {qci: 4, gbr_ul: 32, gbr_dl: 330, mbr_ul: 32, mbr_dl: 320, pdn: 1}
      - {qci: 5, pdn: 1}
      - {qci: 6, pdn: 1}
      - {qci: 7, pdn: 1}
      - {qci: 9, pdn: 1}
      - {qci: 8, default: on, pdn: 2, trf_type: external}
      - {qci: 6, pdn: 2}
      - {qci: 7, pdn: 2}
      - {qci: 9, pdn: 2}
  UE_sets:
    - {ids: 1, bearer: bearer_set_1, mcc: 262, mnc: 03, eia: 'null', eea: 'null', category: 4, release: 15}
LOGS:
  EPC:
    log_level: 2
    log_file:
      max_log_size: 104857600
      max_file_num: 3
    TRACE:
      MME: {s1: on, nas: on}
#      ENB-2: {x2: on}

  CUS:
    syslog_ip: 192.168.200.126
    syslog_mode: INFO
