      ip_addr: 192.168.200.126/24
      edaemon_port: 10000
      WTS_path: /opt/iphy/latest
      lte_network_gw: 10.0.2.1
  PGW:
    -
      id: 1
      type: simulated
      apn: pgw1.net
  SGW:
    -
      type: simulated
      s1u: "10.0.1.1:2152"
      s11: "10.0.1.1:2153"
  MME_POOL_AREA:
    - {id: 1, plmn: '311:09', mmegi: 1, tac_list: '124'}
  MME:
    -
      type: simulated
      pool: ['1:3']
      s1: 10.0.1.1
      supported_rat: "lte"

