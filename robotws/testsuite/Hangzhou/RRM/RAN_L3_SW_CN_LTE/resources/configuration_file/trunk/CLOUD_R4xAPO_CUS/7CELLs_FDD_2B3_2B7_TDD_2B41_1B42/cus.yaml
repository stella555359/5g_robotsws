      - { id: 12, technology: lte, tac: 124, pci: '4:0' }
      - { id: 13, technology: lte, tac: 124, pci: '4:1' }
      - { id: 14, technology: lte, tac: 124, pci: '4:2' }
      - { id: 17, technology: lte, tac: 124, pci: '5:2', duplex_mode: TDD }
      - { id: 18, technology: lte, tac: 124, pci: '6:0', duplex_mode: TDD }
      - { id: 19, technology: lte, tac: 124, pci: '6:1', duplex_mode: TDD }
