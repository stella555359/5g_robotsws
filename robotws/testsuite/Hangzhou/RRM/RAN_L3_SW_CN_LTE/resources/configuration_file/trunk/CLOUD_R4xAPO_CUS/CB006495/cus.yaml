      - {id: 2, technology: lte, tac: 123, pci: '0:2', bw: 10}
      - {id: 3, technology: lte, tac: 123, pci: '1:0', bw: 10}
      - {id: 4, technology: lte, tac: 123, pci: '1:1', bw: 10}
      - {id: 5, technology: lte, tac: 123, pci: '1:2', bw: 10}
      - {id: 6, technology: lte, tac: 123, pci: '2:0', bw: 10}
