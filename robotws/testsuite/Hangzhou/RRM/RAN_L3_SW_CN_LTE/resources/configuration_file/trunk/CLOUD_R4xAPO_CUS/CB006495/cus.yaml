      - { id: 1, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 1.1, virtual_id: 1, link_speed: 9.8 } ], antennas: { 0: { cell: 1, dir: TXRX },  1: { cell: 1, dir: TXRX } } }
      - { id: 2, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 1.2, virtual_id: 1, link_speed: 9.8 } ], antennas: { 0: { cell: 2, dir: TXRX },  1: { cell: 2, dir: TXRX } } }
      - { id: 3, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 2.1, virtual_id: 1, link_speed: 9.8 } ], antennas: { 0: { cell: 3, dir: TXRX },  1: { cell: 3, dir: TXRX } } }
      - { id: 4, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 2.2, virtual_id: 1, link_speed: 9.8 } ], antennas: { 0: { cell: 4, dir: TXRX },  1: { cell: 4, dir: TXRX } } }
      - { id: 5, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 3.1, virtual_id: 1, link_speed: 9.8 } ], antennas: { 0: { cell: 5, dir: TXRX },  1: { cell: 5, dir: TXRX } } }
