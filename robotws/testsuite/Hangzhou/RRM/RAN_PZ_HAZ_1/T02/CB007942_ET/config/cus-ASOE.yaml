      - { id: 32, technology: nr, tac: 123, pci: '3:1', nrci: '0x4', nr_arfcn: '2079167:2079167', tdd_cell: on, suggested_band: '257',
          meas_timing_carrier_freq: 2079167, ssb_subcarrier_spacing: kHz120, ssb_mtc_periodicity_and_offset: 'sf10:0', ssb_mtc_duration: 'sf1' }
  - id: 4
    type: simulated
    enb_id: '0x00004'
    plmn: '244:08'
    s1: 10.0.1.41
    x2_peers: none
    cells:
      - { id: 41, technology: lte, tac: 123, pci: '13:1', earfcn: '800:18800', bw: 20,status: 'enabled' }

UEs:
  bearer_sets:
    bearer_set_1: #preprovisioned QCI9
      - { qci: 9, default: on, trf_type: external }
      - { qci: 150, default: off, gbr: 'no', priority: 15, delay: 80 }  #, preprovisioned: on, filter: 5, precedence: 5 }
      - { qci: 200, default: off, gbr: 'no', priority: 15, delay: 80 }  #, preprovisioned: on, filter: 5, precedence: 5 }
    bearer_set_2: #preprovisioned QCI9/150/200
      - { qci: 9, default: on, trf_type: external }
      - { qci: 150, default: off, gbr: 'no', priority: 15, delay: 80,  preprovisioned: on, filter: 5, precedence: 5 }
      - { qci: 200, default: off, gbr: 'no', priority: 15, delay: 80,  preprovisioned: on, filter: 6, precedence: 6 }
    bearer_set_3: #preprovisioned QCI7
      - { qci: 7, default: on, trf_type: external }
      - { qci: 128, default: off, gbr: 'no', priority: 15, delay: 80 }  #, preprovisioned: on, filter: 5, precedence: 5 }
      - { qci: 250, default: off, gbr: 'no', priority: 15, delay: 80 }  #, preprovisioned: on, filter: 5, precedence: 5 }
    bearer_set_4: #preprovisioned QCI8
      - { qci: 8, default: on, trf_type: external }
      - { qci: 98, default: off, gbr: 'no', priority: 15, delay: 80 }  #, preprovisioned: on, filter: 5, precedence: 5 }
      - { qci: 254, default: off, gbr: 'no', priority: 15, delay: 80 }  #, preprovisioned: on, filter: 5, precedence: 5 }
    bearer_set_5: #preprovisioned QCI9
