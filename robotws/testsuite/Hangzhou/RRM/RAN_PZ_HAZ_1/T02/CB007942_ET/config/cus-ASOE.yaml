    plmn: '244:08'
    s1u: 10.0.1.31
    x2: 10.0.1.31
    cells:
      - { id: 31, technology: nr, tac: 123, pci: '3:0', nrci: '0x3', nr_arfcn: '629984:629984', tdd_cell: on, suggested_band: '78', mapped_MFBI: '77',
