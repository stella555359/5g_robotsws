      - { qci: 100, default: off, gbr: 'no', priority: 15, delay: 80 }  #, preprovisioned: on, filter: 5, precedence: 5 }
      - { qci: 140, default: off, gbr: 'no', priority: 15, delay: 80 }  #, preprovisioned: on, filter: 5, precedence: 5 }
      - { qci: 199, default: off, gbr: 'no', priority: 15, delay: 80 }  #, preprovisioned: on, filter: 5, precedence: 5 }
      - { qci: 200, default: off, gbr: 'no', priority: 15, delay: 80 }  #, preprovisioned: on, filter: 5, precedence: 5 }
      - { qci: 210, default: off, gbr: 'no', priority: 15, delay: 80 }  #, preprovisioned: on, filter: 5, precedence: 5 }
