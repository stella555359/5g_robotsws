EPC:
  WS:
    -
      ip_addr: 192.168.200.126/24
      edaemon_port: 10000
      WTS_path: /opt/iphy/latest
      lte_network_gw: 10.0.2.1
  PGW:
    -
      type: simulated
      apn: nokia_1.net
  SGW:
    -
      type: simulated
  MME_POOL_AREA:
    - {id: 1, plmn: '244:08', mmegi: 1, tac_list: 123}
    - {id: 2, plmn: '244:11', mmegi: 2, tac_list: 123}
  MME:
    -
      id: 1
      type: simulated
      pool: ['1:1', '2:2']
      s1: 10.0.1.1

BASE_STATIONS:
  - id:           1
    type:         external
    plmn:         '244:08'
    s1:           10.0.1.2
    cus_config:
      - {id: 1, lmp_ip: 192.168.200.1, trsw_ip: 10.0.2.2, sync_source: 'PPS',
         mirroring_l2_on_startup: 2, mirroring_sch_on_startup: 2}
    RRH:
      - { id: 1, name: AZHA, opt_links: [ { physical_id: 1.1, virtual_id: 1, link_speed: 9.8 } ],
         antennas:
            { 0: { cell: 1, dir: TXRX },  1: { cell: 1, dir: TXRX } } }
      - { id: 2, name: AZHA, opt_links: [ { physical_id: 1.2, virtual_id: 1, link_speed: 9.8 } ],
          antennas:
            { 0: { cell: 2, dir: TXRX },  1: { cell: 2, dir: TXRX } } }
      - { id: 3, name: AHFB, opt_links: [ { physical_id: 3.1, virtual_id: 1, link_speed: 9.8 } ],
          antennas:
            { 0: { cell: 3, dir: TXRX },  1: { cell: 3, dir: TXRX } } }
      - { id: 4, name: AHFB, opt_links: [ { physical_id: 3.2, virtual_id: 1, link_speed: 9.8 } ],
          antennas:
            { 0: { cell: 4, dir: TXRX },  1: { cell: 4, dir: TXRX } } }
      - { id: 5, name: AHFB, opt_links: [ { physical_id: 3.3, virtual_id: 1, link_speed: 9.8 } ],
          antennas:
            { 0: { cell: 5, dir: TXRX },  1: { cell: 5, dir: TXRX } } }
      - { id: 6, name: AHFB, opt_links: [ { physical_id: 3.4, virtual_id: 1, link_speed: 9.8 } ],
          antennas:
            { 0: { cell: 6, dir: TXRX },  1: { cell: 6, dir: TXRX } } }
    cells:
      - {id: 1, technology: lte, tac: 123, duplex_mode: TDD} # ABIA
      - {id: 2, technology: lte, tac: 123, duplex_mode: TDD} # ABIA
      - {id: 3, technology: lte, tac: 123, duplex_mode: FDD} # 2nd card
      - {id: 4, technology: lte, tac: 123, duplex_mode: FDD} # 2nd card
      - {id: 5, technology: lte, tac: 123, duplex_mode: FDD} # 3rd card
      - {id: 6, technology: lte, tac: 123, duplex_mode: FDD} # 3rd card

  - id: 2
    type: simulated
    plmn: '244:08'
    s1u: 10.0.1.21
    x2: 10.0.1.21
    cells:
      - { id: 21, technology: nr, tac: 123, pci: '2:1', nrci: '0x1', nr_arfcn: '629982:629982', tdd_cell: on, suggested_band: '78', mapped_MFBI: '77',
          meas_timing_carrier_freq: 629982, ssb_subcarrier_spacing: kHz30, ssb_mtc_periodicity_and_offset: 'sf10:0', ssb_mtc_duration: 'sf1' }
      - { id: 22, technology: nr, tac: 123, pci: '2:2', nrci: '0x2', nr_arfcn: '2079167:2079167', tdd_cell: on, suggested_band: '257',
