x2u_ip_end=10.110.26.76
x2u_ip_subnet=10.110.26.64/26
x2u_ip_role=
#The twamp vlan interface will be added for x2u interface if x2u_twamp_enable configured as true. Default is false.
x2u_twamp_enable=false
x2u_twamp_ip=10.20.146.84

[VCU_NGC_IP_INFO]
#If mode configured as SA, need config this section.
#IP addresses (ipv4 or ipv6) and roles for ngc interface of vCU cpif pod, using extc as underlying interface.
#Dual stack for xnc/ngc/xnu/ngu are supported which using space as delimiter.
#E.g. ngc_ip_version=ipv4 ipv6 when configure dual stack.
#E.g. ngc_ip_start=10.20.146.57 2a00:8a00:8000:134::e:dc04, It will configure both ipv4 and ipv6 addresses.
#E.g. ngc_ip_start=10.20.146.57, It will configure ipv4 address.
#E.g. ngc_ip_start=2a00:8a00:8000:134::e:dc04, It will configure ipv6 address.
#Multiple roles are supported with space as delimiter. Default is empty means default predefined role in vCU helm chart is used.
