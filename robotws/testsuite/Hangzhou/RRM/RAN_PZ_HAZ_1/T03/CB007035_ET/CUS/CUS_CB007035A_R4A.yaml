EPC:
  WS:
    -
      ip_addr: 192.168.200.126/24
      edaemon_port: 10000
      WTS_path: /opt/iphy/latest
      lte_network_gw: 10.0.2.1
  PGW:
    -
      type: simulated
      apn: nokia_1.net

  SGW:
    -
      type: simulated
  MME_POOL_AREA:
    - {id: 1, plmn: '244:09', mmegi: 1, tac_list: 124}

  MME:
    -
      type: simulated
      pool: ['1:1']
      s1: 10.0.1.1

BASE_STATIONS:
  - id:           1
    type:         external
    plmn:         '244:09'
    s1:           10.0.1.2
    cus_config:
      - {id: 1, lmp_ip: 192.168.200.1, trsw_ip: 10.0.2.2, connector: EIF5, sync_source: 'BackplanePPS',
         mirroring_l2_on_startup: 2, mirroring_sch_on_startup: 2}
    RRH:
      - { id: 1, name: AHFB, opt_links: [ { physical_id: 1.1, virtual_id: 1, link_speed: 9.8 } ],
         antennas:
            { 0: { cell: 1, dir: TXRX },  1: { cell: 1, dir: TXRX } } }
      - { id: 2, name: AHFB, opt_links: [ { physical_id: 1.2, virtual_id: 1, link_speed: 9.8 } ],
         antennas:
            { 0: { cell: 2, dir: TXRX },  1: { cell: 2, dir: TXRX } } }
      - { id: 3, name: AHFB, opt_links: [ { physical_id: 2.3, virtual_id: 1, link_speed: 9.8 } ],
         antennas:
            { 0: { cell: 3, dir: TXRX },  1: { cell: 3, dir: TXRX } } }

    cells:
      - {id: 1, technology: lte, tac: 124, pci: '0:1'}
      - {id: 2, technology: lte, tac: 124, pci: '0:2'}
      - {id: 3, technology: lte, tac: 124, pci: '1:0'}

  - id:           2
    type:         simulated
    plmn:         '244:09'
    s1u:          10.0.1.6
    x2:           10.0.1.6
    cells:
      - {id: 2, technology: nr, tac: 124, pci: '0:2', nrci: '0x2', nr_arfcn: '384000:422000', suggested_band: '1', mapped_MFBI: '65',
         meas_timing_carrier_freq: '422000', ssb_subcarrier_spacing: kHz15, ssb_mtc_periodicity_and_offset: 'sf10:0', ssb_mtc_duration: 'sf1'}

  - id:           10
    type:         simulated
    plmn:         '244:09'
    s1:           10.0.1.21
    cells:
      - {id: 3, technology: lte, tac: 124, pci: '1:0', earfcn: '800:18800', bw: 20}
UEs:
  bearer_sets:
    bearer_set_1:
      - { qci: 1, default: off, gbr_ul: 64, gbr_dl: 64, mbr_ul: 64, mbr_dl: 64 }
      - { qci: 2, default: off, gbr_ul: 64, gbr_dl: 64, mbr_ul: 64, mbr_dl: 64 }
      - { qci: 3, default: off, gbr_ul: 64, gbr_dl: 64, mbr_ul: 64, mbr_dl: 64 }
      - { qci: 4, default: off, gbr_ul: 64, gbr_dl: 64, mbr_ul: 64, mbr_dl: 64 }
      - { qci: 5, default: off }
      - { qci: 6, default: off }
      - { qci: 7, default: off }
      - { qci: 8, default: off }
      - { qci: 9, default: on, trf_type: external }
#      - { qci: 65, default: off, gbr_ul: 31, gbr_dl: 31, mbr_ul: 31, mbr_dl: 31, preprovisioned: off, priority: 15, vulnerability: on, preemption: off }
#      - { qci: 66, default: off, gbr_ul: 31, gbr_dl: 31, mbr_ul: 31, mbr_dl: 31, preprovisioned: off, priority: 15, vulnerability: on, preemption: off }
#      - { qci: 67, default: off, gbr_ul: 31, gbr_dl: 31, mbr_ul: 31, mbr_dl: 31, preprovisioned: off, priority: 15, vulnerability: on, preemption: off }
      - { qci: 65, default: off, gbr_ul: 64, gbr_dl: 64, mbr_ul: 64, mbr_dl: 64 }
      - { qci: 66, default: off, gbr_ul: 64, gbr_dl: 64, mbr_ul: 64, mbr_dl: 64 }
      - { qci: 67, default: off, gbr_ul: 64, gbr_dl: 64, mbr_ul: 64, mbr_dl: 64 }
    bearer_set_2:
      - { qci: 1, gbr_ul: 31, gbr_dl: 31, mbr_ul: 31, mbr_dl: 31, preprovisioned: on, filter: 4, precedence: 4}
      - { qci: 9, default: on, trf_type: external }

  UE_sets:
    - {ids: 1,   bearer: bearer_set_1, mcc: '244', mnc: '09', eia: aes, eea: aes, release: 15, rohc: 16, capability: 'release=15 category=5 supported_bands=2 pdcp_sn_extension=on  ca_supported_bands=2:a:a+2:a:a supported_bands_nr_sa=1,3,5,66,71 eutra_epc_ho_to_nr=on supported_bands_nr=1 sa_nr=common extended_lcid=on feature_sets_ul=0 feature_sets_ul_per_cc=ul_256qam_r15 feature_sets_dl=0 feature_sets_dl_per_cc=4layer_tm3_tm4', capability_mrdc: 'type=mrdc supported_bands_combination=2:a:a+n1:a:a+n3:a:a+n5:a:a+3:a:a&0 fset_comb=eutra|1:1+nr|1:1+nr|1:1+nr|1:1+eutra|1:1', capability_nr: 'type=nr release=15 supported_bands=1,3,5,66,71  supported_bands_combination=2:a:a+n1:a:a+n3:a:a+n5:a:a+3:a:a  pdcp_sn_extension=on  dual_conn=eutra_nr'}
    - {ids: 2,   bearer: bearer_set_2, mcc: '244', mnc: '09', eia: aes, eea: aes, release: 15, rohc: 16, capability: 'release=15 category=5 supported_bands=2 pdcp_sn_extension=on  ca_supported_bands=2:a:a+2:a:a supported_bands_nr_sa=1,3,5,66,71 eutra_epc_ho_to_nr=on supported_bands_nr=1 sa_nr=common extended_lcid=on feature_sets_ul=0 feature_sets_ul_per_cc=ul_256qam_r15 feature_sets_dl=0 feature_sets_dl_per_cc=4layer_tm3_tm4', capability_mrdc: 'type=mrdc supported_bands_combination=2:a:a+n1:a:a+n3:a:a+n5:a:a+3:a:a&0 fset_comb=eutra|1:1+nr|1:1+nr|1:1+nr|1:1+eutra|1:1', capability_nr: 'type=nr release=15 supported_bands=1,3,5,66,71  supported_bands_combination=2:a:a+n1:a:a+n3:a:a+n5:a:a+3:a:a  pdcp_sn_extension=on  dual_conn=eutra_nr'}
