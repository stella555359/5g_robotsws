[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.subcellId = 1
CHECK_POINT: (ulFdSchedData.ulMuStatus = MUPAIRED_TAPERING) &(ulFdSchedData.antPort = 12288)
RATIO: 0.7

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.subcellId = 0
CHECK_POINT: ulFdSchedData.ulMuStatus = MUPAIRED_TAPERING
RATIO: 0.1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.subcellId = 0
CHECK_POINT: ulFdSchedData.antPort = 49152
RATIO: 0.99

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.numOfLayers != -)
CHECK_POINT: ulFdSchedData.numOfLayers = RANK2
RATIO: 0.99

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulHarqRxData.crcResult != -)
CHECK_POINT: (ulHarqRxData.crcResult = OK)
RATIO: 0.99

