[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_136_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_1}) & (ulFdSchedData.ulMuStatus != -)
CHECK_POINT: ulFdSchedData.ulMuStatus = MUNONELIGIBLE_NOSRSBEAM
RATIO: 1

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_2}) & (rnti = ${rnti_3}) & (rnti = ${rnti_4})
CHECK_POINT: (ulFdSchedData.ulMuStatus = MUPAIRED_TAPERING)
RATIO: 0.99

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_2}) & (rnti = ${rnti_3}) & (rnti = ${rnti_4})
CHECK_POINT: ulFdSchedData.virtualUeIndex=0
RATIO: 0.99

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_1}) & (ulFdSchedData.cellBwpId != -)
CHECK_POINT: ulFdSchedData.cellBwpId = 2
RATIO: 1

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.crcResult = OK
RATIO: 1
