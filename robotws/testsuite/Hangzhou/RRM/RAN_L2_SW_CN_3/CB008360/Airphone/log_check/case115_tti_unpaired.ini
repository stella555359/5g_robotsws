[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_unpair_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.ulMuStatus != -)
CHECK_POINT: ulFdSchedData.ulMuStatus = MUNONPAIRED_BADCORR
RATIO: 0.66

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.ulMuStatus != -)
CHECK_POINT: ulFdSchedData.ulMuStatus = MUNONPAIRED_EMPTYDEDICATELIST
RATIO: 0.33


[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulHarqRxData.crcResult != -)
CHECK_POINT: (ulHarqRxData.crcResult = OK)
RATIO: 0.99

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.dtx = NON_DTX
RATIO: 0.999

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.numOfLayers != -)
CHECK_POINT: ulFdSchedData.numOfLayers = RANK1
RATIO: 0.99


[TtiTrace_1 CP_6]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus != -)
CHECK_POINT: ulFdSchedData.subcellId = 0
RATIO: 0.99
