[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulHarqRxData.crcResult != -
CHECK_POINT: (ulHarqRxData.crcResult = NOK) & (ulHarqRxData.dtx = NON_DTX)
RATIO: 0.02

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.txNumber = 2) | (ulFdSchedData.txNumber = 3)| (ulFdSchedData.txNumber = 4)| (ulFdSchedData.txNumber = 5)
CHECK_POINT: ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING
RATIO: 0.2

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.ulMuStatus != -)
CHECK_POINT: ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING
RATIO: 0.9

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.ulMuStatus =MUPAIRED_NO_TAPERING)
