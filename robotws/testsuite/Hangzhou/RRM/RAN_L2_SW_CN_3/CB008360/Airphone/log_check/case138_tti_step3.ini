[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulHarqRxData.crcResult != -
CHECK_POINT: (ulHarqRxData.crcResult = NOK) & (ulHarqRxData.dtx = NON_DTX)
RATIO: 0.01

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.txNumber = 2) | (ulFdSchedData.txNumber = 3)| (ulFdSchedData.txNumber = 4)| (ulFdSchedData.txNumber = 5)
CHECK_POINT: (ulFdSchedData.ulMuStatus = MUPAIRED_TAPERING) | (ulFdSchedData.ulMuStatus = MUNONELIGIBLE_RETX_UCI)
RATIO: 0.9

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.ulMuStatus != -)
CHECK_POINT: (ulFdSchedData.ulMuStatus = MUPAIRED_TAPERING) | (ulFdSchedData.ulMuStatus = MUNONELIGIBLE_RETX_UCI)
RATIO: 0.98

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.ulMuStatus =MUPAIRED_TAPERING)
CHECK_POINT: ulFdSchedData.virtualUeIndex = 0
RATIO: 0.99

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.antPort != -
CHECK_POINT: ulFdSchedData.antPort = 32768
RATIO: 0.3

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.antPort != -
CHECK_POINT: ulFdSchedData.antPort = 12288
RATIO: 0.3

[TtiTrace_1 CP_7]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.antPort != -
CHECK_POINT: ulFdSchedData.antPort = 16384
RATIO: 0.3
