[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_stop_data_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (rnti != 0) & (ulFdSchedData.ueBwpId != -) & (ulFdSchedData.searchSpaceType = UE_SPECIFIC)
CHECK_POINT: ulFdSchedData.ueBwpId = 2
RATIO: 1

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (rnti != 0) & (ulFdSchedData.ulMuStatus != -)
CHECK_POINT: (ulFdSchedData.ulMuStatus = MUNONELIGIBLE_NOTNONGBR)|(ulFdSchedData.ulMuStatus = MUNONELIGIBLE_NOSRSBEAM)|(ulFdSchedData.ulMuStatus = MUNEEDLESS)
RATIO: 0.99


[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.ulMuStatus = MUNONELIGIBLE_NOTNONGBR)|(ulFdSchedData.ulMuStatus = MUNONELIGIBLE_NOSRSBEAM) 
CHECK_POINT: ulFdSchedData.subcellId = 0
RATIO: 0.99
