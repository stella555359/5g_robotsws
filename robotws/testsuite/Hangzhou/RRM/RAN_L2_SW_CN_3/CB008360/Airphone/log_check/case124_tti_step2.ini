[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
CHECK_POINT: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
RATIO: 0.98

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.numOfLayers != -)
CHECK_POINT: ulFdSchedData.numOfLayers = RANK1
RATIO: 0.99

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulHarqRxData.crcResult != -)
CHECK_POINT: (ulHarqRxData.crcResult = OK)
RATIO: 0.99

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT: ulFdSchedData.patternId1 = ${ulStartPatternidDft}~${ulStartPatternidTapered}
RATIO: 1
