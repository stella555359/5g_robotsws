[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_1}) & (ulFdSchedData.pairedUeRnti != 0)
CHECK_POINT: ulFdSchedData.pairedUeRnti = ${rnti_3}
RATIO: 1

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_2}) & (ulFdSchedData.pairedUeRnti != 0)
CHECK_POINT: ulFdSchedData.pairedUeRnti = ${rnti_3}
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_3}) 
CHECK_POINT: ulFdSchedData.pairedUeRnti = ${rnti_1}
RATIO: 0.49

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_3}) 
CHECK_POINT: ulFdSchedData.pairedUeRnti = ${rnti_2}
RATIO: 0.49

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulHarqRxData.crcResult != -)
CHECK_POINT: (ulHarqRxData.crcResult = OK)
RATIO: 0.99

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.dtx = NON_DTX
RATIO: 0.999
