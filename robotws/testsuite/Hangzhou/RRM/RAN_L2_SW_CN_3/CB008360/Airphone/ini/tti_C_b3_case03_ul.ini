[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default


[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.crcResult = OK
RATIO: 0.99

#dft
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.numCdmGroupNoData = 1)
CHECK_POINT: (ulFdSchedData.ulMuGroupStatus != MUGROUPSPAIRED_NON_TAPERING_INGROUP) | (ulFdSchedData.ulMuStatus != MUPAIRED_NO_TAPERING)
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.ulMuGroupStatus = MUGROUPSPAIRED_NON_TAPERING_INGROUP) | (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT:  (ulFdSchedData.numCdmGroupNoData = 2)
RATIO: 1