[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.crcResult = OK
RATIO: 1

#------check----CB006062--------------------
# pair UE,numCdmGroupNoData = 2
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: ulFdSchedData.virtualUeIndex != 255
CHECK_POINT: ulFdSchedData.numCdmGroupNoData = 2
RATIO: 1

# non-pair UE, 256QAM, MCS=27, ini: numCdmGroupNoData =1;
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.virtualUeIndex = 255)& (ulFdSchedData.mcsTable=QAM256) & (ulFdSchedData.rrmUlUsedMcs = 27) & (ulFdSchedData.txNumber=1)
CHECK_POINT: ulFdSchedData.numCdmGroupNoData = 1
RATIO: 1

# non-pair UE, 256QAM, MCS<27, ini: numCdmGroupNoData =2;(not show in this case)
#[TtiTrace_1 CP_4]
#CHECK_TYPE: 0
#FILTER: (ulFdSchedData.virtualUeIndex != 255)& (ulFdSchedData.mcsTable=TABLE_256QAM) & (ulFdSchedData.rrmUlUsedMcs != 27) & (ulFdSchedData.txNumber=1)
#CHECK_POINT: ulFdSchedData.numCdmGroupNoData = 2
#RATIO: 1

#----check------group UE pair--------------

# root use subcell 0
[TtiTrace_1 CP_5]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuGroupStatus= MUGROUPSPAIRED_TAPERING_ROOT)|(ulFdSchedData.ulMuGroupStatus= MUGROUPSPAIRED_NON_TAPERING_ROOT)
CHECK_POINT: ulFdSchedData.subcellId=0
RATIO: 1

# pair use subcell 1
[TtiTrace_1 CP_6]
CHECK_TYPE: 0
FILTER:(ulFdSchedData.ulMuGroupStatus= MUGROUPSPAIRED_TAPERING_INGROUP)|(ulFdSchedData.ulMuGroupStatus= MUGROUPSPAIRED_NON_TAPERING_INGROUP)
CHECK_POINT: ulFdSchedData.subcellId=1
RATIO: 1
