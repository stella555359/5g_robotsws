[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.numOfLayers != -

CHECK_POINT: ulFdSchedData.numOfLayers = RANK1

RATIO: 1

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.antPort != 0) & (ulFdSchedData.antPort != -)
CHECK_POINT: (ulFdSchedData.antPort = 16384) | (ulFdSchedData.antPort = 32768) 
RATIO: 0.9

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.reScaledCorrAvgSinrReqPrb > 10) & (ulFdSchedData.antPort != -)& (ulFdSchedData.antPort != 0)& (ulFdSchedData.reScaledCorrAvgSinrReqPrb != 65535)
CHECK_POINT: ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING
RATIO: 0.1