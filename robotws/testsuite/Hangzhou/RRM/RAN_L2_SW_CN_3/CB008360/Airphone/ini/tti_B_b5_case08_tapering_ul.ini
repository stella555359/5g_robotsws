[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default


[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.crcResult = OK
RATIO: 0.99

#dft
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.patternId1 > 0)
CHECK_POINT: (ulFdSchedData.ulMuGroupStatus = MUGROUPSPAIRED_TAPERING_INGROUP) | (ulFdSchedData.ulMuGroupStatus = MUGROUPSPAIRED_TAPERING_ROOT)
RATIO: 0.31

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.patternId1 > 0)
CHECK_POINT: (ulFdSchedData.ulMuStatus = MUPAIRED_TAPERING)
RATIO: 0.13

