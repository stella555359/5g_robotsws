[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

#rank1+rank2 simple reTx pair


[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
#txNumber (>1) menas reTransmission. (=1) menas initial Transmission
FILTER: ulFdSchedData.ulMuStatus = MUPAIRED_NON_TAPERING_SIMPLERE
CHECK_POINT: ulFdSchedData.txNumber != 1
RATIO: 1


[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
#rank2 use antport 1,2 or 3,4(49152=1100000000000000; 12288=0011000000000000)
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NON_TAPERING_SIMPLERE)&(ulFdSchedData.numOfLayers = RANK2)
CHECK_POINT: (ulFdSchedData.antPort = 49152)|(ulFdSchedData.antPort = 12288)
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#rank1 use antport 1 or 3 (32768=1000000000000000; 8192=0010000000000000)
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NON_TAPERING_SIMPLERE)&(ulFdSchedData.numOfLayers = RANK1)
CHECK_POINT: (ulFdSchedData.antPort = 8192)|(ulFdSchedData.antPort = 32768)
RATIO: 1




