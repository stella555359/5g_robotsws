[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_UE12_corrThd_05_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.crcResult = OK
RATIO: 0.999

#UE1:0°
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: rnti = ${rnti_1}
CHECK_POINT: ulFdSchedData.patternId1 = 1024
RATIO: 1

#UE2:30°,10°, switch
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_2})
CHECK_POINT: (ulFdSchedData.patternId1 = 1027)|(ulFdSchedData.patternId1 = 1032)
RATIO: 1

#subcellid=0
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
CHECK_POINT: ulFdSchedData.subcellId = 0
RATIO: 1

#pair ratio=1
[TtiTrace_1 CP_5]
CHECK_TYPE: 0
CHECK_POINT: ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING
RATIO: 1

#<28SINR<35
[TtiTrace_1 CP_6]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT: ulFdSchedData.reScaledCorrAvgSinrReqPrb = 28~36
RATIO: 1

#antport 1,2
[TtiTrace_1 CP_7]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT:ulFdSchedData.antPort=16384
RATIO: >0

[TtiTrace_1 CP_8]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT:ulFdSchedData.antPort=32768
RATIO: >0

#virtualUE_index:0
[TtiTrace_1 CP_9]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT:ulFdSchedData.virtualUeIndex=0
RATIO: 1




