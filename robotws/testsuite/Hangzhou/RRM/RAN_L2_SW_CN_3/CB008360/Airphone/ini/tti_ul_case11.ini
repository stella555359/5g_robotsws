[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_MCS_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.crcResult = OK
RATIO: 0.999

#UE1,UE3,patternid_H0V0
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_1})|(rnti = ${rnti_3})
CHECK_POINT: ulFdSchedData.patternId1 = 1024
RATIO: 1

#UE2_30degree_H8V0
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_2})
CHECK_POINT: ulFdSchedData.patternId1 = 1032
RATIO: 1

#UE2_-30degree_H19V0
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_4})
CHECK_POINT: ulFdSchedData.patternId1 = 1043
RATIO: 1

#subcellid=0
[TtiTrace_1 CP_5]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.subcellId != -)
CHECK_POINT: ulFdSchedData.subcellId = 0
RATIO: 1

#pair ratio,UE2,UE4, pair ratio=1
[TtiTrace_1 CP_6]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_2})|(rnti = ${rnti_4})
CHECK_POINT: ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING
RATIO: 0.999

#pair ratio,UE1,UE3, 0.99<pair ratio<1
[TtiTrace_1 CP_7]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_1})|(rnti = ${rnti_3})
CHECK_POINT: ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING
RATIO: 0.95

#delta_MCS: UE2,UE4 ,delta_MCS=0(always pair)
[TtiTrace_1 CP_8]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_2})|(rnti = ${rnti_4})
CHECK_POINT: ulFdSchedData.subcellId = 0
RATIO: 1

#<28SINR<35
[TtiTrace_1 CP_9]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT: ulFdSchedData.reScaledCorrAvgSinrReqPrb = 28~36
RATIO: 1

#phr:UE 1,2,3 <0.   UE4>0
[TtiTrace_1 CP_10]
CHECK_TYPE: 0
FILTER: rnti != ${rnti_4}
CHECK_POINT: ulLaPhr.rrmPhrScaled<0
RATIO: 1

[TtiTrace_1 CP_11]
CHECK_TYPE: 0
FILTER: rnti = ${rnti_4}
CHECK_POINT: ulLaPhr.rrmPhrScaled>0
RATIO: 1


#antport 1,2
[TtiTrace_1 CP_12]
CHECK_FILE: tti_MCS_ul.csv
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT:ulFdSchedData.antPort=16384
RATIO: >0


[TtiTrace_1 CP_13]
CHECK_FILE: tti_MCS_ul.csv
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT:ulFdSchedData.antPort=32768
RATIO: >0

#virtualUE_index:0,1
[TtiTrace_1 CP_14]
CHECK_FILE: tti_MCS_ul.csv
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT:ulFdSchedData.virtualUeIndex=0
RATIO: >0

[TtiTrace_1 CP_15]
CHECK_FILE: tti_MCS_ul.csv
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT:ulFdSchedData.virtualUeIndex=1
RATIO: >0

#delta_MCS: UE1,UE3 ,delta_MCS=0,1,-1(not always pair)
[TtiTrace_1 CP_16]
CHECK_FILE: tti_MCS_ul.csv
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_1})|(rnti = ${rnti_3})
CHECK_POINT:ulFdSchedData.deltaMcs=1
RATIO: >0
[TtiTrace_1 CP_17]
CHECK_FILE: tti_MCS_ul.csv
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_1})|(rnti = ${rnti_3})
CHECK_POINT:ulFdSchedData.deltaMcs=-1
RATIO: >0
[TtiTrace_1 CP_18]
CHECK_FILE: tti_MCS_ul.csv
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_1})|(rnti = ${rnti_3})
CHECK_POINT:ulFdSchedData.deltaMcs=0
RATIO: >0




