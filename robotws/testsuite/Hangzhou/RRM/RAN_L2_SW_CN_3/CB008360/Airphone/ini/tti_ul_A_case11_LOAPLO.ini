[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.crcResult = OK
RATIO: 0.999

#subcellid=0
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
CHECK_POINT: ulFdSchedData.subcellId = 0
RATIO: 1

#pair ratio=1.  sometime overlaod not paired.,index=255
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
CHECK_POINT: ulFdSchedData.virtualUeIndex=0~1
RATIO: 0.99

#SINR
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
CHECK_POINT: ulFdSchedData.reScaledCorrAvgSinrReqPrb = 28~37
RATIO: 1

#phr:UE 1,2,3 <0.   UE4>0
[TtiTrace_1 CP_5]
CHECK_TYPE: 0
FILTER: rnti != ${rnti_4}
CHECK_POINT: ulLaPhr.rrmPhrScaled<0
RATIO: 1

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
FILTER: rnti = ${rnti_4}
CHECK_POINT: ulLaPhr.rrmPhrScaled>0
RATIO: 1

#antport 1,2
[TtiTrace_1 CP_7]
CHECK_FILE: tti_MCS_ul.csv
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT:ulFdSchedData.antPort=16384
RATIO: >0

[TtiTrace_1 CP_8]
CHECK_FILE: tti_MCS_ul.csv
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING)
CHECK_POINT:ulFdSchedData.antPort=32768
RATIO: >0

#virtualUE_index:0,1
[TtiTrace_1 CP_9]
CHECK_FILE: tti_MCS_ul.csv
CHECK_TYPE: 0
CHECK_POINT:ulFdSchedData.virtualUeIndex=0
RATIO: >0

[TtiTrace_1 CP_10]
CHECK_FILE: tti_MCS_ul.csv
CHECK_TYPE: 0
CHECK_POINT:ulFdSchedData.virtualUeIndex=1
RATIO: >0

#SINR=65535   MCS component
[TtiTrace_1 CP_11]
CHECK_TYPE: 0
CHECK_POINT: ulFdSchedData.estimatedMuSinr = 65535
RATIO: 1

