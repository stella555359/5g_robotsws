[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1: ${tti_title_tag}
DOMAIN: Default

#simple reTx pair

#rank1 + rank1 + rank2 

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
#txNumber >1 menas reTrans; =1 means initial trans
FILTER: ulFdSchedData.ulMuStatus = MUPAIRED_NON_TAPERING_SIMPLERE
CHECK_POINT: ulFdSchedData.txNumber != 1
RATIO: 1

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#UE1 rank2 use subcell a , antport (1,2) or (3,4) (49152=1100000000000000; 12288=0011000000000000)
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NON_TAPERING_SIMPLERE)&(ulFdSchedData.numOfLayers = RANK2)
CHECK_POINT: (ulFdSchedData.antPort = 49152)|(ulFdSchedData.antPort = 12288)
RATIO: 1


[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#UE2 rank1 use antport 1 or 3 (32768=1000000000000000; 8192=0010000000000000)
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NON_TAPERING_SIMPLERE)&(ulFdSchedData.numOfLayers = RANK1)
CHECK_POINT: (ulFdSchedData.antPort = 32768)|(ulFdSchedData.antPort = 8192)
RATIO: 0.01

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#UE3 rank1 use antport 2 or 4 (16384=0100000000000000; 4096=0001000000000000)
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NON_TAPERING_SIMPLERE)&(ulFdSchedData.numOfLayers = RANK1)
CHECK_POINT: (ulFdSchedData.antPort = 16384)|(ulFdSchedData.antPort = 4096)
RATIO: 0.01


#1
# rank2:port 1,2
# rank1:port 3
# rank1:port 4

#2
# rank2:port 3,4
# rank1:port 1
# rank1:port 2

