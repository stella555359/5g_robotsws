[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1: ${tti_title_tag}
DOMAIN: Default

#rank2+rank2 simple reTx pair

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
#txNumber (>1) menas reTransmission; (=1) means initial Transmission
FILTER: ulFdSchedData.ulMuStatus = MUPAIRED_NON_TAPERING_SIMPLERE
CHECK_POINT: (ulFdSchedData.numOfLayers = RANK2)&(ulFdSchedData.txNumber != 1)
RATIO: 1

#rank2 UE: subcell0 use antport 1,2(49152=1100000000000000)
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NON_TAPERING_SIMPLERE)&(ulFdSchedData.subcellId=0)
CHECK_POINT: ulFdSchedData.antPort = 49152
RATIO: 1

#rank2 UE: subcell1 use antport 3,4(12288=0011000000000000)
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER: (ulFdSchedData.ulMuStatus = MUPAIRED_NON_TAPERING_SIMPLERE)&(ulFdSchedData.subcellId=1)
CHECK_POINT: ulFdSchedData.antPort = 12288
RATIO: 1
