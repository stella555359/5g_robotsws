[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_2})
CHECK_POINT: ulFdSchedData.ulMuStatus = MUNONELIGIBLE_NOTNONGBR
RATIO: 0.99

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.dtx = NON_DTX
RATIO: 0.999

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER: (rnti = ${rnti_1}) & (rnti = ${rnti_3})
CHECK_POINT: ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING
RATIO: 0.95
