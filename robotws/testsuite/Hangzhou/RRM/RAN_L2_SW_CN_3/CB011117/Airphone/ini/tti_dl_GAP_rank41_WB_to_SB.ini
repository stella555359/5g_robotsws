[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

# small bler during WB SRS switch to SB SRS.
[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

# in gap CRITERION1(WB SRS) change to NONE(SB SRS)
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
CHECK_POINT: measGapAndWbSrsOverlapStatus = 'CRITERION1'
RATIO: 0.1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
CHECK_POINT: measGapAndWbSrsOverlapStatus = 'NONE'
RATIO: 0.01

# WB to SB SRS
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
CHECK_POINT: srsState = 'WBSRS'
RATIO: 0.1

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
CHECK_POINT: srsState = 'SBSRS'
RATIO: 0.01

# RT to DFT
[TtiTrace_1 CP_6]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 0.05

[TtiTrace_1 CP_7]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.beamType = DFTNONTAPERING
RATIO: 0.05









