[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.999

# SB SRS in gap will stop monitor
# DFT can't switch to RT in gap
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.beamType = DFTNONTAPERING
RATIO: 1









