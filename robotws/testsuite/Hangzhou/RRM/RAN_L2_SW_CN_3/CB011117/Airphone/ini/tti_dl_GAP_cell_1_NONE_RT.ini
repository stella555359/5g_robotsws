[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

# small bler when into gap
[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

# go into measurement gap after A2, part overlap with TAS SRS
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
CHECK_POINT: measGapAndWbSrsOverlapStatus = 'NONE'
RATIO: 0.1

# WB SRS keep
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
CHECK_POINT: srsState = 'WBSRS'
RATIO: 1

# RT beam keep
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 1









