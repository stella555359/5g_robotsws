[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${csv_title_tag}
DOMAIN: Default

# -----CSI group 0-----
# set_1(RS1)
[TtiTrace_1 CP_1]
CHECK_TYPE: 0
FILTER: (DlData_CsiRsSendReq_t.csiRsResources.Length = 2)&(DlData_CsiRsResource_t.trsInfo = 0,0)&(DlData_CsiRsResource_t.csiRsScramblingSequenceInt=50,50)
CHECK_POINT: 3gpp.slot = 12
RATIO: 1

# set_2(RS2)
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: (DlData_CsiRsSendReq_t.csiRsResources.Length = 4)&(DlData_CsiRsResource_t.trsInfo = 0,0,0,0)&(DlData_CsiRsResource_t.csiRsScramblingSequenceInt=50,50,50,50)
CHECK_POINT: 3gpp.slot = 12
RATIO: 1

# set_3(RS4)
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER: (DlData_CsiRsSendReq_t.csiRsResources.Length = 8)&(DlData_CsiRsResource_t.trsInfo = 0,0,0,0,0,0,0,0)&(DlData_CsiRsResource_t.csiRsScramblingSequenceInt=50,50,50,50,50,50,50,50)
CHECK_POINT: 3gpp.slot = 12
RATIO: 1

# -----CSI group 1-----
# set_1(RS1)
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER: (DlData_CsiRsSendReq_t.csiRsResources.Length = 2)&(DlData_CsiRsResource_t.trsInfo = 0,0)&(DlData_CsiRsResource_t.csiRsScramblingSequenceInt=52,52)
CHECK_POINT: 3gpp.slot = 13
RATIO: 1

# set_2(RS2)
[TtiTrace_1 CP_5]
CHECK_TYPE: 0
FILTER: (DlData_CsiRsSendReq_t.csiRsResources.Length = 4)&(DlData_CsiRsResource_t.trsInfo = 0,0,0,0)&(DlData_CsiRsResource_t.csiRsScramblingSequenceInt=52,52,52,52)
CHECK_POINT: 3gpp.slot = 13
RATIO: 1

# set_3(RS4)
[TtiTrace_1 CP_6]
CHECK_TYPE: 0
FILTER: (DlData_CsiRsSendReq_t.csiRsResources.Length = 8)&(DlData_CsiRsResource_t.trsInfo = 0,0,0,0,0,0,0,0)&(DlData_CsiRsResource_t.csiRsScramblingSequenceInt=52,52,52,52,52,52,52,52)
CHECK_POINT: 3gpp.slot = 13
RATIO: 1


# sub-band TRS for different cells in the same L1 pool are allocated in the same slot but different RB allocation
# sub-band TRS and cell specific CSI-RS are allocated in the different slots
[TtiTrace_1 CP_7]
CHECK_TYPE: 0
FILTER: (DlData_CsiRsResource_t.csiRsScramblingSequenceInt=1,1,1,1)|(DlData_CsiRsResource_t.csiRsScramblingSequenceInt=1,1,1,1,1,1,1,1)
CHECK_POINT: 3gpp.slot = 0~3
RATIO: 1

