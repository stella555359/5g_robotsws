[Global]
LOGDIR:D:\TA\A2A

TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
FILTER:(physCellId=${ZAB_physcell_1})|(physCellId=${ZAB_physcell_2})
CHECK_POINT: dlAllocatedPooledResourcesData.hasZabPrivilege = 1
RATIO: 1

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER:physCellId=${nonZAB_physcell_1}
CHECK_POINT: dlAllocatedPooledResourcesData.hasZabPrivilege = 0
RATIO: 1
