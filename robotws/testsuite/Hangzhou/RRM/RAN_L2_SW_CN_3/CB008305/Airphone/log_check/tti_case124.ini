[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_name}
DOMAIN: Default

[TtiTrace_1 CP_1]

CHECK_TYPE: 0
#1:NOT MEET, 0:MEET

FILTER: dlFdSchedData.ackNack != -

CHECK_POINT: dlFdSchedData.ackNack = ACK

RATIO: 0.95
[TtiTrace_1 CP_2]

CHECK_TYPE: 0
#1:NOT MEET, 0:MEET

FILTER: (dlFdSchedData.ueType = PCELL) & (dlTdSchedSubcellData.cs1Size = 2) & (dlFdSchedData.muStatus  != -)

CHECK_POINT: dlFdSchedData.muStatus = MUPAIR

RATIO: 0.3

[TtiTrace_1 CP_3]

CHECK_TYPE: 0
#1:NOT MEET, 0:MEET

FILTER: dlFdSchedData.ueType = SCELL

CHECK_POINT: dlFdSchedData.muStatus != MUPAIR

RATIO: 1

