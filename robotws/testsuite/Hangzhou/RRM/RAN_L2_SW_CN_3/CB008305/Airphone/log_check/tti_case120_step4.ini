[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.muStatus != MUPAIR
CHECK_POINT: dlFdSchedData.numOfLayers = RANK4
RATIO: 1

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
CHECK_POINT: dlFdSchedData.muStatus = MUPAIR
RATIO: 0.6

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
FILTER: dlFdSchedData.muStatus = MUPAIR
CHECK_POINT: dlFdSchedData.muPdschPowerOffset = -60
RATIO: 0

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.muStatus = NOMUELIGIBLE_LOWCQI
