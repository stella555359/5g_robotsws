[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_dl.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

[TtiTrace_1 CP_2]
