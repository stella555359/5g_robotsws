[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_dl_dci_decode.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.98

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.numOfLayers != -
CHECK_POINT: dlFdSchedData.numOfLayers = RANK3
RATIO: 0.4

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.numOfLayers != -
CHECK_POINT: dlFdSchedData.numOfLayers = RANK1
RATIO: 0.4

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
CHECK_POINT: dlFdSchedData.muStatus = MUPAIR
RATIO: 0.9

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.muStatus = MUPAIR)&(dlFdSchedData.numOfLayers = RANK1)
CHECK_POINT: (dlFdSchedData.antPort = 32768) & (dlFdSchedData.numCdmGroupNoData=2)
RATIO: 1

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.muStatus = MUPAIR)&(dlFdSchedData.numOfLayers = RANK3)
CHECK_POINT: (dlFdSchedData.antPort = 57344) & (dlFdSchedData.numCdmGroupNoData=2)
RATIO: 1

[TtiTrace_1 CP_7]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.muStatus = MUPAIR
CHECK_POINT: (dlFdSchedData.subcellId = 0) | (dlFdSchedData.subcellId = 1)
RATIO: 1

