[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_dl.csv
DOMAIN: Default

[TtiTrace_1 CP_1]

CHECK_TYPE: 0
#1:NOT MEET, 0:MEET

FILTER: dlFdSchedData.ackNack != -

CHECK_POINT: dlFdSchedData.ackNack = ACK

RATIO: 1

[TtiTrace_1 CP_2]

CHECK_TYPE: 0
#1:NOT MEET, 0:MEET

FILTER: dlFdSchedData.numOfLayers != -

CHECK_POINT: dlFdSchedData.numOfLayers = RANK4

RATIO: 1

[TtiTrace_1 CP_3]

CHECK_TYPE: 0
#1:NOT MEET, 0:MEET

CHECK_POINT: dlFdSchedData.muStatus = MUPAIR

RATIO: 1

[TtiTrace_1 CP_4]

CHECK_TYPE: 0
#1:NOT MEET, 0:MEET

CHECK_POINT: dlFdSchedData.beamType = DFTBEAMTAPERING

RATIO: 1

[TtiTrace_1 CP_5]

CHECK_TYPE: 0
#1:NOT MEET, 0:MEET

FILTER: dlFdSchedData.beamType = DFTBEAMTAPERING

CHECK_POINT: dlFdSchedData.antPort = 61440

RATIO: 1

[TtiTrace_1 CP_6]

CHECK_TYPE: 0
#1:NOT MEET, 0:MEET

FILTER: dlFdSchedData.beamType = DFTBEAMTAPERING

CHECK_POINT: dlFdSchedData.muPdschPowerOffset < 0

RATIO: 0.95
