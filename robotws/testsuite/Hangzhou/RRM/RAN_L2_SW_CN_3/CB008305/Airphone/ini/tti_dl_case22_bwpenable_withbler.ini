[Global]
LOGDIR: D:\TA\A2A

TTITRACE_TAG_1:tti_dl.*csv

DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.96

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.muPdschPowerOffset != -)&(dlFdSchedData.cellBwpId = 2)&(rnti = 1~65534)
CHECK_POINT: dlFdSchedData.muPdschPowerOffset = 0
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.cellBwpId = 2)&(rnti = 1~65534)
CHECK_POINT: dlFdSchedData.muStatus = NOMUELIGIBLE_NOTLARGEBWP
RATIO: 1
