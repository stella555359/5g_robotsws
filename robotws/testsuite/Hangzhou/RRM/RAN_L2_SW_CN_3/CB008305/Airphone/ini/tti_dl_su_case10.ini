[Global]
LOGDIR: D:\TA\A2A

TTITRACE_TAG_1:tti_su_dl.csv

DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99


[TtiTrace_1 CP_2]

CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.muStatus != -)&(rnti = 1~65534)
CHECK_POINT: dlFdSchedData.muStatus != MUPAIR
RATIO: 0.99


[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.muPdschPowerOffset != -)&(rnti = 1~65534)
CHECK_POINT: dlFdSchedData.muPdschPowerOffset = 0
RATIO: 1


