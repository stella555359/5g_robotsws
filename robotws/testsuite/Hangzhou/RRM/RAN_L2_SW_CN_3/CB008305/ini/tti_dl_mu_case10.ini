[Global]
LOGDIR: D:\TA\A2A

TTITRACE_TAG_1:tti_mu_dl.csv

DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99


[TtiTrace_1 CP_2]
CHECK_TYPE: 1
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = DTX
RATIO: 1


[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.muStatus != -
CHECK_POINT: dlFdSchedData.muStatus = MUPAIR
RATIO: 0.8


[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.muPdschPowerOffset != -
CHECK_POINT: dlFdSchedData.muPdschPowerOffset = -30
RATIO: 0.5


