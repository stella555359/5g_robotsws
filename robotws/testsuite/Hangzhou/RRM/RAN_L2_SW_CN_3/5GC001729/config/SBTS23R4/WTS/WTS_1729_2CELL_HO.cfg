#VARIABLES
#real gnB XN interface
set CONTAINER_IP="10.0.2.121"
set SERVER_IP=$CONTAINER_IP
set GNB_NG_ADDR="10.0.1.2"
set GNB_XN_ADDR="10.0.1.2"

set GNB1_XN_ADDR="10.0.1.124"
set GNB1_NG_ADDR="10.0.1.125"

set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="10.12.2.1"
set EDAEMON_PORT="22222"

#for sim gnb1 simu cell1
set PROXY_SERVER4_IP="10.0.2.92"

#5GCN CONFIGURATION
set_amf_region id=1 tac_list=0,100,200 plmn=311:489

set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR

#GNB CONFIGURATION
set_gnb id=2 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x2:22 daemon=$SERVER_IP:$EDAEMON_PORT xn=$GNB_XN_ADDR x2_peers=none amf=1
set_cell id=1 gnb=2 pci=16:2 tac=200 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=510000:510000 mandatory_for_activation=off gscn=6372
set_cell id=2 gnb=2 pci=17:0 tac=200 nrci=0x02 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=528000:528000 mandatory_for_activation=off gscn=6597

#GNB1 sim configuration for TDD
set_gnb id=1 type=simulated plmn=311:489 ng=$GNB1_NG_ADDR gnb_id=0x23:22 daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none xn=$GNB1_XN_ADDR nssai=0x1:0xd143a5 amf=1
#set_cell id=1 gnb=1 pci=127:0 tac=0 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER4_IP:9999 nr_arfcn=510000:510000 mandatory_for_activation=off gscn=6372
set_cell id=1 gnb=1 pci=127:0 tac=0 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER4_IP:9999|$PROXY_SERVER4_IP:8888 nr_arfcn=510000:510000 mandatory_for_activation=off gscn=6372
gnb_param id=1 xn_listening_socket=1 send_xn_setup=false




#UEC CONFIGURATION
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=$UEC_ADDR/26 file=airphone_config.xml

set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nea=null+zuc nia=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 enb=2 cell=1 mode=nr
ue_param id=1 ue_nr_


#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_qosflow id=1 5qi=8 default=on
set_nwslice id=1 snssai=0x01:0xd143a5 amf=1 default=on ue=all


set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=2 ue_nat_ip=72.23.1.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=3 ue_nat_ip=72.23.2.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=4 ue_nat_ip=72.23.3.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=5 ue_nat_ip=72.23.4.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=6 ue_nat_ip=72.23.5.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP


debug_log level=4
sim_debug_log level=4 mme=1
sim_debug_log level=4 uec=1
sim_debug_log level=4 pgw=1
sim_debug_log level=4 sgw=1
sim_debug_log level=4 enb=1

link_ctrl_param use_hb=on

trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on

sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on

sim_trace enb=1 protocol=xn on
sim_trace enb=1 protocol=ng on

cfg_end

set_log log_to_file=on
start version_check=off