set_mme id=1 ip=$DAEMON_IP:$EDAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$EDAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100 s5u_snd_buff_size=20M s5u_rcv_buff_size=20M s1u_snd_buff_size=20M s1u_rcv_buff_size=20M gtpu_read_packets_threshold=10
set_pgw id=1 type=simulated ip=$DAEMON_IP:$EDAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13 sgi_rcv_buff_size=20M sgi_snd_buff_size=20M s5u_rcv_buff_size=20M s5u_snd_buff_size=20M gtpu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=10

#add ims_voice_3gpp support
amf_param id=1 ims_voice_3gpp=on full_nas_auth=on

