[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:*_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulLaAverageSinr.measurementType != -
CHECK_POINT: ulLaAverageSinr.measurementType = SRS
RATIO: 0.999

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulLaAverageSinr.rrmInstSinrRank != -
CHECK_POINT: ulLaAverageSinr.rrmInstSinrRank = RANK_1_SRS
RATIO: 0.999

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulPuschReceiveRespPsData.ulRank != -
CHECK_POINT: ulPuschReceiveRespPsData.ulRank = 255
RATIO: 0.999

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET   ulPmiRank1 = 0 or 1
FILTER: ulPuschReceiveRespPsData.ulPmiRank1 != -
CHECK_POINT: ulPuschReceiveRespPsData.ulPmiRank1 = 255
RATIO: 0.999

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulPuschReceiveRespPsData.ulPmiRank2 != -
CHECK_POINT: ulPuschReceiveRespPsData.ulPmiRank2 = 255
RATIO: 0.999

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.patternId1 != -
CHECK_POINT: (ulFdSchedData.patternId1 = 52)&(ulFdSchedData.patternId2 = 53 )&(ulFdSchedData.patternId3 = 54 )&(ulFdSchedData.patternId4 = 55)
RATIO: 0.999
