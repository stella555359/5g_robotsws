RATIO: 0.98

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER: ulFdSchedData.puschTPstate != -
CHECK_POINT: ulFdSchedData.puschTPstate = 0
RATIO: 0.98

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
FILTER: ulFdSchedData.dciFormat != -
CHECK_POINT: ulFdSchedData.dciFormat = UL_01
RATIO: 0.98
