[Global]
LOGDIR: ${TEST_LOG_DIRECTORY()}/All/
TTITRACE_TAG_1:tti_dl.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
FILTER: (dlFdSchedData.ackNack != -)&(rnti = 1~65534)
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.90

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: (dlFdSchedData.beamType != -)&(rnti = ${ue1_rnti})&(physCellId = 50)
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER: (dlFdSchedData.beamType != -)&(rnti = ${ue2_rnti})&(physCellId = 50)
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 1

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER: (dlFdSchedData.beamType != -)&(rnti = ${ue3_rnti})&(physCellId = 50)
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 1

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
FILTER: (dlFdSchedData.beamType != -)&(rnti = ${ue4_rnti})&(physCellId = 50)
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 1

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
FILTER: (dlFdSchedData.beamType != -)&(rnti = ${ue5_rnti})&(physCellId = 50)
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 1

[TtiTrace_1 CP_7]
CHECK_TYPE: 0
FILTER: (dlFdSchedData.beamType != -)&(rnti = ${ue6_rnti})&(physCellId = 50)
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 1

[TtiTrace_1 CP_8]
CHECK_TYPE: 0
FILTER: (dlFdSchedData.beamType != -)&(rnti = ${ue7_rnti})&(physCellId = 50)
CHECK_POINT: dlFdSchedData.beamType = DFTNONTAPERING
RATIO: 1
