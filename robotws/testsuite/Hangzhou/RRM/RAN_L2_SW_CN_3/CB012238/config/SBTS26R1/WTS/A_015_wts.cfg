set_qosflow id=1 5qi=9 qos_flow_type=non-gbr default=on ue=1-60
set_qosflow id=2 5qi=7 qos_flow_type=non-gbr ue=1-60
set_qosflow id=3 5qi=8 qos_flow_type=non-gbr ue=1-60
set_qosflow id=4 5qi=129 qos_flow_type=non-gbr ue=1-60
set_qosflow id=5 5qi=6 qos_flow_type=non-gbr ue=1-60

set_qosrule id=1 proto=udp qos_flow=1
set_qosrule id=2 proto=udp qos_flow=2
set_qosrule id=3 proto=udp qos_flow=3
set_qosrule id=4 proto=udp qos_flow=4
set_qosrule id=5 proto=udp qos_flow=5

nwslice_set id=1 qos_flows=1,2,3,4,5 qos_rules=1,2,3,4,5 snssai=0x01:0xD143A5 default=on ue=1-60 amf=1
nwslice_set id=2 qos_flows=1,2,3,4,5 qos_rules=1,2,3,4,5 snssai=0x01:0xD143AD ue=1-60 amf=1
nwslice_set id=3 qos_flows=1,2,3,4,5 qos_rules=1,2,3,4,5 snssai=0x01:0xD143B6 ue=1-60 amf=1

uec_param id=1 reordering_window_size=1000 reordering_timer=200

cell_srs_beam_pos_nr profile_id=1 num_of_ue_positions=4 azimuth=40,20,-40,-40
cell_testmode_set_nr cell_id=1 gnb=2 testmode=cell_srs_beam_pos profile_id=1 action=activate
cell_testmode_set_nr cell_id=2 gnb=2 testmode=cell_srs_beam_pos profile_id=1 action=activate
cell_testmode_set_nr cell_id=3 gnb=2 testmode=cell_srs_beam_pos profile_id=1 action=activate
cell_testmode_set_nr cell_id=4 gnb=2 testmode=cell_srs_beam_pos profile_id=1 action=activate

# MISC ---------------------------------------------------------------------------------------------------
sim_param_set NR_PDCP_CIPHERING=distributed  NR_PDCP_TRUNCATE_DL_SIZE=47 NR_PDCP_BUNDLE_DL_MAX_SIZE=1200 NR_PDCP_BUNDLE_DL_TIMEOUT=100 NR_CLUB_PROXY_PROTO_MSGS=enabled
debug_log level=4
sim_debug_log level=4 mme=1
sim_debug_log level=4 uec=1
sim_debug_log level=4 pgw=1
sim_debug_log level=4 sgw=1
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
sim_trace uec=1 protocol=all on
sim_trace amf=1 protocol=all on
cfg_end
set_log log_to_file=on
sim_start version_check=off
