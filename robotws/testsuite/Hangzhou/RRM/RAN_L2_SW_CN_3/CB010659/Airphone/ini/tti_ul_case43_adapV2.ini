[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

#64QAM_reservedc MCS:28~31
#target=100, reserved MCS only happen at rach slot1
#MCS(0-9)-29;(10-16)-30;(17-28)-31
#fixMCS=16,reserved MCS=30

#64QAM_adapV2: ini MCS <=9 & PRB<=19 &UCIbits<=11
[TtiTrace_1 CP_1]
CHECK_TYPE: 0
FILTER:ulFdSchedData.rrmUlUsedMcs = ${reserved_MCS}
CHECK_POINT: (ulFdSchedData.numOfPrb < 20)&(ulHarqRxData.dtx=DTX)
RATIO: 0.0001

#ini MCS <=9
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER:ulFdSchedData.txNumber = 1
CHECK_POINT: ulFdSchedData.rrmUlUsedMcs < 10
RATIO: 1

#1<= UCIbits <=11
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
CHECK_POINT: ulPucchReceiveReqData.numOfUciBits =1~11
RATIO: 1
