[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

#64QAM_reservedc MCS:29~31

#target 100, reserved MCS happend only on rach slot19
[TtiTrace_1 CP_1]
CHECK_TYPE: 0
FILTER:ulFdSchedData.rrmUlUsedMcs = ${reserved_MCS}
CHECK_POINT: slot = 19
RATIO: 1

#enable precoding, use rank1
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
CHECK_POINT: ulFdSchedData.numOfLayers = RANK1
RATIO: 1

