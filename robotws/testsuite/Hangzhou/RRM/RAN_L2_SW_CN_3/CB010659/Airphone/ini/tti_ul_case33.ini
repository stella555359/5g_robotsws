[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

#256QAM_reservedc MCS:28~31

#resevedMCS used and Paired
[TtiTrace_1 CP_1]
CHECK_TYPE: 0
FILTER:ulFdSchedData.rrmUlUsedMcs = ${reserved_MCS}
CHECK_POINT: ulFdSchedData.virtualUeIndex<255
RATIO: 0.0001

#simpele pair never happen when reserved MCS used
[TtiTrace_1 CP_2]
CHECK_TYPE: 1
FILTER:ulFdSchedData.rrmUlUsedMcs = ${reserved_MCS}
CHECK_POINT: ulFdSchedData.ulMuStatus = MUPAIRED_NON_TAPERING_SIMPLERE
RATIO: 1

#when reserved MCS used ,PRB compensation=1 (no compensation)
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER:ulFdSchedData.rrmUlUsedMcs = ${reserved_MCS}
CHECK_POINT: ulMuUeData.prbCompensationFactor = 1
RATIO: 1

#CB006062, MU UE =2
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER:ulFdSchedData.virtualUeIndex <255
CHECK_POINT: ulFdSchedData.numCdmGroupNoData = 2
RATIO: 1

#non MU ini UE=1
[TtiTrace_1 CP_5]
CHECK_TYPE: 0
FILTER:(ulFdSchedData.virtualUeIndex =255)&(ulFdSchedData.txNumber=1)
CHECK_POINT: ulFdSchedData.numCdmGroupNoData = 1
RATIO: 1

