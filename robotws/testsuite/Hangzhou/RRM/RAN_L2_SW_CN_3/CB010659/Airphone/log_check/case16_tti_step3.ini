[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_re_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.txNumber != 1
CHECK_POINT: ulFdSchedData.rrmUlUsedMcs = 30
RATIO: 0.99

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.txNumber != 1
CHECK_POINT: (ulFdSchedData.adaptRetxStatus = APPLY) | (ulFdSchedData.adaptRetxStatus = NOTAPPLYDTX)
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.txNumber != 1
CHECK_POINT: (ulFdSchedData.adaptRetxStatus = APPLY) & (ulHarqRxData.crcResult = OK)
RATIO: 0.1
