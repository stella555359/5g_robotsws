[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_fallback_dl.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.numOfLayers != -
CHECK_POINT: dlFdSchedData.numOfLayers = RANK1
RATIO: 0.999

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.999

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.beamType != -
CHECK_POINT: dlFdSchedData.beamType = DFTNONTAPERING
RATIO: 0.999

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.streamConfig.patternId1 != -
CHECK_POINT: (dlFdSchedData.streamConfig.patternId1 > 1054)&(dlFdSchedData.streamConfig.patternId1 <2100)
RATIO: 0.9

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: csiRsSchedData.patternId1 != -
CHECK_POINT: (csiRsSchedData.patternId1 > 1054)&(csiRsSchedData.patternId1 < 2100)
RATIO: 0.9
