[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:target_dl.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti = ${rnti_1}
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 1

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti = ${rnti_2}
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti = ${rnti_3}
CHECK_POINT: dlFdSchedData.beamType = DFTNONTAPERING
RATIO: 1

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.999

[TtiTrace_1 CP_7]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti001 = ${rnti_1}
CHECK_POINT: srsState = WBSRS
RATIO: 1

[TtiTrace_1 CP_8]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti001 = ${rnti_2}
CHECK_POINT: srsState = WBSRS
RATIO: 1

[TtiTrace_1 CP_9]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti001 = ${rnti_3}
CHECK_POINT: srsState = SBSRS
RATIO: 1
