[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_name}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.numOfLayers != -
CHECK_POINT: dlFdSchedData.numOfLayers = RANK1
RATIO: 0.999

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.999

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.beamType != -
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 0.999

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.streamConfig.patternId1 != -
CHECK_POINT: (dlFdSchedData.streamConfig.patternId1= 2100) |(dlFdSchedData.streamConfig.patternId1 = 2216)
RATIO: 1

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: csiRsSchedData.patternId1 != -
CHECK_POINT: (csiRsSchedData.patternId1 = 2212)|(csiRsSchedData.patternId1 = 2328)
RATIO: 1

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: csiRsSchedData.patternId1 != -
CHECK_POINT: (csiRsSchedData.patternId2 = 2213)|(csiRsSchedData.patternId2 = 2329)
RATIO: 1

[TtiTrace_1 CP_7]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: csiRsSchedData.patternId1 != -
CHECK_POINT: (csiRsSchedData.patternId3 = 2214)|(csiRsSchedData.patternId3 = 2330)
RATIO: 1

[TtiTrace_1 CP_8]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: csiRsSchedData.patternId1 != -
CHECK_POINT: (csiRsSchedData.patternId4 = 2215)|(csiRsSchedData.patternId4 = 2331)
RATIO: 1
