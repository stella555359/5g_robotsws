[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_dl.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.numOfLayers != -
CHECK_POINT: dlFdSchedData.numOfLayers = RANK4
RATIO: 0.999

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.999

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.beamType != -
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 0.999

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.beamType = SUBBAND
CHECK_POINT: (dlFdSchedData.streamConfig.patternId2 = 1438) | (dlFdSchedData.streamConfig.patternId2 = 1450)
RATIO: 0.999

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (csiRsSchedData.patternId4 != -) & (csiRsSchedData.patternId4 != 0)
CHECK_POINT: (csiRsSchedData.patternId4 = 1442) | (csiRsSchedData.patternId4 = 1454)
RATIO: 0.999
