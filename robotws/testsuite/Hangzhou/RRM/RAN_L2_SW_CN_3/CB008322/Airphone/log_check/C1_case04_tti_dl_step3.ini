[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_dl.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.numOfLayers != -
CHECK_POINT: dlFdSchedData.numOfLayers = RANK4
RATIO: 0.999

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.999

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.beamType != -
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 0.48

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER:  rnti = ${rnti_1}
CHECK_POINT: (dlFdSchedData.streamConfig.patternId1= 5000)|(dlFdSchedData.streamConfig.patternId1= 5016)
RATIO: 1

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER:  rnti = ${rnti_1}
CHECK_POINT: (dlFdSchedData.streamConfig.patternId2= 5011)|(dlFdSchedData.streamConfig.patternId2= 5027)
RATIO: 1

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti = ${rnti_3}
CHECK_POINT: (dlFdSchedData.streamConfig.patternId1= 5032)|(dlFdSchedData.streamConfig.patternId1= 5048)
RATIO: 1

[TtiTrace_1 CP_7]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti = ${rnti_3}
CHECK_POINT: (dlFdSchedData.streamConfig.patternId2= 5043)|(dlFdSchedData.streamConfig.patternId2= 5059)
RATIO: 1

[TtiTrace_1 CP_8]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti = ${rnti_2}
CHECK_POINT: dlFdSchedData.beamType = DFTNONTAPERING
RATIO: 1

[TtiTrace_1 CP_9]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti = ${rnti_4}
CHECK_POINT: dlFdSchedData.beamType = REFINE
RATIO: 1