[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:target_dl.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.numOfLayers != -
CHECK_POINT: dlFdSchedData.numOfLayers = RANK4
RATIO: 0.999

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.999

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.beamType != -) & (rnti = ${rnti_3}) 
CHECK_POINT: dlFdSchedData.beamType = DFTNONTAPERING
RATIO: 0.999

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.beamType != -) & (rnti != ${rnti_2})
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 0.10

#[TtiTrace_1 CP_5]
#CHECK_TYPE: 0
##1:NOT MEET, 0:MEET
#FILTER: dlFdSchedData.beamType = SUBBAND
#CHECK_POINT: (dlFdSchedData.streamConfig.patternId2 = 1450) | (dlFdSchedData.streamConfig.patternId2 = 1474) | (dlFdSchedData.streamConfig.patternId2 = 1498) | (dlFdSchedData.streamConfig.patternId2 = 1522)
#RATIO: 0.999

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (csiRsSchedData.patternId4 != -) & (csiRsSchedData.patternId4 != 0)
CHECK_POINT: (csiRsSchedData.patternId4 = 1819) | (csiRsSchedData.patternId4 = 1843) | (csiRsSchedData.patternId4 = 1903) | (csiRsSchedData.patternId4 = 1831) | (csiRsSchedData.patternId4 = 1891) | (csiRsSchedData.patternId4 = 1855)
RATIO: 0.999

[TtiTrace_1 CP_7]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (wbSrsConstraintState != -) & (rnti001 = ${rnti_3}) 
CHECK_POINT: wbSrsConstraintState = LIMITEDBYHIGHINTERFERENCE
RATIO: 0.999