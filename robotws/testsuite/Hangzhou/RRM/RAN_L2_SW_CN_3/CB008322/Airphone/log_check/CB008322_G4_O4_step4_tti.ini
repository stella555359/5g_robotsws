[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:target_dl.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.numOfLayers != -
CHECK_POINT: dlFdSchedData.numOfLayers = RANK4
RATIO: 0.999

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.999

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.beamType != -) & (rnti = ${rnti_2}) 
CHECK_POINT: dlFdSchedData.beamType = DFTNONTAPERING
RATIO: 0.999

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.beamType != -) & (rnti = ${rnti_1}) 
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 0.95

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.beamType != -) & (rnti = ${rnti_3}) 
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 0.95

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.beamType != -) & (rnti = ${rnti_4}) 
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 0.95

[TtiTrace_1 CP_7]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti001 = ${rnti_2} 
CHECK_POINT: wbSrsConstraintState = LIMITEDBYMAXWBSBSWITCHTOGGLE
RATIO: 0.999

[TtiTrace_1 CP_8]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti001 = ${rnti_1} 
CHECK_POINT: wbSrsConstraintState = NONE
RATIO: 0.999