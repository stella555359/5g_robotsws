[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default


[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.ackNack != -)
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

#dft
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.beamType != -) & (dlFdSchedData.rat0Bitmap = 4)
CHECK_POINT: (dlFdSchedData.startPrb = 32) & (dlFdSchedData.numOfPrb = 8) & (dlFdSchedData.beamType = DFTNONTAPERING) & (dlFdSchedData.rtBeamFailureReason = SMALLPRBLIMIT)
RATIO: 1

#dft
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.beamType != -) & (dlFdSchedData.rat0Bitmap = 1)
CHECK_POINT: (dlFdSchedData.startPrb = 48) & (dlFdSchedData.numOfPrb = 3) & (dlFdSchedData.beamType = DFTNONTAPERING) & (dlFdSchedData.rtBeamFailureReason = SMALLPRBLIMIT)
RATIO: 1

#dft
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.beamType != -) & (dlFdSchedData.rat0Bitmap = 2)
CHECK_POINT: (dlFdSchedData.startPrb = 40) & (dlFdSchedData.numOfPrb = 8) & (dlFdSchedData.beamType = SUBBAND) & (dlFdSchedData.rtBeamFailureReason = NOFAILURE)
RATIO: 1