[Global]
TM500PROTOCOLLOG_TAG_1: egate_console.log.00*
DOMAIN: Default
LOGDIR: D:\TA\A2A

##======CP_1:check when UE switch from WBSRS to SBSRS,it will not active the nonCoherent function
[Tm500ProtocolLog_1 CP_1]
CHECK_FILE: egate_console.log.00*
CHECK_TYPE: 1
CHECK_POINT:DL-DCCH-Message.rrcReconfiguration.rrcReconfiguration.nonCriticalExtension.CONTAINING.spCellConfig.spCellConfigDedicated.uplinkConfig.uplinkBWP-ToAddModList.None.bwp-Dedicated.setup.codebookSubset = nonCoherent
REPEAT_NUM: 1

##======CP_2:check when UE switch from WBSRS to SBSRS,no codebook srs reconfig
[Tm500ProtocolLog_1 CP_2]
CHECK_FILE: egate_console.log.00*
CHECK_TYPE: 1
CHECK_POINT:DL-DCCH-Message.rrcReconfiguration.rrcReconfiguration.nonCriticalExtension.CONTAINING.spCellConfig.spCellConfigDedicated.uplinkConfig.uplinkBWP-ToAddModList.None.bwp-Dedicated.setup.txConfig = codebook
REPEAT_NUM: 1

##======CP_3:check when UE switch from WBSRS to SBSRS,TAS resource reconfig,and use SBSRS 1
[Tm500ProtocolLog_1 CP_3]
CHECK_FILE: egate_console.log.00*
CHECK_TYPE: 0
CHECK_POINT:DL-DCCH-Message.rrcReconfiguration.rrcReconfiguration.nonCriticalExtension.CONTAINING.spCellConfig.spCellConfigDedicated.uplinkConfig.uplinkBWP-ToAddModList.None.bwp-Dedicated.setup.srs-ResourceToAddModList.None.freqHopping.b-SRS = 1
REPEAT_NUM: 1

