[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.999

#beamtype:DFT
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER:dlFdSchedData.streamConfig.patternId1 = ${UE1_ping_start_patternid_1}
CHECK_POINT: dlFdSchedData.streamConfig.patternId2 = ${UE1_ping_start_patternid_2}
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER:dlFdSchedData.streamConfig.patternId1 = ${UE1_pong_start_patternid_1}
CHECK_POINT: dlFdSchedData.streamConfig.patternId2 = ${UE1_pong_start_patternid_2}
RATIO: 1

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER:dlFdSchedData.streamConfig.patternId1 = ${UE2_ping_start_patternid_1}
CHECK_POINT: dlFdSchedData.streamConfig.patternId2 = ${UE2_ping_start_patternid_2}
RATIO: 1

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
FILTER:dlFdSchedData.streamConfig.patternId1 = ${UE2_pong_start_patternid_1}
CHECK_POINT: dlFdSchedData.streamConfig.patternId2 = ${UE2_pong_start_patternid_2}
RATIO: 1



