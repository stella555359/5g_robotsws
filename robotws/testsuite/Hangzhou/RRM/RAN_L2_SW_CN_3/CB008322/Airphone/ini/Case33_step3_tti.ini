[Global]
LOGDIR: D:\TA\A2A

TTITRACE_TAG_1:tti_dl_split.csv

DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.ackNack != -)&(rnti = 1~65534)
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
# all pair UE rankdowngrage to rank2 ,no pair UE rank4
FILTER: (dlFdSchedData.numOfLayers != -)&(dlFdSchedData.rtBeamFailureReason = MUPAIR)
CHECK_POINT: dlFdSchedData.numOfLayers = RANK2
RATIO: 0.99

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
# all UE report rank4
#FILTER: (csiSrReportData.csiReport.ri != -)&(csiSrReportData.csiReport.cqi!= 255)
FILTER: csiSrReportData.csiReport.cqi!= 255
CHECK_POINT: csiSrReportData.csiReport.ri = 3
RATIO: 0.99


[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
#FILTER: (dlFdSchedData.beamType != -)&(dlFdSchedData.rtBeamFailureReason = MUPAIR)&(rnti = ${ue1_rnti})
FILTER: (dlFdSchedData.rtBeamFailureReason = MUPAIR)&(rnti = ${ue1_rnti})
CHECK_POINT: dlFdSchedData.beamType = DFTTAPERING
             dlFdSchedData.muStatus = MUPAIR
RATIO: 0.99

