[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

# not switch to WB
[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 1

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
CHECK_POINT: (srsState='SBSRS')|(srsState='SBTOSBSRS')
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
CHECK_POINT: (volatilityStatus = 'HIGHCHANNELVOLATILEUE')|(volatilityStatus='EARLYSBSRSCORR')
RATIO: 1

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
CHECK_POINT: volatilityStatus = 'HIGHCHANNELVOLATILEUE'
RATIO: 0.9
