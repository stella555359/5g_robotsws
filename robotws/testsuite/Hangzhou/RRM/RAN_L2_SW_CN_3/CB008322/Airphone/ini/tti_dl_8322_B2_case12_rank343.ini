[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default


[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 1

#WBSRS not vhanged
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
CHECK_POINT: srsState = 'WBSRS'
RATIO: 1

#rank4-3, one attach is OK
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER:	dlFdSchedData.numOfLayers = RANK3
CHECK_POINT: dlFdSchedData.beamType=DFTNONTAPERING
RATIO: 0.0001

#rank3-4, one attach is OK
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER:	dlFdSchedData.numOfLayers = RANK4
CHECK_POINT: dlFdSchedData.beamType=DFTNONTAPERING
RATIO: 0.0001


