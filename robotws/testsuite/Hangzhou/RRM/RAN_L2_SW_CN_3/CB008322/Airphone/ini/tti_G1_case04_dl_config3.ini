[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default


[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.ackNack != -)
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

#dft
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.numOfPrb > 11)
CHECK_POINT: (dlFdSchedData.startPrb = 0) & (dlFdSchedData.numOfPrb = 16) & (dlFdSchedData.beamType = DFTNONTAPERING) & (dlFdSchedData.rtBeamFailureReason = SMALLPRBLIMIT)
RATIO: 1

#dft
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.numOfPrb = 11) & (dlFdSchedData.rat0Bitmap = 3)
CHECK_POINT: (dlFdSchedData.startPrb = 40) & (dlFdSchedData.numOfPrb = 11) & (dlFdSchedData.beamType = SUBBAND) & (dlFdSchedData.rtBeamFailureReason = NOFAILURE)
RATIO: 1

#dft
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.numOfPrb = 11) & (dlFdSchedData.rat0Bitmap = 65)
CHECK_POINT: (dlFdSchedData.startPrb = 0) & (dlFdSchedData.numOfPrb = 11) & (dlFdSchedData.beamType = DFTNONTAPERING) & (dlFdSchedData.rtBeamFailureReason = SMALLPRBLIMIT)
RATIO: 1
