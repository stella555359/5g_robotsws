[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default
RELATION:[TtiTrace_1 CP_1]&[TtiTrace_1 CP_2]&[TtiTrace_1 CP_3]&[TtiTrace_1 CP_4]&([TtiTrace_1 CP_5]|[TtiTrace_1 CP_6])

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 1

#beamtype
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.beamType = 	${beam_type}
RATIO: 1

#ping
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER:	dlFdSchedData.streamConfig.patternId1 = ${ping_patternid_1} 
CHECK_POINT: dlFdSchedData.streamConfig.patternId2 = ${ping_patternid_2} 
RATIO: 1

#pong
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER:	dlFdSchedData.streamConfig.patternId1 = ${pong_patternid_1} 
CHECK_POINT: dlFdSchedData.streamConfig.patternId2 = ${pong_patternid_2} 
RATIO: 1

#csi_ping or pong
[TtiTrace_1 CP_5]
CHECK_TYPE: 0	
CHECK_POINT:(csiRsSchedData.patternId1 = ${ping_csi_patternid_1})|(csiRsSchedData.patternId1 = ${pong_csi_patternid_1})
RATIO: 1


