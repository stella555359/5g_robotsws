[Global]
LOGDIR: D:\TA\A2A

TTITRACE_TAG_1:tti_dl_split.csv

DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.muStatus = NOPAIR_HIGHCORRELATION)&(dlFdSchedData.rtBeamFailureReason != SMALLPRBLIMIT)&(rnti = ${ue1_rnti})
CHECK_POINT: dlFdSchedData.numOfLayers = RANK4
             dlFdSchedData.beamType = SUBBAND
RATIO: 1

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.muStatus = NOPAIR_HIGHCORRELATION)&(dlFdSchedData.rtBeamFailureReason != SMALLPRBLIMIT)&(rnti = ${ue3_rnti})
CHECK_POINT: dlFdSchedData.numOfLayers = RANK4
             dlFdSchedData.beamType = SUBBAND
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.muStatus = MUPAIR)&(rnti = ${ue2_rnti})
CHECK_POINT: dlFdSchedData.numOfLayers = RANK2
             dlFdSchedData.beamType = DFTTAPERING
RATIO: 1

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.muStatus = MUPAIR)&(rnti = ${ue4_rnti})
CHECK_POINT: dlFdSchedData.numOfLayers = RANK2
             dlFdSchedData.beamType = DFTTAPERING
RATIO: 1

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
# all UE report rank4
FILTER: csiSrReportData.csiReport.cqi!= 255
CHECK_POINT: csiSrReportData.csiReport.ri = 3
RATIO: 0.99

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
#1:tti_dl_split.csv
CHECK_POINT: srsState = 'WBSRS'
RATIO: 1

[TtiTrace_1 CP_7]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: rnti = 1~65534
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.96