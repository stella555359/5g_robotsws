[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${file_title_tag}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: UlData_srsReceiveReqSubcell_t.srsBwvEnable = 0
RATIO: 1

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
CHECK_POINT: UlData_srsReceiveReqSubcell_t.srsBmEnable = 1
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
CHECK_POINT:UlData_srsBmResource_t.bmCyclicShift = 2,8
RATIO: 1

# SB SRS:combID=2/3 ; WB SRS: combID=3
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER: UlData_srsReceiveReqSubcell_t.srsBmEnable = 1
CHECK_POINT:(UlData_srsBmResource_t.transmissionCombId=${combId_1})|(UlData_srsBmResource_t.transmissionCombId=${combId_2})
RATIO: 1

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
CHECK_POINT:DlData_PdschGrant.patternId_item=${DFT_patternid}
RATIO: 1
