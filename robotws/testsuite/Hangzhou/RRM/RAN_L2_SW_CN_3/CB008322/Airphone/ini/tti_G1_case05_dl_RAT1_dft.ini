[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default


[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.ackNack != -)
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

#rt
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.dciFormat = DL_10_FORCE) & (physCellId = 50)
CHECK_POINT: (dlFdSchedData.startPrb = 57) & (dlFdSchedData.numOfPrb = 48) & (dlFdSchedData.beamType = DFTNONTAPERING) & (dlFdSchedData.rtBeamFailureReason = SMALLPRBLIMIT)
RATIO: 1

