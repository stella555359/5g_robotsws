[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default


[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.ackNack != -)
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

#rt
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.dciFormat = DL_10_MSG2) | (dlFdSchedData.dciFormat = DL_10_MSG4)
CHECK_POINT: (dlFdSchedData.startPrb = 110) & (dlFdSchedData.numOfPrb = 48) & (dlFdSchedData.beamType = SSB) & (dlFdSchedData.rtBeamFailureReason = PATTERNIDINVALID)
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.dciFormat = DL_10_FORCE)
CHECK_POINT: (dlFdSchedData.startPrb = 125) & (dlFdSchedData.numOfPrb = 32) & (dlFdSchedData.beamType = SSB) & (dlFdSchedData.rtBeamFailureReason = PATTERNIDINVALID)
RATIO: 1
