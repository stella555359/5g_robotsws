[Global]
LOGDIR: D:\TA\A2A

TTITRACE_TAG_1:tti_rt_dl.csv

DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.ackNack != -)&(rnti = 1~65534)
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.numOfLayers != -)&(rnti = ${ue1_rnti})&(rnti = ${ue2_rnti})
CHECK_POINT: dlFdSchedData.numOfLayers = RANK2
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.numOfLayers != -)&(rnti = ${ue3_rnti})&(rnti = ${ue4_rnti})
CHECK_POINT: dlFdSchedData.numOfLayers = RANK4
RATIO: 1


[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.beamType != -
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 1


[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (csiRsSchedData.patternId1 != -)&(csiRsSchedData.patternId2 != -)&(csiRsSchedData.patternId3 != -)&(csiRsSchedData.patternId4 != -)
CHECK_POINT: (csiRsSchedData.patternId1 = 1138)&(csiRsSchedData.patternId2 = 1138)&(csiRsSchedData.patternId3 = 1139)&(csiRsSchedData.patternId4 = 1139)
RATIO: 1




