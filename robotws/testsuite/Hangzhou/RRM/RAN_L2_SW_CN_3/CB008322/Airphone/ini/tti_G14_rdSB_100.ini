[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER:(srsState = 'SBSRS')&(corrSquareM10000 = 10000)&(volatilityStatus !='EARLYSBSRSCORR')
CHECK_POINT: volatilityStatus = 'HIGHCHANNELVOLATILEUE'
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER:(srsState = 'WBSRS')&(corrSquareM10000 != -10000)
CHECK_POINT: volatilityStatus = 'LOWCHANNELVOLATILEUE'
RATIO: 1


