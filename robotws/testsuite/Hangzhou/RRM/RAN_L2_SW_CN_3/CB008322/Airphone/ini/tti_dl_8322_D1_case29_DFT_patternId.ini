[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 1

#beamtype:DFT
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.beamType = 	${beam_type}
RATIO: 1

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
CHECK_POINT: dlBeamData.dlSrsBmBestBeamPatternId = ${best_patternId}
RATIO: 1

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
CHECK_POINT: dlBeamData.dlSrsBmPairBeams1stPatternId = ${patternId1}
RATIO: 1

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
CHECK_POINT: dlBeamData.dlSrsBmPairBeams2ndPatternId = ${patternId2}
RATIO: 1




