[Global]
LOGDIR: D:\TA\A2A

TTITRACE_TAG_1:tti_dl.csv

DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.ackNack != -)&(rnti = 1~65534)
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.numOfLayers != -
CHECK_POINT: dlFdSchedData.numOfLayers = RANK4
RATIO: 1


[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.beamType != -)&(rnti = ${ue1_rnti})
CHECK_POINT: dlFdSchedData.beamType = DFTNONTAPERING
RATIO: 1

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.beamType != -)&(rnti = ${ue2_rnti})
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 1


