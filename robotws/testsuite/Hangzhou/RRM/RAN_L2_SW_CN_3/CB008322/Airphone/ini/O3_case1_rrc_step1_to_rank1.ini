[Global]
TM500PROTOCOLLOG_TAG_1: egate_console.log.00*
DOMAIN: Default
LOGDIR: D:\TA\A2A

##======CP_1:check UE's codebook switch from 2 port to 1 port when increase UL Pathloss,and the nonCoherent function active
[Tm500ProtocolLog_1 CP_1]
CHECK_FILE: egate_console.log.00*
CHECK_TYPE: 0
CHECK_POINT:DL-DCCH-Message.rrcReconfiguration.rrcReconfiguration.nonCriticalExtension.CONTAINING.spCellConfig.spCellConfigDedicated.uplinkConfig.uplinkBWP-ToAddModList.None.bwp-Dedicated.setup.codebookSubset = nonCoherent
REPEAT_NUM: 1

##======CP_2: check when UE's codebook switch from 2 port to 1, the maxRank is 1
[Tm500ProtocolLog_1 CP_2]
CHECK_FILE: egate_console.log.00*
CHECK_TYPE: 0
CHECK_POINT:DL-DCCH-Message.rrcReconfiguration.rrcReconfiguration.nonCriticalExtension.CONTAINING.spCellConfig.spCellConfigDedicated.uplinkConfig.uplinkBWP-ToAddModList.None.bwp-Dedicated.setup.maxRank = 1
REPEAT_NUM: 1

##======CP_3:check only codebook resourece been reconfig
[Tm500ProtocolLog_1 CP_3]
CHECK_FILE: egate_console.log.00*
CHECK_TYPE: 0
CHECK_POINT:DL-DCCH-Message.rrcReconfiguration.rrcReconfiguration.nonCriticalExtension.CONTAINING.spCellConfig.spCellConfigDedicated.uplinkConfig.uplinkBWP-ToAddModList.None.bwp-Dedicated.setup.txConfig = codebook
REPEAT_NUM: 1

##======CP_4:check the codebook resource is periodic
[Tm500ProtocolLog_1 CP_4]
CHECK_FILE: egate_console.log.00*
CHECK_TYPE: 0
CHECK_POINT:DL-DCCH-Message.rrcReconfiguration.rrcReconfiguration.nonCriticalExtension.CONTAINING.spCellConfig.spCellConfigDedicated.uplinkConfig.uplinkBWP-ToAddModList.None.bwp-Dedicated.setup_1.srs-ResourceToAddModList.None.periodic.periodicityAndOffset-p_sl160 = 3
