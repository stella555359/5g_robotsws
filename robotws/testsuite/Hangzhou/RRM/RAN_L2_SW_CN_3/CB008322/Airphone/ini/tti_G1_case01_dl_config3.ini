[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default


[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.ackNack != -)
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

#RT
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.beamType != -)
CHECK_POINT: (dlFdSchedData.startPrb = 32) & (dlFdSchedData.numOfPrb = 240) & (dlFdSchedData.beamType = SUBBAND) & (dlFdSchedData.rtBeamFailureReason = NOFAILURE)
RATIO: 0.9

#dft
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.numOfPrb = 193)
CHECK_POINT: (dlFdSchedData.startPrb = 32) & (dlFdSchedData.beamType = DFTNONTAPERING) & (dlFdSchedData.rtBeamFailureReason = SMALLPRBLIMIT)
RATIO: 1
