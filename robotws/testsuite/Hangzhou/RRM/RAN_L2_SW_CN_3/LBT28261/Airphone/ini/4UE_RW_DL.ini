[Global]
LOGDIR: ${TEST_LOG_DIRECTORY()}/All/
TTITRACE_TAG_1:tti_dl.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.999

[TtiTrace_1 CP_2]
FILTER: (dlFdSchedData.priorityIndex != -)&(rnti = ${ue1_rnti})
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.priorityIndex  = P26_LARGEBUFFERTRAFFIC
RATIO: 0.4

[TtiTrace_1 CP_3]
FILTER: (dlFdSchedData.priorityIndex != -)&(rnti = ${ue2_rnti})
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.priorityIndex  = P26_LARGEBUFFERTRAFFIC
RATIO: 0.4

[TtiTrace_1 CP_4]
FILTER: (dlFdSchedData.priorityIndex != -)&(rnti = ${ue3_rnti})
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.priorityIndex  = P26_LARGEBUFFERTRAFFIC
RATIO: 0.4

[TtiTrace_1 CP_5]
FILTER: (dlFdSchedData.priorityIndex != -)&(rnti = ${ue4_rnti})
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.priorityIndex  = P26_LARGEBUFFERTRAFFIC
RATIO: 0.4
