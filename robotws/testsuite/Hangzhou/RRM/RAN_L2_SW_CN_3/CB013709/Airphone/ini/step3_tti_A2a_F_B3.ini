[Global]
LOGDIR: D:\TA\A2A

TTITRACE_TAG_1:${tti_tag}_dl.csv

DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlLoadControlData.measurementInfo.loadType = LOADTYPEMIXED)
CHECK_POINT: dlLoadControlData.measurementInfo.slotProcessingDurationBudget = 500
RATIO: 0.99

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlLoadControlData.measurementInfo.loadType = LOADTYPEDLONLY)
CHECK_POINT: dlLoadControlData.measurementInfo.slotProcessingDurationBudget = 500
RATIO: 0.99

[TtiTrace_1 CP_13]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.numOfPrb > 0) & (physCellId = 53)
CHECK_POINT: (slot = 3) | (slot = 13) 
RATIO: 0.01