[Global]
LOGDIR: D:\TA\A2A

TTITRACE_TAG_1:${tti_tag}_ul.csv

DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (physCellId = 50) & (ulLoadControlData.measurementInfo.loadType = LOADTYPEMIXED)
CHECK_POINT: ulLoadControlData.measurementInfo.slotProcessingDurationBudget = 500
RATIO: 0.99

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (physCellId = 52) & (ulLoadControlData.measurementInfo.loadType = LOADTYPEMIXED)
CHECK_POINT: ulLoadControlData.measurementInfo.slotProcessingDurationBudget = 750
RATIO: 0.99

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (physCellId = 55) & (ulLoadControlData.measurementInfo.loadType = LOADTYPEMIXED)
CHECK_POINT: ulLoadControlData.measurementInfo.slotProcessingDurationBudget = 750
RATIO: 0.99

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.K2 != -) & (physCellId = 50)
CHECK_POINT: (ulFdSchedData.K2 = 3) | (ulFdSchedData.K2 = 65535)
RATIO: 0.99

[TtiTrace_1 CP_5]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.K2 != -) & (physCellId = 52)
CHECK_POINT: (ulFdSchedData.K2 = 2) | (ulFdSchedData.K2 = 65535)
RATIO: 0.99

[TtiTrace_1 CP_6]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulHarqRxData.dtx != -
CHECK_POINT: ulHarqRxData.dtx = NON_DTX
RATIO: 0.98

[TtiTrace_1 CP_7]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulHarqRxData.crcResult != -
CHECK_POINT: ulHarqRxData.crcResult = OK
RATIO: 0.98