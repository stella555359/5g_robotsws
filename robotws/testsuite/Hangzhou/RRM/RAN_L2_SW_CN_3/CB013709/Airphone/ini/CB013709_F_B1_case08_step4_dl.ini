[Global]
LOGDIR: D:\TA\A2A

TTITRACE_TAG_1:${tti_tag}_dl.csv

DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlLoadControlData.measurementInfo.loadType = LOADTYPEMIXED) & (physCellId = 50)
CHECK_POINT: dlLoadControlData.measurementInfo.slotProcessingDurationBudget = 750
RATIO: 0.99

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlLoadControlData.measurementInfo.loadType = LOADTYPEMIXED) & (physCellId = 53)
CHECK_POINT: dlLoadControlData.measurementInfo.slotProcessingDurationBudget = 750
RATIO: 0.99

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.2

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.numOfPrb > 0) & (physCellId = 50)
CHECK_POINT: (slot = 0) | (slot = 1) | (slot = 6) | (slot = 7) | (slot = 8) | (slot = 9) | (slot = 10) | (slot = 11) | (slot = 16) | (slot = 17) | (slot = 18) | (slot = 19)
RATIO: 1