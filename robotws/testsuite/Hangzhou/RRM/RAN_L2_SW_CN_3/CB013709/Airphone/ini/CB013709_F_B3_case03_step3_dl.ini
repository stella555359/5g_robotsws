[Global]
LOGDIR: D:\TA\A2A

TTITRACE_TAG_1:${tti_tag}_dl.csv

DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.muStatus != -
CHECK_POINT: dlFdSchedData.muStatus = MUPAIR
RATIO: 0.20

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.ackNack != -
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.98

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.numOfPrb > 0) & (physCellId = 52)
CHECK_POINT: (slot = 0) | (slot = 1) | (slot = 2) | (slot = 3) | (slot = 4) | (slot = 5) | (slot = 6) | (slot = 10) | (slot = 11) | (slot = 12) | (slot = 13) | (slot = 14) | (slot = 15) | (slot = 16)
RATIO: 1

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (dlFdSchedData.numOfPrb > 0) & (physCellId = 55)
CHECK_POINT: (slot = 0) | (slot = 1) | (slot = 2) | (slot = 3) | (slot = 4) | (slot = 5) | (slot = 6) | (slot = 10) | (slot = 11) | (slot = 12) | (slot = 13) | (slot = 14) | (slot = 15) | (slot = 16)
RATIO: 1