[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:tti_dl.csv
DOMAIN: Default

#UE1-6 DFT
[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (rnti != ${rnti_7}) & (dlBeamData.${filter_name} != -)
CHECK_POINT: dlBeamData.${filter_name} = 1480
RATIO: 1

#UE7 GoB
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: (dlBeamData.${filter_name} != -)&(rnti = ${rnti_7})
CHECK_POINT: dlBeamData.${filter_name} = 65535
RATIO: 1

#CSI-RS
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
#FILTER: (csiSrReportData.i1Codebook4AntPorts == [3, 7, 1]) & (csiSrReportData.i2Codebook4AntPorts == 0)
CHECK_POINT: (csiSrReportData.csiReport.pmiBeamPatternId1 = 1307)
RATIO: 1

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.999
