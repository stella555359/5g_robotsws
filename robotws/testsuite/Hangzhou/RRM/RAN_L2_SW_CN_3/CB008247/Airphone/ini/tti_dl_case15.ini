[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${path_tti}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: dlFdSchedData.ackNack = ACK
RATIO: 0.99

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: dlBeamData.dlSrsBmBestBeamPatternId != 65535
CHECK_POINT: (dlBeamData.dlSrsBmBestBeamPatternId = ${patter_id1}) | (dlBeamData.dlSrsBmBestBeamPatternId = ${patter_id2})
RATIO: 0.99