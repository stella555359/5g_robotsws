#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.beamType != -
CHECK_POINT: dlFdSchedData.beamType = SUBBAND
RATIO: 0.35

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: dlFdSchedData.muStatus != -
CHECK_POINT: dlFdSchedData.muStatus = MUPAIR
RATIO: 0.01