[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.crcResult = OK
RATIO: 1

#X<thr,only one subcell used, pair ratio=1
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: physCellId = 50
CHECK_POINT: (ulFdSchedData.subcellId = 0)&(ulFdSchedData.ulMuStatus=MUPAIRED_NO_TAPERING)
RATIO: 1

#only 1+1 pair, there're 2 virtual UE,virtualUeIndex=0,1
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
FILTER: physCellId = 50
CHECK_POINT: ulFdSchedData.virtualUeIndex=1
RATIO: >0
