[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

#US2, only rank1 pair on primary subcell

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
FILTER: physCellId = 50
CHECK_POINT: ulFdSchedData.virtualUeIndex=255
RATIO: 1

#subcell_0 used
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: physCellId = 50
CHECK_POINT: ulFdSchedData.subcellId=0
RATIO: 1
