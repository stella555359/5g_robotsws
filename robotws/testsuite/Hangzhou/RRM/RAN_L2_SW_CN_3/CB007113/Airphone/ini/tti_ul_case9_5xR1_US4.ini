[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

#US4, full 4 layers pair

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
FILTER: physCellId = 50
CHECK_POINT: (ulFdSchedData.ulMuStatus=MUPAIRED_NO_TAPERING)
RATIO: >0

#subcell_0&1 used
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
FILTER: physCellId = 50
CHECK_POINT: (ulFdSchedData.subcellId=1)
RATIO: >0
