[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.crcResult = OK
RATIO: 0.999

#subcellid=0
[TtiTrace_1 CP_2]
CHECK_TYPE: 0
CHECK_POINT: ulFdSchedData.subcellId = 0
RATIO: 1

#pair ratio=0
[TtiTrace_1 CP_3]
CHECK_TYPE: 0
CHECK_POINT: ulFdSchedData.virtualUeIndex=255
RATIO: 1

#<28SINR<35
[TtiTrace_1 CP_4]
CHECK_TYPE: 0
CHECK_POINT: ulFdSchedData.reScaledCorrAvgSinrReqPrb = 28~40
RATIO: 1

#only antport 1
[TtiTrace_1 CP_5]
CHECK_TYPE: 0
CHECK_POINT:ulFdSchedData.antPort=32768
RATIO: 1





