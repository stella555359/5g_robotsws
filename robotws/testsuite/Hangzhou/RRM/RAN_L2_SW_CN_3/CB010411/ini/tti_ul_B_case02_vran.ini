[Global]
LOGDIR: D:\TA\A2A
TTITRACE_TAG_1:${tti_title_tag}
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.numOfLayers != -

CHECK_POINT: ulFdSchedData.numOfLayers = RANK2

RATIO: 1

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: (ulFdSchedData.antPort != 0) & (ulFdSchedData.antPort != -)
CHECK_POINT: (ulFdSchedData.antPort = 12288) | (ulFdSchedData.antPort = 49152) 
RATIO: 0.9

[TtiTrace_1 CP_3]
CHECK_TYPE: 0
CHECK_POINT: ulHarqRxData.crcResult = OK
RATIO: 0.999

[TtiTrace_1 CP_4]
CHECK_TYPE: 0
FILTER:(ulFdSchedData.antPort != -)& (ulFdSchedData.antPort != 0)
CHECK_POINT: ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING
RATIO: 0.9
[TtiTrace_1 CP_5]
CHECK_TYPE: 0
CHECK_POINT: (ulFdSchedData.subcellId = 0) | (ulFdSchedData.subcellId = 1) 
RATIO: 0.9
