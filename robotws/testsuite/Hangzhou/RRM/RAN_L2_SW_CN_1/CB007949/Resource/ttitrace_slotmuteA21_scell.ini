#Check slot mute from ttitrace.

[Global]
LOGDIR:$PWD\config\CB007949_ET_A_21\ttitrace_slotmuteA21_scell.ini
TTITRACE_TAG_1:output_dl.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
#0:meet 1:not meet
CHECK_TYPE: 0
CHECK_FILE: output_dl.csv
FILTER: (rnti != 65535) & (slot=5|15) & (physCellId=53)
CHECK_POINT: dlFdSchedData.DlBufBasedDowngradedTbSize = *
Ratio: 1