[TtiTrace_1 CP_3]

CHECK_TYPE: 0
FILTER: (type = ulPreTdBlockUeData) & (physCellId = 50)
CHECK_POINT:   cs1BlockUeList = [{'rnti': ${UE1_CRNTI},  'reason': 'CS1_ULOVERLAPPINGSLOTFORTDDFDDULCA'}]
