set PDN_IP3="4.7.254.211"


#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=0,100,200,258,788 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$DAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on ims_voice_3gpp=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR

#add ims_voice_3gpp support
amf_param id=1 ims_voice_3gpp=on full_nas_auth=on

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x01:22 daemon=$SERVER_IP:$DAEMON_PORT x2_peers=none xn=$GNB_XN_ADDR amf=1

set_cell id=1 gnb=2 pci=16:2 tac=200 nrci=0x05 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=136100:126900 gscn=1587 mandatory_for_activation=off
set_cell id=2 gnb=2 pci=17:0 tac=200 nrci=0x01 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=376500:392500 gscn=4907 mandatory_for_activation=off
set_cell id=3 gnb=2 pci=17:1 tac=200 nrci=0x02 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=349000:431000 gscn=5389 mandatory_for_activation=off
set_cell id=11 gnb=2 pci=20:0 tac=200 nrci=0x03 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=663334:663334 gscn=8158 mandatory_for_activation=off
set_cell id=12 gnb=2 pci=20:1 tac=200 nrci=0x04 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=529002:529002 gscn=6609 mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$DAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=$UEC_ADDR/26 

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$SERVER_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB1_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=4:2 tac=222 proxy=$SERVER_IP:12219 earfcn=2000:20000 mapped_earfcn=4200:22200
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on serving_cell_index_range_scg=8:14

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 tac_list=777,111,222,444,333
set_mme id=1 ip=$SERVER_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte pool=1:1
set_sgw id=1 ip=$SERVER_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:2153
set_pgw id=1 type=simulated ip=$SERVER_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs

