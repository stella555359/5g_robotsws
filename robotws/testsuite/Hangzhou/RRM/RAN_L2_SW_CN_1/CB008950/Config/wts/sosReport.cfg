################### TCPDUMP PARAMETERS
CHUNK_SIZE=20
CHUNK_MAX_COUNT=50
BIP_NUMBER_OF_FILES=20 # number of files created, tcpdump -W
BIP_FILE_SIZE_MBYTES=100 # size of file create, tcpdump -C
################### VERSIONING USED FOR AP / ASIK+ABIL
# LONER_VERSION e.G D for loner newer than loner_R51-TDD-CPRI.0.0.20190624-100816, for other cases.
# Can be A/B/C/D/E, depend on your loner version, check help from start script for more information.
LONER_VERSION=X
# PHONER_VERSION default PH4 for phoner newer than Phoner_R54_2019_w46_01, for other cases, check help from start script
# Can be PH2 / PH4 / PH7
PHONER_VERSION=X
# Depend on your configuration choose l1bypass or fullstack
L1_MODE=X
MIRRORING_METHOD=X
GNB_SNAPSHOT_METHOD=AaShell
# sosreport logs path on the VM to store the logs
SOSREPORT_VM_DIR=/tmp/sosReport
# Configures the method used for gNB snapshot collection :
#   "AaShell" for legacy method (log -a -z | nc 0 15007)  or
#   "taf_admin" for taf.sbts.oam.admin collect_snapshot keyword (also used by WebEM)
# For any other value both methods are used (2 snapshots collected : time and resources consuming !)
################### IPHY 1
# IP of IPHY
IPHY_FCT_IP_1=192.168.200.1
# Filter to get iphy syslog (directory/*name*)
IPHY_SYSLOG_FILTER_1=/opt/iphy/latest/*iphy*
# IP of Classical BTS
BTS_IP_1=192.168.255.129
# Filter to get enb syslog (directory/*name*)
BTS_SYSLOG_FILTER_1=/opt/iphy/latest/*enb*
# IP of FHGW - only applicable to AP / ASIK+ABIL
FHGW_IP_1=10.53.62.132
# FHGW load logs path (default value 2014)  only applicable to AP / ASIK+ABIL:
# if set to 2009 FHGW: fpga logs fpgaAgent* from /var/log/fpgaAgent, supervisord* and fhgw* from /var/log/RUOAM/ruproxy-1/log
