#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set DAEMON_IP=$CONTAINER_IP
set SERVER_IP=$CONTAINER_IP
set DAEMON_PORT=22222


set GNB_NG_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"
## Variables for NSA configuration 
set ENB1_S1_ADDR="10.0.1.136"
set GNB_S1U_ADDR="10.0.1.2"
set ENB1_X2_ADDR="10.0.1.121"
set GNB_X2_ADDR="10.0.1.2"
set MME1_S1_ADDR="10.0.1.131"
set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"
set ENB_X2U_ADDR="10.0.1.121"
set PGW_ADDR="4.7.254.207"
set PDN_IP="4.7.254.208"

set EDAEMON_PORT="22222"

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=2 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x00002 daemon=$CONTAINER_IP:$EDAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR xp_management=on xp=10.0.1.121:32742 xpu=10.0.1.121:32742 type=simulated x2_peers=none


enb_param id=2 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=2 bw=10MHz eci=0x0000201 pci=3:2 tac=222 proxy=$CONTAINER_IP:12219 earfcn=68771:133307 mandatory_for_activation=off
enb_endc_param id=2 control_flow_period=3gpp1 use_nr_ran_cont=on

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=1 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x76C daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none amf=1 xp_management=on xp=10.0.1.2:32742 xpu=10.0.1.2:32742 plmnList=311:489  nssai=0x1:0xd143a5,0x2:0xd143a5,0x3:0xd143a5,0x4:0xd143a5
set_cell id=1 gnb=1 pci=16:2 tac=788 nrci=0x01 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=136300:127100 mandatory_for_activation=off
#---------------------------------------------------------------------------------------------------
#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 tac_list=777,111,222,444,333
set_mme id=1 ip=$DAEMON_IP:$EDAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$EDAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100
set_pgw id=1 type=simulated ip=$DAEMON_IP:$EDAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13


#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on ambr_remove=nas_transport,pdu_setup
#amf_param id=1 full_nas_auth=on
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=$UEC_ADDR/26 file=AirPhoneConfig_2063.xml
#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION for SA call  UE id 1-10 will be used
#---------------------------------------------------------------------------------------------------
set_ue simulated id=1 uec=1 release=15 enb=1 cell=1 mode=nr idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400
ue_param id=1 ue_nr_

