set DAEMON_IP="10.0.2.1"
set DAEMON_PORT=22222

set ENB1_S1_ADDR="10.0.1.136"
set GNB_S1U_ADDR="10.0.1.3"

set ENB1_X2_ADDR="10.0.1.1"
set GNB_X2_ADDR="10.0.1.2"

set MME1_S1_ADDR="10.0.1.131"

set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"

set ENB_X2U_ADDR="10.0.1.135"
set PGW_ADDR="4.7.254.207"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"

#-----------------------------------------------------------------------------------------------------
#-- ENB CONFIGURATION
#-----------------------------------------------------------------------------------------------------
set_enb id=1 plmn=250:255 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$DAEMON_IP:12219 earfcn=2000:20000 mapped_earfcn=4200:22200 tdd_cell=on mandatory_for_activation=off
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on serving_cell_index_range_scg=1:7

#-----------------------------------------------------------------------------------------------------
#-- GNB CONFIGURATION
#-----------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=250:255 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 x2_peers=none
set_cell id=101 gnb=2 nr_arfcn=2071591:2071591 eci=0x000021f pci=33:2 tac=4 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x3FFF tdd_cell=on mandatory_for_activation=off
set_cell id=102 gnb=2 nr_arfcn=2079591:2079591 eci=0x000021f pci=34:0 tac=4 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x3FFF tdd_cell=on mandatory_for_activation=off

#-----------------------------------------------------------------------------------------------------
#-- EPC CONFIGURATION
#-----------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=250:255 tac_list=777,111,222,444,333,1
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:2153
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs

#-----------------------------------------------------------------------------------------------------
#-- UEC CONFIGURATION
#-----------------------------------------------------------------------------------------------------
set_uec id=1 ip=$DAEMON_IP:$DAEMON_PORT pdn=1 devtype=tun addr=72.22.0.1/24 peer=$DAEMON_IP:2152 gtpu=off retries=3 file=AirPhoneConfig.xml

