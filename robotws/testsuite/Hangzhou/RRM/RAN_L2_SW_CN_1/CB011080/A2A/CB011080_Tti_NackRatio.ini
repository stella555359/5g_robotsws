[Global]
LOGDIR: ./
TTITRACE_TAG_1: output_dl_formated.csv
TTITRACE_TAG_2: output_ul_formated.csv
DOMAIN: Default



[TtiTrace_1 CP_1]

CHECK_TYPE: 0
FILTER: (type = dlFdSchedData)
CHECK_POINT:   ackNack  = ACK
RATIO: 0.99


[TtiTrace_2 CP_1]

CHECK_TYPE: 0
FILTER: (type = ulHarqRxData)
CHECK_POINT:   crcResult = OK
RATIO: 0.99