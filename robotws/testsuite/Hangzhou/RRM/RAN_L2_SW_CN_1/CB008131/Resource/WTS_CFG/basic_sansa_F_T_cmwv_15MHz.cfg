#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set DAEMON_IP=$CONTAINER_IP
set SERVER_IP=$CONTAINER_IP
set DAEMON_PORT=22222
set GNB_NG_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"
set EDAEMON_PORT="22222"


## Variables for NSA configuration

set ENB1_S1_ADDR="10.0.1.136"
set GNB_S1U_ADDR="10.0.1.112"

set ENB1_X2_ADDR="10.0.1.135"
set GNB_X2_ADDR="10.0.1.2"

set MME1_S1_ADDR="10.0.1.131"

set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"

set ENB_X2U_ADDR="10.0.1.135"
set PGW_ADDR="4.7.254.207"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$DAEMON_IP:12219|$DAEMON_IP:8889 earfcn=900:18900 mandatory_for_activation=off
#enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on serving_cell_index_range_scg=8:14

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 tac_list=777,111,222,444,333
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:2153
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs
#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x76C daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none amf=1 plmnList=311:489 nssai=0x1:0xd143a5
set_cell id=1 gnb=2 pci=16:2 tac=200 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=518580:518580 mandatory_for_activation=on gscn=6480
set_cell id=2 gnb=2 pci=17:0 tac=200 nrci=0x02 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=134300:125120 mandatory_for_activation=off gscn=1561

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=$UEC_ADDR/26

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
#Capa_FT2CC: n71+n41；n66+n41
#set Capa_
#Capa_Full with dynamicbetaoffset: n66+n71；n71+n41；n66+n41；n66+n78; n41+n78；n71+n78；n66+n66+n71
#set Capa_
#Capa_QC reference from QC UE
set Capa_
#CA NSA UE
set Capa_

#UE Id=1-10 for SA
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=2
#ue_param id=1 ue_nr_
ue_param id=1 ue_nr_capabilities=$Capa_QC

#UE id 11-20 for NSA
set_ue simulated id=11 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 imsi=311:489:21645500
#ue_param id=11 ue_nr_ dual_conn=eutra_nr ue_eutra_nr_
ue_param id=11 ue_nr_capabilities=$Capa_QC dual_conn=eutra_nr ue_eutra_nr_capabilities=$Capa_LTE

set_ue simulated id=12 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 imsi=311:489:21645501
#ue_param id=11 ue_nr_ dual_conn=eutra_nr ue_eutra_nr_
ue_param id=12 ue_nr_capabilities=$Capa_QC dual_conn=eutra_nr ue_eutra_nr_capabilities=$Capa_LTE
#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------

qosflow_set id=1 5qi=6 default=on
set_nwslice id=1 snssai=0x01:0xd143a5             amf=1 default=on ue=all

set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=11 ue_nat_ip=72.23.0.11 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=12 ue_nat_ip=72.23.0.12 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
#---------------------------------------------------------------------------------------------------
#OTHER CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_bearer id=2 ue=11 qci=9 pdn=1 ip=$PDN_IP default=on ul_nat_gw=$SERVER_IP dl_nat_gw=$SERVER_IP trf_type=internal
set_bearer id=2 ue=12 qci=9 pdn=1 ip=4.7.254.209 default=on ul_nat_gw=$SERVER_IP dl_nat_gw=$SERVER_IP trf_type=internal

uec_param id=1 reordering_window_size=1000 reordering_timer=200

debug_log level=0

sim_debug_log level=1 mme=1
sim_debug_log level=1 uec=1
sim_debug_log level=1 pgw=1
sim_debug_log level=1 sgw=1

link_ctrl_param use_hb=off

trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on

sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
sim_trace uec=1 protocol=all on
sim_trace amf=1 protocol=all on

cfg_end

set_log log_to_file=on
start version_check=off
