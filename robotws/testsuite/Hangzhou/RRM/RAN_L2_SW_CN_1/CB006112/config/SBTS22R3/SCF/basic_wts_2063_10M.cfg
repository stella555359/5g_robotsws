enb_endc_param id=2 control_flow_period=3gpp1 use_nr_ran_cont=on


#---------------------------------------------------------------------------------------------------

#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=1 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x76C daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none amf=1 xp_management=on xp=10.0.1.2:32742 xpu=10.0.1.2:32742 plmnList=311:489  nssai=0x1:0xd143a5,0x2:0xd143a5,0x3:0xd143a5,0x4:0xd143a5
set_cell id=1 gnb=1 pci=16:2 tac=788 nrci=0x01 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=136300:127100 mandatory_for_activation=off
#---------------------------------------------------------------------------------------------------

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
