#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=2 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x00002 daemon=$CONTAINER_IP:$EDAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR xp_management=on xp=10.0.1.1:32742 xpu=10.0.1.1:32742 type=simulated x2_peers=none

