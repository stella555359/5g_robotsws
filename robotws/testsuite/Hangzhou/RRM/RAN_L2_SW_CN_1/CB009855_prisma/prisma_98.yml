lsu_s1:
    type: ue.prisma.lsu
    executor: tl.core.lsu_s1_ssh_connection_details
    script_paths:
        start_epc: ^cd /home/user/;./start_epc
        init_epc: cd /home/user/;./init_epc
        get_epc_log: NA
        clean_epc_log:  NA
        stop_epc: echo `pidin|grep start_epc|grep -v 'grep'|awk '{print $1}'`|xargs -I {} kill -9 {}
        start_lsu: lsustop;lsuclean;lsustart
        clean_lsu: lsuclean
        stop_lsu: lsustop
 
tstm_s1:
    type: ue.prisma.tstm
    executor: tl.core.tstm_s1_ssh_connection_details
    script_paths:
        start_tstm: cd /usr/local/S1_Tm-CI_QNX6.5_t4_C-nto_Sep17/bin/; ./s1_tm sched/MultiSchedule.tsm -r M -n 2 -c 1 -p 9001 -l ../log/epc.log -y 4 -m 1000
        stop_tstm: echo `pidin|grep tm|grep -v 'grep'|awk '{print $1}'`|xargs -I {} kill -9 {}

lsu_uu:
    type: ue.prisma.lsu
    executor: tl.ues[0].lsu_uu_ssh_connection_details
    script_paths:
        create_5g_cell: /home/user/bin/8542_5g_tdd;/home/user/bin/8542_5g_fdd
        create_4g_cell: cd /home/user/bin/;./8542_lte
        get_4g_cell_id: cat /res/sdr/state/ltefdd.ue/05 | grep CELL_ID |awk '{print $3}'
        get_5g_cell_id: trcinfo -p0-1 | grep -i cellid |tail -1 |awk '{print $13}'|cut -d'=' -f2
        get_ra_status: trcinfo -p0-5 | grep -i contention
 
tstm_uu:
    type: ue.prisma.tstm
    executor: tl.ues[0].tstm_uu_ssh_connection_details
    script_paths:
        start_tstm: cd /home/user/bin/; nohup ./startUU> nohup_uu.out 2>&1 &
        get_tstm_log: cd /home/user/bin/;tail -n 1000 -f ./nohup_uu.out
        clean_tstm_log: cd /home/user/bin/;cat /dev/null > ./nohup_uu.out
        stop_tstm: ps -ef | grep tm | grep -v 'grep' | awk '{print $2}' | xargs kill -9
 
