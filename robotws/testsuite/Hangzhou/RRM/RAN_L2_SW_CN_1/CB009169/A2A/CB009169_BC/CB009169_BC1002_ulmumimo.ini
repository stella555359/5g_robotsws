[Global]
LOGDIR:
TTITRACE_TAG_1:output_ul.csv
DOMAIN: Default

[TtiTrace_1 CP_1]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER: ulFdSchedData.UlBufBasedDowngradedTbSize != -
CHECK_POINT: (ulHarqRxData.crcResult = OK) & (ulHarqRxData.dtx = NON_DTX) 
RATIO: 0.95

[TtiTrace_1 CP_2]
CHECK_TYPE: 0
#1:NOT MEET, 0:MEET
FILTER:(ulFdSchedData.antPort != -)& (ulFdSchedData.antPort != 0)& (physCellId = 61)
CHECK_POINT: ulFdSchedData.ulMuStatus = MUPAIRED_NO_TAPERING
RATIO: 0.95
