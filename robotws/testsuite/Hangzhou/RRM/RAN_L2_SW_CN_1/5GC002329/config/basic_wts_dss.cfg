#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"         
set DAEMON_IP="10.0.2.1"
  
set DAEMON_PORT=22222
set SERVER_IP=$CONTAINER_IP


set ENB1_S1_ADDR="10.0.1.136"
set GNB_NG_ADDR="10.0.1.2"
set MME1_S1_ADDR="10.0.1.131"
set SERVER_ADDR="10.0.1.132"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
#set UPF_ADDR="1.2.3.1"
set UPF_ADDR="1.2.4.1"

set EDAEMON_PORT="22222"

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=2 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x00001 daemon=$CONTAINER_IP:$DAEMON_PORT xp_management=on xp=10.0.1.1:32742 xpu=10.0.1.1:32742 type=simulated x2_peers=none
enb_param id=2 drb_id_begin=3
enb_param id=2 endc_capable_qci=9
enb_endc_param id=2 control_flow_period=3gpp1 use_nr_ran_cont=on
set_cell id=1 enb=2 bw=10MHz eci=0x0000101 pci=3:2 tac=222 proxy=$CONTAINER_IP:12219 earfcn=68771:133307

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on ambr_remove=nas_transport,pdu_setup
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR
#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=1 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x76C daemon=$SERVER_IP:$EDAEMON_PORT xp_management=on xp=10.0.1.2:32742 xpu=10.0.1.2:32742 x2_peers=none amf=1
set_cell id=1 gnb=1 pci=16:2 tac=200 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=518580:518580 mandatory_for_activation=off
set_cell id=2 gnb=1 pci=17:0 tac=200 nrci=0x02 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=134980:127180 mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 eq_plmn=250:255 tac_list=777,111,222,444,333
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=$UEC_ADDR/26 file=/opt/iphy/latest/DSS.xml
#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 enb=1 cell=1 mode=nr
ue_param id=1 ue_nr_
set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_ue simulated id=3 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645402 enb=1 cell=1 mode=nr
ue_param id=3 ue_nr_
set_pdu_gateway id=3 ue_nat_ip=72.23.2.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------

qosflow_set id=1 5qi=5
qosflow_set id=2 5qi=1
qosflow_set id=3 5qi=6 default=on
qosrule_set id=1 proto=tcp qos_flow=3
qosrule_set id=2 proto=udp qos_flow=2
#pgw_set daemon=10.0.2.1:22222
nwslice_set id=1 qos_flows=1,2,3 qos_rules=1,2 snssai=0x01:0xD143A5 default=on ue=all amf=1
ue_nr_capabilities id=3 voice_over_nr=on:on:off
ue_param id=3 nr_usage_setting=voice_centric
amf_param id=1 ims_voice_3gpp=on



debug_log level=0

sim_debug_log level=1 mme=1
sim_debug_log level=0 uec=1
sim_debug_log level=1 pgw=1
sim_debug_log level=1 sgw=1

link_ctrl_param use_hb=off

trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on

sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
sim_trace uec=1 protocol=all on
sim_trace amf=1 protocol=all on

cfg_end

set_log log_to_file=on
start version_check=off
