#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP

set GNB_NG_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

set EDAEMON_PORT="22222"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"


#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+aes+snow3g+zuc nea=null+aes+snow3g+zuc ims_voice_3gpp=on
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=20 n4_snd_buff_size=20M n4_rcv_buff_size=20M

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION NR-ARFCN values UL:DL
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x76C daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none amf=1
set_cell id=1 gnb=2 pci=17:0 tac=200 tdd_cell=off nrci=0x01 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=390000:428000 gscn=5350 mandatory_for_activation=off
set_cell id=2 gnb=2 pci=17:1 tac=200 tdd_cell=on nrci=0x02 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2071591:2071591 gscn=22446 mandatory_for_activation=off
#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 sctp_rto_min=100 proxy_snd_buf_size=20000000 proxy_rcv_buf_size=20000000 tun_snd_buff_size=20000000 tun_rcv_buff_size=20000000 proxy_read_packets_threshold=20
#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
#UE_n1A_n257M
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc+snow3g+aes nea=null+zuc+snow3g+aes sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
# set_uec sctp_rto_min=100
ue_param id=1 ue_nr_
set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

#UE_n1A_n257M
set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc+snow3g+aes nea=null+zuc+snow3g+aes sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645402 mode=nr enb=2 cell=1
ue_param id=2 ue_nr_
set_pdu_gateway id=2 ue_nat_ip=72.23.1.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

#UE_n1A_n257M
set_ue simulated id=3 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc+snow3g+aes nea=null+zuc+snow3g+aes sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645404 mode=nr enb=2 cell=1
ue_param id=3 ue_nr_
set_pdu_gateway id=3 ue_nat_ip=72.23.2.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

#UE_n1A_n257M splitDRB with UL Both MCG and SCG is absent
set_ue simulated id=4 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc+snow3g+aes nea=null+zuc+snow3g+aes sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645406 mode=nr enb=2 cell=1
ue_param id=4 ue_nr_
set_pdu_gateway id=4 ue_nat_ip=72.23.3.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_qosflow id=1 5qi=6 default=on
set_qosflow id=2 5qi=5
set_qosflow id=3 5qi=1

qosrule_set id=1 proto=tcp qos_flow=1 #Default QoS flow nonGBR type
qosrule_set id=2 proto=tcp qos_flow=2 #For nonGBR_sIGNALING QoS type
qosrule_set id=3 proto=udp qos_flow=3 #For GBR VoNR QoS type
set_nwslice id=1 snssai=0x01:0xD143A5 default=on ue=all amf=1
amf_ue_ics_param ue=1-4 id=1 indexToRFSP=1 include_ue_capabilities=off

debug_log level=6
sim_debug_log level=1 mme=1
sim_debug_log level=1 uec=1
sim_debug_log level=1 pgw=1
sim_debug_log level=1 sgw=1
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end


set_log log_to_file=on
sim_start version_check=off
