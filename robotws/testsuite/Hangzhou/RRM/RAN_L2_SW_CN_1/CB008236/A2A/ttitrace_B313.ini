#Check log for Handover_of_VoNR_UE_in_SAg_mode_and_SAg_continues_at_target_cell_with_UE_dynamic_betaoffsets.

[Global]
TTITRACE_TAG_1:output_ul.csv
DOMAIN: Default
LOGDIR:

[TtiTrace_1 CP_1]
#0:meet 1:not meet
CHECK_TYPE: 1
CHECK_FILE: output_ul.csv
FILTER:(rnti!=0)&(rnti!=65535)&(physCellId=50)&(ulFdSchedData.puschTPstate=*)
CHECK_POINT: ulFdSchedData.puschTPstate!=2
Ratio: 1

[TtiTrace_1 CP_2]
#0:meet 1:not meet
CHECK_TYPE: 1
CHECK_FILE: output_ul.csv
FILTER:(rnti!=0)&(rnti!=65535)&(physCellId=50)&(ulIntraDlToUlDrxSyncDlData.dlDrxOndurationTimerOn=*)
CHECK_POINT: ulIntraDlToUlDrxSyncDlData.dlDrxOndurationTimerOn!=1
Ratio: 1

[TtiTrace_1 CP_3]
#0:meet 1:not meet
CHECK_TYPE: 1
CHECK_FILE: output_ul.csv
FILTER:(rnti!=0)&(rnti!=65535)&(physCellId=51)&(ulFdSchedData.puschTPstate=*)
CHECK_POINT: ulFdSchedData.ueData.sag1xEnergy!=-255
Ratio: 1

[TtiTrace_1 CP_4]
CHECK_TYPE: 5
FILTER: (rnti!=0)&(rnti!=65535)&(ulFdSchedData.puschTPstate=*)
PARADIGM: ./ttitrace_B313.csv
REPEAT_NUM: 1