[TtiTrace_1 CP_2]
#0:meet 1:not meet
CHECK_TYPE: 1
CHECK_FILE: output_ul.csv
FILTER:(rnti!=0)&(rnti!=65535)&(ulFdSchedData.puschTPstate=*)
