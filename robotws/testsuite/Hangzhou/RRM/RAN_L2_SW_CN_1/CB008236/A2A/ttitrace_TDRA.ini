#Check UlScheduled with TDRA.

[Global]
TTITRACE_TAG_1:output_ul.csv
DOMAIN: Default
LOGDIR:

[TtiTrace_1 CP_1]
#0:meet 1:not meet
CHECK_TYPE: 0
CHECK_FILE: output_ul.csv
FILTER: (rnti!=0)&(rnti!=65535)&(ulFdSchedData.puschTPstate=2)
CHECK_POINT: ulFdSchedData.dciFormat=UL_01
             ulFdSchedData.K2=2
             ulFdSchedData.SLIV=27
             ulFdSchedData.mcsTable=QAM64
Ratio: >0

[TtiTrace_1 CP_2]
#0:meet 1:not meet
CHECK_TYPE: 0
CHECK_FILE: output_ul.csv
FILTER: (ulFdSchedData.puschTPstate=2)&(ulFdSchedData.txNumber=1)
CHECK_POINT: ulFdSchedData.redundancyVersion=0
Ratio: >0
