#Check TP transition.

[Global]
TTITRACE_TAG_1:output_ul.csv
DOMAIN: Default
LOGDIR:


[TtiTrace_1 CP_1]
#0:meet 1:not meet
CHECK_TYPE: 0
CHECK_FILE: output_ul.csv
FILTER: (ulFdSchedData.puschTPstate=1)|(ulFdSchedData.puschTPstate=3)
CHECK_POINT: ulFdSchedData.dciFormat=UL_00_FORCE
             ulFdSchedData.mcsTable=QAM64
             ulFdSchedData.rrmUlUsedMcs<=9
Ratio: 1

[TtiTrace_1 CP_2]
#0:meet 1:not meet
CHECK_TYPE: 1
CHECK_FILE: output_ul.csv
FILTER: (ulFdSchedData.puschTPstate=1)|(ulFdSchedData.puschTPstate=3)
CHECK_POINT: ulFdSchedData.rrmUlUsedMcs>9
Ratio: 1