#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"

set SERVER_IP=$CONTAINER_IP

set GNB_NG_ADDR="10.0.1.2"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

set EDAEMON_PORT="22222"


## Variables for NSA configuration

set DAEMON_IP="10.0.2.1"
set DAEMON_PORT=22222

set ENB1_S1_ADDR="10.0.1.136"
set GNB_S1U_ADDR="10.0.1.112"

set ENB1_X2_ADDR="10.0.1.121"
set GNB_X2_ADDR="10.0.1.2"

set MME1_S1_ADDR="10.0.1.131"

set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"

set ENB_X2U_ADDR="10.0.1.135"
set PGW_ADDR="4.7.254.207"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=250:255 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=all
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$DAEMON_IP:12219|$DAEMON_IP:8889 earfcn=2000:20000 mapped_earfcn=4200:22200 mandatory_for_activation=off
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 gnb_id=0x2:22 x2_peers=none ng=$GNB_NG_ADDR xn=$GNB_NG_ADDR amf=1 nssai=0x1:0xd143a5
set_cell id=1 gnb=2 pci=20:0 tac=200 nrci=0x01 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=134980:127180 mandatory_for_activation=off
set_cell id=2 gnb=2 pci=16:2 tac=200 nrci=0x02 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=518598:518598 mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on ims_voice_3gpp=on nia=null+zuc+aes+snow3g nea=null+zuc+aes+snow3g
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=777:14 eq_plmn=250:255 tac_list=777,111,222,444,333,200
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 ip=$DAEMON_IP:$DAEMON_PORT pdn=1 devtype=tun addr=72.22.0.1/26 peer=$DAEMON_IP:2152 gtpu=off retries=unlimited

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
#UE Id=1 SA
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc+aes+snow3g nea=null+zuc+aes+snow3g sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
ue_param id=1 ue_nr_

#UE Id=11 NSA
set_ue simulated id=11 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 sec_key=0102030405060708090A0B0C0D0EFF00 nia=null+zuc+aes+snow3g nea=null+zuc+aes+snow3g imsi=250:555:21645500
ue_param id=11  ue_eutra_nr_capabilities=A11FF82384C0C03850001C46000000122205C160601C46000002022205C2606018280388C00000824440B84C0C038500018460001848881005011A0140030506504893A24ED8E7C3853A76C0000449D1276C000044036000000801880002010100200804030060800040202018030800020101002000040300610000402020040100806000 ue_nr_ dual_conn=eutra_nr

#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_qosflow id=1 5qi=6 default=on
set_nwslice id=1 snssai=0x01:0xd143a5 default=on ue=1  amf=1
set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=11 ue_nat_ip=72.23.0.11 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP


#---------------------------------------------------------------------------------------------------
#OTHER CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_bearer id=2 ue=11 qci=9 pdn=1 ip=$PDN_IP default=on trf_type=internal
uec_param id=1 reordering_window_size=1000 reordering_timer=200

debug_log level=0
sim_debug_log level=0
sim_debug_log level=0 mme=1
sim_debug_log level=0 uec=1
sim_debug_log level=0 pgw=1
sim_debug_log level=0 sgw=1
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
trace enb=1 protocol=x2 on
trace uec=1 protocol=x2 on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end

set_log log_to_file=on max_file_num=1
sim_start version_check=off
