set_cell id=4 gnb=2 pci=17:0 tac=200 nrci=0x04 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=633364:633364 gscn=7846 mandatory_for_activation=off

