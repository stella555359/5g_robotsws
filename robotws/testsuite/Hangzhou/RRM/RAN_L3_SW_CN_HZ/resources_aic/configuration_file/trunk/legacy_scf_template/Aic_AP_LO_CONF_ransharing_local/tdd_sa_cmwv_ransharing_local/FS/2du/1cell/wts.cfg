#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP
set EDAEMON_PORT="22222"
set DAEMON_PORT="22222"

set GNB_NG_ADDR="10.0.11.111"
set GNB_XN_ADDR="10.0.12.111"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.11.1"
set UPF_NGU_ADDR="10.0.1.1"

set ENB1_S1_ADDR="10.0.1.136"
set GNB_S1U_ADDR="10.0.1.113"

# X2 from sim-ENB1(UTE) to real-GNB-VCU
set ENB1_X2_ADDR="10.0.1.1"
set GNB_X2_ADDR="10.0.1.111"

set MME1_S1_ADDR="10.0.1.131"
set DNN="wap2.nokia.com"
set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"
set ENB_X2U_ADDR="10.0.1.135"
set DEV_TUN_NAME="tunUPF"
set PLMN="311:489"

set PGW_ADDR="4.7.254.207"

#CNSIM
set_amf_region id=1 tac_list=200,280,300,400,500,600 plmn=$PLMN
set_amf id=1 daemon=$SERVER_IP:$DAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=1 pointer=1
set_upf id=1 daemon=$SERVER_IP:$DAEMON_PORT ngu=$UPF_NGU_ADDR dnn=$DNN devtype=tun devname=$DEV_TUN_NAME addr=1.2.3.1/24
amf_param id=1 reg_procedure_sequence=parallel_init_ctx_setup_req_and_reg_accept full_nas_auth=on nea=null+zuc nia=null+zuc

#set_pgw id=1 ip=$SERVER_IP:$DAEMON_PORT

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$SERVER_IP:$EDAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=all
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$SERVER_IP:12219|$SERVER_IP:8889 earfcn=2000:20000 mapped_earfcn=4200:22200
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on serving_cell_index_range_scg=1:7

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 tac_list=777,111,222,444,333,4580
set_mme id=1 ip=$SERVER_IP:$EDAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte pool=1:1
set_sgw id=1 ip=$SERVER_IP:$EDAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:2153 s5u_snd_buff_size=20M s5u_rcv_buff_size=20M s1u_snd_buff_size=20M s1u_rcv_buff_size=20M gtpu_read_packets_threshold=10
set_pgw id=1 type=simulated ip=$SERVER_IP:$EDAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs sgi_rcv_buff_size=20M sgi_snd_buff_size=20M s5u_rcv_buff_size=20M s5u_snd_buff_size=20M gtpu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$DAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 file=Airphone.xml proxy_snd_buf_size=20971520 proxy_rcv_buf_size=20971520 proxy_read_packets_threshold=10

#RANSIM
set_gnb id=2 type=external plmn=$PLMN ng=$GNB_NG_ADDR gnb_id=0x1:22 daemon=$SERVER_IP:$DAEMON_PORT amf=1 x2_peers=none
set_cell id=1 gnb=2 pci=16:2 tac=280 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=633000:633000 mandatory_for_activation=off gscn=7842
set_cell id=2 gnb=2 pci=17:0 tac=280 nrci=0x02 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=633000:633000 mandatory_for_activation=off gscn=7842

#UE
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 enb=2 mode=nr cell=1
ue_param id=1 ue_nr_


#QOS FLOWS
set_qosflow id=1 5qi=6 default=on ue=all
#set_bearer id=1 ue=1 qci=9 default=on trf_type=external

#NETWORK SLICES
set_nwslice id=1 snssai=1:13714341 qos_flows=1 amf=1 default=on
set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

set_log log_to_file=on
debug_log level=1
sim_debug_log level=1 mme=1
sim_debug_log level=1 uec=1
sim_debug_log level=1 sgw=1
#link_ctrl_param use_hb=off
link_ctrl_param hb_period=5 hb_retries=5
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on

cfg_end
start version_check=off

