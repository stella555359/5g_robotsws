EPC:
  WS:
    -
      ip_addr: 192.168.200.126/24
      edaemon_port: 10000
      WTS_path: /opt/iphy/latest
      lte_network_gw: 10.0.2.1
  PGW:
    -
      type: simulated
      apn: nokia_1.net
  SGW:
    -
      type: simulated
  MME_POOL_AREA:
    - {id: 1, plmn: '244:09', mmegi: 2, tac_list: '124,123'}
  MME:
    -
      type: simulated
      pool: ['1:1']
      s1: 10.0.1.1
      supported_rat: "lte"

BASE_STATIONS:
  - id:           1
    type:         external
    plmn:         '244:09'
    s1:           10.0.1.2
    cus_config:
      - { id: 1, lmp_ip: 192.168.200.1, trsw_ip: 10.0.2.2, sync_source: 'BackplanePPS', connector: EIF1}
    RRH:
      - { id: 1, name: AREA, link_type: CPRI, opt_links: [ { physical_id: 1.1, virtual_id: 1, link_speed: 9.8 } ],
         antennas:
            { 0: { cell: 1, dir: TXRX },  1: { cell: 1, dir: TXRX }}}# , 2: { cell: 2, dir: TXRX },  3: { cell: 2, dir: TXRX } } }

      - { id: 2, name: AZHA, link_type: CPRI, opt_links: [ { physical_id: 2.1, virtual_id: 1, link_speed: 9.8 } ],
          antennas:
            { 0: { cell: 2, dir: TXRX },  1: { cell: 2, dir: TXRX } } }

    cells:
      - {id: 1, technology: lte, tac: 124, pci: '3:2'}
#      - {id: 2, technology: lte, tac: 124, pci: '4:0', bw: 5}
#      - {id: 3, technology: nblte, tac: 125, pci: '4:0', parent_cell: 2, prb_offset: '4:1', type: IN-BAND-SAME-PCI}
      - {id: 2, technology: lte, tac: 124, pci: '4:2', duplex_mode: TDD}

  - id:           2

    type:         simulated
    plmn:         '244:09'
    s1:           10.0.1.21
    x2:           10.0.1.21
    cells:
      - {id: 21, technology: lte, tac: 123, pci: '2:1', earfcn: '1400', bw: 5}

