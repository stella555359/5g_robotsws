---
test_parameters:
    NSA_UE_num: 0
    SA_UE_num: 2
    attach_with_DRX: False
    num_of_additional_rrc_reconfigurations: 0
    num_of_additional_NSA_bearers: 0
    num_of_5qi_1_rrc_num: 0
    XN_link_is_configured: False
    num_of_successful_XN_HO: 0
    num_of_positive_inter_ho_after_A5: 0
    num_of_positive_intra_ho_after_A5: 0
    num_of_non_GBR_DRB_admission_req_NSA_HO: 0
    num_of_non_GBR_DRB_admission_success_NSA_HO: 0

pm_counters:
    PLMN-PLMN/MRBTS-1/NRBTS-1/NRCELL-1:
        M55124C00001:
            value: SA_UE_num
            name: NRRCC_RRC_RELEASE_SENT

        M55124C00504:
            value: 0
            name: RRC_REESTAB_HO_FAILURE

        M55124C00505:
            value: 0
            name: RRC_REESTAB_OTHER_FAILURE

        M55124C00510:
            value: 0
            name: REESTAB_ACC_RECONF_FAIL

        M55124C00511:
            value: 0
            name: REESTAB_ACC_HO_FAIL

        M55124C03001:
            value: (2*SA_UE_num + num_of_additional_rrc_reconfigurations) if (attach_with_DRX)
                else (SA_UE_num + num_of_additional_rrc_reconfigurations)
            name: NRRCC_RRC_RECONF_SENT

        M55125C09528:
            value: num_of_5qi_1_rrc_num
            name: AVE_NUMBER_OF_UE_5QI1

        M55138C00008:
            value: str(">0") if SA_UE_num>0 else 0
            name: AVE_NUMBER_OF_SA_RRC

        M55138C00014:
            value: SA_UE_num
            name: PEAK_NUMBER_OF_SA_RRC_USERS

        M55114C00004:
            value: NSA_UE_num
            name: SGNB_NSA_NGBR_DRB_SUCC

        M55114C00008:
            value: str(">0") if NSA_UE_num>0 else 0
            name: AVE_NUMBER_OF_NSA_USERS

        M55114C00017:
            value: num_of_non_GBR_DRB_admission_req_NSA_HO
            name: SGNB_NSA_NGBR_DRB_HO_REQ

        M55114C00019:
            value: num_of_positive_intra_ho_after_A5
            name: SGNB_NSA_NGBR_DRB_HO_SUCC

        M55147C00002:
            value: num_of_positive_intra_ho_after_A5
            name: TOT_INTRA_FREQ_HO_DECISION_A5S

        M55147C00025:
            value: num_of_positive_inter_ho_after_A5
            name: TOT_INTER_FREQ_HO_DECISION_A5

        M55143C00005:
            value: num_of_successful_XN_HO
            name: XN_HO_REQ__RECEIVED

        M55143C00004:
            value: num_of_successful_XN_HO
            name: XN_HO_REQ__SENT

        M55112C00502:
            value: 0
            name: SGNB_REL_SN_REQ_UE_LOST

        M55112C03002:
            value: NSA_UE_num + num_of_additional_NSA_bearers
            name: NX2CC_BEARER_ADD_ACK

        M55112C03001:
            value: NSA_UE_num + num_of_additional_NSA_bearers
            name: NX2CC_BEARER_ADD_ATT


    PLMN-PLMN/MRBTS-1/NRBTS-1/NRDU-1:
        M55127C00001:
            value: SA_UE_num
            name: NRRCD_RRC_STPREQ_MO_SIGNALLING

        M55127C01001:
            value: SA_UE_num
            name: NRRCD_RRC_RELEASE_SENT

        M55117C00543:
            value: 0
            name: F1_DU_CU_CNF_UPD_FL_SEM_ERR

        M55117C01510:
            value: 0
            name: F1_SETUP_FAIL_PROT_ERR

        M55117C01530:
            value: 0
            name: F1_DU_ERROR_IND_SENT

        M55117C01532:
            value: 0
            name: F1_DU_ERROR_IND_RCV_ERR

        M55117C01002:
            value: NSA_UE_num + SA_UE_num
            name: NF1CD_UECTXT_STP_RESPSENT


    PLMN-PLMN/MRBTS-1/NRBTS-1:
        M55126C00003:
            value: 1 if XN_link_is_configured else 0
            name: XN_SETUP_REQUEST_RECEIVED

        M55126C00004:
            value: 1 if XN_link_is_configured else 0
            name: XN_SETUP_RESPONSE_SENT

        M55126C00005:
            value: 1 if XN_link_is_configured else 0
            name: XN_SETUP_RESPONSE_RECEIVED

        M55119C00001:
            value: 1
            name: NG_CU_SETUP_REQUEST_SENT

        M55119C00002:
            value: 1
            name: NG_CU_SETUP_RESPONSE_RCV

        M55119C00021:
            value: 0
            name: NG_CU_ERROR_IND_SENT

        M55126C00014:
            value: 0
            name: XN_ERROR_INDICATION_SENT

        M55126C00015:
            value: 0
            name: XN_ERROR_INDICATION_RECEIVED
