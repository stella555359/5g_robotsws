key_pattern         = CA_5G_SW_FR-Villarceaux
result_filename     = NPS_RobotFiles

[EXCEL_HEADER]
# Define the name of each column of excel file
robot_pathname      = Robot pathname
robot_testname      = QC TestCase Name
utetl_topology      = Topology
cit_test            = CIT
crt_test            = CRT
cdrt_test           = CDRT
global_scope        = New Global Scope
