#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP

set GNB2_NG_ADDR="10.0.1.2"
set GNB2_XN_ADDR="10.0.1.2"
#real gnB2 XN interface
set GNB1_XN_ADDR="10.0.1.122"
#sim gnB1 XN interface
set GNB1_NG_ADDR="10.0.1.123"
#sim gnB1 XG interface
set GNB3_XN_ADDR="10.0.1.124"
#sim gnB3 XN interface
set GNB3_NG_ADDR="10.0.1.125"
#sim gnB3 NG interface

set PROXY_SERVER_IP="10.0.2.80"
#for real gnb2 simu cell2
set PROXY_SERVER2_IP="10.0.2.90"
#for sim gnb3 simu cell1
set PROXY_SERVER3_IP="10.0.2.91"
#for sim gnb3 simu cell2
set PROXY_SERVER4_IP="10.0.2.92"
#for sim gnb1 simu cell1

set AMF_NG_ADDR="10.0.1.1"
set AMF2_NG_ADDR="10.0.1.9"
set AMF3_NG_ADDR="10.0.1.10"
set AMF4_NG_ADDR="10.0.1.11"
set AMF5_NG_ADDR="10.0.1.12"
set AMF6_NG_ADDR="10.0.1.13"

set UEC_ADDR="72.22.0.1"
set UPF_ADDR="10.12.2.1"

set EDAEMON_PORT="22222"

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=0,100,258,788 plmn=311:489
set_amf_region id=2 tac_list=0,100,258,788 plmn=311:489
set_amf_region id=3 tac_list=0,100,258,788 plmn=311:489
set_amf_region id=4 tac_list=0,100,258,788 plmn=311:489
set_amf_region id=5 tac_list=0,100,258,788 plmn=311:489
set_amf_region id=6 tac_list=0,100,258,788 plmn=311:489

set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR

set_amf id=2 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF2_NG_ADDR:38412 region=2 set_id=2 pointer=2
amf_param id=2 full_nas_auth=on nia=null+zuc nea=null+zuc


set_amf id=3 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF3_NG_ADDR:38412 region=3 set_id=2 pointer=2
amf_param id=3 full_nas_auth=on nia=null+zuc nea=null+zuc

set_amf id=4 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF4_NG_ADDR:38412 region=4 set_id=2 pointer=2
amf_param id=4 full_nas_auth=on nia=null+zuc nea=null+zuc
set_amf id=5 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF5_NG_ADDR:38412 region=5 set_id=2 pointer=2
amf_param id=5 full_nas_auth=on nia=null+zuc nea=null+zuc

set_amf id=6 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF6_NG_ADDR:38412 region=6 set_id=2 pointer=2
amf_param id=6 full_nas_auth=on nia=null+zuc nea=null+zuc

amf_ng_setup_param id=1 relative_capacity=100  include_backup_amf_name=off
amf_ng_setup_param id=2 relative_capacity=100
amf_ng_setup_param id=3 relative_capacity=100

set_backup_amf main=1 backup_amfs=2

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 ng=$GNB2_NG_ADDR gnb_id=0x1:22 daemon=$SERVER_IP:$EDAEMON_PORT xn=$GNB2_XN_ADDR x2_peers=none amf=1-3
set_cell id=1 gnb=2 pci=16:2 tac=0 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=633364:633364 gscn=7845 mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------
#GNB3 sim configuration for feature637
#---------------------------------------------------------------------------------------------------
set_gnb id=3 type=simulated plmn=311:489 ng=$GNB3_NG_ADDR gnb_id=0x23:22 daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none xn=$GNB3_XN_ADDR nssai=0x1:0xd143a5 amf=2
gnb_param id=3 xn_listening_socket=1 send_xn_setup=false
set_cell id=1 gnb=3 pci=127:0 tac=0 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER2_IP:9999 nr_arfcn=633364:633364 gscn=7845 mandatory_for_activation=off
set_cell id=2 gnb=3 pci=127:1 tac=0 nrci=0x02 tdd_cell=on proxy=$PROXY_SERVER3_IP:9999 nr_arfcn=633364:633364 gscn=7845 mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------
#GNB1 sim configuration
#---------------------------------------------------------------------------------------------------
set_gnb id=1 type=simulated plmn=311:489 ng=$GNB1_NG_ADDR gnb_id=0x24:22 daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none xn=$GNB1_XN_ADDR nssai=0x1:0xd143a5 amf=2
set_cell id=1 gnb=1 pci=16:0 tac=0 nrci=0x03 tdd_cell=on proxy=$PROXY_SERVER4_IP:9999 nr_arfcn=633364:633364 gscn=7845 mandatory_for_activation=off
gnb_param id=1 xn_listening_socket=1 send_xn_setup=false

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 file=AirPhoneConfig_l1bypass_tdd_sa_cmwv.xml

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
# NR UE capability for mate30Pro, refer:https://confluence.ext.net.nokia.com/display/5GHAN/Huawei
ue_param id=1 ue_nr_

set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645401 mode=nr enb=2 cell=1
