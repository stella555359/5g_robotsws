set_qosflow id=1 5qi=8 default=on
set_nwslice id=1 snssai=0x01:0xD143A5 default=on ue=1-6 amf=1-6
set_nwslice id=2 snssai=0x01:0xD143A6 ue=1 amf=1
set_nwslice id=3 snssai=0x01:0xD143A7 ue=1 amf=1
set_nwslice id=4 snssai=0x01:0xD143A8 ue=1 amf=1
