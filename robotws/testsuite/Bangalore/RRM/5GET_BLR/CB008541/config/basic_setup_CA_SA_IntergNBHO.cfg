set_cell id=1 gnb=2 pci=16:2 tac=200 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=636666:636666 bwp_arfcn=635322:635322 mandatory_for_activation=off gscn=7877
