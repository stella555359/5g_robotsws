set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc ims_voice_3gpp=on indirect_data_forwarding=on
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR
amf_ng_setup_param id=1 relative_capacity=100 include_backup_amf_name=off


#----------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
