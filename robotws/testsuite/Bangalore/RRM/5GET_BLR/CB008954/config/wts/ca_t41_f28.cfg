set_amf id=1 daemon=$SERVER_IP:$DAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null nea=null
set_upf id=1 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=8M ngu_rcv_buff_size=8M ngu_read_packets_threshold=10

#add ims_voice_3gpp support
amf_param id=1 ims_voice_3gpp=on full_nas_auth=on
#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x01:22 daemon=$SERVER_IP:$DAEMON_PORT xp_management=on xp=$GNB_X2_ADDR:32742 xpu=$GNB_X2_ADDR:32742 x2_peers=none xn=$GNB_X2_ADDR amf=1
set_cell id=1 gnb=2 pci=16:2 tac=200 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=510000:510000 gscn=6273 mandatory_for_activation=off
set_cell id=2 gnb=2 pci=17:0 tac=200 nrci=0x02 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=145000:156000 gscn=1926 mandatory_for_activation=off bwp_arfcn=344024:425024
