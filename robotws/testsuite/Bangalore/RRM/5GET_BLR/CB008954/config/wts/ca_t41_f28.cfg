set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100 s5u_snd_buff_size=20971520 s5u_rcv_buff_size=20971520 s1u_snd_buff_size=20971520 s1u_rcv_buff_size=20971520 gtpu_read_packets_threshold=0
