set UPF_ADDR="1.2.4.1"

set GNB_S1U_ADDR="10.0.1.112"
set GNB_X2_ADDR="10.0.1.2"


set SA_UE_CAPABILITIES_
set SA_UE_CAPABILITIES_


#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,200,201 plmn=311:489,311:490,311:491
set_amf id=1 daemon=$SERVER_IP:$DAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=10

#add ims_voice_3gpp support
amf_param id=1 ims_voice_3gpp=on full_nas_auth=on

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x01 daemon=$SERVER_IP:$DAEMON_PORT x2_peers=none amf=1 plmnList=311:489,311:490,311:491 nssai=0x1:0xd143a5
set_cell id=1 gnb=2 nr_arfcn=636666:636666 gscn=7880 eci=0x000021f pci=16:2 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x01 tdd_cell=on mandatory_for_activation=off
set_cell id=2 gnb=2 nr_arfcn=636666:636666 gscn=7880 eci=0x000021f pci=17:0 tac=201 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x02 tdd_cell=on mandatory_for_activation=off
set_cell id=3 gnb=2 nr_arfcn=135760:126380 gscn=1582 eci=0x000021f pci=17:1 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x03 tdd_cell=off  mandatory_for_activation=off
