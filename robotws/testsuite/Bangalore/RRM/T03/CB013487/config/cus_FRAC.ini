[executor]
log_level = DEBUG
log_global_file_name = log_global.txt
log_dir = /home/cus/logs
ue_config_url        = file:///home/ute/MN/UTE/robotlte/testsuite/WMP/DevBlr/CUS/CB008966/config/ue.db
;ue_capabilities_url        = file:///home/ute/MN/UTE/robotlte/testsuite/WMP/DevBlr/CB008966/config/uecap_FRAC.ini
duplex_mode = FDD
hardware_platform = FSMR4
start_on_cells_oos = true
syslog_disable = on


[enb_1]
enb_type = FLEXI

[ip_configuration]
workstation_ip_addr = 192.168.200.126
netmask = 255.255.255.0
lte_network_gw = 10.0.2.1
ss_ip_addr_pool = 185.4.0.0/16

[ctrl_1]
sectors = 1,2
ip_addr = 192.168.200.1
trsw_ip = 10.0.2.2
sync_source = BackplanePPS
mirroring_l2_on_startup = 2
mirroring_sch_on_startup = 2

[sector_1]
enb = 1
antennas = 1:0:TxRx, 1:1:TxRx
noise_level     =16

[sector_2]
enb = 1
antennas = 2:0:TxRx, 2:1:TxRx
noise_level     =16

[radio_1]
rmod_type = FRAC
links     = 1.1:1:4x
link_type = OBSAI

[radio_2]
rmod_type = FRAC
links     = 1.2:1:4x
link_type = OBSAI



[tgr_1]
ip_addr = 10.0.2.101
etgr = on
ss_interface = eth101
side = SS
user = root
password = cussim
update_cmd = sudo /opt/cus/var/update/update.sh
restart_cmd = sudo /etc/init.d/cus-tgr restart

[tgr_2]
ip_addr = 10.0.2.100
etgr = on
etgr_ip_addr = 10.0.2.102
ue_interface = eth100
side = MS
user = root
password = cussim
update_cmd = sudo /opt/cus/var/update/update.sh
restart_cmd = sudo /etc/init.d/cus-tgr restart

