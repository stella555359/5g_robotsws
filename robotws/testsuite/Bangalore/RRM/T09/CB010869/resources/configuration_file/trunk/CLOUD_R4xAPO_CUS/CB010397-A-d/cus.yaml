EPC:
  WS:
    -
      ip_addr: 192.168.200.126/24
      edaemon_port: 10000
      WTS_path: /opt/iphy/latest
      lte_network_gw: 10.0.2.1
      energy_saving_feature: on
      pwr_ctrl_switch: on
      # log_level: 6
  PGW:
    -
      id: 1
      type: simulated
      apn: nokia_1.net
    -
      id: 2
      type: simulated
      apn: emergency.nsn.com
      emergency: on
  SGW:
    -
      type: simulated
  MME_POOL_AREA:
    - {id: 1, plmn: '244:08', mmegi: 1, tac_list: 123}
  MME:
    -
      id: 1
      type: simulated
      pool: ['1:1']
      s1: 10.0.1.1

BASE_STATIONS:
  - id:           1
    type:         external
    plmn:         '244:08'
    s1:           10.0.1.2
    cus_config:
      - { id: 1, lmp_ip: 192.168.200.1, trsw_ip: 10.0.2.2, sync_source: 'BackplanePPS',
        mirroring_l2_on_startup: 2, mirroring_sch_on_startup: 2,
        energy_saving_feature: on }
    RRH:
      - { id: 1, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 3.1, virtual_id: 1, link_speed: 9.8 } ], #3-rd card
        antennas:
          { 0: { cell: 1, dir: TXRX },  1: { cell: 1, dir: TXRX } ,  2: { cell: 7, dir: TXRX } ,  3: { cell: 7, dir: TXRX } } }
      - { id: 2, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 3.2, virtual_id: 1, link_speed: 9.8 } ], #3-rd card
        antennas:
          { 0: { cell: 2, dir: TXRX },  1: { cell: 2, dir: TXRX } } }

      - { id: 3, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 2.1, virtual_id: 1, link_speed: 9.8 } ], #2-nd card
        antennas:
          { 0: { cell: 3, dir: TXRX },  1: { cell: 3, dir: TXRX },  2: { cell: 8, dir: TXRX } ,  3: { cell: 8, dir: TXRX }  } }
      - { id: 4, name: AHFB, link_type: CPRI, opt_links: [ { physical_id: 2.2, virtual_id: 1, link_speed: 9.8 } ], #2-nd card
        antennas:
          { 0: { cell: 4, dir: TXRX },  1: { cell: 4, dir: TXRX },  2: { cell: 4, dir: TXRX },  3: { cell: 4, dir: TXRX } } }

      - { id: 5, name: AZHA, link_type: CPRI, opt_links: [ { physical_id: 1.1, virtual_id: 1, link_speed: 9.8 } ], #1-st card
        antennas:
          { 0: { cell: 5, dir: TXRX },  1: { cell: 5, dir: TXRX },  2: { cell: 9, dir: TXRX } ,  3: { cell: 9, dir: TXRX } } }
      - { id: 6, name: AZNC, link_type: CPRI, opt_links: [ { physical_id: 1.2, virtual_id: 1, link_speed: 9.8 }], #1-st card
        antennas:
          { 0: { cell: 6, dir: TXRX },  1: { cell: 6, dir: TXRX },  2: { cell: 6, dir: TXRX },  3: { cell: 6, dir: TXRX },
            4: { cell: 6, dir: TXRX },  5: { cell: 6, dir: TXRX },  6: { cell: 6, dir: TXRX },  7: { cell: 6, dir: TXRX } } }

    cells:
      - { id: 1-2, technology: lte, tac: 123, duplex_mode: FDD } #3-rd card
      - { id: 7, technology: lte, tac: 123, duplex_mode: FDD } #3-rd card
      - { id: 3-4, technology: lte, tac: 123, duplex_mode: FDD } #2-nd card
      - { id: 8, technology: lte, tac: 123, duplex_mode: FDD } #2-nd card
      - { id: 5-6, technology: lte, tac: 123, duplex_mode: TDD } #1-st card
      - { id: 9, technology: lte, tac: 123, duplex_mode: TDD } #1-st card

  # - id: 2
  #   type: simulated
  #   plmn: '244:08'
