  #         meas_timing_carrier_freq: 629982, ssb_subcarrier_spacing: kHz30, ssb_mtc_periodicity_and_offset: 'sf10:0', ssb_mtc_duration: 'sf1' }
  #     - { id: 22, technology: nr, tac: 123, pci: '2:2', nrci: '0x2', nr_arfcn: '2079167:2079167', tdd_cell: on, suggested_band: '257',
