set_cell id=1 gnb=2 pci=16:2 tac=200 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=508020:508020 bwp_arfcn=506004:506004 gscn=6324 mandatory_for_activation=off
