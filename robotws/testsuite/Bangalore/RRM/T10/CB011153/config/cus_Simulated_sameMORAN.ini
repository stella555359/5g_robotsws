[executor]
log_level            = DEBUG
log_global_file_name = log_global.txt
log_dir              = /home/cus/logs
ue_config_url        = file:///opt/cus/etc/ue.db
duplex_mode          = FDD
hardware_platform    = FSMR4
start_on_cells_oos   = true

[enb_1]
enb_type = FLEXI

[ip_configuration]
workstation_ip_addr = 192.168.200.126
netmask             = 255.255.255.0
lte_network_gw      = 10.0.2.1
ss_ip_addr_pool     = 185.4.0.0/16

[ctrl_1]
sectors                  = 1,2,3,4,5,6
ip_addr                  = 192.168.200.1
trsw_ip                  = 10.0.2.2
connector                = EIF5
sync_source              = BackplanePPS
mirroring_l2_on_startup  = 2
mirroring_sch_on_startup = 2

[sector_1]
enb       = 1
antennas  = 1:0:TxRx, 1:1:TxRx

[sector_2]
enb       = 1
antennas  = 2:0:TxRx, 2:1:TxRx

[sector_3]
enb       = 1
antennas  = 3:0:TxRx, 3:1:TxRx

[sector_4]
enb       = 1
antennas  = 4:0:TxRx, 4:1:TxRx

[sector_5]
enb       = 1
antennas  = 5:0:TxRx, 5:1:TxRx

[sector_6]
enb       = 1
antennas  = 6:0:TxRx, 6:1:TxRx


[radio_1]
rmod_type = AHFB
links     = 1.1:1:9.8
link_type = CPRI

[radio_2]
rmod_type = AHFB
links     = 1.2:1:9.8
link_type = CPRI

[radio_3]
rmod_type = AHFB
links     = 2.3:1:9.8
link_type = CPRI

[radio_4]
rmod_type = AHFB
links     = 2.4:1:9.8
link_type = CPRI

[radio_5]
rmod_type = AHFB
links     = 3.5:1:9.8
link_type = CPRI

[radio_6]
rmod_type = AHFB
links     = 3.6:1:9.8
link_type = CPRI


[tgr_1]
ip_addr         = 10.0.2.101
etgr            = on
ss_interface    = eth101
side            = SS
user            = root
password        = cussim
update_cmd      = sudo /opt/cus/var/update/update.sh
restart_cmd     = sudo /etc/init.d/cus-tgr restart

[tgr_2]
ip_addr         = 10.0.2.100
etgr            = on
etgr_ip_addr    = 10.0.2.102
ue_interface    = eth100
side            = MS
user            = root
password        = cussim
update_cmd      = sudo /opt/cus/var/update/update.sh
restart_cmd     = sudo /etc/init.d/cus-tgr restart

[enb_2]
enb_type                  = ENBSIM

[ctrl 2]
hardware_platform          = ENBSIM
ip_addr                    = 192.168.200.126      ; or any local RTG worktation address
sectors                    = 21,22,23,24,25,26              ; refers to [sector] below
l3proxy_up_tgr_if          = eth4
s2s_port                   = 8045
rrc_mmi_port               = 8499
l3proxy_log_level 		   = DEBUG

[sector_21]
dl_earfcn                   = 800
enb 						= 2
router_apsim_ipv4           = 10.0.2.1
c2c_port    				= 6102
l3proxy_enbsim_addr        = 127.0.0.1   ; eNBSIM address (same as 'ip_addr' if on RTG worstation)
l3proxy_enbsim_cp_port     = 2165    ; gnbsim port ?

