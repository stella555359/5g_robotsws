[executor]
log_level            = DEBUG
log_global_file_name = log_global.txt
log_dir              = /home/cus/logs
ue_config_url        = file:///opt/cus/etc/ue.db
;ue_capabilities_url    = file:///opt/cus/etc/common_ue_capabilities.ini
user_console_port    = 1234
duplex_mode          = FDD
;tgr_stub             = ON
hardware_platform    = FSMR4
enb_type             = FLEXI
syslog_disable       = on
start_on_cells_oos    = on

[ip_configuration]
workstation_ip_addr  = 192.168.200.126
netmask              = 255.255.255.0
lte_network_gw       = 184.1.1.254

[enb_1]
enb_type             = FLEXI

[enb_2]
enb_type             = ENBSIM

[enb_3]
enb_type             = ENBSIM
;---------------------------------------------------------

[ctrl_1]
sectors              = 1
ip_addr              = 192.168.200.1
syslog_port          = 51603
trsw_ip              = 10.0.2.2
connector            = EIF5

[ctrl_2]
hardware_platform         = ENBSIM
ip_addr                   = 192.168.200.126
sectors                   = 21
l3proxy_enbsim_addr       = 127.0.0.1
l3proxy_enbsim_cp_port    = 5555
;l3proxy_up_tgr_if         = eth4
;s2s_port                  = 8045
;rrc_mmi_port              = 8499
l3proxy_nr_pci            = 381
l3proxy_gnb_id            = 1
l3proxy_cell_id           = 1

[ctrl_3]
hardware_platform         = ENBSIM
ip_addr                   = 192.168.200.126
sectors                   = 31
l3proxy_enbsim_addr       = 127.0.0.1
l3proxy_enbsim_cp_port    = 2154
l3proxy_up_tgr_if         = eth4
;rrc_mmi_port              = 8498
;l3proxy_nr_pci            = 385
l3proxy_gnb_id            = 1
l3proxy_cell_id           = 1

[sector_1]
