radio                = 1
antennas             = 1:0:TxRx, 1:2:TxRx
enb                  = 1

[sector_21]
dl_earfcn = 2000
enb = 2

[nr5g_cell 121]
parent_sector = 21

[sector_31]
dl_earfcn = 6200
router_apsim_ipv4 = 10.0.2.1
enb = 3
c2c_port = 6104
port = 8010

