set PGW_ADDR="4.7.254.207"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=3 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=3 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=3 eci=0x1234601 pci=3:2 tac=222 proxy=$DAEMON_IP:12219|$DAEMON_IP:8889 earfcn=2000:20000 mapped_earfcn=4200:22200 tdd_cell=on mandatory_for_activation=off
enb_endc_param id=3 control_flow_period=3gpp1 use_nr_ran_cont=on

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 tac_list=777,111,222,444,333,200
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100 s5u_snd_buff_size=20M s5u_rcv_buff_size=20M s1u_snd_buff_size=20M s1u_rcv_buff_size=20M gtpu_read_packets_threshold=10
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13 sgi_rcv_buff_size=20M sgi_snd_buff_size=20M s5u_rcv_buff_size=20M s5u_snd_buff_size=20M gtpu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$DAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=10

#add ims_voice_3gpp support
amf_param id=1 ims_voice_3gpp=on full_nas_auth=on

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=1 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x1:22 daemon=$SERVER_IP:$DAEMON_PORT x2_peers=none xn=$GNB1_XN_ADDR amf=1 plmnList=311:489 nssai=0x1:0xd143a5
set_cell id=1 gnb=1 nr_arfcn=635676:635676 gscn=7880 eci=0x000021f pci=16:2 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x01 tdd_cell=on mandatory_for_activation=off
set_cell id=2 gnb=1 nr_arfcn=635676:635676 gscn=7880 eci=0x000021f pci=17:0 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x02 tdd_cell=on mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------

#---------------------------------------------------------------------------------------------------
#SIMULATED GNB - RANSIM
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=simulated plmn=311:489 xn=$GNB2_XN_ADDR ng=$GNB2_NG_ADDR gnb_id=0x3:22 daemon=$SERVER_IP:$DAEMON_PORT x2_peers=none amf=1 nssai=0x1:0xd143a5
gnb_param id=2 xn_listening_socket=1 sib1_period=40 ciphering_algorithm=nea0 integrityprotection_algorithm=nia3 send_xn_setup=true measEvent=A3  sa_ho=xn_based ng_forwarding_tunnel_type=pdu
set_cell id=1 gnb=2 pci=18:0 tac=200 nrci=0x01 tdd_cell=on proxy=$GNB2_NG_ADDR:9999 nr_arfcn=635676:635676 gscn=7880
