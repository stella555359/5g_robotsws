#----------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set DAEMON_IP=$CONTAINER_IP
set SERVER_IP=$CONTAINER_IP
set DAEMON_PORT=22222
set GNB_NG_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

#EDAEMON_PORT="22222"

##Variables for NSA configuration
set ENB1_S1_ADDR="10.0.1.136"
set GNB_S1U_ADDR="10.0.1.2"

set ENB1_X2_ADDR="10.0.1.121"
set GNB_X2_ADDR="10.0.1.2"

set MME1_S1_ADDR="10.0.1.131"

set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"

set ENB_X2U_ADDR="10.0.1.135"
set PGW_ADDR="4.7.254.207"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"
set PDN_IP_2="4.7.254.209"

set GNB_XN_ADDR="10.0.1.2"
set GNB3_NG_ADDR="10.0.1.3"
set GNB3_XN_ADDR="10.0.1.4"
#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$DAEMON_IP:12219|$DAEMON_IP:8889 earfcn=2000:20000 mapped_earfcn=4200:22200 mandatory_for_activation=off
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on

#----------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#----------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x01:22 daemon=$SERVER_IP:$DAEMON_PORT x2_peers=none amf=1 plmnList=311:489 nssai=0x1:0xd143a5
set_cell id=1 gnb=2 nr_arfcn=135760:126380 gscn=1582 eci=0x000021f pci=16:2 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x01 tdd_cell=on  mandatory_for_activation=off

#----------------------------------------------------------------------------------------------------
#---------------------------------------------------------------------------------------------------
#--GNB SIM CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=3 type=simulated plmn=311:489 ng=$GNB3_NG_ADDR gnb_id=0x3:22 daemon=$SERVER_IP:$DAEMON_PORT xn=$GNB3_XN_ADDR x2_peers=none nssai=0x1:0xd143a5 amf=1
gnb_param id=3 xn_listening_socket=1 send_xn_setup=false measEvent=A3  measEvent=A2  sa_ho=ng_based 
set_cell id=1 gnb=3 pci=17:1 tac=200 nrci=0x03 tdd_cell=off proxy=$GNB3_NG_ADDR:9999 nr_arfcn=355000:435000 gscn=5436

#----------------------------------------------------------------------------------------------------
#--EPC CONFIGURATION
#----------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 tac_list=777,111,222,444,333,200
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100 s5u_snd_buff_size=20M s5u_rcv_buff_size=20M s1u_snd_buff_size=20M s1u_rcv_buff_size=20M gtpu_read_packets_threshold=10
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13 sgi_rcv_buff_size=20M sgi_snd_buff_size=20M s5u_rcv_buff_size=20M s5u_snd_buff_size=20M gtpu_read_packets_threshold=10

#----------------------------------------------------------------------------------------------------
#--5GCN CONFIGURATION
#----------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$DAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=10

#--add ims_voice_3gpp support
amf_param id=1 ims_voice_3gpp=on full_nas_auth=on
#----------------------------------------------------------------------------------------------------
#--UEC CONFIGURATION
#----------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$DAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 proxy_snd_buf_size=20971520 proxy_rcv_buf_size=20971520 proxy_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#--UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc+aes+snow3g nea=null+zuc+aes+snow3g sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
ue_param id=1 ue_nr_

#--------------------------------------------------------------------------------
#--COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_qosflow id=1 5qi=6 default=on
#set_nwslice id=1 snssai=0x01:0xd143a5 amf=1 default=on ue=all

#add for 5Qi-5 & 5Qi-1 support for VoNR
set_qosflow id=2 5qi=5
set_qosflow id=3 5qi=1
set_qosrule id=1 proto=tcp  qos_flow=2
set_qosrule id=2 proto=udp qos_flow=3
set_nwslice id=1 qos_flows=1,2,3 qos_rules=1,2 snssai=0x01:0xD143A5 default=on ue=all amf=1
set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
#---------------------------------------------------------------------------------------------------
#--OTHER CONFIGURATION
#---------------------------------------------------------------------------------------------------
#---------------------------------------------------------------------------------------------------
#OTHER CONFIGURATION
#---------------------------------------------------------------------------------------------------
#set_bearer id=2 ue=11 qci=9 pdn=1 ip=$PDN_IP default=on ul_nat_gw=10.0.2.1 dl_nat_gw=10.0.2.1 trf_type=internal
uec_param id=1 reordering_window_size=1000 reordering_timer=200

debug_log level=4
sim_debug_log level=4 mme=1
sim_debug_log level=4 pgw=1
sim_debug_log level=4 uec=1
sim_debug_log level=4 sgw=1
sim_debug_log level=2 app_type=l2nrt
sim_debug_log level=2 app_type=l2rt
sim_debug_log level=2 app_type=ueproxy
sim_debug_log enable_events_date=on
sim_debug_log enable_debug_date=on
link_ctrl_param hb_period=5 hb_retries=5
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
trace enb=1 protocol=x2 on
trace uec=1 protocol=x2 on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end
set_log log_to_file=on
sim_start version_check=off
