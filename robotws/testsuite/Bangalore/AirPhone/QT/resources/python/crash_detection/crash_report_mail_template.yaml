<!DOCTYPE html>
<style>
* {
    font-family: calibri;
}

.logemphasis {
    font-weight: bold;
    color: #7CFC00;
}

.uemphasis {
    text-decoration: underline;
    font-weight: bold;
    font-size: 1.2em;
}

.inf {
    font-weight: bold;
    color: orange;
}

.bold {
    font-weight: bold;
}

.crashtable {
    text-align: center;
    border-collapse: collapse;
    width: 800px;
    border: 5px solid black;
    padding: 5px;
}

.wrn {
    font-weight: bold;
    color: red;
}

table.crashtable th {
    border: 2px solid black;
    background-color: #d7e1f2;
}

table.crashtable td {
    border: 2px solid black;
    text-align: left;
}

</style>
<html>
  <head>
          <title></title>
  </head>
  <body >
      <p>
          <center>
            <b>
                    <font size="+3" color=#124191>
                        Airphone Crash Information Report
                    </font>
            </b>
          </center>
            <br/>
</p>
<p>
</p>
<p>
  <font class="uemphasis">
                Build Information
            </font>
            <br />
        <br />
        <b >
                AP Build Information:
            </b>
            <a href="https://wft.int.net.nokia.com/TOOLS/airphone/builds/airphone_{{ crash_info['AP_BUILD'] }}">
                {{ crash_info['AP_BUILD'] }}
            </a>
            <br />
        {% set gnb_versions =   crash_info['GNB_BUILD'].split(',') %}
		<b >
                gNB Build Information:
        </b>
        {% if gnb_versions|length == 1 %}
                <a id="gnb_version" href="https://wft.int.net.nokia.com/SBTS/CI_ENB/builds/{{ gnb_versions[0] }}">
                    {{ gnb_versions[0] }}
                </a>
                <br />
        {% endif %}
		{% if gnb_versions|length > 1 %}
		<a href="https://wft.int.net.nokia.com/5G:WMP/5G_Central/builds/{{ gnb_versions[0] }}">
		    {{ gnb_versions[0] }}</a>
		  ,<a href="https://wft.int.net.nokia.com/5G:WMP/5G_Central/builds/{{ gnb_versions[1] }}">
		    {{ gnb_versions[1] }} </a>
		{% endif %}
        </font>
        <br />
        <b>
        AP Configuration :
        </b>
        {{ crash_info["configuration"] }}
        <br />
        <b>
        Build URL :
        </b>
        {{ crash_info["build_url"] }}
        <br />
        <b>
        User Info :
        </b>
        {{ crash_info["user"] }}
        <br />
        <b>
        Testline Info :
        </b>
        {{ crash_info["TESTLINE"] }}
        <br />
        <br />
        <font class="uemphasis">
        Crash Information
            </font>
           <br />
        <table class="crashtable">
              <tr >
        <th >
                  Component
                </th>
        <th>
          Crash Output String
                </th>
          </tr>

	      {% for key, value in crash_info.items() %}
	      {% if key == "AP" or key == "WTS"  %}
	      <tr>
             <td> {{ key }} </td>
             <td> {{ value }} </td>
          </tr>
          {% endif %}
          {% endfor %}

        </table>
            <br />
            <br />
            Best Regards,
            <br />
            AP team
        </p>
    </body>
</html>
