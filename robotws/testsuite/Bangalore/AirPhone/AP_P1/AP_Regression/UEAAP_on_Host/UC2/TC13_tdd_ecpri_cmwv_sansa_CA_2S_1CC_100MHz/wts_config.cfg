##UE Id=31 NSA
set_ue simulated id=31 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 sec_key=0102030405060708090A0B0C0D0EFF00  nia=zuc nea=zuc imsi=311:489:21645501
