#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_qosflow id=1 5qi=6 default=on
set_nwslice id=1 snssai=0x01:0xd143a5             amf=1 default=on ue=all

set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$DAEMON_IP ul_nat_gw=$DAEMON_IP
set_pdu_gateway id=11 ue_nat_ip=72.23.0.11 dl_nat_gw=$DAEMON_IP ul_nat_gw=$DAEMON_IP
set_pdu_gateway id=21 ue_nat_ip=72.23.0.21 dl_nat_gw=$DAEMON_IP ul_nat_gw=$DAEMON_IP
set_pdu_gateway id=31 ue_nat_ip=72.23.0.31 dl_nat_gw=$DAEMON_IP ul_nat_gw=$DAEMON_IP
