set DAEMON_IP="127.0.0.1"
set DAEMON_PORT=50000

## Variables for NSA configuration

set ENB1_S1_ADDR="172.18.0.5"   #Automatically edited
set GNB_S1U_ADDR="172.18.0.3"   #Automatically edited

set ENB1_X2_ADDR="172.18.0.5"   #Automatically edited
set GNB_X2_ADDR="172.18.0.4"   #Automatically edited

set MME1_S1_ADDR="172.18.0.2"   #Automatically edited

set SGW_S1U_ADDR="172.18.0.2"   #Automatically edited
set SGW_S11_ADDR="10.0.1.134"

set ENB_X2U_ADDR="172.18.0.5"   #Automatically edited

set PGW_ADDR="4.7.254.207"
set PDN_IP1="4.7.254.208"
set PDN_IP2="4.7.254.209"

set GNB_NG_ADDR=$GNB_X2_ADDR
set AMF_NG_ADDR=$MME1_S1_ADDR
set UPF_NG_ADDR="172.18.0.6"   #Automatically edited
set UPF_ADDR="1.2.4.1"
set UEC_ADDR="72.22.0.1"

set IRFHEAD_SIM="192.168.240.2"   #Automatically edited
set WTS_NETWORK_IP="192.168.240.4"   #Automatically edited
set TRS_WRAPPER_IP="192.168.240.3"   #Automatically edited
set ENB_NETWORK_IP="192.168.240.6"   #Automatically edited

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$ENB_NETWORK_IP:12219|$ENB_NETWORK_IP:8889 earfcn=2000:20000 mapped_earfcn=4200:22200 mandatory_for_activation=off
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 eq_plmn=250:255 tac_list=777,111,222,444,333,200
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100 s5u_snd_buff_size=20M s5u_rcv_buff_size=20M s1u_snd_buff_size=20M s1u_rcv_buff_size=20M gtpu_read_packets_threshold=10
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13 sgi_rcv_buff_size=20M sgi_snd_buff_size=20M s5u_rcv_buff_size=20M s5u_snd_buff_size=20M gtpu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,200,0 plmn=311:489
set_amf id=1 daemon=$DAEMON_IP:$DAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on T3550=20s T3560=20s
set_upf id=1 daemon=$DAEMON_IP:$DAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$UPF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x01:22 daemon=$DAEMON_IP:$DAEMON_PORT x2_peers=none amf=1 plmnList=311:489 nssai=0x1:0xd143a5
set_cell id=1 gnb=2 pci=16:2 tac=200 nrci=0x01 tdd_cell=on proxy=$TRS_WRAPPER_IP:2152|$IRFHEAD_SIM:8888 nr_arfcn=633364:633364 gscn=7845 mandatory_for_activation=off
set_cell id=2 gnb=2 pci=17:0 tac=200 nrci=0x02 tdd_cell=on proxy=$TRS_WRAPPER_IP:2152|$IRFHEAD_SIM:8888 nr_arfcn=647340:647340 gscn=7992 mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$DAEMON_IP:$DAEMON_PORT peer=$WTS_NETWORK_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=$UEC_ADDR/26 proxy_snd_buf_size=20971520 proxy_rcv_buf_size=20971520 proxy_read_packets_threshold=10 file=AirphoneConfig_TDD_cmwv.xml

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
# enb_timer value are L3 Call On Host specific
#---------------------------------------------------------------------------------------------------
enb_timer T_DC_Prep=20000 T_DC_Overall=4000 T_RRC_TRANSACTION=10000 T_304=10000

set SA_UE_

set NSA_UE_

set LTE_UE_CAPABILITIES=A18FF02F858100713420000103D1903F130200E268006134000240F4640801809A0084D001C81429D0B649F0224E853B649F00007010C60E00420C01008020100402008041C0080180200300600A0100108180201004020080401008380500300A006018014030020700A002018004028008060018

