#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set DAEMON_IP="10.0.2.1"
set DAEMON_PORT=22222

set ENB1_S1_ADDR="10.0.1.136"
set GNB_S1U_ADDR="10.0.1.112"

set ENB1_X2_ADDR="10.0.1.121"
set GNB_X2_ADDR="10.0.1.111"

set MME1_S1_ADDR="10.0.1.131"

set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"

set ENB_X2U_ADDR="10.0.1.135"
set PGW_ADDR="4.7.254.207"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=250:255 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$DAEMON_IP:12219 earfcn=2000:20000 mapped_earfcn=4200:22200 tdd_cell=on
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=250:255 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 x2_peers=none
set_cell id=2 gnb=2 nr_arfcn=628333:628333 eci=0x000021f pci=16:2 tac=4 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x3FFF tdd_cell=on

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=250:255 tac_list=777,111,222,444,333
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:2153
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 ip=$DAEMON_IP:$DAEMON_PORT peer=$DAEMON_IP:2152 gtpu=off retries=3 file=AirPhoneConfig_fullstack_tdd_nsa_cmwv.xml

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
#SRB3 ENABLED
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 sec_key=0102030405060708090A0B0C0D0EFF00 eia=null+snow3g+aes eea=null nia=aes imsi=250:555:21645400
ue_param id=1 ue_nr_capabilities=01000000010800000004D780000000000001150000000000000150 dual_conn=eutra_nr ue_eutra_nr_capabilities=210C040100904D00000402404D10001000100804008010
#SRB3 DISABLED
set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 sec_key=0102030405060708090A0B0C0D0EFF00 eia=null+snow3g+aes eea=null imsi=250:555:21645402
ue_param id=2 ue_nr_capabilities=01000000010800000004D780000000000001150000000000000150 dual_conn=eutra_nr ue_eutra_nr_capabilities=010C040100904D00000402404D000200020100801002
#SRB3 AND A3 ENABLED
set_ue simulated id=3 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 sec_key=0102030405060708090A0B0C0D0EFF00 eia=null+snow3g+aes eea=null nia=aes imsi=250:555:21645404
ue_param id=3 ue_nr_capabilities=29000000010800000004D4D3F780000000000001150000000000000150 dual_conn=eutra_nr ue_eutra_nr_capabilities=210C040100904D00000402404D10001000100804008010

#---------------------------------------------------------------------------------------------------
#OTHER CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_bearer id=2 ue=1-3 qci=9 pdn=1 ip=$PDN_IP default=on trf_type=internal

debug_log level=0
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
trace enb=1 protocol=x2 on
trace uec=1 protocol=x2 on
uec_param id=1 reordering_window_size=50 reordering_timer=200
cfg_end

set_log log_to_file=true max_file_num=1
sim_start version_check=off
