#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.1.1"
set SERVER_IP=$CONTAINER_IP

set DAEMON_IP=$CONTAINER_IP
set DAEMON_PORT="22222"

set PROXY_SERVER_IP="10.0.2.80"

set GNB_NG_ADDR="10.0.1.2"
set GNB_S1U_ADDR="10.0.1.2"

set AMF1_NG_ADDR="10.0.1.1"

set UPF1_TUNNEL_ADDR="1.2.4.1"
set UPF2_TUNNEL_ADDR="2.2.4.1"
set UPF3_TUNNEL_ADDR="3.2.4.1"
set UPF4_TUNNEL_ADDR="4.2.4.1"
set UPF5_TUNNEL_ADDR="5.2.4.1"
set UPF6_TUNNEL_ADDR="6.2.4.1"

set UPF1_N3_ADDR="10.0.1.1"
set UPF2_N3_ADDR="10.0.1.5"
set UPF3_N3_ADDR="10.0.1.6"
set UPF4_N3_ADDR="10.0.1.7"
set UPF5_N3_ADDR="10.0.1.8"
set UPF6_N3_ADDR="10.0.1.9"

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 s1u=$GNB_S1U_ADDR  ng=$GNB_NG_ADDR gnb_id=0x01 daemon=$SERVER_IP:$DAEMON_PORT x2_peers=none amf=1 plmnList=311:489 nssai=0x1:0xd143a5
set_cell id=1 gnb=2 nr_arfcn=670000:670000 gscn=8228 eci=0x000021f pci=16:2 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x01 tdd_cell=on mandatory_for_activation=off
set_cell id=2 gnb=2 nr_arfcn=663332:663332 gscn=8158 eci=0x000021f pci=17:0 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x02 tdd_cell=on mandatory_for_activation=off
#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$DAEMON_PORT ng=$AMF1_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF1_TUNNEL_ADDR/24 ngu=$UPF1_N3_ADDR devname=tunUPF1 ngu_snd_buff_size=40M ngu_rcv_buff_size=40M ngu_read_packets_threshold=20 n6_read_packets_threshold=40
set_upf id=2 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF2_TUNNEL_ADDR/24 ngu=$UPF2_N3_ADDR devname=tunUPF2 ngu_snd_buff_size=40M ngu_rcv_buff_size=40M ngu_read_packets_threshold=20 n6_read_packets_threshold=40
set_upf id=3 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF3_TUNNEL_ADDR/24 ngu=$UPF3_N3_ADDR devname=tunUPF3 ngu_snd_buff_size=40M ngu_rcv_buff_size=40M ngu_read_packets_threshold=20 n6_read_packets_threshold=40
set_upf id=4 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF4_TUNNEL_ADDR/24 ngu=$UPF4_N3_ADDR devname=tunUPF4 ngu_snd_buff_size=40M ngu_rcv_buff_size=40M ngu_read_packets_threshold=20 n6_read_packets_threshold=40
set_upf id=5 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF5_TUNNEL_ADDR/24 ngu=$UPF5_N3_ADDR devname=tunUPF5 ngu_snd_buff_size=40M ngu_rcv_buff_size=40M ngu_read_packets_threshold=20 n6_read_packets_threshold=40
set_upf id=6 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF6_TUNNEL_ADDR/24 ngu=$UPF6_N3_ADDR devname=tunUPF6 ngu_snd_buff_size=40M ngu_rcv_buff_size=40M ngu_read_packets_threshold=20 n6_read_packets_threshold=40
#add ims_voice_3gpp support
amf_param id=1 ims_voice_3gpp=on full_nas_auth=on
smf_upf_mapping id=1 upf=1,2,3,4,5,6
#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
#UE Id=1 SA
set_ue external id=1 uec=1 pdn=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc+aes+snow3g nea=null+zuc+aes+snow3g sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
ue_param id=1 ue_nr_

#UE Id=2 SA
set_ue external id=2 uec=1 pdn=2 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B620 nia=null+zuc+aes+snow3g nea=null+zuc+aes+snow3g sec_key=0102030405060708090A0B0C0D0EFF01 suci=0:311:489:0000:0:0:021645401 mode=nr enb=2 cell=2
ue_param id=2 ue_nr_
#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_qosflow id=1 5qi=6 default=on
set_qosrule id=1 proto=udp qos_flow=1
set_qosrule id=2 proto=tcp qos_flow=1
nwslice_set id=1 qos_flows=1 qos_rules=1,2 snssai=0x01:0xD143A5 default=on ue=all amf=1
set_pdu_param ue=1 pdu=1 upf=1 trf_type=internal
set_pdu_param ue=1 pdu=2 upf=2 trf_type=internal
set_pdu_param ue=1 pdu=3 upf=3 trf_type=internal
set_pdu_param ue=1 pdu=4 upf=4 trf_type=internal
set_pdu_param ue=1 pdu=5 upf=5 trf_type=internal
set_pdu_param ue=1 pdu=6 upf=6 trf_type=internal
#---------------------------------------------------------------------------------------------------
debug_log level=5
sim_debug_log level=5 amf=1
sim_debug_log level=5 upf=1
sim_debug_log level=5 upf=2
sim_debug_log level=5 upf=3
sim_debug_log level=5 upf=4
sim_debug_log level=5 upf=5
sim_debug_log level=5 upf=6
link_ctrl_param hb_period=5 hb_retries=5
sim_trace amf=1 protocol=ng on
cfg_end
set_log log_to_file=true max_file_num=1
sim_start version_check=off
