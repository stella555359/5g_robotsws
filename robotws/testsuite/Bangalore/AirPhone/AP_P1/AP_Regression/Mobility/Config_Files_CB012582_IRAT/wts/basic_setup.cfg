#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set DAEMON_IP=$CONTAINER_IP
set SERVER_IP=$CONTAINER_IP

set GNB2_NG_ADDR="10.0.1.2"
set GNB2_XN_ADDR="10.0.1.2"
#real gnB2 XN interface
set GNB1_XN_ADDR="10.0.1.122"
#sim gnB1 XN interface
set GNB1_NG_ADDR="10.0.1.123"
#sim gnB1 XG interface
set GNB3_XN_ADDR="10.0.1.124"
#sim gnB3 XN interface
set GNB3_NG_ADDR="10.0.1.125"
#sim gnB3 NG interface
set PROXY_SERVER_IP="10.0.2.80"
#for real gnb2 simu cell2
set PROXY_SERVER2_IP="10.0.2.90"
#for sim gnb3 simu cell1
set PROXY_SERVER3_IP="10.0.2.91"
#for sim gnb3 simu cell2
set PROXY_SERVER4_IP="10.0.2.92"
#for sim gnb1 simu cell1
#-- ENB S1 interfaces --
set ENB1_S1_ADDR="10.0.1.111"
set ENB1_S1U_ADDR="10.0.1.111"
set AMF_NG_ADDR="10.0.1.1"
set AMF2_NG_ADDR="10.0.1.9"
set AMF3_NG_ADDR="10.0.1.10"
set AMF4_NG_ADDR="10.0.1.11"

set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

set EDAEMON_PORT="22222"

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,0,222 plmn=311:489
set_amf_region id=2 tac_list=7627107,100,258,0,222 plmn=311:489
set_amf_region id=3 tac_list=7627107,100,258,0,222 plmn=311:489
#set_amf_region id=4 tac_list=7627107,100,258,0,222 plmn=311:489

set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR

set_amf id=2 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF2_NG_ADDR:38412 region=2 set_id=2 pointer=2
amf_param id=2 full_nas_auth=on nia=null+zuc nea=null+zuc
set_amf id=3 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF3_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=3 full_nas_auth=on nia=null+zuc nea=null+zuc

#set_amf id=4 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF4_NG_ADDR:38412 region=1 set_id=2 pointer=2
#amf_param id=4 full_nas_auth=on nia=null+zuc nea=null+zuc

amf_ng_setup_param id=1 relative_capacity=100  include_backup_amf_name=off
amf_ng_setup_param id=2 relative_capacity=100
amf_ng_setup_param id=3 relative_capacity=100

set_backup_amf main=1 backup_amfs=2

amf_param id=1 indirect_data_forwarding=on
amf_param id=2 indirect_data_forwarding=on
amf_param id=3 indirect_data_forwarding=on
#amf_param id=4 indirect_data_forwarding=on
#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 ng=$GNB2_NG_ADDR gnb_id=0x0001 daemon=$SERVER_IP:$EDAEMON_PORT xn=$GNB2_XN_ADDR x2_peers=none amf=1
set_cell id=1 gnb=2 pci=16:2 tac=222 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=635676:635676 gscn=7880
#---------------------------------------------------------------------------------------------------

#target gNB (acting as eNB stub)
#---------------------------------------------------------------------------------------------------
set_gnb id=1 type=simulated plmn=311:489 ng=$ENB1_S1_ADDR daemon=$SERVER_IP:$EDAEMON_PORT gnb_id=0x12:28 nssai=0x01:0xD143A5
#set_cell id=1 gnb=1 pci=3:2 earfcn=1400:19400 tac=222 proxy=$PROXY_SERVER4_IP:12219 nrci=0x1 tdd_cell=on bw=20MHz technology=lte
set_cell id=1 gnb=1 pci=3:2 earfcn=1400:19400 tac=222 proxy=$PROXY_SERVER4_IP:12219|$PROXY_SERVER4_IP:8889 nrci=0x1 tdd_cell=on bw=20MHz technology=lte
gnb_param id=1 xn_listening_socket=true

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 gtpu=off retries=unlimited pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 file=AirPhoneConfig_l1bypass_tdd_sa_cmwv.xml

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
#ue_param id=1 ue_nr_capabilities=C1201000034F08480000002680800000003C00000000000008A80000000000000A84A00C0004089445 
#ue_param id=1 ue_nr_capabilities=212000000100000000C0400D9FFFFF828030100C028010008011090200021540 
ue_param id=1 ue_nr_
ue_param id=1 ue_nr_
ue_param id=1 dual_conn=eutra_nr




set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645402 mode=nr enb=2 cell=1
ue_param id=2 ue_nr_capabilities=C1201000034F08480000002680800000003C00000000000008A80000000000000A84A00C0004089445

set_ue simulated id=3 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645403 mode=nr enb=2 cell=1
ue_param id=3 ue_nr_capabilities=C1201000034F08480000002680800000003C00000000000008A80000000000000A84A00C0004089445


#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
qosflow_set id=1 5qi=5 default=on
qosflow_set id=2 5qi=7
qosflow_set id=3 5qi=1
qosflow_set id=4 5qi=2
qosrule_set id=1 proto=udp qos_flow=1
qosrule_set id=2 proto=tcp qos_flow=2
qosrule_set id=3 proto=udp qos_flow=3
qosrule_set id=4 proto=tcp qos_flow=4
set_nwslice id=1 qos_flows=1,2,3,4 qos_rules=1,2,3,4 snssai=0x01:0xD143A5 default=on ue=1-3 amf=1-3

set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

set_pdu_gateway id=2 ue_nat_ip=72.23.1.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP


debug_log level=4
sim_debug_log level=4 mme=1
sim_debug_log level=4 uec=1
sim_debug_log level=4 pgw=1
sim_debug_log level=4 sgw=1
sim_debug_log level=4 amf=1
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end

set_log log_to_file=on
sim_start version_check=off

