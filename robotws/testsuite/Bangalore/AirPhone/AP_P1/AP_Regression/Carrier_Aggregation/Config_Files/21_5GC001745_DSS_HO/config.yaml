variants:
  - name: "SANSA_FS_CPRI_CMWV_FDD+ECPRI_CMWV_TDD_AEQE_GMC"
    default: True
    maintainer: "I_5G_AIRPHONE_PZ_CIT_CRT_TEAM@internal.nsn.com"
    nodes:
      - node_id: 1
        files:
          - file_type: "scf"
            file_path: "sm/scfc.xml"
            hw_type: "sm"
            hw_id: 1
          - file_type: "swconfig"
            file_path: "sm/swconfig.txt"
            hw_type: "sm"
            hw_id: 1
          - file_type: "iphy_xml"
            file_path: "sim/iphy.xml"
            hw_type: "sim"
            hw_id: 1
          - file_type: "swconfig"
            file_path: "sim/swconfig.txt"
            hw_type: "sim"
            hw_id: 1
          - file_type: "wts_cfg"
            file_path: "wts/basic_setup.lua"
            hw_type: "vm"
            hw_id: 1
    simulators:
      - node_id: 1
        hw_id: 1
        sim_type: airphone
ute_ca_hooks:
  pre_sw_uploaded:
    package: "ute-ca-hook-airphone"
    entrypoint: "ute-ca-hook-airphone upload"
  commission:
    package: "ute-ca-hook-airphone"
    entrypoint: "ute-ca-hook-airphone commission"
  post_commissioned:
    package: "ute-ca-hook-airphone"
    entrypoint: "ute-ca-hook-airphone postcommissioned"
  post_execution:
    - package: "ute-ca-hook-airphone"
      entrypoint: "ute-ca-hook-airphone sosreport"
      execute_when: "failed"
    - package: "ute-ca-hook-airphone"
      entrypoint: "ute-ca-hook-airphone postpassedexecution"
      execute_when: "passed"
