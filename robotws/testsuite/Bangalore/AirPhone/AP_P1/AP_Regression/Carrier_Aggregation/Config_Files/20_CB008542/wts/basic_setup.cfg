set DAEMON_IP2="10.0.2.3"
set DAEMON_IP3="10.0.2.4"
set DAEMON_IP4="10.0.2.5"
set DAEMON_IP5="10.0.2.6"

set GNB4_NG_ADDR="10.0.1.109"
set GNB4_S1U_ADDR="10.0.1.118"
