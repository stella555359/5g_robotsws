set PDN_IP="4.7.254.208"
set PDN_IP_2="4.7.254.209"
#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$DAEMON_IP:12219|$DAEMON_IP:8889 earfcn=2000:20000 mapped_earfcn=4200:22200 tdd_cell=on mandatory_for_activation=off
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on serving_cell_index_range_scg=8:14

#----------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#----------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x01 daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none amf=1 plmnList=311:489 nssai=0x1:0xd143a5 xn=$GNB_XN_ADDR xp_management=on xp=$GNB_X2_ADDR:36422 xpu=$GNB_X2_ADDR:36422
set_cell id=1 gnb=2 nr_arfcn=135760:126380 gscn=1582 eci=0x000021f pci=16:2 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x01 tdd_cell=off  mandatory_for_activation=off
set_cell id=2 gnb=2 nr_arfcn=510000:510000 gscn=6372 eci=0x000021f pci=17:0 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x02 tdd_cell=on  mandatory_for_activation=off
#----------------------------------------------------------------------------------------------------

#---------------------------------------------------------------------------------------------------
#SIM GNB CONFIGURATION --Xn SA+NSA
#---------------------------------------------------------------------------------------------------
set_gnb id=24 type=simulated plmn=311:489 daemon=$SERVER_IP:$EDAEMON_PORT s1u=$GNB4_S1U_ADDR xn=$GNB4_Xn_ADDR xnu=$GNB4_Xn_ADDR gnb_id=0x18 ng=$GNB4_NG_ADDR amf=none plmnList=311:489 nssai=0x01:0xd143a5 x2_peers=none
gnb_param id=24 xn_listening_socket=on send_xn_setup=false
set_cell id=1 gnb=24 pci=200:0 tac=200 nrci=0x06 tdd_cell=on proxy=$DAEMON_IP4:9999|$DAEMON_IP4:8888 nr_arfcn=510000:510000 gscn=6372 mandatory_for_activation=off

set_gnb id=25 type=simulated plmn=311:489 daemon=$SERVER_IP:$EDAEMON_PORT s1u=$GNB5_S1U_ADDR xn=$GNB5_Xn_ADDR xnu=$GNB5_Xn_ADDR gnb_id=0x19 ng=$GNB5_NG_ADDR amf=none plmnList=311:489 nssai=0x01:0xd143a5 x2_peers=none
gnb_param id=25 xn_listening_socket=on send_xn_setup=false
set_cell id=1 gnb=25 pci=233:1 tac=200 nrci=0x07 tdd_cell=on proxy=$DAEMON_IP5:9999|$DAEMON_IP5:8888 nr_arfcn=511089:511089 gscn=7811 mandatory_for_activation=off

#----------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#----------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 tac_list=777,111,222,444,333,200	
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100 s5u_snd_buff_size=40M s5u_rcv_buff_size=40M s1u_snd_buff_size=40M s1u_rcv_buff_size=40M gtpu_read_packets_threshold=20
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13 sgi_rcv_buff_size=40M sgi_snd_buff_size=40M s5u_rcv_buff_size=40M s5u_snd_buff_size=40M gtpu_read_packets_threshold=20

#----------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#----------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=20

##add ims_voice_3gpp support
amf_param id=1 ims_voice_3gpp=on full_nas_auth=on
#----------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#----------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 proxy_snd_buf_size=20971520 proxy_rcv_buf_size=20971520 proxy_read_packets_threshold=20

