variants:
  - name: "SANSA_FS_TDD+FDD_4CC"
    default: True
    maintainer: "i_5g_airphone_pz_cit_crt_team@internal.nsn.com"
    nodes:
      - node_id: 1
        files:
          - file_type: "scf"
            file_path: "sm/scfc.xml"
            hw_type: "sm"
            hw_id: 1
          - file_type: "swconfig"
            file_path: "sm/swconfig_gnb.txt"
            hw_type: "sm"
            hw_id: 1
          - file_type: "iphy_xml"
            file_path: "sim/iphy.xml"
            hw_type: "sim"
            hw_id: 1
          - file_type: "swconfig"
            file_path: "sim/swconfig_ap.txt"
            hw_type: "sim"
            hw_id: 1
          - file_type: "wts_cfg"
            file_path: "wts/basic_setup.cfg"
            hw_type: "vm"
            hw_id: 1
ute_ca_hooks:
  pre_sw_uploaded:
    package: "ute-ca-hook-airphone"
    entrypoint: "ute-ca-hook-airphone upload"
  commission:
    package: "ute-ca-hook-airphone"
    entrypoint: "ute-ca-hook-airphone commission"
  post_commissioned:
    package: "ute-ca-hook-airphone"
    entrypoint: "ute-ca-hook-airphone postcommissioned"
  post_execution:
    package: "ute-ca-hook-airphone"
    entrypoint: "ute-ca-hook-airphone sosreport"
    execute_when: "failed"
