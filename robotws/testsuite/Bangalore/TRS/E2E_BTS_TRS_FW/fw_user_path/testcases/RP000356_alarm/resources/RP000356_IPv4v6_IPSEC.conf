config setup
    # strictcrlpolicy=yes
    # uniqueids = no
    #plutostart=yes
       #plutodebug=control
       uniqueids=no
       #charonstart=yes
       charondebug="dmn 1, mgr 1, ike 4, chd 1, job 0, cfg 0, knl 2, net 0, enc -1, lib -1"
        # plutodebug=all
        # crlcheckinterval=600
        # strictcrlpolicy=yes
        # cachecrls=yes
        # nat_traversal=yes
        # charonstart=no
        # plutostart=no


ca     rootca0
#       cacert=FTM_IV_4K3-cacert.pem

# Add connections here.

conn %default
       ike=aes128-sha1-modp1024,aes128-sha1-modp2048,3des-sha1-modp1024,3des-sha1-modp2048!
       esp=aes128-sha1,3des-sha1,null-sha1!
       ikelifetime=84256s
       auto=add
       reauth=no
       leftsendcert=yes
       rightsendcert=yes
       dpdaction=clear
       mobike=no
       type=tunnel
       #pfs=no
#       authby=psk
       dpddelay=360
       dpdtimeout=3600
       keylife=23h
       rekeymargin=180s
       rekeyfuzz=50%
       keyingtries=%forever
       authby=pubkey
       leftcert=BTSCert.pem


conn conn1
       keyexchange=ikev2
       ike=aes128-sha1-modp2048!
       left=10.0.1.1
       leftsubnet=10.0.1.1/32
       right=10.0.1.2
       rightsubnet=10.0.1.2/32
       rightid=%any
       fragmentation=yes


conn conn2
      keyexchange=ikev2
      ike=aes128-sha1-modp2048!
      left=10.0.1.1
      leftsubnet=10.0.1.1/32
      right=10.0.1.3/32
      rightsubnet=10.0.1.3/32
      rightid=%any
      fragmentation=yes


conn conn3
       keyexchange=ikev2
       ike=aes128-sha1-modp2048!
       left=fc00::1:1
       leftsubnet=fc00::1:1/128
       right=fc00::1:2
       rightsubnet=fc00::1:2/128
       rightid=%any
       fragmentation=yes	


