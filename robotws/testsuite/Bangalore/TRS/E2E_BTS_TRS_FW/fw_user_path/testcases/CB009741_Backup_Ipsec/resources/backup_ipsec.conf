# ipsec.conf - strongSwan IPsec configuration file

# basic configuration

config setup
	# strictcrlpolicy=yes
	# uniqueids = no
	#plutostart=yes
       #plutodebug=control
       uniqueids=no
       #charonstart=yes
       charondebug="dmn 1, mgr 1, ike 4, chd 1, job 0, cfg 0, knl 2, net 0, enc -1, lib -1"
        # plutodebug=all
        # crlcheckinterval=600
        # strictcrlpolicy=yes
        # cachecrls=yes
        # nat_traversal=yes
        # charonstart=no
        # plutostart=no


#ca     rootca0
#       cacert=FTM_IV_4K3-cacert.pem

# Add connections here.

conn %default
       leftcert=BTSCert.pem
       ike=aes128-sha1-modp1024,aes128-sha1-modp2048,3des-sha1-modp1024!
       esp=aes128-sha1,3des-sha1,null-sha1!
       ikelifetime=3600s
       auto=add
       reauth=yes
       leftsendcert=yes
       rightsendcert=yes
       dpdaction=clear
       mobike=no
       type=tunnel
       #pfs=no
       authby=pubkey
       dpddelay=360
       dpdtimeout=3600
       keylife=23h
       rekeymargin=180s
       rekeyfuzz=50%
       keyingtries=%forever

conn conn50
       left=10.0.1.7
       leftsubnet=10.0.1.1/32
       right=10.0.1.2
       rightsubnet=10.0.1.2/32
       rightid=%any

conn conn60
       left=10.0.1.9
       leftsubnet=10.0.1.1/32
       right=10.0.1.2
       rightsubnet=10.0.1.2/32
       rightid=%any

conn conn70
       left=10.0.1.11
       leftsubnet=10.0.1.1/32
       right=10.0.1.2
       rightsubnet=10.0.1.2/32
       rightid=%any

conn conn80
       left=10.0.3.7
       leftsubnet=10.0.3.1/32
       right=10.0.3.2
       rightsubnet=10.0.3.2/32
       rightid=%any

conn conn90
	left=10.0.3.9
	leftsubnet=10.0.3.1/32
	right=10.0.3.2
	rightsubnet=10.0.3.2/32
	rightid=%any	

conn conn100
	left=10.0.3.11
	leftsubnet=10.0.3.1/32
	right=10.0.3.2
	rightsubnet=10.0.3.2/32
	rightid=%any

