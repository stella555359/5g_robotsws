#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP

set GNB1_NG_ADDR="11.0.1.2"
set GNB1_XN_ADDR="11.0.1.2"

set GNB2_NG_ADDR="11.0.1.3"
set GNB2_XN_ADDR="11.0.1.3"

set PROXY_SERVER_IP="10.0.2.80"

set AMF_NG_ADDR="10.0.1.1"
set AMF2_NG_ADDR="10.0.1.20"

set UEC_ADDR="72.22.0.1"
set UPF_ADDR="10.12.2.1"
set UPF2_ADDR="20.2.3.1"

set EDAEMON_PORT="22222"
set DAEMON_PORT=$EDAEMON_PORT

set DEV_TUN_NAME="tunUPF"
set DEV_TUN2_NAME="tun2UPF"

# Variables for NSA configuration

set ENB1_S1_ADDR="10.0.1.121"
set ENB2_S1_ADDR="10.0.1.122"

set GNB_S1U_ADDR="11.0.1.2"
set GNB2_S1U_ADDR="11.0.1.3"

set ENB1_X2_ADDR="10.0.1.12"
set ENB2_X2_ADDR="10.0.1.13"
set GNB_X2_ADDR="11.0.1.2"
set GNB2_X2_ADDR="11.0.1.3"

set MME1_S1_ADDR="10.0.1.131"
set MME2_S1_ADDR="10.0.1.141"

set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"

set ENB_X2U_ADDR="10.0.1.136"
set ENB2_X2U_ADDR="10.0.1.146"

set PGW_ADDR="4.7.254.207"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"
set PDN_IP1="4.7.254.209"
set PDN_IP2="4.7.254.210"
set PDN_IP3="4.7.254.211"

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$CONTAINER_IP:$EDAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$CONTAINER_IP:12219 earfcn=2000:20000 mapped_earfcn=4200:22200
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on

set_enb id=5 plmn=311:490 s1=$ENB2_S1_ADDR enb_id_macro=0x12342 daemon=$CONTAINER_IP:$EDAEMON_PORT x2=$ENB2_X2_ADDR x2u=$ENB2_X2U_ADDR type=simulated x2_peers=none
enb_param id=5 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=5 eci=0x1234201 pci=3:2 tac=222 proxy=$CONTAINER_IP:12220 earfcn=2000:20000 mapped_earfcn=4200:22200
enb_endc_param id=5 control_flow_period=3gpp1 use_nr_ran_cont=on


#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 tac_list=111,200,210,222,333,444,777
mme_pool_area id=2 mmegi=1 plmn=311:490 tac_list=111,200,210,222,333,444,777

set_mme id=1 ip=$CONTAINER_IP:$EDAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte pool=1:1 pool=2:1
set_sgw id=1 ip=$CONTAINER_IP:$EDAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:2153
set_pgw id=1 type=simulated ip=$CONTAINER_IP:$EDAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------

#----------------------------operator1--------------------------------------------------------------
set_amf_region id=1 tac_list=0,100,200,258,788 plmn=311:489

set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=1 pointer=1
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR devname=$DEV_TUN_NAME

#---------------------------------------------------------------------------------------------------

#----------------------------operator2--------------------------------------------------------------
set_amf_region id=2 tac_list=0,100,200,258,788 plmn=311:490

set_amf id=2 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF2_NG_ADDR:38412 region=2 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=2 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF2_ADDR/24 ngu=$AMF2_NG_ADDR devname=$DEV_TUN2_NAME

smf_upf_mapping id=1 upf=1 id=2 upf=2 

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 ng=$GNB1_NG_ADDR gnb_id=0x01 daemon=$SERVER_IP:$EDAEMON_PORT xn=$GNB1_XN_ADDR x2_peers=none amf=1 plmnList=311:489,311:490
set_cell id=1 gnb=2 pci=16:2 tac=200 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=636666:636666 gscn=7880 mandatory_for_activation=off
set_cell id=2 gnb=2 pci=17:0 tac=200 nrci=0x02 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=636666:636666 gscn=7880 mandatory_for_activation=off

set_gnb id=3 type=external plmn=311:490 s1u=$GNB2_S1U_ADDR x2=$GNB2_X2_ADDR:36422 ng=$GNB2_NG_ADDR gnb_id=0x01 daemon=$SERVER_IP:$EDAEMON_PORT xn=$GNB2_XN_ADDR x2_peers=none amf=2 plmnList=311:489,311:490



#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 file=AP.xml

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
# NR UE capability
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
ue_param id=1 ue_nr_
set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645401 mode=nr enb=2 cell=1
ue_param id=2 ue_nr_

#UE Configuration for NSA Calls
set_ue simulated id=11 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 sec_key=0102030405060708090A0B0C0D0EFF00 eia=null+snow3g+aes eea=null nia=null+snow3g+zuc+aes nea=null+zuc+snow3g imsi=311:489:21645500
ue_param id=11 ue_nr_ dual_conn=eutra_nr ue_eutra_nr_
set_ue simulated id=12 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 sec_key=0102030405060708090A0B0C0D0EFF00 eia=null+snow3g+aes eea=null nia=null+snow3g+zuc+aes nea=null+zuc+snow3g imsi=311:406:21645501
ue_param id=12 ue_nr_ dual_conn=eutra_nr ue_eutra_nr_


#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_qosflow id=1 5qi=8 default=on
set_nwslice id=1 snssai=0x01:0xD143A5 default=on ue=1 amf=1
set_nwslice id=2 snssai=0x01:0xD143A6 default=on ue=2 amf=2

set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=2 ue_nat_ip=72.23.0.2 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=11 ue_nat_ip=72.23.0.11 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=12 ue_nat_ip=72.23.0.12 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

#---------------------------------------------------------------------------------------------------
#OTHER CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_bearer id=2 ue=11 qci=9 pdn=1 ip=$PDN_IP default=on ul_nat_gw=$SERVER_IP dl_nat_gw=$SERVER_IP trf_type=internal
uec_param id=1 reordering_window_size=1000 reordering_timer=200
set_bearer id=2 ue=12 qci=9 pdn=1 ip=$PDN_IP1 default=on trf_type=internal
uec_param id=1 reordering_window_size=1000 reordering_timer=200

debug_log level=0
sim_debug_log level=4 mme=1
sim_debug_log level=4 uec=1
sim_debug_log level=4 pgw=1
sim_debug_log level=4 sgw=1
link_ctrl_param hb_period=5 hb_retries=5
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
trace enb=1 protocol=x2 on
trace uec=1 protocol=x2 on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end

set_log log_to_file=on
sim_start version_check=off
