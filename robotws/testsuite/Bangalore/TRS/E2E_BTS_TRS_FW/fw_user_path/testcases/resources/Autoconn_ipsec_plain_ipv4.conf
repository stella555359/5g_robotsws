# ipsec.conf - strongSwan IPsec configuration file

# basic configuration

config setup
	# strictcrlpolicy=yes
	# uniqueids = no
	#plutostart=yes
       #plutodebug=control
       uniqueids=no
       #charonstart=yes
       charondebug="dmn 1, mgr 1, ike 4, chd 1, job 0, cfg 0, knl 2, net 0, enc -1, lib -1"
        # plutodebug=all
        # crlcheckinterval=600
        # strictcrlpolicy=yes
        # cachecrls=yes
        # nat_traversal=yes
        # charonstart=no
        # plutostart=no


ca     rootca0
       cacert=Autoconn_cacert.pem

# Add connections here.

conn %default
       leftcert=Autoconn_cert.pem
       ike=aes128-sha1-modp1024,aes128-sha1-modp2048,3des-sha1-modp1024,3des-sha1-modp2048!
       esp=aes128-sha1,3des-sha1,null-sha1!
       ikelifetime=84256s
       auto=add
       reauth=no
       leftsendcert=yes
       rightsendcert=yes
       dpdaction=clear
       mobike=no
       type=tunnel
       #pfs=no
       authby=pubkey
       dpddelay=360
       dpdtimeout=3600
       keylife=23h
       rekeymargin=180s
       rekeyfuzz=50%
       keyingtries=%forever

conn conn50
       rekeyfuzz=25%
       rekeymargin=120s
       left=10.0.1.1
       leftsubnet=10.0.1.1/32
       right=10.0.1.2
       rightsubnet=10.0.1.2/32
       rightid=%any
	  
