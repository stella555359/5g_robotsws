# ipsec.conf - strongSwan IPsec configuration file

# basic configuration

config setup
        # strictcrlpolicy=yes
        # uniqueids = no
        # plutostart=yes
        # plutodebug=control
        uniqueids=no
        #charonstart=yes
        charondebug="dmn 1, mgr 1, ike 4, chd 1, job 0, cfg 0, knl 2, net 0, enc -1, lib -1"
        # plutodebug=all
        # crlcheckinterval=600
        # strictcrlpolicy=yes
        # cachecrls=yes
        # nat_traversal=yes
        # charonstart=no
        # plutostart=no


ca     rootca0
       cacert=FTM_IV_4K3-cacert.pem

# Add connections here.

conn %default
       leftcert=accMME_4K3_004-cert.pem
       ike=aes128-sha1-modp1024,aes128-sha1-modp2048,aes128-sha1-ecp256,aes128-sha1-ecp384,aes128-sha256-modp1024,aes128-sha256-modp2048,aes128-sha256-ecp256,aes128-sha256-ecp384,aes128-sha384-modp1024,aes128-sha384-modp2048,aes128-sha384-ecp256,aes128-sha384-ecp384,aes128-sha512-modp1024,aes128-sha512-modp2048,aes128-sha512-ecp256,aes128-sha512-ecp384,aes128-aesxcbc-modp1024,aes128-aesxcbc-modp2048,aes128-aesxcbc-ecp256,aes128-aesxcbc-ecp384,3des-sha1-modp1024,3des-sha1-modp2048,3des-sha1-ecp256,3des-sha1-ecp384,3des-sha256-modp1024,3des-sha256-modp2048,3des-sha256-ecp256,3des-sha256-ecp384,3des-sha384-modp1024,3des-sha384-modp2048,3des-sha384-ecp256,3des-sha384-ecp384,3des-sha512-modp1024,3des-sha512-modp2048,3des-sha512-ecp256,3des-sha512-ecp384,3des-aesxcbc-modp1024,3des-aesxcbc-modp2048,3des-aesxcbc-ecp256,3des-aesxcbc-ecp384,aes192-sha1-modp1024,aes192-sha1-modp2048,aes192-sha1-ecp256,aes192-sha1-ecp384,aes192-sha256-modp1024,aes192-sha256-modp2048,aes192-sha256-ecp256,aes192-sha256-ecp384,aes192-sha384-modp1024,aes192-sha384-modp2048,aes192-sha384-ecp256,aes192-sha384-ecp384,aes192-sha512-modp1024,aes192-sha512-modp2048,aes192-sha512-ecp256,aes192-sha512-ecp384,aes192-aesxcbc-modp1024,aes192-aesxcbc-modp2048,aes192-aesxcbc-ecp256,aes192-aesxcbc-ecp384,aes256-sha1-modp1024,aes256-sha1-modp2048,aes256-sha1-ecp256,aes256-sha1-ecp384,aes256-sha256-modp1024,aes256-sha256-modp2048,aes256-sha256-ecp256,aes256-sha256-ecp384,aes256-sha384-modp1024,aes256-sha384-modp2048,aes256-sha384-ecp256,aes256-sha384-ecp384,aes256-sha512-modp1024,aes256-sha512-modp2048,aes256-sha512-ecp256,aes256-sha512-ecp384,aes256-aesxcbc-modp1024,aes256-aesxcbc-modp2048,aes256-aesxcbc-ecp256,aes256gcm128-prfsha256-prfsha1-ecp384,aes256-aesxcbc-ecp384!
       esp=null-sha1,null-sha256,null-sha384,null-sha512,null-aesxcbc,aes128-sha1,aes128-sha256,aes128-sha384,aes128-sha512,aes128-aesxcbc,3des-sha1,3des-sha256,3des-sha384,3des-sha512,3des-aesxcbc, aes192-sha1, aes192-sha256, aes192-sha384, aes192-sha512, aes192-aesxcbc,aes256-sha1,aes256-sha256,aes256-sha384,aes256-sha512,aes256gcm128,aes256-aesxcbc!
       ikelifetime=90000s
	lifetime=1300s
       auto=start
       reauth=no
       leftsendcert=yes
       rightsendcert=yes
       dpdaction=clear
       mobike=no
       type=tunnel
       #pfs=no
       authby=pubkey
       dpddelay=360
       dpdtimeout=3600
       keylife=86400s
       rekeymargin=180s
       rekeyfuzz=50%
#       keyingtries=%forever

