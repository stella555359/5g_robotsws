executors:
  - &gnb_cpcl_executor
    host: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.addr
    user: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.username
    password: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.password
  - &gnb_cpnb_executor
    host: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.addr
    user: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.username
    password: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.password
  - &gnb_cpif_executor
    host: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.addr
    user: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.username
    password: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.password
  - &gnb_oam_executor
    host: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.addr
    user: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.username
    password: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.password
  - &gnb_cprt_executor
    host: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.addr
    user: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.username
    password: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.password
    proxy: *gnb_oam_executor
  - &gnb_cpnrt_executor
    host: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.addr
    user: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.username
    password: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.password
    proxy: *gnb_oam_executor
  - &gnb_oam_webservice
    host: robot:tl.gnbs[0].cu.oam_http_connection_details.addr
    user: robot:tl.gnbs[0].cu.oam_http_connection_details.username
    password: robot:tl.gnbs[0].cu.oam_http_connection_details.password
    port: robot:tl.gnbs[0].cu.oam_http_connection_details.port




collectors:
  - &gnb_cpcl_tcpdump
    name: gnb_cpcl_tcpdump
    type: tcpdump
    interface: etha01vf3
    executor: *gnb_cpcl_executor
  - &gnb_cpnb_tcpdump
    name: gnb_cpnb_tcpdump
    type: tcpdump
    interface: etha01vf4
    executor: *gnb_cpnb_executor
  - &gnb_cpif_tcpdump
    name: gnb_cpif_tcpdump
    type: tcpdump
    interface: etha01vf5
    executor: *gnb_cpif_executor
  - &gnb_cprt_tcpdump
    name: gnb_cprt_tcpdump
    type: tcpdump
    interface: etha01vf1
    executor: *gnb_cprt_executor
  - &gnb_cpnrt_tcpdump
    name: gnb_cpnrt_tcpdump
    type: tcpdump
    interface: etha01vf5
    executor: *gnb_cpnrt_executor
  - &oam_gnb_snapshot
    type: snapshot_oam
    name: oam_gnb_snapshot
    coverage: Full
    force: 0
    timeout: 480
    webservice: *gnb_oam_webservice
  - &pm_files
    type: pmcounters
    name: pm_files
    webservice: *gnb_oam_webservice
  - &gnb_cpcl_journal
    name: gnb_cpcl_journal
    type: journal
    interface: etha01vf3
    executor: *gnb_cpcl_executor
  - &gnb_cpnb_journal
    name: gnb_cpnb_journal
    type: journal
    interface: etha01vf4
    executor: *gnb_cpnb_executor
  - &gnb_cpif_journal
    name: gnb_cpif_journal
    type: journal
    interface: etha01vf5
    executor: *gnb_cpif_executor
  - &gnb_cprt_journal
    name: gnb_cprt_journal
    type: journal
    interface: etha01vf1
    executor: *gnb_cprt_executor
  - &gnb_cpnrt_journal
    name: gnb_cpnrt_journal
    type: journal
    interface: etha01vf5
    executor: *gnb_cpnrt_executor

  - &gnb_list
    name: gnb_list
    type: group
    members:
      - *gnb_cpcl_tcpdump
      - *gnb_cpnb_tcpdump
      - *gnb_cpif_tcpdump
      - *gnb_cprt_tcpdump
      - *gnb_cpnrt_tcpdump

