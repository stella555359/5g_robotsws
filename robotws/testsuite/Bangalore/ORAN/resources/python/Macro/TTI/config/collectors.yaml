webservices:
  - &oam
    host: !robot tl.gnbs[0].cu.oam_http_connection_details.addr
    user: !robot tl.gnbs[0].cu.oam_http_connection_details.username
    password: !robot tl.gnbs[0].cu.oam_http_connection_details.password
    port: !robot tl.gnbs[0].cu.oam_http_connection_details.port
collectors:
  - &tcpdump
    name: tcpdump
    type: tcpdump 
    options: "-i eth3 udp and dst 10.0.1.1 and dst port 5678"
    sudo_password: ute
  - 
    name: l2stream3
    type: l2stream3_sbts
    destination_ip_addr: 10.0.1.1
    collector: *tcpdump
    l2_stream_configuration: [{}]
    webservice: *oam


