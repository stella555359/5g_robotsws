UE_POOLS:
    AndroidUePool:
        inline_config:
            LEGACY_1:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - REAL_UE
                    - REAL_ANDROID_UE
                    - Legacy1
                    - LEGACY1
                    - LEGACY_1
                STARTING_CELL: 0x288001                     # Cell ID to which UE should attach

                CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    imei: 355819290789084
                    device: 'AQKSLVH028M80900110'
                    serial_number: '38dfb053'          # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        uc_server_Ip: '10.53.47.141'    #ultracaller server IP

                        token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6Im9yYW4iLCJhZG1pbiI6IiJ9.XpACYLWTJFR1AivuYMLXmDyw9V4ZvQSmqlwhrLU5fUs'  # ultracaller server token
                        ue_pc_ip: '10.53.188.179'        # UE PC IP address
                        cid: '1'
                        clear_logs: 'yes'
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'inbabtslabuser'                     # SSH login to UE PC
                        password: 'BT5l@bus3rl0g1n'               # SSH password to UE PC
                        # shieldbox_com: '21'             # Popek shieldbox COM number (uncomment only if you use Popek shieldboxes)
                        # usb_port_no: '1'                # USB line on Popek Shieldbox (uncomment only if you use Popek shieldboxes)

                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        qcat_exe_path: 'C:/Program Files (x86)/Qualcomm/QCAT 6.x/Bin/qcat.exe'    #PATH TO QCAT EXE APPLICATION
                        diag_cfg_path: 'C:/pyro_server/DIAG.cfg'      # PATH to DIAG.cfg file on UE PC (required to decode qmdl file)
                        iperf_loc:  'C:/Tools/iperf/iperf.exe'
                        processes_to_kill:                # phrases based on which processes names will be found and killed before test (case insensitive)
                            - 'putty'
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                            - 'python'
                            - 'AtmnServer'
                        data_transfer:                    # Iperf endpoint details
                            ssh:
                                host: '10.58.241.108'
                                user: 'ftpuser'             # Iperf endpoint SSH login
                                password: 'ftpuser'      # Iperf endpoint SSH password
                            ping:
                                ping_host_ip: '10.63.25.107' # Remote host for ping (Start Data Transfer icmp protocol)
                                ping_count: '10'            # ping -c (count) option
                                allowed_packet_loss: '5'    # Allowed packet loss in %
                            iperf_udp:                            #Iperf parameters for DL (ex:iperf -u -c 10.43.80.157 -p 53001 -b 1000M -l 1400 -t 300 -i 1 -fm)
                                -p:53003
                                -b:1500M
                                -l:1200
                                -t:1800
                                -i:1 
                            iperf_tcp:                           #Iperf parameters for DL (ex:iperf -c 10.43.80.157 -p 53001 -b 1000M -l 1400 -t 300 -i 1 -fm)
                                -p:53009
                                -t:120
                                -P:4
                                -M:1372
                                -i:1
                                -b:1500M
                                -l:1200
                            iperf:                            #Iperf parameters for DL (ex:iperf -u -c 10.43.80.157 -p 53001 -b 1000M -l 1400 -t 300 -i 1 -fm)
                                -p:53003
                                -b:1500M
                                -l:1200
                                -t:300
                                -i:1                            
            CatM:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - QUALCOMM_UE
                    - CATM
                    - catm
                    - CATM1
                    - CatM



                CLASS: QualcommNoLicenseUe                # UE type is Qualcomm
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to QualcommNoLicenseUe constructor when Ue instance is created.
                    configuration:
                        serial_com: '19'                  # COM ID obtained from qualcomm modem
                        diag_com: '21'                    # Diagnostic COM ID
                        iperf_loc: 'c:/Tools/iperf/iperf.exe'       # Iperf.exe location on UE PC
                        ue_pc_ip: '10.53.188.179'        # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'inbabtslabuser'                  # SSH login to UE PC
                        password: 'BT5l@bus3rl0g1n'              # SSH password to UE PC
                        server_dir: '/cygdrive/c/pyro_server'
                        server_python: 'c:/Python27/python.exe'     # UE PC python location from Windows POV
                        enable_disable_cfun: 'no'        # enables CFUN (AT+CFUN=1) before attach, disables (AT+CFUN=0) after detach
                        reset_interface: 'no'
                        restart_wwansvc: 'no'
                        clear_server_files: 'yes'
                        clear_logs: 'yes'
                        processes_to_kill:                # phrases based on which processes names will be found and killed before test (case insensitive)
                            - 'putty'
                            - 'QXDM'
                            - 'adb'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                        data_transfer:                    # Iperf endpoint details
                            ssh:
                                host: '10.58.241.108'       # Iperf endpoint IP
                                user: 'ftpuser'             # Iperf endpoint SSH login
                                password: 'ftpuser'      # Iperf endpoint SSH password
                            iperf_interface_ip: '10.58.241.108'
                            iperf_options:
                                packet: '1024'

