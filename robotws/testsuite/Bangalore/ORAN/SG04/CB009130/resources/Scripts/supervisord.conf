[supervisord]

nodaemon=true

logfile=/var/log/supervisord.log

loglevel=debug

user=root



[supervisorctl]

serverurl = http://127.0.0.1:9001



[inet_http_server]

port = 9001



[rpcinterface:supervisor]

supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface



[program:sftpd-launch]

command=service ssh start

autorestart=false

redirect_stderr=false

startsecs=0

priority=3



[program:sequence]

command=/usr/bin/supervisorctl restart app:

autostart=false

autorestart=false

redirect_stderr=true

priority=1

stdout_logfile = /var/log/supervisord/orusw.log



[group:app]

programs=netopeer2-server,orusw,CarrierStateManager



[program:netopeer2-server]

command=/usr/sbin/netopeer2-server -d -t 70 -c MSG

autostart=false

autorestart=false

redirect_stderr=true

priority=3

stdout_logfile = /var/log/supervisord/orusw.log

stopsignal=KILL



[program:orusw]

command=/usr/local/bin/orusw -d -v 2

autostart=true

autorestart=false

redirect_stderr=true

priority=30

stdout_logfile = /var/log/supervisord/orusw.log



[program:CarrierStateManager]

command=/usr/local/bin/carrierstatemanager

autostart=true

autorestart=false

redirect_stderr=true

priority=30

stdout_logfile = /var/log/supervisord/orusw.log

stopsignal=INT
