
#1rameter should be match the value in ./edaemon --port <DAEMON_PORT>
set DAEMON_PORT=10000

set APN_NAME="5gkrk"
set SC5G_ENB_29="10.84.164.127"

# TIMERS
mme_timer T3489=12000ms
mme_timer T3470=12000ms

#Ports are assigned according to standard
set S1_ADDR="10.255.4.25:36412"
set S1U_ADDR="10.255.4.25:2152"
set S11_ADDR="10.255.4.25:2153"
set PGW_ADDR="40.1.1.254/16"


#Providing information real-life devices in the setup


set_enb id=1 plmn=001:01 s1=$SC5G_ENB_29 enb_id_macro=0xdc63e daemon=:$DAEMON_PORT

#configuring EPC
set_mme id=1 ip=:$DAEMON_PORT s1=$S1_ADDR mmegi=1 mmec=3

# TCP priv settings
set_sgw id=1 ip=:$DAEMON_PORT s1u=$S1U_ADDR s11=$S11_ADDR s1u_rcv_buff_size=200000 s1u_snd_buff_size=200000 s5u_rcv_buff_size=200000 s5u_snd_buff_size=200000 gtpu_read_packets_threshold=0
set_pgw id=1 ip=:$DAEMON_PORT apn=$APN_NAME devtype=tun devname=tunPGW addr=$PGW_ADDR sgi_rcv_buff_size=200000 sgi_snd_buff_size=200000 s5u_rcv_buff_size=200000 s5u_snd_buff_size=200000 gtpu_read_packets_threshold=0 sgi_read_packet_threshold=0 primary_dns=8.8.8.8 secondary_dns=8.8.4.4

