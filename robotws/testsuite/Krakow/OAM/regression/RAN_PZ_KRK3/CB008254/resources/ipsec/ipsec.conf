# ipsec.conf - strongSwan IPsec configuration file

# basic configuration

config setup
       uniqueids=no
       charondebug="dmn 4, mgr 4, ike 4, chd 4, job 1, cfg 1, knl 1, net 1, enc 1, lib 1"

# Add connections here.

conn %default
       auto=add
       mobike=no

conn ASIR5G_1a
       type=tunnel
       leftsubnet=0.0.0.0/0
       rightsubnet=172.40.1.2/32
       left=10.10.10.250
       right=10.10.10.10
       keyexchange=ikev2
       reauth=no
       ike=aes128-sha1-modp1024,aes128-sha1-modp2048,3des-sha1-modp1024,3des-sha1-modp2048!
       esp=aes128-sha1,3des-sha1,null-sha1!
       ikelifetime=84364s
       authby=pubkey
       rightid=%any
       dpdtimeout=120
       keylife=86400s
       dpdaction=clear
       dpddelay=10
       leftcert=debianSeGW.pem
       rekeyfuzz=25%
       rekeymargin=120s
       lifepackets=4294967295
       marginpackets=1073741824
