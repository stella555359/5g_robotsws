[tool.robotidy]
diff = true

configure = [
    "NormalizeTags:enabled=False",
    "ReplaceRunKeywordIf:enabled=False",
    "SplitTooLongLine:split_single_value=True",
    "SplitTooLongLine:line_length=140",
    "SplitTooLongLine:skip_sections=tags",
    "AlignSettingsSection:min_width=17",
    "RenameVariables:enabled=True",
    "RenameKeywords:enabled=True"
]
