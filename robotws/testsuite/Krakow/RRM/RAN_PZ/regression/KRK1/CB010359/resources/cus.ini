[executor]
log_level            = DEBUG
log_global_file_name = log_global.txt
log_dir              = /home/cus/logs
ue_config_url        = file:///opt/cus/etc/ue.db
duplex_mode          = TDD
hardware_platform    = CUS2
start_on_cells_oos   = true

[enb_1]
enb_type = FLEXI

[ip_configuration]
workstation_ip_addr = 192.168.200.126
netmask             = 255.255.255.0
lte_network_gw      = 10.0.2.1
ss_ip_addr_pool     = 185.4.0.0/16

[ctrl_1]
sectors                  = [1-3,7-9]
ip_addr                  = 192.168.200.1
trsw_ip                  = 10.0.2.2
sync_source              = BackplanePPS
mirroring_l2_on_startup  = 2
mirroring_sch_on_startup = 2


[sector_1-3,7-9]
enb       = 1
antennas  = [X]:0:TxRx, [X]:1:TxRx, [X]:2:TxRx, [X]:3:TxRx, [X]:4:TxRx, [X]:5:TxRx, [X]:6:TxRx, [X]:7:TxRx
enb_cell_id = [X+20]
mplane_only =  1

[radio_1-3,7-9]
rmod_type = AZQG
link_type = ECPRI
links[1]     = 1.1:1
links[2]     = 1.2:1
links[3]     = 1.3:1
links[7]     = 1.7:1
links[8]     = 1.8:1
links[9]     = 1.9:1



[tgr_1]
ip_addr         = 10.0.2.101
etgr            = on
ss_interface    = eth101
side            = SS
user            = root
password        = cussim
update_cmd      = sudo /opt/cus/var/update/update.sh
restart_cmd     = sudo /etc/init.d/cus-tgr restart

[tgr_2]
ip_addr         = 10.0.2.100
etgr            = on
etgr_ip_addr    = 10.0.2.102
ue_interface    = eth100
side            = MS
user            = root
password        = cussim
update_cmd      = sudo /opt/cus/var/update/update.sh
restart_cmd     = sudo /etc/init.d/cus-tgr restart
