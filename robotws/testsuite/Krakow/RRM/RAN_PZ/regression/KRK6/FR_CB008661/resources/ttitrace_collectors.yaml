webservices:
  - &oam
    host: 192.168.255.129
    user: Nemuadmin
    password: nemuuser
    port: 443
  - &oam2
    host: 10.84.190.29
    user: Nemuadmin
    password: nemuuser
    port: 443
collectors:
  - &tcpdump
    name: tcpdump
    type: tcpdump
    options: "-i eth0 udp and dst 10.84.183.78 and dst port 5678"
    sudo_password: uteUTE!
  - &tcpdump2
    name: tcpdump2
    type: tcpdump
    options: "-i eth0 udp and dst 10.84.183.78 and dst port 5678"
    sudo_password: uteUTE!
  -
    name: l2stream3
    type: l2stream3_sbts
    destination_ip_addr: 10.84.183.78
    collector: *tcpdump2
    l2_stream_configuration: [{nr_phy_cell_ids: [61]}]
    webservice: *oam2
  -
    name: l2stream31
    type: l2stream3_sbts
    destination_ip_addr: 10.84.183.78
    collector: *tcpdump
    l2_stream_configuration: [{nr_phy_cell_ids: [50]}]
    webservice: *oam
