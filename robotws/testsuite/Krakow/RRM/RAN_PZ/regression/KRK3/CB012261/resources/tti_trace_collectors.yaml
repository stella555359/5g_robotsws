webservices:
  - &oam
    host: 192.168.255.129
    user: Nemuadmin
    password: nemuuser
    port: 443
collectors:
  - &tcpdump
    name: tcpdump
    type: tcpdump
    options: "-i eth0 udp and dst 10.84.128.150 and dst port 5678"
    sudo_password: uteUTE!
  -
    name: l2stream3
    type: l2stream3_sbts
    destination_ip_addr: 10.84.128.150
    collector: *tcpdump
    l2_stream_configuration: [{nr_phy_cell_ids: [34]}]
    webservice: *oam

