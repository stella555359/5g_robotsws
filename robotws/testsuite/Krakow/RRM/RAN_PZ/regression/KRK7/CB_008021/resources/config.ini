########################################################################################################################################################
##
##
##  This is config file for gnb_logs tool, requires gnb_logs v2.33 or later
##
##  Please read the comments before changing any values.
##
##  Note 1:
##  The tool saves trace logs in set of files as ring buffers, which are circally overwritten after full.
##  If log files are overwritten, only the latest log would be collected after tool is stopped. 
##  Ring buffer files are generated in running PC or target BTS, according different command options for remote or streaming log trace.
##  In case change the log size, please check the PC disk size or SYSMOD free memory in BTS first. 
##  In BTS, both commands below are needed. Usually up to half of free memory in /tmp folder can be used for log files.
##     > df -h /tmp
##     > free -m
##  For remote BIP trace when ABIL and ABIO are mixed in BTS, or (BIP_from_abil_cores = 1) is set, 
##  or remote TTI trace with option "-t" (which should NOT be used in live network), free memory in target BBMOD should also be checked.
##  
##  Note 2:
##  If addon command is setup for BTS units, be careful to make sure every command you added is safe to BTS. 
##  Wild command might corrupt the whole BTS! the tool make no any validation for your setup! 
##
##
########################################################################################################################################################

[CONNECTION]

## Default BTS IP address. If this is set, no need to input IP from command line during execution.
##   However, it will be overwritten if command line gives other IP address. 
gnb_ip = 192.168.255.129


## RU info is hardcoded in the tool already. Please add login info here in case there's new RU model which makes the tool stuck in access
## Values: RU_type, user_name, password
#RU_login1 = AEQN, root, w@=EIj7P6R0bVy85OjCVa^ho&8
#RU_login2 = ...



[COMMON]
###Section for common configuration. some of them maybe not working since lack of testing..

## Collect logs for multiple times
Loop_collection_times = 1

## Interval (in seconds) for every loop time. Value would be ignored if it's less than each collecting time
## This can be used for periodic running
Interval_for_every_loop = 0

##  If logs are huge, increase this value in case failure got after the running progress:
##    '>> root : CRITICAL _sys: Collecting timed out!'
Collecting_timeout_seconds = 600
aasyslog_timeout_seconds = 360
addon_cmd_timeout_seconds = 10
admin_cli_timeout_seconds = 30

## More time if option "-x" is used for standard snapshot, which is slow
Extra_seconds_for_xeron_snapshot = 600

## Interval for periodically checking the trigger conditions
Trigger_scan_interval = 2
## Delay time after alarm/syslog/journal/counter triggering
Seconds_delay_after_triggering = 0

## Scan a file to stop monitoring instead <Enter> pressing: (For Windows only, In Linux it's enabled by default.)
# It can be used for TA e.g.: "touch ./stop_mon.log" to stop the gnb_logs. Tool would clean the file before exiting. 
#Monitoring_stop_with_file = stop_mon.log

## If addon commands is configured, besides the addition log folder generation, write addon command printout into the tool.log as well. 
Addon_cmd_to_tool_log = 1

## Continue or stop running after BTS connection drop detected
Reconnet_after_drop = yes

## Wait for RU up if gNB reconnected. Need to be yes if addon script needed in RU after reset.
Reconnect_wait_RU_startup = yes

## Need <Enter> press or not during startup. set to no if run tool in backgound
Monitoring_start_with_enter = no

## Collect nodes one by one to reduce CPU load. (No need)
#Aasyslog_slow_mode = no
## Save logs into ROM. Avoid to use this because of slow and risk!! Too much data would corrupt the flash memory!!
#Use_rescue_dir = false


## Zip the collected logs or not 
# 2: Zip logs in gNB before downloading; 1: Download then zip localy; 0: Download, not zip;   -1: Never download logs
Zip_logs_in_gnb = 1
## Use pcap lib or raw socket to capture streaming log.  bit 0 for streaming bip, bit 1 for L2 trace
Use_lib_pcap = 0


[TTI_DECODING]
### Collected TTI logs can be decoded into csv files automatically (with Tti_raw_logs_only = no) or manually (run with -td option). 

# Whether automatically decode the collected raw logs into csv files or not:
# Raw tti log could be *.bin files got by "-t" option (remote mode), or *.pcap logs got by "-o l2ps" option (streaming mode)
Tti_raw_logs_only = no

# Filters for decoding. Only listed events would be decodeded:
#Tti_decoding_filter_events = utcTimestampData,dlFdSchedData															 														  

												
# Maximum file size (MB) after TTI decoding. 
# Huge csv file might make Excel stuck, so the generated csv file would be split if exceed this value:
Tti_decoded_file_size = 500

# An event would be split into mult-lines if array included. For speed-up, following would never be split:
Tti_decoding_non_splits_events =  csiRsSchedData,csiSrReportData,dlAvgSinr,dlBeamData,dlFlowControlData,dlLaAverageCqi,dlLoadControlData,dlPreSchedData,dlTpc,SrsPowerOffsetData,ulAvgSinr,ulBeamData,ulBsrRxData,ulHarqRxData,ulIntraDlToUlDrxSyncDlData,ulLaAverageSinr,ulLaDeltaSinr,dlMetricIndData,ulLaPhr,ulLoadControlData,ulMuUeData,ulPduDemuxData,ulPreSchedData,ulPucchReceiveRespPsData,ulPuschReceiveRespPsData,ulTpc,utcTimestampData

			
[FLAGS_B4_MONITORING]
### RD flags to set into BTS before monitoring logs. (-s/-w/-b/-u... options). 
### Note: Flags should be recovered by configure value back here and run tool again, or make a BTS restart.

## For example:
# ERadCcs_AaSysLogInputLevel, 0 = disable 1 = debug 2 = info 3 = warning 4 = error 5 = vip 6 = disable
#0x1003F=1
# ERadCcs_AaSysLogOutputLevel
#0x10040=1

## Log level for CPlane:
#From 5G21A to 22R3, Cplane (CPIF,CPCL,CPNB,CPUE) loglevel can be dynamically changed on the fly here. 
#But from 23R1, BTS webEM has menu: "Procedure -> BTS R&D Debug Parameters Management",  Cplane flags here does not work any more.
#Values available: trace, debug, info, warning, error, critical, off
#CP_logging_level = debug


[MONITORING_LOGS]
### Here's log file size and numbers for different trace generated by certain options. Each trace can be also combined into option -m
### Monitoring(Trace) messages are saved into these files as ring buffer, i.e. files would always be overwritten after full
###    - For remote trace: options -b, -E, -u, -cp: files located in /tmp folder of FCT;
###                        options -t, or -b with ABIL+ABIO:  files located in /tmp folder of FSP.
###    - For streaming trace: options -B, -e, -o, -O: files located in running folder ./run of local PC.
### Before changing the values, make sure the BTS and/or PC has enough space  (use "df -h /tmp" command)
### Otherwise tool may fail in startup, or risk to BTS or PC restart in worst case.

																				  

#####################################################
### BIP  
###      option -b: remote, -B: steaming            #

# BIP log in option -m or not
BIP_in_option_m = yes
# Single log file size (in MB)
BIP_file_size = 120
# File numbers (as Ring buffer) generated in fctla (/tmp/gnblogs/), or ABIL(if ABIL/ABIO mixed in gNB, or BIP_from_abil_cores!=0)
BIP_log_files = 15

#Zip each generated log file to save space (20% or more may be zipped out, according traffic model. but logs from high traffic might be lost due to slow in zipping)
BIP_zip_each_file = no

#Monitor one way messages in case performance restricted
BIP_L1L2_UL = yes
BIP_L1L2_DL = yes

# Message filter for tcpdump, for example, filter certain "SW Event -> SW Event Header -> Message ID" in BIP packets.
# The offset for "Message ID" is fixed, but different in each SYSMOD HW:
#1. For ASIK/ASIL/ASOE, offset is 24. An example to discard DlData_EmptySendReq(0xe111)/SlotTypeReq(0x0122):
#Bip_filter = ether[24:2]!=0xe111 and ether[24:2]!=0x0122
#2. For ASIB/ASIM, offset is 28. An example to capture only UlData_PucchReceiveRespPs(0xe225)/HarqD(0xe208):
#Bip_filter = ether[28:2]==0xe225 or ether[28:2]==0xe208
#3. One more example. Below is identical filter but for different units. First one for ASIB, Second one for ASIL. (all offsets have a gap of 4)
#Bip_filter = ether[28:2]==0xe24d or (ether[28:2]==0x0108 and (ether[0x3a:1] & 0x40==1)) or (ether[28:2]==0xe239 and ether[41:1]==0x3a)
#Bip_filter = ether[24:2]==0xe24d or (ether[24:2]==0x0108 and (ether[0x36:1] & 0x40==1)) or (ether[24:2]==0xe239 and ether[37:1]==0x3a)

#Bip_filter = UlData_PuschReceiveRespPs or UlData_PucchReceiveRespPs or UlData_PrachReceiveInd
Bip_filter = vlan and ether[24:2]=0xe24b or ether[24:2]=0xe24c or ether[24:2]=0xe24d

#Includes L2HI_L2RT messanges into BIP log. For ABIL/ABIO and ASOE
BIP_includes_l2rt = no
#Includes L2HI_TRSP transport flow in ABIO. CA ctrl msg between two ABIO would be captured as well.
BIP_includes_abio_trsp = no
#ASOE bip coverage:  0: None; 1: Loki A; 2: Loki B; 3: both Loki
BIP_includes_asoe_loki = 3

#Includes L2HI messages into BIP log. For ABIL only
BIP_includes_abil_l2hi = no
#Includes SYSCOM messages into BIP log, For ABIL only
BIP_includes_abil_syscom = no


#Capture inside ABIL or not. 0: disabled;  1: capture in L2RT core; 2: capture in both Xeon cores, i.e. fsp-a & fsp-b; 
BIP_from_abil_cores = 0

#FCT Interface port for BIP streaming to external server. (if option -B is used with cabling FCT port to running server)
# ASOE: default SEI, could be EIF2, or EIF3;  
# ASIB: default ethsei10, could be ethsei11, ethsei12, ethsei13 on SEI2, or ethsei00 to ethsei03 on SEI1
# ASIL: default sei11, could be sei12, sei13, sei14 on SEI1, or  sei21 to sei 24 on SEI2
# ASIK: default EIF2, not changable.
#BIP_external_interf = EIF2

#Bit rate of FCT interface for external mirroring. (Now support ASOE only: 1g-sgmii;  10g-sfi;  1000base-x;  other HW are 10G by default)
BIP_external_interf_rate = 1g-sgmii

#Seconds delay to cover the IQ sample time for ABIL. (For ABIO,BIP monitoring will stop after IQ collecting is fully done)
BIP_delay_after_eloner_ddr4_started = 20
BIP_delay_after_loner_ddr4_started = 0

# Capture eCPRI messages (IQ Sample) in BIP log, no option -d needed. (message would be rapidly overwritten) 
# for ABIK/ABIL HW only. 1: port arb0p3/S-RF1; 2: port arb0p4/S-RF2; 3: both port arb0p3 and arb0p4
BIP_includes_ecpri = 0


#####################################################
### EMIL  
###       option -e: streaming, -E: remote          #

# Emil log trace included into option -m or not.  0: No log; 1: streaming log; 2: remote log
Emil_in_option_m = 2
# Emil log size(MB) of each single file, and total log files: in fctla (/tmp/gnblogs/) with option -E or streaming to PC (./run) with option -e
Emil_file_size = 50
Emil_log_files = 6
# Zip each generated file to save space. With zipping, generated file size ~= Emil_file_size*0.3.  Option '-uz' available for unzipping all collected files.
Emil_zip_each_file = yes

# Emil log receiving port. Legacy value, N/A for SRAN 
Emil_listen_port = 55000

# To collect 4G log or not if SRAN interface is available
# 0: 5G only; 1: 4G only;  2: both 5G and 4G (if BTS has any).  ##Not working properly for LTE now!
Emil_for_sran_4G = 0

# To collect PCMD(Per Call Measurement Data) log as well or not. (PCMD activaton is rather slow. )
# Note: If TCE-1,NRCTRLTS-1,NRDU-1 are already created in the BTS, they would be removed after tool exiting.
Emil_include_PCMD = no
#Port to receive PCMD log. 5G: 49148. (4G: 49151)
PCMD_listen_port = 49148
# Max UE traced per cell
PCMD_cell_max_UEs_Traced = 100
# Certain cell for the PCMD trace. If not given, trace from all resources
#PCMD_resource_DN = MRBTS-73/NRBTS-73/NRCELL-301
#Time interval between two consecutive periodic ReportStrongestCells measurement reports configured at the UE:  
# ms120, ms640, ms480, ms640, ms1024, ms2048, ms5120, ms10240, ms40960, min1,min6,min12,min30																							 
PCMD_report_interval = ms5120
# r2, r4, r8, r16, r32, r64, infinity. 
PCMD_report_amount = infinity

# PM counter trigger. Log would be collected if counter(s) reported by PMI ticket.
# All CPUE counters are reported by PMI ticket, which can be seen in Emil tool. Single or mutiple counters can be set here:
#  -- If multi-counter seperated by ",", any of them reported would stop the log trace;
#  -- If multi-counter seperated by "&", only after a call gets all the counters, log trace would be stopped. 
# Note: too many counters might consume CPU in running PC and make messages drop in collected emil log, especially "&" used for high load BTS
#PM_Counter_trigger = M55125C05555, M55124C01031&M55125C08503
# If multi-counter set with "&", log would be tiggered only if all the counters are pegged in a UE call within below seconds.
PM_multi_counter_checking_time = 15
# Check sequence number if message drop happening or not. 
# After continuous drop exceeds below value, printout would be in tool.log. #It seems no use: Only SCTP message can be checked
Emil_msg_seq_check = 2

#####################################################
### SYSLOG  
###         option -s, streaming                    #

Syslog_in_option_m = yes
# File size (MB) and numbers (as Ring buffer) generated in local PC. Syslog is always streaming to local PC (./run)
Syslog_file_size = 50
Syslog_log_files = 20
## Zip each generated file to save space. With zipping, generated file size ~= Syslog_file_size*0.2
Syslog_zip_each_file = no

# Log sources:
Syslog_BBU = yes
Syslog_RU = no
# Logs from all sub nodes such as MADE. (not working in BTS trunk SW, need addon commands to get the logs)
Syslog_RU_sub_nodes = no
# Delay seconds since streaming syslog might be slow e.g. from L2 unit.
Syslog_stop_delay = 10																	   

# Trigger to automatically stop the tool when the string got in syslog. (regular expresion is supported). 
#Syslog_trigger = "Received reset request from"
#Syslog_trigger = Send LoUser_CcchDataReceivedInd: crnti: \d+, nrCellIdentity:



#####################################################
### L2 Trace  
###           option -o: component, -O: sherpa.     #
###           streaming log types:  '-oO [l2lo|l2ps|l2pdcp|l2hirlc|all]',  '-o l2ps' for tti trace

# L2trace in option -m or not. Cell and trace SW would be selected during startup. 0: No log; 1: Component trace; 2: Sherpa trace;  3. Both Component and Sherpa trace
L2Trace_in_option_m = 0
# File size (MB) and numbers (as Ring buffer) generated in local PC (./run) for steaming log monitoring
L2trace_file_size = 100
L2trace_log_files = 30
## Zip each generated file to save space.
L2trace_zip_each_file = no

# Local UDP port to receive L2 steaming log. 
L2trace_start_port = 5678

L2trace_dscp = 0


#####################################################
## L1 
##     option -q for IQ sample(DDR4 log):  "-q [dl|ul] [subcell_IDs]",  "-q [subcell_IDs]" for both dl & ul

# L1 full logs (IQ sample, Loner L2 msg header, Tx leka registers) included or not in option -m
L1_log_in_option_m = no
# Whether collect L1 snapshot or not
L1_lococtl_logs = yes

# Note: IQ Sample is only a sample of several frames, but it's rather slow which would delay all the other logs collecting if enabled
DDR4_in_option_m = no

# Frames for Loner CPRI to be collected. (For eCPRI, or for Loki, frame number is not editable)
#0x12BFFFC Bytes for 1 frame. maximum 20 frames. Value would be overwritten by -d [frames] option if given in command line
DDR4_capture_frames = 3

# Subcell(s) where DDR4 (IQ sample) logs to be collected, in case "-C <NRCELL>" not given in the command, and command w/o "-q [ul|dl] [subcell_IDs]"
#Antsnap_dl_subcell_ids = 0,1
#Antsnap_ul_subcell_ids = 0


# Do some cleanup automatically in case free memory is less than this value (in MB):
# To avoid risk, IQ from Loner would be given up if memory is still not enoough after cleanup.
DDR4_min_free_mem = 80
# By default eLoner SW works for eCPRI configuration.But it's also possible that links downgraded into CPRI:
DDR4_cpri_from_eloner = 0

# Collecting time for loki
DDR4_timeout_seconds = 15

# Collect multiple IQ samples 
DDR4_times = 1		 



								
#####################################################
### CP/E1-F1 tcpdump 
###            option -cp                           #

# Cplane tcpdump in option -m or not
CP_in_option_m = no
## Single log file size (in MB)
CP_file_size = 120
# File numbers (as Ring buffer) generated in fctla (/tmp/gnblogs/)
CP_log_files = 3
#Zip each generated log file to save space
CP_zip_each_file = yes
# For capture on certain interface
#CP_interface = br1
# Filter if needed
#CP_filter = (host 10.56.123.3 or host 10.110.66.198)
# Capture from backhaul only
#CP_captures_backhaul_only = yes
#Capture SCTP or all packets in FCT. (Note: To capture all packets might get performance risk!)
CP_captures_sctp_only = yes


#####################################################
### UP 
###              option -u                          #

# Backhaul Uplane trace in option -m or not
UP_in_option_m = no
# Use vtc for backhaul capturing. (only single log file with default size is supported)
UP_use_vtc = yes
# capture point A or point B (before IPSec gateway). 1 for point A, 2 for point B
UP_capture_point = 1
# Log packing timeout value. ( file hanndling time, Not trace time)
UP_vtc_timeout_seconds = 60

## Below values log size only applicable when vtc is unavailable, such as in ASIK
## Single log file size (in MB)
UP_file_size = 120
# File numbers (as Ring buffer) generated in fctlb (/tmp/gnblogs/)
UP_log_files = 4
#Zip each generated log file to save space. Maybe make packets drop, performance not tested
UP_zip_each_file = no
# Collect log from ASIK B-EIF (port 16,5GC001028) and EIF1 (port 14) by default. EIF2 (port 15) can be appended if needed.
Backhaul_eif_port = 16,14
#for cloud if interface changed in upue VM:
#UP_interface = x2



#####################################################
### OAM 
###              option -j                          #

# OAM message monitoring in option -m or not
OAM_in_option_m = no
## Single log file size (in MB)
OAM_file_size = 120
# File numbers (as Ring buffer) generated in fctla (/tmp/gnblogs/)
OAM_Log_files = 2
#Zip each generated log file to save space
OAM_zip_each_file = no
# Interface in fctla which transferring OAM packets
#OAM_interface = etha01
OAM_interface = rlan0.ecpri



#####################################################
### TTI
###      option -t, remote log in L2RT            
    
# Option -m contains ttiTrace or not
TTI_in_option_m = yes

# NOTE: In live network, use option "-t" and change default tti log size may be risk, because each tti log file is accounted by seconds, not mega-bytes,  
#       Burst traffic for multiple UE sheduling might generate huge log files, and use up BBMOD memory. 
#       --Please use "-o l2ps" option for tti trace in live network, that is streaming log and size defined by "L2trace_file_size", "L2trace_log_files" in this file
#       --In case "-t" has to be run due to firewall restriction, execute "free -m" in target BBMOD to check mem usage first if you want to change below values

# Seconds of each tti log file, e.g, 2  (default 0.2 may cause log drop in CA configuration)
TTI_file_seconds = 2
# File numbers (as Ring buffer) generated in BBMOD. 
TTI_log_files = 7
# Seconds to display the warning info if "-t" is used
TTI_command_warning_time = 8









###########################################################################################
##
## Add-on commands to collect additional logs from gNB units.
## Be careful with this part, huge files or wild command may cause unexpected result!
##       
## Grammar: Command[index]=Value. specifically,
##  paper[n]=name          : local file from addons folder will be uploaded into the unit's /tmp folder, then chmod +x 
##  pre_mon_command[n]=cmd : run the cmd before starting monitoring
##  script[n]=cmd          : local script from addons folder will be run on the unit before starting monitoring
##
##  file[n]=path           : zip the path into log
##  command[n]=cmd         : run the cmd during log dump
##  post_command[n]=cmd    : specified for AEQB/E/P/Z. Run the cmd only if faulty MADE is detected. MADE address will be got before running.
##  end_command[n]=cmd     : run the command in the end after all log collection is done
##  
## Supported Variables: 
##  $logdir  : It'll be replaced by tool's log path during running. save logs here then it'll be packed during collecting.
##  $romdir  : It'll be replaced by ROM path during running. Be very careful to destroy the flash ROM!
##  $unit    : It'll be replaced by real unit name during running. 
##             e.g. if you generated a file in FSP: $logdir$unit_my.log, it would be created as: /tmp/gnb_logs/fsp-1-1c_my.log, and finally collected into ./addition log folder
##  $ip      : In post_command[n], it'll be replaced into MADE address of AEQB/E/P where fault was detected.  
##  $node    : In post_command[n], it'll be replaced into MADE index of AEQB/E/P which is detected failure by ping test. 



