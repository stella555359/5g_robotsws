- ID: 2
  MOC: NRPGRP

  lbpsSOMethod: ${NRPGRP-2.lbpsSOMethod}
  lbpsLastCellSOEnabled: ${NRPGRP-2.lbpsLastCellSOEnabled}
  lbpsCSONCtlEnabled: 'false'

# 5GC000431 specific parameters
  lbpsMaxLoad: ${NRPGRP-2.lbpsMaxLoad}
  lbpsMinLoad: ${NRPGRP-2.lbpsMinLoad}
  lbpsPdcchLoadOffset: '4'
  lbpsLastCellMinLoad: '0'

# CB008392 specific parameters
  lbpsRTXMaxLoad: ${NRPGRP-2.lbpsRTXMaxLoad}
  lbpsRTXMinLoad: ${NRPGRP-2.lbpsRTXMinLoad}
  lbpsRTXCellCapOffset: ${NRPGRP-2.lbpsRTXCellCapOffset}
  lbpsRTXSOffTime: ${NRPGRP-2.lbpsRTXSOffTime}
  lbpsRTXSOnTime: ${NRPGRP-2.lbpsRTXSOnTime}
  lbpsLastCellRTXMinLoad: ${NRPGRP-2.lbpsLastCellRTXMinLoad}

  lbpsCellList:
    - lbpsCellSOOrder: ${NRPGRP-2.lbpsCellSOOrder[0]}
      nrCellId: ${NRPGRP-2.nrCellId[0]}
    - lbpsCellSOOrder: ${NRPGRP-2.lbpsCellSOOrder[1]}
      nrCellId: ${NRPGRP-2.nrCellId[1]}

  lbpsPeriodList:
    - lbpsDayOfWeek: ${NRPGRP-2.lbpsDayOfWeek}
      lbpsDuration: ${NRPGRP-2.lbpsDuration}
      lbpsStartTimeHour: ${NRPGRP-2.lbpsStartTimeHour}
      lbpsStartTimeMinute: ${NRPGRP-2.lbpsStartTimeMinute}
      lbpsSuspended: ${NRPGRP-2.lbpsSuspended}
