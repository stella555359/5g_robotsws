result: ${pduSessionResourceInfoResult}
trigger: ${pduSessionResourceInfoTrigger}
setupPduSessionResources:
  - snssai:
      sst: "${sst}"   # must be in quotes!
      sd: ${sd}
    pduSessionId: 1
    pduSessionAggregateMaximumBitRate:
      dlBitRate: ${dlBitRate}
      ulBitRate: ${ulBitRate}
    setupQosFlows:
      - qfi: 1
        qosParameters:
          qosCharacteristics:
            nonDynamicFiveQiDescriptor:
              fiveQi: 5
          arp:
            priorityLevel: ${priorityLevel}
            preemptionCapability: ${preemptionCapability}
            preemptionVulnerability: ${preemptionVulnerability}
      - qfi: 2
        qosParameters:
          qosCharacteristics:
            nonDynamicFiveQiDescriptor:
              fiveQi: 1
          arp:
            priorityLevel: ${priorityLevel}
            preemptionCapability: ${preemptionCapability}
            preemptionVulnerability: ${preemptionVulnerability}
          gbrQosInformation:
            maximumFlowBitRateDl: ${maximumFlowBitRateDl}
            maximumFlowBitRateUl: ${maximumFlowBitRateUl}
            guaranteedFlowBitRateDl: ${guaranteedFlowBitRateDl}
            guaranteedFlowBitRateUl: ${guaranteedFlowBitRateUl}
failedToSetupPduSessionResources:
  - snssai:
      sst: "${sst}"   # must be in quotes!
      sd: ${sd}
    pduSessionId: 2
    pduSessionAggregateMaximumBitRate:
      dlBitRate: ${dlBitRate}
      ulBitRate: ${ulBitRate}
    failedToSetupQosFlows:
      - qfi: 1
        qosParameters:
          qosCharacteristics:
            nonDynamicFiveQiDescriptor:
              fiveQi: 5
          arp:
            priorityLevel: ${priorityLevel}
            preemptionCapability: ${preemptionCapability}
            preemptionVulnerability: ${preemptionVulnerability}

