#   This configuration allows for inter RAT handover in both directions:
#       5G -> LTE
#       LTE -> 5G

- ID: '1'
  MOC: NRBTS
  actInterRatHoSA: 'true'
  nonContentRachAcFullConfigHo: 'true'
  actInterRatHoFromEutraToSA: 'true'  # LTE to 5G specific
#  nonContentRachAcIrat: 'true'        # LTE to 5G specific
  tNgRelocExecDeltL: '5000'           # LTE to 5G specific
#  raTypeList:
#    - 'nr'
#    - 'eutra'

- ID: '1'
  MOC: NRCELL
  a1MeashoEnabledSA: 'rsrp'
  a1MeashoSsbRsrpSA:
    - a1HysteresishoSsbRsrpSA: '0'
      a1ThresholdhoSsbRsrpSA: '60'
      a1TimeToTriggerhoSsbRsrpSA: 'ms480'
  a2MeashoEnabledSA: 'rsrp'
