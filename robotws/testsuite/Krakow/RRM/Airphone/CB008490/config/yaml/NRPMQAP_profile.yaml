- ID: ${NRBTS.id}
  MOC: NRBTS
  actNrpmqapProfiles: 'true'
  actIpThpt: 'true'
  actThpDist: 'true'
  actLatencyPmCount: 'true'

- ID: '1'
  MOC: NRPMRNL
  miNrSaCuNrpmqap: 5min
  miNrMaxCellCuNrpmqap: 5min
  miNrRSACU: 5min
  miNrCUCM: 5min

- ID: 1-1
