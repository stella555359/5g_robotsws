set_qosflow id=1 5qi=6 default=on

#add for 5Qi-5 & 5Qi-1 support for VoNR
set_qosflow id=2 5qi=5
set_qosflow id=3 5qi=1
set_qosrule id=1 proto=tcp  qos_flow=2
set_qosrule id=2 proto=udp qos_flow=3
nwslice_set id=1 qos_flows=1,2,3 qos_rules=1,2 snssai=0x01:0xD143A5 default=on ue=all amf=1


#---------------------------------------------------------------------------------------------------
#OTHER CONFIGURATION
#---------------------------------------------------------------------------------------------------

uec_param id=1 reordering_window_size=500 reordering_timer=300
link_ctrl_param use_hb=off
#---------------------------------------------------------------------------------------------------
debug_log level=4
sim_debug_log level=4 mme=1
sim_debug_log level=4 uec=1
sim_debug_log level=4 pgw=1
sim_debug_log level=4 sgw=1
#link_ctrl_param hb_period=5 hb_retries=5
#trace uec=1 protocol=rrc on
#trace uec=1 protocol=nr_rrc on
#trace enb=1 protocol=x2 on
#trace uec=1 protocol=x2 on
#sim_trace uec=1 protocol=nr_rrc on
#sim_trace amf=1 protocol=ng on
sim_param_set NR_PDCP_CIPHERING=distributed
set_cnode ip=127.0.0.1
cfg_end

set_log log_to_file=on
sim_start version_check=off
