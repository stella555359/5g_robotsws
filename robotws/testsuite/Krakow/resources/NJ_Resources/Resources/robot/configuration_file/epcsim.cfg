# Parameter should be match the value in ./edaemon --port <DAEMON_PORT>
# region: the section will be replaced automatically by script
set DAEMON_PORT="10000"
set MCC="460"
set MNC="06"
set TAC="1"
set ENB_ADDR="172.31.1.53"
set EPC_ADDR="172.31.1.55"
set PGW_ADDR="27.168.1.200/24"
set SEC_KEY="11111111111111111111111111111111"
set OPC_KEY="11111111111111111111111111111111"
set IMSI_1="460:06:4100000010"
set UE_IP_1="27.168.1.10"
set IMSI_2="460:06:4100000011"
set UE_IP_2="27.168.1.11"
set IMSI_3="460:06:4100000012"
set UE_IP_3="27.168.1.12"
set IMSI_4="460:06:4100000013"
set UE_IP_4="27.168.1.13"
set IMSI_5="460:06:4100000014"
set UE_IP_5="27.168.1.14"
set IMSI_6="460:06:4100000015"
set UE_IP_6="27.168.1.15"
set IMSI_7="460:06:4100000016"
set UE_IP_7="27.168.1.16"
set IMSI_8="460:06:4100000017"
set UE_IP_8="27.168.1.17"
set IMSI_9="460:06:4100000018"
set UE_IP_9="27.168.1.18"
set IMSI_10="460:06:4100000019"
set UE_IP_10="27.168.1.19"
# endregion

set S1_ADDR="$EPC_ADDR:36412"
set S1U_ADDR="$EPC_ADDR:2152"
set S11_ADDR="$EPC_ADDR:2153"

# PGW addresses and UE IPs should belong to the same subnet

set_enb id=1 plmn=$MCC:$MNC s1=$ENB_ADDR   enb_id_macro=0x003E4 daemon=:$DAEMON_PORT
set_cell id=1 enb=1 tac=$TAC eci=0x003E401 pci=46:0

# configuring EPC
set_mme id=1 ip=:$DAEMON_PORT s1=$S1_ADDR mmegi=1 mmec=3 
mme_param id=1 t3412=11160
set_sgw id=1 ip=:$DAEMON_PORT s1u=$S1U_ADDR s11=$S11_ADDR
set_pgw id=1 ip=:$DAEMON_PORT apn=www.nj.com devtype=tun devname=tunPGW1 addr=$PGW_ADDR

# Configuring UEs
set_ue external id=1 sec_key=$SEC_KEY opc_key=$OPC_KEY imsi=$IMSI_1 eia=snow3g+aes+zuc eea=snow3g+aes+zuc
set_bearer id=1 ue=1 trf_type=external default=on qci=9 priority=8 preemption=on vulnerability=on ip=$UE_IP_1

set_ue external id=2 sec_key=$SEC_KEY opc_key=$OPC_KEY imsi=$IMSI_2 eia=snow3g+aes+zuc eea=snow3g+aes+zuc
set_bearer id=2 ue=2 trf_type=external default=on qci=9 priority=8 preemption=on vulnerability=on ip=$UE_IP_2

set_ue external id=3 sec_key=$SEC_KEY opc_key=$OPC_KEY imsi=$IMSI_3 eia=snow3g+aes+zuc eea=snow3g+aes+zuc
set_bearer id=3 ue=3 trf_type=external default=on qci=9 priority=8 preemption=on vulnerability=on ip=$UE_IP_3

set_ue external id=4 sec_key=$SEC_KEY opc_key=$OPC_KEY imsi=$IMSI_4 eia=snow3g+aes+zuc eea=snow3g+aes+zuc
set_bearer id=4 ue=4 trf_type=external default=on qci=9 priority=8 preemption=on vulnerability=on ip=$UE_IP_4

set_ue external id=5 sec_key=$SEC_KEY opc_key=$OPC_KEY imsi=$IMSI_5 eia=snow3g+aes+zuc eea=snow3g+aes+zuc
set_bearer id=5 ue=5 trf_type=external default=on qci=9 priority=8 preemption=on vulnerability=on ip=$UE_IP_5

set_ue external id=6 sec_key=$SEC_KEY opc_key=$OPC_KEY imsi=$IMSI_6 eia=snow3g+aes+zuc eea=snow3g+aes+zuc
set_bearer id=6 ue=6 trf_type=external default=on qci=9 priority=8 preemption=on vulnerability=on ip=$UE_IP_6

set_ue external id=7 sec_key=$SEC_KEY opc_key=$OPC_KEY imsi=$IMSI_7 eia=snow3g+aes+zuc eea=snow3g+aes+zuc
set_bearer id=7 ue=7 trf_type=external default=on qci=9 priority=8 preemption=on vulnerability=on ip=$UE_IP_7

set_ue external id=8 sec_key=$SEC_KEY opc_key=$OPC_KEY imsi=$IMSI_8 eia=snow3g+aes+zuc eea=snow3g+aes+zuc
set_bearer id=8 ue=8 trf_type=external default=on qci=9 priority=8 preemption=on vulnerability=on ip=$UE_IP_8

set_ue external id=9 sec_key=$SEC_KEY opc_key=$OPC_KEY imsi=$IMSI_9 eia=snow3g+aes+zuc eea=snow3g+aes+zuc
set_bearer id=9 ue=9 trf_type=external default=on qci=9 priority=8 preemption=on vulnerability=on ip=$UE_IP_9

set_ue external id=10 sec_key=$SEC_KEY opc_key=$OPC_KEY imsi=$IMSI_10 eia=snow3g+aes+zuc eea=snow3g+aes+zuc
set_bearer id=10 ue=10 trf_type=external default=on qci=9 priority=8 preemption=on vulnerability=on ip=$UE_IP_10

# Turning on the information only about errors--for high perfomance
debug_log level=3 dir=logs
set_log log_to_file=on
pgw_lmts_param bearer_activation_by_trf=on

#trace protocol=nas mme=1 on
#trace protocol=all action=on sgw=1 mme=1
#trace protocol=nas uec=1 action=on
#trace protocol=rrc uec=1 action=on
#trace protocol=all uec=1 mme=1 
#trace protocol=nas mme=1 on
#trace protocol=s1 mme=1 on

cfg_end

