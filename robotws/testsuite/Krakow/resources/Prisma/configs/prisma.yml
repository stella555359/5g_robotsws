lsu_uu:
    type: ue.prisma.lsu
    executor: tl.ues[0].lsu_uu_ssh_connection_details
    script_paths:
        start_lsu: lsustop;lsuclean;lsustart -R
        clean_lsu: lsuclean
        stop_lsu: lsustop
        create_5g_cell: /home/user/scripts/start_2cell.sh
        create_4g_cell: /home/user/scripts/lte_cell.sh
        get_4g_cell_id: trcinfo -p 0-11 | grep -i cellid |tail -1 |awk '{print $12}'|cut -d'=' -f2
        get_5g_cell_id: trcinfo -p 0-2 | grep -i cell_id |tail -1 |awk '{print $11}'|cut -d'=' -f2
        get_ra_status: trcinfo -p0-5 | grep -i contention


lsu_tstmuu:
    type: ue.prisma.tstm
    executor: tl.ues[0].tstm_uu_ssh_connection_details
    script_paths:
        start_tstm: ^cd /home/user/scripts/ ;./start_tstm.sh
        #start_tstm: cd /home/user/tstm_scripts/ ; nohup ./start_nr5g_Uu_ms_GUI >./nohup_uu.out 2>&1 &
        #get_tstm_log: cd /home/user/tstm_scripts/;tail -n 1000 -f ./nohup_uu.out
        clean_tstm_log: cd /home/user/scripts/;cat /dev/null > ./nohup_uu.out
        stop_tstm: ps -ef | grep tm | grep -v 'grep' | awk '{print $2}' | xargs kill -9


airmosaic:
    type: ue.prisma.airmosaic
    executor: tl.ues[0].airmosaic_ssh_connection_details
    harness: tl.ues[0].airmosaic_harness_connection_details
    cli_path: /home/ute/Documents/airmosaic_lteuu/bin/airmosaic_lteuu_cmdline
    cygwin_path:
    preferences_file_path:
    duration:
    suddenshutdown:
    bugreport_folder: /tmp/log
    script_paths:
        start_mosaic: ^cd "/home/ute/Programs/airmosaic_lteuu/bin"; ./airmosaic_lteuu --nogui --nosplash -J-Dcli.mode=true --enable-harness
    scenario_paths:
        attach: NSA_full_stack_1UE_manuall.sce
        detach: detach.sce
    parameters:
        enable_amm: true
        clock_timer: 900
        counters:
        log_counters_to_file:
        global_vars:


prisma:
   type: ue.prisma
   components:
     - lsu_uu
     - lsu_tstmuu
     - airmosaic




