version: "2.1"
services:
  condor-worker-1:
    container_name: condor-worker-1
    entrypoint: /usr/bin/mono /opt/nokia/emil/run_emil --noscreen --name "dcap_user_172.21.0.11"
      --dcap "172.21.0.11+none" --5g --timeout 0 --l2trace --kpimon
    healthcheck:
      interval: 3m
      test: 'curl -H "Authorization: ''Bearer BIG_PASSWORD_HERE''" --fail --max-time
        5 http://172.21.0.11:10009/dataCollections/heartbeat/heartbeat-heartbeat-heartbeat
        || kill 1'
    image: dcap-lite-docker-local.artifactory-espoo2.int.net.nokia.com/condor@sha256:0fa81c9640379659ebc59b0d908cf870a3ebf9311f20addcd4dd93c51501bfc0
    networks:
      condornet:
        ipv4_address: 172.21.0.11
        ipv6_address: fd00:dcab:117e::c1:78a:ce
    restart: unless-stopped
    volumes:
    - /sharedvolume/condor:/home/emil/.local/share/Emil:rw

networks:
  condornet:
    name: condornet
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-condornet
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
        - subnet: fd00:dcab:117e::/64
          gateway: fd00:dcab:117e::1