#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP

set GNB_NG_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="10.12.2.1"

#-- ENB S1 interfaces --
set ENB1_S1_ADDR="10.0.1.136"

set EDAEMON_PORT="10000"

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,0,222,200,223,224 plmn=311:489,311:490
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=1 pointer=1
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR


#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x76C daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none amf=1 plmnList=311:489,311:490
set_cell id=1 gnb=2 pci=16:2 tac=0 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=636666:636666 mandatory_for_activation=off gscn=7880

#---------------------------------------------------------------------------------------------------
#target gNB (acting as eNB stub)
#---------------------------------------------------------------------------------------------------
set_gnb id=1 type=simulated plmn=311:489 ng=$ENB1_S1_ADDR daemon=$SERVER_IP:$EDAEMON_PORT gnb_id=0x12:28 nssai=0x01:0xD143A5
set_cell id=1 gnb=1 pci=3:2 earfcn=1:18001 tac=222 proxy=$SERVER_IP:12219 nrci=0x1 tdd_cell=on bw=20MHz technology=lte mandatory_for_activation=off
set_cell id=2 gnb=1 pci=4:0 earfcn=2:18002 tac=223 proxy=$SERVER_IP:12220 nrci=0x2 tdd_cell=on bw=20MHz technology=lte mandatory_for_activation=off
gnb_param id=1 xn_listening_socket=off

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 file=AirPhoneConfig.xml

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:490:0000:0:0:021645401 mode=nr enb=2 cell=1
set_ue simulated id=3 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:490:0000:0:0:021645402 mode=nr enb=2 cell=1
set_ue simulated id=4 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:490:0000:0:0:021645403 mode=nr enb=2 cell=1
set_ue simulated id=5 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:490:0000:0:0:021645404 mode=nr enb=2 cell=1

ue_param id=1 ue_nr_
ue_param id=2 ue_nr_
ue_param id=3 ue_nr_
ue_param id=4 ue_nr_
ue_param id=5 ue_nr_

ue_param id=1 dual_conn=eutra_nr
ue_param id=2 dual_conn=eutra_nr
ue_param id=3 dual_conn=eutra_nr
ue_param id=4 dual_conn=eutra_nr
ue_param id=5 dual_conn=eutra_nr

#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------

set_qosflow id=1 5qi=6 default=on
set_nwslice id=1 snssai=0x01:0xD143A5 default=on ue=all amf=1
set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

debug_log level=0
link_ctrl_param use_hb=off
#trace uec=1 protocol=rrc on
#trace uec=1 protocol=nr_rrc on
trace amf=1 protocol=ng on
#sim_trace uec=1 protocol=nr_rrc on
#sim_trace amf=1 protocol=ng on
cfg_end

set_log log_to_file=on max_file_num=10
sim_start version_check=off
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
