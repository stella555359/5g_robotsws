syntax = "proto3";

import "common_types/ncgi.proto";
import "options/protobuf_options.proto";
import "common_types/Plmn.proto";

package common_type;

message ServedCellInformation
{
    enum NrScs
    {
        scs15 = 0;
        scs30 = 1;
        scs60 = 2;
        scs120 = 3;
    }

    enum CellDirection
    {
        dlOnly = 0;
        ulOnly = 1;
    }

    enum NrNrb
    {
        nrb11 = 0;
        nrb18 = 1;
        nrb24 = 2;
        nrb25 = 3;
        nrb31 = 4;
        nrb32 = 5;
        nrb38 = 6;
        nrb51 = 7;
        nrb52 = 8;
        nrb65 = 9;
        nrb66 = 10;
        nrb78 = 11;
        nrb79 = 12;
        nrb93 = 13;
        nrb106 = 14;
        nrb107 = 15;
        nrb121 = 16;
        nrb132 = 17;
        nrb133 = 18;
        nrb135 = 19;
        nrb160 = 20;
        nrb162 = 21;
        nrb189 = 22;
        nrb216 = 23;
        nrb217 = 24;
        nrb245 = 25;
        nrb264 = 26;
        nrb270 = 27;
        nrb273 = 28;
    }

    message SupportedSULFreqBandItem
    {
        uint32 freqBandIndicatorNr = 1;
    }

    message FreqBandNrItem
    {
        uint32 freqBandIndicatorNr = 1;
        repeated SupportedSULFreqBandItem supportedSULBandList = 2;
    }

    message NRFreqInfo
    {
        uint32 ngArfcn = 1;
        repeated FreqBandNrItem freqBandListNr = 2;
    }

    message TransBandwidth
    {
        NrScs nrScs = 1;
        NrNrb nrNrb = 2;
    }

    message FDDInfo
    {
        NRFreqInfo ulEarfcn = 1;
        NRFreqInfo dlEarfcn = 2;
        TransBandwidth ulTransBandwidth = 3;
        TransBandwidth dlTransBandwidth = 4;
    }

    message TDDInfo
    {
        NRFreqInfo earfcn = 1;
        TransBandwidth transBandwidth = 2;
    }

    message SNSSAI
    {
        uint32 sst = 1 [ (sensitive_param) = true ];
        oneof optional_Sd
        {
            uint32 sd = 2 [ (sensitive_param) = true ];
        }
    }

    message SliceSupportList
    {
        repeated SNSSAI sliceSupportItem = 1;
    }

    message ServedPlmnItem
    {
        common_type.Plmn plmnIdentity = 1;
        SliceSupportList sliceSupportList = 2;
    }

    message PLMNIdentityList
    {
        repeated common_type.Plmn plmnIdentity = 1;
    }

    message BroadcastPlmnIdInfoItem
    {
        PLMNIdentityList pLMNIdentityList = 1;
        oneof optional_fiveGsTac
        {
            uint32 fiveGsTac = 2;
        }
        uint64 nrCellIdentity = 3;
    }

    message BroadcastPlmnIdInfoList
    {
        repeated BroadcastPlmnIdInfoItem broadcastPlmnIdInfoItem = 1;
    }

    common_type.NCGI nCGI = 1;
    uint32 pci = 2;
    repeated ServedPlmnItem broadcastPLMNs = 3;
    oneof NrModeInfo
    {
        FDDInfo fddInfo = 4;
        TDDInfo tddInfo = 5;
    }
    oneof optional_fiveGsTac
    {
        uint32 fiveGsTac = 6;
    }
    oneof optional_configEpsTac
    {
        uint32 configEpsTac = 7;
    }
    bytes measurementTimingConfiguration = 8;
    oneof optional_cellDirection
    {
        CellDirection cellDirection = 9;
    }
    oneof optional_broadcastPlmnIdInfoList
    {
        BroadcastPlmnIdInfoList broadcastPlmnIdInfoList = 10;
    }
}
