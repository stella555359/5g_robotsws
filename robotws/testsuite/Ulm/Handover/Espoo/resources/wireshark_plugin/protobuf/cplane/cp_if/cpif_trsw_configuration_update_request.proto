syntax = "proto3";
import "common_types/cplaneIpAddress.proto";

package cp_if_interface;

message CpIfX2IpAddressList
{
    repeated common_type.CplaneIpAddress cpIfX2IpAddressList = 1;
}
message CpIfXnIpAddressList
{
    repeated common_type.CplaneIpAddress cpIfXnIpAddressList = 2;
}
message CpIfNgIpAddressList
{
    repeated common_type.CplaneIpAddress cpIfNgIpAddressList = 3;
}

message CpIfTransportSoftwareConfigurationUpdateRequest
{
    uint32 transactionId = 1;
    oneof optional_cpIfX2IpAddressList
    {
        CpIfX2IpAddressList cpIfX2IpAddressList = 2;
    }
    oneof optional_cpIfXnIpAddressList
    {
        CpIfXnIpAddressList cpIfXnIpAddressList = 3;
    }
    oneof optional_cpIfNgIpAddressList
    {
        CpIfNgIpAddressList cpIfNgIpAddressList = 4;
    }
}
