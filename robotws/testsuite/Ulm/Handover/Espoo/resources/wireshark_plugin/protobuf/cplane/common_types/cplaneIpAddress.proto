syntax = "proto3";
import "options/protobuf_options.proto";

package common_type;

message CplaneIpAddress
{
    oneof optional_tnlId
    {
        uint32 tnlId = 1;
    }
    string ipV4Address = 2 [ (ipaddress_param) = true ];
    string ipV6Address = 3 [ (ipaddress_param) = true ];
}

message CplaneIpAddressOfDualStack
{
    string ipV4Address = 1 [ (ipaddress_param) = true ];
    string ipV6Address = 2 [ (ipaddress_param) = true ];
}