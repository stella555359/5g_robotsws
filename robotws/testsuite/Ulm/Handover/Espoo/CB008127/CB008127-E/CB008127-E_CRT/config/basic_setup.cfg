gnb_endc_param id=3 use_nr_ran_cont=true scg_dl_dist_percent=0 enable_dud_poll_bit=0
gnb_param id=3 x2_listening_socket=1 sib1_period=40 send_xn_setup=false measEvent=A3 ng_data_forwarding_HO=on gbr_data_forwarding_HO=on

