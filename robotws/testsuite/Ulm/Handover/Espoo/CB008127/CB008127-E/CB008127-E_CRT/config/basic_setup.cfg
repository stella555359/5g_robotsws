#upf_param id=1 end_markers_delay=400 ForwardTunnel_EM_timeout=1500
#amf_timer T_Local=2000

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
