#################################################-
#VARIABLES
##################################################-
set CONTAINER_IP="localhost"
set SERVER_IP="10.0.2.1"
set DAEMON_PORT="10000"
set GNB_NG_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

#################################################-
#5GCN CONFIGURATION
#################################################-
set_amf_region id=1 tac_list=100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$DAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on
set_upf id=1 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=10

#################################################-
#GNB CONFIGURATION
#################################################-
set_gnb id=2 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x76C daemon=$SERVER_IP:$DAEMON_PORT x2_peers=none amf=1 plmnList=311:489 nssai=0x1:0xd143a5
set_cell id=1 gnb=2 nr_arfcn=636666:636666 eci=0x000021f pci=16:2 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x3FFF tdd_cell=on mandatory_for_activation=off
set_cell id=2 gnb=2 nr_arfcn=636666:636666 eci=0x000021f pci=17:0 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x3FFF tdd_cell=on mandatory_for_activation=off
#################################################-

#################################################-
#UEC CONFIGURATION
#################################################-
set_uec id=1 daemon=$SERVER_IP:$DAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 proxy_snd_buf_size=20971520 proxy_rcv_buf_size=20971520 proxy_read_packets_threshold=10

#################################################-
#UE CONFIGURATION
#################################################-

#UE Id=1 SA
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
ue_param id=1 ue_nr_capabilities=E1A00000074E5A031E00038520001E09306400043C2C006201A0130180601804546C4D56080A1A02596513AE0009E0038002780000000B8000800D14000B000010002000000C20E2680000008381600000020E800000000010137D87C001C00140E0A00E06013003800341F000000000000072A68000800004B2CA801A55543C001C002C000000100200462C000128 ue_eutra_nr_capabilities=110C080160023D0004100000C4000000000204E003580010200806004008180100200804

#################################################-
#COMMON CONFIGURATION
#################################################-
#set_qosflow id=1 5qi=6 default=on
#set_nwslice id=1 snssai=0x01:0xd143a5 amf=1 default=on ue=1
#set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

# GBR QFIs:
set_qosflow id=1 5qi=1 qos_flow_type=gbr priority=1
set_qosflow id=2 5qi=2 qos_flow_type=gbr priority=5
set_qosflow id=4 5qi=4 qos_flow_type=gbr priority=10

# Non-GBR QFIs:
set_qosflow id=5 5qi=5 priority=2
set_qosflow id=6 5qi=6 default=on priority=6
set_qosflow id=7 5qi=7 priority=7
set_qosflow id=8 5qi=8 priority=8
set_qosflow id=9 5qi=9 priority=9

set_qosrule id=1 proto=udp qos_flow=1
set_qosrule id=2 proto=udp qos_flow=2
set_qosrule id=4 proto=udp qos_flow=4
set_qosrule id=5 proto=tcp qos_flow=5
set_qosrule id=6 proto=tcp qos_flow=6
set_qosrule id=7 proto=tcp qos_flow=7
set_qosrule id=8 proto=tcp qos_flow=8
set_qosrule id=9 proto=tcp qos_flow=9

nwslice_set id=1 qos_flows=1,2,4,5,6,7,8,9 qos_rules=1,2,4,5,6,7,8,9 snssai=0x01:0xD143A5 default=on ue=all amf=1
nwslice_set id=2 qos_flows=1,2,4,5,6,7,8,9 qos_rules=1,2,4,5,6,7,8,9 snssai=0x01:0xD143A6 ue=all amf=1
nwslice_set id=3 qos_flows=1,2,4,5,6,7,8,9 qos_rules=1,2,4,5,6,7,8,9 snssai=0x01:0xD143A7 ue=all amf=1
nwslice_set id=4 qos_flows=1,2,4,5,6,7,8,9 qos_rules=1,2,4,5,6,7,8,9 snssai=0x01:0xD143A8 ue=all amf=1
nwslice_set id=5 qos_flows=1,2,4,5,6,7,8,9 qos_rules=1,2,4,5,6,7,8,9 snssai=0x01:0xD143A9 ue=all amf=1

set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=2 ue_nat_ip=72.23.0.2 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=3 ue_nat_ip=72.23.0.3 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=4 ue_nat_ip=72.23.0.4 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=5 ue_nat_ip=72.23.0.5 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=6 ue_nat_ip=72.23.0.6 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=7 ue_nat_ip=72.23.0.7 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=8 ue_nat_ip=72.23.0.8 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=9 ue_nat_ip=72.23.0.9 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=10 ue_nat_ip=72.23.0.10 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=11 ue_nat_ip=72.23.0.11 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=12 ue_nat_ip=72.23.0.12 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

#################################################-
debug_log level=0
sim_debug_log level=4 uec=1
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
trace uec=1 protocol=x2 on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end

set_log log_to_file=on
sim_start version_check=off
