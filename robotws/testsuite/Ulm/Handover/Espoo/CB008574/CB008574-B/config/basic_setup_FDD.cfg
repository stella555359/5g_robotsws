#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set DAEMON_IP=$CONTAINER_IP
set SERVER_IP=$CONTAINER_IP
set DAEMON_PORT="10000"

set GNB_NG_ADDR="10.0.1.2"
set GNB_XN_ADDR="10.0.1.2"
set GNB_X2_ADDR="10.0.1.2"
set GNB_S1U_ADDR="10.0.1.2"

#sim gnB3 interfaces
set GNB3_XN_ADDR="10.0.1.122"
set GNB3_NG_ADDR="10.0.1.123"
set GNB3_X2_ADDR="10.0.1.124"
set GNB3_S1U_ADDR="10.0.1.125"

# real gNB cells
set PROXY_SERVER_IP="10.0.2.80"
# Simu gNB cells
set PROXY_SERVER_IP2="10.0.2.92"

set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

## Variables for NSA configuration
set ENB1_S1_ADDR="10.0.1.136"
set ENB1_X2_ADDR="10.0.1.137"
set MME1_S1_ADDR="10.0.1.131"
set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"
set ENB_X2U_ADDR="10.0.1.135"
set PGW_ADDR="4.7.254.207"
set PDN_IP="4.7.254.208"

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$DAEMON_IP:12219|$DAEMON_IP:8889 earfcn=2000:20000 mapped_earfcn=4200:22200 mandatory_for_activation=off
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x01 daemon=$SERVER_IP:$DAEMON_PORT xn=$GNB_XN_ADDR x2_peers=none amf=1 plmnList=311:489 nssai=0x1:0xd143a5,0x1:0xd143a6,0x1:0xd143a7,0x1:0xd143a8,0x1:0xd143a9
# Band71 AHLOA:
set_cell id=1 gnb=2 pci=16:2 tac=200 nrci=0x01 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=135760:126380 gscn=1582 mandatory_for_activation=off
# Band66 AHFIB, ssbfreq for HO 431090:
set_cell id=2 gnb=2 pci=17:0 tac=200 nrci=0x02 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=351000:431000 gscn=5389 mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------
#GNB3 sim configuration for FDD - band 71 and 66 cells
#---------------------------------------------------------------------------------------------------
set_gnb id=3 type=simulated plmn=311:489 ng=$GNB3_NG_ADDR gnb_id=0x3:22 daemon=$SERVER_IP:$DAEMON_PORT s1u=$GNB3_S1U_ADDR x2=$GNB3_X2_ADDR:36422 x2_peers=none xn=$GNB3_XN_ADDR nssai=0x1:0xd143a5,0x1:0xd143a6,0x1:0xd143a7 amf=1 plmnList=311:489,311:490
# n71
set_cell id=1 gnb=3 pci=127:0 tac=200 nrci=0x01 tdd_cell=off proxy=:5555 nr_arfcn=135760:126380 gscn=1582 mandatory_for_activation=off
# n66
set_cell id=2 gnb=3 pci=127:1 tac=200 nrci=0x02 tdd_cell=off proxy=:5556 nr_arfcn=351000:431000 gscn=5389 mandatory_for_activation=off
gnb_cell_param id=1 gnb=3 enable_anr=on neighbor_pci=17:0
enb_param id=3 endc_capable_qci=all
gnb_endc_param id=3 use_nr_ran_cont=true scg_dl_dist_percent=0 enable_dud_poll_bit=0
gnb_param id=3 x2_listening_socket=1 sib1_period=40 send_xn_setup=false measEvent=A3 ng_data_forwarding_HO=on gbr_data_forwarding_HO=on sa_ho=xn_based
gnb_param id=3 Xn_Forwarding_Tunnel_Type=pdu
gnb_param id=3 ng_forwarding_tunnel_type=pdu

# PR699710 fix: 12bit for SRB-1 for supporting RRC Reestablishment send from real gNB in Inter-gNB handover:
gnb_param id=3 srb1_rlc_sn_field_size=size_12

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 eq_plmn=250:255 tac_list=777,111,222,444,333,200
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100 s5u_snd_buff_size=20M s5u_rcv_buff_size=20M s1u_snd_buff_size=20M s1u_rcv_buff_size=20M gtpu_read_packets_threshold=10
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13 sgi_rcv_buff_size=20M sgi_snd_buff_size=20M s5u_rcv_buff_size=20M s5u_snd_buff_size=20M gtpu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
#set_amf_region id=1 tac_list=7627107,100,788,200,0 plmn=311:489,311:490
set_amf_region id=1 tac_list=7627107,100,788,0,200,201,222 plmn=311:489,311:490
set_amf id=1 daemon=$SERVER_IP:$DAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=1
#set_amf id=1 daemon=$SERVER_IP:$DAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=1 pointer=1
amf_param id=1 full_nas_auth=on nia=null+zuc+aes+snow3g nea=null+zuc+aes+snow3g
set_upf id=1 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=10

#add ims_voice_3gpp support
amf_param id=1 ims_voice_3gpp=On indirect_data_forwarding=on intra5gs_data_forwarding=on

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$DAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 proxy_snd_buf_size=20971520 proxy_rcv_buf_size=20971520 proxy_read_packets_threshold=10

