########################################################################
####  modification to clone CCRT20 TLs      eNB1  (first gNB...)     ####
####  template file, variables are in CCRT20_<TL>_clonevars.yaml     ####
########################################################################
#
###############################################################################
# Set parameter to target scf                                                 #
###############################################################################
SET_PARAMETER:
  - parameter: 'localIpAddr'
    value: '${enb1.ip}'
    distname: '.*IPADDRESSV4-1'
  - parameter: 'btsName'
    value: '${enb1.btsName}'
  - parameter: 'enbName'
    value: '${enb1.enbName}'
  - parameter: 'gateway'
    value: '${enb1.gateway}'

  - parameter: 'phyCellId'
    value: '${enb1.cell1.phycellid}'
    distname: '.*LNCEL-1'
  - parameter: 'phyCellId'
    value: '${enb1.cell2.phycellid}'
    distname: '.*LNCEL-2'
  - parameter: 'phyCellId'
    value: '${enb1.cell3.phycellid}'
    distname: '.*LNCEL-3'
  - parameter: 'phyCellId'
    value: '${enb1.cell4.phycellid}'
    distname: '.*LNCEL-4'

  - parameter: 'nrCellId'
    value: '${gnb1.cell2.nrCellIdentity}'
    distname: '.*LNRELGNBCELL-1'
  - parameter: 'nrCellId'
    value: '${gnb1.cell4.nrCellIdentity}'
    distname: '.*LNRELGNBCELL-2'
  - parameter: 'nrCellId'
    value: '${gnb1.cell5.nrCellIdentity}'
    distname: '.*LNRELGNBCELL-3'


  - parameter: 'adjGnbId'
    value: '${gnb1.btsid}'
    distname: '.*LNADJGNB-1'
  - parameter: 'cPlaneIpAddr'
    value: '${gnb1.cp_ip}'
    distname: '.*LNADJGNB-1'
# - parameter: 'adjGnbId'
#    value: '${gnb1.btsid}'
#    distname: '.*LNADJGNB-2'
#  - parameter: 'cPlaneIpAddr'
#    value: '${gnb1.cp_ip}'
#    distname: '.*LNADJGNB-2'

  - parameter: 'ipAddress'
    value: '${gnb1.cp_ip}'
    distname: '.*XPIFREMOTE-1'

  - parameter: 'adjEnbId'
    value: '${enb0.btsid}'
    distname: '.*LNADJ-1'
  - parameter: 'cPlaneIpAddr'
    value: '${enb0.ip}'
    distname: '.*LNADJ-1'
#productionCodes
  - parameter: 'prodCodePlanned'
    value: '${enb1.bbmod1.prodCodePlanned}'
    distname: '.*BBMOD-1'
  - parameter: 'prodCodePlanned'
    value: '${enb1.smod1.prodCodePlanned}'
    distname: '.*SMOD-1'
  - parameter: 'prodCodePlanned'
    value: '${enb1.rmod1.prodCodePlanned}'
    distname: '.*RMOD-1'
  - parameter: 'prodCodePlanned'
    value: '${enb1.rmod2.prodCodePlanned}'
    distname: '.*RMOD-2'
  - parameter: 'prodCodePlanned'
    value: '${enb1.rmod3.prodCodePlanned}'
    distname: '.*RMOD-3'

