#    value: '${gnb1.cp_ip}'
#    distname: '.*LNADJGNB-2'

#  - parameter: 'ipAddress'
#    value: '${gnb1.cp_ip}'
#    distname: '.*XPIFREMOTE-1'

#productionCodes
  - parameter: 'prodCodePlanned'
    value: '${enb1.bbmod1.prodCodePlanned}'
    distname: '.*BBMOD-1'
  - parameter: 'prodCodePlanned'
    value: '${enb1.smod1.prodCodePlanned}'
    distname: '.*SMOD-1'
  - parameter: 'prodCodePlanned'
    value: '${enb1.rmod1.prodCodePlanned}'
    distname: '.*RMOD-1'
   
    
