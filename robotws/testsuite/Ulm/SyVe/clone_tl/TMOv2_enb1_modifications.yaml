###############################################################################
# Set parameter to target scf                                                 #
###############################################################################
SET_PARAMETER:
  - parameter: 'localIpAddr'
    value: '${enb1.ip}'
    distname: '.*IPADDRESSV4-1'
  - parameter: 'btsName'
    value: '${enb1.btsName}'
  - parameter: 'gateway'
    value: '${enb1.gateway}'
    
  - parameter: 'phyCellId'
    value: '${enb1.cell1.phycellid}'
    distname: '.*LNCEL-1'
  - parameter: 'phyCellId'
    value: '${enb1.cell2.phycellid}'
    distname: '.*LNCEL-2'
  
  - parameter: 'nrCellId'
    value: '${gnb1.cell1.nrCellIdentity}'
    distname: '*.LNRELGNBCELL-1'

  - parameter: 'adjGnbId'
    value: '${gnb1.btsid}'
    distname: '.*LNADJGNB-1'
  - parameter: 'cPlaneIpAddr'
    value: '${gnb1.cp_ip}'
    distname: '.*LNADJGNB-1'
