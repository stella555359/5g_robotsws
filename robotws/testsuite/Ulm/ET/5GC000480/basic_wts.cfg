set_bearer id=2 ue=1 qci=9 pdn=1 ip=4.7.254.208 default=on trf_type=internal
set_bearer id=3 ue=1 qci=8

set_bearer id=2 ue=2 qci=9 pdn=1 ip=4.7.254.209 default=on trf_type=internal

