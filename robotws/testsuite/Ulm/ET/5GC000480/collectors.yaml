credentials:
  - &gnb_credentials
    user: robot:tl.gnbs[0].cu.oam_ssh_connection_details.username
    password: robot:tl.gnbs[0].cu.oam_ssh_connection_details.password
  - &airscale_credentials
    user: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.username
    password: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.password
executors:
  - &gnb_oam
    host: robot:tl.gnbs[0].cu.oam_ssh_connection_details.addr
    <<: *gnb_credentials
  - &gnb_cpif
    host: cpif-0.local
    <<: *gnb_credentials
    proxy: *gnb_oam
  - &gnb_cpcl
    host: cpcl-0.local
    <<: *gnb_credentials
    proxy: *gnb_oam
  - &gnb_upue
    host: upue-0.local
    <<: *gnb_credentials
    proxy: *gnb_oam
  - &gnb_cpue
    host: cpue-0.local
    <<: *gnb_credentials
    proxy: *gnb_oam
  - &gnb_cpnrt
    host: cpnrt-0.local
    <<: *gnb_credentials
    proxy: *gnb_oam
  - &gnb_asik_master
    host: robot:tl.gnbs[0].dus[0].airscale.common_units[0].lmp_connection.addr
    <<: *airscale_credentials
  - &gnb_asik_slave
    host: fct-1-0b
    <<: *airscale_credentials
    proxy: *gnb_asik_master
  - &gnb_abil_master
    host: fsp-1-1a
    <<: *airscale_credentials
    proxy: *gnb_asik_master
  - &gnb_abil_slave
    host: fsp-1-1b
    <<: *airscale_credentials
    proxy: *gnb_asik_master
collectors:
  - name: gnb_oam_journal
    type: journal
    options: -o short
    executor: *gnb_oam
  - name: gnb_cpif_journal
    type: journal
    options: -o short
    executor: *gnb_cpif
  - name: gnb_cpcl_journal
    type: journal
    options: -o short
    executor: *gnb_cpcl
  - name: gnb_upue_journal
    type: journal
    options: -o short
    executor: *gnb_upue
  - name: gnb_cpue_journal
    type: journal
    options: -o short
    executor: *gnb_cpue
  - name: gnb_cpnrt_journal
    type: journal
    options: -o short
    executor: *gnb_cpnrt
  - name: gnb_asik_master_journal
    type: journal
    options: -o short
    executor: *gnb_asik_master
  - name: gnb_asik_slave_journal
    type: journal
    options: -o short
    executor: *gnb_asik_slave
  - name: gnb_abil_master_journal
    type: journal
    options: -o short
    executor: *gnb_abil_master
  - name: gnb_abil_slave_journal
    type: journal
    options: -o short
    executor: *gnb_abil_slave
   
