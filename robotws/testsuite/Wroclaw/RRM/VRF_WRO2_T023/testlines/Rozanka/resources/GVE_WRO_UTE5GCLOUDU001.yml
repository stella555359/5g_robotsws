UE_POOLS:
    AndroidUePool:
        inline_config:
            UE_FOR_TA:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - QUALCOMM_UE
                    - REAL_ANDROID_UE
                STARTING_CELL: 0xe2b03                     # Cell ID to which UE should attach

#                CLASS: QualcommNoLicenseUe                          # UE type is Android so AndroidUe class will be used
                CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'fc7658e6'   # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        serial_com: '6'                  # COM ID obtained from qualcomm modem
                        diag_com: '6'                    # Diagnostic COM ID
                        ue_pc_ip: '10.44.72.233'          # UE PC IP address
                        pyro_port: '9090'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'sranwro2'                     # SSH login to UE PC
                        password: 'Ru1eTheAir!2'               # SSH password to UE PC
                        server_dir: 'C:/pyro_server'      # UE PC directory where all server files will be copied
