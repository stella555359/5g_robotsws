UE_POOLS:
    PrismaUePool:
    # UE Pool type
        inline_config:
            UE_1:
            # UE name - change if you want
                CAPABILITIES:
                # Capabilities that UE has. (as a list)
                    - PRISMA_UE
                CLASS: PrismaUe
                # UE type is Prisma so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:
                # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    configuration:
                    # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        prisma_config_file: /home/ute/Documents/robotws5g/testsuite/Wroclaw/RRM/5GC000720/resources/prisma_files/prisma.yml
                        # Prisma configuration file for taf.ue.prisma library,
                        # contains nodes(lsu_s1/tstm_s1/lsu_uu/tstm_uu/airmosaic) and node’s operation(e.g. start/stop/clean)
                        testline_parameters: tl.ues[0]
                        # Testline configuration parameters.(as a string)
                        scripts_dir: /home/ute/Documents/robotws5g/testsuite/Wroclaw/RRM/5GC000720/resources/prisma_files
                        # Directory for store Airmosaic scenario scripts, contains sid & sce, and so on.
                        default_sid_file: 5gnr-uesim_3_nsa_full_stack.sid
                        # Airmosaic sid type scenario script.

