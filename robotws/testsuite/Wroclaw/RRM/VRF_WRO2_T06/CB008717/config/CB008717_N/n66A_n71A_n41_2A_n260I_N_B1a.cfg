#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP

set GNB_NG_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

set EDAEMON_PORT="10000"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"


#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+aes+snow3g+zuc nea=null+aes+snow3g+zuc ims_voice_3gpp=on
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR


#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION NR-ARFCN values UL:DL
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x76C daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none amf=1
set_cell id=1 gnb=2 pci=17:0 tac=200 tdd_cell=off nrci=0x01 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=349000:425100 gscn=5313 mandatory_for_activation=off
set_cell id=2 gnb=2 pci=17:1 tac=200 tdd_cell=on nrci=0x02 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2266651:2266651 gscn=23124 mandatory_for_activation=off
set_cell id=3 gnb=2 pci=17:2 tac=200 tdd_cell=on nrci=0x03 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2268317:2268317 gscn=23130 mandatory_for_activation=off
set_cell id=4 gnb=2 pci=18:0 tac=200 tdd_cell=on nrci=0x04 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2269983:2269983 gscn=23136 mandatory_for_activation=off
set_cell id=5 gnb=2 pci=18:1 tac=200 tdd_cell=on nrci=0x05 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2271649:2271649 gscn=23141 mandatory_for_activation=off
set_cell id=6 gnb=2 pci=18:2 tac=200 tdd_cell=off nrci=0x06 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=136100:125460 gscn=1563 mandatory_for_activation=off
