#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------

set_qosflow id=1 5qi=6 default=on
set_qosflow id=2 5qi=1
set_qosflow id=3 5qi=5
amf_ue_ics_param ue=1 id=1 indexToRFSP=1

qosrule_set id=1 proto=tcp qos_flow=1 # Dla defaultowego QoS flow typu nonGBR
qosrule_set id=2 proto=udp qos_flow=2 #Dla QoS typu VoNR
qosrule_set id=3 proto=tcp qos_flow=3 #dla dodawanego QoS nonGBR

set_nwslice id=1 snssai=0x01:0xD143A5 default=on ue=all amf=1

debug_log level=6
sim_debug_log level=1 uec=1
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
sim_trace uec=1 protocol=nr_rrc on
sim_trace off
cfg_end

set_log log_to_file=on
sim_start version_check=off
