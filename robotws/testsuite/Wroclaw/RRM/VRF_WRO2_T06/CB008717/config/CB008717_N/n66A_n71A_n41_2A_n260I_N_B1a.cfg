set_cell id=8 gnb=2 pci=19:1 tac=200 tdd_cell=on nrci=0x08 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=531210:531210 gscn=6648 mandatory_for_activation=off



#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 sctp_rto_min=100
#---------------------------------------------------------------------------------------------------
