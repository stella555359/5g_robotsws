#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set DAEMON_IP="$CONTAINER_IP"
set SERVER_IP="$CONTAINER_IP"
set DAEMON_PORT="10000"
set GNB1_NG_ADDR="10.0.1.2"
set GNB1_XN_ADDR="10.0.1.2"
set GNB2_NG_ADDR="10.0.1.8"
set GNB2_XN_ADDR="10.0.1.9"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"
set EDAEMON_PORT="10000"

## Variables for NSA configuration

set PGW_ADDR="4.7.254.1"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"

#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------

set_amf_region id=1 tac_list=7627107,100,0,1,788 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+aes+snow3g+zuc nea=null+aes+snow3g+zuc ims_voice_3gpp=on
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR

#---------------------------------------------------------------------------------------------------
#GNB2 CONFIGURATION NR-ARFCN values UL:DL
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 ng=$GNB1_NG_ADDR xn=$GNB1_XN_ADDR gnb_id=0x01:22 daemon=$SERVER_IP:$DAEMON_PORT x2_peers=none amf=1 plmnList=311:489 nssai=0x1:0x000001
set_cell id=1 gnb=2 pci=16:2 tac=1 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=636666:636666 mandatory_for_activation=off gscn=7846

#---------------------------------------------------------------------------------------------------
#Simulated gNB
#---------------------------------------------------------------------------------------------------
set_gnb id=3 type=simulated plmn=311:489 xn=$GNB2_XN_ADDR ng=$GNB2_NG_ADDR gnb_id=0x03:22 daemon=$SERVER_IP:$DAEMON_PORT x2_peers=none amf=1 plmnList=311:489 nssai=0x1:0x000001

gnb_param id=3 xn_listening_socket=1 sib1_period=160 send_xn_setup=false measEvent=A2 measEvent=A3 sa_ho=xn_based xn_sctp_nodelay=on


set_cell id=3 gnb=3 pci=17:1 tac=1 nrci=0x03 tdd_cell=on proxy=$GNB2_XN_ADDR:9999|$GNB2_XN_ADDR:8888 nr_arfcn=2071591:2071591 gscn=22446 nr_scs=120kHz bs_channel_bandwidth=100MHz meas_timing_carrier_freq=2071387 ssb_subcarrier_spacing=kHz120 ssb_mtc_periodicity_and_offset=sf160:0 ssb_mtc_duration=sf4 suggested_band=257
enb_cell_param id=3 enb=3 allow_endc=off


#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 sctp_rto_min=100


#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------

#UE Id=1 SA capable of NR-DC
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
ue_param id=1 ue_nr_
#UE Id=2 SA NOT CAPABLE of NR-DC
set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645404 mode=nr enb=2 cell=1
ue_param id=2 ue_nr_
#UE Id=3 SA capable of NR-DC
set_ue simulated id=3 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645408 mode=nr enb=2 cell=1
ue_param id=3 ue_nr_
#UE Id=4 SA
set_ue simulated id=4 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645412 mode=nr enb=2 cell=1
ue_param id=4 ue_nr_
amf_ue_ics_param ue=1,3,4 id=1 indexToRFSP=1 include_ue_capabilities=no
#
