# This configuration file is used to define vDU parameters before vDU deploying.

[CONFIG_FILE]
#Version of this config file.
version=4.9.0


[VDU_NAMESPACE]
#Namespace of vDU. Default is empty and it must be configured before do any other operations.
namespace=cran24

[VDU_BUILD_INFO]
#Build ID of vDU, system release build or pre-QT build.
#1) vDU pre-QT build.e.g.
#build_version=0.300.469-VDUINT+0414054631
#2) vDU knifeanonymous build (local onboard mode).e.g.
#build_version=0.300.276-knifeanonymous+1112101026
#3) vDU system trunk release build for trunk.e.g.
#build_version=0.300.4386
#4) vDU system release build for 22R2.e.g.
#build_version=14.300.0001
#5) vDU system release build for 22R3.e.g.
#build_version=15.300.1
build_version=0.300.4386

[VDU_SCF_INFO]
#vDU SCF file which should be pre-stored in Kuafu scf/vdu directory.
scf_file_name=xxx_scf_file.xml

[VDU_CONFIG_INFO]
#Helm chart release name of vDU. Default is vdutest.
chart_name=cran24
#time zone in format "Region/City", e.g. "Asia/Shanghai". Default is 'UTC'.
timezone=UTC
#fec_vf_num is used to define FEC VF number (0 or 1) if accelerator FEC HW configured. E.g. Vista Creek, Mt Bryce.
#Configure 1 to enable HW LDPC, default is 0 (SW LDPC).
fec_vf_num=0
#cell_flag is used to define vDU one cell or multi cells configuration, 'single' for one cell, multi' for multi cells
#and 'two' only for OE19 based internal testing
cell_flag=single
#up_count is used to configure UP pod number of vDU, default is 1.
#The minimum and maximum UP pod number is 1 for D-RAN vDU.
#The minimum and maximum UP pod number is 2 and 10 for C-RAN vDU.
up_count=1
#Description of a site used as auto connection site ID
#Use default value defined in values-override.yaml of vDU helm chart if it is empty
site_description=
#deployment_type is used to indicate vDU capacity based on different OE type.
#'OE20_FULL_CAP', 'OE20_MEDIUM_CAP', 'OE19_MEDIUM_CAP' are supported now.
#Default is empty, it will be configured automatically according to OE HW type
#(OE20_MEDIUM_CAP for OE20 and OE19_MEDIUM_CAP for OE19)if it is empty.
deployment_type=
# Enable stack trace collection or not.
# Set enable_stack_trace=true to enable the collection of stack trace for crash debugging. Default is false.
enable_stack_trace=false

[VDU_VLAN_ID_INFO]
#Guest VLAN ID of vDU interfaces.
#Note: 18 VLAN IDs supported for fhuc after build 0.300.5523 with space as delimiter. E.g. fhuc_vlan_id=301 302
l1bip_vlan_id=3724
l2bip_vlan_id=3824
f1_vlan_id=2024
f1c_vlan_id=2024
oam_vlan_id=1024
tracing_vlan_id=3024
fhm_vlan_id=224
fhuc_vlan_id=3524


[VDU_OAM_IP_INFO]
#IP addresses (IPv4 or IPv6) for oam interface of vDU OAM Pod.
oam_ip_version=IPv4
oam_ip_start=192.168.255.129
oam_ip_end=192.168.255.129
oam_ip_subnet=192.168.255.0/24
oam_ip_gateway=192.168.255.1

[VDU_TRACING_IP_INFO]
#IP addresses (IPv4 or IPv6) for tracing interface.
tracing_ip_version=IPv4
tracing_ip_subnet=172.16.5.0/24
tracing_ip_gateway=172.16.5.1
tracing_ip_start=172.16.5.2
tracing_ip_end=172.16.5.10

[VDU_F1C_IP_INFO]
#IP addresses (IPv4 or IPv6 ) for f1c interface of vDU CPRT Pod.
f1c_ip_version=IPv4
f1c_ip_start=172.16.1.6
f1c_ip_end=172.16.1.6
f1c_ip_subnet=172.16.1.0/24
f1c_ip_gateway=172.16.1.6

[VDU_F1_IP_INFO]
#IP addresses (IPv4 or IPv6 ) for f1 interface of vDU UP Pod.
f1_ip_version=IPv4
f1_ip_start=172.16.1.7
f1_ip_end=172.16.1.7
f1_ip_subnet=172.16.1.0/24
f1_ip_gateway=172.16.1.7

[VDU_FHM_IP_INFO]
#IP addresses (IPv4 or IPv6 ) for fhm interface of vDU oamfh Pod.
fhm_ip_version=IPv4
fhm_ip_start=192.168.254.33
fhm_ip_end=192.168.254.33
fhm_ip_subnet=192.168.254.0/26

[VDU_RAN_SHARING_IP_INFO]
# This section is used to configure IP info of f1 uplane interface for RAN sharing. Maximum 5 additional operators are supported now.
# The variable name convention is "op<index>_<interface>_<vlan_id|ip_version|ip_start|ip_end|ip_subnet>"
# The <index> represents additional operator number, [1, 5] is officially supported.
# Following is one example of f1 uplane IPv4 configuraion for two additional operators.
#op1_f1_vlan_id=219
#op1_f1_ip_version=ipv4
#op1_f1_ip_start=10.20.146.106
#op1_f1_ip_end=10.20.146.106
#op1_f1_ip_subnet=10.20.146.104/29
#op2_f1_vlan_id=218
#op2_f1_ip_version=ipv4
#op2_f1_ip_start=10.20.146.82
#op2_f1_ip_end=10.20.146.82
#op2_f1_ip_subnet=10.20.146.80/29

[VCU_F1_IP_INFO]
#IP addresses (IPv4 or IPv6) for f1-c/f1-u of vCU. The IP protocol of f1 network must be same between vDU and vCU.
f1_ip_version=IPv4
f1_ip_subnet=172.16.1.0
f1_ip_gateway=172.16.1.6

[FHGW_INFO]
#IPv4 addresses of FHGW, only needed for AHBCC and AHCA type RU.
fhgw_ip=10.71.160.181

[RU_INFO]
#RU type, only AHBCC, AHCA, AEQY, AEQP, AEQE, AZQI and AZQJ RU supported.
ru_type=AHBCC
#IPv4 addresses (IPv4) of RUs, only needed for AHBCC and AHCA type RU.
#multi addresses of RUs are supported which using space as delimiter.
#E.g. ru_ip=169.254.1.2 169.254.2.2 The first RU address mapped to ruproxy-1-0
#and second RU address mapped to ruproxy-2-0 and so on.
ru_ip=169.254.1.2


# Following sections are used to define host binding and guest VLAN based vDU
# network parameters before vDU networks creation.
# E.g. Fill in fields of NCIR_CaaS section when deploy guest VLAN based vDU on top of NCIR.

[NCIR_CaaS]
#Guest VLAN based bip, oam, f1, fhm, fhuc cluster level networks, which are shared in cluster.
#Currently, Vista Creek card is still used as NIC in several OE19 environments.
#The device pool names of fhuc and fhm are different between Intel NIC and V-C card as NIC.
#These values need be checked based on infra configuration before vDU network creation.
#The default device pool name based on Intel NIC.
#Please modify fhuc_device_pool and fhm_device_pool when use V-C card as NIC.
#fhuc_device_pool=nokia.k8s.io/sriov_vfio_enp181s0f0
#fhm_device_pool=nokia.k8s.io/sriov_enp181s0f0
#
bip_device_pool=nokia.k8s.io/sriov_vfio_ens93f2
f1_device_pool=nokia.k8s.io/sriov_vfio_ens93f2
oam_device_pool=nokia.k8s.io/sriov_ens93f2
fhuc_device_pool=nokia.k8s.io/sriov_vfio_ens11f0
fhm_device_pool=nokia.k8s.io/sriov_ens11f0
f1c_device_pool=nokia.k8s.io/sriov_ens93f2
tracing_device_pool=nokia.k8s.io/sriov_ens93f2

[NCS]
#Guest VLAN based bip/oam/f1/fhm/fhuc tenant level networks, which are namespace isolated.
#The SR-IOV resource name should be provided and double checked before vDU network creation according to infra environment.
bip_resourceName=nokia.k8s.io/sriov_vfio_ens93f2
f1_resourceName=nokia.k8s.io/sriov_vfio_ens93f2
oam_resourceName=nokia.k8s.io/sriov_ens93f2
fhuc_resourceName=nokia.k8s.io/sriov_vfio_ens93f2
fhm_resourceName=nokia.k8s.io/sriov_ens93f2
f1c_resourceName=nokia.k8s.io/sriov_ens93f2
tracing_resourceName=nokia.k8s.io/sriov_ens93f2

[OCP]
#Guest VLAN based bip/oam/f1/fhm/fhuc tenant level networks, which are namespace isolated.
#The SR-IOV resource name should be provided and double checked before vDU network creation according to infra environment.
bip_resourceName=openshift.io/sriov_vfio_ens93f2
f1_resourceName=openshift.io/sriov_vfio_ens93f2
fhuc_resourceName=openshift.io/sriov_vfio_ens93f2
oam_resourceName=openshift.io/sriov_netdevice_ens93f2
fhm_resourceName=openshift.io/sriov_netdevice_ens93f2
f1c_resourceName=openshift.io/sriov_netdevice_ens93f2
tracing_resourceName=openshift.io/sriov_netdevice_ens93f2

