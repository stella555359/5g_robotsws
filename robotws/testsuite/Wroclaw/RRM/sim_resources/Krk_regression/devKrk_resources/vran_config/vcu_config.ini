# This configuration file is used to define vCU parameters before vCU deploying.

[CONFIG_FILE]
version=3.7.0


[VCU_NAMESPACE]
#Namespace of vCU. Default is empty and it must be configured before do any other operations
#e.g. namespace=cran1
namespace=cran24

[VCU_BUILD_INFO]
#Build ID of vCU, system release build.
#1) vCU system release build for trunk.e.g.
#build_version=0.250.3485
#2) vCU system release build for 22R2.e.g.
#build_version=14.250.0001
#3) vCU system release build for 22R3.e.g.
#build_version=15.250.3
build_version=0.250.3485

[VCU_SCF_INFO]
#vCU SCF file which should be pre-stored in Kuafu scf/vcu directory.
scf_file_name=xxx_scf_file.xml

[VCU_CONFIG_INFO]
#Helm chart release name of vCU.
#e.g. chart_name=vcutest
chart_name=cran24
#time zone in format "Region/City", e.g. "Asia/Shanghai". Defuault as 'UTC'.
timezone=UTC
#The number of CPUE Pods.
#If cnfLayout is basic, [1, 8] is officially supported; if cnfLayout is redundant, [2, 8] is officially supported
#Note: If cnfLayout is redundant and cpuecount is 1, it will be modified to 2 automatically.
cpue_count=1
#The minimum number of N+ CPUE Pods to support the capacity requirement of the operator.
#The capacity reduction alarm will be reported when existing CPUE pods number less than required minimum capacity number.
#If cnfLayout is basic, [1, 8] is officially supported; if cnfLayout is redundant, [2, 8] is officially supported.
#Note: min_capacity_cpue should not larger than cpue_count and it will be modified to 2 automatically if it is 1 and cnfLayout is redundant.
min_capacity_cpue=1
#The number of UPUE Pods.
#If cnfLayout is basic, [1, 44] is officially supported; if cnfLayout is redundant, [2, 44] is officially supported.
#Note: If cnfLayout is redundant and upuecount is 1, it will be modified to 2 automatically.
upue_count=1
#The minimum number of N+ UPUE Pods to support the capacity requirement of the operator.
#The capacity reduction alarm will be reported when existing UPUE pods number less than required minimum capacity number.
#If cnfLayout is basic, [1, 4] is officially supported; if cnfLayout is redundant, [2, 44] is officially supported.
#Note: min_capacity_upue should not larger than upue_count and it will be modified to 2 automatically if it is 1 and cnfLayout is redundant.
min_capacity_upue=1
#The deployment mode of the vCU, there are three modes supported on the top of NCS/OCP: SA, NSA and SA + NSA mixed mode.
#Set mode=NSA means to use NSA mode, mode=SA means to use SA mode, mode=ALL means to use SA + NSA mixed mode.
#The default mode for vCU is NSA.
mode=SA
#The layout of the CU. Redundant means CU supports high availability. Support Value: basic or redundant
cnf_layout=basic
#Use link redundancy or not.
#Set link_redundancy=true, will use link redundancy. By default, link_redundancy=false and will not use link redundancy.
link_redundancy=false
#Source name of vCU for data monitor, show the Unique Identification of vCU, configured by 5G DEP
#Use default value defined in values-override.yaml of vCU helm chart if it is empty
site_description=
# CPU and memory resources requirements for different testing scenarios, including CIT, ST, ET, PET, etc.
# Set pet_resource_use=true for PET testing, which requires more CPU and less memory resources. Detail resources requirements can be found in vCU CB007890 feature.
# Set pet_resource_use=false for other testing scenarios if no enough CPU resources available of test line, which requires less CPU resources.
# Default is true.
pet_resource_use=true
# Enable stack trace collection or not.
# Set enable_stack_trace=true to enable the collection of stack trace for crash debugging. Default is false.
enable_stack_trace=false

[VCU_VLAN_ID_INFO]
tracing_vlan_id=3024
oam_vlan_id=1024
f1c_vlan_id=2024
f1u_vlan_id=2024
internale1_vlan_id=624
 #x2u, s1u and x2c interfaces only used for NSA mode
x2c_vlan_id=2024
x2u_vlan_id=2024
s1u_vlan_id=2024
 #xnc, xnu, ngu and ngc interfaces only used for SA mode
xnc_vlan_id=3024
xnu_vlan_id=3024
ngu_vlan_id=2024
ngc_vlan_id=2024

[VCU_OAM_IP_INFO]
#IP addresses (ipv4 or ipv6) for oam interface of vCU oamext pod.
oam_ip_version=ipv4
oam_ip_start=192.168.100.129
oam_ip_end=192.168.100.129
oam_ip_subnet=192.168.100.0/24
oam_ip_gateway=192.168.100.1

[VCU_TRACING_IP_INFO]
#IP addresses (ipv4 or ipv6) for tracing interface.
tracing_ip_version=ipv4
tracing_ip_subnet=172.16.4.0/24
tracing_ip_start=172.16.4.5
tracing_ip_end=172.16.4.5

[VCU_F1C_IP_INFO]
#IP addresses (ipv4 or ipv6) for f1c interface of vCU cpif pod, using mh-c as underlying interface.
f1c_ip_version=ipv4
f1c_ip_start=172.16.1.2
f1c_ip_end=172.16.1.2
f1c_ip_subnet=172.16.1.0/24

[VCU_X2C_IP_INFO]
#If mode configured as SA, skip this section.
#IP addresses (ipv4 or ipv6) for x2u interface of vCU cpif pod, using mh-c as underlying interface.
x2c_ip_version=ipv4
x2c_ip_start=10.0.1.13
x2c_ip_end=10.0.1.13
x2c_ip_subnet=10.0.1.0/24

[VCU_F1U_IP_INFO]
#IP addresses (ipv4 or ipv6) for f1u interface of vCU upue pods, using mh-u as underlying interface.
f1u_ip_version=ipv4
f1u_ip_start=172.16.1.3
f1u_ip_end=172.16.1.5
f1u_ip_subnet=172.16.1.0/24

[VCU_X2U_IP_INFO]
#If mode configured as SA, skip this section.
#IP addresses (ipv4 or ipv6) for x2u interface of vCU upue pods, using mh-u as underlying interface.
x2u_ip_version=ipv4
x2u_ip_start=10.0.1.14
x2u_ip_end=10.0.1.16
x2u_ip_subnet=10.0.1.0/24

[VCU_NGC_IP_INFO]
#If mode configured as NSA, skip this section.
#IP addresses (ipv4 or ipv6) for ngc interface of vCU cpif pod, using bh-c as underlying interface.
#Dual stack for xnc/ngc/xnu/ngu are supported which using space as delimiter.
#E.g. ngc_ip_version=ipv4 ipv6 when configure dual stack.
#E.g. ngc_ip_start=10.20.146.57 2a00:8a00:8000:134::e:dc04, It will configure both ipv4 and ipv6 addresses.
#E.g. ngc_ip_start=10.20.146.57, It will configure ipv4 address.
#E.g. ngc_ip_start=2a00:8a00:8000:134::e:dc04, It will configure ipv6 address.
ngc_ip_version=ipv4
ngc_ip_start=10.0.1.6
ngc_ip_end=10.0.1.8
ngc_ip_subnet=10.0.1.0/24

[VCU_XNC_IP_INFO]
#If mode configured as NSA, skip this section.
#IP addresses (ipv4 or ipv6) for xnc interface of vCU cpif pod, using bh-c as underlying interface.
#Dual network for xnc/ngc/xnu/ngu are supported which using space as delimiter.
#E.g. xnc_ip_version=ipv4 ipv6 when configure dual stack.
#E.g. xnc_ip_start=10.20.146.91 2a00:8a00:8000:134::e:dc05, It will configure dual network addresses.
#E.g. xnc_ip_start=10.20.146.91, It will configure ipv4 network address.
#E.g. xnc_ip_start=2a00:8a00:8000:134::e:dc05, It will configure ipv6 network address.
xnc_ip_version=ipv4
xnc_ip_start=10.0.10.55
xnc_ip_end=10.0.10.55
xnc_ip_subnet=10.0.10.0/24

[VCU_S1U_IP_INFO]
#If mode configured as SA, skip this section.
#IP addresses (ipv4 or ipv6) for s1u interface of vCU upue pods, using bh-u as underlying interface.
s1u_ip_version=ipv4
s1u_ip_start=10.0.1.11
s1u_ip_end=10.0.1.11
s1u_ip_subnet=10.0.1.0/24

[VCU_NGU_IP_INFO]
#If mode configured as NSA, skip this section.
#IP addresses (ipv4 or ipv6) for ngu interface of vCU upue pods, using bh-u as underlying interface.
#Dual network for xnc/ngc/xnu/ngu are supported which using space as delimiter.
#E.g. ngu_ip_version=ipv4 ipv6 when configure dual stack.
#E.g. ngu_ip_start=10.20.146.106 2a00:8a00:8000:134::e:da04, It will configure dual network addresses.
#E.g. ngu_ip_start=10.20.146.106, It will configure ipv4 network address.
#E.g. ngu_ip_start=2a00:8a00:8000:134::e:da04, It will configure ipv6 network address.
ngu_ip_version=ipv4
ngu_ip_start=10.0.1.3
ngu_ip_end=10.0.1.5
ngu_ip_subnet=10.0.1.0/24

[VCU_XNU_IP_INFO]
#If mode configured as NSA, skip this section.
#IP addresses (ipv4 or ipv6) for xnu interface of vCU upue pods, using bh-u as underlying interface.
#Dual network for xnc/ngc/xnu/ngu are supported which using space as delimiter.
#E.g. xnu_ip_version=ipv4 ipv6 when configure dual stack.
#E.g. xnu_ip_start=10.20.146.82 2a00:8a00:8000:134::e:da05, It will configure dual network addresses.
#E.g. xnu_ip_start=10.20.146.82, It will configure ipv4 network address.
#E.g. xnu_ip_start=2a00:8a00:8000:134::e:dc05, It will configure ipv6 network address.
xnu_ip_version=ipv4
xnu_ip_start=10.0.10.56
xnu_ip_end=10.0.10.58
xnu_ip_subnet=10.0.10.0/24

[VCU_RAN_SHARING_IP_INFO]
# This section is used to configure IP info of interface for RAN sharing. Maximum 5 additional operators are supported now.
# x2c,ngc,xnc,f1u,x2u,s1u,ngu,xnu interfaces support RAN sharing.
# The variable name convention is "op<index>_<interface>_<vlan_id|ip_version|ip_start|ip_end|ip_subnet>"
# The <index> represents additional operator number, [1, 5] is officially supported.
# Following is one example of s1u IPv4 configuraion for two additional operators.
#op1_s1u_vlan_id=104
#op1_s1u_ip_version=ipv4
#op1_s1u_ip_start=10.70.41.34
#op1_s1u_ip_end=10.70.41.34
#op1_s1u_ip_subnet=10.70.41.32/28
#op2_s1u_vlan_id=106
#op2_s1u_ip_version=ipv4
#op2_s1u_ip_start=10.71.171.209
#op2_s1u_ip_end=10.71.171.209
#op2_s1u_ip_subnet=10.71.171.208/29

# Following sections are used to define host binding and guest VLAN based vCU
# network parameters before vCU networks creation.

[NCS]
#Guest VLAN based tenant level networks, which are namespace isolated.
#The SR-IOV resource name should be provided and double checked before vCU network creation according to infra environment.
#All u-plane networks use fastpath device pool, others use slowpath device pool.
#For MLX NIC, the fastpath device pool is same with slowpath device pool.
#For Intel NIC, the fastpath device pool is different from slowpath device pool.
#Following are reference example configurations, please double confirm the device pool names of your test lines and
#configure the right device pool for related vCU networks
mh-c_resourceName=nokia.k8s.io/sriov_ens93f2
oam_resourceName=nokia.k8s.io/sriov_ens93f2
tracing_resourceName=nokia.k8s.io/sriov_ens93f2
internal-e1_resourceName=nokia.k8s.io/sriov_ens93f2
mh-u_resourceName=nokia.k8s.io/sriov_ens93f2
bh-u_resourceName=nokia.k8s.io/sriov_ens93f2
#If mode configured as SA, configure bh-c below inline.
bh-c_resourceName=nokia.k8s.io/sriov_ens93f2
#If want to use link redundancy,configure mh-c-s, oam-s, mh-u-s and bh-u-s bh-c-s below inline.
#Below variables only valid when link_redundancy=true in this file
mh-c-s_resourceName=nokia.k8s.io/sriov_ens93f2
oam-s_resourceName=nokia.k8s.io/sriov_ens93f2
mh-u-s_resourceName=nokia.k8s.io/sriov_ens93f2
bh-u-s_resourceName=nokia.k8s.io/sriov_ens93f2
bh-c-s_resourceName=nokia.k8s.io/sriov_ens93f2

[OCP]
#Guest VLAN based tenant level networks, which are namespace isolated.
#The SR-IOV resource name should be provided and double checked before vCU network creation according to infra environment.
#All u-plane networks use fastpath device pool, others use slowpath device pool.
#For MLX NIC, the fastpath device pool is same with slowpath device pool.
#For Intel NIC, the fastpath device pool is different from slowpath device pool.
#Following are reference example configurations, please double confirm the device pool names of your test lines and
#configure the right device pool for related vCU networks
mh-c_resourceName=openshift.io/sriov_netdevice_ens1f1
oam_resourceName=openshift.io/sriov_netdevice_ens1f1
tracing_resourceName=openshift.io/sriov_netdevice_ens1f1
internal-e1_resourceName=openshift.io/sriov_netdevice_ens1f1
mh-u_resourceName=openshift.io/sriov_netdevice_ens1f1
bh-u_resourceName=openshift.io/sriov_netdevice_ens1f1
#If mode configured as SA, configure bh-c below inline.
bh-c_resourceName=openshift.io/sriov_netdevice_ens1f1
#If want to use link redundancy,configure mh-c-s, oam-s, mh-u-s and bh-u-s bh-c-s below inline.
#Below variables only valid when link_redundancy=true in this file
mh-c-s_resourceName=openshift.io/sriov_netdevice_ens1f1
oam-s_resourceName=openshift.io/sriov_netdevice_ens1f1
mh-u-s_resourceName=openshift.io/sriov_netdevice_ens1f1
bh-u-s_resourceName=openshift.io/sriov_netdevice_ens1f1
bh-c-s_resourceName=openshift.io/sriov_netdevice_ens1f1

