#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP

set GNB_NG_ADDR="10.0.1.2"
set GNB_XP_ADDR=$GNB_NG_ADDR
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

set ENB2_S1_ADDR="10.0.1.11"
set ENB_XP_ADDR="10.0.1.200"
set ENB_XPU_ADDR=$ENB_XP_ADDR
set MME1_S1_ADDR="10.0.1.10"
set EDAEMON_PORT="10000"

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+aes+snow3g+zuc nea=null+aes+snow3g+zuc ims_voice_3gpp=on
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=1 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x1 daemon=$SERVER_IP:$EDAEMON_PORT xp_management=on xp=$GNB_XP_ADDR:32742 xpu=$GNB_XP_ADDR:32742 amf=1
set_cell id=1 gnb=1 pci=16:2 tac=200 nrci=0x01 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=376040:392500 gscn=4904 mandatory_for_activation=off
set_cell id=2 gnb=1 pci=17:0 tac=200 nrci=0x01 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=345000:425000 gscn=5314 mandatory_for_activation=off
set_cell id=3 gnb=1 pci=17:1 tac=200 nrci=0x01 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=138280:128520 gscn=1605 mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 eq_plmn=250:255 tac_list=777,111,222,444,333
set_mme id=1 ip=$SERVER_IP:$EDAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1

#---------------------------------------------------------------------------------------------------
#eNBsim1_DSS CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=2 plmn=311:489 s1=$ENB2_S1_ADDR enb_id_macro=0x00002 daemon=$SERVER_IP:$EDAEMON_PORT xp_management=on xp=$ENB_XP_ADDR:32742 xpu=$ENB_XPU_ADDR:32742 type=simulated x2_peers=none local_crm=on
enb_param id=2 drb_id_begin=3
enb_param id=2 endc_capable_qci=9
enb_endc_param id=2 control_flow_period=3gpp1 use_nr_ran_cont=on
set_cell id=1 enb=2 bw=10MHz eci=0x0000201 pci=3:2 tac=222 proxy=$CONTAINER_IP:12219 earfcn=66586:132122

#dss_enb_param id=2 feature_flag=off

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26
#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=1 cell=1
#mimo 4x2 srsmaxNumberSRS-Ports-PerResource n2 #
ue_param id=1 ue_nr_


set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645401 mode=nr enb=1 cell=2
#mimo 4x2 srsmaxNumberSRS-Ports-PerResource n1# ue_param id=2 ue_nr_
#mimo 4x2 srsmaxNumberSRS-Ports-PerResource n2 #
ue_param id=2 ue_nr_
#MIMO 2x2 srsmaxNumberSRS-Ports-PerResource n1#  ue_param id=2 ue_nr_
#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------

#set_qosflow id=1 5qi=6 default=on
#set_nwslice id=1 snssai=0x01:0xD143A5 default=on ue=all amf=1
#set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
#set_pdu_gateway id=2 ue_nat_ip=72.24.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

set_qosflow id=1 5qi=5 default=on
set_qosflow id=2 5qi=1
#set_qosflow id=3 5qi=5


qosrule_set id=1 proto=udp qos_flow=1
qosrule_set id=2 proto=tcp qos_flow=2
#qosrule_set id=3 proto=udp qos_flow=3

ue_param id=1 nr_usage_setting=voice_centric


smf_param id=1 additional_qosflows_to_activate=2
set_nwslice id=1 snssai=0x01:0xD143A5 default=on ue=all amf=1
set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=2 ue_nat_ip=72.24.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=3 ue_nat_ip=72.25.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

debug_log level=4
sim_debug_log level=1 mme=1
sim_debug_log level=4 uec=1
sim_debug_log level=1 pgw=1
sim_debug_log level=1 sgw=1
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end

set_log log_to_file=on
sim_start version_check=off

