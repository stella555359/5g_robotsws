#SETUP DSS LINK
enb_dss_param id=2 feature_flag=off
enb_dss_param id=2 feature_flag=on
dss_param_enb id=2 keep_alive_repetition_timer=2 keep_alive_threshold=2
script_sleep 5
enb_cell_param id=1 enb=2 lte_nr_dss_mode=DL_CRS_TDM_UL_FDM antenna_ports_num=4
enb_dss_cell_param enb=2 ul_fdm_flag=on
enb_configure_dss_partnership enb=2 cell=1 dss_peer=1:2
script_sleep 7
establish_enb_dss_partnership enb=2 cell=1 tgt_enb=1 tgt_cell=2
script_sleep 10

#DL RESOURCE CELL RESERVATION
enb_dss_cell_resource_reservation_dl enb=2 cell=1 reset
enb_dss_dl_resource_cell_reservation cell=1 enb=2 reserved_fixed_normal_subframes=1000010001-1000010001-1000010001-1000010001-1000010001-1000010001-1000010001-1000010001
enb_dss_dl_resource_cell_reservation cell=1 enb=2 min_lte_nr_dss_ratio=30 max_lte_nr_dss_ratio=70
enb_crm_cell_resource_reservation enb=2 cell=1 tgt_enb=1 tgt_cell=2
enb_dss_cell_resource_coordination enb=2 cell=1 tgt_enb=1 tgt_cell=2
script_sleep 10

#DL RESOURCE CELL ALLOCATION
enb_dss_resource_allocation enb=2 cell=1 tgt_enb=1 tgt_cell=2 dl_allocation_priority=0 allocation_start_time=immediate dl_allocated_normal_subframes=0011001000-0111001110-0011001000-0111001110-0011001000-0111001110-0011001000-0111001110
script_sleep 9

#UL RESOURCE CELL RESERVATION
enb_dss_ul_cell_resource_reservation enb=2 cell=1 minimum_prb_share=20 maximum_prb_share=60 prb_reservation_list=none prb_release_list=none
enb_dss_cell_resource_coordination enb=2 cell=1 tgt_enb=1 tgt_cell=2 dir=UL
script_sleep 9

#UL RESOURCE CELL ALLOCATION
enb_dss_resource_allocation  enb=2 cell=1 tgt_enb=1 tgt_cell=2 dir=UL allocation_start_time=immediate  ul_allocated_prb_list=0,4|48,4|7,20
