#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set DAEMON_IP=$CONTAINER_IP
set SERVER_IP=$CONTAINER_IP
set DAEMON_PORT="10000"
set GNB_NG_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

## Variables for NSA configuration

set ENB1_S1_ADDR="10.0.1.136"
set GNB_S1U_ADDR="10.0.1.112"

set ENB1_X2_ADDR="10.0.1.137"
set GNB_X2_ADDR="10.0.1.2"

set MME1_S1_ADDR="10.0.1.131"

set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"

set ENB_X2U_ADDR="10.0.1.135"
set PGW_ADDR="4.7.254.207"

set PROXY_SERVER_IP="10.0.2.80"

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$DAEMON_IP:12219|$DAEMON_IP:8889 earfcn=2000:20000 mapped_earfcn=4200:22200 tdd_cell=on mandatory_for_activation=off
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 tac_list=777,111,222,444,333,200
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100 s5u_snd_buff_size=20M s5u_rcv_buff_size=20M s1u_snd_buff_size=20M s1u_rcv_buff_size=20M gtpu_read_packets_threshold=10
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13 sgi_rcv_buff_size=20M sgi_snd_buff_size=20M s5u_rcv_buff_size=20M s5u_snd_buff_size=20M gtpu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
#amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$DAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#--5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------

set_amf_region id=1 tac_list=0,100,200,258,788 plmn=311:489
set_amf_region id=2 tac_list=0,100,200,258,788 plmn=244:09
set_amf_region id=3 tac_list=0,100,200,258,788 plmn=233:03
set_amf_region id=4 tac_list=0,100,200,258,788 plmn=255:05
set_amf_region id=5 tac_list=0,100,200,258,788 plmn=266:06
set_amf_region id=6 tac_list=0,100,200,258,788 plmn=277:07

set_amf id=1 daemon=$SERVER_IP:$DAEMON_PORT ng=10.0.1.1:38412 region=1 set_id=1 pointer=1
set_amf id=2 daemon=$SERVER_IP:$DAEMON_PORT ng=10.0.1.21:38412 region=2 set_id=1 pointer=1
set_amf id=3 daemon=$SERVER_IP:$DAEMON_PORT ng=10.0.1.22:38412 region=3 set_id=1 pointer=1
set_amf id=4 daemon=$SERVER_IP:$DAEMON_PORT ng=10.0.1.23:38412 region=4 set_id=1 pointer=1
set_amf id=5 daemon=$SERVER_IP:$DAEMON_PORT ng=10.0.1.24:38412 region=5 set_id=1 pointer=1
set_amf id=6 daemon=$SERVER_IP:$DAEMON_PORT ng=10.0.1.25:38412 region=6 set_id=1 pointer=1

#add ims_voice_3gpp support
#amf_param id=1 ims_voice_3gpp=on full_nas_auth=on

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x01 daemon=$SERVER_IP:$DAEMON_PORT x2_peers=none amf=1 plmnList=311:489 nssai=0x1:0xd143a5
set_cell id=1 gnb=2 nr_arfcn=636666:636666 gscn=7880 eci=0x000021f pci=16:2 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x01 tdd_cell=on mandatory_for_activation=off
set_cell id=2 gnb=2 nr_arfcn=636666:636666 gscn=7880 eci=0x000021f pci=17:0 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x02 tdd_cell=on mandatory_for_activation=off
set_cell id=3 gnb=2 nr_arfcn=135760:126380 gscn=1582 eci=0x000021f pci=17:1 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x03 tdd_cell=off  mandatory_for_activation=off
set_cell id=4 gnb=2 nr_arfcn=135760:126380 gscn=1582 eci=0x000021f pci=17:2 tac=200 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nrci=0x04 tdd_cell=off  mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$DAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 proxy_snd_buf_size=20971520 proxy_rcv_buf_size=20971520 proxy_read_packets_threshold=10
#---------------------------------------------------------------------------------------------------

#---------------------------------------------------------------------------------------------------
#--UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 sec_key=0102030405060708090A0B0C0D0EFF00 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null,zuc,aes,snow3g nea=null,zuc,aes,snow3g suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
ue_param id=1 ue_nr_capabilities=01000000010800000004D780000000000001150000000000000150

#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_qosflow id=1 5qi=8 default=on
set_nwslice id=1 snssai=0x01:0xD143A5 default=on qos_flows=1 ue=1 amf_region_id=1 plmn_list=311:489
set_nwslice id=2 snssai=0x01:0xD143A6 qos_flows=1 ue=1 amf_region_id=2 plmn_list=244:09 amf_region_id=3 plmn_list=233:03 amf_region_id=4 plmn_list=255:05 amf_region_id=5 plmn_list=266:06
set_nwslice id=3 snssai=0x01:0xD143A7 qos_flows=1 ue=1 amf_region_id=6 plmn_list=277:07

uec_param id=1 reordering_window_size=1000 reordering_timer=200

#---------------------------------------------------------------------------------------------------
debug_log level=4
sim_debug_log level=4 mme=1
sim_debug_log level=4 uec=1
sim_debug_log level=4 pgw=1
sim_debug_log level=4 sgw=1
link_ctrl_param hb_period=5 hb_retries=5
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
trace enb=1 protocol=x2 on
trace uec=1 protocol=x2 on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
sim_param_set NR_PDCP_CIPHERING=distributed
sim_param_set NR_PDCP_TRUNCATE_DL_SIZE=47 NR_PDCP_BUNDLE_DL_MAX_SIZE=1200 NR_PDCP_BUNDLE_DL_TIMEOUT=100
cfg_end

set_log log_to_file=on
sim_start version_check=off

