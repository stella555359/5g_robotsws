#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP

set GNB_NG_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

set EDAEMON_PORT="10000"
## Variables for NSA configuration

set ENB1_S1_ADDR="10.0.1.136"
set GNB_S1U_ADDR="10.0.1.112"

set ENB1_X2_ADDR="10.0.1.137"
set GNB_X2_ADDR="10.0.1.2"

set MME1_S1_ADDR="10.0.1.131"

set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"

set ENB_X2U_ADDR="10.0.1.135"
set PGW_ADDR="4.7.254.207"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$SERVER_IP:$EDAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$SERVER_IP:12219|$SERVER_IP:8889 earfcn=2000:20000 mapped_earfcn=4200:22200 tdd_cell=on mandatory_for_activation=off
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 tac_list=777,111,222,444,333,200
set_mme id=1 ip=$SERVER_IP:$EDAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$SERVER_IP:$EDAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100 s5u_snd_buff_size=8M s5u_rcv_buff_size=8M s1u_snd_buff_size=8M s1u_rcv_buff_size=8M gtpu_read_packets_threshold=10
set_pgw id=1 type=simulated ip=$SERVER_IP:$EDAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+aes+snow3g+zuc nea=null+aes+snow3g+zuc
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION NR-ARFCN values UL:DL
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x76C daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none amf=1
set_cell id=1 gnb=2 pci=16:2 tac=200 nrci=0x01 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=136100:125460 gscn=1563 mandatory_for_activation=off
set_cell id=2 gnb=2 pci=17:0 tac=200 nrci=0x02 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=349000:425100 gscn=5313 mandatory_for_activation=off
set_cell id=3 gnb=2 pci=17:1 tac=200 nrci=0x03 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=517872:517872 gscn=6480 mandatory_for_activation=off
set_cell id=4 gnb=2 pci=17:2 tac=200 nrci=0x04 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=167200:175560 gscn=2199 mandatory_for_activation=off
set_cell id=5 gnb=2 pci=18:0 tac=200 nrci=0x05 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=376500:392500 gscn=4904 mandatory_for_activation=off
set_cell id=6 gnb=2 pci=18:1 tac=200 nrci=0x06 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=531210:531210 gscn=6648 mandatory_for_activation=off



#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 sctp_rto_min=100
#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
####4CC n71 n66 n25 n41 - 10MHz + 20 MHz + 40MHz
ue_param id=1 ue_nr_
set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------

set_qosflow id=1 5qi=6 default=on
set_nwslice id=1 snssai=0x01:0xD143A5 default=on ue=all amf=1

debug_log level=6
sim_debug_log level=1 uec=1
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end

set_log log_to_file=on
sim_start version_check=off
