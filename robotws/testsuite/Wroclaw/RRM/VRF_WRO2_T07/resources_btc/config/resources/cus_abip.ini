[tgr_1]
ip_addr = 10.0.2.101
etgr = on
ss_interface = eth101
side = SS
user = root
password = cussim
update_cmd = sudo /opt/cus/var/update/update.sh
restart_cmd = sudo /etc/init.d/cus-tgr restart

[tgr_2]
ip_addr = 10.0.2.100
etgr = on
etgr_ip_addr = 10.0.2.102
ue_interface = eth100
side = MS
user = root
password = cussim
update_cmd = sudo /opt/cus/var/update/update.sh
restart_cmd = sudo /etc/init.d/cus-tgr restart
