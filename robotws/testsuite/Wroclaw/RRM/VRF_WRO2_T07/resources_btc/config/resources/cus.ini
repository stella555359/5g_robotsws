[executor]
log_level            = DEBUG
log_global_file_name = log_global.txt
log_dir              = /home/cus/logs
ue_config_url        = file:///opt/cus/etc/ue.db
duplex_mode          = FDD
hardware_platform    = FSMR4
start_on_cells_oos   = true
syslog_disable       = on
egate_ip             = 127.0.0.1
erl_node_executor    = executor@127.0.0.1
erl_node_egate       = egate@127.0.0.1  ; use 'set_cnode ip=192.168.11.21' on EGATE

[enb_1]
enb_type = FLEXI

[enb_2]
enb_type = ENBSIM

[enb_3]
enb_type = ENBSIM

[ip_configuration]
workstation_ip_addr = 192.168.200.126
netmask             = 255.255.255.0
lte_network_gw      = 10.0.2.1
ss_ip_addr_pool     = 185.4.0.0/16

[ctrl_1]
sectors                  = 1,2,3,4,5,6
ip_addr                  = 192.168.200.1
trsw_ip                  = 10.0.2.2
connector                = EIF5
sync_source              = BackplanePPS
mirroring_l2_on_startup  = 2
mirroring_sch_on_startup = 2

[ctrl_2]
hardware_platform          = ENBSIM
ip_addr                    = 192.168.200.126       ; same as 'workstation_ip_addr'
sectors                    = 7              ; refers to [sector] below
l3proxy_enbsim_addr        = 192.168.200.126   ; eNBSIM address (same as 'ip_addr' if on CUS worstation)
l3proxy_enbsim_cp_port     = 2154          ; eNBSIM proxy port
l3proxy_up_tgr_if          = eth102           ; interface on WorkStation to communicate with TGR MS (interface that has an address in the same network as TGR MS)
l3proxy_enbsim_local_addr  = 192.168.200.126   ; WS IP to communicate with eNBSIM (if eNBsim is on a remote VM, this has to be an address on WS that can reach eNBsim VM. If eNBsim runs on CUS workstation, it can be set to 'ip_addr' value)

[ctrl_3]
hardware_platform          = ENBSIM
ip_addr                    = 10.0.1.4       ; same as 'workstation_ip_addr'
sectors                    = 8              ; refers to [sector] below
l3proxy_enbsim_addr        = 127.0.0.1   ; eNBSIM address (same as 'ip_addr' if on CUS worstation)
l3proxy_enbsim_cp_port     = 2155          ; eNBSIM proxy port
l3proxy_up_tgr_if          = eth102           ; interface on WorkStation to communicate with TGR MS (interface that has an address in the same network as TGR MS)
l3proxy_enbsim_local_addr  = 127.0.0.1   ; WS IP to communicate with eNBSIM (if eNBsim is on a remote VM, this has to be an address on WS that can reach eNBsim VM. If eNBsim runs on CUS workstation, it can be set to 'ip_addr' value)
up_5g_if                   = lo
l3proxy_gnb_id             = 3
l3proxy_cell_id            = 8

[wts_auto]
enabled                     = off
ctrl_ip                     = 10.0.1.3
l3proxy_enbsim_addr         = 127.0.0.1
l3proxy_enbsim_local_addr   = 127.0.0.1
router_ipv4                 = 192.168.200.126
router_ipv6                 = ::11:1:1
l3proxy_up_tgr_if           = eth102
l3proxy_log_level           = debug
l3proxy_mib_interval        = 100
l3proxy_report_no_ovhd_mode = sync-lost
l3proxy_force_5g            = off
l3proxy_dummy_cell          = off
up_5g_if                    = lo
l3proxy_master_enb_ut_id    = 0
l3proxy_sender_id           = 1
l3proxy_uecs_amount         = 1

[sector_1]
enb       = 1
antennas  = 1:0:TxRx, 1:1:TxRx

[sector_2]
enb       = 1
antennas  = 2:0:TxRx, 2:1:TxRx

[sector_3]
enb       = 1
antennas  = 3:0:TxRx, 3:1:TxRx

[sector_4]
enb       = 1
antennas  = 4:0:TxRx, 4:1:TxRx

[sector_5]
enb       = 1
antennas  = 5:0:TxRx, 5:1:TxRx

[sector_6]
enb       = 1
antennas  = 6:0:TxRx, 6:1:TxRx

[sector_7]
dl_earfcn = 2800
enb       = 2          ; ID of the enb with enb_type = ENBSIM
router_apsim_ipv4 = 192.168.200.126  ; IP of the l3proxy_up_tgr_if (address on WS in the same network as TGR MS)
enb_cell_id = 7
bandwidth = 10

[sector_8]
dl_earfcn = 2000
enb       = 3          ; ID of the enb with enb_type = ENBSIM
router_apsim_ipv4 = 192.168.200.126  ; IP of the l3proxy_up_tgr_if (address on WS in the same network as TGR MS)
enb_cell_id = 8
bandwidth = 10

[nr5g_cell 111]
parent_sector          = 8       ; must refer to [sector] on ENBSIM [ctrl]

[radio_1]
rmod_type = AHFB
links     = 1.1:1:9.8
link_type = CPRI

[radio_2]
rmod_type = AHFB
links     = 1.2:1:9.8
link_type = CPRI

[radio_3]
rmod_type = AHFB
links     = 2.3:1:9.8
link_type = CPRI

[radio_4]
rmod_type = AHFB
links     = 2.4:1:9.8
link_type = CPRI

[radio_5]
rmod_type = AHFB
links     = 3.5:1:9.8
link_type = CPRI

[radio_6]
rmod_type = AHFB
links     = 3.6:1:9.8
link_type = CPRI


[tgr_1]
ip_addr         = 10.0.2.101
etgr            = on
ss_interface    = eth101
side            = SS
user            = root
password        = cussim
update_cmd      = sudo /opt/cus/var/update/update.sh
restart_cmd     = sudo /etc/init.d/cus-tgr restart

[tgr_2]
ip_addr         = 10.0.2.100
etgr            = on
etgr_ip_addr    = 10.0.2.102
ue_interface    = eth100
side            = MS
user            = root
password        = cussim
update_cmd      = sudo /opt/cus/var/update/update.sh
restart_cmd     = sudo /etc/init.d/cus-tgr restart


