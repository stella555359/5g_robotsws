setupData:
  result: success
  gnb-du-Ids:
    gnb-du-Id: ${gnb_du_Id} #sprawdzic jakie gnb DU ID
    gnb-Id:
      plmn-Identity: ${plmn_scf} #plmn from scf
      #missing gnbIDlength
      gnb-Id: ${gnb_id} #sprawdzic jakie gnb ID
  gnb-cu-ue-f1ap-Id: ${gnb_cu_f1ap_id} #value used in F1AP: Ue Context Setup Request
  gnb-du-ue-f1ap-Id: ${gnb_du_f1ap_id} # value used in F1AP: Ue Context Setup Response
  ueCtxSetupReqSndTime:
    seconds: ${timestamp1}  #set to timestamp of sending F1AP: Ue Context Setup Request
    useconds: ${timestamp2} #set to timestamp of sending F1AP: Ue Context Setup Request
  ueCtxSetupCmplRcvTime:
    seconds: ${timestamp3}  # set to timestamp of receiving F1AP: Ue Context Setup Response
    useconds: ${timestamp4}  # set to timestamp of receiving F1AP: Ue Context Setup Response
#missing Initial UL RRC message send time
