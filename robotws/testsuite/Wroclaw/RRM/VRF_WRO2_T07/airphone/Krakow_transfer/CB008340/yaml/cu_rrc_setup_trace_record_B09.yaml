result: ${result}
reestablishmentCause ${reestablishmentCause}
rrcConnReqTriggerRcvTime: # Time of receiving RRC:RRCSetUpRequest or RRC:Re-establishmentRequest
  seconds: ${rrcConnReqTriggerRcvTime}
  useconds: IN_RANGE(1000,999999)
rrcConnSetupCmplRcvTime: # Time of receiving RRC:RRCSetUpComplete
  seconds: ${rrcConnSetupCmplRcvTime}
  useconds: IN_RANGE(1000,999999)
rrcConnRejectSndTime
  seconds: ${rrcConnRejectSndTime}
  useconds: IN_RANGE(1000,999999)
ngSTmsi: ${ngSTmsi} # Initial UE identifier received in RRC Setup Complete 5G S-TMSI of UE
