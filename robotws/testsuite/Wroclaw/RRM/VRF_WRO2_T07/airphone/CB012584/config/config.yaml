ute_ca_hooks:
  post_sw_uploaded:
    package: "ute-ca-hook-aic-docker-knife"
    entrypoint: "ute-ca-hook-aic-docker-knife knife"
  commission:
    package: "ute-ca-hook-airphone"
    entrypoint: "ute-ca-hook-airphone commission"
  post_execution:
    - package: "ute-ca-hook-netconf"
      entrypoint: "ute-ca-hook-netconf configure-and-check"
    - package: "ute-ca-hook-airphone"
      entrypoint: "ute-ca-hook-airphone sosreport"
      execute_when: "failed"
    - package: "ute-ca-hook-airphone"
      entrypoint: "ute-ca-hook-airphone postpassedexecution"
      execute_when: "passed"
