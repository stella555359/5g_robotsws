set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP
set GNB_NG_ADDR="10.45.187.133"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.44.196.87"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"
set EDAEMON_PORT="10000"
set GNB_S1U_ADDR="10.0.1.112"
set GNB_X2_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"

set_amf_region id=1 tac_list=200 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+aes+snow3g+zuc nea=null+aes+snow3g+zuc
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=20
set_gnb id=2 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x21E0 daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none amf=1 nssai=0x1:0xd143a5

### Cells, arfcn UL:DL
set_cell id=50 gnb=2 pci=16:2 tac=200 nrci=0x32 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=636666:636666 gscn=7881 mandatory_for_activation=off
set_cell id=52 gnb=2 pci=17:1 tac=200 nrci=0x34 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=167300:176300 gscn=2203 mandatory_for_activation=off

set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 proxy_snd_buf_size=20971520 proxy_rcv_buf_size=20971520 tun_snd_buff_size=20971520 tun_rcv_buff_size=20971520 proxy_read_packets_threshold=20 tun_read_packet_threshold=20 sctp_rto_min=100

set FDD_TDD_


set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=2 ue_nat_ip=72.24.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=3 ue_nat_ip=72.25.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=4 ue_nat_ip=72.26.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP


set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645404 mode=nr enb=2 cell=50
ue_param id=1 ue_nr_capabilities=$FDD_TDD_capa

set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645414 mode=nr enb=2 cell=50
ue_param id=2 ue_nr_capabilities=$FDD_TDD_capa

set_ue simulated id=3 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645424 mode=nr enb=2 cell=52
ue_param id=3 ue_nr_capabilities=$FDD_TDD_capa

set_ue simulated id=4 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645434 mode=nr enb=2 cell=52
ue_param id=4 ue_nr_capabilities=$FDD_TDD_capa


set_qosflow id=1 5qi=6 default=on

set_nwslice id=1 snssai=0x01:0xD143A5 default=on ue=all amf=1
debug_log level=1
sim_debug_log level=1 uec=1
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end

set_log log_to_file=on
sim_start version_check=off
