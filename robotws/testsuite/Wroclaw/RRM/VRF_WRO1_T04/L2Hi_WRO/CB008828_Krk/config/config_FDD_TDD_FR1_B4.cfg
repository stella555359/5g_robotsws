set GNB_NG_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

set SA_UE_CAPABILITIES_
set SA_UE_CAPABILITIES_


## Variables for NSA configuration

set ENB1_S1_ADDR="10.0.1.136"
set GNB_S1U_ADDR="10.0.1.112"

set ENB1_X2_ADDR="10.0.1.137"
set GNB_X2_ADDR="10.0.1.2"

