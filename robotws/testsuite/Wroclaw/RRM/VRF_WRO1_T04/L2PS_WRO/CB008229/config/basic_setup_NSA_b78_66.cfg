#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x01:22 daemon=$SERVER_IP:$DAEMON_PORT x2_peers=none amf=1
