#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR xp_management=on xp=$ENB1_X2_ADDR:32742 xpu=$ENB1_X2_ADDR:32742 type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
set_cell id=1 bw=10MHz enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$SERVER_IP:12219 earfcn=200:18200
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on serving_cell_index_range_scg=8:14

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
