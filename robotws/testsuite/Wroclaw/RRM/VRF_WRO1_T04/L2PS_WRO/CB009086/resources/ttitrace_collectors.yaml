webservices:
  - &oam
    host: 192.168.255.129
    user: Nemuadmin
    password: nemuuser
    port: 443
collectors:
  - &tcpdump
    name: tcpdump
    type: tcpdump
    options: "-i eth3 udp and dst 10.0.1.1 and dst port 5678"
    sudo_password: ute
  -
    name: l2stream3
    type: l2stream3_sbts
    destination_ip_addr: 10.0.1.1
    collector: *tcpdump
    l2_stream_configuration: [ { profile_filter_list: [ "All events" ] } ]
    webservice: *oam
