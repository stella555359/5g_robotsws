#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP

set GNB_NG_ADDR="10.0.11.10"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.11.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="10.12.2.1"

set ENB1_S1_ADDR="10.0.1.136"
set GNB_S1U_ADDR="10.0.1.210"

set ENB1_X2_ADDR="10.0.1.137"
set GNB_X2_ADDR="10.0.1.10"

set MME1_S1_ADDR="10.0.1.131"

set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"

set ENB_X2U_ADDR="10.0.1.135"
#set GNB_X2U_ADDR="10.0.1.112"

set PGW_ADDR="4.7.254.207"

set PDN_IP1="4.7.254.208"
set PDN_IP2="4.7.254.209"
set EDAEMON_PORT="10000"



#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$SERVER_IP:$EDAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=all
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$SERVER_IP:12219|$SERVER_IP:8889 earfcn=2000:20000 mapped_earfcn=4200:22200
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on serving_cell_index_range_scg=1:7

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 tac_list=777,111,222,444,333,4580
set_mme id=1 ip=$SERVER_IP:$EDAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte pool=1:1
set_sgw id=1 ip=$SERVER_IP:$EDAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:2153 s5u_snd_buff_size=20M s5u_rcv_buff_size=20M s1u_snd_buff_size=20M s1u_rcv_buff_size=20M gtpu_read_packets_threshold=10
set_pgw id=1 type=simulated ip=$SERVER_IP:$EDAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs sgi_rcv_buff_size=20M sgi_snd_buff_size=20M s5u_rcv_buff_size=20M s5u_snd_buff_size=20M gtpu_read_packets_threshold=10


#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,280,788,200 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x76C daemon=$SERVER_IP:$EDAEMON_PORT amf=1 nssai=0x1:0xd143a5 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422
set_cell id=1 gnb=2 pci=16:2 tac=280 nrci=0x01 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=349000:431000 mandatory_for_activation=off gscn=5386

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 file=Airphone.xml proxy_snd_buf_size=20971520 proxy_rcv_buf_size=20971520 proxy_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
#UE Id=1 SA
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
ue_param id=1 ue_nr_

#UE Id=2 SA
set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645401 mode=nr enb=2 cell=1
ue_param id=2 ue_nr_


#---------------------------------------------------------------------------------------------------
#NSA UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_ue simulated id=101 uec=1 release=15 enb=1 cell=1 idle_edrx_cycle_len=2 ptw=2.56 sec_key=0102030405060708090A0B0C0D0EFF00 eia=null+snow3g+aes eea=null imsi=311:489:21645527
ue_param id=101 ue_nr_capabilities=ED807000479A4BBF5FFFFEF8001BD580800CFDBFCB98AD7FFBF900001F53FFFFC9FFA7FF1000000E77EF3FFF3FFFEC0001F78017FFE00002C7807E290401BFFEF0BFFEBC00E06D00158800000000023003C0E0800000400801 dual_conn=eutra_nr ue_eutra_nr_capabilities=BD1BA0130581807010000000180245E2800100008040400801

#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------

set_qosflow id=1 5qi=6 default=on
set_nwslice id=1 snssai=0x01:0xD143A5 default=on ue=all amf=1
set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=2 ue_nat_ip=72.23.0.11 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP


#---------------------------------------------------------------------------------------------------
#OTHER CONFIGURATION for NSA User
#---------------------------------------------------------------------------------------------------
set_bearer id=2 ue=101 qci=9 pdn=1 ip=$PDN_IP1 default=on trf_type=internal
uec_param id=1 reordering_window_size=1000 reordering_timer=200


debug_log level=1
sim_debug_log level=1 mme=1
sim_debug_log level=1 uec=1
sim_debug_log level=1 pgw=1
sim_debug_log level=1 sgw=1
#link_ctrl_param use_hb=off
link_ctrl_param hb_period=5 hb_retries=5
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end

set_log log_to_file=on
sim_start version_check=off