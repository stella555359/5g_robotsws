#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP

set GNB_NG_ADDR="10.0.11.10"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.11.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="10.12.2.1"

set EDAEMON_PORT="22222"

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,0,100,200,258,280,788 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=20M ngu_rcv_buff_size=20M ngu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x76C daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none amf=1
set_cell id=1 gnb=2 pci=17:0 tac=200 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=511596:511596 gscn=6393 mandatory_for_activation=off
set_cell id=2 gnb=2 pci=17:1 tac=200 nrci=0x02 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=524568:524568 gscn=6555 mandatory_for_activation=off
#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 file=AirPhone.xml proxy_snd_buf_size=20971520 proxy_rcv_buf_size=20971520 proxy_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc+snow3g+aes mode=nr nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 enb=2 cell=1
#ue_param id=1 ue_nr_
#ue_param id=1 ue_nr_capabilities=E1A01000014F5E0342C0020640024106CE261F0A1201360107FE618F28581C130080C450180531801507C28D618DA3A4C5411FCB29365048082D930480C18F18FFCC31E50B0381C3C044019006244006CA0000A0000001703850100001FE010FC00C04D8051C9A1F002C900080000000194B40064010000012CA4A00294E50900380078000000200400840
ue_param id=1 ue_nr_capabilities=E1A01000014F5E0342C0020640024106CE261F0A1201360107FE618F28581C130080C450180531801507C28D618DA3A4C5411FCB29365048082D930480C18F18FFCC31E50B0381C3C044019006244006CA0000A0000001703850100001FE010FC00C04D8051C9A1F002C900080000000194B40064010000012CA4A00294E5090038007800000020040085400
#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------

set_qosflow id=1 5qi=6 default=on
set_nwslice id=1 snssai=0x01:0xD143A5 default=on ue=all amf=1
set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

debug_log level=4
sim_debug_log level=4 mme=1
sim_debug_log level=4 uec=1
sim_debug_log level=4 pgw=1
sim_debug_log level=4 sgw=1
#link_ctrl_param use_hb=off
link_ctrl_param hb_period=5 hb_retries=5
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end

set_log log_to_file=on
sim_start version_check=off
