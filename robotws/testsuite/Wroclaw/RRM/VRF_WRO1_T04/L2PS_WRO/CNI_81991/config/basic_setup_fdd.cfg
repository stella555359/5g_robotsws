#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP
set EEDAEMON_PORT="10000"

#---------------------------------------------------------------------------------------------------
# gNB IPs
set GNB_NG_ADDR="10.0.1.2"
set GNB_XN_ADDR="10.0.1.2"
set GNB_X2_ADDR="10.0.1.2"
set GNB_S1U_ADDR="10.0.1.2"
#sim gnB3 interfaces
set GNB3_XN_ADDR="10.0.1.122"
set GNB3_NG_ADDR="10.0.1.123"
set GNB3_X2_ADDR="10.0.1.124"
set GNB3_S1U_ADDR="10.0.1.125"

#---------------------------------------------------------------------------------------------------
# 5GC IPs
set AMF_NG_ADDR="10.0.1.1"
set AMF2_NG_ADDR="10.0.1.102"
set UPF_ADDR="1.2.4.1"
# Real gNB cells
set PROXY_SERVER_IP="10.0.2.80"
# Simu gNB cells
set PROXY_SERVER_IP2="10.0.2.92"

#---------------------------------------------------------------------------------------------------
# EPC IPs
set MME1_S1_ADDR="10.0.1.131"
set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"
set ENB_X2U_ADDR="10.0.1.135"
set ENB1_S1_ADDR="10.0.1.136"
set ENB1_X2_ADDR="10.0.1.137"

set ENB4_S1_ADDR="10.0.1.138"
set ENB4_X2_ADDR="10.0.1.139"

set PGW_ADDR="4.7.254.207"
set PDN_IP="4.7.254.208"

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=250:255 tac_list=777,111,222,444,333,200
set_mme id=1 ip=$CONTAINER_IP:$EEDAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte pool=1:1
set_sgw id=1 ip=$CONTAINER_IP:$EEDAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100 s5u_snd_buff_size=20M s5u_rcv_buff_size=20M s1u_snd_buff_size=20M s1u_rcv_buff_size=20M gtpu_read_packets_threshold=10
set_pgw id=1 type=simulated ip=$CONTAINER_IP:$EEDAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs sgi_rcv_buff_size=20M sgi_snd_buff_size=20M s5u_rcv_buff_size=20M s5u_snd_buff_size=20M gtpu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,0,200,222 plmn=311:489
#set_amf_region id=2 tac_list=0,100,200,258,788,222 plmn=311:489

set_amf id=1 daemon=$SERVER_IP:$EEDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=1,2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc

#set_amf id=2 daemon=$SERVER_IP:$EEDAEMON_PORT ng=$AMF2_NG_ADDR:38412 region=2 set_id=2 pointer=1,2
#amf_param id=2 full_nas_auth=on nia=null+zuc nea=null+zuc

#set_backup_amf main=1 backup_amfs=2

set_upf id=1 daemon=$SERVER_IP:$EEDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=8M ngu_rcv_buff_size=8M ngu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=250:255 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$CONTAINER_IP:$EEDAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=all
# EUTRA Band4 for 4a_n40a ENDC
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$CONTAINER_IP:12219|$CONTAINER_IP:8889 earfcn=2000:20000 mapped_earfcn=4200:22200 mandatory_for_activation=off
# EUTRA Band3 for 3a_n41a ENDC
set_cell id=2 enb=1 eci=0x1234602 pci=4:0 tac=222 proxy=$CONTAINER_IP:12220|$CONTAINER_IP:8889 earfcn=1400:19400 mandatory_for_activation=off
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on
enb_endc_param id=1 keep_endc_on_ho=on ue_context_kept_indicator=on
enb_cell_param enb=1 id=1 allow_endc=on
enb_cell_param enb=1 id=2 allow_endc=on

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x1:22 daemon=$SERVER_IP:$EEDAEMON_PORT xn=$GNB_XN_ADDR x2_peers=none amf=1 nssai=0x1:0xd143a5,0x1:0xd143a6,0x1:0xd143a7
set_cell id=1 gnb=2 pci=16:2 tac=200 eci=0x000021f nrci=0x01 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=126380:135760 mandatory_for_activation=off gscn=1582
set_cell id=2 gnb=2 pci=17:0 tac=200 eci=0x0000220 nrci=0x02 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=126380:135760 mandatory_for_activation=off gscn=1582

#---------------------------------------------------------------------------------------------------
#GNB3 sim configuration for TDD
#---------------------------------------------------------------------------------------------------
set_gnb id=3 type=simulated plmn=311:489 ng=$GNB3_NG_ADDR gnb_id=0x3:22 daemon=$SERVER_IP:$EEDAEMON_PORT s1u=$GNB3_S1U_ADDR x2=$GNB3_X2_ADDR:36422 x2_peers=none xn=$GNB3_XN_ADDR nssai=0x1:0xd143a5,0x1:0xd143a6,0x1:0xd143a7 amf=1 plmnList=311:489
set_cell id=1 gnb=3 pci=127:0 tac=200 nrci=0x01 tdd_cell=on proxy=:5555 nr_arfcn=528000:528000 mandatory_for_activation=off gscn=6597 nr_scs=30kHz bs_channel_bandwidth=60MHz meas_timing_carrier_freq=523950 ssb_subcarrier_spacing=kHz30 ssb_mtc_periodicity_and_offset=sf20:0 ssb_mtc_duration=sf5 mapped_MFBI=78
#set_cell id=1 gnb=3 pci=127:0 tac=200 nrci=0x01 tdd_cell=on proxy=:5555 nr_arfcn=528000:528000 mandatory_for_activation=off gscn=6597 nr_scs=30kHz bs_channel_bandwidth=60MHz meas_timing_carrier_freq=523950 ssb_subcarrier_spacing=kHz30 #ssb_mtc_periodicity_and_offset=sf20:0 ssb_mtc_duration=sf5
gnb_cell_param id=1 gnb=3 enable_anr=on neighbor_pci=16:2
enb_param id=3 endc_capable_qci=all
gnb_endc_param id=3 use_nr_ran_cont=true scg_dl_dist_percent=0 enable_dud_poll_bit=0
gnb_param id=3 x2_listening_socket=1 send_xn_setup=false measEvent=A3 sa_ho=ng_based ng_data_forwarding_HO=on gbr_data_forwarding_HO=on sib1_period=40
#gnb_param id=3 x2_listening_socket=1 sib1_period=40 send_xn_setup=false measEvent=A3 ng_data_forwarding_HO=on gbr_data_forwarding_HO=on
#gnb_param id=3 Xn_Forwarding_Tunnel_Type=pdu
gnb_param id=3 ng_forwarding_tunnel_type=pdu

#---------------------------------------------------------------------------------------------------
#target gNB (acting as eNB stub)
#---------------------------------------------------------------------------------------------------
set_gnb id=4 type=simulated plmn=311:489 ng=$ENB4_S1_ADDR daemon=$CONTAINER_IP:$EEDAEMON_PORT gnb_id=0x12:28 nssai=0x01:0xD143A5 x2_peers=none xn=$ENB4_X2_ADDR
# PCI 15
set_cell id=1 gnb=4 pci=5:0 earfcn=1:18001 tac=222 proxy=$ENB4_S1_ADDR:12219 nrci=0x1 tdd_cell=on bw=20MHz technology=lte mandatory_for_activation=off
gnb_param id=4 xn_listening_socket=1 send_xn_setup=false

