#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP
set EEDAEMON_PORT="10000"

#---------------------------------------------------------------------------------------------------
# gNB IPs
set GNB_NG_ADDR="10.0.1.2"
set GNB_XN_ADDR="10.0.1.2"
set GNB_X2_ADDR="10.0.1.2"
set GNB_S1U_ADDR="10.0.1.2"
#sim gnB3 interfaces
set GNB3_XN_ADDR="10.0.1.122"
set GNB3_NG_ADDR="10.0.1.123"
set GNB3_X2_ADDR="10.0.1.124"
set GNB3_S1U_ADDR="10.0.1.125"

#---------------------------------------------------------------------------------------------------
# 5GC IPs
set AMF_NG_ADDR="10.0.1.1"
set AMF2_NG_ADDR="10.0.1.102"
set UPF_ADDR="1.2.4.1"
# Real gNB cells
set PROXY_SERVER_IP="10.0.2.80"
# Simu gNB cells
set PROXY_SERVER_IP2="10.0.2.92"

#---------------------------------------------------------------------------------------------------
# EPC IPs
set MME1_S1_ADDR="10.0.1.131"
set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"
set ENB_X2U_ADDR="10.0.1.135"
set ENB1_S1_ADDR="10.0.1.136"
set ENB1_X2_ADDR="10.0.1.137"

set ENB4_S1_ADDR="10.0.1.138"
set ENB4_X2_ADDR="10.0.1.139"

set PGW_ADDR="4.7.254.207"
set PDN_IP="4.7.254.208"

#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=250:255 tac_list=777,111,222,444,333,200
set_mme id=1 ip=$CONTAINER_IP:$EEDAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte pool=1:1
set_sgw id=1 ip=$CONTAINER_IP:$EEDAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100 s5u_snd_buff_size=20M s5u_rcv_buff_size=20M s1u_snd_buff_size=20M s1u_rcv_buff_size=20M gtpu_read_packets_threshold=10
set_pgw id=1 type=simulated ip=$CONTAINER_IP:$EEDAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs sgi_rcv_buff_size=20M sgi_snd_buff_size=20M s5u_rcv_buff_size=20M s5u_snd_buff_size=20M gtpu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,0,200,222 plmn=311:489
#set_amf_region id=2 tac_list=0,100,200,258,788,222 plmn=311:489

set_amf id=1 daemon=$SERVER_IP:$EEDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=1,2
amf_param id=1 full_nas_auth=on nia=null+zuc nea=null+zuc

#set_amf id=2 daemon=$SERVER_IP:$EEDAEMON_PORT ng=$AMF2_NG_ADDR:38412 region=2 set_id=2 pointer=1,2
#amf_param id=2 full_nas_auth=on nia=null+zuc nea=null+zuc

#set_backup_amf main=1 backup_amfs=2

set_upf id=1 daemon=$SERVER_IP:$EEDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=8M ngu_rcv_buff_size=8M ngu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=250:255 s1=$ENB1_S1_ADDR enb_id_macro=0x12346 daemon=$CONTAINER_IP:$EEDAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none
enb_param id=1 drb_id_begin=3 endc_capable_qci=all
# EUTRA Band4 for 4a_n40a ENDC
set_cell id=1 enb=1 eci=0x1234601 pci=3:2 tac=222 proxy=$CONTAINER_IP:12219|$CONTAINER_IP:8889 earfcn=2000:20000 mapped_earfcn=4200:22200 mandatory_for_activation=off
# EUTRA Band3 for 3a_n41a ENDC
set_cell id=2 enb=1 eci=0x1234602 pci=4:0 tac=222 proxy=$CONTAINER_IP:12220|$CONTAINER_IP:8889 earfcn=1400:19400 mandatory_for_activation=off
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on
enb_endc_param id=1 keep_endc_on_ho=on ue_context_kept_indicator=on
enb_cell_param enb=1 id=1 allow_endc=on
enb_cell_param enb=1 id=2 allow_endc=on

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x1:22 daemon=$SERVER_IP:$EEDAEMON_PORT xn=$GNB_XN_ADDR x2_peers=none amf=1 nssai=0x1:0xd143a5,0x1:0xd143a6,0x1:0xd143a7
set_cell id=1 gnb=2 pci=16:2 tac=200 eci=0x000021f nrci=0x01 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=136100:126900 mandatory_for_activation=off gscn=1587
set_cell id=2 gnb=2 pci=17:0 tac=200 eci=0x0000220 nrci=0x02 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=136100:126900 mandatory_for_activation=off gscn=1587



#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EEDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 proxy_snd_buf_size=20971520 proxy_rcv_buf_size=20971520 proxy_read_packets_threshold=10
#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------

amf_param id=1 ims_voice_3gpp=On indirect_data_forwarding=on intra5gs_data_forwarding=on

#UE Id=1 SA
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc+aes+snow3g nea=null+zuc+aes+snow3g sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
#20MHz
#ue_param id=1 ue_nr_
#5MHz
#ue_param id=1 ue_nr_
ue_param id=1 ue_nr_
#UE Id=2 SA
set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc+aes+snow3g nea=null+zuc+aes+snow3g sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645401 mode=nr enb=2 cell=1
ue_param id=2 ue_nr_

#UE Id=11 NSA
set_ue simulated id=11 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 sec_key=0102030405060708090A0B0C0D0EFF00 nia=null+zuc+aes+snow3g nea=null+zuc+aes+snow3g eia=null+zuc+aes+snow3g eea=null+zuc+aes+snow3g imsi=311:489:21645500
ue_param id=11 ue_nr_  dual_conn=eutra_nr ue_eutra_nr_capabilities=a10181102c0c0388c000000888160641c460000024400401c0462002100008040401803080008020200c0180
#UE Id=12 NSA
set_ue simulated id=12 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 sec_key=0102030405060708090A0B0C0D0EFF00 nia=null+zuc+aes+snow3g nea=null+zuc+aes+snow3g eia=null+zuc+aes+snow3g eea=null+zuc+aes+snow3g imsi=311:489:21645501
ue_param id=12 ue_nr_  dual_conn=eutra_nr ue_eutra_nr_capabilities=a10181102c0c0388c000000888160641c460000024400401c0462002100008040401803080008020200c0180
#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_qosflow id=1 5qi=6 default=on priority=6
set_qosflow id=2 5qi=7 priority=7
# qos_flow_type=gbr
set_qosflow id=3 5qi=8 priority=8

set_qosflow id=4 5qi=9 priority=9

#add for 5Qi-5 & 5Qi-1 support for VoNR
set_qosflow id=5 5qi=5 priority=2
set_qosflow id=6 5qi=1 qos_flow_type=gbr priority=1

set_qosflow id=7 5qi=2 priority=5
# qos_flow_type=gbr

# Not supported on real gNB:
set_qosflow id=8 5qi=3 priority=10

set_qosrule id=1 proto=tcp qos_flow=1
set_qosrule id=2 proto=tcp qos_flow=2
set_qosrule id=3 proto=tcp qos_flow=3
set_qosrule id=4 proto=tcp qos_flow=4

set_qosrule id=5 proto=tcp qos_flow=5
set_qosrule id=6 proto=udp qos_flow=6

set_qosrule id=7 proto=udp qos_flow=7
set_qosrule id=8 proto=tcp qos_flow=8

nwslice_set id=1 qos_flows=1,2,3,5,6,7,8 qos_rules=1,2,3,5,6,7,8 snssai=0x01:0xD143A5 default=on ue=all amf=1
nwslice_set id=2 qos_flows=1,2,4 qos_rules=1,2,4 snssai=0x01:0xD143A6 ue=all amf=1
nwslice_set id=3 qos_flows=1,2,5,6 qos_rules=1,2,5,6 snssai=0x01:0xD143A7 ue=all amf=1
nwslice_set id=4 qos_flows=1,2,3,8 qos_rules=1,2,3,8 snssai=0x01:0xD143A8 ue=all amf=1

# Real gNB does not support slice 5:
nwslice_set id=5 qos_flows=1,2,5,6 snssai=0x01:0xD143A9 ue=all amf=1

set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=2 ue_nat_ip=72.23.0.2 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=3 ue_nat_ip=72.23.0.3 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=4 ue_nat_ip=72.23.0.4 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=5 ue_nat_ip=72.23.0.5 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

set_pdu_gateway id=11 ue_nat_ip=72.23.0.11 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=12 ue_nat_ip=72.23.0.12 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

#---------------------------------------------------------------------------------------------------
#OTHER CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_bearer id=2 ue=11 qci=9 pdn=1 ip=$PDN_IP default=on ul_nat_gw=10.0.2.1 dl_nat_gw=10.0.2.1 trf_type=internal
set_bearer id=2 ue=12 qci=9 pdn=1 ip=4.7.254.209 default=on ul_nat_gw=10.0.2.1 dl_nat_gw=10.0.2.1 trf_type=internal
uec_param id=1 reordering_window_size=1000 reordering_timer=200

#---------------------------------------------------------------------------------------------------

debug_log level=0
link_ctrl_param use_hb=off
sim_debug_log level=1 mme=1
sim_debug_log level=1 uec=1
sim_debug_log level=1 pgw=1
sim_debug_log level=1 sgw=1
sim_debug_log level=1 amf=1

sim_debug_log level=1 app_type=l2nrt
sim_debug_log level=1 app_type=l2rt
sim_debug_log level=1 app_type=ueproxy

trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
trace enb=1 protocol=x2 on

trace uec=1 protocol=x2 on
sim_trace uec=1 protocol=nr_rrc on


cfg_end

start version_check=off
sim_trace amf=1 protocol=ng on
set_log log_to_file=on



