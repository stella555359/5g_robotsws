AppServer1: &APP_1                              # 1st application server definition
   address: '10.42.61.65'
   user: '5g'
   password: '2019H@slo'
   bind_interface_ip: '10.42.197.170'              # OPTIONAL ip of interface used for LTE data transfer
   expected_prompt: '5g@wl-srn-server-1-idf3_4 ~]'        # OPTIONAL regex that should match prompt on App Server

pdn_1: &pdn_1
    entryName: 'SK Telecom'           # This field is required, it defines name under which its stored on UE
    apnName: '5g.sktelecom.com'             # This field is required, its the apn address (could be "apn" also)
    apnType: # This field is required, it always has to be list, even if it just one entry. It tells Android what type of APN it is. Here are listed all possible
        # types: CBS, DEFAULT,DUN, EMERGENCY, FOTA, HIPRI, IA, IMS, MCX, MMS, SUPL, XCAP
        - DEFAULT
#    authType: PAP                   # Sets authentication type of the APN, can be one of: NONE, PAP, CHAP, PAP or CHAP

UE_POOLS:
    TafUeAndroidPool:                   # Ue Pool class defined by library (AndroidUePool is no longer supported !!!)
        inline_config:
            SAMSUNG_S20:               # UE name
                CAPABILITIES:           # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE
                    - SAMSUNG_S23
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:                                                     # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'R3CW506NKDP'                                             # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        ue_pc_address: '10.42.22.86'                                   # UE PC address
                        data_transfer:                                                      # data transfer protocols
                            iperf:
                                app_server: *APP_1
                                interval: 1
#                                interface_name: '5g.sktelecom.com/rmnet_data1'
                        service_call_attach: '16'                              # OPTIONAL Service call which will be used for attaching UE
                        service_call_detach: '16'                              # OPTIONAL Service call which will be used for detaching UE
                        network_mode_switch_method: 'ADB'                       # OPTIONAL Available values: adb, xposed, keyevents, secretcode. In case of adb - no rooting and xposed installation required
                        pdns: # OPTIONAL
                            default: *pdn_1
            ASUS:               # UE name
                CAPABILITIES:           # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE
                    - ASUS
                CLASS: AndroidUe
                CONSTRUCTOR_PARAMETERS:                                                     # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: 'M6AIKN0087532SF'                                             # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:
                        ue_pc_address: '10.42.22.86'                                   # UE PC address
                        data_transfer:                                                      # data transfer protocols
                            iperf:
                                app_server: *APP_1
                                interval: 1
#                                interface_name: '5g.sktelecom.com/rmnet_data1'
#                        service_call_attach: '123'                              # OPTIONAL Service call which will be used for attaching UE
#                        service_call_detach: '124'                              # OPTIONAL Service call which will be used for detaching UE
                        network_mode_switch_method: 'ADB'                       # OPTIONAL Available values: adb, xposed, keyevents, secretcode. In case of adb - no rooting and xposed installation required
                        pdns: # OPTIONAL
                            default: *pdn_1                       # OPTIONAL Available values: adb, xposed, keyevents, secretcode. In case of adb - no rooting and xposed installation required


ATTENUATORS:
    TopYoung:                                      # attenuator name - change if you want
        TYPE: TopYoung                                 # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.jfw.JfwAttenuator
        CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to Attenuator constructor when Attenuator instance is created.
            ip: '10.42.75.203'                    # IP address of attenuator device
            port: 3001                            # TCP Port number of attenuator device
            min_attenuation: 0                    # 3dB
            max_attenuation: 90                   # 95dB
    LTE:                                      # attenuator name - change if you want
        TYPE: TopYoung                                 # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.jfw.JfwAttenuator
        CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to Attenuator constructor when Attenuator instance is created.
            ip: '10.42.221.178'                    # IP address of attenuator device
            port: 3001                            # TCP Port number of attenuator device
            min_attenuation: 0                    # 3dB
            max_attenuation: 90                   # 95dB

