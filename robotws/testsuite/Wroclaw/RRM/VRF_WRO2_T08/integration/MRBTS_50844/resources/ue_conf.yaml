UE_POOLS:
    AndroidUePool:                                  # Ue Pool class defined by library
        inline_config:
            SAMSUNG_S23:                          # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE
                    - SAMSUNG_S23
                CLASS: AndroidUe            # UE type is Qualcomm so QualcommNoLicense class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created
                   serial_number: 'R3CW506NKDP'       #qulcomm 9bbd4220 samsung R3CW506NKDP mediatek 0123456789ABCDEF
                   configuration:                  # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
                        service_call_attach: '16'
                        service_call_detach: '16'           # TCP Port number on UE PC on which Pyro server will be started
                        ue_pc_ip: '10.42.22.86'    # UE PC IP address
                        pyro_port: '9090'           # TCP Port number on UE PC on which Pyro server will be started
                        login: 'wro5grrm'            # SSH login to UE PC
                        password: '5gpass!1'         # SSH password to UE PC
                        server_dir: '/cygdrive/c/pyro_server'    # UE PC directory where all server files will be copied
                        server_python: 'C:/Python38/python.exe' # UE PC python location
                        diag_com: 'COM28'                  #Qualcomm COM& , mediatek COM3, samsung COM38
                        dmc_path: 'C:/auto/qxdm_mask.dmc'
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
                        reset_interface: 'no'      # disable and enable mbn interface (interface_name) during Require Ue
                        clear_server_files: 'yes'
                        qualcomm_prototype: 'no'
                        clear_logs: 'yes'
                        processes_to_kill:          # processes to kill on UE PC - anything that may interrupt a test case
                            - 'putty'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                        data_transfer:                    # Application Server (for Iperf) details
                            ssh:
                                host: '10.45.168.53'       # Application Server IP
                                user: '5g'             # Application Server SSH login
                                password: '2019H@slo'      # Application Server SSH password
#                            iperf_interface_ip: '10.42.197.170'         # Application Server interface used for data transfer (-B iperf parameter)
            ASUS:                          # UE name
                CAPABILITIES:                       # Capabilities that UE has (used to find select UE with Require Ue keyword)
                    - REAL_UE
                    - REAL_ANDROID_UE
                    - ASUS
                CLASS: AndroidUe            # UE type is Qualcomm so QualcommNoLicense class will be used (QualcommNoLicense)
                CONSTRUCTOR_PARAMETERS:             # Parameters that will be passed to AndroidUe constructor when Ue instance is created
#                   serial_number: 'M6AIKN0087532SF'       #SN ASUSA
                   serial_number: '0123456789ABCDEF'       #qulcomm 9bbd4220  mediatek 0123456789ABCDEF
                   configuration:                  # By Default ue key ('AT_BASED_UE_1' for this ue) is passed to constructor as a name
#                        service_call_attach: '16'
#                        service_call_detach: '16'           # TCP Port number on UE PC on which Pyro server will be started
                        ue_pc_ip: '10.42.22.86'    # UE PC IP address
                        pyro_port: '9090'           # TCP Port number on UE PC on which Pyro server will be started
                        login: 'wro5grrm'            # SSH login to UE PC
                        password: '5gpass!1'         # SSH password to UE PC
                        server_dir: '/cygdrive/c/pyro_server'    # UE PC directory where all server files will be copied
                        server_python: 'C:/Python38/python.exe' # UE PC python location
                        diag_com: 'COM38'                  #Qualcomm COM& , mediatek COM3
                        dmc_path: 'C:/auto/qxdm_mask.dmc'
                        network_mode_switch_method: 'ADB'       # method for change network mode keyword
                        reset_interface: 'no'      # disable and enable mbn interface (interface_name) during Require Ue
                        clear_server_files: 'yes'
                        qualcomm_prototype: 'no'
                        clear_logs: 'yes'
                        processes_to_kill:          # processes to kill on UE PC - anything that may interrupt a test case
                            - 'putty'
                            - 'iperf'
                            - 'QPSTConfig'
                            - 'QMITestPro'
                        data_transfer:                    # Application Server (for Iperf) details
                            ssh:
                                host: '10.45.168.53'        # Application Server IP
                                user: '5g'             # Application Server SSH login
                                password: '2019H@slo'      # Application Server SSH password
#                            iperf_interface_ip: '10.42.197.170'         # Application Server interface used for data transfer (-B iperf parameter)


ATTENUATORS:
    TopYoung:                                      # attenuator name - change if you want
        TYPE: TopYoung                                 # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.jfw.JfwAttenuator
        CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to Attenuator constructor when Attenuator instance is created.
            ip: '10.42.75.203'                    # IP address of attenuator device
            port: 3001                            # TCP Port number of attenuator device
            min_attenuation: 0                    # 3dB
            max_attenuation: 90                   # 95dB
    LTE:                                      # attenuator name - change if you want
        TYPE: TopYoung                                 # attenuator type to use; or you may give it directly: ta_attenuator.attenuators_impl.jfw.JfwAttenuator
        CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to Attenuator constructor when Attenuator instance is created.
            ip: '10.42.221.178'                    # IP address of attenuator device
            port: 3001                            # TCP Port number of attenuator device
            min_attenuation: 0                    # 3dB
            max_attenuation: 90                   # 95dB

