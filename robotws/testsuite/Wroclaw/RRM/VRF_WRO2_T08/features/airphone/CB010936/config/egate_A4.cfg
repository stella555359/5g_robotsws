set_log log_to_file=on
# Copyright (c) 2019 Nokia. All rights reserved.

#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set SERVER_IP=$CONTAINER_IP

set GNB_NG_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

set EDAEMON_PORT="10000"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"


#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on nia=null+aes+snow3g+zuc nea=null+aes+snow3g+zuc ims_voice_3gpp=on
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION NR-ARFCN values UL:DL
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 ng=$GNB_NG_ADDR gnb_id=0x76C daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none amf=1
set_cell id=1 gnb=2 pci=17:0 tac=200 tdd_cell=off nrci=0x01 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=390000:428000 gscn=5350 mandatory_for_activation=off
set_cell id=2 gnb=2 pci=17:1 tac=200 tdd_cell=on nrci=0x02 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2071591:2071591 gscn=22446 mandatory_for_activation=off
set_cell id=3 gnb=2 pci=17:2 tac=200 tdd_cell=on nrci=0x03 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2073257:2073257 gscn=22452 mandatory_for_activation=off
set_cell id=4 gnb=2 pci=18:0 tac=200 tdd_cell=on nrci=0x04 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2074923:2074923 gscn=22458 mandatory_for_activation=off
set_cell id=5 gnb=2 pci=18:1 tac=200 tdd_cell=on nrci=0x05 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2076589:2076589 gscn=22464 mandatory_for_activation=off
set_cell id=6 gnb=2 pci=18:2 tac=200 tdd_cell=on nrci=0x06 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2078255:2078255 gscn=22470 mandatory_for_activation=off
set_cell id=7 gnb=2 pci=19:0 tac=200 tdd_cell=on nrci=0x07 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2079921:2079921 gscn=22476 mandatory_for_activation=off
set_cell id=8 gnb=2 pci=19:1 tac=200 tdd_cell=on nrci=0x08 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2081587:2081587 gscn=22482 mandatory_for_activation=off
set_cell id=9 gnb=2 pci=19:2 tac=200 tdd_cell=on nrci=0x09 proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=2083253:2083253 gscn=22488 mandatory_for_activation=off
#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 sctp_rto_min=100
#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------
#UE_n1A_n257M
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
# set_uec sctp_rto_min=100
ue_param id=1 ue_nr_
set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

#UE_n1A_n257M
set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645402 mode=nr enb=2 cell=1
ue_param id=2 ue_nr_
set_pdu_gateway id=2 ue_nat_ip=72.24.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP


#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
#set_qosflow id=1 5qi=6 default=on
#set_qosflow id=2 5qi=1
#set_qosflow id=3 5qi=5

#qosrule_set id=1 proto=tcp qos_flow=1 # Dla defaultowego QoS flow typu nonGBR
#qosrule_set id=2 proto=udp qos_flow=2 #Dla QoS typu VoNR
#qosrule_set id=3 proto=tcp qos_flow=3 #dla dodawanego QoS nonGBR
#set_nwslice id=1 snssai=0x01:0xD143A5 default=on ue=all amf=1

set_qosflow id=1 5qi=6 default=on

set_qosflow id=2 5qi=7
set_qosflow id=3 5qi=9

smf_param id=1 additional_qosflows_to_activate=2,3

nwslice_set id=1 qos_flows=1,2,3 snssai=0x01:0xD143A5 default=on ue=all amf=1

# QOS FILTERS FOR UE1
qosfilter_set id=1 proto=udp single_port=7260 dir=bi
qosfilter_set id=2 proto=tcp single_port=7261 dir=bi
qosfilter_set id=3 proto=udp single_port=7262 dir=bi
qosfilter_set id=4 proto=tcp single_port=7263 dir=bi
qosfilter_set id=5 proto=udp single_port=7264 dir=bi
qosfilter_set id=6 proto=tcp single_port=7265 dir=bi
qosfilter_set id=7 proto=udp single_port=7266 dir=bi
qosfilter_set id=8 proto=tcp single_port=7267 dir=bi
qosfilter_set id=9 proto=udp single_port=7268 dir=bi

# Sesja external do iperfa
ue_pdusession_param ue=1 pdu=1 qos_flow=1 filter_and_precedence=1:1 qos_flow=2 filter_and_precedence=2:2,3:3,6:6,7:7 qos_flow=3 filter_and_precedence=4:4,5:5,8:8,9:9

debug_log level=0
sim_debug_log level=1 mme=1
sim_debug_log level=1 uec=1
sim_debug_log level=1 pgw=1
sim_debug_log level=1 sgw=1
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on

amf_ue_ics_param ue=1,2 id=1 indexToRFSP=1

cfg_end


set_log log_to_file=on
sim_start version_check=off
