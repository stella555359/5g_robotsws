trsw_ip                  = 10.0.2.2
;sync_source              = BackplanePPS
mirroring_l2_on_startup  = 2
mirroring_sch_on_startup = 2
syslog_port  		 = 51601
syslog_mode 		 = 1
syslog_ip   		 = 192.168.200.126

;--------------------------------------------------------

[sector_11]
enb                      = 1
antennas                 = 1:0:TxRx, 1:1:TxRx

[sector_12]
enb                      = 1
antennas                 = 1:2:TxRx, 1:3:TxRx

[sector_13]
enb                      = 1
antennas                 = 1:4:TxRx, 1:5:TxRx

[sector_181]
enb                      = 1
antennas                 = 2:0:TxRx, 2:1:TxRx
mplane_only              = true

[sector_182]
enb                      = 1
antennas                 = 3:0:TxRx, 4:1:TxRx
mplane_only              = true

[sector_183]
enb                      = 1
antennas                 = 4:0:TxRx, 4:1:TxRx
mplane_only              = true



