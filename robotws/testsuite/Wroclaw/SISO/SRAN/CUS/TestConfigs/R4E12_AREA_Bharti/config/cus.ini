[executor]
log_level                   = DEBUG
log_global_file_name        = log_global.txt
log_dir                     = /home/cus/logs
ue_config_url               = file:///home/ute/MN/UTE/robotws/testsuite/Wroclaw/SISO/SRAN/CUS/resources/config/ue.db
ue_capabilities_url         = file:///home/ute/MN/UTE/robotws/testsuite/Wroclaw/SISO/SRAN/CUS/resources/config/uecap.ini
;ue_config_url               = file:///opt/cus/etc/ue.db
;ue_capabilities_url         = file:///opt/cus/etc/uecap.ini
duplex_mode                 = FDD
hardware_platform           = FSMR4
syslog_disable              = on

;------------------------------------------------------------

[enb_1]
enb_type = FLEXI

;------------------------------------------------------------

[ip_configuration]
workstation_ip_addr         = 192.168.200.126
netmask                     = 255.255.255.0
lte_network_gw              = 10.0.2.1
ss_ip_addr_pool             = 185.4.0.0/16

;------------------------------------------------------------
;-------------------CUS 1------------------------------------
;------------------------------------------------------------

[ctrl_1]
sectors                     = 1,2,3
ip_addr                     = 192.168.200.1
trsw_ip                     = 10.0.2.2
syslog_port                 = 51601
syslog_mode                 = 1
syslog_ip                   = 192.168.200.126
connector                   = EIF1

;------------------------------------------------------------

[sector_1]
enb         = 1
antennas    = 1:0:TxRx, 1:1:TxRx

[sector_2]
enb         = 1
antennas    = 1:2:TxRx, 1:3:TxRx

[sector_3]
enb         = 1
antennas    = 1:4:TxRx, 1:5:TxRx

;------------------------------------------------------------

[radio_1]
rmod_type                   = AREA
links                       = 1.1:1:9.8
link_type                   = CPRI

;------------------------------------------------------------

[tgr_1]
ip_addr         = 10.0.2.101
etgr            = on
;etgr_ip_addr   = 10.0.2.103
ss_interface    = eth101
side            = SS
user            = root
password        = cussim
update_cmd      = sudo /opt/cus/var/update/update.sh
restart_cmd     = sudo /etc/init.d/cus-tgr restart

[tgr_2]
ip_addr         = 10.0.2.100
etgr            = on
etgr_ip_addr    = 10.0.2.102
