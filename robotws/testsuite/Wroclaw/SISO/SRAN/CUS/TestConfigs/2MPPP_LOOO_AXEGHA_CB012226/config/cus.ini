[executor]
log_level                = DEBUG
log_global_file_name     = log_global.txt
log_dir                  = /home/cus/logs
ue_config_url            = file:///home/ute/MN/UTE/robotws/testsuite/Wroclaw/SISO/SRAN/CUS/resources/config/ue.db
ue_capabilities_url      = file:///home/ute/MN/UTE/robotws/testsuite/Wroclaw/SISO/SRAN/CUS/resources/config/uecap.ini
duplex_mode              = TDD
hardware_platform        = CUS2
start_on_cells_oos       = true
auto_reboot_on_link_down  = true
;--------------------------------------------------------

[enb_1]
enb_type                 = FLEXI

;--------------------------------------------------------

[ip_configuration]
workstation_ip_addr      = 192.168.200.126
netmask                  = 255.255.255.0
lte_network_gw           = 10.0.2.1
ss_ip_addr_pool          = 185.4.0.0/16

;--------------------------------------------------------

[ctrl_1]
sectors                  = 1,2,3,4
ip_addr                  = 192.168.200.1
trsw_ip                  = 10.0.2.2
;sync_source              = BackplanePPS
mirroring_l2_on_startup  = 2
mirroring_sch_on_startup = 2
syslog_port  		 = 51601
syslog_mode 		 = 1
syslog_ip   		 = 192.168.200.126

;--------------------------------------------------------

[sector_1]
enb                      = 1
antennas                 = 1:0:TxRx, 1:1:TxRx, 1:2:TxRx, 1:3:TxRx

[sector_2]
enb                      = 1
antennas                 = 1:0:TxRx, 1:1:TxRx, 1:2:TxRx, 1:3:TxRx

[sector_3]
enb                      = 1
antennas                 = 1:0:TxRx, 1:1:TxRx, 1:2:TxRx, 1:3:TxRx
mplane_only              = true

[sector_4]
enb                      = 1
antennas                 = 1:0:TxRx, 1:1:TxRx, 1:2:TxRx, 1:3:TxRx
mplane_only              = true

;--------------------------------------------------------

[radio_1]
rmod_type                = ORAN
links                    = 1.1:1:25
link_type                = ECPRI
nc_snapshot_file    	 = nok_axegha_b1_b3_b7_v12_0_0.xml
oran_version        	 = 12.0.0
oran_features       	 = PRACH-STATIC-CONFIGURATION-SUPPORTED: on, CONFIGURABLE-FS-OFFSET: on

;--------------------------------------------------------

[tgr_1]
ip_addr                  = 10.0.2.101
etgr                     = on
ss_interface             = eth101
side                     = SS
user                     = root
password                 = cussim
update_cmd               = sudo /opt/cus/var/update/update.sh
restart_cmd              = sudo /etc/init.d/cus-tgr restart

[tgr_2]
ip_addr                  = 10.0.2.100
etgr                     = on
etgr_ip_addr             = 10.0.2.102
ue_interface             = eth100
side                     = MS
user                     = root
password                 = cussim
update_cmd               = sudo /opt/cus/var/update/update.sh
restart_cmd              = sudo /etc/init.d/cus-tgr restart

;--------------------------------------------------------
