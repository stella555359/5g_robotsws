[enb_1]
enb_type = FLEXI

;------------------------------------------------------------

[ip_configuration]
workstation_ip_addr         = 192.168.200.126
netmask                     = 255.255.255.0
lte_network_gw              = 10.0.2.1
ss_ip_addr_pool             = 185.4.0.0/16

;------------------------------------------------------------
;-------------------CUS 1------------------------------------
;------------------------------------------------------------

[ctrl_1]
sectors                     = 1,2,3,11,12,13,21,22,23
ip_addr                     = 192.168.200.1
trsw_ip                     = 10.0.2.2
syslog_port                 = 51601
syslog_mode                 = 1
syslog_ip                   = 192.168.200.126
ethernet_tunnel_link	    = 1.1

;------------------------------------------------------------

[sector_1]
enb       = 1
antennas  = 1:0:TxRx, 1:1:Rx

[sector_2]
enb       = 1
antennas  = 1:2:TxRx, 1:3:Rx

[sector_3]
enb       = 1
antennas  = 2:0:TxRx, 2:1:Rx

[sector_11]
enb       = 1
antennas  = 3:0:Rx, 3:1:TxRx
ul_comp_cells	= 12

[sector_12]
enb       = 1
antennas  = 3:2:TxRx, 3:3:Rx
ul_comp_cells	= 11

[sector_13]
enb       = 1
antennas  = 4:0:TxRx, 4:1:Rx

[sector_21]
enb       = 1
antennas  = 3:0:Rx, 3:1:TxRx
mplane_only = true
ul_comp_cells	= 22,23

[sector_22]
enb       = 1
antennas  = 3:2:TxRx, 3:3:Rx
mplane_only = true
ul_comp_cells	= 21,23

[sector_23]
enb       = 1
antennas  = 4:0:TxRx, 4:1:Rx
mplane_only = true
ul_comp_cells	= 21,22

