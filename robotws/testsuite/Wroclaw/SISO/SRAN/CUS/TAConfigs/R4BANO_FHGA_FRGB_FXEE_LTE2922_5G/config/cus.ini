[executor]
log_level                   = DEBUG
log_global_file_name        = log_global.txt
log_dir                     = /home/cus/logs
ue_config_url               = file:///home/ute/MN/UTE/robotws/testsuite/Wroclaw/SISO/SRAN/CUS/resources/config/ue.db
ue_capabilities_url         = file:///home/ute/MN/UTE/robotws/testsuite/Wroclaw/SISO/SRAN/CUS/resources/config/uecap.ini
duplex_mode                 = FDD
hardware_platform           = FSMR4
enb_type                    = FLEXI
syslog_disable              = on
restart_on_enb_reset        = on

;------------------------------------------------------------

[enb_1]
enb_type = FLEXI

;------------------------------------------------------------

[ip_configuration]
workstation_ip_addr         = 192.168.200.126
netmask                     = 255.255.255.0
lte_network_gw              = 10.0.2.1
ss_ip_addr_pool             = 185.4.0.0/16

;------------------------------------------------------------

[ctrl_1]
sectors                     = 1,2,3,4,5,6,7,8,9
ip_addr                     = 192.168.200.1
trsw_ip                     = 10.0.2.2
syslog_port                 = 51601
syslog_mode                 = 1
syslog_ip                   = 192.168.200.126
connector                   = EIF5
sync_source		    = BackplanePPS

;------------------------------------------------------------

[sector_1]
enb                         = 1
antennas                    = 1:0:TxRx, 1:1:TxRx

[sector_2]
enb                         = 1
antennas                    = 2:0:TxRx, 2:1:TxRx

[sector_3]
enb                         = 1
antennas                    = 3:0:TxRx, 3:1:TxRx

[sector_4]
enb                         = 1
antennas                    = 4:0:TxRx, 5:0:TxRx

[sector_5]
enb                         = 1
antennas                    = 4:2:TxRx, 5:2:TxRx

[sector_6]
