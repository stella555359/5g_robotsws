UE_POOLS:
    AndroidUePool:
        inline_config:
            8d2161d3:                                    # UE name - change if you want
                CAPABILITIES:                             # Capabilities that UE has. (as a list)
                    - 8d2161d3

                CLASS: AndroidUe                          # UE type is Android so AndroidUe class will be used
                CONSTRUCTOR_PARAMETERS:                   # Parameters that will be passed to AndroidUe constructor when Ue instance is created.
                    serial_number: '8d2161d3'           # UE serial number (can be obtained via 'adb devices' command on the UE PC)
                    configuration:                        # By Default ue key ('UE_FOR_TA' for this ue) is passed to constructor as a name
                        ue_pc_ip: '10.44.129.83'           # UE PC IP address
                        pyro_port: '9091'                 # TCP Port number on UE PC on which Pyro server will be started
                        login: 'sranwro3'                     # SSH login to UE PC
                        password: 'Borsuk66!'              # SSH password to UE PC
                        server_dir: 'C:/pyro_server/'      # UE PC directory where all server files will be copied
                        server_python: 'C:/Python27/python.exe'     # UE PC python location
                        voice_call_dialing_timeout: '30'  # Timeout for dialing (calling) state
                        network_mode_switch_method: 'adb' # available values: adb, xposed. In case of adb - no rooting and xposed installation required
                        data_transfer:
                             iperf_interval: '3'         # Application Server (for Iperf) details
                             app_servers:
                                 FTP_2:
                                     host: '10.9.146.30'
                                     user: 'ftpuser'
                                     password: '99ftpuser'
                                 FTP_1:
                                     host: '10.44.44.172'
                                     user: 'syslab'
                                     password: 'system'

