variants:
  - name: "{LABEL}"
    default: true
    maintainer: "{AUTHOR}"
    nodes:
      - node_id: 1
        files:
          - file_type: "scf"
            file_path: "node1.xml"
            hw_type: "sm"
            hw_id: 1
          - file_type: "swconfig"
            file_path: "swconfig.txt"
            hw_type: "sm"
            hw_id: 1
        timeouts:
          wait_for_on_air:
            - timeout: 7200
              hw_type: "sm"
              hw_id: 1
      - node_id: 2
        files:
          - file_type: "swconfig"
            file_path: "swconfig_secondary.txt"
            hw_type: "sm"
            hw_id: 1
        timeouts:
          wait_for_on_air:
            - timeout: 7200
              hw_type: "sm"
              hw_id: 1
    fullracks:
      - master:
          node_id: 1
        slave:
          node_id: 2