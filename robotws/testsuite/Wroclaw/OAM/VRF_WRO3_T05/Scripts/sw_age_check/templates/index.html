<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SW Age Check</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <form action="/run" method="post" class="trigger-form">
        <button type="submit" class="trigger-btn">
            Run SW Age Check
        </button>
    </form>
    <div class="notice">
        Retrieving results may take up to 3 minutes. Please wait and do not close this page.
    </div>
    <div class="last-refresh">
        Last refresh: {{ last_run }}
    </div>
    <div class="report-table">
        {{ html_content|safe }}
    </div>
</body>
</html>
