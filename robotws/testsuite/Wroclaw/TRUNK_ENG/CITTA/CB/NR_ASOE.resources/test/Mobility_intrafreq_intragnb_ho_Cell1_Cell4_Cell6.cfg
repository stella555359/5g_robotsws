ue_register ue_nr_capabilities=UE_CAP capability_file=./sa_capability.cfg registration_type=InitialRegistration
ue_pdu_session_setup pdu=1 nwslice=1 retries=5 request_type=initial-request
seq_delay 1
trf_data_start pdu=1 qfi=1 trf_id=1 dir=ul kbps=12
trf_data_start pdu=1 qfi=1 trf_id=1 dir=dl kbps=250 size=1350
seq_delay 20
seq_loop_start loop=1000
  ue_ho_nr meas_type=A3 tgt_phycell_id=53 tgt_cell_ssb_frequency=156510
  seq_delay 20
  ue_ho_nr meas_type=A3 tgt_phycell_id=55 tgt_cell_ssb_frequency=156510
  seq_delay 20
  ue_ho_nr meas_type=A3 tgt_phycell_id=50 tgt_cell_ssb_frequency=634080
  seq_delay 20
seq_loop_end
trf_data_stop
ue_pdu_session_release pdu=1 by=ue
seq_delay 1
ue_deregister by=ue ue_deregister_type=switch_off
seq_end
