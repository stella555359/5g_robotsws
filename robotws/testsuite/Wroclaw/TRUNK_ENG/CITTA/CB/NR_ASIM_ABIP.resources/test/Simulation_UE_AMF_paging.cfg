ue_register ue_nr_capabilities=UE_CAP capability_file=./capability.cfg registration_type=InitialRegistration
ue_pdu_session_setup pdu=1 nwslice=1 retries=5 request_type=initial-request
seq_delay 1
trf_data_start pdu=1 qfi=1 trf_id=1 dir=dl bps=72 size=42
seq_delay 50
ue_ng_ctx_release by=amf cause=NAS_normal_release
seq_delay 8
seq_loop_start loop=3000
	amf_paging_start id=1-3
	seq_delay 2
	ue_ng_ctx_release by=amf cause=NAS_normal_release
	seq_delay 2
seq_loop_end
ue_pdu_session_release pdu=1 by=ue
seq_delay 1
ue_deregister by=ue ue_deregister_type=normal
seq_end
