ue_register ue_nr_capabilities=UE_CAP capability_file=./capability.cfg registration_type=InitialRegistration
ue_pdu_session_setup pdu=1 nwslice=1 retries=5 request_type=initial-request
seq_delay 2
seq_loop_start loop=3000
  trf_data_start pdu=1 qfi=1 trf_id=1 dir=dl period_ms=1500 burst=1 size=42 seconds=1
  trf_data_stop
  seq_delay 12
  ue_im_exit
seq_loop_end
ue_pdu_session_release pdu=1 by=ue
seq_delay 1
ue_deregister by=ue ue_deregister_type=switch_off
seq_end
