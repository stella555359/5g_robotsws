ue_register ue_nr_capabilities=UE_CAP capability_file=./capability.cfg registration_type=InitialRegistration
ue_pdu_session_setup pdu=1 nwslice=1 retries=5 request_type=initial-request
seq_delay 1
seq_loop_start loop=10
  ue_pdu_session_modify pdu=1 qosflows_to_add=2
  seq_delay 1
  ue_pdu_session_modify pdu=1 qosflows_to_add=3
  seq_delay 1
  trf_data_start pdu=1 qfi=1 trf_id=1 dir=ul kbps=12
  trf_data_start pdu=1 qfi=1 trf_id=1 dir=dl kbps=12
  seq_delay 1
  trf_data_start pdu=1 qfi=2 trf_id=1 dir=ul kbps=12
  trf_data_start pdu=1 qfi=2 trf_id=1 dir=dl kbps=12
  seq_delay 1
  trf_data_start pdu=1 qfi=3 trf_id=1 dir=ul rtp_codec=amr_wb_23_85
  trf_data_start pdu=1 qfi=3 trf_id=1 dir=dl rtp_codec=amr_wb_23_85
  seq_delay 120
  trf_data_stop
  seq_delay 1
  ue_pdu_session_modify pdu=1 qosflows_to_del=2
  seq_delay 1
  ue_pdu_session_modify pdu=1 qosflows_to_del=3
  seq_delay 1
seq_loop_end
ue_pdu_session_release pdu=1 by=ue
seq_delay 1
ue_deregister by=ue ue_deregister_type=switch_off
seq_end
