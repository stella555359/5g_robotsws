#---------------------------------------------------------------------------------------------------
#VARIABLES
#---------------------------------------------------------------------------------------------------
set CONTAINER_IP="10.0.2.1"
set DAEMON_IP=$CONTAINER_IP
set SERVER_IP=$CONTAINER_IP
set DAEMON_PORT=22222
set GNB_NG_ADDR="10.0.1.2"
set PROXY_SERVER_IP="10.0.2.80"
set AMF_NG_ADDR="10.0.1.1"
set UEC_ADDR="72.22.0.1"
set UPF_ADDR="1.2.4.1"

set EDAEMON_PORT="22222"


## Variables for NSA configuration

set ENB1_S1_ADDR="10.0.1.136"
set GNB_S1U_ADDR="10.0.1.112"

set ENB1_X2_ADDR="10.0.1.137"
set GNB_X2_ADDR="10.0.1.2"

set MME1_S1_ADDR="10.0.1.131"

set SERVER_ADDR="10.0.1.132"
set SGW_S1U_ADDR="10.0.1.133"
set SGW_S11_ADDR="10.0.1.134"

set ENB_X2U_ADDR="10.0.1.135"
set PGW_ADDR="4.7.254.207"

set PROXY_SERVER_IP="10.0.2.80"
set PDN_IP="4.7.254.208"

#---------------------------------------------------------------------------------------------------
#ENB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_enb id=1 plmn=311:489 s1=$ENB1_S1_ADDR enb_id_macro=0x00001 daemon=$DAEMON_IP:$DAEMON_PORT x2=$ENB1_X2_ADDR x2u=$ENB_X2U_ADDR type=simulated x2_peers=none xp_management=on xp=$ENB1_X2_ADDR:32742 xpu=$ENB1_X2_ADDR:32742
enb_param id=1 drb_id_begin=3 endc_capable_qci=9
#setcellid3 enb=1 eci=0x0000101 pci=3:2 tac=222 proxy=$DAEMON_IP:12219|$DAEMON_IP:8889 earfcn=68787:133323  mandatory_for_activation=off bw=10MHz
#Adaptation done with AY Lecoq to let NR and LTE complient see https://www.sqimway.com/nr_band.php
set_cell id=1 enb=1 eci=0x0000101 pci=3:2 tac=222 proxy=$DAEMON_IP:12219|$DAEMON_IP:8889 earfcn=68636:133172  mandatory_for_activation=off bw=10MHz
enb_endc_param id=1 control_flow_period=3gpp1 use_nr_ran_cont=on


#---------------------------------------------------------------------------------------------------
#EPC CONFIGURATION
#---------------------------------------------------------------------------------------------------
mme_pool_area id=1 mmegi=1 plmn=311:489 tac_list=777,111,222,444,333,200
set_mme id=1 ip=$DAEMON_IP:$DAEMON_PORT s1=$MME1_S1_ADDR:36412 supported_rat=lte,nblte pool=1:1
set_sgw id=1 ip=$DAEMON_IP:$DAEMON_PORT s1u=$SGW_S1U_ADDR s11=$SGW_S11_ADDR:60100 s5u_snd_buff_size=8M s5u_rcv_buff_size=8M s1u_snd_buff_size=8M s1u_rcv_buff_size=8M gtpu_read_packets_threshold=10
set_pgw id=1 type=simulated ip=$DAEMON_IP:$DAEMON_PORT addr=$PGW_ADDR/16 apn=lteapn1.com.mnc69.mcc450.gprs devtype=tun devname=tunLTEA13

#---------------------------------------------------------------------------------------------------
#5GCN CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_amf_region id=1 tac_list=7627107,100,788,200,0 plmn=311:489
set_amf id=1 daemon=$SERVER_IP:$EDAEMON_PORT ng=$AMF_NG_ADDR:38412 region=1 set_id=2 pointer=2
amf_param id=1 full_nas_auth=on
set_upf id=1 daemon=$SERVER_IP:$EDAEMON_PORT type=simulated addr=$UPF_ADDR/24 ngu=$AMF_NG_ADDR ngu_snd_buff_size=8M ngu_rcv_buff_size=8M ngu_read_packets_threshold=10

#---------------------------------------------------------------------------------------------------
#GNB CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_gnb id=2 type=external plmn=311:489 s1u=$GNB_S1U_ADDR x2=$GNB_X2_ADDR:36422 ng=$GNB_NG_ADDR gnb_id=0x02 daemon=$SERVER_IP:$EDAEMON_PORT x2_peers=none amf=1 plmnList=311:489 nssai=0x1:0xd143a5 xp_management=on xp=$GNB_X2_ADDR:32742 xpu=$GNB_X2_ADDR:32742

set_cell id=1 gnb=2 pci=16:2 tac=200 nrci=0x01 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=518580:518580 gscn=6432 mandatory_for_activation=off
set_cell id=2 gnb=2 pci=17:0 tac=200 nrci=0x02 tdd_cell=on proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=633364:633364 gscn=7848 mandatory_for_activation=off
set_cell id=3 gnb=2 pci=17:1 tac=200 nrci=0x03 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=133600:124400 gscn=1555 mandatory_for_activation=off
set_cell id=4 gnb=2 pci=17:2 tac=200 nrci=0x04 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=137600:128400 gscn=1602 mandatory_for_activation=off
set_cell id=5 gnb=2 pci=18:0 tac=200 nrci=0x05 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=376500:392500 gscn=4904 mandatory_for_activation=off
set_cell id=6 gnb=2 pci=18:1 tac=200 nrci=0x06 tdd_cell=off proxy=$PROXY_SERVER_IP:9999|$PROXY_SERVER_IP:8888 nr_arfcn=353000:433000 gscn=5411 mandatory_for_activation=off

#---------------------------------------------------------------------------------------------------

#---------------------------------------------------------------------------------------------------
#UEC CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_uec id=1 daemon=$SERVER_IP:$EDAEMON_PORT peer=$SERVER_IP:2152 retries=unlimited gtpu=off pdn=1 devtype=tun devname=tunUEC addr=72.22.0.1/26 proxy_snd_buf_size=8388608 proxy_rcv_buf_size=8388608

#---------------------------------------------------------------------------------------------------
#UE CONFIGURATION
#---------------------------------------------------------------------------------------------------

#UE Id=1 SA NO_CA_UE
set_ue simulated id=1 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645400 mode=nr enb=2 cell=1
ue_param id=1 ue_nr_

#UE Id=2 SA NO_CA_UE
set_ue simulated id=2 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645401 mode=nr enb=2 cell=2
ue_param id=2 ue_nr_

#UE Id=3 SA CA_UE
set_ue simulated id=3 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645402 mode=nr enb=2 cell=3
# bandes41-71 + 71-71 + 66-71 . Prehcekc 002 chat Radwanska, Agnieszka (Nokia - PL/Wroclaw).(NON TC03)
ue_param id=3 ue_nr_ 

#UE Id=4 SA NO_CA_UE
set_ue simulated id=4 uec=1 release=15 idle_edrx_cycle_len=2 ptw=2.56 opc_key=0ED47545168EAFE2C39C075829A7B61F nia=null+zuc nea=null+zuc sec_key=0102030405060708090A0B0C0D0EFF00 suci=0:311:489:0000:0:0:021645404 mode=nr enb=2 cell=4
ue_param id=4 ue_nr_


#---------------------------------------------------------------------------------------------------
#COMMON CONFIGURATION
#---------------------------------------------------------------------------------------------------
set_qosflow id=1 5qi=6 default=on

# add for 5Qi-5 & 5Qi-1 support for VoNR
set_qosflow id=2 5qi=5
set_qosflow id=3 5qi=1
set_qosrule id=1 proto=tcp qos_flow=2
set_qosrule id=2 proto=udp qos_flow=3
nwslice_set id=1 qos_flows=1,2,3 qos_rules=1,2 snssai=0x01:0xD143A5 default=on ue=all amf=1

set_pdu_gateway id=1 ue_nat_ip=72.23.0.1 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=2 ue_nat_ip=72.23.0.2 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=3 ue_nat_ip=72.23.0.3 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP
set_pdu_gateway id=4 ue_nat_ip=72.23.0.4 dl_nat_gw=$SERVER_IP ul_nat_gw=$SERVER_IP

#---------------------------------------------------------------------------------------------------
#OTHER CONFIGURATION
#---------------------------------------------------------------------------------------------------

uec_param id=1 reordering_window_size=1000 reordering_timer=200

#---------------------------------------------------------------------------------------------------
debug_log level=4
sim_debug_log level=4 mme=1
sim_debug_log level=4 uec=1
sim_debug_log level=4 pgw=1
sim_debug_log level=4 sgw=1
link_ctrl_param use_hb=off
trace uec=1 protocol=rrc on
trace uec=1 protocol=nr_rrc on
trace enb=1 protocol=x2 on
trace uec=1 protocol=x2 on
sim_trace uec=1 protocol=nr_rrc on
sim_trace amf=1 protocol=ng on
cfg_end

set_log log_to_file=on
sim_start version_check=off
