lsu_uu:
    type: ue.prisma.lsu
    executor: tl.ues[0].lsu_uu_ssh_connection_details
    script_paths:
        start_lsu: cd /home/user/scripts;./lsu_start.sh
        clean_lsu: lsuclean
        stop_lsu: lsustop
        create_5g_cell: /home/user/scripts/ASOD_cell.sh
        create_4g_cell: /home/user/scripts/lte_cell.sh
        get_4g_cell_id: trcinfo -p0-11 | grep 'DN_ADJ_FREQ_OFF lteCellId=' | cut -d '=' -f3 | tail -1
        get_5g_cell_id: trcinfo -p0-3 | grep -i cell_id |tail -1 | cut -d '=' -f2
        get_ra_status: trcinfo -p0-5 | grep -i contention


tstm_uu:
    type: ue.prisma.tstm
    executor: tl.ues[0].tstm_uu_ssh_connection_details
    script_paths:
        start_tstm: cd /home/user/scripts;  nohup ./tsm.cfg > ./nohup_uu.out 2>&1 &
        #start_tstm: cd /home/user/tstm_scripts/ ; nohup ./start_nr5g_Uu_ms_GUI >./nohup_uu.out 2>&1 &
        get_tstm_log: cd /home/user/scripts; tail -n 1000 -f ./nohup_uu.out
        clean_tstm_log: cd /home/user/scripts; cat /dev/null > ./nohup_uu.out
        stop_tstm: ps -ef | grep tm | grep -v 'grep' | awk '{print $2}' | xargs kill -9

airmosaic:
    type: ue.prisma.airmosaic
    executor: tl.ues[0].airmosaic_ssh_connection_details
    harness: tl.ues[0].airmosaic_harness_connection_details
    #cli_path: /home/ute/airmosaic_lteuu/bin/airmosaic_lteuu
    #cygwin_path: C:/cygwin64
    script_paths:
        start_mosaic: ^/home/ute/airmosaic_23_0_0/airmosaic_lteuu/bin/airmosaic_lteuu --nogui --nosplash -J-Dcli.mode=true --enable-harness
    scenario_paths:
        attach: UL_1796-D.sce
        detach: scenario.sce
    parameters:
        enable_amm: true
        clock_timer: 900
        counters:
        log_counters_to_file:
        global_vars:

prisma:
   type: ue.prisma
   components:
     - lsu_uu
     - tstm_uu
     - airmosaic
